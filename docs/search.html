<script id="guide-data" type="application/json">[{"id":1,"qid":"Q01","section":"营养","chapter":"日常饮食","question":"刚开始规律运动，平时一日三餐需要怎么调整？","title":"刚开始规律运动，先把三餐吃齐、搭齐","fields":[["怎么做","先看看一日三餐缺哪类食物。早餐可以从主食、鸡蛋或豆制品，再配一份水果开始。午晚餐留出主食，搭配蔬菜和鱼、禽、蛋、瘦肉或豆制品。把奶类和水果安排到自己方便吃的时候。跑量或训练时间明显变了，再看饭量是否需要调整。"],["成本","大多可以用常吃的食物。先改最容易漏的一顿，比如出门前备好馒头和鸡蛋，或给午餐多选一道蔬菜。"],["说人话","刚开始练，先把平时吃的几顿搭好。最容易漏的一顿，往往也是最容易着手的一顿。"],["收益","中国营养学会建议，膳食每天覆盖谷薯、蔬果、畜禽鱼蛋奶和豆类，并规律进餐。用这些类别检查一日三餐，能看出平时是缺了一类食物，还是只需调整份量。"],["证据等级","C（按中国居民膳食指南安排一般成年人的饮食）。"],["适用与备注","适合刚开始规律运动的普通成年人。训练日与休息日怎么调整，见[混合训练日的饭量](04-training-nutrition.md#q08)。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则一和准则六的三餐安排部分。 [食物多样](https://dg.cnsoc.org/article/04/K7tlcs-UQh67DBC5XY1Jqw.html) · [规律进餐](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html)"]],"path":"book/03-everyday-nutrition.md","aliases":"","grades":["C"]},{"id":2,"qid":"Q02","section":"营养","chapter":"日常饮食","question":"想维持体重，怎么判断最近吃得够不够？","title":"想维持体重，先看几周的趋势","fields":[["怎么做","如果称重对你有帮助，可每周选一个方便的早晨，在起床后、吃喝前，用同一台秤记录。连续看几周，同时简单记下训练、饭量或加餐有没有变化。如果体重持续往一个方向走，而你想维持体重，先检查最近有什么改变，再调整自己能持续做到的一项。"],["成本","用家里已有的秤和手机备忘录即可。每周记一次是一种做法，选自己能持续的频率。"],["说人话","先看几周，再决定要不要改饭量。训练突然变多时，也把跑量和加餐一起看。"],["收益","中国营养学会把一段时期内的体重变化作为判断能量平衡的简便指标。美国疾控中心的体重维持指导也用定期记录来发现趋势。体重趋势只能回答体重是否稳定，训练恢复和饮食质量还需另外看。"],["证据等级","C（用体重趋势和简短记录辅助判断，依据公共卫生指导）。"],["适用与备注","适合体重维持是本人目标、称重不会造成困扰的成年人。若体重稳定，但训练后越来越难恢复，或出现持续疲劳、月经明显变化，可参考[长期能量不足的评估线索](06-training-health.md#q37)。"],["来源","中国营养学会准则二，实践应用（一）和控制体重部分。美国疾控中心《Tips for Keeping Weight Off》的饮食、活动和体重监测段。 [中国居民膳食指南](https://dg.cnsoc.org/article/04/k9W2iu8FT6K5oWaQKArU9g.html) · [美国疾控中心体重维持指导](https://www.cdc.gov/healthy-weight-growth/losing-weight/keeping-it-off.html)"]],"path":"book/03-everyday-nutrition.md","aliases":"","grades":["C"]},{"id":3,"qid":"Q03","section":"营养","chapter":"日常饮食","question":"不称食物，怎么估算一顿饭的蛋白质？","title":"用包装份量和个数估一顿饭的蛋白质","fields":[["怎么做","包装食品看营养成分表里蛋白质的克数。每 100 克或毫升标示的，用实际吃的量除以 100，再乘标示值。按份标示的，先看每份大小，再乘吃了几份。没有标签的食物，可以按个数估去壳、去骨后的重量，再查对应食物和生熟状态的成分。"],["成本","花几分钟查常吃的食物。举例，假设 250 毫升牛奶的标签是 3.2 克/100 毫升，整盒是 8 克。一个去壳后约 50 克的水煮蛋，加约 6 克。"],["说人话","平时常吃的几样食物，记住一份大概有多少克，下一次就能直接相加。"],["收益","加拿大卫生部的食物成分表给出一枚 50 克水煮蛋约 6 克蛋白质。以上牛奶用假设标签演算，两样小计约 14 克。主食和其他菜另算。"],["证据等级","标签和食物成分数据可以直接核查，估算精度取决于份量和产品。"],["适用与备注","适合估日常吃了多少。换品牌就重看标签。外食分量不清楚时，用大致范围即可。想估每天的摄入目标，见[抗阻训练蛋白质](04-training-nutrition.md#q11)。"],["来源","国家卫健委 GB 28050-2011 问答第 43 问及 GB 28050-2025 问答的份量标示部分。两版均允许按每 100 克、每 100 毫升或每份标示。2025 版自 2027 年 3 月 16 日实施。水煮蛋数据见加拿大卫生部常见食物营养表第 7 表。 [2011 版标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml) · [2025 版标签问答](https://www.nhc.gov.cn/sps/c100087/202509/470fa4ff5de14dd38619223cce9da4e7.shtml) · [水煮蛋营养表](https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/nutrient-data/table-7-eggs-egg-dishes-nutrient-value-some-common-foods-2008.html)"]],"path":"book/03-everyday-nutrition.md","aliases":"","grades":[]},{"id":4,"qid":"Q04","section":"营养","chapter":"日常饮食","question":"经常吃食堂或点外卖，怎么搭出一顿适合训练日的饭？","title":"在食堂或点外卖，先凑齐主食、蛋白质菜和蔬菜","fields":[["怎么做","看菜单时先找三样。主食可以选米饭、面或薯类，蛋白质菜可以选鱼、鸡肉、鸡蛋或豆腐，再配一道蔬菜。比如一份米饭、豆腐和青菜。点盖饭时，如果配菜很少，可以补一份青菜。水果可随餐吃，也可在当天别的时候补上。"],["成本","先用现有套餐换配菜，需要时再加点。额外花多少钱，按自己食堂或外卖菜单算。"],["说人话","看外卖有没有少一样。主食和肉已经有了，蔬菜少，就优先补蔬菜。"],["收益","中国居民平衡膳食餐盘把谷薯、蔬菜、水果，以及鱼肉蛋和大豆制品等列作一餐的基本组成。把餐盘用在外食上，能看见套餐还缺哪类食物，并按自己的饭量搭配。"],["证据等级","C（把中国居民平衡膳食餐盘用于点餐）。"],["适用与备注","适合日常训练日。份量按自己全天饮食和训练调整。容易在比赛前出现肠胃不适的跑者，赛前一餐见[比赛早餐](05-distance-running-nutrition.md#q26)。"],["来源","中国营养学会《中国居民平衡膳食餐盘（2022）修订和解析》及准则六中午、晚餐的实践建议。 [中国居民平衡膳食餐盘](https://dg.cnsoc.org/article/04/ya2PbmF0S_CNY0z_Vd9HGQ.html) · [三餐实践建议](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html)"]],"path":"book/03-everyday-nutrition.md","aliases":"","grades":["C"]},{"id":5,"qid":"Q05","section":"营养","chapter":"日常饮食","question":"吃素或不喝奶，日常能从哪些食物补足蛋白质？","title":"吃素或不喝奶，把豆制品或其他蛋白质食物安排进正餐","fields":[["怎么做","如果只是不喝奶，可以从鱼、肉、蛋或豆制品里选自己吃的。如果吃素，可以把豆腐、豆干、毛豆或其他豆类安排成一道菜，能吃鸡蛋的人也可把蛋算进去。喝豆浆或植物饮料时，按包装核对蛋白质含量。"],["成本","用豆腐、豆干、豆类等常买得到的食材，先替换一两道常吃的菜。买包装食品多花一点时间看标签。"],["说人话","吃素也可以把蛋白质吃够。点餐时，记得选一道真正有豆类、豆制品或鸡蛋的菜。"],["收益","中国居民平衡膳食餐盘把大豆及其制品列作一餐的蛋白质来源。美国营养与饮食学会的成人立场认为，妥善规划的素食和纯素饮食可以满足非孕、非哺乳成年人的营养需要。不同豆制品的蛋白质含量有差异，份量按具体产品和食物成分估算。"],["证据等级","C（食物替换和素食安排依据专业指南和立场）。"],["适用与备注","如果长期完全不吃动物性食物，还要安排可靠的维生素 B12 来源，例如强化食品或补充剂。可请营养专业人员核对整体饮食。 [估算每餐蛋白质](#q03)"],["来源","中国营养学会平衡膳食餐盘。美国营养与饮食学会成人素食立场及勘误。美国国立卫生研究院膳食补充剂办公室维生素 B12 专业资料的素食人群部分。 [中国居民平衡膳食餐盘](https://dg.cnsoc.org/article/04/ya2PbmF0S_CNY0z_Vd9HGQ.html) · [成人素食专业立场](https://pubmed.ncbi.nlm.nih.gov/39923894/) · [勘误](https://pubmed.ncbi.nlm.nih.gov/41474402/) · [维生素 B12 资料](https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/)"]],"path":"book/03-everyday-nutrition.md","aliases":"","grades":["C"]},{"id":6,"qid":"Q06","section":"营养","chapter":"训练饮食与补剂","question":"早起或下班练，来不及吃正餐，练前怎么安排？","title":"来不及吃正餐，练前先试一份熟悉的小加餐","fields":[["怎么做","离训练还有两三小时，可以吃一顿平时能消化的饭。早起或下班训练，离上一顿很久时，可以在开练前约一小时试一份香蕉、吐司或少量馒头。时间更紧就把份量缩小，练完再吃正餐。"],["成本","用家里已有的食物试一两次。下班训练可以提前带上。"],["说人话","离开练越近，先把份量缩小。选平时吃了舒服的东西。"],["收益","能提前找到自己吃得下、练起来也舒服的安排。较长或较吃力的训练也能提前补一点碳水。"],["证据等级","C（美国反兴奋剂机构的指南给持续至少一小时的运动提供了赛前 2–4 小时吃正餐、前 30–60 分钟补小加餐的参考。日常训练按上一餐、训练量和个人耐受试）。"],["适用与备注","刚吃过饭、只做短时轻松运动时，可照常练。容易胃不舒服时先试小份、低脂、纤维较少的食物。比赛见 [赛前早餐](05-distance-running-nutrition.md#q26)。"],["来源","美国反兴奋剂机构《TrueSport Nutrition Guide》第 9–10 页的赛前餐和加餐示例。维多利亚州卫生部门运动营养说明的赛前餐部分。 [TrueSport 运动营养指南](https://www.usada.org/wp-content/uploads/2026-TS-Nutrition-Guide.pdf) · [维多利亚州运动营养说明](https://www.betterhealth.vic.gov.au/health/healthyliving/sporting-performance-and-food)"]],"path":"book/04-training-nutrition.md","aliases":"晚上健身 晚上练 晚练 下班训练 先吃还是先练","grades":["C"]},{"id":7,"qid":"Q07","section":"营养","chapter":"日常饮食","question":"日常运动带白水就够了吗，什么情况下才需要运动饮料？","title":"日常短练带白水，长时间或高强度运动再考虑运动饮料","fields":[["怎么做","天气温和、运动不到一小时且强度普通时，先带白水。运动更久、强度高或天气热时，结合自己出汗和补充碳水的需要，考虑用运动饮料。挑选时看标签上的碳水和钠，确认它能补到你需要的东西。"],["成本","白水通常方便且成本低。举例，一瓶 500 毫升饮料如果每 100 毫升有 6 克碳水，喝完整瓶是 30 克。算碳水时按实际喝到的量。"],["说人话","短练带水通常就够。跑得久、练得猛或天热，再看自己是否也需要补碳水或盐分。"],["收益","美国国家运动防护师协会的立场认为，不到一小时的运动通常白水就够。更长的训练或含高强度间歇的训练，尤其在极端环境下，补充碳水或电解质可能有帮助。约一小时是判断场景的参考，强度、天气和个体出汗情况也会改变选择。"],["证据等级","C（饮料选择主要依据补水立场和运动营养联合立场）。"],["适用与备注","适合普通成年运动者。运动饮料同样计入饮水量，长跑时避免喝得超过需要。比赛水站怎么选，见[赛道上的水和运动饮料](05-distance-running-nutrition.md#q30)。"],["来源","美国国家运动防护师协会补水立场的运动中补水部分。美国运动医学会等三机构运动营养联合立场表 1。 [补水立场原文](https://pmc.ncbi.nlm.nih.gov/articles/PMC5634236/) · [运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/03-everyday-nutrition.md","aliases":"","grades":["C"]},{"id":8,"qid":"Q08","section":"营养","chapter":"训练饮食与补剂","question":"一周既跑步又练力量，长跑日、力量日和休息日的饭量怎么调？","title":"长跑日按跑量加主食，力量日和休息日按实际负荷调","fields":[["怎么做","保留平日的正餐和蛋白质来源。长跑日可在训练前后加些主食或水果，份量随跑步时间、强度和食欲调整。普通力量日可先按平时吃，同一天还要跑或训练量明显增加时再调。休息日照常吃饭，按食欲和次日的训练安排调整主食与加餐。"],["成本","先调整一两样常吃的食物。例如周末跑得久，早餐多一份吐司，跑完午餐多盛些米饭。"],["说人话","周末长跑可以多吃些主食。休息日也照常吃饭，给下一次训练留够体力。"],["收益","能把碳水留给需要供能的重点训练，也能把训练后的补充安排进正餐。"],["证据等级","C（三机构联合立场按运动时长和强度调整碳水，支持在重点训练前后安排碳水。份量和食物为执行示例）。"],["适用与备注","同一天又跑又练力量时，把两次训练一起考虑。若正在减重且持续疲劳、表现下降，见 [长期吃不够的评估线索](06-training-health.md#q37)。"],["来源","三机构运动营养联合立场表 1「每日燃料需求」与「Protein Needs」。 [美国运动医学会等三机构联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["C"]},{"id":9,"qid":"Q09","section":"运动","chapter":"抗阻训练","question":"刚开始练力量，每周练几次，居家徒手和去健身房怎么选？","title":"每周至少两次练主要肌群，居家也能开始","fields":[["怎么做","先在一周里留出两次训练时间，练到腿、髋、背、胸、肩、手臂和躯干。可以从居家徒手和弹力带开始，也可以用健身房器械。初学时选能控制动作的负荷，熟悉动作后再逐步提高难度。"],["成本","要固定留出训练时间。徒手练可以利用现有空间，弹力带、器械或健身房的费用按自己的选择算。"],["说人话","每周能稳定安排两次，就可以着手练力量。弹力带和居家练习也能让人变强。"],["收益","美国运动医学会 2026 年立场综合了 137 篇系统综述。与不训练相比，多种抗阻训练方式能提高健康成年人的肌力。其结果表也列出弹力带和居家训练带来的肌力改善。"],["证据等级","A（抗阻训练可以提高肌力）。C（每周至少两次、练到主要肌群是学会给健康成人的执行建议）。"],["适用与备注","给想开始练力量的健康成年人。选能做稳的动作，随着熟练度提高，再加负荷或改用更有挑战的动作。"],["来源","美国运动医学会 2026 年立场的摘要、表 6 和讨论，以及面向公众的配图。 [立场全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [学会官方图解](https://acsm.org/effective-resistance-training-program-infographic/)"]],"path":"book/01-resistance-training.md","aliases":"","grades":["A","C"]},{"id":10,"qid":"Q10","section":"营养","chapter":"训练饮食与补剂","question":"减脂时还在练力量，怎么安排饮食以尽量保住肌肉？","title":"减脂时保留抗阻训练和蛋白质，先从小幅减量做起","fields":[["怎么做","保留规律的抗阻训练和正餐里的鱼、肉、蛋、奶或豆制品。先找一项方便减量的东西，比如常喝的含糖饮料或份量偏大的零食。记录每周体重趋势和几个常练动作的重量或次数。如果近期吃得越来越少，训练也持续下滑，先复盘减量幅度。"],["成本","用原有训练计划和几条简单记录即可。调整食物份量的花费取决于原来的饮食。"],["说人话","减脂时继续练力量，饭里的蛋白质也留着。体重掉得快又一直练不动，就看看是不是减得太多。"],["收益","在超重或肥胖成人的减重试验中，饮食减量加抗阻训练平均比只做饮食减量保留更多去脂体重。该指标包括肌肉、水分等成分。"],["证据等级","A（Binmahfoz 等综述中，18 项试验进入去脂体重分析，标准化均差 0.40，95% 置信区间 0.18–0.61。原综述评为中等确定性）。B（Murphy 和 Koehler 的荟萃回归提示，较大热量缺口可能不利于瘦体重增加）。"],["适用与备注","直接的减重证据来自超重或肥胖成人。慢性肾病患者先与医生或肾病营养师确认蛋白质目标。若出现持续疲劳、月经变化或反复伤病，见 [能量不足相关条目](06-training-health.md#q37)。"],["来源","Binmahfoz 等 2025 年图 5 和证据确定性评估，Murphy 与 Koehler 2022 年结果第 3.5 节，三机构联合立场「Protein Needs」，KDIGO 2024 年指南第 3.3.1 节。 [减重与抗阻训练综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC12406911/) · [热量缺口荟萃回归](https://onlinelibrary.wiley.com/doi/full/10.1111/sms.14075) · [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf) · [KDIGO 肾病指南](https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["A","B"]},{"id":11,"qid":"Q11","section":"营养","chapter":"训练饮食与补剂","question":"普通成年人练力量，一天需要吃多少蛋白质？","title":"练力量想增肌，可用每日约 1.6 克/公斤估算总蛋白质","fields":[["怎么做","规律做抗阻训练、以增肌为目标且没有刻意限制热量时，可用体重（公斤）× 1.6 估算每日总蛋白质。70 公斤约为 112 克，正餐、加餐、饮品和补剂都计入。先估平常吃多少，再用鱼、肉、蛋、奶或豆制品补日常差额。"],["成本","花几分钟估算几顿常吃的饭。需要加量时，成本取决于离目标差多少和选什么食物。"],["说人话","练力量时，如果平时蛋白质吃得不够，补一点平均有小幅收益。可以先用体重估一天的总量，把正餐和加餐都算进去。"],["收益","Morton 等共纳入 49 项随机试验、1,863 名健康成年人。去脂体重的合并分析显示，在同样进行抗阻训练的情况下，额外补充蛋白质的组平均多增加 **0.30 公斤去脂体重**（95% 置信区间 0.09–0.52 公斤）。去脂体重包括肌肉、水分和其他非脂肪成分。"],["证据等级","A（训练期间增加蛋白质，平均有小幅收益。Nunes 等对瘦体重结果评为中等确定性）。B（约 1.6 克/公斤是估算起点）。Morton 等估出的拐点是每日 1.62 克/公斤，95% 置信区间为 1.03–2.20 克/公斤，分段模型未达到统计显著性（p = 0.079）。美国运动医学会等三机构给运动人群的总蛋白质参考范围为每日 1.2–2.0 克/公斤。两篇综述对平均收益的把握高于对单一摄入量的把握。"],["适用与备注","Morton 等纳入的是每周至少练两次、持续至少六周、没有限制能量摄入的健康成年人。慢性肾病患者应先和医生或肾病营养师确认自己的摄入目标。"],["来源","Morton 等 2018 年，纳入标准、图 3、表 1 与图 5。Nunes 等 2022 年，表 2。两篇综述有共同作者，均披露了与食品或补剂行业有关的利益关系。美国运动医学会、美国营养与饮食学会和加拿大营养师协会联合立场的蛋白质章节。KDIGO 2024 年指南第 3.3.1 节。 [Morton 等原文](https://pmc.ncbi.nlm.nih.gov/articles/PMC5867436/) · [Morton 等勘误补充的披露](https://bjsm.bmj.com/content/54/19/e7) · [Nunes 等原文](https://pmc.ncbi.nlm.nih.gov/articles/PMC8978023/) · [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf) · [KDIGO 肾病指南](https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["A","B"]},{"id":12,"qid":"Q12","section":"营养","chapter":"训练饮食与补剂","question":"每餐都要吃蛋白质吗，一顿吃多了会浪费吗？","title":"先看全天蛋白质，再把它分到几顿吃","fields":[["怎么做","按 [全天总蛋白质](#q11) 估算平时吃多少。若早餐和午餐经常只有主食，可以把一部分晚餐的蛋白质挪过来，例如早餐加奶或鸡蛋，午餐加豆腐或鱼肉。平常吃两顿正餐的人，可以在方便时加一份含蛋白质的加餐。"],["成本","先重新分配平时买的食物。全天仍吃不够时再补食材。"],["说人话","午饭吃得少，晚饭多吃些仍能计入全天。分几顿吃，通常更容易把一天的量吃够。"],["收益","让各餐都能安排蛋白质来源。一项在健康年轻男性中做的短期试验比较了训练后一次摄入 25 克和 100 克乳蛋白，较大一份的消化吸收过程更长，部分肌肉蛋白合成指标也更高。"],["证据等级","C（把总量分到几顿是三机构联合立场支持的实用安排）。B（单餐大量蛋白质仍可被消化利用的证据来自短期试验。对长期增肌而言，哪种分法更好仍有不确定性）。"],["适用与备注","试验只观察一次进食后的反应。100 克是试验剂量，日常每顿的量按全天需要、食物和耐受安排。"],["来源","三机构联合立场的蛋白质章节，Trommelen 等 2023 年结果的「Muscle protein synthesis」和图 4，Jespersen 与 Agergaard 2021 年餐次分配系统综述。 [运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf) · [单餐蛋白质试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC10772463/) · [餐次分配综述](https://pubmed.ncbi.nlm.nih.gov/33550490/)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["B","C"]},{"id":13,"qid":"Q13","section":"营养","chapter":"训练饮食与补剂","question":"练完半小时内必须吃东西吗，回家吃正餐来得及吗？","title":"练后能回家吃饭，就把蛋白质放进那顿饭","fields":[["怎么做","练前吃过含蛋白质的正餐，练后回家也能在一两小时内吃饭，就照原来的饭点。若空腹练、上一顿隔了很久，或下次正餐还要等很久，可以带牛奶、酸奶或其他方便保存的蛋白质食物。"],["成本","回家吃饭按平常花费。需要带加餐时，用自己平时就吃的食物即可。"],["说人话","练完半小时可以正常收拾回家。上一顿隔得久、下一顿也晚，提前带点吃的更方便。"],["收益","更容易把蛋白质安排进全天饮食。直接比较训练前后补充的试验，合并后未发现瘦体重有明确差别。"],["证据等级","B（Casuso 和 Goossens 的系统综述共纳入 5 项研究。瘦体重结果的证据确定性有限，比较的时点大多靠近训练）。C（按三机构联合立场，用下一顿正餐或方便的加餐安排摄入）。"],["适用与备注","适用于一般抗阻训练。当天还安排了另一场较吃力的耐力训练时，两次训练之间也要考虑补碳水。"],["来源","Casuso 和 Goossens 2025 年表 2、瘦体重结果与补充表 S2，三机构联合立场的蛋白质摄入时机章节。 [蛋白质时机系统综述](https://www.mdpi.com/2072-6643/17/13/2070) · [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/04-training-nutrition.md","aliases":"晚上健身 晚上练 晚练 夜跑后 练完还吃吗 练完回家吃饭 下班练完还要吃吗 下班练完还要吃晚饭吗","grades":["B","C"]},{"id":14,"qid":"Q14","section":"营养","chapter":"训练饮食与补剂","question":"练力量要多吃主食吗，一次普通力量训练中途需要补碳水吗？","title":"普通力量训练先吃好正餐，训练中按需要再补碳水","fields":[["怎么做","平常照常吃米饭、面、薯类等主食。吃过饭再练、训练量和平时差不多时，带白水即可。若空腹、训练时间长且组数多，或当天还安排第二练，可先试训练前吃一份主食或水果。需要时再试训练中少量补碳水。"],["成本","日常训练先用白水和已有的正餐。需要试加餐时，可用现有食物。"],["说人话","吃过饭，照平时练，先带水。练得格外久、组数多或一天练两次，才更值得试训练补给。"],["收益","部分长时间、高训练量或空腹场景的研究中，练前或练中补碳水可以增加当次完成的训练量。普通训练中，额外补充的收益较不一致。"],["证据等级","B（Henselmans 等对已进食、每个肌群最多约 10 组的训练总体未见一致优势。King 等合并分析在较长训练中更容易观察到收益，同时纳入练前和练中补充）。"],["适用与备注","这里讨论抗阻训练，组数和时长用于判断场景。当天还有较长跑步时，按那次跑步的时长和强度另做安排。"],["来源","Henselmans 等 2022 年第 4.1 节与结论，King 等 2022 年第 3.4 节、图 2 和表 4。 [抗阻训练碳水系统综述](https://www.mdpi.com/2072-6643/14/4/856) · [练前或练中补碳水的荟萃分析](https://link.springer.com/content/pdf/10.1007/s40279-022-01716-w.pdf)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["B"]},{"id":15,"qid":"Q15","section":"运动","chapter":"抗阻训练","question":"用固定动作练了一阵，怎么判断该加次数还是加重量？","title":"用同一重量把次数练稳，再小幅加重","fields":[["怎么做","给一个熟悉的动作设个次数范围，每次记下重量、各组次数和大概还能做几次。比如设成每组 8–12 次。如果还没到上限，下次可用同一重量多做一次。连续两次训练都能让各组做到 12 次，动作依然稳定，组末大约还能做两三次，可以换最小一档重量，再从范围下端做起。加重后如果连下限也做不到，先回到原重量。"],["成本","每次训练顺手记几项。器械的档位跨得大时，可以先在原重量下增加次数。"],["说人话","先看同一重量下能不能多做几次。到上限还能做稳，再加一点重量。加重后次数暂时变少很正常。"],["收益","一项为期 8 周的研究将 43 名有至少一年下肢抗阻训练经验的成年人随机分组，分别加重量或加次数。38 人完成研究并纳入分析。两组的史密斯机深蹲最大重量和腿屈伸次数都有改善，多数测量结果的组间差异很小。美国运动医学会 2026 年立场也把增加负荷或增加训练量列为逐步提高刺激的办法。"],["证据等级","B（短期随机试验直接比较两种做法，但只研究了已有训练经验者的下肢动作）。C（8–12 次、连续两次做稳后加一档，是本文给出的记录和加重示例）。"],["适用与备注","适合已经能稳定完成该动作的健康成年人。不同动作可以用不同的次数范围。组末留两三次余力是对用力程度的估计，不用特意做到力竭来验证。"],["来源","Plotkin 等 2022 年随机试验的方法、结果和局限，以及美国运动医学会 2026 年立场的讨论部分。 [随机试验原文](https://pmc.ncbi.nlm.nih.gov/articles/PMC9528903/) · [ACSM 立场全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/01-resistance-training.md","aliases":"","grades":["B","C"]},{"id":16,"qid":"Q16","section":"营养","chapter":"训练饮食与补剂","question":"蛋白粉什么时候值得买，怎么跟鸡蛋、牛奶和豆制品比价格？","title":"正餐难补足时再考虑蛋白粉，买前算每 20 克蛋白质的价格","fields":[["怎么做","先估算平时还差多少。经常出差、用餐受限或准备食物麻烦时，可以比较蛋白粉、牛奶、鸡蛋和豆制品。每 20 克蛋白质成本 = 实付价格 ÷ 整包所含蛋白质克数 × 20。按标签的每 100 克、每 100 毫升或每份换算整包蛋白质。散装鸡蛋用可食部分的重量和对应的蛋白质含量估算。"],["成本","以假设值演算。100 元买 500 克蛋白粉，标签写每 100 克含 80 克蛋白质，每 20 克花 **5 元**。6 元买 500 毫升牛奶，标签写每 100 毫升含 3.2 克，折合 **7.50 元**。4 元买 400 克豆腐，标签写每 100 克含 8 克，折合 **2.50 元**。实际还可考虑准备时间、保存和携带。"],["说人话","蛋白粉可以买来填日常差额。先算花同样的钱能买到多少蛋白质，再考虑省不省准备时间。"],["收益","用同一个单位比价，能看清买蛋白粉主要是为了省钱，还是为了省准备时间。正餐也能同时提供其他营养。蛋白粉可以用于填一时难从食物补足的差额。"],["证据等级","C（把蛋白粉当作补足缺口的便利选择，依据澳大利亚体育学院指导和国际奥委会共识）。各自含多少蛋白质和花多少钱，按实际标签和成交价计算。"],["适用与备注","20 克是比价单位，实际补多少看每天的差额。乳清来自牛奶，牛奶蛋白过敏者应避开乳清。比价只比较所含蛋白质的重量。"],["来源","澳大利亚体育学院分离蛋白补剂使用说明及国际奥委会补剂共识表 2 支持使用场景。营养标签单位和乳清过敏原分别参照中国国家卫健委发布的营养标签标准和美国 FDA 指南。 [澳大利亚体育学院补剂说明](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/isolated-protein-supplement2/how-and-when-do-i-use-it) · [IOC 补剂共识](https://doi.org/10.1136/bjsports-2018-099027) · [预包装食品营养标签通则](https://www.nhc.gov.cn/zwgk/cybz/201306/17e7d74af39c4b279d8ef26c4a6a6a04.shtml) · [FDA 食物过敏原指南](https://www.fda.gov/media/117410/download)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["C"]},{"id":17,"qid":"Q17","section":"营养","chapter":"训练饮食与补剂","question":"普通力量训练者有必要买肌酸吗？开始吃后体重涨了怎么看？","title":"肌酸可按需选一水合肌酸，刚开始体重涨先看水分","fields":[["怎么做","已经规律练力量、希望试一种补剂时，可以比较配料简单的一水合肌酸。澳大利亚体育学院给出的做法之一是每天 3–5 克，直接从维持量开始。记录开始日期、体重趋势和几个常练动作的表现。"],["成本","按每日份量比价。假设一罐 300 克卖 90 元，每天用 3 克可用约 100 天，约 0.90 元/天。"],["说人话","肌酸可选。刚开始体重涨了可能有水分变化，可以继续看体重趋势和训练表现。"],["收益","与安慰剂相比，肌酸配合抗阻训练在卧推或推胸等项目中平均有小幅力量收益。补充初期的体重上升可能包含额外水分，快速补充时尤其明显。"],["证据等级","A（抗阻训练力量结果有试验荟萃分析支持）。C（每天 3–5 克、可直接从维持量开始，依据澳大利亚体育学院说明。水分变化参照 IOC 共识）。"],["适用与备注","适用于健康成人。已有肾病者先与医生确认。抽血测肾功能时可告知医生正在用肌酸，便于解释肌酐结果。"],["来源","澳大利亚体育学院肌酸使用说明中维持量和直接从维持量开始的部分，IOC 补剂共识表 3 的肌酸项目，2025 年肌酸荟萃分析「Bench and Chest Press」结果，以及肌酐研究的汇总。 [澳大利亚体育学院](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/performance-supplements2/creatine/how-and-when-do-i-use-it) · [IOC 补剂共识](https://stillmed.olympics.com/media/Documents/Athletes/Medical-Scientific/Consensus-Statements/2018_dietary-supplements-high-performance-athlete.pdf) · [力量和功率荟萃分析](https://www.mdpi.com/2072-6643/17/17/2748) · [肌酸与肾功能综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC12590749/)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["A","C"]},{"id":18,"qid":"Q18","section":"营养","chapter":"训练饮食与补剂","question":"蛋白质已经吃够，BCAA 还值得买吗？","title":"全天蛋白质吃够了，BCAA 可以先省下","fields":[["怎么做","先回顾一天的蛋白质总量和食物来源。如果已经吃够、食物也多样，想增肌或练力量时可以先不买 BCAA。若总量不足，先用日常食物或合适的蛋白质补充品填差额。"],["成本","省下一项补剂开支。需要提高总量时，可以按 [每 20 克蛋白质比价](#q16) 看合适的来源。"],["说人话","BCAA 只有三种氨基酸，平时吃的蛋白质已经能提供它们。"],["收益","把预算优先用在满足全天摄入。蛋白质充足时，额外吃 BCAA 能否带来更多肌肉或力量，研究结果不一致。"],["证据等级","B（美国国立卫生研究院膳食补充剂办公室总结了数量有限、结果不一致的研究。短期蛋白质合成或酸痛变化无法直接回答长期增肌问题）。"],["适用与备注","这里讨论普通健康成人自行购买的补剂。植物性饮食也可以用多种食物搭配提供必需氨基酸。"],["来源","美国国立卫生研究院膳食补充剂办公室专业资料的「Branched-chain amino acids」和「Protein」章节。 [运动补剂专业资料](https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["B"]},{"id":19,"qid":"Q19","section":"营养","chapter":"训练饮食与补剂","question":"想长肌肉就要先多吃、增重吗？吃不下时，增肌粉和普通加餐怎么选？","title":"想增肌先把训练练稳，需要加餐时再比较增肌粉","fields":[["怎么做","先稳定练力量，吃够蛋白质，跟踪几周的体重和训练记录。若想增重、体重却持续没变，可以加一份容易吃下的食物，比如酸奶配燕麦，或豆浆配面包。用增肌粉时，按实际冲泡份量比较能量、蛋白质、价格和便利性。"],["成本","先用已有食材试加餐。算粉的每份价格时，把冲泡用的奶或豆浆也计入。"],["说人话","想增肌可以先练好、吃够。需要多吃一点时，选自己吃得下、用得上的加餐。"],["收益","加餐能补上吃不够的部分。Helms 等一项 8 周试验中，体重涨得更快的人往往皮褶厚度也增加更多，肌肉厚度的差异不一致。"],["证据等级","B（Helms 等试验有 17 名训练者完成，实际摄入未拉开原计划的两种盈余）。C（IOC 把液体补充品列为摄入受限时增加能量的便利选项）。"],["适用与备注","普通成人可用几周趋势判断摄入调整后的变化。增肌粉的配方、份量和价格差异大，按实际标签比较。"],["来源","Helms 等 2023 年方法、图 1、图 3 与讨论，IOC 补剂共识表 2「Liquid meal supplement」。 [不同能量盈余试验](https://link.springer.com/article/10.1186/s40798-023-00651-y) · [IOC 补剂共识](https://stillmed.olympics.com/media/Documents/Athletes/Medical-Scientific/Consensus-Statements/2018_dietary-supplements-high-performance-athlete.pdf)"]],"path":"book/04-training-nutrition.md","aliases":"","grades":["B","C"]},{"id":20,"qid":"Q20","section":"营养","chapter":"训练饮食与补剂","question":"晚上练力量，训练前喝咖啡或含咖啡因的氮泵怎么考虑睡眠？","title":"晚上练力量，先看咖啡因剂量和距离睡觉的时间","fields":[["怎么做","把咖啡、茶、能量饮料和训练前补剂的咖啡因合在一起算。晚上才开练、已经容易睡不着时，可先试不用含咖啡因的训练前补剂。咖啡可以挪到白天，或选低咖啡因的饮品。看标签时记下每份多少毫克和自己用了几份。"],["成本","用几次相似的训练观察入睡时间、夜间醒来的情况和次日精神。也可省下晚间补剂的开支。"],["说人话","晚练也要顾及睡眠。咖啡和氮泵里如果都含咖啡因，两份都算。"],["收益","减少晚间咖啡因可以少一项睡眠干扰。一项 23 名男性的交叉试验中，睡前 4 小时一次摄入 400 毫克，与安慰剂相比客观总睡眠时间估计少约 51 分钟。"],["证据等级","A（系统综述支持咖啡因可缩短睡眠时间）。B（具体剂量和时间的影响随人而异，400 毫克来自小样本试验。试验的 100 毫克组未测到明显差异，个体仍可有反应）。"],["适用与备注","适用于普通成年人的晚间训练。咖啡的咖啡因含量随冲泡和杯量变化，含量不明的混合补剂难以准确合计。400 毫克是该试验一次摄入的剂量。关于单次和全天摄入，可查看[咖啡因安全参考](05-distance-running-nutrition.md#q34)。"],["来源","Gardiner 等 2023 年睡眠系统综述结果，Gardiner 等 2025 年交叉试验「Objective sleep」和图 3，美国 FDA 咖啡因含量与标签说明。 [咖啡因与睡眠系统综述](https://eprints.leedsbeckett.ac.uk/id/eprint/9625/1/TheEffectOfCaffeineOnSubsequentSleepASystematicReviewAndMetaanalysisPV-WEAKLEY.pdf) · [剂量和时间交叉试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC11985402/) · [FDA 咖啡因说明](https://www.fda.gov/consumers/consumer-updates/spilling-beans-how-much-caffeine-too-much)"]],"path":"book/04-training-nutrition.md","aliases":"晚上健身 晚上练 晚练 喝咖啡睡不着 晚练咖啡因 氮泵","grades":["A","B"]},{"id":21,"qid":"Q21","section":"营养","chapter":"长跑营养","question":"首半马怎么按预计完赛时间决定带不带胶、用不用赛道饮料？","title":"首半马按预计完赛时间备补给，长跑时先试","fields":[["怎么做","先估计完赛用时，再查当届赛道提供哪些饮料和食物。预计跑约 2 小时的人，可以用世界田联对持续 1–2.5 小时运动给出的 **每小时 30–60 克碳水**作参考，在长跑时从自己能耐受的量和吃法开始试。能量胶、含糖运动饮料和其他食物中的碳水合在一起算。"],["成本","用已有的长跑训练试吃。举例，假设目标约 2 小时，训练时已经试过每次 20 克碳水，在约第 30、60、90 分钟各吃一份，赛中合计 60 克，平均 30 克/小时。若只用每包 6 元、含 20 克碳水的胶，三包共 18 元。如果赛道饮料也提供碳水，把预计能喝到的量计进去。"],["说人话","跑得久，途中可以补一些碳水。先在长跑时试吃，就知道自己能带什么、吃多少舒服。"],["收益","提前知道需要带多少、途中在哪里能补，也能在训练中发现哪些食物会让自己反胃。合并 136 项研究的综述发现，运动中摄入碳水总体有利于耐力表现。研究采用了多种运动和测试，首半马的完赛用时还取决于配速、耐受和比赛条件。"],["证据等级","B（用共识范围给首半马做参考，并在训练中试吃）。在一项 11 名女性业余跑者的随机交叉试验中，同一批跑者喝含碳水的运动饮料时，21 公里跑台计时的平均用时比喝无热量安慰饮料时短。另一项 18 名训练水平较高的跑者试验，未发现能量胶显著缩短半马用时。一项 25 人试验发现，反复练习赛中进食可改善部分胃肠不适。三次各 20 克是排法示例。"],["适用与备注","按预计用时、强度和胃肠反应调整，优先选训练中试过的做法。跑得更久也要考虑配速和耐受。饮水可按口渴或训练中估出的个人需求调整，避免过量。 饮水过量和需要呼救的信号，见[长跑饮水安全](06-training-health.md#q39)。"],["来源","世界田联 2019 年共识表 3，Herring 等 2024 年大众赛事共识表 2（沿用 2016 年三机构联合立场），Ramos-Campo 等 2024 年耐力表现综述表 2，Gui 等 2017 年图 2，Burke 等 2005 年半马能量胶试验，Costa 等 2017 年跑步试验。饮水参照荒野医学会运动相关低钠血症指南的预防章节。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [大众赛事医学共识](https://doi.org/10.1249/MSS.0000000000003325) · [耐力表现综述](https://pubmed.ncbi.nlm.nih.gov/37449467/) · [21 公里业余跑者试验](https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0185982) · [半马能量胶试验](https://pubmed.ncbi.nlm.nih.gov/16521844/) · [胃肠耐受试验](https://pubmed.ncbi.nlm.nih.gov/28177715/) · [运动相关低钠血症指南](https://journals.sagepub.com/doi/full/10.1016/j.wem.2019.11.003)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["B"]},{"id":22,"qid":"Q22","section":"营养","chapter":"长跑营养","question":"首全马怎么根据预计配速和补给站位置排出一份比赛补给表？","title":"首全马把试过的补给方案写到具体站点","fields":[["怎么做","把当届赛事的补给站列成「公里数、预计到站时间、可取物品、自己带什么」。按训练试过的用量安排碳水，把需要配水的胶放在能取水的位置。提前写好赛道缺货或错过一站时还能用什么。训练时用计划中的产品练习。"],["成本","花时间查手册和试吃，自带部分按实付价算。假设完赛 **4 小时 30 分**，训练时已用过 **40 克/小时**，可把全程预算估为 **180 克**。平均约 **6 分 24 秒/公里**，5 公里约 32 分钟，10 公里约 64 分钟。如果前 80 分钟还没有熟悉的赛道补给，且能在这两站取到水，可把两包各含 25 克的熟悉补给安排在这两处，约 50 克。余下 130 克再按后段站点和已试过的产品分配。根据自己用时和当届站点重算。"],["说人话","把补给写到具体站点，起跑前就能看出哪一段要自带，以及到哪一站能配水。"],["收益","起跑前就能发现哪段有补给空档、需要自带多少、到哪一站能配水。"],["证据等级","C（按站点排表是根据世界田联建议拟出的执行方法。共识建议在训练中练习，并结合个人需求和赛道条件调整）。"],["适用与备注","给已在长跑训练中试过补给的首全马跑者。站点位置与品种以当届公告为准，赛道发放的产品也应提前试过。饮水按口渴或训练中估出的个人需求调整，水站提供的是取水机会。 饮水过量和需要呼救的信号，见[长跑饮水安全](06-training-health.md#q39)。"],["来源","世界田联共识表 3 和竞赛供能章节用于安排和演练。上海市体育局赛前公告用于展示赛道供应信息。饮水参照荒野医学会运动相关低钠血症指南的预防章节。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [上海马拉松赛道资料示例](https://tyj.sh.gov.cn/gzdt2/20251125/211fd0e3baff438589adb8e77cd567ea.html) · [运动相关低钠血症指南](https://journals.sagepub.com/doi/full/10.1016/j.wem.2019.11.003)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":23,"qid":"Q23","section":"运动","chapter":"有氧训练","question":"平时只跑五公里，怎么判断自己可以开始准备首半马？","title":"准备首半马前，拿最近跑量对照计划第一周","fields":[["怎么做","回看最近几周一周跑几次、总共跑多远、最长一次跑多远。拿这三项对照想用的半马计划第一周。如果现在只是偶尔跑一次五公里，先建立能重复的跑步安排，再挑第一周与目前基础接近的计划。"],["成本","主要花时间回看记录和建立跑步习惯。波士顿田径协会的首半马计划共 12 周。第 1 周跑 4 次，总共 11–14 英里（约 18–23 公里），最长一次 5 英里（约 8 公里）。"],["说人话","选计划前先看看最难接上的是什么，是每周要多跑几天，还是最长的那一跑要加太多。"],["收益","用三项数据对照，可以找出你目前的安排与计划之间的差距。首周里程和总周数是官方示例的安排，用来比较起点。"],["证据等级","C（官方训练计划作为排法示例，配合近期跑量选起点属于执行建议）。"],["适用与备注","适合已经能跑五公里、想准备首半马的成年人。选计划时把赛前可用的周数也算进去。课表怎么排，见[半马专项训练](distance-running/03-half-marathon.md#q150)。比赛当天怎么吃喝，见[首半马补给](05-distance-running-nutrition.md#q21)。"],["来源","波士顿田径协会半马训练 Level One，第 1 周和第 12 周。 [首半马训练计划](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/02-distance-running.md","aliases":"首半马怎么准备 第一次半马 选课表 备赛起点","grades":["C"],"basis":"课表示例"},{"id":24,"qid":"Q24","section":"营养","chapter":"长跑营养","question":"首全马怎样用长距离训练试跑比赛当天的早餐、胶和饮料？","title":"首全马用已有的长跑训练演练早餐、胶和饮料","fields":[["怎么做","挑一次训练表里已有的长跑，尽量还原起跑时间、早餐间隔、携带方式和可取水的位置。记下早餐吃了什么、赛中第几分钟吃了多少碳水、喝了什么，以及哪里开始胃胀或反胃。遇到问题时，下次只改一项，比如先改每次进食份量。"],["成本","占用一次原有的长跑和几分钟记录，试用品按实际用量计。若计划起跑前 2.5 小时吃早餐，第 30 分钟吃第一份胶，训练也可按同样的时间差试。两处时间都只是待检验的个人计划。"],["说人话","比赛当天的早餐和补给，先在长跑里试一遍。哪里吃不下或拿不到水，提前发现。"],["收益","能把「准备吃什么」变成实际能带、能吃、能喝到的方案，还能分辨一次不舒服发生在早餐后、吃胶后，还是跑了一段时间后。"],["证据等级","C（世界田联建议训练中反复练习赛前餐和赛中补给，记录和一次改一项是执行方法）。"],["适用与备注","按已有训练时长和强度演练。赛事用品若提前拿不到，可以先试熟悉的备用补给。赛中站点安排见[全马补给表](#q22)，反复胃肠不适见[补给耐受](#q32)。"],["来源","Burke 等 2019 年世界田联长距离专项文件，赛前准备及赛中补给章节。 [世界田联长跑营养原文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":25,"qid":"Q25","section":"营养","chapter":"长跑营养","question":"半马也需要赛前增加碳水吗？全马赛前几天怎么安排主食？","title":"赛前几天按预计用时安排主食，长时间比赛再考虑碳水加载","fields":[["怎么做","赛前训练减量时，正餐保留熟悉的米饭、面条、面包等主食。预计比赛超过 90 分钟、重视表现且已在训练中试过的人，可考虑在赛前 36–48 小时增加碳水。比如每顿多添一点米饭或面条，中间加一份熟悉的面包。全马通常更有理由考虑加载，半马也看预计用时和吃后的舒适度。"],["成本","主要是买和准备食物，以及大份量带来的饱胀。按共识中的加载范围演算，70 公斤 × 每天每公斤 10–12 克，是每天 700–840 克碳水。这是竞技营养参考的量级，称的是食物所含的碳水，具体安排按可耐受的份量调整。"],["说人话","长比赛前可以把主食分散到几顿吃。赛前几天吃多少和比赛早上吃什么，是两个安排。"],["收益","碳水加载可提高肌糖原储备，为持续较久的耐力比赛多存一些燃料。耗时较短的比赛，通常以维持平时充足的碳水摄入为主。"],["证据等级","B（耐力训练者的系统综述支持增加碳水摄入有助于提高肌糖原储备。何时采用和剂量来自竞技营养指导，普通半马跑者的个体收益仍有不确定性）。"],["适用与备注","90 分钟是共识的安排分界，预计刚好在附近时按实际训练体验选择。世界田联专项表里的半马以高水平、常在 90 分钟内完赛的跑者为背景。若需按医疗方案管理血糖，按自己的方案调整。赛前早餐另见[早餐安排](#q26)。"],["来源","Burke 等 2019 年世界田联长距离专项文件表 2 和赛前准备章节。Herring 等 2024 年大众赛事医学共识表 2，碳水加载一行沿用 2016 年三机构联合立场。Jones 等 2026 年系统综述图 2 比较碳水摄入与肌糖原。 [世界田联长跑营养原文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers) · [大众赛事医学共识](https://doi.org/10.1249/MSS.0000000000003325) · [肌糖原系统综述](https://onlinelibrary.wiley.com/doi/full/10.1111/sms.70379)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["B"]},{"id":26,"qid":"Q26","section":"营养","chapter":"长跑营养","question":"早上很早发枪，赛前早餐几点吃、选什么？","title":"早起跑半马或全马，提前试好赛前早餐","fields":[["怎么做","从自己预计过起点的时间往回倒推，用一次长跑试吃熟悉的碳水早餐，比如吐司配果酱。容易反胃的人，可以选少油、纤维较少的食物。根据试跑时的感受调整份量和时间。"],["成本","可用平时的早餐和已有长跑试。如果预计 7:00 过起点，可以先在训练中试提前 2.5 小时吃，比赛当天对应 4:30。这个钟点只是倒推示例。"],["说人话","提前吃点熟悉的主食能补充隔夜后可用的燃料。先试一次，比赛当天就知道哪种份量吃得下。"],["收益","世界田联针对半马和全马建议熟悉的赛前餐。美国运动医学会等三机构针对预计超过 60 分钟的运动，给出赛前 1–4 小时合计每公斤体重 1–4 克碳水的参考范围。进食时间、份量和品种要结合比赛安排与胃肠耐受。"],["证据等级","C（早餐安排依据世界田联和三机构的运动营养指导，具体时间和份量按训练体验调整）。"],["适用与备注","给早晨参赛的普通成年跑者。赛前留给进食的时间短，或大份吃了容易不舒服时，先在训练中试适合自己的份量。赛中碳水另做安排。"],["来源","世界田联 2019 年共识表 3。美国运动医学会、美国营养与饮食学会和加拿大营养师协会 2016 年联合立场表 1 的赛前补给一行及竞赛营养章节。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [三机构联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":27,"qid":"Q27","section":"营养","chapter":"长跑营养","question":"能量胶按时间还是按公里吃？慢一些完赛，补给计划怎么变？","title":"先按小时估碳水，再用公里数找适合补给的站","fields":[["怎么做","先用训练中试过的每小时碳水量估计全程要带多少，再用预计配速换算到站时间。吃胶需要配水时，挑能取水的站。如果实际比预计慢，按手表时间回看上次吃了多少，再看下一处取水机会。胶、饮料和软糖一起计入。"],["成本","做一次乘法和到站换算。比如已试过 40 克/小时，4 小时的估算总量是 160 克，5 小时是 200 克。同一个 5 公里间隔，在 6:00/公里和 7:00/公里时分别是 30 和 35 分钟。这里为了比较用时，假设每小时摄入相同。"],["说人话","手表告诉你离上次吃东西多久，公里牌告诉你离水站多远。两者一起用。"],["收益","完赛时间变长时，能发现原计划会在哪里用完，也能看出固定「每几公里一包」在配速变化后会让每小时摄入跟着变。"],["证据等级","C（专业指南按运动时长和每小时摄入给参考，用时钟和站点排程是据此做的换算）。"],["适用与备注","若强度、天气或胃口也变了，每小时摄入可按实际情况调整。补给站位置和产品按当届公告核对。"],["来源","澳大利亚体育学院能量胶说明表 1，Burke 等 2019 年世界田联长距离专项文件的赛中补给章节。 [澳大利亚体育学院能量胶说明](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-gels) · [世界田联长跑营养原文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":28,"qid":"Q28","section":"营养","chapter":"长跑营养","question":"能量胶、运动饮料、软糖和羊羹，怎么比好带、耐受和价格？","title":"用每 20 克碳水的价格比较胶、运动饮料、软糖和羊羹","fields":[["怎么做","先按标签算一包、一瓶或一块有多少碳水，再比较同量碳水的价格。胶好装入口袋，饮料能同时提供液体，软糖和羊羹要看跑动时是否好拿、好嚼或好吞。普通软糖、羊羹也可以选训练时吃得舒服的款式，按包装份量分装。"],["成本","每 20 克碳水的价格 = 实付价格 ÷ 对应份量的碳水克数 × 20。假设一包胶 6 元含 25 克，折合 4.80 元。一瓶饮料 5 元含 30 克，折合约 3.33 元。一小包软糖 3 元含 20 克，折合 3 元。一块羊羹 4.50 元含 30 克，也折合 3 元。实际用标签和成交价重算。"],["说人话","先把碳水克数算到一样多，再看哪种好带、吃得下。比赛用的可以是几样搭配。"],["收益","能看出多花的钱买到了多少便利，也能把口感、补水和携带重量计入选择。熟悉且耐受的替代品更容易提前准备。"],["证据等级","C（机构指导支持用多种食品提供碳水，价格比较和口袋测试属于执行方法）。"],["适用与备注","20 克是比价单位。每份的碳水、钠和咖啡因各自核对。运动饮料能提供多少液体，以及普通软糖和羊羹能否在跑动时吃下，分别在训练中试。"],["来源","澳大利亚体育学院运动食品说明中的能量胶、运动饮料和运动软糖，以及世界田联长距离专项文件的赛中补给章节。 [澳大利亚体育学院运动食品](https://www.ausport.gov.au/ais/nutrition/supplements/group_a) · [世界田联长跑营养原文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":29,"qid":"Q29","section":"营养","chapter":"长跑营养","question":"吃胶要不要配水，能不能和赛道运动饮料一起用？","title":"多数浓胶配白水，若搭配运动饮料就把碳水一起算","fields":[["怎么做","先看胶的包装说明。多数浓缩胶适合配水，少数标明可直接吃的等渗胶按自身说明使用。用运动饮料同时补碳水时，先在训练试过这两样的搭配。胃容易不舒服，可把浓胶留给能取白水的站，把含糖饮料安排在其他时段。"],["成本","算一遍这次进食的总碳水。假设胶含 25 克，运动饮料每 100 毫升含 6 克，喝 150 毫升是 9 克，两样合计 34 克。这是计算示例，配水量按产品说明、实际口渴和耐受调整。"],["说人话","胶和甜饮料都算进碳水。一次叠太多吃得不舒服，可以改成胶配白水，再分开喝运动饮料。"],["收益","能按产品浓度选搭配，提前发现同一站的碳水是否超出自己练过的份量。配水可降低浓缩胶和液体一起摄入时的碳水浓度。"],["证据等级","C（胶配水和产品例外依据澳大利亚体育学院产品使用指导）。"],["适用与备注","可直接吃的胶仍要另看全程的饮水需求。按标签和训练体验执行，避免为了每包胶强行多喝。 [饮水安排](#q30)"],["来源","澳大利亚体育学院能量胶说明的产品浓度、配水和等渗胶部分，以及运动饮料说明的产品差异部分。 [能量胶说明](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-gels) · [运动饮料说明](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-drink)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":30,"qid":"Q30","section":"营养","chapter":"长跑营养","question":"跑到水站该喝白水还是运动饮料，怎么预先安排？","title":"水站选白水还是运动饮料，先看是否还要补碳水","fields":[["怎么做","赛前查水和运动饮料分别在哪些站、饮料是否含碳水。已用胶或食物补够计划中的碳水，想喝水时可选白水。想同时喝水和补碳水，可选试过的含糖运动饮料，并把它计入补给表。把站点当作可取水的机会，按口渴和练过的饮水安排灵活取用。"],["成本","花几分钟查当届手册。假设运动饮料每 100 毫升含 6 克碳水，你实际喝了约 120 毫升，就计入约 7 克。纸杯标称容量可能和实际喝进去的量不同。"],["说人话","白水负责解渴。含糖运动饮料也补碳水，喝了多少就按多少算。"],["收益","能避免把赛道饮料漏算或重复计入，赛道上的产品换了也能据标签重排。"],["证据等级","C（饮料的用途和饮水原则来自专业机构指导，纸杯算例用于核算）。"],["适用与备注","电解质饮料可能含糖很少，碳水和钠分别看标签。白水和运动饮料都计入液体摄入，避免因为站点密集就站站喝。 [饮水过量与求助信号](06-training-health.md#q39)"],["来源","澳大利亚体育学院运动饮料说明中的配方和用途，荒野医学会运动相关低钠血症指南预防章节。 [澳大利亚体育学院运动饮料说明](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-drink) · [运动相关低钠血症指南](https://journals.sagepub.com/doi/full/10.1016/j.wem.2019.11.003)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":31,"qid":"Q31","section":"营养","chapter":"长跑营养","question":"热天跑半马或全马，怎么调整喝水和电解质安排，盐丸什么时候有用？","title":"热天重新估计饮水需求，盐丸只在明确需要补钠时考虑","fields":[["怎么做","赛前看气温、湿度、赛事预警和水站分布，按热天调配速和饮水计划。在可安全训练的相近天气试跑，记录口渴、实际喝水量和前后体重。有条件可多测几次。热天跑得久且出汗多、想补钠时，先看饮料、胶或食物已经含多少钠。若已明确需要额外补钠，训练中试过的盐丸是一种便于携带和计量的来源。"],["成本","用体重秤和有刻度的瓶估算，前后尽量穿同样的干衣称重。训练出汗量约为体重少掉的公斤数换算成升，加上喝掉的液体，再减去排尿量。比如训练 1 小时，跑后体重少 0.4 公斤，喝了 0.3 升且没排尿，粗估出汗约 0.7 升。0.7 升估的是该小时的出汗量。跑中可按口渴或训练估出的个人需求调整饮水，避免喝得超过需要。"],["说人话","天气变热时先调整跑法和取水安排。吃了盐丸也要避免喝过量。"],["收益","知道自己在相近条件下大概出多少汗，能提前检查取水是否方便，以及现有饮食和补给是否已经供钠。盐丸无法抵消喝水过量导致的运动相关低钠血症风险。"],["证据等级","C（热环境准备、估算汗率和防过量来自专业共识与指南。赛中额外补钠对一般跑者的收益尚无一致证据）。"],["适用与备注","按赛事高温预警调整参赛安排。既往因补水问题就医、或有医嘱限水限钠者，先向医生确认。跑中意识混乱、步态不稳或倒地，立即停止并找赛道医疗。 [饮水过量与求助信号](06-training-health.md#q39)"],["来源","国际奥委会热环境赛事共识的个体准备和补水章节，美国国家运动防护师协会补液立场表 2 的汗率公式和表 3 的算例，澳大利亚体育学院电解质补充说明的注意事项，荒野医学会运动相关低钠血症指南的预防和现场识别章节。 [IOC 热环境共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC9811094/) · [汗率公式和算例](https://pmc.ncbi.nlm.nih.gov/articles/PMC5634236/) · [电解质补充注意事项](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/electrolyte-supplement2/are-there-any-concerns-or-considerations) · [运动相关低钠血症指南](https://journals.sagepub.com/doi/full/10.1016/j.wem.2019.11.003)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":32,"qid":"Q32","section":"营养","chapter":"长跑营养","question":"长跑吃胶后反胃、肚子痛，怎么在训练中试出自己能耐受的补给？","title":"吃胶后反胃，先在长跑训练里一次改一项","fields":[["怎么做","记录反胃或肚子痛的时间、当时配速和天气、早餐、胶的份量，以及喝了什么。症状轻且已缓解，可在之后强度和天气相近的训练里先试较小单次份量，或先改成按标签配水。一次只改一项，找到能耐受的吃法后再重复练习。"],["成本","用已有长跑试验，花几分钟记录。比如先保持胶种类、时间和饮料相同，只把原本一次吃的一包分出较小一份。换份量后把实际吃进去的碳水重新计入。"],["说人话","一次把胶、早餐和配速都改掉，下一次舒服了也难知道是哪项起作用。"],["收益","在长跑训练中反复练习进食，部分跑者可改善胃肠不适。记录也能看出症状是否总在高强度、热天或某一种搭配下出现。"],["证据等级","B（2025 年专业联合立场和一项纳入 25 名耐力跑者、为期两周的小型随机试验支持练习进食或调整耐受方案，具体测试顺序为执行建议）。"],["适用与备注","反复出现或休息后仍持续的症状适合就医评估。突发剧烈腹痛、便血或呕血，应停止跑步并及时找赛道医疗或就医。"],["来源","澳大利亚运动营养师协会与超耐力运动科学基金会 2025 年联合立场的肠道训练章节，Costa 等 2017 年随机试验，美国国家医学图书馆腹痛就医指引。 [运动胃肠症状联合立场](https://doi.org/10.1007/s40279-025-02186-6) · [跑者随机试验](https://pubmed.ncbi.nlm.nih.gov/28177715/) · [腹痛就医指引](https://medlineplus.gov/ency/article/003120.htm)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["B"]},{"id":33,"qid":"Q33","section":"运动","chapter":"有氧训练","question":"跑完过半马，准备首全马时，每周跑量和周末长跑要怎么改？","title":"跑过半马要备战首全马，先看一周能稳定跑多少","fields":[["怎么做","等半马后恢复到平常的跑步节奏，再拿最近几周的频次、周跑量和最长一跑对照全马计划。挑第一周与你目前基础接近的方案，给平日短跑、较长的一跑和休息留出时间，赛前也把减量周排进去。"],["成本","主要成本是平日训练和长跑的时间。波士顿田径协会全马入门计划有 20 个训练周，平均每周跑 4 天。它的概览写峰值周约 40 英里（约 64 公里），最长训练约 16–18 英里（约 26–29 公里）。"],["说人话","选全马计划时，先看看起步跟不跟得上，再看看后面最忙的几周能不能排开。"],["收益","全马计划里的周跑量和长跑距离，可以用来估计时间投入。该协会的入门计划把准备、增加跑量和赛前减量放在不同阶段，具体距离随计划而变。"],["证据等级","C（官方训练计划用作结构和时间投入的示例）。"],["适用与备注","给已经跑过半马、平时保持跑步习惯的成年人。按自己能恢复的跑量和可用时间选计划。课表怎么排，见[全马专项训练](distance-running/04-marathon.md#q159)。赛道怎么安排吃喝，见[首全马补给](05-distance-running-nutrition.md#q22)。"],["来源","波士顿田径协会全马训练 Level One，概览、Week 1 和 Week 19–20。 [全马训练计划](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/02-distance-running.md","aliases":"","grades":["C"],"basis":"课表示例"},{"id":34,"qid":"Q34","section":"营养","chapter":"长跑营养","question":"咖啡和含咖啡因的能量胶能一起用吗，怎么核算当天摄入？","title":"咖啡和含咖啡因的胶一起用前，先把毫克数加起来","fields":[["怎么做","把赛前咖啡、赛中含咖啡因的胶和赛前后其他饮品、补剂的咖啡因按实际份量相加。咖啡量不明确时，向店家查杯型含量，或用自己熟悉且有含量信息的产品。先在训练里试一种，确认对胃、心跳和睡眠的影响，再决定是否搭配。"],["成本","花几分钟查含量。假设咖啡 90 毫克，两包胶各 40 毫克，赛前和赛中合计 170 毫克。当天若又喝 50 毫克的茶，则全日合计 220 毫克。两种小计都是核算示例，实际含量按标签或商家信息查。"],["说人话","咖啡和胶上的咖啡因要记在同一笔账里。含量拿不准，可用无咖啡因的胶简化安排。"],["收益","咖啡因可帮助部分人的耐力表现，个人收益和耐受有差别。先核算有助于发现短时间内叠加的量，也能把赛后睡眠考虑进去。"],["证据等级","B（运动营养立场支持咖啡因在耐力运动中的潜在收益。咖啡和胶如何组合按实际用量与个人耐受）。"],["适用与备注","欧洲食品安全局认为，一般健康非孕成人单次来自所有来源的摄入不超过 200 毫克、全天分散摄入不超过 400 毫克时，通常不引起安全担忧。EFSA 对单次不超过 200 毫克的判断也适用于常规环境下、摄入后不足两小时进行的剧烈运动。对咖啡因敏感、孕期、服药或有心律问题者，应按自己的医疗建议。试用后反胃或睡眠明显受影响，可停用。运动中出现心悸，先停止运动。心悸持续不缓解，或伴胸痛、气促、快要昏倒或昏厥时，立即找赛道医疗或呼叫急救。"],["来源","欧洲食品安全局咖啡因科学意见的成人安全摄入及运动条件，国际运动营养学会 2021 年咖啡因立场摘要，澳大利亚体育学院咖啡因食品与产品资料，美国食品药品监督管理局咖啡因说明的个体差异和不良反应部分。紧急求助信号参照英国国民医疗服务体系的心悸指引。 [EFSA 咖啡因安全意见](https://doi.org/10.2903/j.efsa.2015.4102) · [运动表现立场](https://doi.org/10.1186/s12970-020-00383-4) · [咖啡因来源与含量](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/performance-supplements2/caffeine/what-does-it-look-like) · [FDA 咖啡因说明](https://www.fda.gov/consumers/consumer-updates/spilling-beans-how-much-caffeine-too-much) · [心悸就医指引](https://www.nhs.uk/symptoms/heart-palpitations/)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["B"]},{"id":35,"qid":"Q35","section":"营养","chapter":"长跑营养","question":"半马、全马跑完第一顿怎么吃，赛后饮料或恢复粉值得买吗？","title":"半马或全马跑完，第一顿用熟悉的主食、蛋白质和饮水","fields":[["怎么做","能吃正餐时，安排一份主食、一份蛋白质食物和饮水，例如米饭配鸡肉或豆腐，再配汤或水。完赛后暂时没胃口、要赶车或正餐等得久，可以先吃能接受的小份，比如面包加酸奶，之后再补一顿饭。"],["成本","先看赛后能买到什么、离下一顿多远。恢复粉或饮料可节省准备时间，购买前看一份分别有多少碳水和蛋白质，以及是否还要另买食物。"],["说人话","赛后能正常吃饭，就用一顿饭补充主食和蛋白质。暂时吃不下，先吃得下的，再补正餐。"],["收益","碳水有助补回肌糖原，蛋白质支持肌肉修复，饮水帮助补回液体。赛后饮料或恢复粉主要提供携带方便、易于入口的选择。"],["证据等级","C（第一顿的搭配和何时选补剂按联合立场及体育机构的实践指导）。"],["适用与备注","适用于跑完后能逐步恢复吃喝的普通成年人。如果很快还有一次高消耗训练，见[两次训练之间怎么吃](#q36)。有持续呕吐或意识异常时先找医疗人员。 [赛后求助信号](06-training-health.md#q39)"],["来源","美国运动医学会等三机构运动营养联合立场的恢复营养章节，澳大利亚体育学院混合营养补充产品的使用场景及成本注意事项，荒野医学会低钠血症现场识别章节。 [三机构联合立场](https://www.andeal.org/files/files/Collaborations/Position_Athletic-Performance_2016March.pdf) · [澳大利亚体育学院恢复产品说明](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/mixed-macronutrient-supplement2) · [运动相关低钠血症指南](https://journals.sagepub.com/doi/full/10.1016/j.wem.2019.11.003)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["C"]},{"id":36,"qid":"Q36","section":"营养","chapter":"长跑营养","question":"长距离跑完第二天还有训练，怎么安排赛后到下一次训练之间的饮食？","title":"长跑后还要训练，按间隔和下次训练的强度安排进食","fields":[["怎么做","第二天是轻松跑或一般训练时，长跑后尽早吃一顿能耐受的饭，当天几顿正常吃主食和蛋白质，并按口渴补液。第二天一早还有强度或长距离时，可提前准备晚餐、必要的加餐和训练前早餐。若两次都很耗糖原、间隔不足 8 小时，专业立场建议在前 4 小时分次补碳水，随后回到当天的进食安排。"],["成本","提前备好食物，方便分次吃。以间隔不足 8 小时的情况演算，70 公斤 × 每公斤每小时 1–1.2 克，等于前 4 小时每小时约 70–84 克碳水。这个量级仅用于短间隔的快速恢复场景。"],["说人话","隔一晚通常有几顿饭能补。两次高消耗训练挨得很近，就提早准备能吃下的食物。"],["收益","短时间补碳水有助于加快肌糖原回补。间隔较长时，更容易靠几顿饭和加餐补足。糖原回补速度和第二天实际表现是两个结果，后者还受训练负荷和恢复状态影响。"],["证据等级","B（综述和联合立场支持短间隔内补碳水有利于肌糖原回补，每小时的数值是针对两次耗糖原训练的指导）。"],["适用与备注","按下一次训练的用时、强度和可进食时间调整。睡醒仍明显疲劳，可把训练改轻或推迟。走路或跑步时局部骨痛加重，先暂停会引起疼痛的活动并就医。 [持续疲劳和骨痛的评估线索](06-training-health.md#q37)"],["来源","美国运动医学会、美国营养与饮食学会、加拿大营养师协会 2016 年联合立场表 1 的快速恢复行及恢复章节，Craven 等 2021 年短时恢复肌糖原系统综述和荟萃分析。 [三机构联合立场](https://www.andeal.org/files/files/Collaborations/Position_Athletic-Performance_2016March.pdf) · [肌糖原回补综述](https://doi.org/10.1186/s40798-020-00297-0)"]],"path":"book/05-distance-running-nutrition.md","aliases":"","grades":["B"]},{"id":37,"qid":"Q37","section":"健康","chapter":"训练相关健康","question":"跑量增加又在减重，怎样发现可能长期吃不够，什么时候值得找专业人员评估？","title":"跑量增加又在减重，持续疲劳或月经变化时先评估","fields":[["怎么做","跑量增加后，如果持续疲劳或训练表现一直下降，回顾近期跑量、正餐和训练前后是否经常吃得比平时少。先暂停继续加量和主动减重，症状持续时找医生评估。原本规律的月经变得明显不规律或停经，也值得尽早就医。跑步或走路会加重的局部骨痛，先暂停会引起疼痛的活动并就医。"],["成本","回顾近期跑量、进食、体重变化、月经和伤病记录。可能需要暂缓减重或加量，也可能有就诊费用。"],["说人话","跑量变大、又在减重时，如果疲劳持续、月经明显变化或跑走时出现局部骨痛，值得评估。医生会结合饮食、训练和其他情况判断。"],["收益","及早发现训练消耗与进食之间可能存在的缺口，让医生评估能量不足、骨应力损伤及其他可能原因。长期或严重的能量可用性不足会影响骨骼、生殖功能和训练表现。"],["证据等级","C（哪些信号值得留意或就医，主要依据国际奥委会共识和临床指导）。B（训练和健康风险也有跑者研究支持。例如波士顿马拉松的观察研究发现，有问卷风险指标的人更常使用赛事医疗服务，样本以已有训练经验的跑者为主）。"],["适用与备注","男女跑者都可能出现能量可用性不足。疲劳、表现下降和月经变化各有多种可能原因，诊断需要结合训练、饮食、病史和检查。就诊时可带上近期跑量、典型用餐和症状出现的时间，供医生判断。"],["来源","国际奥委会 2023 年 REDs 共识的定义、表 3、表 4 和临床评估章节，女性运动员三联征临床共识的筛查部分，Whitney 等 2025 年表 1 和表 4，以及美国骨科医师学会的骨应力损伤说明。 [IOC 共识原文](https://doi.org/10.1136/bjsports-2023-106994) · [2025 年女性运动员三联征临床共识](https://doi.org/10.1007/s40279-025-02332-0) · [波士顿马拉松观察研究](https://pubmed.ncbi.nlm.nih.gov/39532316/) · [骨应力损伤说明](https://www.orthoinfo.org/diseases--conditions/sports-injuries/stress-fractures/)"]],"path":"book/06-training-health.md","aliases":"","grades":["B","C"]},{"id":38,"qid":"Q38","section":"健康","chapter":"训练相关健康","question":"耐力训练期间持续疲劳、配速下降，该考虑查铁吗？","title":"耐力训练中一直累、配速下降，和医生讨论要不要查铁","fields":[["怎么做","平时能轻松完成的跑量现在明显更吃力，配速持续下滑，休息后仍疲劳，可以约全科或运动医学门诊。带上近期训练量、症状开始时间、用餐和用药情况。有月经量明显增加、献血或既往缺铁，也一并告诉医生。医生会根据情况决定是否查血常规、血清铁蛋白，或加查转铁蛋白饱和度等指标。"],["成本","需要一次就诊，可能需要抽血和复查。费用取决于检查项目和当地收费。"],["说人话","跑不动、休息了还累，缺铁是医生可以排查的原因之一。血常规和铁蛋白看的是不同的事，医生会结合结果判断。"],["收益","血常规可帮助判断有无贫血，铁蛋白可帮助判断体内储存的铁是否偏低。铁储备下降时，血红蛋白可能仍在正常范围。查明是否缺铁后，医生还能进一步评估月经失血、消化道失血或摄入不足等原因。"],["证据等级","C（何时就医、查哪些指标及如何解释，依据运动医学实践指南及临床资料）。"],["适用与备注","给持续疲劳、耐力下降的跑者和其他耐力训练者。近期感染或高负荷训练可能影响铁蛋白，抽血前向医生说明。补铁由医生结合检查结果和病因决定，避免先自行服铁剂试效果。"],["来源","澳大利亚体育学院铁缺乏实践指南的症状、检测和血样采集部分，以及美国国家心肺血液研究所的缺铁性贫血资料。 [AIS 实践指南下载页](https://www.ausport.gov.au/ais/position_statements/iron-deficiency) · [AIS 检查框架](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/medical-supplements2/iron) · [NIH 临床资料](https://www.nhlbi.nih.gov/health/anemia/iron-deficiency-anemia)"]],"path":"book/06-training-health.md","aliases":"","grades":["C"]},{"id":39,"qid":"Q39","section":"健康","chapter":"训练相关健康","question":"长跑或比赛中喝水也可能过量吗？哪些情况需要找赛道医疗人员？","title":"长跑别硬灌水，出现意识异常就找赛道医疗","fields":[["怎么做","长跑时避免喝得超过需要。还不了解自己在类似天气和强度下的饮水需求时，可按口渴喝。训练中记录过饮水量和体重变化的人，也可以用这些记录帮助安排。跑中或跑后如果出现意识混乱、站不稳、昏倒或抽搐，立刻停止运动，呼叫赛道医疗或当地急救。"],["成本","主要是提前看好医疗点，按自身需要喝水。若要更细地估算，可以在类似环境的一次长跑前后称重，并记录饮水量。"],["说人话","水喝过量，血里的钠可能被稀释。比赛里有人突然意识混乱或倒地，叫医疗人员判断。"],["收益","荒野医学会指南把避免过量饮水列为强推荐。运动相关低钠血症严重时可出现意识异常、站不稳和抽搐，表现可与热射病等急症重叠，需要现场医疗评估。"],["证据等级","C（按口渴或个人需求安排饮水、遇到异常时呼救，依据临床指南。原指南把避免过量饮水评为 1A，把按口渴饮水或在赛前训练中估计个人需求评为 1C）。"],["适用与备注","用于长跑或比赛。看到有人意识异常、昏倒或抽搐，呼救后按急救人员指导处理，避免喂水、饮料或盐丸。能提供信息时，告诉医疗人员症状何时开始和大概喝了多少。"],["来源","荒野医学会运动相关低钠血症临床指南 2019 年更新，预防章节、表 3 和现场评估章节。美国心脏协会与美国红十字会 2024 年急救指南的抽搐章节，以及美国红十字会的热射病急救说明。 [临床指南原文](https://journals.sagepub.com/doi/full/10.1016/j.wem.2019.11.003) · [同版全文 PDF](https://blog.wildmedcenter.com/uploads/5/9/8/2/5982510/wms_exercise-associated_hyponatremia_2020.pdf) · [急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines) · [热射病急救](https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/extreme-heat-safety.html)"]],"path":"book/06-training-health.md","aliases":"","grades":["C"],"basis":"临床指南"},{"id":40,"qid":"Q40","section":"健康","chapter":"训练相关健康","question":"训练量增加后月经变少或停了，哪些情况值得就医，饮食和训练要提供什么信息？","title":"加量后月经明显变少或停了，带着记录就医","fields":[["怎么做","记录最近几次月经的开始日期、出血天数和变化。如果两次月经开始的间隔反复超过 45 天，或已经 3 个月没有月经，预约妇科、全科或运动医学门诊。如果有怀孕可能，应尽早验孕或联系医生。就诊时带上最近的训练量、加量时间、平常怎么吃、近期体重变化和骨应力损伤史，也告诉医生是否使用激素避孕。"],["成本","整理手机或纸上的周期、训练和饮食记录。就诊后可能需要验血或其他检查，按医生判断安排。"],["说人话","训练变多之后，月经间隔拉长或停了值得查原因。把什么时候开始加量、平时吃多少、月经什么时候变的告诉医生。"],["收益","就诊有助于区分妊娠、甲状腺疾病等原因，也能评估训练消耗与进食之间是否有缺口。REFUEL 随机试验纳入 76 名有月经稀发或停经的运动女性。增加进食的一组在随访中更常出现月经，但研究中的恢复指标不能说明排卵已经完全恢复。"],["证据等级","C（就医门槛和应提供的信息依据内分泌学会临床指南）。B（增加进食与月经变化来自特定人群的一项随机试验，76 人中有 33 人完成了全部 12 个月）。"],["适用与备注","给原本有月经、训练改变后周期明显变化的人。月经量持续明显减少，或还伴有骨应力损伤，也可提前咨询。医生判断与能量不足有关时，可一起讨论增加进食或调整训练量。已经在用激素避孕的人，把药名和出血情况告诉医生，由医生解释变化。"],["来源","内分泌学会功能性下丘脑性闭经指南第 1.2、2.1–2.2、3.2 和 3.5 条，女性运动员三联征临床共识图 4 与表 4，以及 REFUEL 随机试验的主要结果与图 2。 [内分泌学会指南](https://www.endocrine.org/clinical-practice-guidelines/hypothalamic-amenorrhea) · [三联征临床共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC12982345/) · [REFUEL 试验全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC8487661/)"]],"path":"book/06-training-health.md","aliases":"","grades":["B","C"]},{"id":41,"qid":"Q41","section":"运动","chapter":"抗阻训练","question":"第一次去健身房，怎么学会调座椅、选重量和安全试用固定器械？","title":"第一次用固定器械，先调好座椅和配重再试做","fields":[["怎么做","挑一个简单动作，请工作人员示范怎么调座椅、插配重销、开始和退出。以坐姿推胸为例，先让手柄大致对着胸部中段，检查座椅卡销和配重销都到位。从很轻一档试几次，脚踩稳，能控制推回的过程，再决定是否加一档。把座椅档位和重量记在手机里。"],["成本","第一次多留几分钟。器械型号换了，重新看说明和试档位。"],["说人话","先学会调和停，再考虑加重。下一次从记下的设置开始。"],["收益","固定器械训练能让健康成年人提高肌力。试档、记设置和使用场馆示范是减少重复摸索的办法，具体设置以器械为准。"],["证据等级","A（器械训练能提高肌力）。C（调节和试用步骤）。"],["适用与备注","不同器械的起始位置各有要求。运动中如果出现明显关节疼痛，先停下，把重量放回原位再调整。"],["来源","美国运动医学会（ACSM）2026 年立场，以及美国运动委员会（ACE）的推胸动作说明。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [ACE 器械示例](https://www.acefitness.org/resources/everyone/exercise-library/188/seated-chest-press/)"]],"path":"book/resistance-training/01-getting-started.md","aliases":"","grades":["A","C"]},{"id":42,"qid":"Q42","section":"运动","chapter":"抗阻训练","question":"居家只有自重和一条弹力带，怎样练到全身主要肌群？","title":"在家用自重和一条弹力带练到主要肌群","fields":[["怎么做","先排五种动作。例如椅前坐站练腿、臀桥练髋、墙面或桌边俯卧撑练推、踩带划船练拉、仰卧交替伸手伸脚练躯干。每种先试一组，选能做稳并留有余力的版本，每周从两次做起。需要更难时，逐步增加次数、弹力或改变动作难度。"],["成本","需要一小块空地和稳固的支撑面。每次检查带子有没有裂口、磨损和滑脱。"],["说人话","蹲、伸髋、推、拉，再带一个躯干动作，一条带子就能开练。"],["收益","弹力带训练和传统器械训练都可增加肌力。一项比较两者的系统综述未检出上下肢肌力增益的明显组间差异。这个动作组合是覆盖主要肌群的起步示例。"],["证据等级","A（弹力带抗阻训练改善肌力）。C（起步动作和每周安排）。"],["适用与备注","动作可以替换。把带子踩稳，回程慢一点。使用门锚时按产品说明安装，避免拉伸方向对着脸。可先看[每周怎么开始练力量](../01-resistance-training.md#q09)。"],["来源","ACSM 2026 年立场表 6，以及 Lopes 等 2019 年比较弹力和传统抗阻训练的系统综述。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [系统综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC6383082/)"]],"path":"book/resistance-training/01-getting-started.md","aliases":"在家练全身 没有器械","grades":["A","C"]},{"id":43,"qid":"Q43","section":"运动","chapter":"抗阻训练","question":"零基础想自学力量动作，怎么用视频、镜子或旁人反馈检查动作？","title":"用录像或旁人反馈，每次检查一个动作细节","fields":[["怎么做","用轻重量练，先定一个观察点。比如侧面录一组蹲起，看看每次下降到的深度是否接近。镜子适合先确认站位和器械设置，正式做动作时眼睛保持舒适的方向。找人帮看时，问一个具体问题，例如最后两次的动作幅度有没有明显变小。"],["成本","每次只拍或复看一组。把手机放在走道以外，并避开拍到他人。"],["说人话","一次检查一个地方。换了动作、角度或负荷，先用同一条件再对比。"],["收益","抗阻训练的反馈研究显示，外部反馈可以改善一些当次表现。研究中的反馈形式、动作和测量指标不同，自录视频适合做动作记录，能带来多少学习收益还不明确。"],["证据等级","B（外部反馈的研究需外推到居家自学）。C（录像与观察办法）。"],["适用与备注","录像可以看到轨迹、幅度和节奏。持续疼痛或力量突然下降时，暂停有问题的动作并寻求专业评估。"],["来源","Weakley 等关于抗阻训练外部反馈的系统综述与荟萃分析。 [论文全文](https://link.springer.com/article/10.1007/s40279-023-01877-2)"]],"path":"book/resistance-training/01-getting-started.md","aliases":"","grades":["B","C"]},{"id":44,"qid":"Q44","section":"运动","chapter":"抗阻训练","question":"自由重量、固定器械和绳索都能选时，初学者怎么取舍？","title":"按训练目标和可重复性选自由重量、器械或绳索","fields":[["怎么做","如果目标是练某个动作，例如杠铃卧推，就留一些时间直接练它。想先熟悉用力方式，可以试调得合适的固定器械。需要改变拉的方向或站位时，可以试绳索。试同类动作时，先看哪种做得稳、容易调整难度，也容易在你常去的场地重复。"],["成本","学自由重量通常要花时间熟悉拿起、放下和保护方式。固定器械和绳索也要花时间调设置。"],["说人话","想擅长什么就练什么。一般练力量，选容易上手、之后也能逐步加难的器材。"],["收益","自由重量与固定器械的比较综述显示，增肌结果未检出明显差异，力量提升和测试用的动作有一定特异性。绳索的取舍依据实际动作和场地。"],["证据等级","A（自由重量与固定器械的直接比较）。C（器材选择和搭配）。"],["适用与备注","选固定器械时先试活动路径和座椅位置。选自由重量时先熟悉如何稳妥结束一组。"],["来源","Haugen 等 2023 年自由重量与器械比较的系统综述，以及 ACSM 2026 年立场。 [比较综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC10426227/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/01-getting-started.md","aliases":"","grades":["A","C"]},{"id":45,"qid":"Q45","section":"运动","chapter":"抗阻训练","question":"给家里买第一件力量器材，弹力带、固定哑铃和可调哑铃怎么选？","title":"先列出会练的动作，再买第一件居家力量器材","fields":[["怎么做","先写出最想练的三个动作，再量一下收纳位置。想随身带、收得小，可以选弹力带。只需要少数负荷且想随手拿起就练，可以选固定哑铃。多个动作需要不同负荷、家里能留出安全空间时，再比较可调哑铃的最低重量、调节步长和锁定方式。"],["成本","按一套能用的配置算总价，也考虑占地和换档时间。能借用或试举时，先试最常练的动作。"],["说人话","先确认自己会拿它练什么，再为方便使用和逐步加重花钱。"],["收益","弹力带及传统抗阻器材都能提高肌力。选购条件属于使用取舍，各类哑铃和弹力带没有通用的家庭性价比排名。"],["证据等级","A（弹力带与传统抗阻器材均可用来练力量）。C（购买检查项）。"],["适用与备注","对弹力带，确认标注阻力对应的拉伸范围。对可调哑铃，照说明检查锁定和摆放条件。也可以先从[徒手和弹力带动作](#q42)开始。"],["来源","Lopes 等关于弹力训练与传统抗阻训练的比较综述，以及 ACSM 2026 年立场。 [比较综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC6383082/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/01-getting-started.md","aliases":"","grades":["A","C"]},{"id":46,"qid":"Q46","section":"运动","chapter":"抗阻训练","question":"跟着团课练力量，怎样判断课程能否覆盖自己的训练目标？","title":"记下两三节力量团课，看看哪些动作还需要补","fields":[["怎么做","连续记两三节课各做了哪些动作、用了多少重量、能否自己选难度。一般练力量，可以检查一周有没有腿、髋、推、拉和躯干动作。若想让某个动作进步，再看课程能否反复练它，有没有时间休息和逐步加重。少的部分可以用一两个独立动作补上。"],["成本","只需简单记课表。额外动作会多占几分钟，先从实际缺的部分补。"],["说人话","课后喘得多、汗出得多，和下周能否多做几次或用更重的重量，是两件可以分别记录的事。"],["收益","规律抗阻训练可以提高肌力。想提高特定动作的力量，负荷和是否持续练习该动作都值得看。不同团课的编排差异大，需按实际内容判断。"],["证据等级","A（规律抗阻训练和肌力改善）。C（核对课程内容的办法）。"],["适用与备注","团课适合提供固定的训练时段。跟不上动作节奏时，询问可替换动作或较轻负荷。"],["来源","ACSM 2026 年抗阻训练立场表 6 与讨论。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/01-getting-started.md","aliases":"","grades":["A","C"]},{"id":47,"qid":"Q47","section":"运动","chapter":"抗阻训练","question":"找教练学动作，第一次课前后可以用哪些问题判断值不值得继续？","title":"先约一节课，核对教练资质和下次能否照着练","fields":[["怎么做","预约前问三件事。带过哪些和你目标、经历相近的人？能否看相关资质以及急救培训情况？首课会怎么了解病史、时间和器材？课后看自己能否复述动作、说清下次怎么练，以及教练能否说明遇到疼痛、做不到或时间不够时会怎么改。"],["成本","可以先约一节，问清单课价格、取消规则和课后有没有练习记录。"],["说人话","付费之后，你应当拿到自己听得懂、下次还能照着做的方案。"],["收益","专业组织将资质、工作经验、初始沟通和目标设定列为选教练时的检查项。这些问题用于比较实际服务，单凭证书无法判断教学是否适合个人。"],["证据等级","C（专业组织选教练建议，课前课后提问为本文示例）。"],["适用与备注","若已有伤病或已被告知需限制训练，先确认个人医疗建议。教练可以据此调整练习。"],["来源","ACSM 选教练手册和美国国家体能协会（NSCA）初次访谈指南。 [ACSM 手册](https://acsm.org/wp-content/uploads/2025/02/Investing-in-a-personal-trainer-handout.pdf) · [NSCA 指南](https://www.nsca.com/education/articles/kinetic-select/client-consultation/)"]],"path":"book/resistance-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":48,"qid":"Q48","section":"运动","chapter":"抗阻训练","question":"一周只能练两次、每次半小时，怎么排全身训练？","title":"每周两次半小时，每次先排下肢、推和拉","fields":[["怎么做","把半小时粗分成热身、三个主动作和收尾。第一天做坐站或蹲、俯卧撑或推胸、弹力带或器械划船。第二天做臀桥或髋铰链、上肢推、下拉或划船。每个主动作从一到两组开始，首个主动作先用轻重量熟悉。做得完再加一组提踵、躯干或其他想补的动作。"],["成本","一周约一小时。动作多换几次器械会占时间，场地紧张时优先留住三个主动作。"],["说人话","两次都练到下肢、推和拉，短课也有用。先排能做完的版本。"],["收益","ACSM 建议健康成人规律练到主要肌群。针对时间有限者的综述提出先排下肢、上肢推和拉等多关节动作。两张半小时课表是应用示例。"],["证据等级","A（多种抗阻安排能提高肌力）。C（半小时排课示例）。"],["适用与备注","给每个动作留出必要的休息。初学者可以先让每周两次固定下来，再看动作和组数怎么进阶。"],["来源","ACSM 2026 年立场，以及 Iversen 等关于节省训练时间的综述。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [时间效率综述](https://doi.org/10.1007/s40279-021-01490-1)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"时间少 没空练 每周只有两次空档 半小时","grades":["A","C"]},{"id":49,"qid":"Q49","section":"运动","chapter":"抗阻训练","question":"从每周两练增加到三练，怎么重新分配已有动作和组数？","title":"从两练到三练，先把已有组数摊开","fields":[["怎么做","先把原课表里每个动作的正式组加总，移动组数到第三天。例如每周蹲六组，从三组加三组改成二组加二组加二组。也可以把下肢和推保留在头两天，第三天接手原先来不及做的几组拉和辅助动作。适应新日程后再决定是否加量。"],["成本","多一次准备或往返时间。每节课变短后，看训练是否更容易完成。"],["说人话","先把已有训练摊到三天。第三天刚排进去时，可以先保持周总量。"],["收益","训练总量相同时，提高训练频率对增肌的额外收益未稳定检出。把训练分开可以提供更多练习机会，实际收益取决于动作、负荷和组数。"],["证据等级","A（总量相近时的增肌证据）。C（调整日程和组数的示例）。"],["适用与备注","先调整课表，再改一个训练变量，有助于判断是训练安排还是训练量影响表现。"],["来源","ACSM 2026 年立场的频率与训练量结果，及 Pelland 等关于频率和周组数的剂量反应分析。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [剂量反应研究](https://pubmed.ncbi.nlm.nih.gov/41343037/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["A","C"]},{"id":50,"qid":"Q50","section":"运动","chapter":"抗阻训练","question":"全身训练和按部位分开练，怎么按可用天数和目标选？","title":"按可用天数和周训练量选全身练或分部位练","fields":[["怎么做","每周稳定两天时，可以先让两天都练到上下肢。每周能稳定多练几天，或一节课做不完各部位时，再试上肢日、下肢日或其他分法。比较两种课表时，写出每个主要肌群一周有多少正式组，再看漏一次课后哪部分会缺练。"],["成本","全身训练的单次课可能较长。分开练往往多占几天，且每次要单独准备。"],["说人话","日程常变，先让每次都有主要动作。想缩短单节课，再把内容分开。"],["收益","2024 年比较全身和分部位训练的荟萃分析显示，训练量匹配时，肌力和肌肉生长未检出明显组间差异。"],["证据等级","A（周训练量匹配时的比较）。C（按时间和目标选课表）。"],["适用与备注","两种安排都可以把优先动作放在相应训练日较靠前的位置。"],["来源","Ramos-Campo 等 2024 年系统综述及荟萃分析。 [研究摘要与全文入口](https://pubmed.ncbi.nlm.nih.gov/38595233/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["A","C"]},{"id":51,"qid":"Q51","section":"运动","chapter":"抗阻训练","question":"工作日抽不出时间，周末两天都能练时怎么安排？","title":"周末连练两天，把最吃力的内容分开","fields":[["怎么做","可以周六侧重下肢、周日侧重上肢。两天都想练全身时，把相同肌群最难的组集中在一天，第二天用较轻或不同的动作练。先按能控制的组数做几周，比较第二天热身和主动作是否接近平时。表现反复下降就减少重叠组数。"],["成本","两次课集中在周末。周日有体力活动或长跑时，也算进当天安排。"],["说人话","周末两天也可以练。把最累的内容分开，第二天用热身看恢复情况。"],["收益","一项 12 周试验让 30 名健康、有休闲运动经历的年轻男性连续三天练，或间隔约 48–72 小时练。两组都是每周三次，力量和体成分变化未见明显组间差异。周末两练是实际日程中的外推。"],["证据等级","B（连续日的短期比较，外推至两日安排）。C（周末课表示例）。"],["适用与备注","初学者可以把同一肌群的训练先做得轻一些，再看两天的实际完成情况。"],["来源","Yang 等 2018 年 12 周随机试验的训练安排与结果。 [随机试验全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC6015912/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["B","C"]},{"id":52,"qid":"Q52","section":"运动","chapter":"抗阻训练","question":"想估算某个肌群一周练了多少组，热身组和复合动作的间接训练怎么记？","title":"记正式组，直接和间接训练量分开算","fields":[["怎么做","先记清动作、负荷和正式组。再挑一个关心的肌群，把它直接承担主要训练任务的组单列，明显参与其他动作的组另列。例如三组弯举记作肱二头肌直接三组，三组划船单列为间接三组。只为过渡到正式负荷的轻热身组留在热身栏。"],["成本","每个动作多记一个标签。日常做训练对照时，用同一种记法就够。"],["说人话","直接和间接分开记。三组划船和三组弯举可以各留一行。"],["收益","一项周组数荟萃回归比较了多种记法，给间接组部分权重的模型拟合较好。这种统计折算便于看总体关系，个体的动作技术、幅度和用力会改变肌肉承担的任务。"],["证据等级","B（荟萃回归的组数模型，需外推到个人）。C（训练日志记法）。"],["适用与备注","想比较自己前后几周时，保持动作和记法一致。间接组若用半组折算，记下口径。"],["来源","Pelland 等关于周训练量与频率的荟萃回归。 [论文摘要与全文入口](https://pubmed.ncbi.nlm.nih.gov/41343037/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["B","C"]},{"id":53,"qid":"Q53","section":"运动","chapter":"抗阻训练","question":"一周各天的训练时间不一样，怎么排长课和短课？","title":"短课练熟悉动作，长课留给主项和补练","fields":[["怎么做","先把最想进步的动作放在最可靠的训练时段。短课选少量熟悉的动作，减少换器械。长课放需要较多热身和休息的重动作，以及本周漏掉的肌群。例如周二二十分钟做推和拉，周六四十分钟先做腿部主项，再补髋部和上肢。"],["成本","按实际出门和等待器械的时间估算。短课提前备一个同类替换动作。"],["说人话","短课留给随时能开始的动作。长课给热身、重组和本周缺的部分。"],["收益","训练周总量和主要动作的持续练习可用于判断安排是否合适。时间效率综述提出优先安排多关节动作。长短课的例子用于提高完成率。"],["证据等级","A（训练量和动作优先级影响训练适应）。C（按可用时间排课）。"],["适用与备注","目标动作需要较多准备时，优先放长课。如果长课经常取消，可以在短课安排较轻的练习。"],["来源","ACSM 2026 年立场，以及 Iversen 等关于时间有限时的编排综述。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [时间效率综述](https://doi.org/10.1007/s40279-021-01490-1)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["A","C"]},{"id":54,"qid":"Q54","section":"运动","chapter":"抗阻训练","question":"有一个特别想进步的动作，该在一周哪些训练日安排它？","title":"把最想进步的动作放在最可靠的训练日","fields":[["怎么做","先找最能固定出席、热身状态好的训练日，把目标动作放在主训练开头。例如想提高卧推，就把较重的卧推放在最稳定的一天。周内还有一次且恢复良好，可以用轻一些的重量练同一动作，分别记录两天的负荷和次数。"],["成本","需要给目标动作留热身、组间休息和必要的保护时间。其他辅助动作的组数可以相应调整。"],["说人话","每周先保住一次状态好的练习。想多练一次时，轻一些也能练动作。"],["收益","动作顺序的系统综述发现，放在训练靠前的动作通常获得较大的该动作力量增益。每周加一次轻练是排课示例，效果还取决于原有周量和负荷。"],["证据等级","A（优先安排与特定动作力量的关系）。C（重轻两次的编排示例）。"],["适用与备注","需要保护架或搭档的动作，优先排在能使用相应条件的时候。"],["来源","Nunes 等关于抗阻动作顺序的系统综述，以及 ACSM 2026 年立场表 6。 [顺序研究](https://pubmed.ncbi.nlm.nih.gov/32077380/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["A","C"]},{"id":55,"qid":"Q55","section":"运动","chapter":"抗阻训练","question":"几周内只能做很少的训练，怎么保留主要动作和已有进步？","title":"忙几周时，先减组数并保留主要动作","fields":[["怎么做","短期很忙时，先挑最想保留的动作，每周找一个能做到的时段。优先删次要动作和组数，主动作保留一两组熟悉、可控的负荷。原来用很重的重量或换了场地时，先用热身看当天状态。日程恢复后逐步把组数加回去。"],["成本","每周仍需要留一次训练的准备和恢复时间。出差时可以用易找到的同类动作代替。"],["说人话","先减少每周做多少，主要动作还能留就留。忙完后分几次加回原课表。"],["收益","Bickel 等的试验先让成人训练 16 周，之后将部分受试者的剂量降为原来的三分之一或九分之一，观察 32 周。力量适应可以较好保留。肌肉维持与年龄和剂量有关。"],["证据等级","B（特定方案的随机试验，外推至不同动作及人群）。C（短期课表取舍）。"],["适用与备注","适用于忙碌或旅行。生病、受伤、术后或长时间完全停练时，按当时状况和复训建议调整负荷。"],["来源","Bickel 等 2011 年训练维持剂量试验，以及 Spiering 等关于维持训练的综述。 [原试验](https://pubmed.ncbi.nlm.nih.gov/21131862/) · [维持剂量综述](https://pubmed.ncbi.nlm.nih.gov/33629972/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["B","C"]},{"id":56,"qid":"Q56","section":"运动","chapter":"抗阻训练","question":"一周有两次下肢力量训练，怎样分配动作和用力程度？","title":"两次下肢课各选一个主项，再分配轻重","fields":[["怎么做","可以让一天以深蹲或腿举为主，另一天以罗马尼亚硬拉或其他髋伸动作为主。每节先做当天的主动作，辅助动作减少重复的高用力组。若两天都要练深蹲，可以保留一天较重，另一天用较轻负荷练稳定的幅度。用相近的热身观察第二天状态。"],["成本","要为两个主动作分别留热身时间。和跑步兼练时，把长跑与关键下肢课放进同一张周课表，检查相邻训练日是否太累。"],["说人话","两天各有一个主角。需要重复同一动作时，可以让一天更轻。"],["收益","训练顺序、负荷和周量会影响力量适应。现有证据可支持把重点动作优先安排，示例中的深蹲日和髋伸日是据此设计的可调整课表。"],["证据等级","A（顺序与负荷的训练效应）。C（两天下肢课的编排）。"],["适用与备注","保持两个训练日都能稳定完成，再调整重量、组数或动作。"],["来源","ACSM 2026 年立场的肌力结果与训练变量表，以及 Nunes 等动作顺序系统综述。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [顺序研究](https://pubmed.ncbi.nlm.nih.gov/32077380/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["A","C"]},{"id":57,"qid":"Q57","section":"运动","chapter":"抗阻训练","question":"怎么判断一周的力量训练量值得增加、维持还是减少？","title":"用几周的动作表现和恢复记录决定加量或减量","fields":[["怎么做","用几周的记录看目标动作和整体状态。如果同样的动作逐步多做、加重或更稳，先保持现有组数。停滞了一段时间，出勤稳定、组间休息够且恢复良好时，可以先给目标动作或肌群加少量组数。若表现连续下降且疲劳影响下一次课，先删几组或降低负荷，再复查。"],["成本","至少记每周训练次数、正式组、代表动作的重量和次数。每次只改变一个主要训练量变量。"],["说人话","进步时可以照旧。想试加量就小幅加，做不回原来的水平就先查睡眠、训练和恢复。"],["收益","周训练组数与肌力及增肌的平均收益有关，收益随剂量提高会递减。个人该加还是减，还需结合是否完成计划、动作表现和恢复。"],["证据等级","A（训练量和平均适应的剂量反应）。C（根据日志调量的做法）。"],["适用与备注","同一个动作应尽量在相近条件下比较。持续疼痛、明显无力或其他异常症状要单独处理。"],["来源","ACSM 2026 年立场及 Pelland 等周训练量剂量反应分析。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [剂量反应研究](https://pubmed.ncbi.nlm.nih.gov/41343037/)"]],"path":"book/resistance-training/02-weekly-plan.md","aliases":"","grades":["A","C"]},{"id":58,"qid":"Q58","section":"运动","chapter":"抗阻训练","question":"下肢训练里，深蹲、腿举和箭步蹲各能承担什么任务？","title":"按目标在深蹲、腿举和箭步蹲里选主练动作","fields":[["怎么做","想提高深蹲表现，就在计划里保留会用的深蹲版本。主要想训练双腿推蹬、并希望背和躯干有座椅支撑时，可用腿举。需要练分腿站位下的控制或分别观察左右表现时，可加箭步蹲，初学可以扶稳固支架从原地分腿蹲做起。"],["成本","在同一训练日先选一个主动作。比如用两三组深蹲或腿举，再用两组原地分腿蹲练左右各自的动作。每组先用自己能控制的重量和幅度。"],["说人话","想蹲得更好就练蹲，想有支撑地练腿可以用腿举，想单独看看每条腿就试分腿动作。"],["收益","能把器械和动作分配给具体任务，避免在时间有限时装进太多近似动作。"],["证据等级","B（深蹲与腿举有直接训练比较，分腿动作的目标判断另有动作力学资料。三项长期一起比较的证据有限）。"],["适用与备注","适合健康成人。若体能、平衡或动作熟练度限制主练重量，先选相对容易控制的版本，熟练后再增加。"],["来源","Rossi 等深蹲与腿举训练比较的 Methods 和 Results，前后箭步蹲与单腿蹲的关节动力学比较，ACSM 2026 立场声明的训练专属性原则。 [深蹲和腿举训练研究](https://pubmed.ncbi.nlm.nih.gov/27735888/) · [箭步蹲动作力学研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC4641539/) · [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":59,"qid":"Q59","section":"运动","chapter":"抗阻训练","question":"想练髋部和大腿后侧，臀桥、罗马尼亚硬拉和腿弯举怎么搭？","title":"用一种髋伸动作搭一种腿弯举","fields":[["怎么做","想在家练髋伸，可以从地面臀桥开始。想练负重髋铰链，也就是靠髋部折叠把重量放低和拉起，可学罗马尼亚硬拉。想给大腿后侧加一项屈膝训练，可以配腿弯举。只有两个动作的位置时，可先安排一种髋伸和一个腿弯举。"],["成本","先在现有下肢课中试两组髋伸动作和两组腿弯举。臀桥能在垫上做，硬拉需要哑铃或杠铃，腿弯举可用熟悉的器械。"],["说人话","一个动作练髋部发力，再用腿弯举练膝盖弯曲时的大腿后侧。"],["收益","同时覆盖髋伸与屈膝两类任务，可以根据器材和动作熟练度替换。"],["证据等级","B（罗马尼亚硬拉和腿弯举有各自的训练试验。地面臀桥的证据主要来自即时肌肉活动测量，搭配顺序属于排课建议）。"],["适用与备注","初练罗马尼亚硬拉时，先在小负荷下找到自己能控制的活动范围。臀桥可作为另一个髋伸选项。"],["来源","地面臀桥研究的肌电方法与结果，罗马尼亚硬拉对比北欧腿弯举的 6 周研究，Maeo 等坐姿和俯卧腿弯举的 12 周研究。 [臀桥肌电研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC5080170/) · [罗马尼亚硬拉训练研究](https://pubmed.ncbi.nlm.nih.gov/40085810/) · [腿弯举训练研究](https://doi.org/10.1249/MSS.0000000000002523)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":60,"qid":"Q60","section":"运动","chapter":"抗阻训练","question":"想从俯卧撑练到卧推，怎么找到做得到的难度和替换动作？","title":"用抬高手的俯卧撑或轻重量推举找到起点","fields":[["怎么做","地面俯卧撑太难时，先把手撑在稳固的台面上，找能反复控制身体、每次还能留有余力的高度。想学卧推时，可以直接从可控的轻哑铃或推胸机开始，再练杠铃卧推。若空杠也太重，先用更轻的器材练熟动作。"],["成本","在原有上肢课里做一两组试组。例如同样能做 8 次，把手撑在较高处不费力、撑低一点仍能控制动作，就用较低的支撑面开始记录。每换一个版本重新试重量。"],["说人话","俯卧撑可以把手抬高，卧推可以用更轻的重量。选一个现在就能练稳的动作。"],["收益","可以从同一类水平推的简单版本入手，也能按是否想学卧推调整练习重点。"],["证据等级","B（测力研究支持改变支撑高度影响俯卧撑负荷。小型训练试验发现匹配低负荷时两种练法可带来上肢进步，结果限于该试验条件）。"],["适用与备注","训练杠铃卧推时，先设置合适的保护杠，或请熟悉动作的人保护。何时加重量见[同重量次数与加重](../01-resistance-training.md#q15)。"],["来源","Ebben 等俯卧撑变式的地面反作用力结果，Kikuchi 和 Nakazato 八周俯卧撑与卧推试验，ACSM 2026 立场声明的训练专属性原则。 [俯卧撑动作测力](https://pubmed.ncbi.nlm.nih.gov/21873902/) · [俯卧撑和卧推训练研究](https://doi.org/10.1016/j.jesf.2017.06.003) · [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":61,"qid":"Q61","section":"运动","chapter":"抗阻训练","question":"背部训练只有时间做两个动作，怎么在划船和下拉里取舍？","title":"背部能练两个动作时，先安排一个水平拉和一个向下拉","fields":[["怎么做","想把背部拉动作练得更全面时，可用坐姿或胸托划船做水平拉，用高位下拉做向下拉。若当前主要想进步的是引体，把下拉或辅助引体放前面。若目标是把某个划船动作练稳，就先做它，另一个动作按余下时间安排。"],["成本","一次选两台好调整的器械，各做一两组可控的正式组即可开始记录。下次直接用同样的握法和座椅高度复查。"],["说人话","一项往身前拉，一项从头顶往下拉。最想练好的先做。"],["收益","用两种拉力方向组织有限的训练时间，也让重点动作在更有体力时完成。"],["证据等级","B（两种拉法对部分背部肌肉的即时活动有实验数据。用两个方向覆盖训练是排课办法）。"],["适用与备注","器械、握法和体位能改变训练体验。想练第一次引体，见[辅助引体](#q62)。"],["来源","Lehman 等划船和下拉的即时肌电比较，ACSM 2026 立场声明表 6 的动作顺序。 [背部动作肌电研究](https://pubmed.ncbi.nlm.nih.gov/15228624/) · [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":62,"qid":"Q62","section":"运动","chapter":"抗阻训练","question":"做不了一个完整引体向上，怎么用辅助动作练到第一个？","title":"从可控的辅助引体练起，逐步减少帮助","fields":[["怎么做","用辅助引体机，或在稳固的低杠上用脚借力，选能顺畅拉起和放下的帮助量。保持握法和动作幅度，连续几次练习都完成得很稳时，再减一档辅助。每隔一段时间在精神和体力都较好的一天试一次无辅助引体。也可以加下拉练相近的用力方向。"],["成本","可在原有背部训练里以两组、每组几次辅助引体开始。记录辅助重量、次数和哪个位置最难。辅助机的数字通常代表帮助量，先确认机器标识。"],["说人话","先借一点力做出完整动作。每次用同样的办法，能看见自己是少借了力还是多做了几次。"],["收益","让每次练习都可以完成，引体进展有具体指标可记。"],["证据等级","B（有以引体为目标的训练研究。下拉试验里的受试者原先已会至少一个引体。对零基础练到第一个，辅助方式与周期仍需按个人情况选择）。"],["适用与备注","使用有可靠固定的单杠或器材。需要辅助时先选容易上下、放手后可以安全落脚的版本。"],["来源","Flanagan 等大学年龄女性引体训练研究，Li 等下拉训练研究的 Participants 与 Training program，训练手册的 The First Pull-up 进阶示例。 [引体训练研究](https://pubmed.ncbi.nlm.nih.gov/12659476/) · [下拉训练研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC11667758/) · [引体进阶示例](https://www.marines.mil/Portals/1/Docs/SecretToPullupsHowToGoFrom0To20.pdf)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":63,"qid":"Q63","section":"运动","chapter":"抗阻训练","question":"左右力量差别明显，单侧动作怎么选重量和决定先练哪边？","title":"左右表现有差异时，先用较弱一侧设定起始重量","fields":[["怎么做","用同样的椅子高度、幅度和节奏试两侧。若一侧多次做得较少或明显更吃力，可先练这侧，再用同样的重量和次数练另一侧。随时间复查两侧，也可以在动作幅度和用力都稳定后，按各自水平记录重量。"],["成本","每侧都记重量、完成次数和余力。比如一侧用 6 公斤能稳定做 8 次，另一侧能多做几次，开始阶段可两边都从 6 公斤做 8 次。"],["说人话","先按较难的那边定一个两边都能做的起点。隔几周再用同样方法看看差多少。"],["收益","让两侧能在相同条件下比较，也能单独记录弱侧的进步。"],["证据等级","B（单侧与双侧训练的研究支持力量提升有动作专属性。先练哪一侧及是否用同重量，主要是便利比较的执行办法）。C（突发单侧无力或麻木按卒中识别指引求助）。"],["适用与备注","用于逐渐发现的训练表现差异。如果突然出现一侧手臂或腿无力、麻木，立即停止训练并呼叫急救，在中国大陆拨打 120，症状短暂缓解也要立即求助。反复出现的局部疼痛或训练表现下降可参考[训练相关健康](../06-training-health.md)。"],["来源","单侧和双侧抗阻训练荟萃分析，ACSM 2026 立场声明的训练专属性部分，国家卫生健康委《脑血管病防治指南（2024年版）》第二章的「中风120」和英国 NHS 的卒中症状说明。 [单侧和双侧训练荟萃分析](https://pubmed.ncbi.nlm.nih.gov/39794667/) · [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [国家卫生健康委卒中识别指引](https://www.nhc.gov.cn/ylyjs/zcwj/202412/ba037e931fff4870930f65ff667ea9ed/files/1736390751587_80714.pdf) · [NHS 卒中症状说明](https://www.nhs.uk/conditions/stroke/symptoms/)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B","C"]},{"id":64,"qid":"Q64","section":"运动","chapter":"抗阻训练","question":"复合动作和单关节动作在一周里怎么搭配？","title":"先排每周主要复合动作，再按目的补单关节动作","fields":[["怎么做","先放能同时训练几个肌群的复合动作，如推胸、划船或腿举。再查看想重点练的部位是否已有足够训练。若目标需要，可增加弯举、腿弯举或提踵之类的单关节动作。哪项力量最想提高，就给它留在较有体力的时段。"],["成本","先用一张周计划写下已有动作。比如周内两天都做上肢拉动作，若还想在屈肘上多练一点，就先在其中一天末尾加两组弯举，观察时间和恢复。"],["说人话","先把主要动作排进一周。还有精力、也确实想多练某个部位，再补一小项。"],["收益","能在有限时间里覆盖主要任务，也给明确的局部目标留出位置。"],["证据等级","B（ACSM 对两类动作的肌肉增长差异认为资料不足。局部加练试验的结果受动作、对象和原课表限制）。"],["适用与备注","记录总组数时，复合动作对其他肌群的间接训练可按[每周组数记录](02-weekly-plan.md#q52)处理。"],["来源","ACSM 2026 立场声明的 Muscle Hypertrophy 和表 4，Gentil 等在已有复合训练上加入单关节上肢动作的试验摘要。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [加入单关节动作的训练研究](https://pubmed.ncbi.nlm.nih.gov/23537028/)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":65,"qid":"Q65","section":"运动","chapter":"抗阻训练","question":"想练躯干，卷腹、支撑和负重行走怎么按目标选？","title":"按弯曲、保持姿势或走动负重选择躯干动作","fields":[["怎么做","想练主动卷起躯干，可以选择能控制起落的卷腹。想练在动作中保持姿势，先用容易控制的前撑或侧撑。想练提着重物行走时维持身体稳定，可拿轻哑铃做负重行走。走单侧时两边都练，先确保有空地。"],["成本","卷腹和支撑只需一块垫子，负重行走要有不挡人的通道和能抓稳的重量。例如在训练末尾试两次 15–25 秒支撑，或两趟各约 15 米的轻负重行走。"],["说人话","卷腹练身体弯起来，支撑练稳住姿势，提着重量走则要边走边控制身体。"],["收益","能根据用途挑一个在现有场地可做的动作，再用次数、时长或走路距离记录进展。"],["证据等级","B（即时肌电比较显示不同动作招募模式有差别。此类资料无法给出长期效果排名）。"],["适用与备注","用于一般躯干训练。若某个版本引发疼痛或不适，可更换到能控制的做法或按[训练相关健康](../06-training-health.md)判断。"],["来源","Maeo 等不同静态和动态躯干动作肌电实验，以及负重行走、静态持重与前撑的即时比较表。 [躯干动作肌电研究](https://pubmed.ncbi.nlm.nih.gov/24149153/) · [负重行走实验](https://pubmed.ncbi.nlm.nih.gov/38665162/)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":66,"qid":"Q66","section":"运动","chapter":"抗阻训练","question":"小腿只有一两个训练位置，站姿和坐姿提踵怎么搭配？","title":"只有一个小腿动作位置时，可先选站姿提踵","fields":[["怎么做","主要想练小腿肌肉、站姿能稳定完成时，可先选站姿提踵，扶稳或用器械支撑。有第二个位置，可以加坐姿或其他屈膝提踵来练另一种姿势。站姿受平衡或器材限制时，可先用坐姿练到自己能控制的幅度。"],["成本","先从一周安排的一到两组提踵开始，记录姿势和次数。居家用平地和稳固支撑也可做站姿版。坐姿版需相应器械或能安全摆放的负重。"],["说人话","只能选一个又站得稳时，先练站姿。想练屈膝用力时，再加坐姿。"],["收益","能按训练位置和器材选择一个长期做得到的版本，也给两种动作留出直接比较的记录。"],["证据等级","B（14 名未经训练的健康成人，以左右腿分别训练 12 周。站姿腓肠肌增长较大，两种姿势的比目鱼肌增长未检出差异。研究用肌肉体积作为终点）。"],["适用与备注","适合以小腿肌肉训练为目标的人。膝、踝或跟腱已有症状时，见[训练相关健康](../06-training-health.md)。"],["来源","Kinoshita 等站姿与坐姿提踵训练研究的 Participants、Training program 和肌肉体积结果。 [提踵训练试验](https://doi.org/10.3389/fphys.2023.1272106)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":67,"qid":"Q67","section":"运动","chapter":"抗阻训练","question":"常用器械有人占着，怎样找能接上原计划的替代动作？","title":"常用器械被占时，按动作和训练目的找替代","fields":[["怎么做","先看原动作服务的任务，如水平推、向下拉、双腿推蹬或屈膝训练。选自己熟悉、用力方向和目标部位接近的版本。用一组偏轻的重量试活动范围，再按平时的次数区间和余力调整。若在练某项动作本身的力量，时间允许时可以换顺序，等待原器械空出。"],["成本","多留约一组的试重量时间。例如原计划推胸机三组 8–10 次，临时可用熟悉的哑铃卧推，分别记录哑铃重量、次数和余力。"],["说人话","先想原动作练什么，再选一个熟悉的近似动作。换了器械就重新试重量。"],["收益","器械排队时仍能做完当天主要训练，也能留下日后可用的独立动作记录。"],["证据等级","B（器械与自由重量都能用于力量训练。单项动作进步受训练和测试方式影响，当天怎样更换为执行建议）。"],["适用与备注","器械重量标示与哑铃、其他器械之间的实际负荷可能不同。长期动作选择可参照[器材怎么选](01-getting-started.md#q44)。"],["来源","ACSM 2026 立场声明的 Strength 和 specificity 部分，Schwanbeck 等自由重量与器械训练研究的测试和结果。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [自由重量与器械训练研究](https://pubmed.ncbi.nlm.nih.gov/32358310/)"]],"path":"book/resistance-training/03-exercise-selection.md","aliases":"","grades":["B"]},{"id":68,"qid":"Q68","section":"运动","chapter":"抗阻训练","question":"第一次做当天的重动作，热身组怎么递增到正式组？","title":"当天第一个重动作，用几组短热身逐步加到正式重量","fields":[["怎么做","先做几次最轻的版本，再用同一动作逐组加重。重量越接近正式组，热身次数越少。例如当天打算深蹲 60 公斤做正式组，可从 20 公斤做 6 次、35 公斤做 4 次、50 公斤做 2 次开始。热身仍轻松、动作稳定，休息后再进正式组。"],["成本","多用几分钟和两三次换重量。正式重量较轻、已经做过类似动作时，可少用几组。"],["说人话","先用轻重量找回动作。越接近重组，热身次数越少。"],["收益","研究在卧推、深蹲等动作发现，专项热身在部分方案中能改善当次速度、力量或完成次数。研究方案差异较大，本文重量为计算示例。"],["证据等级","B（当次专项热身研究，因动作和方案而异）。C（递增安排）。"],["适用与备注","样例从普通 20 公斤杆起步。嫌重时先用徒手或轻杆，热身组尽量留余力。"],["来源","Ribeiro 等的专项热身实验，以及抗阻热身范围综述。 [专项热身实验](https://www.jomh.org/articles/10.31083/jomh.2021.069) · [范围综述](https://doi.org/10.1007/s42978-025-00361-9)"]],"path":"book/resistance-training/04-session.md","aliases":"","grades":["B","C"]},{"id":69,"qid":"Q69","section":"运动","chapter":"抗阻训练","question":"一组练完应该休息多久，怎么知道自己已经可以开始下一组？","title":"按下一组能否做稳来决定休息多久","fields":[["怎么做","普通练习可先计时两分钟。重深蹲、卧推或明显喘的组，先把休息放长，等呼吸、站位和动作准备回来再开始。轻辅助动作如果下一组能保持目标次数和幅度，可以少歇一点。若后两组的次数老掉，下一次先把组间歇延长再比。"],["成本","重动作休息会占掉一部分课时。记录大致休息时间，方便比较两次表现。"],["说人话","歇到下一组还能按原计划做。重动作多留一些时间。"],["收益","增肌荟萃分析提示，超过很短的间歇可能有小幅平均优势，估计仍有不确定性。训练进阶立场建议根据负荷和动作选休息时间，重组通常留得更长。"],["证据等级","B（休息时间与增肌的比较结果存在不确定性）。C（用下一组表现调整）。"],["适用与备注","需要加快课表时，可让小动作交替做。重组和需要专注的动作保留完整休息。"],["来源","Singer 等 2024 年组间休息系统综述，以及 ACSM 2009 年进阶立场组间间歇部分。 [休息时间综述](https://pubmed.ncbi.nlm.nih.gov/39205815/) · [训练进阶立场](https://pubmed.ncbi.nlm.nih.gov/19204579/)"]],"path":"book/resistance-training/04-session.md","aliases":"","grades":["B","C"]},{"id":70,"qid":"Q70","section":"运动","chapter":"抗阻训练","question":"想练的动作很多，一节课里哪些放前面？","title":"把最想进步的动作排在热身之后","fields":[["怎么做","写下当天最重要的一个动作，热身后先做它。比如卧推是目标，就先卧推，再练肩、三头肌或其他推举。练熟新动作也可以放到前面，以便在精神和体力较足时练。其余动作按方便程度和疲劳影响排序。"],["成本","计划前花一分钟确定优先项。器械占用时可先做轻量准备或选约定的替换动作。"],["说人话","最想练好的动作，放在有体力、有注意力的时候。"],["收益","动作顺序系统综述中，前排动作的特定力量增益往往更大。增肌方面，现有比较未检出一致的顺序优势。"],["证据等级","A（顺序对特定动作力量的证据）。C（按优先项排单节课）。"],["适用与备注","把热身留在正式组之前。一周怎么摆重点动作，可看[每周重点动作安排](02-weekly-plan.md#q54)。"],["来源","Nunes 等动作顺序系统综述与 ACSM 2026 年立场。 [动作顺序综述](https://pubmed.ncbi.nlm.nih.gov/32077380/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/04-session.md","aliases":"","grades":["A","C"]},{"id":71,"qid":"Q71","section":"运动","chapter":"抗阻训练","question":"时间紧时，哪些动作适合交替做，哪些更适合各自休息？","title":"用交替组省时间，把重动作留给完整休息","fields":[["怎么做","可选两种不太影响彼此的动作交替，例如坐姿划船配提踵，或较轻的推与拉。做完 A 后按需要歇一下做 B，再回到 A。给同一动作留下足够时间。如果第二项明显拖累第一项的次数或幅度，先加间歇，必要时改回各做各的。"],["成本","能少等一些组间时间，但要看器械是否就在附近。健身房拥挤时可选同一处能做的两项。"],["说人话","把容易配在一起的动作交替做。最重、最需要专注的几组单独练。"],["收益","超级组和传统组的系统综述中，交替安排通常能缩短课时，平均完成次数和训练量接近，主观用力感较高。具体配对会影响完成情况。"],["证据等级","A（时间和当次表现的比较）。C（动作配对示例）。"],["适用与备注","组间的休息仍要够。需要保护或接近极限的动作适合单独安排。"],["来源","超级组与传统训练组的系统综述及荟萃分析。 [综述](https://pubmed.ncbi.nlm.nih.gov/39903375/)"]],"path":"book/resistance-training/04-session.md","aliases":"","grades":["A","C"]},{"id":72,"qid":"Q72","section":"运动","chapter":"抗阻训练","question":"举起和放下的速度怎么控制，特意放慢什么时候有意义？","title":"把动作做稳，想检查轨迹时再刻意放慢","fields":[["怎么做","用能控制的速度放下重量，再按动作目标平稳举起。新学动作时可以试放慢下降，看看自己能否保持站位、轨迹和幅度。原本做得稳而目标是增肌，可以用自然、可重复的节奏。改变速度后重新看重量和次数是否合适。"],["成本","慢做会延长每组时间，同一重量的完成次数也可能变化。"],["说人话","先让每次做得像。慢一点可以帮助观察动作，没必要每组都数秒。"],["收益","抗阻训练立场及节奏比较综述未显示常见范围内慢节奏对增肌有稳定优势。刻意放慢可以作为练习或记录条件。"],["证据等级","A（节奏对增肌的比较证据）。C（学习动作时的做法）。"],["适用与备注","爆发力训练另有速度目标。以控制为目的的慢练可优先用较轻负荷。"],["来源","ACSM 2026 年立场的重复速度结果，以及 Schoenfeld 等的重复时长系统综述。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [重复时长综述](https://doi.org/10.1007/s40279-015-0304-0)"]],"path":"book/resistance-training/04-session.md","aliases":"","grades":["A","C"]},{"id":73,"qid":"Q73","section":"运动","chapter":"抗阻训练","question":"深蹲或卧推应该做到多大幅度，怎样选自己能控制的范围？","title":"深蹲和卧推先用自己能控制的幅度，再逐步扩展","fields":[["怎么做","从轻重量开始，选能稳定往返的范围。深蹲可用箱子作高度参照，观察脚底和重心是否稳定。卧推可用合适的保护架，从轻杆试到肩部舒服、还能控制的位置。连续几组都做得一致后，再试增加幅度，重量暂时保持或减轻。"],["成本","一次只改一点幅度。手机或固定参照物便于比较。"],["说人话","先找自己能稳稳做完的范围。想做深一点，就先用轻重量试。"],["收益","综合证据中，较完整的动作范围对整体肌力增益通常更有利。增肌结果随动作和肌群而变化，ACSM 对幅度影响增肌的证据仍判为不足。"],["证据等级","A（训练幅度与肌力适应）。C（选择并逐步扩展幅度）。"],["适用与备注","健身目标可以用个人的可控范围。参赛时另按项目动作标准练习。"],["来源","Pallarés 等动作幅度系统综述，以及 ACSM 2026 年立场肌力和增肌结果。 [幅度综述](https://pubmed.ncbi.nlm.nih.gov/34170576/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/04-session.md","aliases":"深蹲幅度 深蹲深度","grades":["A","C"]},{"id":74,"qid":"Q74","section":"运动","chapter":"抗阻训练","question":"一般抗阻动作什么时候吸气、什么时候呼气，用力撑稳躯干怎么练习？","title":"用轻重量练呼吸和躯干稳定，再把它带进正式组","fields":[["怎么做","先在徒手或轻重量下试。下放或回到起始位时吸气，发力举起时缓缓呼气。深蹲或提重物前，可先吸气并轻轻撑紧腹部，动作中保持身体稳，做完一次再调整呼吸。练不熟时减轻重量，避免长时间憋气。"],["成本","不需要加器材。先用一两组轻练找到舒服的节奏。"],["说人话","发力时缓缓吐气。举重前让躯干先稳住，再开始动作。"],["收益","训练手册用发力呼气、还原吸气作为一般动作提示。屏气用力可引起明显血压变化，已有心血管疾病的人要按个人医疗方案选择强度和呼吸。"],["证据等级","C（训练手册与心血管科学声明的执行建议）。"],["适用与备注","普通练习先从自然连续的呼吸开始。接近最大重量的专门动作需要另学技术和保护。"],["来源","NSCA 基础力量训练手册的呼吸部分，以及美国心脏协会 2023 抗阻运动科学声明。 [NSCA 手册](https://www.nsca.com/contentassets/116c55d64e1343d2b264e05aaf158a91/basics_of_strength_and_conditioning_manual.pdf) · [AHA 声明](https://pmc.ncbi.nlm.nih.gov/articles/PMC11209834/)"]],"path":"book/resistance-training/04-session.md","aliases":"","grades":["C"]},{"id":75,"qid":"Q75","section":"运动","chapter":"抗阻训练","question":"一个人练卧推和深蹲，怎么设置保护架和决定何时找人保护？","title":"独练卧推和深蹲前，先用空杆试好保护架和退出办法","fields":[["怎么做","用带安全杠或安全带的架子，先确认两侧锁好，再用空杆验证。卧推时安全装置略低于正常下放位置，但放松身体后能拦住杆，让胸颈有空间退出。深蹲时保护装置放在预定最低点略下方，并练习如何把空杆落在两侧保护上。设备不合适、动作陌生或计划挑战重量时，找熟悉保护的人，或改用更容易安全放下的动作。"],["成本","开练前多花几分钟设置。不同架型、凳子和站姿要重新试。"],["说人话","空杆先试一遍。确认卡住时能稳妥离开，再加重量。"],["收益","NSCA 将杠铃卧推和深蹲列为需要相应保护安排的动作。保护高度和人员选择依器材、动作和经验判断。"],["证据等级","C（专业训练手册的保护原则与空杆检查示例）。"],["适用与备注","照场馆和设备说明设定。让同伴保护前，先约定什么时候帮忙和怎么接杆。"],["来源","NSCA 基础力量训练手册的器材设置与保护章节。 [NSCA 手册](https://www.nsca.com/contentassets/116c55d64e1343d2b264e05aaf158a91/basics_of_strength_and_conditioning_manual.pdf)"]],"path":"book/resistance-training/04-session.md","aliases":"","grades":["C"]},{"id":76,"qid":"Q76","section":"运动","chapter":"抗阻训练","question":"每组都要练到做不动吗，怎样用还能做几次决定停组？","title":"用估计的剩余次数停组，动作开始走样时先停下","fields":[["怎么做","从每组留大约两到三次余力试起。快结束时问自己，在相同幅度和节奏下还能做几次。估计已经到预定余力，或下一次可能明显走样，就结束这一组。没把握时先多留一点，连续几次训练记录同一动作的重量和完成次数。"],["成本","只需在日志多记一项。初学时需要几次重复训练来熟悉体感。"],["说人话","还有几次能做稳，就按这个数停。每组都拼到做不动会让后面的组更难维持。"],["收益","ACSM 综合结果显示，做到力竭对肌力和增肌未表现出稳定的额外好处。剂量分析提示，增肌可能受接近力竭程度影响，但最合适的剩余次数尚难确定，自估也有误差。"],["证据等级","A（力竭与非力竭的总体比较）。B（估计余力及剂量关系）。C（起步示例）。"],["适用与备注","轻重量下尤其难精确判断余力。需要保护的动作先留足余地。"],["来源","ACSM 2026 年立场、Robinson 等剂量反应分析及余力估计的系统综述。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [剂量反应分析](https://pubmed.ncbi.nlm.nih.gov/38970765/) · [余力估计综述](https://www.tandfonline.com/doi/full/10.1080/10833196.2025.2564026)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["A","B","C"]},{"id":77,"qid":"Q77","section":"运动","chapter":"抗阻训练","question":"第一次练一个动作，怎样选起始重量并判断要不要换一档？","title":"新动作先用轻一档试做，再看次数、幅度和余力","fields":[["怎么做","先定一个容易记录的范围，例如 8–12 次。从很轻的重量做几次，确认起始位置和结束动作。如果做完一组仍能轻松多做很多次，可休息后加最小一档。如果很早就做不稳、动作变短，或做不到次数下限，就减轻。第一次把合适重量记下来。"],["成本","约多花一到两组的准备时间。测试各档前休息，避免因为累了低估合适重量。"],["说人话","先找到能做完整、还能留几次的重量。第一次以认得清这个动作的感觉为主。"],["收益","不同负荷都能改善健康成人的肌力。较重负荷更有利于提高最大力量，具体起始重量可随动作熟悉度和目标调整。"],["证据等级","A（负荷与肌力训练的证据）。C（试重量和次数示例）。"],["适用与备注","如果能控制的最轻档也过重，先换徒手或其他器材。"],["来源","ACSM 2026 年立场及[首版逐步加重说明](../01-resistance-training.md#q15)。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["A","C"]},{"id":78,"qid":"Q78","section":"运动","chapter":"抗阻训练","question":"器材的下一档太重，怎么跨过负重的档位差？","title":"下一档太重时，先多做几次或用更小的加重幅度","fields":[["怎么做","先确认上一档是否还能增加可控次数。例如当前能做 10 次，下一档只能做 5 次，而目标下限是 8 次，可以暂时用上一档做到 11、12 次后再试。场馆允许且器材支持时，可用配套小片微调。也可换档位更细的同类器材，重新记起点。"],["成本","多留几次训练适应。微型片或额外器材会有成本，先问能否使用。"],["说人话","档位跳太大时，先用现有重量做得更多或更稳。"],["收益","短期随机试验在已有训练经验者的下肢训练中观察到，加重量和加次数都可带来力量和肌耐力改善。跨器材的重量数字不能直接比较。"],["证据等级","B（渐进方式的短期试验，需外推到其他动作和人群）。C（档位过渡示例）。"],["适用与备注","别在配重销上临时挂未经场馆允许的东西。配套加重件按设备说明使用。"],["来源","Plotkin 等 2022 年试验及 ACSM 2026 年立场。 [加重量或加次数的试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC9528903/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/05-progression.md","aliases":"加一档太重 哑铃档位太大 哑铃加重 5公斤到7.5公斤","grades":["B","C"]},{"id":79,"qid":"Q79","section":"运动","chapter":"抗阻训练","question":"每组次数下降很快，怎么区分第一组过重和组间休息不足？","title":"后几组掉次数，先试拉长休息，再看首组用力程度","fields":[["怎么做","挑一项熟悉动作，记各组次数、间歇和首组余力。下一次重量相同，把间歇延长一些。例如从 90 秒试到 2 分半。如果后几组能多做一些，说明原来的休息可能偏短。若第一组就比目标吃力、动作变形，优先减重或少做一两次。"],["成本","多等一两分钟。训练前后的饮食、睡眠和顺序尽量相近。"],["说人话","先改休息看后几组。第一组已经顶到头，就回头调重量或次数。"],["收益","组间间隔实验发现，在部分上肢动作中，较长休息能维持后续组的完成次数。单次下降还可能受当天状态和前序动作影响。"],["证据等级","B（组间间歇的当次试验）。C（区分原因的训练记录示例）。"],["适用与备注","比较同一动作和同一负荷。日常不需要每组都做到极限来测。"],["来源","上肢抗阻运动组间休息实验与 ACSM 进阶立场。 [组间间歇实验](https://pmc.ncbi.nlm.nih.gov/articles/PMC3763284/) · [ACSM 进阶立场](https://pubmed.ncbi.nlm.nih.gov/19204579/)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["B","C"]},{"id":80,"qid":"Q80","section":"运动","chapter":"抗阻训练","question":"完成次数一样但动作越做越短，训练记录怎么记，下一次怎么调？","title":"同样次数但幅度缩短时，把做完整的次数单独记下来","fields":[["怎么做","训练前为这个动作选可重复的参照，例如深蹲到固定箱面附近。做完如果只前 8 次达到计划幅度，后 2 次变浅，可记「8 次完整，2 次缩幅」。下次先用同一重量做够稳定的次数。若还是在达到目标前反复缩幅，就减重或加间歇。"],["成本","多记几个字。固定参照物或拍一组视频可以节省反复猜测的时间。"],["说人话","次数一样也可能练得不一样。记清多少次做到了原先的幅度。"],["收益","动作幅度会影响部分训练适应，用一致幅度有助于对照同一动作的实际进步。日志里的分类是本文用于训练复盘的示例。"],["证据等级","A（训练幅度与肌力适应）。C（记录与调整办法）。"],["适用与备注","有意安排部分幅度时，可以另外记下是哪一段。出现疼痛时先调整范围并按症状处理。"],["来源","Pallarés 等动作幅度综述和 ACSM 2026 年立场。 [动作幅度综述](https://pubmed.ncbi.nlm.nih.gov/34170576/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["A","C"]},{"id":81,"qid":"Q81","section":"运动","chapter":"抗阻训练","question":"自重动作已经能做很多次，怎样用杠杆、支撑或外加负重继续进阶？","title":"自重动作能轻松做很多次时，先改支撑或杠杆再考虑加重","fields":[["怎么做","选能稳定改变难度的方式。俯卧撑可以逐步降低双手支撑高度。坐站可以用更低但稳固的凳面，或在做稳后改成分腿动作。先保持原有幅度和控制，换一个难度后重新选次数。需要额外加重时，选能固定、能稳妥取下的负荷。"],["成本","改支撑高度多能用现有环境。外加重量可能需要器材。"],["说人话","先换一个稍难但做得稳的版本。次数降一些，之后再逐渐补回来。"],["收益","ACSM 立场支持以自重等多种阻力练力量。小型试验显示调整姿势后的低负荷俯卧撑可提高特定肌力和肌肉厚度，受试者为年轻男性且方案训练到力竭。"],["证据等级","A（自重抗阻训练可改善肌力）。B（俯卧撑研究和向其他自重动作的外推）。C（进阶选择）。"],["适用与备注","支撑面要固定、防滑。新版本让动作幅度明显缩短时，可以回到较容易的版本。"],["来源","ACSM 2026 年立场及 Kikuchi 与 Nakazato 的俯卧撑对照试验。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [对照试验](https://doi.org/10.1016/j.jesf.2017.06.003)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["A","B","C"]},{"id":82,"qid":"Q82","section":"运动","chapter":"抗阻训练","question":"弹力带没有固定重量刻度，怎样让两次训练的阻力可以比较？","title":"弹力带用同一根、同一握点和站位来比较进步","fields":[["怎么做","给同一动作记带子型号或颜色、锚点高度、握点和站位。比如固定用同一条带，手握同一记号，脚踩同一地砖线。动作开始和结束位置相近时，对比次数和余力。想提高难度，可以按说明稍增起始拉伸、换更硬的带子，或改变手与锚点的距离，记下新的设置。"],["成本","首次拍照或做位置记号。每次开始前检查磨损和固定点。"],["说人话","同样的带子拉得越长通常越费力。把站位和握法固定，次数才更好比较。"],["收益","机械测试显示，弹力带阻力随相对伸长变化。同样拉开几厘米时，改变握点会改变参与拉伸的长度，从而改变相对伸长比例。不同品牌或型号的颜色不能直接换算成同一重量。"],["证据等级","B（特定弹力带的机械测试）。C（训练记录方法）。"],["适用与备注","按产品规定的最大伸长使用。带子破损、锚点松动时更换或重新固定。"],["来源","弹力带型号与伸长关系的机械研究，以及不同起始长度的张力试验。 [机械评估](https://pubmed.ncbi.nlm.nih.gov/36649724/) · [张力研究](https://pubmed.ncbi.nlm.nih.gov/16355080/)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["B","C"]},{"id":83,"qid":"Q83","section":"运动","chapter":"抗阻训练","question":"同一个动作卡了好几周，怎样用记录排查重量、组数和动作变化？","title":"同一个动作卡住时，先确认记录口径，再只改一项","fields":[["怎么做","翻看最近几次该动作的重量、次数、幅度、顺序和间歇。先排除器械、动作和课表变了的影响。一直用相同重量和次数但留有余力时，可试多做一次。如果已持续高用力且状态走低，先试少一点周组数。整体稳定、长期没有进步时，再试给目标动作多留一组或一个练习机会。"],["成本","至少回看几次记录。选一个调整，留几次课再评价。"],["说人话","卡住时先查动作、休息和训练量有没有悄悄变。确认后一次只改一件事。"],["收益","抗阻训练研究支持通过负荷、次数和周组数调刺激。个人停滞还受训练经历及恢复影响，本文的排查步骤用于试验和比较。"],["证据等级","A（训练负荷和周组数的适应证据）。B（加重量与加次数的短期比较）。C（排查顺序）。"],["适用与备注","已有持续疲劳或疼痛时，先处理症状和恢复，再试增加训练。"],["来源","ACSM 2026 年立场、Plotkin 等对照试验及周组数剂量反应分析。 [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [加重量或加次数的试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC9528903/) · [剂量反应研究](https://pubmed.ncbi.nlm.nih.gov/41343037/)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["A","B","C"]},{"id":84,"qid":"Q84","section":"运动","chapter":"抗阻训练","question":"不测极限重量，怎样用常规训练组估算自己的力量变化？","title":"不用测极限，用相近条件下的常规组看力量趋势","fields":[["怎么做","选一个熟悉动作，在同一课表位置记重量、完成次数、幅度和大致余力。比如以前用 50 公斤做 6 次、估计剩两次，几周后同样姿势和余力能做 8 次，就记录进步。已有训练软件给估计最大重量时，可以看同一公式下的趋势，同时保留原始重量和次数。"],["成本","不用特意安排极限测试。记录同一条件下的代表性一组即可。"],["说人话","同样余力，重量更重或能多做几次，就有进步。估算数字保留到看趋势就够。"],["收益","用较少次数的测试组可估计一次最大重量，误差随动作、次数和所用模型变化。日常留余力的组又多了一层主观估计，适合做长期比较。"],["证据等级","B（较低次数估计最大力量的原始研究，需外推到留余力组）。C（代表组比较）。"],["适用与备注","更换器材、动作幅度或技术时另起记录。训练时无需为了公式特意做到失败。"],["来源","Reynolds 等通过不同重复次数估计一次最大重量的原始研究，以及余力估计系统综述。 [力量估计研究](https://pubmed.ncbi.nlm.nih.gov/16937972/) · [余力估计综述](https://www.tandfonline.com/doi/full/10.1080/10833196.2025.2564026)"]],"path":"book/resistance-training/05-progression.md","aliases":"","grades":["B","C"]},{"id":85,"qid":"Q85","section":"运动","chapter":"抗阻训练","question":"想增肌时，重量和次数范围怎么选，器材偏轻怎么办？","title":"想增肌时先选能做出高质量、有挑战的重量","fields":[["怎么做","用能稳定控制动作的重量，从中等次数的一组找感觉。器材偏轻时，先增加次数，让一组仍有足够挑战。若要做很久才感觉吃力，可以试更长的可控幅度、单侧版本或额外阻力。动作稳定时，每组末尾可留少量余力。"],["成本","在已有训练里试一到两组。比如同一副轻哑铃划船，原来 12 次还很轻松，可先试 15 次并记录余力，再决定用现有重量还是升级器材。"],["说人话","手里重量轻，就先用次数或更难的动作补上。找到一组做完明显用力、动作还稳的版本。"],["收益","器材有限时也能逐步增加刺激，并可用训练记录判断何时需要更换阻力。"],["证据等级","A（健康成人综述支持多种负荷增肌）。B（低负荷试验通常有明确的努力程度，不能把结果直接延伸到很轻松的任意次数）。"],["适用与备注","组末余力的估计见[控制每组用力](05-progression.md#q76)。用较轻器材进阶时也可参考[自重动作进阶](05-progression.md#q81)。"],["来源","ACSM 2026 立场声明的 Muscle Hypertrophy 小节与表 6，Schoenfeld 等较低与较高负荷训练试验的分组与肌肉厚度结果。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [不同负荷八周试验](https://pubmed.ncbi.nlm.nih.gov/25853914/)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["A","B"]},{"id":86,"qid":"Q86","section":"运动","chapter":"抗阻训练","question":"想提高某个动作的最大力量，怎样安排较重的组和练习频率？","title":"想提高某个动作的最大力量，把较重练习放在前面","fields":[["怎么做","选择一个主要动作，在仍有体力时完成。技术已稳定的人先做逐级热身，再做少量较重、能控制的组，并留充分组间休息。用两天分开练同一个动作，其中一天可稍轻，先看一两周是否都能按原意完成。"],["成本","较重组需要更多热身和休息。比如周一做熟悉动作的 3 组各 4 次，周四以较轻重量做 2 组各 6 次，每组都保留余力。"],["说人话","想让哪个动作变强，就趁还有力气练哪个，并给下一次练习留些体力。"],["收益","较重组能让目标动作有更贴近大重量的练习机会，也便于按同一动作观察力量变化。"],["证据等级","A（ACSM 综合结果支持较重负荷、训练较早安排及每周多次练习增强力量。例子的次数、总组数和第二天用力为排课示例）。"],["适用与备注","首次练该动作时，先学会在较轻重量下稳定完成。估算进步见[常规训练组判断力量变化](05-progression.md#q84)。"],["来源","ACSM 2026 立场声明的 Strength 小节与表 6，Currier 等网络荟萃分析的力量结果。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [抗阻训练处方网络荟萃分析](https://pubmed.ncbi.nlm.nih.gov/37414459/)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["A"]},{"id":87,"qid":"Q87","section":"运动","chapter":"抗阻训练","question":"想提高肌肉耐力，组数、次数和休息应该怎么按目标调整？","title":"按想维持的任务训练局部肌肉耐力","fields":[["怎么做","先选要持续的动作，例如连续提踵、较长时间提物或较轻阻力反复推拉。用适当的次数或时间练习，在动作还能维持时结束。先把一组做稳，再加次数或时长。若下一组因为休息不够很快走样，就把休息拉长一些。"],["成本","例如安排两组轻阻力提踵，每组 15 次。休息够了再做第二组。以后在相同阻力和幅度下看能否稳定多做几次。"],["说人话","想同一个动作做得久一点，就练能稳稳重复的版本，再逐步延长。"],["收益","把力量耐力变成可以复测的任务，在有限时间内看出是否进步。"],["证据等级","B（抗阻训练总体能提高局部肌肉耐力。特定负荷试验的持久表现受测试任务影响，资料有限，组数、次数和休息按目标安排）。"],["适用与备注","比较两次时，尽量保持器材、重量、动作幅度和测试方式相同。"],["来源","ACSM 2026 立场声明的 Muscular Endurance 部分，Schoenfeld 等轻重负荷试验的卧推耐力测试。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [局部肌肉耐力试验](https://pubmed.ncbi.nlm.nih.gov/25853914/)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["B"]},{"id":88,"qid":"Q88","section":"运动","chapter":"抗阻训练","question":"想提高快速发力能力，普通成年人怎样选适合自己的抗阻练习？","title":"用熟悉的动作练较快发力，回程仍保持控制","fields":[["怎么做","先选熟悉、站得稳或有可靠支撑的动作。用较轻至中等阻力在用力阶段有意做快，放下时稳住。在动作明显变慢、需要借力或失去控制前结束一组，充分休息后再做下一组。"],["成本","例如在原训练开头用稳固椅子做两组各 4 次较快起身，坐下仍然控制。开始时可用自重和稳定支撑，再考虑是否增加阻力。"],["说人话","用能掌握的动作练快一点的发力。每次都做稳，就留力给下一次。"],["收益","能把快速用力单独练习，适合希望改善短时间发力的人。"],["证据等级","A（ACSM 对成人抗阻与功率的综合结果）。B（较快用力对老年人的日常功能可能有小幅收益，比较研究确定性较低）。"],["适用与备注","动作练熟、日常站立和控制稳定后再尝试。椅子示例可按个人能力加稳定扶手。"],["来源","ACSM 2026 立场声明的 Power 小节和表 6，Balachandran 等社区老年人功率训练荟萃分析的结果。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [老年人功率训练综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC9096601/)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["A","B"]},{"id":89,"qid":"Q89","section":"运动","chapter":"抗阻训练","question":"想让上下楼、从椅子起身或提物更轻松，怎么选训练任务和进步指标？","title":"用相近的日常任务练和测上下楼、起身与提物","fields":[["怎么做","先选最想做得轻松的一件事。上下楼可扶稳练低台阶，起身可从稳固椅子做坐站，提物可练拎着适量重量走一小段。作比较时用固定椅高、台阶高度、重量和路线，按平时做法记录是否更从容。"],["成本","每一两周花几分钟复查。例如用同一把稳固椅子，记录 30 秒内标准坐站次数。提物可记固定距离走完的体感，保持物品重量相同。"],["说人话","想把哪件日常事做得轻松，就选相近的动作练，再回到同一个任务看看。"],["收益","能观察对生活有用的改变，训练记录也有一个容易复测的指标。"],["证据等级","B（抗阻训练综述支持起坐和部分功能指标改善。练哪项和如何自测属于按目标选择）。"],["适用与备注","使用稳定椅子和扶手。平衡不稳或有关节症状时，从有人支持的版本开始，留意[训练相关健康](../06-training-health.md)。"],["来源","ACSM 2026 立场声明表 6 的功能指标，CDC STEADI 30 秒坐站测量说明，以及健康年轻成人坐站测试研究。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [CDC 坐站测试](https://www.cdc.gov/steadi/media/pdfs/steadi-assessment-30sec-508.pdf) · [健康年轻成人坐站测试](https://pmc.ncbi.nlm.nih.gov/articles/PMC9340829/)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["B"]},{"id":90,"qid":"Q90","section":"运动","chapter":"抗阻训练","question":"某个肌群特别想练大，怎么分配训练顺序和专项训练量？","title":"给重点肌群预留专项组，在能恢复的范围内加量","fields":[["怎么做","统计该肌群已经做的直接训练和复合动作里的参与。先选一项能用它稳定发力的动作，放在容易保证完成的位置。若相关练习已一段时间稳定、增肌仍是首要目标，可增加少量专项组，并观察原计划别的动作是否受影响。"],["成本","例如每周练两次侧平举，每次已有两组。若好几周都恢复得顺，可先在其中一天增加一组，过数周看次数、体感和测量趋势。"],["说人话","把想练的部位安排到真的会做的位置。加量时先加一点，看看能不能长期做下去。"],["收益","增加目标肌群的可记录训练，同时避免不知不觉把每个动作都加量。"],["证据等级","A（综合研究支持周组数与肌肉增长呈总体剂量关系）。B（顺序对增肌的差异不稳定，个人额外组数需要按已有训练和恢复决定）。"],["适用与备注","周量怎样计入间接训练见[每周组数记录](02-weekly-plan.md#q52)。"],["来源","ACS
