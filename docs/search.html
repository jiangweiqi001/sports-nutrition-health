cs.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [运动相关胃肠症状联合立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12106582/)"]],"path":"book/distance-running-nutrition/02-before-the-race.md","aliases":"","grades":["C"]},{"id":271,"qid":"Q271","section":"营养","chapter":"长跑营养","question":"比赛前一天参加聚餐时，怎样从菜单选到熟悉、容易消化的主食，避免被一餐打乱整天安排？","title":"赛前聚餐，先点能估份量的熟悉主食","fields":[["怎么做","先看菜单里有没有吃过、能单独点的主食，例如米饭、面条、馒头或土豆。根据这顿在整天中的位置配一份，再搭平时能耐受的菜。如果上菜时间不确定，可以提前正常吃一餐，或者带一份熟悉的主食在回去后补。"],["成本","看菜单花几分钟，主食可提前单点。聚餐时可把调味很重或难估份量的菜放到少量尝试。"],["说人话","先把该吃的主食留够。聚餐推迟了，也有一份熟悉的食物能接上。"],["收益","赛事营养共识建议按比赛需要安排总碳水，并结合既往耐受选食物。用菜单选单独可估的主食，是把原则落到外食的做法。"],["证据等级","C（世界田联共识和外食示例）。"],["适用与备注","此前没试过的菜、酒和高油餐可留到赛后。赛前是否需要额外增加碳水看[首版赛前主食安排](../05-distance-running-nutrition.md#q25)。"],["来源","世界田联营养共识表 3，以及长距离跑者营养论文。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [长距离营养论文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers)"]],"path":"book/distance-running-nutrition/02-before-the-race.md","aliases":"","grades":["C"]},{"id":272,"qid":"Q272","section":"营养","chapter":"长跑营养","question":"能量胶标有葡萄糖和果糖或特定比例，这些配方差别什么时候值得普通全马跑者关注？","title":"先确定每小时总碳水，再决定要不要比较葡萄糖和果糖配方","fields":[["怎么做","把训练中每小时的碳水和胃肠反应记下来。每小时摄入中等且现在的产品能吃下去，可以继续用已试过的配方。想在较长时间的比赛里提高到每小时约 60 克以上时，可以比较含葡萄糖来源和果糖的产品，在相近长跑中试用，保留能稳定吃下去的一种。"],["成本","花一两次相近的训练比较，也可以核算每 20 克碳水的价格。"],["说人话","先把每小时实际吃进去的量算准。摄入较高时，再花时间比较糖的搭配。"],["收益","不同可转运碳水混用，在较高摄入速率下可提高外源碳水的利用，部分耐力试验观察到表现收益。早期直接比较有不少来自骑车研究。普通全马跑者的适宜比例取决于总量、食物组合和耐受。"],["证据等级","B（高摄入时的耐力试验，部分需要从骑车外推）。C（澳大利亚体育学院运动食品指导）。"],["适用与备注","配方比例应和全小时总量一起看。若胶、饮料同时使用，记录两者的碳水。"],["来源","澳大利亚体育学院能量胶指南的胃肠耐受部分，以及 Currell 与 Jeukendrup 的随机交叉骑车试验。 [澳大利亚体育学院能量胶指南](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-gels) · [骑车试验](https://research.birmingham.ac.uk/en/publications/superior-endurance-performance-with-ingestion-of-multiple-transpo/)"]],"path":"book/distance-running-nutrition/03-carbohydrates.md","aliases":"","grades":["B","C"]},{"id":273,"qid":"Q273","section":"营养","chapter":"长跑营养","question":"能量胶里的“每包碳水”和“每包糖”有什么区别，赛中记录应该用哪个数字？","title":"用每包总碳水记补给，糖已经包含在对应标签的碳水里","fields":[["怎么做","先看营养成分表是按每包、每份还是每 100 克标示。按每 100 克给出时，乘以吃掉的重量再除以 100。例如一包 40 克、标每 100 克含 60 克碳水，整包提供 24 克碳水。如果同一张表另列 15 克糖，就按对应基准看这一行，算赛中总碳水时直接用碳水化合物一行。"],["成本","第一次把每包碳水抄到补给表里。之后只要记实际吃了几包。"],["说人话","找「碳水化合物」那行，换算到吃掉的那包。不要把「糖」再加一次。"],["收益","碳水可以包含糖和淀粉类成分，例如麦芽糊精来源的可利用碳水。GB 28050—2025 自 2027 年 3 月 16 日实施。按旧版规则标示的产品可能没有单列糖，仍可用碳水化合物一行算补给。其他市场的标签可能采用不同定义。"],["证据等级","食品标签口径据官方标准。算式为示例。"],["适用与备注","如果营养表以每份为单位，先检查一包有几份。含较多糖醇或纤维的产品，按原标签定义并结合耐受判断。"],["来源","国家卫生健康委 GB 28050—2011 和 GB 28050—2025 问答中碳水、糖与标示说明，以及澳大利亚体育学院能量胶指南。 [2011 版标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml) · [2025 版标签问答](https://www.nhc.gov.cn/sps/c100087/202509/470fa4ff5de14dd38619223cce9da4e7.shtml) · [澳大利亚体育学院能量胶指南](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-gels)"]],"path":"book/distance-running-nutrition/03-carbohydrates.md","aliases":"","grades":[]},{"id":274,"qid":"Q274","section":"营养","chapter":"长跑营养","question":"后半程甜味喝腻了，怎么提前选一种不那么甜、仍便于核算碳水的备用补给？","title":"给后半程留一份不太甜、碳水算得清的备用补给","fields":[["怎么做","先选一种与常用胶口味不同、在跑步中也能吃的备选。例如低甜度运动食品、原味米饼或盐味脆饼。用包装标签或可靠成分资料估份量，再分成容易取用的小包。长跑后半程试着用它换掉一份常规补给，看看口感、咀嚼、取水和胃里是否都能接受。"],["成本","增加一次分装和一次训练演练。干食需要确认有水站或随身饮水。"],["说人话","备用品提前试。吃得下、拿得出、碳水记得清，就可以写进补给表。"],["收益","耐力赛事的碳水可来自饮品、运动食品和部分普通食物。世界田联强调按耐受和执行条件组合。低甜备选的价值取决于能否维持计划中的实际摄入。"],["证据等级","C（机构指南和备选食物示例）。"],["适用与备注","固体食物在高强度下更难咀嚼，先在训练中试。现做食品按存放温度和时间处理。"],["来源","世界田联营养共识表 3 与澳大利亚体育学院运动食品指南。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [澳大利亚体育学院指南](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-bar2/how-and-when-do-i-use-it)"]],"path":"book/distance-running-nutrition/03-carbohydrates.md","aliases":"越野固体补给 吃胶吃腻了 能量胶吃腻了 甜味","grades":["C"]},{"id":275,"qid":"Q275","section":"营养","chapter":"长跑营养","question":"赛前热身已吃了胶，怎样区分这份赛前摄入和起跑后按小时记的摄入？","title":"把起跑前吃的胶记在赛前栏，起跑后再计时","fields":[["怎么做","在补给表写一行「过起点前」，另开「0–60 分钟」和后续时段。例如赛前吃 20 克碳水，自己通过起点线后的第一小时吃胶 25 克、喝含碳水 10 克的饮料，比赛第一小时就是 35 克。记录当天总量时，再将赛前这 20 克计入。起跑延迟时，记实际进食和过线时间。"],["成本","一张纸或手机备忘录即可。用个人过线后的经过时间记，起跑分区不同也能照用。"],["说人话","赛前和赛中各记一栏。第一小时按真正跑起来之后吃的量算。"],["收益","世界田联表 3 将赛前餐和赛中供能分别列出。把时间段独立记下来，便于用同一口径比较训练和比赛。"],["证据等级","C（世界田联的赛前与赛中建议）。算式为示例。"],["适用与备注","赛前吃的胶仍属于当天摄入。计算咖啡因等成分的当天总量时，要把赛前和赛中相加。"],["来源","世界田联营养共识表 3。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [首版咖啡因核算](../05-distance-running-nutrition.md#q34)"]],"path":"book/distance-running-nutrition/03-carbohydrates.md","aliases":"","grades":["C"]},{"id":276,"qid":"Q276","section":"营养","chapter":"长跑营养","question":"冬天长跑时口渴感不明显，怎么利用训练记录安排取水，又避免按固定量硬喝？","title":"冬天长跑按相近天气的记录布置取水点","fields":[["怎么做","挑两次相近天气、跑速和穿衣的长跑，记跑前后体重、饮水量、时长，以及何时口渴。用相同秤、尽量相同且干燥的衣着。举例，跑前 65.0 公斤，跑后 64.5 公斤，途中喝 0.4 升、没有排尿，跑了 1.5 小时，估计出汗约 0.6 升/小时。用这个粗估找合适的取水点或准备容量，途中按口渴和实际天气调整。"],["成本","要多做几次称重并记饮水和排尿。冬天可选经过便利店或温暖休息点的路线。"],["说人话","冬天也可以出不少汗。先留出喝得到水的机会，再按那天的口渴和天气决定喝多少。"],["收益","运动出汗率会随环境、强度和衣着变化。用训练体重和饮水估算有助于个体化安排。低钠血症指南建议按口渴喝，或用个体估计避免摄入过多及跑后体重增加。"],["证据等级","C（补水立场和临床指南）。出汗率数值是演算。"],["适用与备注","完整估算要扣除运动中排出的尿量。粗估可用来做路线计划，仍应根据当次情况调整。"],["来源","美国国家运动防护师协会（NATA）补水立场表 2，以及荒野医学会运动相关低钠血症指南。 [NATA 补水立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC5634236/) · [运动相关低钠血症临床指南](https://journals.sagepub.com/doi/full/10.1016/j.wem.2019.11.003)"]],"path":"book/distance-running-nutrition/04-hydration-and-gut.md","aliases":"","grades":["C"]},{"id":277,"qid":"Q277","section":"营养","chapter":"长跑营养","question":"能量胶、泡腾片和运动饮料都写着含盐，怎么统一换算成毫克钠并加总？","title":"把胶、泡腾片和饮料里的钠换成同一单位再加总","fields":[["怎么做","各产品先记实际用了几包、几片或多少毫升，再换算成毫克钠。标签写普通盐或盐当量时，1 克约对应 400 毫克钠。例如一包胶标钠 60 毫克，半片泡腾片相当于钠 150 毫克，另喝标每 100 毫升含钠 30 毫克的饮料 200 毫升，当次合计 270 毫克钠。"],["成本","第一次看标签多花几分钟。可把常用产品每份的毫克数留在补给表里。"],["说人话","所有东西换成毫克钠再相加。同一产品的「盐」和「钠」往往是同一份信息。"],["收益","统一口径能看清每次训练实际摄入。每个人的出汗量和汗钠含量不同，表里算出的数只能说明吃了多少。"],["证据等级","盐与钠的换算来自官方标准。C（结合个人汗损安排补钠）。"],["适用与备注","只有包装标的是盐或盐当量，才用约 400 毫克/克换算。配料表上的柠檬酸钠、氯化钾等化合物重量不能用这个系数。"],["来源","国家卫生健康委 GB 28050—2025 问答、WHO 钠换算说明及 NATA 补水立场。 [国家卫健委问答](https://www.nhc.gov.cn/sps/c100087/202509/470fa4ff5de14dd38619223cce9da4e7.shtml) · [WHO 说明](https://www.who.int/zh/news-room/fact-sheets/detail/sodium-reduction) · [NATA 补水立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC5634236/)"]],"path":"book/distance-running-nutrition/04-hydration-and-gut.md","aliases":"","grades":["C"]},{"id":278,"qid":"Q278","section":"营养","chapter":"长跑营养","question":"长跑还没吃任何补给就反酸或想上厕所，怎么用跑前餐和症状记录找到可能的诱因？","title":"还没吃胶就反酸或想上厕所，先记跑前餐和症状开始时间","fields":[["怎么做","记最后一餐和咖啡的时间、份量、食物、开跑后的强度、天气与症状开始时间。找两次类似的训练，一次只改一项，例如把同一餐提前一点，或减少自己以前就容易不舒服的一种食物。把症状发生的时间和持续多久写下来。"],["成本","用手机记几次。连续不适时，记录也便于就医时说明情况。"],["说人话","先找什么时候开始不舒服，再试一个变化。把胶的问题和跑前已经有的症状分别记。"],["收益","运动相关胃肠症状可受持续时间、强度、环境和营养等多种因素影响。联合立场支持评估个人症状和诱因，单次训练难以确认具体原因。"],["证据等级","C（运动相关胃肠症状联合立场和记录示例）。"],["适用与备注","有便血、黑便、明显或持续腹痛，或在日常也反复发作时，应就医评估。"],["来源","澳大利亚运动营养师协会与超耐力运动科学基金会 2025 年联合立场。 [运动相关胃肠症状联合立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12106582/) · [NHS 便血就医说明](https://www.nhs.uk/symptoms/bleeding-from-the-bottom-rectal-bleeding/)"]],"path":"book/distance-running-nutrition/04-hydration-and-gut.md","aliases":"","grades":["C"]},{"id":279,"qid":"Q279","section":"营养","chapter":"长跑营养","question":"长跑时小腿容易抽筋，事先多补盐是否有用，怎么理解钠摄入和肌肉疲劳的证据？","title":"反复抽筋先查当次强度和既往发作，补盐按实际需要计划","fields":[["怎么做","记下抽筋发生的公里数、配速和地形，并与最近练过的时长和强度比较。也记天气、饮水、已用补给和过去是否在同一肌群抽过筋。下次先试更保守的起跑速度或渐进安排类似地形。平时确有较大汗损时，再和补水计划一起评估钠摄入。"],["成本","训练后记几项即可。没有必要先额外买盐丸试。"],["说人话","如果老在同一段或提速后抽，先从配速和准备查起。多吃盐没有稳定的预防证据。"],["收益","运动相关抽筋的证据综述指出，原因可能涉及疲劳和多种个体因素。铁人三项前瞻队列发现，较快比赛配速和抽筋史与发作相关，血钠变化和脱水程度未显示同样关系。"],["证据等级","B（前瞻观察及跨项目外推）。C（按记录调整训练和补给）。"],["适用与备注","抽筋时减速或停下，局部可以轻柔伸展。广泛抽筋或同时出现意识异常、晕厥等情况时，立即求助现场医疗。"],["来源","Miller 等运动相关抽筋综述，以及 Schwellnus 等的前瞻队列。 [证据综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC8775277/) · [前瞻队列](https://pubmed.ncbi.nlm.nih.gov/21148567/)"]],"path":"book/distance-running-nutrition/04-hydration-and-gut.md","aliases":"","grades":["B","C"]},{"id":280,"qid":"Q280","section":"营养","chapter":"长跑营养","question":"长跑后只顾补主食，怎么判断接下来几小时的饮水和随餐补钠也安排上了？","title":"长跑后随餐喝水，把钠和水放进同一份恢复计划","fields":[["怎么做","跑后正常就餐时，准备一份能分次喝的饮品，再看主食旁是否已有汤、调味菜等钠来源。出汗明显、下一次训练又很近时，参考同条件的体重和饮水记录规划补充，分几次喝。如果当天恢复时间充足，先用正餐和按口渴饮水逐步恢复。"],["成本","普通正餐加饮水即可起步。要估损失时再加跑前后称重。"],["说人话","吃饭时也记得喝。已经有含盐菜或汤，可以一并算进恢复安排。"],["收益","NATA 立场指出，恢复时间很短时更需要主动补液，饮食中的钠可协助补液和保留水分。恢复时间较长时，通常可通过随意进食和饮水恢复体液平衡。"],["证据等级","C（专业补水立场和随餐安排示例）。"],["适用与备注","有医嘱限水、限钠的人按个人方案。跑后出现意识异常、持续呕吐或严重头痛时，立即联系医疗人员，避免自行大量灌水。"],["来源","NATA 补水立场的运动后补液部分，以及[首版饮水安全条目](../06-training-health.md#q39)。 [NATA 补水立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC5634236/)"]],"path":"book/distance-running-nutrition/05-after-the-race.md","aliases":"","grades":["C"]},{"id":281,"qid":"Q281","section":"营养","chapter":"长跑营养","question":"全马完赛后的几天训练减少、食欲还在变，怎么把用餐逐步调回平时的节奏？","title":"全马后的几天，先找回三餐节奏，再按食欲和活动微调","fields":[["怎么做","比赛当天没胃口时，先分成小份，选能吃下的主食、奶或豆制品等熟悉食物。接下来几天恢复平时三餐的时间，每餐留主食和蛋白质来源。训练减少后，可先停掉专为比赛增加的运动食品，再按饥饿感、活动与胃肠反应调整分量。"],["成本","可用家里已有食物。提前留一份便于加热的饭和小加餐。"],["说人话","先把吃饭时间找回来。胃口小就分开吃，等恢复后再调分量。"],["收益","急性运动后短时间内，食欲及进食反应在不同人之间有差异。运动营养立场支持保证恢复期的能量和营养，具体几天何时调回平常份量缺少直接试验。"],["证据等级","B（急性运动后食欲研究，需外推到全马后数日）。C（恢复进餐示例）。"],["适用与备注","如果几天后仍吃不下、反复呕吐或无法正常饮水，寻求医疗评估。赛后第一餐见[首版赛后吃法](../05-distance-running-nutrition.md#q35)。"],["来源","Schubert 等急性运动后能量摄入荟萃分析，以及运动营养联合立场。 [荟萃分析](https://pubmed.ncbi.nlm.nih.gov/23274127/) · [运动营养联合立场](https://pubmed.ncbi.nlm.nih.gov/26920240/)"]],"path":"book/distance-running-nutrition/05-after-the-race.md","aliases":"","grades":["B","C"]},{"id":282,"qid":"Q282","section":"营养","chapter":"长跑营养","question":"连跑两个周末比赛时，怎样安排一周的正餐和加餐，减少来不及恢复和吃不惯的问题？","title":"两个周末都参赛，把第一场赛后和第二场赛前的餐提前定好","fields":[["怎么做","先把第一场结束后的饮水和正餐安排在可实际买到的地点。周一到周中按恢复情况维持三餐，把主食和蛋白质分配到各餐。第二场前，再按发枪时间和预计用时恢复试过的赛前、赛中方案。两个周末之间有旅行时，准备一份常温备用食物。"],["成本","一次采购可以覆盖两个周末。额外花费主要是交通途中备餐。"],["说人话","一周中间照常吃，两个周末的赛后和赛前分别列出来。"],["收益","运动营养立场支持赛后补充能量、碳水、蛋白质和液体，尤其在训练或比赛间隔短时。已有研究显示全马后的恢复有个体差异，现有证据无法把这份用餐安排当作再次参赛的许可。"],["证据等级","B（全马后恢复研究的外推）。C（运动营养立场与一周用餐示例）。"],["适用与备注","第二场是否参加或全力跑，应结合第一场负荷、日常活动是否恢复及有无症状。已有[赛后到下次训练的营养条目](../05-distance-running-nutrition.md#q36)可继续参考。"],["来源","运动营养联合立场、世界田联长距离营养论文，以及全马后恢复研究。 [运动营养联合立场](https://pubmed.ncbi.nlm.nih.gov/26920240/) · [世界田联长距离营养论文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers) · [全马恢复研究](https://pubmed.ncbi.nlm.nih.gov/33251988/)"]],"path":"book/distance-running-nutrition/05-after-the-race.md","aliases":"","grades":["B","C"]},{"id":283,"qid":"Q283","section":"营养","chapter":"长跑营养","question":"跑完后胃口回来但下一餐只能在便利店解决，怎样按标签搭一餐并留一份加餐？","title":"便利店解决赛后一餐，先凑齐主食、蛋白质和饮品","fields":[["怎么做","先选一份有主食的食物，再挑蛋白质来源和饮品。例如米饭团加常温奶和一份熟食蛋，或三明治加原味酸奶和水。看包装是每份、每包还是每 100 克，再估实际吃到的碳水和蛋白质。下一餐很晚时，多带一份香蕉、面包或其他能保存的熟悉食物。"],["成本","一般只需买几样食品。可比较每包价格和可食用份量。"],["说人话","先把一餐凑齐。还要在路上待很久，就顺手留一份能安全保存的加餐。"],["收益","运动营养立场支持长距离运动后补碳水、蛋白质及液体。标签能帮助估算包装食品提供的量，组合可按自己的胃口和下一餐时间调整。"],["证据等级","C（运动营养立场及便利店搭配）。标签算量按包装。"],["适用与备注","乳糖不耐时可用平时耐受的其他蛋白质食物。饭团、熟蛋和酸奶按包装温度要求存放。"],["来源","运动营养联合立场，以及 GB 28050—2011 第 6.1 条。 [运动营养联合立场](https://pubmed.ncbi.nlm.nih.gov/26920240/) · [GB 28050—2011 正文](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf)"]],"path":"book/distance-running-nutrition/05-after-the-race.md","aliases":"","grades":["C"]},{"id":284,"qid":"Q284","section":"营养","chapter":"长跑营养","question":"比赛结束当天还要长时间乘车，怎样预先安排沿途能买到的食物和饮品，又兼顾便携和保存？","title":"赛后要长时间乘车，提前定一顿饭、一个取水点和一份常温备用食物","fields":[["怎么做","把完赛、进站和到家时间列出来。赛场到车站有足够时间时，优先吃一份熟悉的正餐。行李里留能在常温安全保存的主食或小食，带密封饮品或确认途中取水点。需要冷藏的便当或奶制品，只有能全程保冷时才带，时间从离开冷藏开始计。"],["成本","提前查一眼营业时间和乘车规则。多备一份小食可应对延误。"],["说人话","路上有饭吃、有水喝，再留一样不怕晚点的备用食物。"],["收益","赛后进食需要兼顾碳水、蛋白质和液体。WHO 和 FDA 的食品安全指南对熟食与其他易腐食品的常温保存时间设有限制，长时间乘车时可优先选合适的常温包装。"],["证据等级","C（运动营养原则和行程安排示例）。食品保存依据官方指引。"],["适用与备注","饮水可分次按需要补。冷藏和常温保存条件按包装执行，需保冷时尽量保持约 4°C 或更低。"],["来源","运动营养联合立场、WHO 食品安全五要点及 FDA 户外食品安全指南。 [运动营养联合立场](https://pubmed.ncbi.nlm.nih.gov/26920240/) · [WHO 指南](https://www.who.int/docs/default-source/food-safety/five-keys-to-safer-food-poster/5keys-en.pdf) · [FDA 户外食品指南](https://www.fda.gov/media/79871/download)"]],"path":"book/distance-running-nutrition/05-after-the-race.md","aliases":"","grades":["C"]},{"id":285,"qid":"Q285","section":"健康","chapter":"训练相关健康","question":"平时久坐、没有不适，打算从快走开始，需要先做运动体检吗？","title":"没有不适、从快走开始，通常可以直接起步","fields":[["怎么做","平时久坐，没有已知心血管病、糖尿病或肾病，日常活动也没有不适，可以先从平地走路开始。选一段自己能走完的路。速度加到呼吸比平时快、仍能连续说话即可。先逐步增加走路时间，适应后再考虑走得更快。"],["成本","找一段方便走的路，按自己的时间安排。"],["说人话","从快走开始通常不必先买运动体检套餐。先走自己能坚持的距离。"],["收益","世界卫生组织建议久坐者从少量活动开始。没有运动禁忌的人，从不超过快走或日常生活强度的活动起步，通常无需先取得医疗许可。"],["证据等级","C（先从少量活动开始、通常无需运动前许可，是世界卫生组织和美国运动医学会的执行建议）。"],["适用与备注","适合准备从轻度到中等强度活动起步的成年人。有已知心血管病、糖尿病或肾病，或者走路、上楼时有胸部不适、异常气短、头晕或晕厥，先找医生评估。症状正在发生且明显时，停止活动并按当地急救指引求助。"],["来源","世界卫生组织 2020 年指南成人部分及表 3，美国运动医学会运动前筛查流程。 [WHO 指南全文](https://www.ncbi.nlm.nih.gov/books/NBK566046/) · [ACSM 筛查流程图（图 1）](https://stacks.cdc.gov/view/cdc/85628/cdc_85628_DS1.pdf)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":286,"qid":"Q286","section":"健康","chapter":"训练相关健康","question":"一直做轻中等强度活动，想开始冲刺或高强度间歇，哪些病史和用药情况值得先问医生？","title":"加入冲刺前，先用症状、病史和药单判断是否要问医生","fields":[["怎么做","先看过去几个月是否规律活动，想增加的是短间歇还是接近全力的冲刺。已有心血管病、糖尿病或肾病，打算从轻中等强度改到高强度时，先和医生确认。带上药物名称和剂量，尤其是影响心率的药和可能引起低血糖的药。问清可以从什么强度试起，怎样观察反应，哪些症状出现就该停。"],["成本","整理近期训练、病史和药单。有需要时预约就诊，原定高强度课可以等评估后再排。"],["说人话","能快走或慢跑，并不能说明现在适合全力冲刺。已经有病史、正在用药，或者近来运动时不舒服，先问清楚适合加到哪一步。"],["收益","美国运动医学会把当前活动水平、有无症状及已知疾病、目标强度一起考虑，帮助把医疗评估留给更需要的人。规律运动、没有相关疾病和症状的人，一般可逐步提高强度。"],["证据等级","C（运动前筛查和逐步加量依据美国运动医学会流程）。"],["适用与备注","开始加量时出现胸部压迫感、明显不合强度的气短、头晕或晕厥，应停止训练并求医。出现持续胸痛、昏倒或严重呼吸困难时，呼叫当地急救。原有药物按医嘱使用。"],["来源","美国运动医学会运动前筛查立场与流程，美国心脏协会和美国红十字会急救指南的胸痛及呼吸困难章节。 [筛查立场](https://pubmed.ncbi.nlm.nih.gov/26473759/) · [筛查流程图（图 1）](https://stacks.cdc.gov/view/cdc/85628/cdc_85628_DS1.pdf) · [急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":287,"qid":"Q287","section":"健康","chapter":"训练相关健康","question":"报名首马，赛事要求提交体检报告，该带哪些训练记录去做运动前评估？","title":"首马体检带赛事要求，也带一页训练和病史记录","fields":[["怎么做","先打开该场赛事的竞赛规程或领物通知，确认体检项目、报告有效期、机构要求和提交时间。就诊时说明是首个全马，带上规程和近期几周的每周跑量、最长一次训练的距离与用时、近来是否中断或加量。把训练中有无胸部不适、异常气短、晕厥或心悸，既往病史、家族心脏病史及正在用的药也告诉医生。"],["成本","整理一页训练摘要并按赛事规定留出检查和复诊时间。检查费用取决于赛事要求和临床需要。"],["说人话","赛事要什么材料，查这场的通知。医生还需要知道你实际跑了多少、跑时有没有不舒服，才能讨论是否适合参赛。"],["收益","赛事规程能确定材料要求。运动史、症状和家族史则能帮助医生判断有没有需要进一步评估的问题。上面的一页摘要是整理资料的办法，跑量数字本身不决定医疗许可。"],["证据等级","C（材料以赛事规程为准，医生评估所需信息依据运动医学筛查流程和体育心脏病学声明）。"],["适用与备注","用于确实要求体检材料的比赛。拿到报告后若新出现胸部不适、异常气短或晕厥，先评估再决定参赛。赛事审核通过和医生对参赛风险的判断分别确认。"],["来源","盐城市体育局公布的 2026 盐城马拉松部分跑者体检要求、美国运动医学会筛查流程、美国心脏协会与美国心脏病学会 2025 年声明的运动前心脏筛查章节。 [赛事要求示例](https://ycsports.yancheng.gov.cn/art/2026/3/19/art_3663_4412250.html) · [ACSM 筛查流程图（图 1）](https://stacks.cdc.gov/view/cdc/85628/cdc_85628_DS1.pdf) · [AHA/ACC 声明](https://pmc.ncbi.nlm.nih.gov/articles/PMC12145891/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":288,"qid":"Q288","section":"健康","chapter":"训练相关健康","question":"没有症状的人做静息心电图或运动负荷试验，分别能查到什么，什么情况下值得做？","title":"先问心电图要解决什么问题，再决定是否做","fields":[["怎么做","静息心电图是在安静时记录心脏电活动，可发现当时的心律或传导异常，也可能提供其他心脏问题的线索。运动负荷试验是在医护监测下逐步增加运动强度，观察运动时的症状、心率、血压和心电变化。没有症状、心血管风险低的成年人，一般无需为了预防心血管事件自行加做这两项筛查。若有运动时不适、已知心脏病或家族心脏病线索，先让医生按问题选择检查。"],["成本","静息心电图本身只需短时间，运动负荷试验需要预约和现场监测。异常结果还可能带来复查、额外费用和等待。"],["说人话","先问医生这项检查想查什么，结果会怎样改变下一步。一次结果正常，只说明当时那项检查的情况。"],["收益","把检查用在明确的临床问题上，有助于解释异常或判断下一步。对没有症状的低风险成人，常规静息或运动心电图筛查的潜在伤害达到或超过获益。对没有症状的中、高风险成人，USPSTF 认为现有证据不足以判断利弊。"],["证据等级","C（筛查建议依据 USPSTF 和体育心脏病学指南，适用人群不同）。"],["适用与备注","竞技运动员的系统筛查另有考虑。2025 年 AHA/ACC 声明认为，在有合适判读和转诊条件时可以纳入静息十二导联心电图，现有证据仍不足以支持给无症状竞技运动员常规加做运动负荷试验。赛事有指定项目时，按该场赛事规程办理。"],["来源","美国预防服务工作组心电图筛查建议、欧洲心脏病学会体育心脏病学指南、美国心脏协会与美国心脏病学会竞技运动科学声明。 [USPSTF 建议](https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/cardiovascular-disease-risk-screening-with-electrocardiography) · [ESC 指南](https://doi.org/10.1093/eurheartj/ehaa605) · [AHA/ACC 声明](https://pmc.ncbi.nlm.nih.gov/articles/PMC12145891/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":289,"qid":"Q289","section":"健康","chapter":"训练相关健康","question":"家里有人年轻时猝死或确诊遗传性心脏病，自己想参赛应提前咨询什么？","title":"家人年轻时猝死或有遗传性心脏病，参赛前带家族资料就诊","fields":[["怎么做","预约心内科，有条件可选熟悉运动或遗传性心脏病的门诊。写下是哪位家人、发病或去世年龄、当时是否在运动或睡眠、有没有明确病因。有诊断书、基因报告或尸检报告可带上。问清自己是否需要心电图、心脏超声或其他检查，家人已有明确遗传诊断时，再问是否需要遗传咨询和针对性检测。"],["成本","先整理家族资料并预约。检查项目和费用因情况而异，尽量在报名或进入高强度训练前留出评估时间。"],["说人话","“家里有人心脏不好”比较难判断。告诉医生谁、几岁、发生了什么，有报告就带报告。"],["收益","年轻亲属原因不明的猝死和家族已知的遗传性心脏病是两类重要线索。心律学共识支持在符合条件时评估一级亲属，也就是父母、同胞兄弟姐妹或子女。检查内容取决于家族线索及个人情况。"],["证据等级","C（家系评估和参赛前判断依据心律学共识与体育心脏病学科学声明）。"],["适用与备注","如果一级亲属年轻时原因不明地猝死，或家中已有明确的遗传性心脏病，先把冲刺、比赛等计划留到评估后决定。若自己曾在运动中晕厥，停止训练并尽快就医。一次普通体检或静息心电图正常仍有可能遗漏某些家族性疾病。"],["来源","亚太心律学会和心律学会关于原因不明猝死及家属调查的共识、美国心脏协会与美国心脏病学会竞技运动科学声明。 [APHRS/HRS 共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC8207384/) · [AHA/ACC 声明](https://pmc.ncbi.nlm.nih.gov/articles/PMC12145891/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":290,"qid":"Q290","section":"健康","chapter":"训练相关健康","question":"体检时偶尔量到血压偏高，怎样在家复测，什么结果值得在加大强度前就医？","title":"体检血压偏高，先按同一方法在家复测","fields":[["怎么做","选经准确度验证的上臂式血压计，袖带大小要合适。测前半小时避免运动、吸烟和喝含咖啡因饮料，排空膀胱，坐着安静休息至少 5 分钟。双脚平放、手臂有支撑并与心脏同高，测量时不说话。连续测 5–7 天，早上起床排尿后、早餐和服药前测，晚上睡前再测。每次测 2–3 遍，相隔约 1 分钟，记录全部数值。"],["成本","需要合适的血压计，早晚各留几分钟。就医时带原始记录、血压计型号和用药清单。"],["说人话","如果体检偶尔偏高，接下来几天在同样条件下测。量完记下每个读数，医生能看到平时的血压大约在哪个范围。"],["收益","规范家庭测量能辅助医生判断诊室外的血压。按我国基层指南，几天家庭测量的平均收缩压达到 135 mmHg 或平均舒张压达到 85 mmHg，就可带记录预约就诊，并在计划加到高强度前问清如何安排。训练强度还需结合症状、病史和血压控制情况评估。"],["证据等级","C（家庭测量和血压判读依据我国基层指南与卫生行业标准，运动前评估参考体育心脏病学指南）。"],["适用与备注","如安静复测仍有收缩压达到 180 mmHg 或舒张压达到 110 mmHg，暂停训练并尽快联系医疗机构。出现胸痛、明显呼吸困难、突然说话困难或单侧肢体无力时，立即呼叫急救，无需等待下一次测量。正在用药的人按医嘱服药。"],["来源","国家基层高血压防治管理指南 2025 版第 4、7 节，国家卫生健康委行业标准第 5 节，欧洲心脏病学会体育心脏病学指南的高血压章节。 [国内基层指南](https://cs.medjournals.cn/article/doi/full/10.3760/cma.j.cn112148-20250401-00234) · [卫生行业标准](https://www.nhc.gov.cn/fzs/c100048/202509/2f3f7cce449145f8b361e70b3ed4ae9a/files/WS%20T%20872%E2%80%942025-20250930105429913.pdf) · [ESC 指南](https://doi.org/10.1093/eurheartj/ehaa605)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":291,"qid":"Q291","section":"健康","chapter":"训练相关健康","question":"戴运动表发现晨起静息心率很低，什么时候要结合不适、用药和训练史评估？","title":"晨起心率比平时低，复测时一起记下症状和用药","fields":[["怎么做","先看手表显示的是整夜最低值，还是醒后安静时的读数。没有急症时，醒后安静坐一会，用食指和中指摸腕部拇指侧的脉搏，数满 60 秒，和手表读数及平时同条件记录对照。写下出现时间、近期耐力训练、用药或药量变化，以及当时有无头晕、异常乏力或运动耐量下降。"],["成本","复测和记一条记录只需几分钟。评估时带手表记录和药单，有需要时由医生选择心电图或后续监测。"],["说人话","练耐力的人静息心率可能偏低。平时一直较低、活动感觉如常，和最近才变慢、同时走路或跑步更吃力，是两种情况。"],["收益","对照本人平时的水平、症状和药物变化，能帮助医生判断低读数是否值得进一步查明。有些药会减慢心率，例如 β 受体阻滞剂，药物变化要一起报告。"],["证据等级","C（测脉、低心率临床评估和运动员判读参考心脏病学组织的资料与指南）。"],["适用与备注","醒后复测反复明显偏低或较自己平时下降，特别是没有长期耐力训练，或伴头晕、乏力、运动耐量下降时，先暂停高强度训练并就医。胸痛、昏厥或严重呼吸困难时立即呼叫急救。按医嘱用药，手表读数交给医生结合心电图和病史判断。"],["来源","美国心脏协会心率和测脉资料、ACC/AHA/HRS 心动过缓指南、AHA/ACC 竞技运动科学声明中关于运动员心动过缓的章节。 [测脉与就医线索](https://www.heart.org/en/health-topics/high-blood-pressure/the-facts-about-high-blood-pressure/all-about-heart-rate-pulse) · [临床指南](https://www.hrsonline.org/wp-content/uploads/2025/02/2018-ACC-AHA-HRS-Bradycardia-Full-Text.pdf) · [AHA/ACC 声明](https://pmc.ncbi.nlm.nih.gov/articles/PMC12145891/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":292,"qid":"Q292","section":"健康","chapter":"训练相关健康","question":"手表提示心律不齐，但自己没不舒服，该保留哪些记录、何时去核实？","title":"手表提示心律不齐，先保存发生时的记录","fields":[["怎么做","保存通知截图，记下日期、时刻、当时在休息还是运动、是否反复出现和有无症状。设备有心电图功能、当时又感觉如常时，可以按设备提示保存原始波形或导出的报告。即使自己没有不适，反复收到提醒、以前有心脏病或手上已有异常波形，都值得预约核实。单次提醒也可以把记录给医生看，询问是否需要检查。"],["成本","截图和记录通常几分钟。后续是否需要诊室心电图或动态心电监测，由医生结合记录决定。"],["说人话","把提醒本身带去，比转述“手表说不齐”更有用。临床需要看实际心电信号。"],["收益","把波形与活动、时间和症状对应起来，有助于医生判断是否需要进一步捕捉心律。根据房颤指南，光学脉搏提醒可以提示去做心电图，房颤的初次确诊需要专业人员判读心电信号。"],["证据等级","C（房颤确认方式和设备用途依据临床指南，整理记录是便于就诊的做法）。"],["适用与备注","如果心跳异常感伴胸痛、昏厥或严重呼吸困难，停止运动、立即呼叫急救，先处理症状。"],["来源","美国心脏病学会等机构 2023 年房颤指南的心律监测章节，美国心脏协会急症警示资料。 [房颤指南](https://www.jacc.org/doi/10.1016/j.jacc.2023.08.017) · [急症警示](https://www.heart.org/en/health-topics/heart-attack/warning-signs-of-a-heart-attack)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":293,"qid":"Q293","section":"健康","chapter":"训练相关健康","question":"体检报告提示心脏杂音或心电图异常，复诊时该问清哪些运动限制？","title":"报告写有杂音或心电图异常，复诊时问清暂时能练到哪一步","fields":[["怎么做","带体检报告、原始心电图波形、过往结果和用药清单就诊，说明平时训练的项目、频次和强度，有无胸部不适、运动中头晕或晕厥、异常气短，以及家族有没有年轻人猝死。问医生具体发现是什么、是否需要进一步检查、等待期间哪些活动可以继续、哪些强度或比赛要缓一缓、什么时候复评。"],["成本","通常先看原报告和病史。是否需要心脏超声、复查心电图或其他检查，要看具体发现。"],["说人话","报告上的“杂音”或“异常”范围很广。问明白是哪一种，以及复查前可以怎么活动。"],["收益","医生会合并考虑异常类型、体征、症状和家族史。其中一些心电图变化可见于长期训练，另一些需要进一步检查。有些杂音也需要通过心脏超声评估结构和瓣膜。"],["证据等级","C（复查与训练期间的风险判断依据体育心脏病学声明）。"],["适用与备注","等结果时按医生已明确的限制安排。如果还未问到、又要增加强度或参赛，先就诊确认。有运动中晕厥、胸部不适等线索时先暂停训练并及时评估。正在发生疑似心脏急症的胸痛、昏倒或严重气短时，立即呼叫急救。"],["来源","美国心脏协会与美国心脏病学会竞技运动科学声明，欧洲预防心脏病学协会关于运动员异常心电图的共识，美国心脏协会和美国红十字会急救指南。 [AHA/ACC 声明](https://pmc.ncbi.nlm.nih.gov/articles/PMC12145891/) · [异常心电图共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC12777699/) · [急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":294,"qid":"Q294","section":"健康","chapter":"训练相关健康","question":"刚参加完比赛就抽血，肌酸激酶或转氨酶异常时，怎样向医生说明训练背景？","title":"赛后抽血有异常，交给医生一张比赛和采血时间表","fields":[["怎么做","把比赛日期、距离、用时、天气、最近是否突然加量、采血离比赛结束多久记在报告上。告诉医生赛后有无异常肌肉疼痛、肿胀、无力、尿色或尿量变化，以及近期用的药和补剂。带上过去结果，问现在需要做什么、何时复查、复查前应怎样安排训练。"],["成本","整理原报告和比赛记录，通常几分钟。是否复查以及复查哪些项目，取决于数值、症状和临床检查。"],["说人话","告诉医生是跑完半天就抽血，还是几天后才抽。这个时间差会影响结果怎么解读。"],["收益","长距离跑后的观测研究记录到肌酸激酶（CK）可升高，也有研究观察到转氨酶变化。高强度举重后也有这种现象。说明训练背景有助于医生解释指标，同时考虑肌肉、肝脏或其他原因。"],["证据等级","B（指标变化依据赛前赛后观测和小样本运动试验，急症线索依据 CDC）。"],["适用与备注","剧烈运动后出现茶色或可乐色尿，或出现明显超出预期的肌痛、肿胀、无力，立即停止训练并尽快就医。若检验机构已通知危急值，也应按其通知及时处理。"],["来源","马拉松跑者采血研究、高强度举重后检验指标研究、美国 CDC 横纹肌溶解早期症状。 [马拉松研究](https://pubmed.ncbi.nlm.nih.gov/12472278/) · [举重研究](https://pubmed.ncbi.nlm.nih.gov/17764474/) · [CDC 就医线索](https://www.cdc.gov/niosh/rhabdo/signs-symptoms/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["B"]},{"id":295,"qid":"Q295","section":"健康","chapter":"训练相关健康","question":"体检尿检有异常，复查前该向医生说明哪些训练情况，并确认是否需要暂缓剧烈运动？","title":"尿检异常先问清查的项目，再按要求安排复查和训练","fields":[["怎么做","把尿常规报告和采样时间给医生看，说明距上次长跑、比赛或大重量训练多久、当时是否热、出汗和喝水情况，以及有无发热、尿痛、腰痛、尿色变化或经期。确认异常是尿潜血、尿蛋白还是别的项目，再问复查日期、留尿时段、是否取清洁中段尿、应提前多久避开剧烈运动。"],["成本","整理报告和采样前的活动记录，按需要复查。提早问好采样要求，可少跑一趟。"],["说人话","不同的尿检项目可能要在不同时间留样。报清楚上次是什么时候练的，再按医生给的采样要求做。"],["收益","剧烈运动会影响部分尿检结果。显微镜下血尿需要按规范留样并以镜检等方法核实，某些尿蛋白异常需要定量和复查。结合训练经过可以帮助解释结果，持续异常还需要评估原因。"],["证据等级","C（依据泌尿及肾脏指南的采样和复查建议）。"],["适用与备注","肉眼看到血尿应尽快就医。剧烈运动后出现茶色或可乐色尿，尤其伴明显肌痛、无力或尿量减少，停止训练并立即就医。别等常规复查，也不用靠大量喝水改变样本。"],["来源","美国泌尿外科学会与女性泌尿及尿动力学会 2025 年血尿指南采样章节、KDIGO 2024 年慢性肾脏病指南有关尿蛋白与采样的实践要点、美国 CDC 横纹肌溶解资料。 [血尿指南](https://www.auanet.org/documents/Guidelines/PDF/2025%20Guidelines/MH%20Unabridged%20FINAL.pdf) · [KDIGO 指南](https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf) · [CDC 就医线索](https://www.cdc.gov/niosh/rhabdo/signs-symptoms/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":296,"qid":"Q296","section":"健康","chapter":"训练相关健康","question":"体检发现骨密度偏低，去做运动评估前需要带哪些骨折史和训练信息？","title":"骨密度偏低，带原报告和完整骨折史讨论怎么练","fields":[["怎么做","带检测报告，确认用什么方法、测了哪里、报告写的是 T 值还是 Z 值，能找到以往报告也一起带上。列出骨折和骨应力损伤发生的部位、时间和当时在做什么，特别是从站立高度跌倒后骨折、椎体骨折或反复受伤。再记录近期跑跳和抗阻训练、跌倒、体重或月经变化，以及用药情况。问医生适合怎样开始抗阻、平衡和承重活动，跑跳或大重量该如何递进。"],["成本","先整理既有资料。若跌倒多、曾有椎体骨折或对动作拿不准，可由医生判断是否转介康复或物理治疗。"],["说人话","两个骨密度数字一样的人，若一个以前骨折过、另一个没有，起步训练可能不同。把受伤经过带去比只报分数更有用。"],["收益","骨密度需要结合测量方式、年龄、骨折史等来解读。根据骨折和跌倒风险安排抗阻、平衡及相应冲击水平，有助于选择适合自己的活动。"],["证据等级","C（骨密度解读和运动安排依据国际临床骨密度学会立场与骨质疏松运动共识）。"],["适用与备注","已有椎体骨折、多次低创伤骨折或明显跌倒风险的人，在自行增加负重或跑跳前先接受有针对性的评估。跌倒后有明显疼痛、不能承重或近期突然出现明显背痛时，先就医。"],["来源","国际临床骨密度学会成人立场、英国骨质疏松运动共识及英国骨质疏松临床指南。 [ISCD 立场](https://iscd.org/official-positions-2023/) · [运动共识](https://bjsm.bmj.com/content/56/15/837) · [临床指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC12417299/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":297,"qid":"Q297","section":"健康","chapter":"训练相关健康","question":"智能体脂秤和手表的体能估计随日波动，哪些数据适合看趋势，哪些异常要用临床测量核实？","title":"用体重和训练表现看趋势，给体脂率和体能估计留误差","fields":[["怎么做","观察体重时用同一台秤，在接近的时段和条件称重，多看几次平均。智能秤的体脂率受测量方法和身体水分影响，可标记条件，波动大时把重点放回体重和训练表现。手表估计的最大摄氧量可以和一段时间同路线、同配速下的体感一起看，避免把热天、坡道或换设备前后的读数直接相减。"],["成本","用现有设备和训练日志即可。是否需要临床体成分测量或心肺运动试验，取决于具体医学问题。"],["说人话","秤和手表上的体脂率、体能分数都是估出来的。一次跳动先看看测量条件，实际活动变困难时优先处理这个变化。"],["收益","对照研究中，受测智能秤量体重比估体脂准确。手表估计最大摄氧量的误差随设备和条件变化，群体平均结果也不能直接套到个人。重复同条件记录更便于判断一个变化是否值得追踪。"],["证据等级","B（消费设备的准确度来自对照测量研究和验证研究综合）。"],["适用与备注","体重持续出现不明原因的明显变化、运动耐量下降或活动时反复不适，向医生说明实际变化，可以同时带设备记录。别用家用估值诊断体成分异常或判断心肺疾病。"],["来源","Frija-Masson 等智能秤与双能 X 线吸收测量的对照研究、INTERLIVE 关于消费可穿戴设备估计最大摄氧量的验证综述与立场。 [智能秤研究](https://mhealth.jmir.org/2021/4/e22487/) · [INTERLIVE 研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC9213394/)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["B"]},{"id":298,"qid":"Q298","section":"健康","chapter":"训练相关健康","question":"上次体检没问题，几个月后运动能力明显下降，为什么还值得重新评估、该记录哪些变化？","title":"运动能力明显下降时，带上以前能做到和现在做不到的例子","fields":[["怎么做","记下变化从哪天开始、是突然还是逐渐下降、哪些熟悉活动能看出差异。例如同一段楼梯原来能连续走上去，现在走半段就得停，或相同轻松配速变得明显吃力。再记伴随症状、持续多久、休息后是否恢复，近期疾病、药物变动和训练中断也带上。若反复发生、明显影响日常活动或原因不明，预约就医并先暂缓原定的高强度训练。"],["成本","整理几条已有记录和旧报告。医生根据症状决定从哪些检查开始。"],["说人话","上次体检反映的是当时。现在连原本很轻松的活动都更费劲，就把这个变化告诉医生。"],["收益","描述近期变化可帮助评估实际运动耐量。异常气短等症状有多种可能原因，医生可以结合病史和检查决定需要进一步看什么。"],["证据等级","C（对运动耐量下降和运动性气短的评估依据体育心脏病学声明和呼吸学会声明）。"],["适用与备注","请用已有记录说明，避免靠冲刺重现不适。突然胸痛、晕厥、明显呼吸困难或症状在静息时也很严重，立即呼叫急救。"],["来源","美国心脏协会与美国心脏病学会竞技运动科学声明、美国胸科学会呼吸困难评估声明、美国心脏协会和美国红十字会急救指南。 [AHA/ACC 声明](https://pmc.ncbi.nlm.nih.gov/articles/PMC12145891/) · [ATS 声明](https://academic.oup.com/ajrccm/article/185/4/435/8508218) · [急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/01-screening.md","aliases":"","grades":["C"]},{"id":299,"qid":"Q299","section":"健康","chapter":"训练相关健康","question":"一晚没睡够，原定的长跑或大重量训练当天该怎么取舍？","title":"一晚没睡好，先看清醒程度，再决定要不要练重","fields":[["怎么做","明显犯困、走神或平衡感不稳时，把长跑、接近极限的重量和高技术动作改到睡好后。精神尚可、热身动作和轻松配速与平时相近时，可以做熟悉的短程轻松跑或较轻的力量训练。热身已经明显吃力或动作变形，就缩短或结束，余下训练不用当天补完。"],["成本","调换一堂课，或者少做一些组数、里程。次日根据实际恢复重新安排。"],["说人话","先用轻松热身了解今天状态。动作和专注都掉下来了，今天就少练一点。"],["收益","急性睡眠不足的综合研究发现，平均运动表现会下降，影响随睡眠损失方式和项目变化。当天降低目标是管理训练的办法，每个人的反应仍需要看当天。"],["证据等级","B（表现变化有综合研究，具体换课办法是实践安排）。"],["适用与备注","困到难以保持清醒时，避免开车去训练，也先跳过需要高度专注或保护的项目。胸痛、晕厥等症状按急症求助。"],["来源","急性睡眠不足与运动表现系统综述、运动员睡眠共识、美国国家公路交通安全管理局疲劳驾驶说明。 [表现研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC9584849/) · [运动员睡眠共识](https://bjsm.bmj.com/content/55/7/356) · [疲劳驾驶说明](https://www.nhtsa.gov/risky-driving/drowsy-driving)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["B"]},{"id":300,"qid":"Q300","section":"健康","chapter":"训练相关健康","question":"连续几周因工作睡不够，怎么调整一周训练和作息，什么时候需要寻求帮助？","title":"连续几周睡不够，先减掉挤占睡眠的训练","fields":[["怎么做","把下周能留给睡眠的时段先写进日程。在最忙的几天用短一点的轻松活动替换长课，尤其把晚归后仍要硬塞进去的重课移走。更长或更重的训练优先留给睡眠较足的日子。连续记录一周睡眠时间、白天困倦和训练体感，等作息与状态恢复后再逐步加量。"],["成本","每晚少占用一点休息时间，或暂时降低训练总量。一天记录一两分钟。"],["说人话","忙到睡不够时，先让训练计划给睡觉腾地方。练得少一点的那几天，也算维持习惯。"],["收益","成人睡眠共识建议平时每晚至少睡 7 小时，多数人还需根据日间状态安排睡眠。把最耗时的课避开短睡日，能直接腾出睡眠机会，也有助于看清疲劳是否随作息改善。"],["证据等级","C（睡眠时间及关注日间状态依据医学共识，周训练调整为实践办法）。"],["适用与备注","给足睡眠机会后仍睡不着、反复躺够仍困，或睡眠问题已经影响工作、安全与日常生活时，带记录就医。困到难保持清醒时别开车。"],["来源","美国睡眠医学会与睡眠研究学会成人睡眠共识、运动员睡眠共识、美国 CDC 睡眠与就医资料。 [成人睡眠共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC4434546/) · [运动员睡眠共识](https://bjsm.bmj.com/content/55/7/356) · [CDC 睡眠资料](https://www.cdc.gov/sleep/about/)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["C"]},{"id":301,"qid":"Q301","section":"健康","chapter":"训练相关健康","question":"轮班或通宵后想保持运动习惯，怎么选择训练时段，避免挤掉睡眠？","title":"夜班后先留出一段主睡眠，把训练移到醒后","fields":[["怎么做","下夜班后先安排安全回家和睡觉，把回家后的主要睡眠时段留出来。醒来后清醒、活动感觉如常，可以从散步、轻松跑或较短的抗阻训练开始。需要全神贯注的重课尽量放在睡过且清醒的时段。连续轮班时，在班表上先圈好每班后的睡眠机会，再给训练留一个可移动的时段。"],["成本","和同住的人协调白天安静时段。拉窗帘、关掉会打扰睡眠的提醒，同样能减少中途被叫醒。"],["说人话","刚下夜班有空，不代表适合马上去练。先睡，起来再看状态。"],["收益","轮班指南把增加睡眠机会、管理困倦列为应对轮班疲劳的方法。把训练放在主睡眠之后，可以防止训练挤掉原本能睡的时间。"],["证据等级","C（轮班睡眠依据职业健康资料和睡眠学会指导，训练放在哪段由个人班表决定）。"],["适用与备注","下班路上已经困得难保持清醒时，尽早安排由别人开车或用其他交通方式。反复严重困倦、白天怎么安排都睡不好时，可咨询职业健康或睡眠门诊。"],["来源","美国 CDC/NIOSH 夜班睡眠课程，美国睡眠医学会与睡眠研究学会轮班指导，美国国家公路交通安全管理局资料。 [NIOSH 夜班睡眠](https://www.cdc.gov/niosh/work-hour-training-for-nurses/longhours/mod9/05.html) · [轮班指导](https://pmc.ncbi.nlm.nih.gov/articles/PMC8636361/) · [疲劳驾驶说明](https://www.nhtsa.gov/risky-driving/drowsy-driving)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["C"]},{"id":302,"qid":"Q302","section":"健康","chapter":"训练相关健康","question":"晚上练完太兴奋、入睡变晚，怎样比较结束时间、强度和睡眠的关系？","title":"夜练后入睡晚，先单独调整结束时间或强度","fields":[["怎么做","先记几次训练结束时间、时长和主观强度，再记上床时间、估计入睡用了多久及次日精神。先把同样的训练提前几次，其他习惯尽量相近。时间实在挪不了，就保留原时段、把该堂课改轻一些，再比较。把晚咖啡、夜宵、通勤或屏幕使用的明显变化也记下。"],["成本","一条简短日志和几次调整。夜间统一停练的时间不必先设定。"],["说人话","你可能对结束太晚、练得太猛，或两个同时发生更敏感。一次只改一个条件，比较起来更容易。"],["收益","大型可穿戴设备研究发现，越接近睡觉、负荷越高的训练与入睡推迟等变化相关。一项小型对照研究中，耐力跑者在睡前约 3.5 小时结束的高强度课没有扰乱睡眠。结合自己的作息比较更有实际意义。"],["证据等级","B（辅以大型观察性数据和小型对照研究，个人记录无法单独证明因果）。"],["适用与备注","如果睡眠变化只偶尔出现，可以继续观察。长期入睡困难或日间表现明显受影响，建议带日志就医。"],["来源","Leota 等晚间训练与睡眠观察研究，Thomas 等耐力跑者晚间训练对照研究。 [晚间训练观察研究](https://www.nature.com/articles/s41467-025-58271-x) · [跑者对照研究](https://link.springer.com/article/10.1007/s00421-019-04280-w)"]],"path":"book/training-health/02-sleep.md","aliases":"晚练后难入睡","grades":["B"]},{"id":303,"qid":"Q303","section":"健康","chapter":"训练相关健康","question":"为了晨练每天提早起床，怎样判断是不是在用睡眠换训练？","title":"为晨练提早起床，用一周记录看睡眠有没有跟着提前","fields":[["怎么做","把晨练日和其他日的入睡、起床时间和白天精神记一周，并比较同样轻松训练的体感。若晨练日长期少睡，先试着把上床时间移早，确认自己也能实际早睡。若晚间事务让入睡时间挪不动，把晨课改短、减少晨练日或移到午间、傍晚。"],["成本","每天粗略记录一分钟，并调动一两次晨课。一般无需买设备。"],["说人话","闹钟提前不等于睡觉也提前。把自己真正睡了多久、下午是不是老犯困一起看。"],["收益","运动员的实地研究发现，较早的训练开始时间往往伴随睡眠缩短与训前疲劳。直接在自己的日程上比较，有助于找到既能保持睡眠又能持续运动的时段。"],["证据等级","B（早练与短睡来自运动员实地观测，普通成人可据此检查自己的日程）。"],["适用与备注","晨练后状态正常且睡得足，照常安排即可。若早起是比赛要求，可选择性练习比赛时段，让前夜也有相应睡眠机会。"],["来源","Sargent 等运动员训练时间与睡眠的实地研究、成人睡眠医学共识。 [运动员研究](https://pubmed.ncbi.nlm.nih.gov/25222347/) · [成人睡眠共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC4434546/)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["B"]},{"id":304,"qid":"Q304","section":"健康","chapter":"训练相关健康","question":"下午犯困又打算晚上训练，午睡放在什么时候，怎么观察对夜间睡眠的影响？","title":"午后困又想夜练，把短午睡放早一点试","fields":[["怎么做","有条件时在午后较早的时段试一次约 20 分钟的短午睡，留出醒透和恢复专注的时间。当天记下午睡时段、起床后的精神、夜里是否更难入睡。若一连几次夜睡推迟，试着把午睡往前移、缩短或取消。"],["成本","约 20 分钟的安静时段，加上醒后缓一会儿。是否真正睡着可以粗略记。"],["说人话","先试早一点的小睡。睡醒还迷糊，就缓一会儿再上器械或出门。"],["收益","小型运动试验中，午睡能改善部分短睡运动员的警觉或某些表现。每个人夜间反应不同，普通成人的短午睡可以先从容易执行的时长试起。"],["证据等级","B（运动表现线索来自小型试验，短且较早的小睡参考 NIH 的一般成人建议）。"],["适用与备注","轮班者应按主睡眠和班表安排。若经常需要午睡才能保持清醒，夜里也有充足睡眠机会，可带日志就医。"],["来源","美国 NIH/NHLBI 健康睡眠习惯、运动员短睡后午睡交叉试验。 [NHLBI 指引](https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits) · [运动员试验](https://pubmed.ncbi.nlm.nih.gov/32023544/)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["B"]},{"id":305,"qid":"Q305","section":"健康","chapter":"训练相关健康","question":"赛前一晚紧张睡不好，比赛早上怎样看当天的状态和参赛选择？","title":"赛前一晚没睡好，起床后按清醒程度和热身决定目标","fields":[["怎么做","先看起床后能否保持清醒、走路和做熟悉动作是否稳当。有把握时按平时方式进食、喝水和热身，起跑用保守配速，保留降速或退出的余地。若严重困倦、无法专注，或热身中出现平时没有的明显不适，先取消强度目标，必要时放弃参赛并找现场医疗人员。"],["成本","预留热身和判断时间。可能需要下调成绩目标或调整往返交通。"],["说人话","昨夜紧张睡不着很常见。起床后看能不能集中注意，热身看动作和体感，再定今天怎么跑。"],["收益","运动员调查发现赛前紧张和思虑常与入睡困难同时出现。急性睡眠不足平均会影响运动表现，但对单人单场的影响难以预判，用状态和热身调整是实务判断。"],["证据等级","B（赛前睡眠情况来自调查，短睡影响来自表现研究综合）。"],["适用与备注","困得难以保持清醒时不要驾车。若出现胸部不适、晕厥或严重呼吸困难，立即停止并向现场医护或急救系统求助。"],["来源","Juliff 等赛前睡眠调查、急性睡眠不足与运动表现系统综述、美国国家公路交通安全管理局疲劳驾驶资料。 [赛前调查](https://pubmed.ncbi.nlm.nih.gov/24629327/) · [表现研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC9584849/) · [疲劳驾驶说明](https://www.nhtsa.gov/risky-driving/drowsy-driving)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["B"]},{"id":306,"qid":"Q306","section":"健康","chapter":"训练相关健康","question":"跨时区参加比赛，落地后怎么安排作息和轻松训练？","title":"跨时区参赛，先按当地时间排睡眠和轻松活动","fields":[["怎么做","如果待到比赛结束需要在当地生活几天，落地前先把比赛时间、用餐、主睡眠和起床时段按目的地时间列好。抵达后前几次以散步或短而轻松的训练为主，按清醒程度调整。尽量留下适应时间。跨得较远时，日光安排要看向东或向西以及跨几个时区，可参考旅行医学资料按行程细化。"],["成本","预留落地适应时间，或把原本的高强度课移到出发前。赛前短程出差不必强行按同一种办法安排。"],["说人话","先把当地几点睡、哪天比赛写出来。落地先做轻松的，精神和胃口跟上后再考虑强度。"],["收益","旅行医学指南把目的地作息和按方向调整光照作为处理时差的办法。运动员共识指出，抵达后短而轻松的活动便于适应，最佳训练或光照方案还缺少针对运动员的充分试验。"],["证据等级","C（出行和训练安排依据旅行医学指南和运动员时差共识）。"],["适用与备注","若行程只有很短的停留，需结合赛时、能睡的时段和返程考虑是否保留原作息。勿在赛前临时试用陌生助眠药。严重困倦时避免驾车或勉强上强度。"],["来源","美国 CDC《黄皮书》时差障碍章节、Janse van Rensburg 等运动员旅行疲劳与时差共识。 [CDC 旅行医学资料](https://www.cdc.gov/yellow-book/hcp/travel-air-sea/jet-lag-disorder.html) · [运动员时差共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC8279034/)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["C"]},{"id":307,"qid":"Q307","section":"健康","chapter":"训练相关健康","question":"运动手表说深睡很少，但白天状态正常，该相信哪些睡眠信号？","title":"手表说深睡少，先看平时睡多久、白天困不困","fields":[["怎么做","先看一周左右的上床、起床时间和估计总睡眠，再对照白天有没有频繁打瞌睡、注意力下降，或夜里有没有经常醒、被人发现打鼾憋气。白天状态如常时，可把单晚的深睡分钟数放下。若想带数据给医生，可选有代表性的几晚，同时写下自己的感受和作息。"],["成本","查看已有记录或用简单日志，无需新买手表或另订一项检测。"],["说人话","深睡分钟数是手表根据传感器信号估出来的。每天几点睡、睡了大概多久、白天是否清醒，更值得先看。"],["收益","用多导睡眠监测作对照的研究发现，消费设备辨认具体睡眠阶段的表现随设备和阶段而异。把日常记录与实际症状一起看，可以减少对单晚分数的依赖。"],["证据等级","B（睡眠阶段差异来自设备对照验证，临床应用参考 AASM 专业声明）。"],["适用与备注","如果持续日间困倦、反复憋醒或夜间睡眠受影响，带记录就医。消费手表正常也不足以排除睡眠障碍。"],["来源","Chinoy 等七款设备与多导睡眠监测的验证研究、美国睡眠医学会关于消费睡眠技术的立场。 [设备验证](https://pubmed.ncbi.nlm.nih.gov/33378539/) · [AASM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC5940440/)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["B"]},{"id":308,"qid":"Q308","section":"健康","chapter":"训练相关健康","question":"睡够了仍常常打瞌睡，或者打鼾憋醒，什么时候该评估睡眠呼吸暂停？","title":"睡够还常打瞌睡或反复憋醒，预约睡眠评估","fields":[["怎么做","如果留了足够睡眠时间，白天仍反复打瞌睡，或者常大声打鼾、憋醒、被看到睡觉时呼吸中断，预约全科、呼吸科或睡眠门诊。记录一周左右的睡眠和困倦情况，最好注明开车或工作时是否打过瞌睡。有同住者观察到的呼吸异常，也可以转述给医生。"],["成本","先做临床询问。是否要做多导睡眠监测，或适合做规范的家庭睡眠呼吸监测，由医生决定。"],["说人话","躺得久也可能没睡好。有人看到你在打鼾时突然停住或你自己反复憋醒，值得说给医生听。"],["收益","根据睡眠医学指南，日间嗜睡、响亮鼾声、夜间憋气或他人目击的呼吸暂停，都能帮助医生判断是否考虑阻塞性睡眠呼吸暂停及如何检查。"],["证据等级","C（症状评估和检查选择依据成人阻塞性睡眠呼吸暂停诊断指南）。"],["适用与备注","问卷或手表只能提供线索。若白天已经困到难保持清醒，避免开车或进行需要持续警觉的活动，并尽快就诊。"],["来源","美国睡眠医学会成人阻塞性睡眠呼吸暂停诊断指南、美国国家公路交通安全管理局疲劳驾驶资料。 [诊断指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC5337595/) · [疲劳驾驶说明](https://www.nhtsa.gov/risky-driving/drowsy-driving)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["C"]},{"id":309,"qid":"Q309","section":"健康","chapter":"训练相关健康","question":"长期入睡难或夜里总醒，如何用睡眠记录帮助医生评估？","title":"反复入睡困难或夜醒，把一到两周睡眠记录带去就诊","fields":[["怎么做","每天早晨估记上床、熄灯、入睡用时、夜间醒来次数和大致清醒时间、最终醒来和起床时间，再一并记下午睡、咖啡或酒精、训练时间和次日困倦。能记一到两周时把工作日与休息日都覆盖。若问题已经明显影响日常，可先约诊并边等边记录。"],["成本","每天几分钟。用纸或手机备忘录即可，时间可以估计。"],["说人话","醒来后回顾一下即可。半夜老看钟会让有些人更焦虑，也没必要追求每分钟都准确。"],["收益","睡眠日志能帮医生看到困难发生在入睡、夜里、早醒还是作息不齐，以及它对白天的影响。确诊慢性失眠后，可以和医生讨论失眠认知行为治疗（CBT-I）。"],["证据等级","C（日志用于评估依据临床机构说明，CBT-I 依据睡眠医学临床指南）。"],["适用与备注","大声打鼾、反复憋醒或睡前腿部不适也记进去，医生可能需要评估其他睡眠问题。长期困倦影响行车时先安排安全交通。"],["来源","美国 NIH/NHLBI 失眠诊断与日志建议、美国睡眠医学会成人慢性失眠行为治疗指南。 [NHLBI 诊断资料](https://www.nhlbi.nih.gov/health/insomnia/diagnosis) · [AASM 治疗指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC7853203/)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["C"]},{"id":310,"qid":"Q310","section":"健康","chapter":"训练相关健康","question":"夜跑后腿里难受、躺下老想动，哪些信息值得记下并带去就医？","title":"夜跑后躺下总想动腿，记下静止和走动时的差别","fields":[["怎么做","记下不适出现的时段、具体部位和感觉，是抽痛、痒麻还是想动腿。观察是躺下或久坐时更明显，还是跑动中就有，起身走动是否暂时缓解。也记几次没有夜跑的晚上，以及训练强度、咖啡因、新用药和对睡眠的影响。反复发生或妨碍睡觉时带记录就医。"],["成本","记几条有代表性的情况。医生如需化验铁指标或检查其他原因，会按个人情况安排。"],["说人话","躺着越难受、一走就好一些，与固定部位跑起来痛、或突然抽筋，描述起来是不同的线索。"],["收益","不宁腿综合征主要通过病史评估，静止时加重、走动暂缓和傍晚更明显是常见线索，肌肉痛、抽筋等也可能类似。完整描述有助于医生判断下一步。"],["证据等级","C（症状识别、需要时评估铁状态依据睡眠医学会指南）。"],["适用与备注","不要自行补铁或停药。如果一侧小腿突然出现疼痛和明显肿胀，及时就医。若同时胸痛或呼吸困难，立即呼叫急救。"],["来源","美国睡眠医学会不宁腿临床指南及诊断标准，美国 NIH/NHLBI 静脉血栓症状资料。 [AASM 临床指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC11701286/) · [AASM 诊断标准](https://aasm.org/wp-content/uploads/2026/02/quality-measures-restless-legs-RLS-AASM-2025.pdf) · [NHLBI 血栓警示](https://www.nhlbi.nih.gov/venous-thromboembolism/symptoms)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["C"]},{"id":311,"qid":"Q311","section":"健康","chapter":"训练相关健康","question":"比赛结束那晚睡不踏实，第二天恢复活动怎么安排，哪些异常值得留意？","title":"比赛当晚睡不踏实，第二天从休息或轻松走路选起","fields":[["怎么做","起床先看清醒程度、走路是否正常、肌肉疼痛和尿色。如果只是没睡好或有可预期的酸痛，日常走动没有问题，可以短时间散步，累就休息，把高强度和长距离训练往后调。正常吃饭，按口渴和日常需要补水，当晚尽量留出平时的睡眠时段。"],["成本","少一堂高强度课，给睡眠和休息留时间。恢复活动用散步等熟悉方式即可。"],["说人话","睡差一夜，第二天用轻松走路看看状态。走路也明显不舒服，就先休息并判断需不需要看医生。"],["收益","竞技运动员的观察研究发现，比赛后睡眠可能短于相应训练后。马拉松恢复建议通常从轻活动考虑，恢复多快取决于比赛负荷和个人状态。"],["证据等级","C（恢复选择参考运动医学机构实务建议，赛后睡眠变化来自小样本观察）。"],["适用与备注","明显超出平常的肌痛、肿胀、无力或茶色尿，尽快就医。胸痛、晕厥、意识异常或严重呼吸困难，立即呼叫急救。"],["来源","竞技运动员赛后睡眠研究、UCLA Health 运动医学恢复资料、美国 CDC 横纹肌溶解就医线索和 AHA/红十字会急救指南。 [赛后睡眠研究](https://pubmed.ncbi.nlm.nih.gov/29482452/) · [马拉松恢复资料](https://www.uclahealth.org/news/article/how-recover-after-running-marathon) · [CDC 就医线索](https://www.cdc.gov/niosh/rhabdo/signs-symptoms/) · [急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["C"]},{"id":312,"qid":"Q312","section":"健康","chapter":"训练相关健康","question":"总是周末补觉才能撑完训练周，怎么用一周作息和日间状态找出问题？","title":"周末总靠补觉撑过去，先找工作日少睡的时段","fields":[["怎么做","一周里每天记估计的入睡和起床时间、是否靠闹钟起、午睡和白天困倦，并标上重课、加班与轮班。对照工作日和休息日，看是固定被晨练叫早、晚练或工作拖晚，还是留了时间却睡不好。下一周先把最常出现的一处时间冲突移开，再看白天状态。"],["成本","每天记一两分钟，改一个工作日安排。若连着几周都受排班限制，也可把记录带去讨论调整。"],["说人话","周末多睡说明可能平时没睡够。找出哪几天少睡、为何少睡，比盯一周的平均小时数更容易改。"],["收益","睡眠的时间、规律和日间状态都值得记录。短期实验中，周末自由补觉未能防止反复短睡对部分代谢指标的影响。周末睡长一些可能帮助当时恢复，重排工作日能直接增加平时的睡眠机会。"],["证据等级","B（补觉的代谢结果来自控制实验，作息记录参考睡眠医学共识）。"],["适用与备注","如果平日也给足了睡眠机会、还是常靠补觉或白天反复犯困，带作息记录做评估。避免困倦驾驶。"],["来源","Depner 等反复短睡和周末补觉的随机实验、AASM/SRS 成人睡眠共识、美国 NIH/NHLBI 健康睡眠资料。 [周末补觉实验](https://pubmed.ncbi.nlm.nih.gov/30827911/) · [成人睡眠共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC4434546/) · [睡眠习惯](https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits)"]],"path":"book/training-health/02-sleep.md","aliases":"","grades":["B"]},{"id":313,"qid":"Q313","section":"健康","chapter":"训练相关健康","question":"跑完半马或全马几天后仍明显乏力、头晕或不想吃饭，怎样记录症状并判断何时就医？","title":"半马或全马后仍明显不适，先停练并记录症状","fields":[["怎么做","赛后几天仍明显乏力、头晕或难以正常进食，先暂停跑步，记下比赛日期和距离、天气、症状何时开始和是否在改善、能吃喝多少、尿量和尿色、肌肉痛的部位和严重程度。症状持续没有改善、影响正常吃喝或日常活动，联系医疗机构评估。尿液呈茶色或可乐色、尿量明显减少、站起后头晕不缓解、反复呕吐或肌肉疼痛远超平时，尽快就医。"],["成本","低。手机备忘录就够，记录可以在等候就医时补充。"],["说人话","赛后恢复的速度因人而异。站起来晕不晕、吃得下多少、尿量有没有变，比还差几天恢复更值得关注。"],["收益","留下可供医生判断的经过，更早识别需要评估的问题。"],["证据等级","C。赛后安排来自运动医学指导，危险信号来自脱水及运动后横纹肌溶解临床指导。"],["适用与备注","适用于半马、全马等耐力赛后。新发急性胸痛、严重呼吸困难、意识异常或倒下后不能正常回应，立即呼叫急救。"],["来源","[UCLA Health 运动医学马拉松恢复指南](https://www.uclahealth.org/news/article/sports-medicine-guide-marathon-recovery) · [CDC 横纹肌溶解症状和就医建议](https://www.cdc.gov/niosh/rhabdo/signs-symptoms/index.html) · [NHS 脱水就医信号](https://www.nhs.uk/conditions/dehydration/) · [AHA 与美国红十字会急救指南（2024）](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["C"]},{"id":314,"qid":"Q314","section":"健康","chapter":"训练相关健康","question":"持续疲劳除了训练安排，还可能和哪些健康问题有关，去评估前要记录什么？","title":"持续疲劳，带上症状和训练记录去评估","fields":[["怎么做","记录疲劳开始于哪天、和训练或最近感染有没有先后关系、休息后是否缓解，以及对工作、爬楼、散步和训练的影响。一起记睡眠和打鼾、饮食与体重变化、近期用药、情绪压力、有无出血或月经变化。持续几周原因不明、已经影响日常生活，或同时出现不明原因体重下降等症状，预约全科或家庭医生。评估会根据情况考虑贫血、睡眠呼吸问题、甲状腺异常、感染后状态、情绪和药物影响等。"],["成本","低到中。记录免费，就诊和检查视需要安排。"],["说人话","把以前能做、现在做起来很吃力的具体事情说清楚。"],["收益","帮助医生缩小原因范围，按症状决定是否需要检查。"],["证据等级","C。线索和检查顺序来自初级保健临床指导，单凭疲劳很难确定原因。"],["适用与备注","如果活动后症状反复明显加重，把加重发生的时间和持续多久告诉医生。正在出现急性胸痛、严重气短或意识异常，立即呼叫急救。"],["来源","[NHS 持续疲劳的常见原因和就医时机](https://www.nhs.uk/symptoms/tiredness-and-fatigue/) · [美国家庭医师学会成人疲劳评估](https://www.aafp.org/afp/2023/0700/fatigue-adults) · [AHA 与美国红十字会急救指南（2024）](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["C"]},{"id":315,"qid":"Q315","section":"健康","chapter":"训练相关健康","question":"休息日做轻松活动还是完全休息，怎么根据当天的疲劳和活动能力选？","title":"休息日，根据日常活动能力决定要不要轻动","fields":[["怎么做","起床、走路和上下楼接近平时，只有轻微肌肉酸胀，可以试几分钟轻松散步或骑车，保持能自在聊天的强度。活动后更累、动作受影响，或前一天练得很重又睡得差，可留一天不安排训练，照常做不加重症状的日常活动。第二天再看精神、走路情况和酸痛有没有好转。"],["成本","低。可以免费散步，也可以空出训练时间休息。"],["说人话","休息日怎么安排，看做完之后人更轻松还是更累。"],["收益","在体力允许时保留活动习惯，也给明显疲劳时留出恢复时间。"],["证据等级","B。耐力运动研究中，轻量活动和被动休息对后续运动表现的差异有限。这里的日常判断方法主要用于个人安排。"],["适用与备注","适用于健康成年人常规训练后的休息日。明显单侧疼痛、肿胀、跛行、发热或站立头晕是另行处理的线索。"],["来源","[耐力运动恢复方式的系统综述与网络荟萃分析（2026）](https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2026.1876924/full) · [耐力运动恢复策略伞状综述（2024）](https://link.springer.com/article/10.1186/s40798-024-00724-6)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":316,"qid":"Q316","section":"健康","chapter":"训练相关健康","question":"手术或住院后想重新走路、慢跑或练力量，出院前该和医疗团队确认哪些限制？","title":"手术或住院后，出院前问清怎么恢复活动","fields":[["怎么做","出院前请团队把限制写进出院指导。问清何时能下床走、多远合适、是否需要扶手或助行器，能否上下楼、负重或搬东西。想恢复慢跑或抗阻，就分别问允许的时间或条件，以及伤口、引流管、关节活动范围和承重限制。确认谁负责复查、什么时候复查、症状变化时打哪个电话。回家后从批准的动作和时长开始。"],["成本","低到中。出院前可以顺便确认，部分情况需要康复门诊或辅具。"],["说人话","把自己回家第一天想做的事和以后想恢复的运动各问一遍。"],["收益","便于把住院医嘱转成每天能执行的安排，在允许的范围内逐步恢复。"],["证据等级","C。起点和限制依据手术类型、病情及出院计划，临床指导支持按个体情况恢复活动。"],["适用与备注","发热、伤口渗液增多或突然加重的红痛，及时联系医疗团队。新发单侧小腿肿痛应尽快就医，突然胸痛或严重气短应立即呼叫急救。"],["来源","[NHS 术后回家及恢复指导](https://www.nhs.uk/tests-and-treatments/having-surgery/recovery/) · [NHS 深静脉血栓症状及就医指导](https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/) · [AHA 与美国红十字会急救指南（2024）](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["C"]},{"id":317,"qid":"Q317","section":"健康","chapter":"训练相关健康","question":"只有流鼻涕或轻咳时，哪些情况可以尝试轻量活动，哪些情况要先休息？","title":"只有流涕或轻咳，症状好转后再试轻量活动","fields":[["怎么做","如果只有轻微流涕、鼻塞或偶尔咳嗽，症状已在好转、没有发热和全身酸痛，走路和呼吸也和平时差不多，可以从在家轻松走动几分钟开始。感觉更累、咳嗽明显增加、气短或胸部不适，停下来休息。症状还在加重或组织活动可能传染别人时，先留在家中。"],["成本","低。一次短而轻松的尝试足够，能选择休息，也能推迟聚集性训练。"],["说人话","只看症状在哪儿容易漏掉问题。还要看是在变轻还是变重、能不能像平常一样活动。"],["收益","让症状轻且正在恢复的人有一个低负担起点，同时减少带病训练和传染他人的机会。"],["证据等级","C。活动试探及停止信号参考运动医学共识，传染防护参考公共卫生指导。"],["适用与备注","出现发热、明显乏力、全身酸痛或稍动就喘时，先暂停训练。休息时仍明显气短或出现急性胸痛，立即寻求急救。"],["来源","[国际奥委会急性呼吸道感染与返训共识](https://bjsm.bmj.com/content/bjsports/early/2022/07/21/bjsports-2022-105759.full.pdf) · [CDC 呼吸道感染期间的传染防护](https://www.cdc.gov/respiratory-viruses/prevention/precautions-when-sick.html)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["C"]},{"id":318,"qid":"Q318","section":"健康","chapter":"训练相关健康","question":"发烧、全身酸痛或感染后，怎样分阶段恢复，出现哪些症状应暂停并就医？","title":"发热或全身酸痛后，从日常活动逐步恢复训练","fields":[["怎么做","发热、全身酸痛或明显乏力时暂停训练。一般呼吸道感染恢复时，确认整体症状改善，至少 24 小时未使用退热药且没有发热，再从能轻松完成的日常活动开始。日常活动耐受良好时，试一次明显短于平时的轻松运动，留意当天和次日。耐受稳定后先增加时长或次数，最后恢复高强度。症状回来就暂停，等好转后再回到此前耐受的活动量。"],["成本","低。可用散步和简短记录观察每一步的反应。"],["说人话","退烧后先看能不能舒服地走路，接着才试一小段轻松运动。"],["收益","把恢复拆成可以观察的几步，更容易发现什么时候要退一步或就医。"],["证据等级","C。阶段安排参考运动医学共识。24 小时无热是呼吸道感染恢复日常活动的公共卫生指引，高强度运动仍看活动反应及医疗要求。"],["适用与备注","较重感染、住院或医生给了运动限制时，遵循医疗团队的计划。返训时出现胸闷、异常气短、明显心悸或头晕，停练并尽快就医。急性胸痛、严重气短或昏厥，立即呼叫急救。"],["来源","[国际奥委会急性呼吸道感染与返训共识](https://bjsm.bmj.com/content/bjsports/early/2022/07/21/bjsports-2022-105759.full.pdf) · [CDC 呼吸道感染恢复日常活动建议](https://www.cdc.gov/respiratory-viruses/prevention/precautions-when-sick.html) · [AHA 与美国红十字会急救指南（2024）](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["C"]},{"id":319,"qid":"Q319","section":"健康","chapter":"训练相关健康","question":"退烧后活动仍容易胸闷或气短，为什么应先评估再恢复训练？","title":"退烧后稍动就胸闷或气短，先评估再恢复训练","fields":[["怎么做","如果走路、爬楼或轻量活动就出现以前没有的胸闷、气短，停下训练并尽快联系医疗机构。告诉医生哪天发病和退烧、多轻的活动就会引起症状、停下多久能缓解，有没有心悸、头晕或晕倒。让医生根据情况判断是否需要检查，以及活动可恢复到什么程度。"],["成本","中。会暂时打断训练，检查项目由医生按症状决定。"],["说人话","能退烧却仍走几步就喘，值得先查明原因。"],["收益","有助于及早发现需要处理的心肺问题，获得适合自己的返训安排。"],["证据等级","C。感染后以心肺症状决定是否先评估，得到运动医学和心血管专业共识支持。"],["适用与备注","带上能反映发病和活动经过的记录，依据症状决定就医时机。急性或持续胸部疼痛或压迫感、静息时严重呼吸困难、昏厥或意识异常，立即呼叫急救。"],["来源","[国际奥委会急性呼吸道感染与返训共识](https://bjsm.bmj.com/content/bjsports/early/2022/07/21/bjsports-2022-105759.full.pdf) · [ACC 新冠感染后心血管评估与返训路径](https://pmc.ncbi.nlm.nih.gov/articles/PMC8926109/) · [AHA 与美国红十字会急救指南（2024）](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["C"]},{"id":320,"qid":"Q320","section":"健康","chapter":"训练相关健康","question":"普通力量训练后经常泡冰水，短时缓解酸痛和长期训练目标怎样权衡？","title":"力量训练后泡冰水，先想清楚要缓解酸痛还是增肌","fields":[["怎么做","把目标写下来。以增肌为主时，先把每次抗阻课后立刻泡冰水的习惯撤掉。如果有短期密集比赛或训练，主要目标是缓解酸痛，可把冷水浸泡当作偶尔使用的选项，并把当天酸痛和次日活动表现分开记录。"],["成本","低到中。省去冰浴无需设备，使用冰浴要花时间并考虑安全。"],["说人话","今天腿没那么酸，和几个月后肌肉长了多少，是两个不同的结果。"],["收益","冷水浸泡可能暂时减轻酸痛。把它从增肌训练的固定流程中移开，可以避开可能减弱肌肥大的做法。"],["证据等级","B。短期酸痛有综述支持，长期肌肥大有小样本试验及荟萃分析支持，力量增长的结果仍有差异。"],["适用与备注","研究主要针对抗阻后很快、反复进行的冷水浸泡。冰水可能诱发喘气、心率和血压骤变。有心血管病史或曾经受冷出现不适，先问医生。"],["来源","[冷水浸泡对恢复和训练适应的伞状综述（2026）](https://link.springer.com/article/10.1186/s40798-026-01116-8) · [抗阻后冷水浸泡与肌肥大荟萃分析（2024）](https://onlinelibrary.wiley.com/doi/full/10.1002/ejsc.12074) · [Roberts 等抗阻训练试验](https://pubmed.ncbi.nlm.nih.gov/26174323/) · [AHA 冷水骤浸风险](https://www.heart.org/news/2022/12/09/youre-not-a-polar-bear-the-plunge-into-cold-water-comes-with-risks)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":321,"qid":"Q321","section":"健康","chapter":"训练相关健康","question":"按摩枪、泡沫轴和手法按摩各适合期待什么，哪些部位或症状不适合自行处理？","title":"按摩枪、泡沫轴和按摩，按舒适感选择","fields":[["怎么做","普通训练后的肌肉酸胀，可用手法轻按、用泡沫轴轻滚，或对肌肉较厚的位置短时、低档使用按摩枪。泡沫轴研究较常见的效果是短时改善活动范围和轻度缓解酸痛，手法按摩可能减轻延迟性酸痛，按摩枪的短时活动度证据来自少量试验。避开头颈、脊柱、骨突、伤口、明显瘀伤和麻木部位。出现锐痛、麻木或疼痛变重就停。"],["成本","低到中。徒手可做，泡沫轴、按摩枪和专业按摩另计。"],["说人话","按完舒服可以当放松，恢复到原来的运动能力还要看实际表现。"],["收益","根据价格和使用感受选择一种方式，可能获得短时间的舒适感或活动度改善。"],["证据等级","B。泡沫轴和手法按摩有系统综述，按摩枪试验少，三种做法之间的直接比较有限。"],["适用与备注","适用于无明显外伤的常见训练后不适。急性损伤、术区、出血风险高或服用抗凝药时，先请专业人员判断。新发单侧小腿明显肿痛或触热，避免自行按摩并尽快就医。"],["来源","[泡沫轴对运动表现和恢复的荟萃分析](https://pmc.ncbi.nlm.nih.gov/articles/PMC6465761/) · [运动按摩系统综述与荟萃分析](https://pubmed.ncbi.nlm.nih.gov/32426160/) · [按摩枪作用和使用限制的系统综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC10532323/) · [NHS 深静脉血栓就医信号](https://www.nhs.uk/conditions/deep-vein-thrombosis-dvt/)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":322,"qid":"Q322","section":"健康","chapter":"训练相关健康","question":"跑后想买压缩袜或加压装备，怎样区分舒服、减轻酸痛和真正恢复运动能力？","title":"跑后压缩装备，分别看舒适、酸痛和下次表现","fields":[["怎么做","已经有合身的压缩袜，可在几次类似的跑后试穿，分别记穿着是否舒服、次日酸痛如何、下一次平常轻松跑的体感和表现如何。舒适度是自己能直接比较的，酸痛缓解可能受预期影响。为了更快恢复下次的跑步能力而买装备，现有证据不足。智能加压设备也不能直接套用压缩袜试验的结论。"],["成本","低到高。有袜子可直接比较，专用设备价格和维护成本更高。"],["说人话","袜子穿着舒服、腿感觉没那么酸、下次能跑得更好，要分开看。"],["收益","少把舒适感估计成运动能力提升，可以按自己在意的结果决定是否花钱。"],["证据等级","B。耐力运动系统综述里，酸痛可能缓解但结果很不确定，对后续耐力表现没有可靠的一致改善。"],["适用与备注","出现麻木、疼痛或脚趾变色时立即脱下。已有动脉循环问题、感觉减退或正在使用医用压缩装置的人，先询问医疗团队。"],["来源","[运动后压缩服装、耐力表现和酸痛系统综述（2026）](https://pmc.ncbi.nlm.nih.gov/articles/PMC13472931/) · [耐力运动恢复方式的系统综述与网络荟萃分析（2026）](https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2026.1876924/full) · [医用压缩治疗风险和禁忌国际共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC7383414/)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":323,"qid":"Q323","section":"健康","chapter":"训练相关健康","question":"练后想用冷敷、热敷或什么都不做，普通肌肉酸痛时怎样判断哪种做法适合自己？","title":"普通练后酸痛，按舒适程度选择冷敷、热敷或等待","fields":[["怎么做","做了较陌生的训练后，隔一段时间才出现弥散的肌肉酸胀、日常活动还能进行且逐渐好转，可以照常安排轻量活动，等它自行缓解。若酸痛影响舒适度，可以试一种自己觉得舒服的办法，例如隔毛巾短时冷敷，或用温而不烫的热敷。过程中看皮肤，刺痛、灼热或麻木就取下。"],["成本","低。等待免费，热毛巾或包好的冷敷袋就能试。"],["说人话","敷一会儿觉得舒服是一个实际收益，第二天能做多少仍看当时的活动能力。"],["收益","可短时缓解一部分人的酸痛。症状轻又在好转时，可以少花时间处理。"],["证据等级","B。冷和热的镇痛研究存在质量和做法差异，哪种对同一个人更好难以预判。"],["适用与备注","皮肤破损、感觉或循环异常的部位先咨询专业人员。训练时突然锐痛、随后迅速肿胀或难以用力，转按损伤评估。肌痛或无力明显超过平时，或出现茶色、可乐色尿，立即就医。"],["来源","[冷、热疗缓解延迟性肌痛的网络荟萃分析](https://pubmed.ncbi.nlm.nih.gov/34636405/) · [延迟性肌痛物理治疗伞状综述（2025）](https://pubmed.ncbi.nlm.nih.gov/40120073/) · [英国 Sherwood Forest 医院冷热敷指导](https://www.sfh-tr.nhs.uk/services/fracture-clinic-physiotherapy/general-advice/heat-and-ice/) · [CDC 横纹肌溶解就医信号](https://www.cdc.gov/niosh/rhabdo/signs-symptoms/index.html)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":324,"qid":"Q324","section":"健康","chapter":"训练相关健康","question":"赛后泡热水澡、蒸桑拿会增加什么负担，哪些情况下应先缓一缓？","title":"赛后先降温，身体平稳后再考虑热水澡或桑拿","fields":[["怎么做","比赛结束后先到阴凉处，等呼吸、心跳和体感接近平时，按当天出汗及能吃喝的情况补水进食。还在大量出汗、口渴、恶心、站立头晕或感觉身体没降温，先缓一缓，简单洗澡可用温水。用桑拿或较热的水会继续增加热负荷，皮肤血管扩张，起身时可能更晕。身处热环境感觉不适，立即离开并到凉处休息。"],["成本","低。阴凉处休息和温水洗澡就可安排，桑拿是可选消费。"],["说人话","人还热、刚起身就头晕时，再进一间热屋子会给身体加负担。"],["收益","减少在赛后本来就比较热、可能缺水时额外受热，降低头晕或跌倒风险。"],["证据等级","B。热应激和脱水的风险有生理与公共卫生证据，赛后热疗能否加快运动能力恢复仍不确定。"],["适用与备注","有心血管病或经常低血压、头晕的人先和医生确认。炎热比赛后出现意识异常或倒下，立即呼叫急救并尽快降温。"],["来源","[运动后热暴露与恢复的系统综述（2025）](https://link.springer.com/article/10.1186/s40798-025-00910-0) · [CDC 高温相关疾病与热晕厥](https://www.cdc.gov/niosh/heat-stress/about/illnesses.html) · [AHA 高血压与桑拿热水浴注意事项](https://www.heart.org/en/health-topics/high-blood-pressure/changes-you-can-make-to-manage-high-blood-pressure/getting-active-to-control-high-blood-pressure)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":325,"qid":"Q325","section":"健康","chapter":"训练相关健康","question":"恢复期间手表显示心率变异性下降，怎样结合主观状态和训练表现判断？","title":"手表显示心率变异性下降，和体感及表现一起看","fields":[["怎么做","同一设备尽量在相近时段和条件下测，用近期多天趋势和自己平时的范围比。有一晚偏低，先看看是否有测量异常、睡得少、饮酒、近期压力或生病。若数值连续偏低，同时觉得疲惫、平常配速比以前费劲，暂把高强度课换成轻松活动或休息，观察几天。只有这一项偏低而体感与日常活动正常，可继续观察再决定。"],["成本","低。已有设备时用趋势即可，也可以只记录睡眠、疲劳和训练体感。"],["说人话","手表给了你一个观察点。今天轻松跑有多费劲，也得算进去。"],["收益","帮助发现与疲劳同时发生的变化，给调整训练多一个依据。"],["证据等级","B。训练研究支持按个人基线和多天趋势解读，设备间算法有差异，据此改善运动表现的证据有限。"],["适用与备注","运动中胸闷、异常气短、头晕或心悸，应按症状处理。穿戴设备显示正常时，这些症状仍值得评估。"],["来源","[HRV 指导耐力训练系统综述与荟萃分析](https://pubmed.ncbi.nlm.nih.gov/34639599/) · [休闲跑者 HRV 与自评压力指导训练试验](https://pubmed.ncbi.nlm.nih.gov/36940300/) · [运动场景中移动设备 HRV 监测研究综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC12787763/)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":326,"qid":"Q326","section":"健康","chapter":"训练相关健康","question":"照顾家人或工作压力突然增加，怎样调低训练负担，同时保住日常活动？","title":"工作或照护压力上来时，先缩短训练并保留日常活动","fields":[["怎么做","先按接下来一周真实能用的时间调整，把长课、间歇或接近力竭的训练换成短一点、容易恢复的活动。比如通勤走一段、午休走十分钟，或把原来的力量课改成几个熟悉动作、减少组数。优先保住吃饭和睡眠。忙完后先恢复一次原来熟悉的短课，之后看体感和次日精力逐步加回，跳过的训练让它过去。"],["成本","低。把活动嵌入已有的生活安排，通常无需另外买设备。"],["说人话","这周已经很忙，就选你做完以后还有余力的运动。"],["收益","维持日常活动的连续性，让计划能随着工作、照护和休息时间调整。"],["证据等级","B。少坐多动的健康收益有指南支持。具体怎样减量是根据压力、睡眠和可用时间做的实用调整。"],["适用与备注","适用于日程骤变、仍能进行日常活动的成年人。持续疲劳、长期睡不好或运动后反复症状加剧，需另行评估。"],["来源","[WHO 体力活动和久坐行为指南](https://www.who.int/publications/i/item/9789240015128/) · [国际奥委会运动负荷与损伤风险共识](https://pubmed.ncbi.nlm.nih.gov/27535989/) · [NHS 疲劳就医建议](https://www.nhs.uk/symptoms/tiredness-and-fatigue/)"]],"path":"book/training-health/03-recovery.md","aliases":"","grades":["B"]},{"id":327,"qid":"Q327","section":"健康","chapter":"训练相关健康","question":"练后第二天酸痛，怎样区分常见延迟性酸痛和需要停练评估的疼痛？","title":"练后隔天酸痛，先看疼痛的位置、走路和尿色","fields":[["怎么做","新动作、下坡或加量后，隔天在练过的一片肌肉出现酸胀和发僵，能正常走路且随后逐渐缓解，可以先减轻训练，按舒适程度做日常活动。运动时突然出现的锐痛、局限在骨头或关节的痛、明显肿胀或跛行，先停下会诱发疼痛的动作并联系医疗机构。运动后出现茶色或可乐色尿、明显超出预期的肌肉痛或无力，立即就医。"],["成本","低。记录疼痛何时开始、在哪里、是否影响走路，症状明显时直接求助。"],["说人话","隔天一片肌肉发酸且逐渐好转，可以先观察。痛到走路都变了，或者出现深色尿、异常无力，要及时求助。"],["收益","根据症状变化及时调整训练，识别需要医疗评估的表现。"],["证据等级","C。延迟性酸痛特点和分诊信号来自临床指导。横纹肌溶解可在运动后几小时或几天才出现，任一危险信号就需要处理。"],["适用与备注","即使尿色看起来正常，严重异常疼痛或无力仍需要评估。急性扭伤和撞伤见[运动中突然受伤](#q328)。"],["来源","[美国军队运动性横纹肌溶解指南的生理性肌肉损伤与症状对照](https://guidance.nattrauma.org/media/yrnhyuwv/hprc_whec_clinical_practice_guideline_for_managing_er_101320.pdf) · [CDC 横纹肌溶解症状和就医建议](https://www.cdc.gov/niosh/rhabdo/signs-symptoms/index.html) · [NHS 扭伤和拉伤就医建议](https://www.nhs.uk/conditions/sprains-and-strains/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"力量训练后酸痛 酸痛继续练 酸痛还能练","grades":["C"]},{"id":328,"qid":"Q328","section":"健康","chapter":"训练相关健康","question":"训练时突然扭伤、撞伤或听见一声响，哪些表现需要尽快就医？","title":"突然扭伤或撞伤，先停下并看能否承重、手脚颜色是否正常","fields":[["怎么做","停止训练，保护受伤部位，保持相对舒适的位置。大量出血，或受伤处远端发白、发蓝、变冷时，立即呼叫当地急救。有明显变形、骨头外露或持续麻木，立即求助急诊。听到疑似骨折的断裂响、不能承重走几步、不能正常使用受伤的手或腿、肿胀或疼痛很重或持续加重，尽快接受当日评估。"],["成本","放下剩余训练，请同伴或现场人员协助，安排安全交通或急救。"],["说人话","受伤后先坐稳请人帮忙。外形、颜色、感觉或承重有变化，都值得认真对待。"],["收益","减少受伤部位继续受力，尽早检查骨折、脱位或其他严重损伤。"],["证据等级","C。急症信号与现场保护来自 AHA、美国红十字会急救指南及 NHS 就医指导。"],["适用与备注","避免自行把关节掰回原位或反复负重试走。膝、踝和疑似跟腱急伤分别见[扭伤后膝关节卡住](#q331)、[脚踝扭伤](#q336)、[小腿后方突然剧痛](#q334)。"],["来源","[AHA 与美国红十字会急救指南 9.6 和 9.7 节](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines) · [NHS 扭伤与拉伤的紧急就医信号](https://www.nhs.uk/conditions/sprains-and-strains/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["C"]},{"id":329,"qid":"Q329","section":"健康","chapter":"训练相关健康","question":"膝盖前侧在跑步或下楼时反复疼，哪些活动可以先调整，何时去评估？","title":"跑步或下楼反复膝前痛，先减少最容易诱发的负荷","fields":[["怎么做","记下膝前痛发生在下楼、下坡、跑远时还是蹲下时。先减少最容易诱发的那项，例如把有长下坡的跑换成短平路，或者在每天走路也痛时先暂停跑步。保留能舒适完成的活动，记录当天和第二天的反应。反复发作、几周仍没有改善或已经影响日常活动，预约医疗或康复评估。"],["成本","低。用现有训练时间改路线或缩短一段，手机记下触发动作和症状。"],["说人话","先把最容易痛的那部分降下来。日常上下楼也老是痛，就带着记录去看。"],["收益","暂时减少症状反复，并帮助临床人员按走路、上下楼或跑步的目标安排练习。"],["证据等级","B。髌股疼痛最佳实践指南支持教育及针对膝的训练，必要时合并髋部训练。短平路替换是按症状减量的示例。"],["适用与备注","膝前痛有多种原因。若膝关节明显肿胀、卡住、打软腿或不能承重，尽快就医。关节红热同时发热或寒战，也应尽快评估。"],["来源","[髌股疼痛最佳实践指南，图 2 和临床管理小节](https://doi.org/10.1136/bjsports-2024-108110) · [埃塞克斯大学存档全文（PDF）](https://repository.essex.ac.uk/39411/1/bjsports-2024-108110.full.pdf) · [NHS 膝痛的就医建议](https://www.nhs.uk/symptoms/knee-pain/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"跑步膝盖疼 膝盖疼 跑步膝疼 下楼疼 膝前痛","grades":["B"]},{"id":330,"qid":"Q330","section":"健康","chapter":"训练相关健康","question":"跑到某个距离膝外侧开始痛，怎样记下触发条件，什么情况不宜继续硬跑？","title":"膝外侧在途中开始疼，记下触发距离和路段","fields":[["怎么做","记哪一侧、能否指出痛点、开始疼的大致时间或公里数、上下坡和路面横斜情况，以及过去几周跑量有无变化。痛感继续增加、跑姿变了或已经跛行，就结束当次跑步。之后从能舒适完成的日常活动判断恢复，症状总在类似距离重现、越来越早出现、影响走路或有外伤和肿胀时，安排评估。"],["成本","低。跑后用一两分钟记录距离、地形、疼痛变化和第二天的走路情况。"],["说人话","把「跑着跑着就痛」记具体。比如每次到了下坡的第六公里开始痛，走回去还会痛。"],["收益","给后续减量、路线调整和临床问诊留下可核对的信息。"],["证据等级","C。运动训练学临床文献把训练量突增、下坡和横斜路面作为外侧膝痛问诊线索。它们也可出现在其他伤病中。"],["适用与备注","膝外侧的痛点和出现距离不能单独诊断髂胫束问题。扭伤后出现卡住、明显肿胀或打软腿，按[膝关节急性损伤](#q331)处理。"],["来源","[运动训练学期刊髂胫束相关疼痛临床综述，Evaluation 部分](https://pmc.ncbi.nlm.nih.gov/articles/PMC8359713/) · [NHS 膝痛的紧急就医信号](https://www.nhs.uk/symptoms/knee-pain/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["C"]},{"id":331,"qid":"Q331","section":"健康","chapter":"训练相关健康","question":"膝盖扭了一下后肿起来、卡住或打软腿，什么时候需要就医？","title":"膝盖扭后明显肿、卡住或打软腿，尽快评估","fields":[["怎么做","停止运动，减少受伤那侧的负重。膝明显肿起来、卡得伸不直、站立或走路时打软腿，或不能承重，尽快接受当日评估。记下扭转或撞击的经过、肿胀从何时开始、活动受限到什么程度。出现明显变形、伤后小腿或足部麻木、发冷或变色，立即求助急诊。"],["成本","先安排同伴协助离开现场和就医。检查和影像由临床人员按情况决定。"],["说人话","扭了一下之后膝盖伸不开、站不稳或明显肿，就先停，尽快找人检查。"],["收益","尽早识别需要优先处理的关节、骨骼或韧带损伤。"],["证据等级","C。紧急信号来自 NHS 和现场急救指南。AAOS 对急性半月板移位并限制活动的早期处理也主要基于专家共识。"],["适用与备注","让膝盖停在舒服的位置，避免为试验反复扭转或硬掰伸直。恢复和检查的安排取决于实际伤情。"],["来源","[NHS 膝痛的紧急就医信号](https://www.nhs.uk/symptoms/knee-pain/) · [AAOS 急性孤立性半月板损伤指南的紧急手术评估选项](https://www.aaos.org/globalassets/quality-and-practice-resources/acute-meniscal-pathology/amp-cpg.pdf) · [AHA 与美国红十字会急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["C"]},{"id":332,"qid":"Q332","section":"健康","chapter":"训练相关健康","question":"跑步时小腿内侧疼，出现固定一点的骨痛或走路痛时该怎么处理？","title":"小腿骨上一点固定疼，或走路也痛，暂停冲击运动并评估","fields":[["怎么做","若小腿内侧一片在跑后酸痛，先暂停会诱痛的跑跳，记录位置、近期训练变化和走路反应。能用一根手指指到固定骨痛，或走路就痛、跛行、休息也痛，先停跑跳并尽快找运动医学或骨科评估。无法承重或突然剧痛时当日就医。避免反复按疼点、跳跃或继续跑来测试。"],["成本","暂停需要落地冲击的课。就诊时带上最近几周的跑量和痛点记录，影像视检查结果决定。"],["说人话","一大片酸需要留意变化。骨头上固定一点痛，或者走路也开始痛，就该停跑检查。"],["收益","尽早评估骨应力损伤等可能原因，减少继续负重带来的风险。"],["证据等级","C。运动员骨应力损伤国际共识以病史、体检和影像判断，固定压痛和走路痛是评估线索。"],["适用与备注","骨应力损伤早期的普通 X 光可能没有明显改变。按医生安排复诊及恢复跑跳，疼痛缓解本身不能作为恢复原跑量的依据。"],["来源","[运动员骨应力损伤国际德尔菲共识的诊断和治疗小节](https://doi.org/10.1136/bjsports-2024-108616) · [AAOS 骨应力损伤的症状与影像](https://www.orthoinfo.org/diseases--conditions/sports-injuries/stress-fractures/) · [AAOS 胫骨内侧应力综合征](https://www.orthoinfo.org/diseases--conditions/shin-splints/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"跑步小腿疼 跑步小腿内侧疼","grades":["C"]},{"id":333,"qid":"Q333","section":"健康","chapter":"训练相关健康","question":"跟腱晨起僵硬或跑后疼，怎样先调整训练，出现哪些变化要就医？","title":"跟腱晨僵或跑后疼，先减掉最刺激的跑课","fields":[["怎么做","晨起僵硬或跑后跟腱不适，先记疼在脚跟附着处还是其上方。去掉最诱痛的跑课，例如快速跑、坡跑或长跑。可保留不明显加重症状的步行或其他活动，并看第二天起床时的反应。症状反复、逐步加重、影响走路蹬地或调整后仍无好转，预约运动医学或康复评估，询问如何逐步恢复跟腱负荷。"],["成本","低。先改近期课表，用一两分钟记录晨僵和日常走路的变化。评估后可能需要安排康复练习。"],["说人话","先拿掉跑完最难受的那一课。第二天走路也越来越难受时，去看一下。"],["收益","减少症状反复，给临床人员提供局部负重和反应的线索。"],["证据等级","B。2024 年临床指南支持中段跟腱病在疼痛耐受范围内活动，首选逐步负荷练习。跑课怎么减、如何进阶需个体化。"],["适用与备注","足跟附着处疼痛或急性损伤需区别评估。发生突然剧痛、弹响或蹬地无力，先停下并按[小腿后方突然剧痛](#q334)处理。"],["来源","[2024 年中段跟腱病临床指南的 Tendon Loading Exercise 和 Patient Education 部分](https://ifspt.org/wp-content/uploads/2025/05/Achilles.pdf) · [AAOS 跟腱断裂的症状](https://www.orthoinfo.org/bodypart/foot-ankle/achilles-tendon-rupture-tear/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["B"]},{"id":334,"qid":"Q334","section":"健康","chapter":"训练相关健康","question":"跳起或加速时小腿后方突然剧痛，为什么不宜先拉伸测试、怎样求助？","title":"加速或起跳后小腿后侧突然剧痛，保持保护并尽快就医","fields":[["怎么做","突然像被踢了一下、听见弹响，或受伤后明显蹬地无力，就立即停下。请人协助，尽量少让伤侧负重，当日到急诊或有急性损伤评估能力的医疗机构。等待评估时避免把脚尖往小腿方向硬扳、拉伸小腿或反复踮脚测试，以免给可能撕裂的跟腱额外拉力。"],["成本","结束当次训练，安排同伴协助和就医交通。临床人员根据情况检查并决定如何保护、是否需要影像。"],["说人话","小腿后面突然像挨了一脚，或者蹬地一下子没了力气，先找人帮忙去检查。"],["收益","及时识别跟腱断裂等急性损伤，减少负重和拉伸造成的额外应力。"],["证据等级","C。症状识别和临时保护来自骨科机构的急性跟腱损伤临床指导。"],["适用与备注","即使疼痛很快减轻或还能勉强平脚走，也需要按突然受伤和蹬地无力的情况分诊。出现[肢体变色、发冷或其他急症信号](#q328)，立即求助急诊。"],["来源","[NHS Fife 跟腱断裂的症状和初诊处理](https://www.nhsfife.org/services/all-services/patient-advice/achilles-tendon-rupture/) · [NHS 急性跟腱损伤保护指导](https://www.uhd.nhs.uk/uploads/about/docs/our_publications/patient_information_leaflets/orthopaedics/Achilles_Tendon_Rupture_Rehabilitation_Guidelines_for_Patients_27092021.pdf)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["C"]},{"id":335,"qid":"Q335","section":"健康","chapter":"训练相关健康","question":"早晨下地第一步脚跟疼，怎样调整站立、跑量和鞋，什么时候值得评估？","title":"早晨第一步脚跟痛，先缩短久站和诱痛的跑步","fields":[["怎么做","如果疼在足底靠近脚跟处，起床第一步特别明显，先缩短久站、长距离走路和诱痛的跑量。试试现有鞋里脚跟有缓冲、足弓有支撑又穿着舒服的一双。每天观察下地第一步和走一段后的变化。调整约两周仍未好转、反复或影响日常活动，预约评估。足底麻木、刺痛，或有糖尿病同时出现足痛，尽早联系医疗机构。"],["成本","低。先用手头舒服的鞋，缩短会加重症状的站立和跑步。若持续痛，考虑就诊和康复时间。"],["说人话","早上第一脚痛，白天就少硬撑长时间站跑，试试穿着舒服的鞋，看看接下来有没有改善。"],["收益","减少日常诱发负荷，帮助判断何时需要评估足底筋膜或其他结构。"],["证据等级","B。JOSPT 临床指南支持对足底筋膜性足跟痛采用针对性练习等干预。鞋与活动调整及就医时机引自 NHS 患者指导。"],["适用与备注","急性受伤后不能负重或疼痛剧烈时，按[突然扭伤或撞伤](#q328)处理。"],["来源","[2023 年足跟痛临床指南的 Diagnosis 和 Interventions 部分](https://ifspt.org/wp-content/uploads/2025/05/Heel-Pain-%E2%80%93-Plantar.pdf) · [NHS 足底筋膜性足跟痛的活动和就医建议](https://www.nhs.uk/conditions/plantar-fasciitis/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["B"]},{"id":336,"qid":"Q336","section":"健康","chapter":"训练相关健康","question":"脚踝扭伤后什么时候要评估有无骨折，什么时候可以尝试重新跑跳？","title":"崴脚后先评估骨折风险，恢复跑跳再看脚踝功能","fields":[["怎么做","伤后脚踝或足中部痛，如果内外踝骨点、足内侧足舟骨处或足外缘第五跖骨底局部明显疼，或承重连走几步都很困难，尽快接受骨折评估。排除需要特殊保护的损伤后，先恢复舒适走路和上下楼，再结合踝活动度、力量、平衡和稳定感考虑开始平路短慢跑。加跳跃和变向前，观察活动时和其后一天的反应，并按康复进度安排。"],["成本","视情况需要当日检查或 X 光。返跑时安排几次短练习，记录当天和第二天的反应。"],["说人话","崴脚后几个骨点痛或走不了几步，先去检查。恢复跑跳要看走路、平衡、脚踝力量和跑后的反应。"],["收益","先处理可能的骨折，再以恢复后的功能决定活动进度。"],["证据等级","B。Ottawa 规则有前瞻性验证。PAASS 五个返运动维度来自跨学科共识，研究没有规定所有人的返跑日期或通过阈值。"],["适用与备注","临床 Ottawa 规则需要定位骨点，并检查受伤当时和就诊时能否承重走四步。能走几步仍可能需要影像，别为自测强行走或跳。足部变形、发冷、变色或持续麻木时，按[急性外伤](#q328)求助。"],["来源","[Ottawa 规则前瞻性验证](https://pubmed.ncbi.nlm.nih.gov/8433468/) · [新南威尔士州成人 Ottawa 踝足规则及骨点图示](https://aci.health.nsw.gov.au/ecat/appendices/ottawa-ankle-adult) · [PAASS 返运动共识的五个评估维度](https://pubmed.ncbi.nlm.nih.gov/34158354/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"脚踝扭伤 崴脚","grades":["B"]},{"id":337,"qid":"Q337","section":"健康","chapter":"训练相关健康","question":"脚踝伤好了仍反复崴脚，回到有弯道和起伏的跑步路线前该评估哪些能力？","title":"反复崴脚，回到弯路和起伏路前先检查动态稳定性","fields":[["怎么做","记录脚踝在哪些路面和动作下又崴或突然发软，是否同时疼、肿或让你不敢蹬地。反复出现时预约评估，请专业人员查看踝活动度、肌力、单脚平衡、动态落地及变向控制，并制定康复练习。先确认平地走跑和恢复练习都能稳定完成，再逐步增加弯道、缓坡或不平路面。一次只加一种难度比较容易观察反应。"],["成本","记录几次不稳的经过，安排评估和渐进练习。可从原路线改为平整、较短的路段。"],["说人话","脚踝不痛了却还会崴，先弄清单脚支撑、落地和转弯能不能稳住。"],["收益","发现需要补练的动作控制能力，让恢复路线更容易逐步调整。"],["证据等级","B。JOSPT 指南支持慢性踝不稳成人接受本体感觉和神经肌肉练习。具体路线是从临床评估内容推导出的情境示例。"],["适用与备注","请把自己对脚踝的信心和日常不稳一起告诉评估者。又发生一次急性伤且骨点压痛或不能承重时，见[脚踝扭伤后的骨折评估](#q336)。"],["来源","[JOSPT 踝外侧韧带扭伤指南的慢性踝不稳评估与治疗性运动](https://www.orthopt.org/uploads/content_files/files/jospt.2021.0302.pdf) · [PAASS 的动态平衡和运动功能部分](https://pubmed.ncbi.nlm.nih.gov/34158354/)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["B"]},{"id":338,"qid":"Q338","section":"健康","chapter":"训练相关健康","question":"前脚掌麻、脚趾挤痛或反复起水疱，怎样检查鞋袜和系带，何时考虑就医？","title":"前脚掌麻、挤痛或起疱，先检查鞋头、系带和袜子","fields":[["怎么做","停下后看脚趾能否在鞋里活动，鞋头是否碰到最长脚趾或从两侧挤脚。袜子应贴平，检查有没有潮湿或在同一处打褶。系带可稍放松压着前脚掌的位置，同时让后跟保持稳定。一次改一项，先短走或短跑试穿。水疱保持清洁、覆盖保护，避免自行挑破。脱鞋休息后仍持续麻木、反复刺痛、影响走路，或水疱频繁复发、明显红热或流脓，联系医疗机构。"],["成本","约 5 分钟检查和调整，先试已有鞋袜。起疱时可能要用敷料并暂停穿会磨的鞋。"],["说人话","脚趾要能动，脚跟也要稳。脱鞋后还麻、越走越痛或水疱看着感染了，就去检查。"],["收益","减少脚趾挤压和皮肤摩擦，同时及时发现需要评估的足痛和感觉变化。"],["证据等级","C。鞋袜和系带建议来自 NHS 足病服务，症状分诊及水疱护理来自 NHS 患者指导。"],["适用与备注","有糖尿病、已知足部感觉下降或循环问题的人出现新足伤，可尽早联系医疗团队。足部突然变冷、发白或发蓝，尤其伴剧痛或明显感觉下降时，立即就医。"],["来源","[NHS 足病服务的前足鞋型和系带建议](https://leedscommunityhealthcare.nhs.uk/our-services-a-z/podiatry/foot-pain/) · [NHS 前脚掌痛就医指导](https://www.nhs.uk/symptoms/foot-pain/pain-in-the-ball-of-the-foot/) · [NHS 水疱护理](https://www.nhs.uk/conditions/blisters/) · [美国血管外科学会急性肢体缺血指南](https://vascular.org/patients-and-referring-physicians/conditions/acute-limb-ischemia)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["C"]},{"id":339,"qid":"Q339","section":"健康","chapter":"训练相关健康","question":"跑长下坡后脚趾甲发黑，哪些情况可以观察，哪些变化需要找医生？","title":"下坡后趾甲发黑，观察痛感和黑斑是否随趾甲长出","fields":[["怎么做","有明确碰挤经过、甲板完整且只有轻微疼痛并在好转，可以先换不挤趾的鞋，拍一张日期清楚的照片，观察甲根长出的新甲是否清楚、黑斑是否逐渐往前移。强烈跳痛、甲板裂开或翘起、脚趾变形或红热流脓，应尽快就医。没有明确碰挤原因、新出现或持续变宽的深色纵纹、黑色延伸到甲周皮肤，或黑斑未随新甲移向前缘，安排皮肤科评估。"],["成本","低。拍照和更换现有鞋袜即可观察轻微情况。剧痛或疑似感染时优先安排就医。"],["说人话","轻微淤黑可以拍照看它是否长出去。很痛、黑纹在变宽或黑到甲周皮肤，就请医生看。"],["收益","减少再次撞趾，在可能需要减压、检查骨折、处理感染或辨别甲色变化时及早就诊。"],["证据等级","C。观察与评估线索来自皮肤科及临床患者资料，颜色本身不足以确定原因。"],["适用与备注","趾甲长得慢，可保留照片对照。避免自行给趾甲钻孔或拔甲，明显疼痛时可由临床人员判断是否需要处理。"],["来源","[DermNet 甲下出血的临床特点与处理](https://dermnetnz.org/topics/subungual-haemorrhage) · [Cleveland Clinic 甲下血肿就医建议](https://my.clevelandclinic.org/health/diseases/subungual-hematoma) · [AAD 甲部色素变化评估](https://www.aad.org/public/diseases/skin-cancer/types/common/melanoma/nail-melanoma)"]],"path":"book/training-health/04-running-injuries.md","aliases":"","grades":["C"]},{"id":340,"qid":"Q340","section":"健康","chapter":"训练相关健康","question":"跑步时髋前侧或腹股沟深处痛，什么表现提示应先停跑并评估？","title":"跑步时髋前或腹股沟深处痛，先停跑并查看承重情况","fields":[["怎么做","跑步出现髋前侧或腹股沟深处痛，先停下。记疼痛部位、从哪次训练开始、跑多远开始痛、走路和上下楼会不会痛，以及近期跑量、速度或训练地形的变化。疼痛越跑越早、走路也痛或开始跛行、休息时仍痛，停掉跑跳并尽快做运动医学或骨科评估。走路也痛时尽量减少患侧承重，避免用单腿跳测试。"],["成本","低到中。先停跑即可，持续或伴承重痛需要评估，检查视情况安排。"],["说人话","痛从跑步延伸到走路，尤其开始跛行时，就别反复试跑了。"],["收益","有助于尽早评估深部髋痛的原因，包括需要及时处理的股骨颈骨应力损伤。"],["证据等级","C。高风险位置和临床警示主要来自运动医学共识及病例研究。"],["适用与备注","突然明显加重、发生跌倒或已无法承重，应立即就医。即使早期影像没显示异常，承重痛持续也值得复评。"],["来源","[国际运动员骨应力损伤 Delphi 共识](https://doi.org/10.1136/bjsports-2024-108616) · [运动中的股骨颈应力骨折临床综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC6226070/)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":341,"qid":"Q341","section":"健康","chapter":"训练相关健康","question":"加速时大腿后侧一拉就痛，如何判断从日常活动回到跑步前要经过哪些阶段？","title":"加速扯到大腿后侧，从走路逐步恢复到加速跑","fields":[["怎么做","先停掉加速和冲刺，记下发生动作、疼痛位置、走路情况和有没有瘀青。日常走路、上下楼及轻负荷动作能承受后，可在评估或指导下逐渐恢复髋后侧和屈膝力量，再从轻松走跑过渡到持续慢跑、逐步加速，最后才是接近冲刺。每次只把速度或训练量中的一项往上调，留意当时动作是否变形、次日疼痛是否明显加重。"],["成本","低到中。前期训练可先减量，走路困难、伤势不明或要回高速运动时，通常值得寻求评估。"],["说人话","走得了、慢跑得了、敢加速，是三个不同的阶段。"],["收益","有助于逐步恢复运动所需的力量和速度，在回到全速前发现薄弱环节。"],["证据等级","B。渐进力量和跑步是运动康复指南支持的方向，具体起点和进度根据伤情而定。"],["适用与备注","明显撕裂感后疼痛剧烈、出现大片或增多的瘀青、明显无力或难以承重时，尽快就医。"],["来源","[JOSPT 运动员腘绳肌损伤临床实践指南（2022）](https://pubmed.ncbi.nlm.nih.gov/35164536/) · [ICCUS 运动性腘绳肌损伤康复与返训共识（2026）](https://pmc.ncbi.nlm.nih.gov/articles/PMC13727015/) · [NHS 腘绳肌损伤就医信号](https://www.nhs.uk/conditions/hamstring-injury/)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["B"]},{"id":342,"qid":"Q342","section":"健康","chapter":"训练相关健康","question":"深蹲或硬拉后腰痛，出现麻木、无力等哪些信号应尽快就医？","title":"深蹲或硬拉后腰痛，出现新发麻木或无力就停练","fields":[["怎么做","先放下重量，记录痛是否往臀部或腿部延伸，麻木在哪条腿、是否持续，以及有没有脚抬不起来、走路拖脚或腿使不上力。新发或持续的腿部麻木、无力应尽快接受医疗评估。出现会阴或肛周麻木、新发排尿困难或大小便失控、双腿严重或进行性麻木或无力，立即去急诊，无法安全前往时呼叫急救。"],["成本","低到中。没有急症信号时可暂停重负荷，是否需要检查由医生判断。"],["说人话","腰酸和脚拖地是两类线索。新发麻木和无力要单独说清楚。"],["收益","及时识别可能需要紧急处理的神经症状，帮助医生了解变化。"],["证据等级","C。转诊线索来自临床指南和医院急诊指导。"],["适用与备注","只有局部腰痛且逐渐改善时，可继续做能耐受的轻量日常活动，再根据恢复情况调整训练。严重外伤后的腰痛或伴神经症状，优先就医。"],["来源","[NICE 疑似神经系统疾病识别和转诊·马尾综合征](https://www.nice.org.uk/guidance/ng127/resources/suspected-neurological-conditions-recognition-and-referral-pdf-66141663923653) · [剑桥大学医院 NHS 腰痛就医信号](https://www.cuh.nhs.uk/patient-information/back-pain/) · [NHS 坐骨神经痛患者指导](https://www.nhs.uk/conditions/sciatica/)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":343,"qid":"Q343","section":"健康","chapter":"训练相关健康","question":"卧推或举过头时肩膀反复痛，怎样改动作和负荷，何时值得评估？","title":"卧推或过头举反复肩痛，先改变最容易诱发的负荷","fields":[["怎么做","记录是下放、推起还是举到某个高度就痛。先减轻重量和组数，再试缩短动作幅度或更换到容易控制的推举方式，比如在舒适范围内做高位支撑俯卧撑。保留不加重症状的其他训练和日常活动。每次只改变一个因素，记当时和次日反应。反复调整仍痛、影响穿衣或睡觉，或手臂越来越无力，安排评估。"],["成本","低到中。可优先用现有器材改变重量和活动范围，反复痛时再寻求医疗或物理治疗评估。"],["说人话","先找出哪一段动作会痛，再换成你能控制、隔天也舒服的版本。"],["收益","调整后可保留一部分训练，通过反应找到目前能耐受的负荷。"],["证据等级","B。肩袖相关疼痛的主动康复得到指南支持，简单动作替换要按诱因和个人反应选择。"],["适用与备注","外伤后突然难以抬臂、肩形明显改变、持续麻木，或手臂明显冰冷，尽快就医。"],["来源","[JOSPT 肩袖肌腱病临床实践指南（2025）](https://doi.org/10.2519/jospt.2025.13182) · [NHS 肩痛患者指导与就医信号](https://www.nhs.uk/symptoms/shoulder-pain/)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["B"]},{"id":344,"qid":"Q344","section":"健康","chapter":"训练相关健康","question":"做俯卧撑时手腕一撑就痛，怎样临时改动作，何时要查受伤原因？","title":"俯卧撑一撑就腕痛，减小承重和手腕弯曲角度","fields":[["怎么做","暂停诱发手腕疼痛的地面俯卧撑。若没有外伤或麻木，可先试靠墙或高位支撑以减少承重，或在不痛的情况下用稳固把手保持手腕接近中立。选一种试少量，记录手掌侧或手背侧哪里痛、哪种角度会痛、隔天是否加重。连日常拧开瓶盖或开门都受影响、疼痛反复，安排评估。"],["成本","低。用墙或稳固台面即可，稳定的俯卧撑把手是可选。"],["说人话","先把上身抬高一点、手腕摆舒服一点，看疼痛是否随负荷改变。"],["收益","减少常见诱发负荷，保留能耐受的上肢练习，也让复评时能说明发作条件。"],["证据等级","C。减量、调整诱发动作和转诊信号有临床指导，具体俯卧撑改法是低负荷尝试。"],["适用与备注","跌倒后手腕痛明显、肿胀、变形、无法正常握持，或手部失去感觉时，尽快就医。手腕外伤后即使还能活动，持续的局部痛也需要评估。"],["来源","[NHS 手腕痛患者指导与就医信号](https://www.nhs.uk/symptoms/hand-pain/wrist-pain/) · [莫克姆湾大学医院 NHS 手腕和手部疼痛康复指导](https://www.uhmb.nhs.uk/our-services/services/musculoskeletal-msk-physiotherapy/musculoskeletal-msk-pain/wrist-hand-and-finger-pain)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":345,"qid":"Q345","section":"健康","chapter":"训练相关健康","question":"划船、做引体或用力握器械后肘外侧反复痛，哪些训练量和握持动作值得先调整？","title":"握器械后肘外侧反复痛，先减握持和拉练的总量","fields":[["怎么做","记录哪个动作和握法最容易引发疼痛，例如划船、引体、拧毛巾或提袋子。先减少刺激最大的动作组数、重量或持续握持时间，避免把多种费握力的训练集中在一天。手腕尽量接近中立，试一种能轻松控制的握法，观察当天和次日。调整后仍反复痛、握力下降或影响日常活动，预约医生或物理治疗师。"],["成本","低。优先调整原训练和工作活动的安排。"],["说人话","当天练的拉力动作会累积，工作和家务里那些一直用力抓握的动作也算。"],["收益","找出目前可承受的负荷，减少因反复刺激而中断训练的情况。"],["证据等级","B。肘外侧肌腱相关疼痛的训练和功能评估有临床指南支持，具体握法和组数需个人调整。"],["适用与备注","伴麻木、明显肿热，或外伤后难以活动时，需要尽快评估。反复疼痛可请专业人员检查握力和动作，再决定力量练习的起点。"],["来源","[JOSPT 肘外侧痛和肌肉功能临床实践指南](https://doi.org/10.2519/jospt.2022.0302) · [NHS 网球肘活动调整指导](https://www.nhs.uk/conditions/tennis-elbow/) · [英国皇家骨科医院肘外侧痛康复建议](https://roh.nhs.uk/services-information/therapy/tennis-elbow)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["B"]},{"id":346,"qid":"Q346","section":"健康","chapter":"训练相关健康","question":"提哑铃、握杠或悬垂时手指麻，怎样记录部位和持续时间，什么时候应暂停并就医？","title":"握杠、提哑铃或悬垂时手指发麻，放下器械再记录","fields":[["怎么做","握器械时发麻先安全放下器械，悬垂时先落地。记哪只手、哪些手指、掌侧还是手背，屈肘、弯腕或某种握法时何时出现，松开多久恢复。也记有无夜间发麻、握力下降或容易掉东西。一次轻微且很快消退，可先避免原来的长时间握持或压迫姿势。若再次发生、松开后仍持续、夜间常出现或伴无力，预约医疗评估。"],["成本","低。先用手机画出发麻位置，评估时把动作和症状经过带去。"],["说人话","只说手麻太宽泛。具体哪根手指、多久恢复、手有没有变弱更有用。"],["收益","帮助专业人员定位受影响的部位，也能减少麻木时继续持重的风险。"],["证据等级","C。部位、持续时间和握力变化来自临床评估指导。"],["适用与备注","外伤后新发麻木或无力应尽快就医。手突然冰冷苍白、同时疼痛或无力，立即就医。"],["来源","[AAOS 尺神经在肘部受压的患者指导](https://www.orthoinfo.org/bodypart/elbow/ulnar-nerve-entrapment-at-the-elbow/) · [NHS 腕管综合征患者指导](https://www.nhs.uk/conditions/carpal-tunnel-syndrome/) · [血管外科学会急性肢体缺血](https://vascular.org/patients-and-referring-physicians/conditions/acute-limb-ischemia)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":347,"qid":"Q347","section":"健康","chapter":"训练相关健康","question":"跑步或提重物时足底反复麻木，怎样判断需要检查鞋袜、动作负荷，还是需要就医？","title":"跑步或提重物时足底反复麻木，先卸负荷再核对鞋袜","fields":[["怎么做","脚麻时先停跑或安全放下重物。记是一只还是两只脚、足底哪块、当时鞋袜和鞋带是否偏紧、哪种距离或重量触发、停下多久恢复。若只在某双紧鞋出现且一换鞋就缓解，可先检查鞋头空间、袜子是否堆叠、鞋带压迫和训练量。持续、反复、换鞋或减量后仍出现，或伴足部无力、拖脚、腰腿放射症状或走路异常，安排医疗评估。"],["成本","低到中。先调整现有鞋袜和负荷，找不到原因时可做足踝或神经方面的评估。"],["说人话","换松一点的鞋袜是容易排查的一步。症状反复时，把哪一块麻和多久恢复记下来。"],["收益","有助于分辨外部压迫的线索，并及早发现需要进一步检查的症状。"],["证据等级","C。鞋袜调整及复诊线索来自临床指导，症状部位需要结合检查判断。"],["适用与备注","脚突然发冷、苍白并伴剧痛或无力，立即就医。糖尿病或已有足部感觉减退的人，出现新麻木、破皮或伤口时尽快联系医疗团队。"],["来源","[NHS 持续或反复麻木的评估建议](https://www.nhs.uk/symptoms/pins-and-needles/) · [Leeds NHS 足痛和鞋袜调整指导](https://leedscommunityhealthcare.nhs.uk/our-services-a-z/podiatry/foot-pain/) · [血管外科学会急性肢体缺血](https://vascular.org/patients-and-referring-physicians/conditions/acute-limb-ischemia) · [NHS 周围神经病变患者指导](https://www.nhs.uk/conditions/peripheral-neuropathy/)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":348,"qid":"Q348","section":"健康","chapter":"训练相关健康","question":"运动中头部受撞击后头晕或反应慢，什么时候必须退出运动、怎样恢复？","title":"撞头后头晕或反应慢，立即退出并评估","fields":[["怎么做","头部受撞后出现头晕、反应慢、记不清、走路不稳或头痛，立即退出，当天不再上场。由同伴陪同尽快就医，记下撞击经过和症状变化。经评估后按医嘱安排最初约 24–48 小时的相对休息，可在允许范围内做轻量日常活动。随后逐级恢复轻量有氧、专项练习和训练，每个阶段通常至少 24 小时。恢复碰撞、接触或易跌倒的活动前先取得医疗许可。"],["成本","中。会中断训练或比赛，需要医疗评估，也可能需要进一步康复。"],["说人话","脑震荡可以没有昏过去。撞后出现异常，先退场，让医疗人员判断。"],["收益","减少再次撞击风险，按症状和医疗评估逐步恢复日常与体育活动。"],["证据等级","B。退场和返训流程有国际共识支持，早期轻活动的益处也有系统综述。"],["适用与备注","出现难以唤醒、抽搐、反复呕吐、加重的头痛、新发肢体无力或言语含糊，立即呼叫急救。服用抗凝药后发生头部外伤，应尽快寻求医疗评估。"],["来源","[阿姆斯特丹运动脑震荡国际共识](https://bjsm.bmj.com/content/57/11/695) · [CDC 运动性脑震荡现场处理](https://www.cdc.gov/heads-up/response/index.html) · [CDC 脑震荡分阶段返赛](https://www.cdc.gov/heads-up/guidelines/returning-to-sports.html) · [NICE 头部外伤初期评估指南](https://www.nice.org.uk/guidance/NG232/chapter/recommendations)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["B"]},{"id":349,"qid":"Q349","section":"健康","chapter":"训练相关健康","question":"伤后走路没事，回到跑步前该如何和专业人员评估步态、力量与负荷耐受？","title":"伤后走路无碍，评估能否承受重复跑步负荷","fields":[["怎么做","向专业人员说明原伤、现在能走多久、上下楼情况和想回到的跑量。请对方观察走路是否跛行，按伤情测关节活动、力量、控制和平衡，并选适合的负荷耐受测试。有些损伤需要先确认愈合，能否做单腿蹲、提踵或跳跃也由对方决定。允许后从短的走跑交替起步，记录当时和次日，不适加重就回到能耐受的负荷并沟通。"],["成本","低到中。可带日常记录就诊，专业测试项目根据伤情安排。"],["说人话","能走一段路只是起点。跑步还需要反复承受冲击，并保持相对稳定的动作。"],["收益","明确从日常活动到跑步之间需要补足的力量和负荷耐受，获得更适合的起点。"],["证据等级","C。分阶段返训有专业共识支持，具体测试随损伤部位和恢复阶段选择。"],["适用与备注","有骨应力损伤、骨折或术后限制的人，按原治疗团队给的承重和返跑条件走。再次跛行、局部疼痛持续或肿胀增加时，暂停进阶。"],["来源","[团队医生返赛共识（2023 更新）](https://pubmed.ncbi.nlm.nih.gov/38616326/) · [胫骨骨应力损伤后返跑范围综述](https://link.springer.com/article/10.1007/s40279-024-02051-y) · [国际运动员骨应力损伤 Delphi 共识](https://doi.org/10.1136/bjsports-2024-108616)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":350,"qid":"Q350","section":"健康","chapter":"训练相关健康","question":"伤后训练已经恢复，想回比赛还要看哪些表现与第二天反应？","title":"已恢复训练，回比赛前再检查专项表现和次日反应","fields":[["怎么做","把比赛里的要求列出来，例如全程时间、加速、减速、变向、跳落或重复发力。先和专业人员逐项找能在训练中测试的动作，再逐步做到能完成一节接近比赛要求的训练。记动作是否稳定、有没有疼痛或肿胀、是否敢自然用力，以及第二天能否照常走路或训练。若训练仍需要避开比赛必有的动作，提前调低参赛目标，或推迟参赛。"],["成本","中。需要安排专项训练和观察时间，部分人需复评。"],["说人话","平时能练是一回事。正式比赛需要的速度、次数和连续时间都做过，才有依据判断。"],["收益","更早发现训练水平和比赛需求之间的差距，方便调整参赛计划。"],["证据等级","C。专项表现、信心和训练耐受来自返赛共识，24 小时症状观察见于部分伤种，具体标准需要按伤情决定。"],["适用与备注","适用于康复进展稳定的人。曾有手术、严重损伤或存在医疗限制时，请负责康复的团队共同决定。训练或次日出现新肿胀、失稳或明显疼痛，先下调并复评。"],["来源","[团队医生返赛共识（2023 更新）](https://pubmed.ncbi.nlm.nih.gov/38616326/) · [伯尔尼运动物理治疗返赛共识](https://doi.org/10.1136/bjsports-2016-096278) · [PAASS 踝扭伤返赛共识](https://bjsm.bmj.com/content/early/2021/06/22/bjsports-2021-104087)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":351,"qid":"Q351","section":"健康","chapter":"训练相关健康","question":"训练前靠止痛药压住疼痛有哪些风险，怎样决定该停练还是就医？","title":"靠止痛药才能完成训练，先停掉诱发疼痛的动作","fields":[["怎么做","如果必须先吃止痛药才能跑、跳或举重，先取消诱发疼痛的动作。记下何时开始痛、疼到改变了什么动作、有没有肿胀或无力，以及用过的药名和时间。反复出现或已经影响日常活动，预约评估。布洛芬等非甾体抗炎药有胃肠道出血和肾损伤风险，长距离比赛中尤其不宜为了硬撑而自行服用。"],["成本","低到中。停掉诱发动作无需花费，持续症状可安排就诊。"],["说人话","药效上来以后感觉轻一些，伤处能承受多少负荷仍要另外判断。"],["收益","少靠镇痛后的感觉硬撑，保留可用于评估实际伤情的线索。"],["证据等级","B。运动疼痛管理有共识支持，非甾体抗炎药的风险有药品资料及部分耐力运动试验支持。"],["适用与备注","已经有处方的人，按医嘱用药，运动安排和医生讨论。外伤后无法承重、明显变形、持续加重的疼痛或新发麻木无力，尽快就医。"],["来源","[国际奥委会运动员疼痛管理共识](https://stillmed.olympics.com/media/Documents/Athletes/Medical-Scientific/Consensus-Statements/2017_pain-management-elite-athletes.pdf) · [FDA 非甾体抗炎药用药指导](https://www.accessdata.fda.gov/drugsatfda_docs/label/2024/022202s016lbl.pdf) · [超长跑中布洛芬与急性肾损伤随机试验](https://pubmed.ncbi.nlm.nih.gov/28679502/)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["B"]},{"id":352,"qid":"Q352","section":"健康","chapter":"训练相关健康","question":"已经按计划康复却反复疼或停滞，带哪些负荷和症状记录去做复评？","title":"康复反复疼或停滞，带可对比的训练记录复评","fields":[["怎么做","带最近几次训练和康复的实际记录，包括日期、做了哪些动作、重量、组数、次数、跑量或速度，以及工作和其他活动里增加了什么负荷。分别记运动前、过程中、结束后和次日的疼痛、肿胀、无力或失稳，以及哪些活动比上一次能做得更多或更少。也记清计划中哪些动作没做成。复评时请对方确认应保留哪些练习、哪一项先调低，和达到什么表现再增加负荷。"],["成本","低到中。手机备忘录足够，复评是否需要额外检查由医生决定。"],["说人话","哪天做了多少、当天和第二天有什么反应，比一句“一直没好”更容易帮康复人员调计划。"],["收益","给复评留下可对照的症状和功能变化，帮助识别恢复停滞的原因并调整计划。"],["证据等级","C。负荷监测、功能复测和阶段返训来自运动康复共识，所列记录方法可以按伤情调整。"],["适用与备注","突然明显肿胀、无法承重、关节红热伴发热，或出现新发、加重的麻木无力，尽快就医。"],["来源","[伯尔尼运动物理治疗返赛共识](https://doi.org/10.1136/bjsports-2016-096278) · [国际奥委会运动员疼痛管理共识](https://stillmed.olympics.com/media/Documents/Athletes/Medical-Scientific/Consensus-Statements/2017_pain-management-elite-athletes.pdf) · [国际奥委会运动负荷与损伤风险共识](https://bjsm.bmj.com/content/50/17/1030) · [NHS 关节痛就医信号](https://www.nhs.uk/symptoms/joint-pain/)"]],"path":"book/training-health/05-injuries-and-return.md","aliases":"","grades":["C"]},{"id":353,"qid":"Q353","section":"健康","chapter":"训练相关健康","question":"运动中出现胸口压迫感、快晕倒或异常气短，怎么停止运动并求助？","title":"运动中胸口压迫、快晕倒或异常气短，立即停下并求助","fields":[["怎么做","停止跑步或举重，移到近处安全位置，坐下或躺下，请旁人陪同。出现新的胸口压迫感、明显异常气短、快要晕倒或实际晕倒时，立即请赛事医疗到场并呼叫急救，在中国大陆拨 120。报出位置、症状和开始时间。"],["成本","立即结束训练或比赛。请一人留下陪同，另一人到便于找到的位置接应。"],["说人话","停下来，叫人过来，打急救电话。等待时不要独自走远或开车。"],["收益","胸口压迫感、异常气短、冷汗、恶心或头昏可能是需要紧急评估的信号，现场无法凭症状可靠区分原因。急救人员可以更早开始评估。"],["证据等级","C（专业机构急救指南与求助流程）。"],["适用与备注","若之后失去反应、没有正常呼吸或仅喘息，立即转入[心肺复苏和 AED 流程](#q354)。"],["来源","国家卫生健康委胸痛急救指导、美国心脏协会心肌梗死警示症状及 AHA、美国红十字会急救指南。 [国家卫健委急救提示](https://www.nhc.gov.cn/xcs/c100122/202411/81a60171b43d43ff98cc6110d65a4136.shtml) · [AHA 警示症状](https://www.heart.org/health-topics/heart-attack/warning-signs-of-a-heart-attack) · [AHA 与美国红十字会急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"跑步胸口疼 运动时胸痛 胸口疼头晕","grades":["C"],"basis":"急救指南"},{"id":354,"qid":"Q354","section":"健康","chapter":"训练相关健康","question":"同伴突然倒地、叫不醒且呼吸异常，怎样呼救、找 AED 并按急救指导行动？","title":"成人突然倒地、没有正常呼吸，呼叫急救并立即按压","fields":[["怎么做","先确认现场安全。成人叫不应、没有正常呼吸或只偶尔喘息时，立刻叫人拨 120 并去拿 AED。独自一人时，开手机免提呼救，按调度指令立即做胸外按压。双手放胸部中央，每分钟约 100–120 次。成人通常按下约 5–6 厘米，每次让胸廓完全回弹。AED 到场就开机，按语音贴片和操作。"],["成本","需要旁人、电话和能取到的 AED。有人能轮换时尽量减少按压中断。"],["说人话","叫不醒又没有正常呼吸，边呼救边按压。AED 到了就听语音做。"],["收益","成人心搏骤停时，早期胸外按压和快速除颤是基础生命支持的核心。偶尔喘息也可能是异常呼吸。"],["证据等级","C（AHA 成人基础生命支持与中国红十字应急救护指导）。"],["适用与备注","旁观者可直接开始按压。未受过训练或无法提供人工呼吸时，持续按压并听从急救调度。受过训练且能提供人工呼吸时，可每按压 30 次做 2 次人工呼吸。按 AED 语音要求在分析及电击时让大家离开患者，之后立即按提示继续。继续到急救人员接手、恢复正常呼吸或现场不安全。"],["来源","美国心脏协会 2025 成人基础生命支持的公众启动复苏、按压技术及按压通气比例章节，以及中国红十字应急救护资料。 [AHA 2025 成人基础生命支持](https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-basic-life-support) · [上海市红十字会资料](https://www.redcross-sha.org.cn/qxapi/File/056cd78e618d418c88ae20e863dd2009.pdf)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"心肺复苏 心脏骤停 CPR AED 叫不醒 倒地","grades":["C"],"basis":"急救指南"},{"id":355,"qid":"Q355","section":"健康","chapter":"训练相关健康","question":"高温下同伴出现意识混乱，如何识别热射病危险并在等待急救时开始降温？","title":"高温运动后意识混乱，呼救的同时开始降温","fields":[["怎么做","立刻请人拨 120、找现场医疗，同时脱去多余衣物并开始降温。现场有受训团队和设备时，配合团队立即用冷水浸泡颈部以下，保持头部在水面以上。现场无法浸泡时，就近安全移到阴凉处，马上用冷水淋湿身体并扇风，或反复更换湿冷毛巾。意识异常或吞咽不清时，避免喂水。"],["成本","需要同伴分工。一人呼救接应，一人持续协助降温并留意呼吸。"],["说人话","热天运动后突然神志不清，赶快叫急救，同时用手边的水开始降温。"],["收益","运动性热射病可表现为意识或行为异常。及时主动降温是首要处理之一，有条件时全身冷水浸泡可最快降低核心温度。"],["证据等级","C（专业共识与急救指南）。"],["适用与备注","如果无反应且呼吸不正常，立即按[成人急救流程](#q354)行动。将已经采取的降温方式和时间告诉急救人员。"],["来源","ACSM 2023 年运动热病共识的识别和降温部分，以及 2024 年 AHA 与美国红十字会急救指南的运动性高热与热射病章节。 [ACSM 运动热病共识](https://pubmed.ncbi.nlm.nih.gov/37036463/) · [AHA 与美国红十字会急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"中暑 热射病 高温意识模糊 热天倒地","grades":["C"],"basis":"急救指南"},{"id":356,"qid":"Q356","section":"健康","chapter":"训练相关健康","question":"天气炎热但没有人出现症状，怎样用天气条件和个人适应情况决定改时段、改强度或取消训练？","title":"高温无症状时，先改时段和强度，再决定是否取消","fields":[["怎么做","出门前看本地高温预警、湿度和日照，有场地湿球黑球温度（WBGT）就参考组织方规则。刚开始热天训练、没遮阴或做长时间高强度课时，优先改到凉时段或室内。也可缩短课、降强度、增加阴凉休息。预警严重、没有可靠的替代或降温条件时，取消户外课。"],["成本","可能需要换时间、路线或场地。提前决定在哪里停下和返回。"],["说人话","闷热、太阳直晒、没适应时，越早改课越省事。"],["收益","湿球黑球温度能综合反映部分环境热负荷。热病共识也要求考虑衣着、适应程度、强度、时长等因素，不同地区和项目有各自的行动分级。"],["证据等级","C（ACSM 和荒野医学会运动热病指南）。"],["适用与备注","出现头晕、异常疲劳或恶心时及时停下、到凉处。意识异常按[运动性热射病急救](#q355)处理。"],["来源","ACSM 2023 年运动热病共识的环境监测与训练调整部分，以及荒野医学会 2024 年热病指南。 [ACSM 运动热病共识](https://pubmed.ncbi.nlm.nih.gov/37036463/) · [荒野医学会热病指南](https://journals.sagepub.com/doi/10.1177/10806032241227924)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":357,"qid":"Q357","section":"健康","chapter":"训练相关健康","question":"从凉爽地区到湿热城市参赛，提前适应环境时怎么安排训练和休息？","title":"从凉爽地到湿热地参赛，用一到两周逐步熟悉热环境","fields":[["怎么做","能提前到时，先用较短、轻松的走跑熟悉湿热环境，再按恢复和症状逐步增加暴露。把休息、睡眠和跑后补给排在凉爽处。只能提前一两天到，就用短而轻的熟悉跑查看体感，比赛目标按实际热负荷调低。"],["成本","提前抵达可能增加住宿开销。也可利用出发前已有的较暖时段做轻松训练。"],["说人话","刚到先轻一点，休息够。时间不够时，比赛目标留出高温余地。"],["收益","热环境训练共识建议用约一到两周逐步适应。建议主要用于运动者，适应速度因体能、既往暴露和气候而异。"],["证据等级","C（专业共识与大众跑者应用）。"],["适用与备注","热适应和比赛减量同时进行时，可以先保住恢复与主要训练。训练中头晕、恶心或步态变化时及时停下求助。"],["来源","Racinais 等热环境训练共识的热适应建议，以及荒野医学会 2024 年热病指南的热适应部分。运动热病的总体建议另查 ACSM 2023 年共识。 [热环境训练共识](https://pubmed.ncbi.nlm.nih.gov/25943653/) · [ACSM 运动热病共识](https://pubmed.ncbi.nlm.nih.gov/37036463/) · [荒野医学会热病指南](https://journals.sagepub.com/doi/10.1177/10806032241227924)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":358,"qid":"Q358","section":"健康","chapter":"训练相关健康","question":"空气污染或山火烟霾天，怎样看空气质量预警来选室内、室外或休息？","title":"污染或烟霾天，按当地预警选择更干净的场地","fields":[["怎么做","先看当地官方实时和预报 AQI 以及主要污染物。中国大陆 AQI 为 101–150 时，心肺疾病等敏感人群应减少长时间、高强度户外运动。151–200 时，敏感人群应避免这类训练，一般人群也适量减少。201–300 时，老年人和心肺疾病患者应留在室内，停止户外运动，一般人群应减少户外运动。超过 300 时，老年人和患病者应留在室内、避免体力消耗，一般人群应避免户外活动。山火烟霾时优先选择可保持空气洁净的室内场所，或改日。"],["成本","看预警通常只需几分钟。没有合适的室内场地时，把训练改成休息或室内轻活动。"],["说人话","先看官方指数和烟霾情况。污染升高时，长课和强度课可以移到更干净的地方。"],["收益","中国 AQI 规定给出不同污染水平的健康提示。美国环保署建议烟霾期间减少暴露，可利用能过滤颗粒物的室内空间。"],["证据等级","C（官方环境标准和公共卫生建议）。"],["适用与备注","室内若有明显烟味、闷热或受到烟霾渗入，可另找更安全场地。喘鸣、胸痛或明显呼吸困难时停练并按症状求助。"],["来源","生态环境部《环境空气质量指数（AQI）技术规定》HJ 633—2026 及美国环保署山火烟霾指引。 [生态环境部标准](https://www.mee.gov.cn/ywgz/fgbz/bz/bzwb/jcffbz/202602/t20260225_1144441.shtml) · [烟霾暴露指引](https://www.epa.gov/wildfires/reduce-your-smoke-exposure)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":359,"qid":"Q359","section":"健康","chapter":"训练相关健康","question":"冬天户外运动手脚越来越麻、发白或发抖，哪些情况应马上结束训练并求助？","title":"冷天手脚持续发麻或发白，先结束训练并到温暖处","fields":[["怎么做","手指、脚趾越来越麻、发白或皮肤发硬时，立即结束户外活动，到温暖干燥处，换掉湿衣服并保暖。受冷后出现动作笨拙、说话含糊、异常嗜睡或意识混乱时，立即呼叫急救，即使没有发抖。疑似冻伤部位避免揉搓或用火、暖气等直接烤。"],["成本","停下并离开冷风、湿雪，必要时请同伴接应和呼救。"],["说人话","麻木、发白或发抖越来越重，就别再往前跑。先找暖处，出现意识或动作变化就呼救。"],["收益","冻伤常出现麻木、皮肤颜色和质地变化。低体温可出现发抖、笨拙及意识异常，湿衣和风会加快散热。"],["证据等级","C（公共卫生机构和急救指南）。"],["适用与备注","若人无反应且呼吸异常，按[成人急救流程](#q354)处理。已经疑似冻伤也应安排医疗评估。"],["来源","美国疾控中心低体温和冻伤指南及美国心脏协会、美国红十字会急救指南。 [CDC 冬季指南](https://www.cdc.gov/winter-weather/prevention/index.html) · [急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":360,"qid":"Q360","section":"健康","chapter":"训练相关健康","question":"冰雪或冻雨天仍想运动，如何决定改到室内并降低滑倒风险？","title":"遇冻雨或结冰路面，把跑步改到室内","fields":[["怎么做","先查当地道路结冰预警和路线情况。出现冻雨、薄冰，或跑道照明不足、难看清路面时，选室内走跑、骑车或在家练力量。必须步行时穿防滑鞋、放慢、缩小步幅，避开桥面、台阶和车辆附近，路线不稳妥就改期。"],["成本","在家练可省去路程。用跑步机、室内场地时也考虑往返路面。"],["说人话","有冰就别试跑。能在家做的课先在家做。"],["收益","冻雨能在路面形成不明显的冰层。气象和应急指引建议减少不必要的户外活动，必须出门时注意慢行和防滑。"],["证据等级","C（中国气象和应急防护提示，训练替代方案为示例）。"],["适用与备注","路面局部干燥也可能有背阴薄冰。等预警解除、实际路线恢复可安全通行后再跑。"],["来源","中国气象局道路结冰预警防御指南和国家消防救援局冻雨出行指引。 [中国气象局预警规则](https://www.cma.gov.cn/gzk/202005/W020220628619402421665.pdf) · [冻雨防护指引](https://www.119.gov.cn/kp/zjts/qxzh/2026/52813.shtml)"]]
