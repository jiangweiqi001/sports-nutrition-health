g.html) · [国家卫健委发布页附件 3](https://www.nhc.gov.cn/wjw/c100378/202402/afd5dda4bd6745fda10aad8d43a16369.shtml)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":189,"qid":"Q189","section":"营养","chapter":"日常饮食","question":"买全麦面包、杂粮馒头或燕麦片，怎样从配料表判断全谷物是不是主要原料？","title":"看全麦粉或燕麦排在哪，再找全谷物含量","fields":[["怎么做","看配料表里的谷物原料。想买以全麦为主要谷物原料的面包，优先找全麦粉排在普通小麦粉前、并有含量说明的款式。买杂粮馒头也看排在前面的谷物原料。想买原味燕麦片，可以选配料只有燕麦片的产品。看见两个百分比时，先核对一个写的是添加量、成品含量，还是以干重计。"],["成本","拿两款现成商品并排看标签即可。假设两袋同样 400 克的面包分别卖 10 元和 14 元，每 100 克分别是 2.50 元和 3.50 元，再按标签比较能买到什么。"],["说人话","包装上的名称负责告诉你它叫什么。想知道主要用了什么，看配料表和比例。"],["收益","配料通常按加入时的重量由多到少排列，少量配料有排序例外。排名能帮助分辨主要谷物原料，清楚标示的含量才能用来比较占比。"],["证据等级","标签依据食品安全国家标准，何为全谷物以及全谷物标识口径依据中国营养学会团体标准。"],["适用与备注","“全麦粉排第一”只表示它通常是加入量最多的单项配料，成品占比仍要看标明的数值和口径。颜色深、名字有“杂粮”、配料中有麸皮，都可以再回到配料表核对。"],["来源","国家卫健委 GB 7718—2011 问答第二十五问和有关配料定量标示的问答、GB 7718—2025 问答的配料及定量标示条目。中国营养学会 T/CNSS 008—2021 第 4.2、4.3 和 5.4 节。 [2011 版标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/544c0539b95d4d35b99ffbc105579071.shtml) · [2025 版标签问答](https://www.nhc.gov.cn/sps/c100087/202509/bc824a504ec34c27883da73f14c20d44.shtml) · [全谷物团体标准](https://www.ttbz.org.cn/Home/PdfFileStreamGet/c3QsMTMxNjkw)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":[]},{"id":190,"qid":"Q190","section":"营养","chapter":"日常饮食","question":"米饭、面条和馒头换着吃时，怎么分清包装上的生重、熟重和实际吃掉的份量？","title":"先对上生熟状态，再换算吃掉的份量","fields":[["怎么做","称干米或干面时，用标明干米或干面的数据。称碗里的米饭或煮好的面条时，找对应的熟食数据。买即食馒头则按包装写的每 100 克或每份换算。如果全家吃一锅饭，也可以称一次干米和煮好后整锅米饭，按分到的熟饭比例折算。"],["成本","有厨房秤就称一次自己的做法。举例，假设 300 克干米煮出 780 克白米饭，吃了其中 195 克，就是这一锅的四分之一，折合约 75 克干米。"],["说人话","秤上称的是哪一种状态，就查哪一种状态。包装上的一份也要先看有多少克。"],["收益","煮饭、煮面后，水分改变了每 100 克食物所含的营养量。按相同状态和可食部分核算，可以少记错一份主食。"],["证据等级","标签计量单位及食物成分表口径有直接依据。整锅比例是家庭估算。"],["适用与备注","算例假设白米饭拌匀，没有加入其他食材。换米、换水量或煮得更软，按这次实际重量重算。拌饭、炒面里的油和其他配料另计。"],["来源","国家卫健委 GB 28050—2011 问答第四十三和第六十三问。国家卫健委《成人肥胖食养指南（2024 年版）》附录 2 表 2.1 分列干粮、米饭和面制品。 [营养标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml) · [国家卫健委发布页附件 3](https://www.nhc.gov.cn/wjw/c100378/202402/afd5dda4bd6745fda10aad8d43a16369.shtml)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":[]},{"id":191,"qid":"Q191","section":"营养","chapter":"日常饮食","question":"只吃粥或汤面时容易很快饿，怎么比较浓稠度、份量和配菜带来的差别？","title":"吃完粥或汤面很快饿，先看碗里有多少米面和配菜","fields":[["怎么做","同样一碗粥或面，先比较实际用了多少米、面条和配菜。粥太稀、米少，可以按平时的饭量多放些米，再搭鸡蛋或豆腐、蔬菜。汤面如果面少、配菜也少，下一次先试加面或加一份配菜，记一下离下顿还有多久就开始饿。"],["成本","从一项开始。比如在原来的白粥旁加家里已有的一枚鸡蛋和一小碟青菜，或把原来一袋面条分两顿时盛得过少的一顿补足。"],["说人话","碗看着很满，也可能大半是汤。先看看实际吃进去多少主食、菜和蛋白质食物。"],["收益","把食物的份量和搭配分开看，能找出这顿饭最容易调整的地方。一项交叉试验改变相同材料的汤的形态，没测到不同形态间有明确的饱腹差异。这项结果来自餐前喝汤，粥或汤面作正餐时可按自己的反应调整。"],["证据等级","C（餐食搭配依据膳食指南，粥或汤面不同配方的饱腹效果缺少直接比较）。"],["适用与备注","适合吃完偏稀或偏少的一餐后经常很快又饿的普通成年人。吃完这餐马上去训练时，份量和时间另看[练前进食安排](../04-training-nutrition.md#q06)。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则六实践应用（一）至（三）。Flood 和 Rolls 随机交叉试验的「Ratings of hunger and satiety」与讨论。 [三餐安排](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html) · [汤的形态与饱腹试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC2128765/)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":192,"qid":"Q192","section":"营养","chapter":"日常饮食","question":"常把甜面包、饼干当主食，怎么用超市里好买的食物逐步替换？","title":"常拿甜面包或饼干当早餐，先备一组同样方便的替换","fields":[["怎么做","先替换最经常靠甜面包或饼干对付的一餐。办公室有热水，可以备原味即食燕麦，搭一盒常温奶或豆饮和一个水果。家里有蒸锅，可把馒头和鸡蛋一起备好。出门前时间紧，可以带配料明确的全麦吐司和一盒奶，再加水果。"],["成本","按一次吃掉的份量算。假设 500 克原味燕麦 15 元，取 50 克是 1.50 元，搭配的奶、鸡蛋或水果另计。第一次只买够几次试吃的量。"],["说人话","先买到同样顺手的主食和搭配，忙的时候才有得换。"],["收益","替换经常吃的一餐，可以为原本只有甜点心的早餐增加谷物、蛋白质来源和水果，也更容易减少经常吃甜点带来的添加糖摄入。"],["证据等级","C（搭配与少吃甜味糕点来自膳食指南，具体换法是执行示例）。"],["适用与备注","适合日常反复用甜面包、饼干顶一餐的成人。包装上有“全麦”或“燕麦”字样时，仍可按[配料表方法](#q189)选。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则六实践应用（二）「如何保证天天吃好早餐」及准则五实践应用中有关控制添加糖、少吃甜味食品的部分。 [早餐](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html) · [控制添加糖](https://dg.cnsoc.org/article/04/ApX3_ozGTmSoqQaFFh5z_Q.html)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":193,"qid":"Q193","section":"营养","chapter":"日常饮食","question":"乳糖不耐受时，怎么在无乳糖奶、酸奶和强化豆饮之间比较钙和蛋白质？","title":"乳糖不耐受时，按自己吃得下的份量比较钙和蛋白质","fields":[["怎么做","挑自己能耐受的一种开始。比如用无乳糖奶替换普通奶，或随餐试小份原味酸奶。想喝豆饮，可找明确标有钙含量的强化豆饮，并比较一杯实际能喝到多少钙和蛋白质。饮品按毫升、酸奶按克分别换算到实际吃的量。"],["成本","假设一盒 250 毫升无乳糖奶卖 5 元，每 100 毫升含钙 110 毫克、蛋白质 3.2 克，整盒是 275 毫克钙和 8 克蛋白质。假设一盒同体积的强化豆饮卖 6 元，每 100 毫升含钙 120 毫克、蛋白质 3.0 克，整盒是 300 毫克钙和 7.5 克蛋白质。购买时按实际价格、标签和份量比。"],["说人话","先选喝完舒服的，再看一杯实际给你多少钙和蛋白质。"],["收益","无乳糖乳制品和一部分酸奶能给乳糖不耐受的人增加选择。强化豆饮也可以提供钙，具体数量取决于产品和自己喝的份量。"],["证据等级","C（乳糖管理和钙的食物来源依据临床机构指南。不同产品的数值按标签比较）。"],["适用与备注","不同人能耐受的乳糖量不同。无乳糖奶仍含牛奶蛋白，有牛奶蛋白过敏的人应按自己的过敏管理方案选择。包装未标钙时，无法仅靠蛋白质含量推算钙。"],["来源","美国国立糖尿病、消化和肾脏疾病研究所的「Foods that contain lactose」「Lactose-free and lactose-reduced milk and milk products」和「Calcium and Vitamin D」，以及乳糖不耐与牛奶过敏的区别。钙和蛋白质的单位与份量见 GB 28050—2011 第 3.4 条、表 1。 [乳糖不耐受的饮食指导](https://www.niddk.nih.gov/health-information/digestive-diseases/lactose-intolerance/eating-diet-nutrition) · [牛奶过敏与乳糖不耐](https://www.niddk.nih.gov/health-information/digestive-diseases/lactose-intolerance/symptoms-causes) · [营养标签标准](https://www.nhc.gov.cn/zwgk/cybz/201306/17e7d74af39c4b279d8ef26c4a6a6a04.shtml)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":194,"qid":"Q194","section":"营养","chapter":"日常饮食","question":"豆腐、豆干和豆腐皮看起来都差不多，选购时怎么看钙、钠和份量？","title":"买豆腐、豆干或豆腐皮，把钙和钠换算成实际份量","fields":[["怎么做","先挑想做的菜，再按准备吃的克数算钠。想靠豆制品多补一点钙，优先找有钙毫克数的产品。配料表上的硫酸钙能提示凝固剂来源，实际能吃到多少仍要看标签或对应的食物成分数据。干豆腐皮和鲜豆腐按各自状态称，泡发后改用对应数据。"],["成本","算例用假设标签。甲豆腐 200 克卖 4 元，每 100 克含钙 150 毫克、钠 20 毫克，吃半盒是 2 元、150 毫克钙和 20 毫克钠。乙卤豆干 100 克卖 5 元，每 100 克含钙 180 毫克、钠 600 毫克，吃半袋是 2.50 元、90 毫克钙和 300 毫克钠。"],["说人话","先想这顿吃几块。咸豆干要算钠，想补钙就看标出的钙。"],["收益","豆制品的用料、含水量、凝固方法和调味各不相同。按可食份量换算能看清实际差别，尤其能避免把一小块调味豆干和一整份白豆腐直接比较。"],["证据等级","食物成分表和标签口径可直接核查。示例使用假设值。"],["适用与备注","散装产品没有标签时，用名称和加工状态最接近的数据估算。豆腐皮在不同地区可能指千张，也可能指腐竹一类产品，查数据时先确认是哪种。"],["来源","美国国立卫生研究院膳食补充剂办公室钙资料「Food」和表 2 的豆腐条目及脚注。加拿大卫生部食物成分表「Legumes and Legume Products」下的豆腐条目。国家卫健委 GB 28050—2011 第 3.4 条和表 1。 [钙的食物来源](https://ods.od.nih.gov/factsheets/Calcium-HealthProfessional/) · [加拿大食物成分表](https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/nutrient-data/nutrient-value-some-common-foods-2008.html) · [营养标签标准](https://www.nhc.gov.cn/zwgk/cybz/201306/17e7d74af39c4b279d8ef26c4a6a6a04.shtml)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":[]},{"id":195,"qid":"Q195","section":"营养","chapter":"日常饮食","question":"不常买鲜鱼，用冷冻鱼或罐头鱼时，怎么兼顾鱼的份量、钠和做法？","title":"用原味冷冻鱼或低钠款罐头鱼补上平时少吃的鱼","fields":[["怎么做","买冷冻鱼先看配料表，选便于按餐取用的鱼块，按包装说明解冻和煮熟。选罐头鱼时，先看沥干物或固形物重量，再比较相近份量的钠。营养标签写的是沥干后鱼肉，就按吃掉的鱼肉算。罐头已经调味，拌饭、做三明治或配蔬菜时可先少加调味料。"],["成本","按实际吃的鱼肉比价。假设一罐 12 元，净含量 160 克、沥干鱼肉 120 克，每 100 克鱼肉成本是 10 元。冷冻鱼也先去掉不吃的骨、皮，再算每 100 克的成本。"],["说人话","冷冻鱼方便留着下次做，罐头鱼方便随手吃。比较时看实际吃得到多少鱼、里面有多少钠。"],["收益","用冷冻或罐装选项可以减少买不到鲜鱼时漏掉的一顿鱼。分别查固形物和钠，能判断罐头里有多少可吃的鱼，以及做菜还需不需要加盐。"],["证据等级","C（鱼类选择和烹调依据膳食指南。固形物口径依据标签标准）。"],["适用与备注","同类罐头的钠和调味差别以实际标签为准。冷冻鱼解冻按包装指示，需要解冻时可放在冰箱冷藏室。孕期、哺乳期或有医嘱者按相应鱼种和饮食指导选择。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则四核心推荐及实践应用（二）。国家卫健委 GB 7718—2011 问答第四十八问。加拿大卫生部选鱼指南的「Frozen fish」「Canned fish」和食品安全说明的解冻部分。 [中国膳食指南](https://dg.cnsoc.org/article/04/3tyM8WoTTUmc_oFHMymk3Q.html) · [固形物标示问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/544c0539b95d4d35b99ffbc105579071.shtml) · [冷冻鱼和罐头鱼怎么选](https://www.canada.ca/en/health-canada/services/food-guide/eating-support/kitchen/cooking-skills/simple-guide-selecting-fish.html) · [食品解冻说明](https://www.canada.ca/en/health-canada/services/general-food-safety-tips/defrosting-safety.html)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":196,"qid":"Q196","section":"营养","chapter":"日常饮食","question":"一周常吃香肠、午餐肉或火腿，哪些平价食物能替换其中几顿？","title":"先把常吃的一两顿加工肉换成鸡蛋、豆腐或原味禽肉","fields":[["怎么做","找出最常出现加工肉的餐。早餐火腿夹馒头可试鸡蛋夹馒头，泡面里习惯加午餐肉可换豆腐或鸡蛋，带饭用的香肠可换自家做的鸡腿肉。比较价钱时，以一顿实际吃的份量为单位。想保持蛋白质摄入，用标签或成分表核对两种搭配。"],["成本","假设一包午餐肉 10 元、200 克，一次用 50 克是 2.50 元。若一盒豆腐 4 元、400 克，一顿用 150 克是 1.50 元。用当地售价重算，并按实际食量选搭配。"],["说人话","从固定出现的一顿换起，先找同样方便、自己也愿意吃的食物。"],["收益","用原味食材替换部分香肠、午餐肉或火腿，可以减少加工肉摄入，钠的变化则看原产品和新做法。国际癌症研究机构评估认为，加工肉摄入增加结直肠癌风险。"],["证据等级","C（少吃深加工肉制品依据中国膳食指南；替换菜单和成本是执行示例）。结直肠癌风险依据国际癌症研究机构的证据评估。"],["适用与备注","加工肉主要指经过盐渍、腌制、发酵、烟熏等处理的肉类产品。替换的是哪一顿、用了什么调味料，都可以按自己的常见吃法比较。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则四实践应用（四）「少吃熏腌和深加工肉制品」。国际癌症研究机构第 114 卷问答第 1–2 页的加工肉定义和结直肠癌结论。 [中国膳食指南](https://dg.cnsoc.org/article/04/3tyM8WoTTUmc_oFHMymk3Q.html) · [国际癌症研究机构问答](https://www.iarc.who.int/wp-content/uploads/2018/11/Monographs-QA_Vol114.pdf)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":197,"qid":"Q197","section":"营养","chapter":"日常饮食","question":"长期吃纯素，怎样从强化食品和补充剂标签核对维生素 B12 来源？","title":"长期纯素饮食，先核对一周里稳定的维生素 B12 来源","fields":[["怎么做","列出常吃的强化食品，找标签上维生素 B12 的微克数和计量单位，再按实际份量和频率核对。买营养酵母、早餐谷物或豆饮时，逐款确认有没有明确标示。补充剂看一份是几片、每份有多少微克、怎么用。日常吃的强化食品不固定时，可与营养专业人员讨论更容易坚持的补充安排。"],["成本","花几分钟核对实际使用成本。假设 250 毫升强化豆饮卖 6 元，标签写每 100 毫升有 0.8 微克维生素 B12，整盒有 2.0 微克。若比较补充剂成本，按实际服用频率和每瓶能用多久算。"],["说人话","把实际会吃、标签上又查得到 B12 的来源记下来。换品牌时重查。"],["收益","长期纯素的人更容易缺乏维生素 B12。规律使用确有标示的强化食品或补充剂有助降低缺乏风险。"],["证据等级","C（人群风险和补充来源依据专业机构资料。标签换算是核对摄入量的方法）。"],["适用与备注","上述豆饮只是算例。补充剂和食品的单次剂量不同，吸收比例也会随剂量变，制定补充方案时不要仅按两者的标签微克数等量替换。已确诊缺乏或有吸收障碍的人，补充方式由医疗人员评估。"],["来源","美国国立卫生研究院膳食补充剂办公室维生素 B12 专业资料的「Sources of Vitamin B12」和「People who follow vegetarians diets」。国家卫健委 GB 28050—2011 第 3.4 条和表 1 的标示口径。 [维生素 B12 资料](https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/) · [营养标签标准](https://www.nhc.gov.cn/zwgk/cybz/201306/17e7d74af39c4b279d8ef26c4a6a6a04.shtml)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":198,"qid":"Q198","section":"营养","chapter":"日常饮食","question":"买原味坚果还是盐焗、裹糖坚果，怎么用小包装和标签管理份量？","title":"常备原味坚果，开袋前先分出这次吃的量","fields":[["怎么做","先看配料表，想买原味可选只列坚果、未额外加盐和糖的产品。盐焗款比较同重量的钠，裹糖款看有没有糖、糖浆等配料，有糖含量时再比较数值。大袋可以用小碟或小盒分出这次要吃的量。买小袋也要看一袋克数，以及袋内有没有混入果干或糖衣。"],["成本","假设 200 克原味坚果卖 20 元，分成十份，每份 20 克约 2 元。若同类坚果 20 克独立包装卖 3 元，就比较每次多付的 1 元是否值得。20 克是分装算例。"],["说人话","大袋先抓一份再收起来。想少些盐或糖，拿原味和调味款的标签对着看。"],["收益","坚果可提供不饱和脂肪，且能量密度较高。买无添加盐、糖的款式有助减少调味带来的额外摄入，提前分份让实际吃的量容易看清。"],["证据等级","C（适量吃坚果和选择未额外加盐、糖的款式依据膳食指南，分装为执行建议）。"],["适用与备注","带壳品种按果仁的可食重量比价。营养成分表没有单列糖时，可以从配料表识别是否使用甜味配料，具体糖量仍需看产品资料。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则三核心推荐。加拿大卫生部蛋白质食物指南「Nuts and seeds」及食物成分表「Nuts and Seeds」。国家卫健委 GB 28050—2011 和 GB 28050—2025 问答的标示内容。 [中国膳食指南](https://dg.cnsoc.org/article/04/70JvPbFmTlyZbjoO67LeRg.html) · [坚果选购指导](https://www.canada.ca/en/health-canada/services/food-guide/explore/healthy-eating-recommendations/eat-variety/eat-proteins.html) · [食物成分表](https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/nutrient-data/nutrient-value-some-common-foods-2008.html) · [新版营养标签问答](https://www.nhc.gov.cn/sps/c100087/202509/470fa4ff5de14dd38619223cce9da4e7.shtml)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":199,"qid":"Q199","section":"营养","chapter":"日常饮食","question":"蔬菜常吃不够，怎么用冷冻蔬菜、方便处理的鲜菜或低钠罐头补上？","title":"鲜菜来不及处理，就用原味冷冻菜或钠较少的罐头补一份","fields":[["怎么做","先给最容易漏菜的一顿备好选项。能很快用完的鲜菜，可选番茄、青菜或已经切分的西兰花。忙的时候用原味冷冻西兰花、胡萝卜或混合蔬菜，按包装说明加热。选罐头蔬菜时，同类产品换算到同样份量比较钠，优先选钠较少的款。用已有咸味的菜时，先尝再调味。"],["成本","按能吃完的部分比价。举例，500 克原味冷冻菜卖 12 元，每 100 克是 2.40 元。鲜菜 500 克卖 8 元，如果实际只吃了 300 克，每 100 克吃到的菜约 2.67 元。算例中的损耗随食材和保存方式变。"],["说人话","鲜菜赶不上做，冰箱里有一袋拎得出来的菜，这顿就更容易补上。"],["收益","世界卫生组织的蔬果建议也包含适当选择的冷冻和罐装产品。把能直接取用的菜备在家里，可以减少因为买菜或洗切来不及而漏吃蔬菜的情况。"],["证据等级","C（蔬菜选择依据公共卫生营养指南。备货、比价为执行方法）。"],["适用与备注","冷冻菜里的玉米粒、土豆较多时，可另添些绿叶菜或其他蔬菜。罐头按包装保存，开封后按说明处理。"],["来源","世界卫生组织 2023 年碳水化合物指南「Remarks」中关于蔬果形态的段落及《Healthy diet》「Carbohydrates」。中国营养学会《中国居民膳食指南（2022）》准则三实践应用（一）与（二）。 [世界卫生组织指南](https://iris.who.int/bitstream/handle/10665/370420/9789240073593-eng.pdf) · [冷冻和罐装品选择](https://www.who.int/news-room/fact-sheets/detail/healthy-diet) · [中国膳食指南](https://dg.cnsoc.org/article/04/70JvPbFmTlyZbjoO67LeRg.html)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":200,"qid":"Q200","section":"营养","chapter":"日常饮食","question":"整个水果、鲜榨果汁和果干怎么比较，哪种适合当经常吃的水果？","title":"平时优先吃整个水果，果汁和果干另看份量","fields":[["怎么做","能买到鲜果时，先选平时吃得完、方便带的整果。喝果汁时，用小杯倒出实际要喝的量。买果干时，看看配料表有没有糖、糖浆等，再按食用份量看标签。葡萄干、杏干等水分比鲜果少，先倒出一小份再收袋。"],["成本","可用实际份量来比价。假设一个苹果 2 元，一盒 250 毫升苹果汁 6 元，喝半盒是 3 元。果干按这次吃掉的克数计算。三者的营养另看，价格算例仅用于买东西时比较。"],["说人话","平常想吃水果，就买好带好吃的整个水果。果汁好喝、果干好带，倒出来多少就算多少。"],["收益","加拿大食物成分表中，一个可食部 138 克的带皮苹果含约 2.6 克膳食纤维，而 125 毫升一款即饮苹果汁含约 0.1 克。果汁即使没有另外加糖，其中的糖也属于世界卫生组织所说的游离糖。果干仍可含纤维，按实际小份吃更便于比较。"],["证据等级","C（常吃鲜果依据中国膳食指南。苹果、苹果汁的数字是成分实例）。"],["适用与备注","苹果汁数据来自一个成分表条目。鲜榨后的纤维含量也取决于是否留下果肉；不同水果、果干及果汁以相应数据为准。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则三核心推荐及平衡膳食宝塔第二层。世界卫生组织《Healthy diet》「Carbohydrates」「Sugars」。加拿大卫生部成分表「Fruit and Fruit Juices」中苹果、即饮苹果汁、鲜杏及杏干条目。 [中国膳食指南](https://dg.cnsoc.org/article/04/70JvPbFmTlyZbjoO67LeRg.html) · [膳食宝塔](https://dg.cnsoc.org/article/04/RMAbPdrjQ6CGWTwmo62hQg.html) · [世界卫生组织健康饮食](https://www.who.int/news-room/fact-sheets/detail/healthy-diet) · [水果成分表](https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/nutrient-data/nutrient-value-some-common-foods-2008.html)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":201,"qid":"Q201","section":"营养","chapter":"日常饮食","question":"想多吃纤维却容易胀，怎么从一种全谷物或豆类开始慢慢加？","title":"一加纤维就容易胀，先试一种食物的小份量","fields":[["怎么做","从平时吃着舒服的一餐选一项，比如用少量燕麦代替一部分白米，或在正餐加入一两勺煮熟的杂豆。试几次，简单记下食物、份量和胀气的时间。能接受再略增份量或加第二种食物。明显不舒服时，先回到此前能接受的份量，同时留意平时饮水是否足够。"],["成本","可先用家里已有的一种杂粮或豆类，留几次就餐记录。假设原味燕麦每公斤 20 元，一次替换用 20 克，燕麦这部分约 0.40 元。"],["说人话","别把早餐加燕麦、午饭加杂豆和晚饭加一大份菜挤在同一天试。每次改一点，更容易看清自己吃什么舒服。"],["收益","全谷物和杂豆可提供膳食纤维。部分人吃了某些富含纤维的食物会更容易胀。逐步添加并记录，可以更容易找到能长期吃的种类和份量。"],["证据等级","C（逐步增加纤维和记录症状有临床机构指导支持。具体起始份量和观察时间是个人试法）。"],["适用与备注","适合加量后轻度、短暂胀气的人。症状持续、突然改变或同时有腹痛、体重无意下降，宜就医评估。想把全谷物加进日常主食，可看[全谷物替换](01-staples-and-protein.md#q187)。"],["来源","美国国立糖尿病、消化和肾脏疾病研究所便秘饮食指导的「Fiber」「Plenty of water」，及胀气资料的饮食改变、何时就医部分。中国营养学会《中国居民膳食指南（2022）》准则三实践应用（五）。 [逐步增加纤维](https://www.niddk.nih.gov/health-information/digestive-diseases/constipation/eating-diet-nutrition) · [饮食与胀气](https://www.niddk.nih.gov/health-information/digestive-diseases/gas-digestive-tract/eating-diet-nutrition) · [胀气症状与就医](https://www.niddk.nih.gov/health-information/digestive-diseases/gas-digestive-tract/symptoms-causes) · [全谷物和杂豆](https://dg.cnsoc.org/article/04/70JvPbFmTlyZbjoO67LeRg.html)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":202,"qid":"Q202","section":"营养","chapter":"日常饮食","question":"做中餐时怎样把盐、酱油、蚝油和咸菜里的钠加在一起估算？","title":"把盐、酱油和咸菜都换算成毫克钠，再加总","fields":[["怎么做","先看每种调味料的营养成分表用的是每 100 克、每 100 毫升还是每份。按实际用量乘算，用克的量配按克标的标签，用毫升的量配按毫升标的。普通食盐可以按 1 克盐约含 400 毫克钠换算，低钠盐用包装上的实际钠含量。把酱油、蚝油、咸菜等的钠加到同一笔账。"],["成本","有厨房秤和量勺就能做一次。假设一盘菜加普通盐 1 克，酱油 10 毫升（每 100 毫升钠 5,000 毫克），蚝油 5 克（每 100 克钠 4,000 毫克），咸菜 20 克（每 100 克钠 1,500 毫克）。仅这四样分别是 400、500、200 和 300 毫克钠，合计约 1,400 毫克。"],["说人话","拿掉盐罐之后，锅里还有酱油、蚝油和咸菜。先算哪样给这盘菜加的钠最多。"],["收益","统一到毫克钠后，能发现调味料叠加了多少，也能比较少用其中一种能减掉多少。中国居民膳食指南为成年人给出全天食盐不超过 5 克的建议，换算约为 2,000 毫克钠。"],["证据等级","C（成年人日常食盐目标依据公共卫生指南）。营养标签上的钠单位和换算可直接核查。"],["适用与备注","算例只算加入的四样，食材本身和当天其他食物的钠还要另计。几人分食、汤汁留剩时，个人实际吃到的量只能大致估计。"],["来源","国家卫健委 GB 28050—2011 问答的每份标示部分及 GB 28050—2025 问答的钠与盐换算部分。中国营养学会《中国居民膳食指南（2022）》准则五核心推荐和实践应用（一）。 [每份标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml) · [钠与盐换算](https://www.nhc.gov.cn/sps/c100087/202509/470fa4ff5de14dd38619223cce9da4e7.shtml) · [中国膳食指南](https://dg.cnsoc.org/article/04/ApX3_ozGTmSoqQaFFh5z_Q.html)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":203,"qid":"Q203","section":"营养","chapter":"日常饮食","question":"菜里少放些盐后味道变淡，可以用哪些现有的香料、醋或烹调方法调整？","title":"少放一种咸调料，用葱姜蒜、香料或醋补味","fields":[["怎么做","挑一道常做的菜，先少放一种用量大的咸调料。清蒸鱼可用姜丝和葱；拌黄瓜试用蒜末和醋；炒青菜可加蒜、辣椒或花椒。汤、炖菜或清炒菜可以临出锅先尝，再加少量盐。用复合香料粉前，先看里面有没有盐。"],["成本","用家里已有的姜、蒜或醋即可。比如原来做一盘菜加 2 克普通盐，先试减到 1.5 克，约少加入 200 毫克钠。若同时多放了咸酱汁，就用[钠合计算法](#q202)重算。"],["说人话","想让菜有味，葱姜蒜、香气和酸味都能帮忙。最后尝一口，再决定要不要补盐。"],["收益","少量分次调味，更容易知道什么味道够用。用不额外加盐的香料或酸味替换一部分高钠调味料，能直接减少加入菜里的钠。"],["证据等级","C（用香料、醋增加风味以及逐步减盐依据公共卫生指导。例子是家庭试法）。"],["适用与备注","适合日常做饭调味。调味醋、鸡精、酱料和预拌料可能含钠，按标签核对。腌制保存用的配方按经验证的做法执行。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则五实践应用（一）的定量用盐及临出锅加盐建议。加拿大卫生部《Prepare meals and snacks using healthy ingredients》「Add flavour」。 [中国膳食指南](https://dg.cnsoc.org/article/04/ApX3_ozGTmSoqQaFFh5z_Q.html) · [用香料、醋或柠檬增加风味](https://www.canada.ca/en/health-canada/services/food-guide/explore/healthy-eating-recommendations/limit-highly-processed/prepare-meals-snacks-healthy-ingredients.html)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":204,"qid":"Q204","section":"营养","chapter":"日常饮食","question":"同样是食用油，家里常做凉拌、炒菜和煎炸时怎么选、怎么估实际用量？","title":"凉拌按口味、炒菜看用途、煎炸控温，用多少先量一次","fields":[["怎么做","凉拌可以用少量香油或自己喜欢的植物油。日常炒菜选包装说明适合加热烹调的植物油，例如适合炒菜的菜籽油；用控油壶或勺定量，避免把油烧到冒烟。偶尔油炸时，选包装明确适合煎炸的油，避免反复长时间加热。常做的菜也可以换一两次蒸、煮、炖或拌。"],["成本","家里有厨房秤，可做饭前后称一次油瓶。假设倒了 12 克油做两道菜，两人均分且油汁全部吃完，约是每人 6 克。煎炸后剩下的油较多时，倒进去的量只能反映用掉多少库存，吃进去的量还要看残油和食物吸油情况。"],["说人话","先量实际倒了多少。凉拌看香味，炒菜看瓶上写的用途，高温油炸还要看油有没有冒烟。"],["收益","带刻度的容器或称重能让倒油量可见。蒸、煮等做法通常能少用一些油。长时间高温和反复使用会加速煎炸油变质。"],["证据等级","C（定量用油、少煎炸及煎炸油使用依据营养和食品安全机构指导）。"],["适用与备注","中国膳食指南给一般成年人每天 25–30 克烹调油的参考，汇总当天各餐。分食不均、锅里剩油或外食时，个人摄入只能粗估。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则五核心推荐及实践应用（三）。国民营养健康指导委员会办公室 2024 年「减油、增豆、加奶」第 3–5 条。香港食物安全中心《Recommendations on the use of deep-frying oil》的选油、控温及换油部分。 [中国膳食指南](https://dg.cnsoc.org/article/04/ApX3_ozGTmSoqQaFFh5z_Q.html) · [家庭减油建议](https://www.nhc.gov.cn/sps/c100087/202404/90c64c79708740a1bca0ee31e524caf7.shtml) · [煎炸油使用指引](https://www.cfs.gov.hk/english/food_leg/files/guidelines_use_of_deep_frying_oil_e.pdf)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":205,"qid":"Q205","section":"营养","chapter":"日常饮食","question":"买盐时怎么分清加碘盐、普通盐和低钠盐，家里多人共用要考虑什么？","title":"买盐分别看碘、钠和钾，先确认全家能否共用","fields":[["怎么做","看是否标有“加碘”或碘含量，再看是否标有“低钠盐”、钾含量或配料中的氯化钾。加碘和低钠是两项不同的属性，可以出现在同一袋盐上。通常按所在地补碘建议选择是否加碘。有肾功能问题、被告知限钾、正在用补钾剂或某些影响血钾的药物时，换含钾低钠盐前先向医生或药师确认。"],["成本","买前核对两袋盐的标签。假设 400 克装 4 元和 6 元，每次用 2 克分别花 0.02 元和 0.03 元。家庭共用时先解决适用性，再比较价格。"],["说人话","看盐袋要回答两个问题。家里需要加碘吗？这袋低钠盐里的钾，所有要吃这锅菜的人都适合吗？"],["收益","加碘盐可帮助预防碘不足。适合使用低钠盐的成年人，用含钾低钠盐替换部分普通盐可减少同量盐带来的钠。日常酱油、咸菜等仍计入总钠。"],["证据等级","C（补碘与减钠选择依据中国膳食指南和世界卫生组织指导。世界卫生组织将成年人使用含钾低钠盐的建议列为有条件推荐）。"],["适用与备注","世界卫生组织这项换盐建议覆盖一般成人，孕妇和儿童另按自身指南。若共餐者有高钾风险，给其吃的公共菜不用含钾低钠盐。高水碘地区及医嘱限碘者按当地公共卫生或医疗指导选盐。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则五实践应用（一）第 5 点。国家卫健委关于低钠盐的答复列明 GB 2721—2015 的定义及包装警示。世界卫生组织 2025 年低钠盐指南摘要「Scope of the recommendation」及第 10 页有关家庭共餐的说明。 [碘盐建议](https://dg.cnsoc.org/article/04/ApX3_ozGTmSoqQaFFh5z_Q.html) · [国内低钠盐标签](https://www.nhc.gov.cn/wjw/tia/201812/9e51873ca13c42c2b85556d2aecdbc55.shtml) · [世界卫生组织指南摘要](https://iris.who.int/bitstream/handle/10665/381064/9789240108363-eng.pdf)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":206,"qid":"Q206","section":"营养","chapter":"日常饮食","question":"做深色蔬菜总是剩下，怎么轮换容易吃完的菜，又能让一周多几种颜色？","title":"深色蔬菜总剩下，就从小份、熟悉做法和轮换开始","fields":[["怎么做","一周先挑两三样自己吃得完的菜。深绿色可选菠菜或西兰花，橙红色可选胡萝卜，紫红色可试紫甘蓝。留下最容易做的一种作常备，再每周轮换其中一种。家里嫌一大盘吃不完，可以把小份深色菜加进常做的面、炒蛋或配菜。先买一两顿的量，吃完再补。"],["成本","记录实际买了多少、做了多少、剩了多少。举例，两种菜各买 250 克，分别做两次，每次大约取 125 克待处理。按自己做饭次数缩放，比囤一周用量更容易试出口味。"],["说人话","先把两三种顺手的菜做得能吃完，再换一种颜色试试。"],["收益","中国居民膳食指南建议一般人群的蔬菜约一半选深色。深色蔬菜里有多种维生素、膳食纤维和植物化学物，具体组成随品种不同。用常见做法轮换能增加吃到的品种。"],["证据等级","C（深色蔬菜及多品种搭配依据中国膳食指南。轮换频率和份量是执行方法）。"],["适用与备注","一天里吃到的深浅搭配可以分到不同餐。买不到合适的鲜菜，可用一部分[原味冷冻菜](#q199)。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则三实践应用（一）的「选色」「多品」、实践应用（二）的「餐餐有蔬菜」，及平衡膳食宝塔第二层。 [挑选和搭配蔬菜](https://dg.cnsoc.org/article/04/70JvPbFmTlyZbjoO67LeRg.html) · [膳食宝塔](https://dg.cnsoc.org/article/04/RMAbPdrjQ6CGWTwmo62hQg.html)"]],"path":"book/everyday-nutrition/02-produce-and-fiber.md","aliases":"","grades":["C"]},{"id":207,"qid":"Q207","section":"营养","chapter":"日常饮食","question":"一袋零食写着有好几份，怎么按实际吃掉的份量算整袋能量和钠？","title":"一袋食品有几份，就把每份能量和钠乘以吃掉的份数","fields":[["怎么做","先找到一份的克数和整袋净含量。一袋 75 克，每份 25 克，每份 420 千焦、钠 180 毫克，吃完整袋就是 1260 千焦、540 毫克钠。标签按每 100 克写时，乘以实际食用克数，再除以 100。"],["成本","拿手机算两次即可。可把常吃的零食录成「半袋」或「整袋」。"],["说人话","先找基准是每份还是每 100 克，再看你实际吃了多少。"],["收益","标签规则允许以每 100 克、每 100 毫升或每份标示营养成分。统一到实际份量后，容易知道吃进多少能量和钠。"],["证据等级","标签口径来自国家标准，重量和营养数字为算例。"],["适用与备注","有独立小包时，确认标签的一份是否等于一小包。营养素参考值百分比和钠毫克数分开读。"],["来源","国家卫健委 GB 28050—2011 正文第 3.4 条和配套问答「每份食品的营养成分标示」。 [GB 28050—2011 正文](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf) · [国家卫健委标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":208,"qid":"Q208","section":"营养","chapter":"日常饮食","question":"标签上写“0 蔗糖”“无糖”“低糖”，怎么弄清实际用的甜味来源？","title":"看到「0 蔗糖」「无糖」「低糖」，把正面声称、营养表和配料表一起读","fields":[["怎么做","先看正面写的是无糖、低糖，还是只点名蔗糖。再查营养成分表有没有「糖」一行，以及配料表有没有果糖、麦芽糖、果汁浓缩物、糖醇或甜味剂。糖含量有标示时，按你实际吃的份量换算。"],["成本","多翻看包装两面。比较同类产品时，先统一每 100 克或每 100 毫升的口径。"],["说人话","「0 蔗糖」只说蔗糖。想知道还有哪些糖和甜味配料，接着看背面。"],["收益","按 GB 28050—2011 附录 C，无或不含糖的条件为每 100 克或毫升不超过 0.5 克，低糖为不超过 5 克。无糖条件并不要求糖的测定值为零。"],["证据等级","食品标签声称依据国家标准，配料查看步骤为示例。"],["适用与备注","某些淀粉类食物本身碳水仍较多。需要按医嘱管理血糖时，同时看实际份量和碳水。"],["来源","GB 28050—2011 附录 C 及国家卫健委 GB 28050—2025 问答的糖标示说明。 [GB 28050—2011 正文](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf) · [新版问答](https://www.nhc.gov.cn/sps/c100087/202509/470fa4ff5de14dd38619223cce9da4e7.shtml)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":209,"qid":"Q209","section":"营养","chapter":"日常饮食","question":"买同类酸奶或零食，怎样把每份标示换成同一重量再比较？","title":"比较酸奶或零食时，先把营养表换算成同一重量","fields":[["怎么做","给两款相似商品选一个共同基准，例如每 100 克。假设甲每份 150 克含蛋白质 6 克，换算后是 4 克/100 克。乙每份 100 克含 4.5 克，则是 4.5 克/100 克。再看自己通常吃多大一份，以及希望比较的是蛋白质、糖、钠还是能量。"],["成本","每款最多算一遍。包装已经给出相同单位时可以直接比。"],["说人话","每份可能大小不同，先统一每 100 克，再算一整杯实际吃多少。"],["收益","标准允许按每 100 克、每 100 毫升或每份标示。统一基准能让同类产品的含量可比，换回实际份量才能估摄入。"],["证据等级","食品标签的基准来自国家标准，换算数字为算例。"],["适用与备注","液体优先用两款共同的毫升单位。若一款按克、一款按毫升，按包装给出的净含量或同样可称重的份量换算。"],["来源","GB 28050—2011 第 3.4 条、表 1，以及国家卫健委标签问答。 [GB 28050—2011 正文](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf) · [国家卫健委标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":210,"qid":"Q210","section":"营养","chapter":"日常饮食","question":"营养成分表用千焦，饮食记录用千卡，怎么统一单位？","title":"标签千焦换成千卡，除以 4.184","fields":[["怎么做","先换成实际吃掉的份量，再把千焦数除以 4.184，或交给支持千焦的记录工具。举例，一份 837 千焦，换成约 200 千卡。记录工具写 kcal、大卡或食物热量 Calories 时，通常都是千卡。"],["成本","手机计算器即可。日常记录四舍五入到整数通常够用。"],["说人话","千焦除以约 4.2，得到大概千卡。再看输入框用的是什么单位。"],["收益","热化学千卡和千焦有固定换算关系，1 千卡等于 4.184 千焦。标签能量本身仍可能受标示修约影响。"],["证据等级","单位关系依据标准换算表。837 千焦为演算示例。"],["适用与备注","每 100 克的能量换完仍是每 100 克。需要记录整袋时，再按实际吃掉的重量调整。"],["来源","NIST 国际单位制换算表 calorie（nutrition）条目，以及 GB 28050—2011 表 1 能量单位。 [NIST 换算表](https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b8) · [GB 28050—2011 正文](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":211,"qid":"Q211","section":"营养","chapter":"日常饮食","question":"包装上的“高蛋白”“低脂”和“高纤”各自说明什么，选购时还要看哪些数字？","title":"用正面营养声称初筛，再看自己实际会吃到的量","fields":[["怎么做","先决定自己要买的是补蛋白质的加餐、较低脂的同类食物，还是富含膳食纤维的食品。正面声称只帮助找这一项。把产品翻过来，用同一份量比较目标营养素，再按需要看钠、糖、总能量和配料。"],["成本","第一次比较多花几分钟。常买的食物可以记下一份提供多少目标营养素。"],["说人话","包装正面帮你找到候选。背面告诉你这一包实际提供多少。"],["收益","GB 28050—2011 为高或富含蛋白质、低脂肪、高或富含膳食纤维分别列出条件，部分条件区分固体、液体或能量口径。达到其中一项声称的条件只能说明对应指标。"],["证据等级","含量声称来自国家标准，选购比较是应用示例。"],["适用与备注","不同用途选不同指标。例如买高蛋白加餐时，同时看一整份蛋白质和价格。"],["来源","GB 28050—2011 附录 C 表 C.1 及国家卫健委含量声称问答。 [GB 28050—2011 正文](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf) · [国家卫健委标签问答](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":212,"qid":"Q212","section":"营养","chapter":"日常饮食","question":"冷冻、冷藏和常温储存的备餐食材，买回家该怎么分装、标记日期和安排先后？","title":"备餐食材买回家按温度放，写上日期并把先用的放前面","fields":[["怎么做","冷藏和冷冻品先入冰箱，按标签条件存放。短期要煮的生肉单独封好放底层，避免汁液滴到熟食。分装时按一餐的量写上食物名和分装日，留住包装原来的保存期限。常温干货保持干燥，开封后按标签换到指定温度或容器。"],["成本","准备干净的密封盒、袋和记号。按一餐分装可省去以后反复解冻。"],["说人话","先放对温度，再写日期。把需要先用的东西放到一眼看得见的地方。"],["收益","及时冷藏、保持生熟分开和防止汁液交叉污染是官方食品安全指导。日期和摆放顺序便于知道哪些食材要尽快使用。"],["证据等级","食品储存条件依据官方指引，分装标签为实用做法。"],["适用与备注","冷藏通常以约 4°C 或更低为目标，冷冻约 −18°C 或更低。对有特殊要求的商品按标签执行。"],["来源","美国 FDA 食品安全指引的冷藏与生熟分开部分，以及 WHO 食品安全五要点。 [FDA 食品储存指南](https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling) · [WHO 指引](https://www.who.int/docs/default-source/food-safety/five-keys-to-safer-food-poster/5keys-en.pdf)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":213,"qid":"Q213","section":"营养","chapter":"日常饮食","question":"米饭和熟菜想留到第二天带饭，怎么安排降温、冷藏、携带和复热？","title":"隔夜饭菜趁早分盒冷藏，通勤保冷，吃前加热透","fields":[["怎么做","做完饭就用干净餐具把次日要带的一份分进浅盒，尽快放进冰箱。普通室温下控制在 2 小时以内，高温天气更早冷藏。通勤时用冰袋保冷，到单位尽快放冰箱。吃前彻底加热，微波时中途翻拌，条件允许时用温度计确认各处均达到至少 74°C。"],["成本","需要浅饭盒和冰箱。离开冷藏较久时需要保冷包和冰袋。"],["说人话","饭菜别留在锅里慢慢放一晚上。早点冷藏，出门保冷，吃前热透。"],["收益","剩饭在室温久放可增加蜡样芽孢杆菌相关食源性疾病风险。部分已产生的毒素耐热，复热不能补救长时间常温存放。"],["证据等级","冷藏、保存与复热依据官方食品安全指引。"],["适用与备注","冰箱尽量保持在 4°C 或更低。存放历史不清、已在常温放太久的米饭和熟菜应丢弃。"],["来源","湖北省卫生健康委剩饭食品安全提示、中国疾控中心蜡样芽孢杆菌资料及加拿大卫生部剩食复热说明。 [湖北省卫健委剩饭保存提示](https://wjw.hubei.gov.cn/bmdt/jkhb/spyy/202508/t20250805_5738841.shtml) · [中国疾控资料](https://niohp.chinacdc.cn/zdkz/dwzs/xjxswzd/lyybgj/) · [加拿大卫生部指引](https://www.canada.ca/en/health-canada/services/general-food-safety-tips/food-safety-tips-leftovers.html)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":214,"qid":"Q214","section":"营养","chapter":"日常饮食","question":"看保质期、开封后保存说明和配料表时，怎样决定一大包值不值得囤？","title":"大包装值不值得买，按开封后的实际用量和保存条件算","fields":[["怎么做","先看未开封保质期、要求的储存条件，以及开封后是否需要冷藏或在几天内吃完。再估自己每周会用多少和是否能按说明分装。若 500 克一包需要开封后 5 天内用完，而家里 5 天通常只吃 200 克，比较时用 200 克算实际利用的成本。"],["成本","多看几行标签。可留一张包装照片，方便开封后找到保存要求。"],["说人话","大包便宜要吃得完才算。先看开封以后能放多久。"],["收益","保质期对应规定的贮存条件。开封改变包装保护条件，配料表和贮存说明提供的信息各有用途，尤其要执行开封后的具体说明。"],["证据等级","标签和贮存条件依据国家标准，份量与开封天数为算例。"],["适用与备注","没有明确开封时长的易腐食品，按储存类别和官方食品安全指导处理。冷藏空间有限时，小包装更便于按期吃完。"],["来源","GB 7718—2011 第 2.4 条和附录 C.5 的保质期定义与贮存条件，以及农业农村部对常温奶和冷藏奶的说明。 [GB 7718—2011 正文](https://www.nhc.gov.cn/sps/c100088/201105/d436870f8e624dc582f66819b8b34850/files/1732844519076_86167.pdf) · [农业农村部储存示例](https://jgs.moa.gov.cn/kptd/202302/t20230223_6421438.htm)"]],"path":"book/everyday-nutrition/03-shopping-and-storage.md","aliases":"","grades":[]},{"id":215,"qid":"Q215","section":"营养","chapter":"日常饮食","question":"常吃麻辣烫、冒菜或火锅，怎么估汤底、蘸料和加工配菜带来的盐分？","title":"吃麻辣烫或火锅，先分别看汤、蘸料和加工配菜","fields":[["怎么做","记下喝了多少汤、蘸料用了几勺，另外数一下丸子、香肠和腌制配菜。包装配菜有钠数据就按吃掉的量换算。汤底和蘸料没数据时，先把它们记为可能的大头。下次试少喝汤、蘸料另放，或把部分丸子换成原味豆腐或鲜肉。"],["成本","外食很难算到准确毫克数。只记录一碗汤、几勺蘸料和几份加工食物，也能比较两顿。"],["说人话","盐可能分别来自汤、蘸料和配菜。每次挑一个最容易减的地方。"],["收益","香港食物安全中心检测发现市售汤品的钠含量差异很大。中国膳食指南也把酱料、加工食品和外食列入总盐摄入考虑。"],["证据等级","B（市售汤品实测及向相似外食场景外推）。C（点餐调整）。"],["适用与备注","清汤和辣汤的钠都随配方变化。外食没有公开成分时，可用多少和频率做相对比较。"],["来源","中国居民膳食指南准则五，以及香港食物安全中心市售汤品钠含量调查。 [中国膳食指南少盐准则](https://dg.cnsoc.org/article/04/ApX3_ozGTmSoqQaFFh5z_Q.html) · [汤品抽样调查](https://www.cfs.gov.hk/english/programme/programme_rafs/programme_rafs_n_01_20.html)"]],"path":"book/everyday-nutrition/04-eating-out-and-budget.md","aliases":"","grades":["B","C"]},{"id":216,"qid":"Q216","section":"营养","chapter":"日常饮食","question":"经常和家人同桌吃几盘菜，怎么留意自己吃到的份量又不用逐样称？","title":"同桌吃饭，先用自己的碗盘看清这一顿的组成","fields":[["怎么做","从公用菜盘夹到自己的小碟，先留主食、蔬菜和一份鱼肉蛋豆。饭后回想自己大概添了几次，或拍一张第一轮照片。想调整份量时，用家里常用的碗勺作参照，例如记半碗主食或一小碟肉菜。"],["成本","一只个人餐碟或饭碗。熟悉的饭量可以用同一个参照。"],["说人话","先把一顿饭在自己面前搭出来，再按饥饿程度加菜。"],["收益","膳食指南支持食物多样、合理搭配和公筷分餐。用个人餐具留出一份更便于看清食物类别和大致数量。"],["证据等级","C（膳食指南与家庭餐桌执行示例）。"],["适用与备注","公勺、公筷也适用于需要减少餐具交叉接触的场合。混合菜可以大致按主要食材判断。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则一和准则八。 [中国营养学会膳食指南](https://dg.cnsoc.org/article/lsqy.html) · [中国居民平衡膳食餐盘](https://www.nhc.gov.cn/ylyjs/gzdt/202407/256b4eb8398440a8811344c7be50a333/files/1734003012304_36543.pdf)"]],"path":"book/everyday-nutrition/04-eating-out-and-budget.md","aliases":"","grades":["C"]},{"id":217,"qid":"Q217","section":"营养","chapter":"日常饮食","question":"一周只做一两次饭，怎么把主食、蛋白质菜和蔬菜分开备好再组合？","title":"一周集中做一两次饭，分装主食、蛋白质和蔬菜","fields":[["怎么做","先定能冷藏的近期份量和需要冷冻的后几份。一次做一两种主食、一两种鱼肉蛋豆类，再备易于临时加热或清洗的蔬菜。熟食分装到浅盒、尽快冷藏或冷冻并标日期，按当天食欲组合。冷冻份按安全方法解冻、复热。"],["成本","一次用较长时间备餐。需要干净盒子和足够的冰箱空间。"],["说人话","把三类食物分开备，吃的时候各拿一样。后几天吃的及时冷冻。"],["收益","膳食指南强调提前规划、食物多样。小份浅盒有助于熟食较快冷却，不能及时吃完的份量可尽早冷冻。"],["证据等级","C（膳食安排示例）。储存方式来自官方食品安全指导。"],["适用与备注","熟饭、熟菜和易腐蛋白质菜都应及时冷藏。普通冰箱的冷藏层不宜放整周熟食。"],["来源","中国营养学会膳食指南准则一和七，以及 FDA 食品储存指引与湖北省卫健委剩饭安全提示。 [中国营养学会膳食指南](https://dg.cnsoc.org/article/lsqy.html) · [FDA 食品储存指引](https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling) · [湖北省卫健委储存提示](https://wjw.hubei.gov.cn/bmdt/jkhb/spyy/202508/t20250805_5738841.shtml)"]],"path":"book/everyday-nutrition/04-eating-out-and-budget.md","aliases":"","grades":["C"]},{"id":218,"qid":"Q218","section":"营养","chapter":"日常饮食","question":"下班才有时间买菜，怎样用几样耐放的食材少叫一次外卖？","title":"给下班晚的日子备三样耐放食材，凑出一顿能吃的饭","fields":[["怎么做","分别选一种耐放的主食、蛋白质食物和蔬菜。例如挂面、常温保存的鱼罐头和原味冷冻蔬菜，或速冻杂粮饭、鸡蛋和耐放蔬菜。按包装条件存好，把食材做成自己熟悉的十几分钟组合。吃完再补货。"],["成本","先试一顿的量。低温食材计入冰箱空间，罐头开封后按标签保存。"],["说人话","下班晚时，家里还能拿出主食、蛋白质和菜，就能少临时做一次决定。"],["收益","中国膳食指南支持从不同食物组搭配正餐。常温和冷冻备选有利于提前准备，食品的营养和存放条件按实际标签判断。"],["证据等级","C（膳食搭配与采购示例）。"],["适用与备注","挑罐头、调味冷冻菜时可顺手比较钠。家中有现成食材时先用需要优先消耗的。"],["来源","中国营养学会膳食指南准则一和七，以及 FDA 食品储存指引。 [中国营养学会膳食指南](https://dg.cnsoc.org/article/lsqy.html) · [FDA 食品储存指引](https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling)"]],"path":"book/everyday-nutrition/04-eating-out-and-budget.md","aliases":"","grades":["C"]},{"id":219,"qid":"Q219","section":"营养","chapter":"日常饮食","question":"每周买菜预算有限，怎么比较散装、大包装和按份买的可食成本？","title":"买菜比价格时，按能吃到的重量和能用完的份数算","fields":[["怎么做","对比同类原料先统一到每 100 克可食部。假设带壳食物 15 元一斤，500 克里有 300 克可食部分，就是 5 元/100 克。另一款去壳 200 克卖 12 元，就是 6 元/100 克。若大包一周只能用掉一半，记上有把握能吃到的量，再比实际成本。"],["成本","第一次可以称一下可食部。日常只比较价差较大或常买的两三项。"],["说人话","用实际能吃到的重量算。便宜的大包如果常剩，重新算一遍。"],["收益","食品成分资料用可食部明确计算基准。按同一基准比较能把皮、骨、壳和实际丢弃造成的差别算进去。"],["证据等级","可食部定义依据官方资料，价格、重量为算例。"],["适用与备注","比较熟制和生料时，还要考虑烹调后水分及便利性。也可用「一份做好的菜花多少」作统一口径。"],["来源","国家卫健委预包装食品营养标签问答的可食部计算，以及膳食指南关于按需选购和减少浪费的准则。 [GB 28050—2011 问答第（四十六）](https://www.nhc.gov.cn/zwgk/zcjd/201402/6f68ec6692594cf28d190cb47b770c11.shtml) · [中国营养学会膳食指南](https://dg.cnsoc.org/article/lsqy.html)"]],"path":"book/everyday-nutrition/04-eating-out-and-budget.md","aliases":"","grades":[]},{"id":220,"qid":"Q220","section":"营养","chapter":"日常饮食","question":"点大份套餐觉得划算但经常吃不完，怎么提前分出一餐留给第二天？","title":"大份套餐先分出下一餐，再按安全时间带走和存放","fields":[["怎么做","如果确定吃不完，开吃前用干净餐具分出要带走的一份，记下取餐时间。回家尽快分浅盒冷藏，普通室温累计避免超过 2 小时，天气高于约 32°C 时按 1 小时处理。第二天按冷藏条件取出，彻底加热。回家太久、无法保冷时，点能当场吃完的份量。"],["成本","一个干净饭盒或商家的打包盒。路上时间长需要保冷。"],["说人话","想留到明天，就早点分出来、早点冷藏。先看回家时间，才知道点大份是否合适。"],["收益","尽快冷藏可降低部分细菌大量生长的机会。某些毒素耐热，次日复热不能补救长时间室温存放。"],["证据等级","保存时限和复热依据官方食品安全指引。"],["适用与备注","把取餐、放桌上和路上的时间都算进去。复热时可参考[隔夜饭菜的安全处理](03-shopping-and-storage.md#q213)。"],["来源","FDA 食品储存与夏季时限，以及湖北省卫健委剩饭安全提示。 [FDA 食品储存指引](https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling) · [湖北省卫健委储存提示](https://wjw.hubei.gov.cn/bmdt/jkhb/spyy/202508/t20250805_5738841.shtml)"]],"path":"book/everyday-nutrition/04-eating-out-and-budget.md","aliases":"","grades":[]},{"id":221,"qid":"Q221","section":"营养","chapter":"日常饮食","question":"一杯奶茶的杯型、糖度和加料都能选，怎样判断先改哪一项最合适？","title":"买奶茶先选要改的一个选项，再看整杯的量","fields":[["怎么做","先决定想减少的是添加糖、整杯大小，还是加料。爱喝原口味的人可先换小杯。想保留大杯的人，可问门店糖度调的是额外糖浆还是茶底，或把一份珍珠等加料去掉。门店公布营养时，比较相同杯型的总糖，再换算到实际喝掉的量。"],["成本","通常只多问一句。没有配方或标签时，很难精确比较糖克数。"],["说人话","小杯少喝一点，减糖少加一点，去料少一份配料。先改最容易坚持的一项。"],["收益","奶茶检测和饮品调查发现，杯型、配方和加料会影响糖或能量，具体差异随门店变化。中国膳食指南建议少喝或不喝含糖饮料。"],["证据等级","B（样品检测和观察资料）。C（点单调整示例）。"],["适用与备注","「少糖」或「无额外糖浆」时，奶底、预调茶底和加料仍可能提供糖。实际情况以门店公开资料或配方为准。"],["来源","Min 等奶茶样品的营养分析、手摇饮品标示研究和中国膳食指南饮水准则。 [样品检测](https://doi.org/10.1002/fsn3.362) · [饮品标示研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC10682441/) · [中国居民膳食指南饮水准则](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html)"]],"path":"book/everyday-nutrition/05-records-and-drinks.md","aliases":"","grades":["B","C"]},{"id":222,"qid":"Q222","section":"营养","chapter":"日常饮食","question":"不太习惯喝白水，家里和办公室能准备哪些喝得惯的无糖饮品？","title":"把喝得惯的白水或淡茶放到手边","fields":[["怎么做","在家和办公室各选一个容易拿的饮品，例如温白水、冷藏白水或无糖淡茶。喜欢有气泡的口感时，可试无糖、未添加甜味剂的原味气泡水，看看标签。把杯子放在经常停留的位置，三餐之间有机会就喝一点。"],["成本","自备杯和普通饮用水成本较低。买无糖瓶装饮品时看使用频率和单瓶价格。"],["说人话","先找到一个愿意经常喝的选择，再把它放到拿得到的地方。"],["收益","中国膳食指南推荐白水或茶水，少喝含糖饮料。用无糖饮品替换原来的含糖饮料，可以减少该杯提供的糖。"],["证据等级","C（中国膳食指南及准备示例）。"],["适用与备注","对咖啡因敏感时，晚些时候可选择白水。按医嘱限水的人遵循个人方案。"],["来源","中国居民膳食指南准则六和国家疾控局饮水说明。 [中国居民膳食指南饮水准则](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html) · [国家疾控局饮水说明](https://www.ndcpa.gov.cn/jbkzzx/c100040/common/content/content_2104761364364300288.html)"]],"path":"book/everyday-nutrition/05-records-and-drinks.md","aliases":"","grades":["C"]},{"id":223,"qid":"Q223","section":"营养","chapter":"日常饮食","question":"晚饭后习惯吃零食，怎么区分没吃饱、嘴馋和顺手多吃，再调整家里的备货？","title":"晚饭后常想吃零食，先观察当时饿不饿和手边有什么","fields":[["怎么做","记三四个晚上，写下晚餐大概内容、想吃时有没有明显饥饿、正在做什么。晚餐经常很少或吃得早时，可以把晚餐搭齐，或留一份计划好的加餐。总在看剧时顺手吃，则试先倒一份进小碗，把大包装放回柜里。"],["成本","简单记录几天。可以买小份，或把已有食物分装。"],["说人话","真饿就给自己留一份食物。顺手吃得多，就先把想吃的分好。"],["收益","膳食指南支持规律进餐、适量选择零食。进食记录可帮助发现时间、食物和情境。饥饿与进食习惯可能同时存在。"],["证据等级","C（膳食指导和自我记录示例）。"],["适用与备注","夜间训练回来本来就可能需要加餐。如果记录让自己过度焦虑，可只留意吃饭规律和饥饿感。"],["来源","中国居民膳食指南准则六，以及美国疾控中心记录饮食和进食情境的指导。 [中国居民膳食指南饮水准则](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html) · [美国疾控中心饮食记录建议](https://www.cdc.gov/healthy-weight-growth/losing-weight/index.html)"]],"path":"book/everyday-nutrition/05-records-and-drinks.md","aliases":"","grades":["C"]},{"id":224,"qid":"Q224","section":"营养","chapter":"日常饮食","question":"平时吃得挺规律、周末应酬却多，怎么从一周的记录找出变化最大的一项？","title":"周末应酬多时，用一周的记录找一个影响最大的变化","fields":[["怎么做","连着记一个普通工作周和周末，按每天标出外食、酒或含糖饮品、额外零食和运动。用杯、份或次比较工作日平均和周末每天的量。先挑变化明显、自己也想改的一项，比如聚餐先点水或少点一份加料，再看下一周是否做得到。"],["成本","每天花几分钟，外食可以拍照代替逐样输入。"],["说人话","工作日怎么吃、周末哪里变了，摆在一起看。先改一个确实反复发生的地方。"],["收益","官方饮食行为指导建议用数天食物和饮品日记识别模式，周末、假日和外出时也可以记。本文按天比较是简化的执行办法。"],["证据等级","C（自我记录的官方指导和一周示例）。"],["适用与备注","比较同样的天数口径。节日或旅行周可以另记，避免当成普通周末。"],["来源","美国疾控中心饮食日志指导及预防糖尿病课程的食物追踪模块。 [美国疾控中心饮食记录建议](https://www.cdc.gov/healthy-weight-growth/losing-weight/index.html) · [食物追踪手册](https://www.cdc.gov/diabetes-prevention/media/pdfs/2026/aian-t2-curriculum/T2D_AIAN_Module_05_PG_04.pdf)"]],"path":"book/everyday-nutrition/05-records-and-drinks.md","aliases":"","grades":["C"]},{"id":225,"qid":"Q225","section":"营养","chapter":"日常饮食","question":"饮食 App 的食物库里同一种菜差很多，怎样选一条适合自己日常记录的数据？","title":"食物记录优先用匹配品牌、做法和称重状态的一项","fields":[["怎么做","包装食品先用本品标签。家里做的饭，称熟重就找熟制条目，称生重就找生食条目，分开记烹调油和酱料，或用同一份自建菜谱。外食找配料和烹调方式相近、能标出来源的一项。常吃的菜保留同一条目和份量口径。"],["成本","第一次核对要花一点时间。自己常做的菜可保存一次，之后反复使用。"],["说人话","先确认称的是生的还是熟的。选一条和实际做法接近的，之后用同一个口径。"],["收益","食物成分库会分别收录测量数据、品牌标签和调查用份量，来源和重量基准会影响数值。餐馆实际加油和配料会随做法变化。"],["证据等级","食物成分与份量类型依据官方数据文档，记录方法为示例。"],["适用与备注","不同条目差很多时，不必选一个看起来最精确的数字。优先核对单位、每份克数和是否含油或汤。"],["来源","美国农业部 FoodData Central 的数据来源与份量说明，以及国家卫生健康委《成人肥胖食养指南（2024 年版）》附录食物成分表。 [USDA 数据说明](https://fdc.nal.usda.gov/faq/) · [国家卫健委指南发布页](https://www.nhc.gov.cn/wjw/c100378/202402/afd5dda4bd6745fda10aad8d43a16369.shtml)"]],"path":"book/everyday-nutrition/05-records-and-drinks.md","aliases":"","grades":[]},{"id":226,"qid":"Q226","section":"营养","chapter":"训练饮食与补剂","question":"空腹做力量或轻松有氧更容易减脂吗，怎么区分当次脂肪氧化和长期体脂变化？","title":"减脂时按训练舒适度决定要不要先吃","fields":[["怎么做","早上做轻松有氧或练力量，可以按胃口和训练安排决定先吃还是练完再吃。空腹时如果容易饿、训练做不完，下一次在同类训练前试一份熟悉的小加餐，把其余早餐放到练后。想了解体重管理效果，就看一段时间的趋势，并记录训练能否按计划完成。减脂时的整体安排见 [抗阻训练与饮食减量](../04-training-nutrition.md#q10)。"],["成本","用平时的早餐试两种时间安排。记录训练有没有照常做完即可。"],["说人话","一次运动烧了多少脂肪，和几周下来少了多少体脂，是两个指标。"],["收益","空腹有氧在研究中平均提高了当次脂肪氧化，但几周的对照研究没有显示稳定的额外减脂优势。空腹抗阻训练的合并研究有更大脂肪量降幅的信号，研究数量少且多数偏倚风险高，暂不足以据此改变训练安排。"],["证据等级","B（有氧的当次脂肪氧化来自对照研究的系统综述。长期体脂研究少，2025 年抗阻训练综述纳入的 4 项研究有 3 项偏倚风险高）。"],["适用与备注","这里的空腹主要指一夜没吃后在早餐前训练。遇到长跑或关键训练，供能按训练需求安排，见 [按训练日调主食](../04-training-nutrition.md#q08)。"],["来源","Vieira 等 2016 年有氧荟萃分析摘要；Hackett 与 Hagstrom 2017 年有氧综述「Effect on Body Mass and Composition」、表 2 及讨论；Schoenfeld 等 2014 年随机试验结果和表 2；Vieira 等 2025 年抗阻训练荟萃分析摘要「Results」。 [当次脂肪氧化](https://pubmed.ncbi.nlm.nih.gov/27609363/) · [有氧与体成分综述](https://www.mdpi.com/2411-5142/2/4/43) · [有氧随机试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC4242477/) · [抗阻训练荟萃分析](https://pubmed.ncbi.nlm.nih.gov/41316673/)"]],"path":"book/training-nutrition/01-fueling.md","aliases":"","grades":["B"]},{"id":227,"qid":"Q227","section":"营养","chapter":"训练饮食与补剂","question":"正常午饭后下午加练，怎么判断是胃里还太饱、训练强度太高，还是下一次该调整餐量？","title":"午饭后练着不舒服，先一次只改一件事","fields":[["怎么做","开练前已经很撑，可以晚一点练，或者先走一走，舒服了再开始。当时胃里还好、加快后才恶心或反酸，可以先放慢或停下休息。下次午饭相似时，先只试延后开练或降低强度中的一项，记下吃了什么、间隔多久、何时开始不适。时间固定、常在热身时觉得撑，可以把午餐的一部分挪到练后。"],["成本","用手机记录几次就行。把午饭分两次吃，可以提前留一份在冰箱里。"],["说人话","开练就撑，先试多留点时间。加速之后才不舒服，下次先试慢一点。"],["收益","进食时机、份量、运动本身和个人耐受都可能影响胃肠感受。每次只改一项，比较容易找出适合自己的安排。"],["证据等级","C（三机构联合立场和运动胃肠症状联合立场支持按个人耐受调整。观察顺序是实践方法，不能据此确定原因）。"],["适用与备注","用于偶发的轻微饱胀或反酸。症状反复、加重或者休息时也出现，先咨询医生。"],["来源","三机构运动营养联合立场表 1「Pre-event fuelling」；Costa 等 2025 年联合立场的「Characteristics of Exercise and Individual Factors」和第 10 节「Translation to Practice」与图 2。 [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf) · [运动胃肠症状联合立场](https://link.springer.com/article/10.1007/s40279-025-02186-6)"]],"path":"book/training-nutrition/01-fueling.md","aliases":"","grades":["C"]},{"id":228,"qid":"Q228","section":"营养","chapter":"训练饮食与补剂","question":"运动手表显示这次消耗了几百千卡，能按这个数字加餐吗，怎样检查它的估算是否适合自己？","title":"手表热量用来对照相似训练，加餐按训练和恢复安排","fields":[["怎么做","先查手表或应用对该数字的定义，看看它显示的是活动消耗，还是连同静息消耗一起算的总消耗。核对个人资料，选正确运动模式。同一路线或相似训练可一并比较时间、距离、强度和手表读数。加餐时先看下一顿离多远、这次练了多久、接下来是否还有训练，再按食欲和恢复调整。比如练完不久就吃正常午饭，可以把需要的补充安排在午饭里。"],["成本","不用换手表。看一次说明，比较几次同类训练和自己的饮食安排即可。"],["说人话","手表显示 500 千卡时，可以看看这次跑了多远、接下来多久吃饭，再决定要不要加餐。"],["收益","腕戴设备估算能量消耗的准确度随设备和运动类型而变。同类训练的记录可以帮你回顾负荷。想验证实际消耗需要独立测量，仅凭相似训练间读数接近无法判断消耗算得准不准。"],["证据等级","B（设备验证研究与综述检出了估算误差。用读数回看训练、用恢复表现和进食安排决定加餐是应用建议）。"],["适用与备注","跑步和力量训练的热量读数各有误差。训练量上升后若持续疲劳、表现下降或月经变化，见 [长期吃不够的评估线索](../06-training-health.md#q37)。"],["来源","O’Driscoll 等 2020 年腕式和臂式设备验证荟萃分析摘要「Results」；Shcherbina 等 2017 年实测研究第 3.2 节和图 3；三机构运动营养联合立场表 1「每日燃料需求」与「Speedy refuelling」。 [设备验证荟萃分析](https://pubmed.ncbi.nlm.nih.gov/30194221/) · [腕戴设备实测](https://pmc.ncbi.nlm.nih.gov/articles/PMC5491979/) · [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/training-nutrition/01-fueling.md","aliases":"","grades":["B"]},{"id":229,"qid":"Q229","section":"营养","chapter":"训练饮食与补剂","question":"午休练完就得开会，怎样安排工作日上午的正餐和训练后的便携午饭？","title":"午休练完要开会，把午饭分成随手吃和坐下吃两部分","fields":[["怎么做","例如中午 12 点练，早上 8 点照常吃有主食和蛋白质的早餐。如果快到训练时已饿，可以先吃一小份平时吃得惯的食物。练完到开会前有几分钟，就先吃好拿的一部分，例如面包加一盒未开封、标签允许常温保存的奶，或香蕉加奶。开完会再把午饭吃完。能在会前坐下吃饭，就直接吃午饭。"],["成本","多带一盒奶、一个水果或几片面包，算进午饭的份量。有单位冰箱可带便当。通勤期间需保冷时，可用保温袋和冰袋。"],["说人话","午饭带上，开会前吃得下多少就先吃多少，散会再吃剩下的。"],["收益","提前留好两种吃法，能少一次因为时间不够而把整顿午饭拖到下午的情况。主食和蛋白质能放进同一顿，也可以拆开吃。"],["证据等级","C（运动营养立场支持训练日按计划安排供能和恢复饮食。时刻表与便携食物是工作日安排示例）。"],["适用与备注","熟肉、熟饭等易腐便当要保持冷藏，单位没有冰箱且无法保冷时，可选包装允许常温保存的未开封食品，或练后现买。两次训练紧邻时，见 [练后恢复安排](../04-training-nutrition.md#q13)。"],["来源","三机构运动营养联合立场表 1「每日燃料需求」「Speedy refuelling」及「Protein Needs」；中国疾病预防控制中心营养与健康所《带饭上班，如何兼顾营养与安全》的保存和温度建议；农业农村部农产品质量安全监管司常温奶说明第一节。 [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf) · [中国疾控带饭建议](https://study.bjwomen.gov.cn/thought/health/2026/04/15/18237.shtml) · [常温乳与冷藏乳](https://jgs.moa.gov.cn/kptd/202302/t20230223_6421438.htm)"]],"path":"book/training-nutrition/01-fueling.md","aliases":"","grades":["C"]},{"id":230,"qid":"Q230","section":"营养","chapter":"训练饮食与补剂","question":"有人建议先做一次低碳训练再补碳水，普通兼练者怎么判断这个策略值不值得占用一次训练？","title":"兼练跑步和力量，先给关键课吃够碳水","fields":[["怎么做","先把长跑、间歇和大训练量的力量课标出来，按课的负荷安排前后的主食。有人提的「低碳训练」往往指有意降低某些训练时的碳水可用性，再在安排好的时段补回。普通兼练者可以先按正常供能训练。若考虑试用这种策略，先确认目的、是否会影响下一堂重点课，以及对训练表现有什么可核对的好处。"],["成本","按平时的饭菜安排主食。刻意做低碳训练还要跟踪进食、训练质量和下一课的恢复。"],["说人话","这周最想练好的几堂课，先把吃饭时间和主食安排好。"],["收益","减少部分训练的碳水供应，可能影响一些与适应有关的代谢指标。训练有素的耐力运动员研究合并后，未显示耐力表现平均得到额外改善。普通兼练者可优先把训练做完整。"],["证据等级","B（荟萃分析纳入 9 项针对训练有素的耐力运动员的研究。普通跑步兼力量训练人群的直接证据有限）。"],["适用与备注","这是单独安排部分训练课的策略。日常随训练量多吃或少吃些主食见 [长跑日、力量日和休息日怎么吃](../04-training-nutrition.md#q08)。"],["来源","Gejl 与 Nybo 2021 年系统综述与荟萃分析的摘要、结果与讨论；三机构运动营养联合立场表 1「每日燃料需求」与「Acute fuelling strategies」。 [阶段性限制碳水的耐力表现综述](https://link.springer.com/article/10.1186/s12970-021-00435-3) · [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/training-nutrition/01-fueling.md","aliases":"","grades":["B"]},{"id":231,"qid":"Q231","section":"营养","chapter":"训练饮食与补剂","question":"想减脂又不想天天算热量，怎么给自己定一个便于回顾和调整的起点？","title":"减脂从一项能复盘的饮食改动开始","fields":[["怎么做","先记几天平时怎么吃，用照片或简短记录均可。选一项重复出现、能具体改的做法，例如工作日午饭把常喝的含糖饮料换成水，或把下午零食先分到小碟。继续规律吃饭和训练。隔两到三周回看做了几天、体重趋势、饿不饿和训练状态，再决定是否加第二项。两到三周是复盘示例。"],["成本","记几天餐食，每周留几分钟回顾。水或无糖茶可以沿用现有选择，无须买记录工具。"],["说人话","挑一件平时就常发生的小事来改。回头能数出做了几次，就知道下一步改哪里。"],["收益","能看出计划能否坚持，也能用体重、饥饿和训练表现判断改动是否适合自己。这样的记录是调整摄入的起点。"],["证据等级","C（体重管理指南支持短期记录、具体目标与定期回顾。列出的时间和改动是执行示例）。"],["适用与备注","适合确有减脂需要且希望从生活习惯着手的成年人。已有持续疲劳、月经变化或训练表现持续下降时，先看 [能量摄入不足的线索](../06-training-health.md#q37)。"],["来源","国家卫生健康委《体重管理指导原则（2024年版）》；美国疾控中心减重指南第 2、3、5 步。 [国家卫生健康委体重管理指导原则](https://www.nhc.gov.cn/ylyjs/zcwj/202412/75cb79c171c94def9e768193e65484f7.shtml) · [减重目标与回顾](https://www.cdc.gov/healthy-weight-growth/losing-weight/index.html)"]],"path":"book/training-nutrition/02-weight-management.md","aliases":"","grades":["C"]},{"id":232,"qid":"Q232","section":"营养","chapter":"训练饮食与补剂","question":"减脂刚开始时体重降得快，后来回升一两天，怎么判断是不是水分波动？","title":"体重突然回升，先在相同条件下看趋势","fields":[["怎么做","用同一台秤，在晨起排尿后、早餐前称。同一周多次称重时，可以算平均值再与前几周比。记一笔最近的大餐、主食份量变化、长跑或经期。减脂刚开始，主食减少时糖原和它伴随的水分也可能减少。后来多吃些主食或盐较多的饭，几天的称重读数也可能回升。"],["成本","沿用现有体重秤。记下例外的几天即可。"],["说人话","秤上包括身体里的水和消化道内容物。一两天的回升先记下来，继续看趋势。"],["收益","两周的自由生活研究观察到，短期体重波动多来自去脂体重，主要是水分。体重趋势比单次读数更适合用来复盘减脂计划。"],["证据等级","B（体成分研究支持短期波动的解释。单个读数无法判断某次变化有多少来自水分或脂肪）。"],["适用与备注","有经期波动的人可参考相邻周期的相近阶段。连续几周体重和腰围都持平，见 [复盘减脂平台](#q233)。"],["来源","Bhutani 等 2017 年两组成人研究的结果和讨论；Kanellakis 等 2023 年经期体成分研究摘要；美国运动营养学会体重管理立场第 7.1 节。 [短期体成分研究](https://physoc.onlinelibrary.wiley.com/doi/full/10.14814/phy2.13336) · [经期体成分研究](https://pubmed.ncbi.nlm.nih.gov/37395124/) · [体重波动和平台](https://pmc.ncbi.nlm.nih.gov/articles/PMC13665703/)"]],"path":"book/training-nutrition/02-weight-management.md","aliases":"","grades":["B"]},{"id":233,"qid":"Q233","section":"营养","chapter":"训练饮食与补剂","question":"已经按原计划做了几周、体重和腰围都不再变，怎么排查减脂平台？","title":"体重和腰围几周没变，先复盘测量、饮食和活动","fields":[["怎么做","先核对几周的体重趋势和腰围。腰围用同一软尺、量同一位置，尽量在相近时段测。接着回看几天餐食和活动，比较平日与周末的饮料、加餐、外食份量，以及步行和训练是否有变化。若原计划已变样，先恢复其中一项。若两项指标数周持平，执行与状态都稳定，而且仍有减脂需要，再考虑小调一项。当前已经很饿或练不动时，先复盘摄入够不够。"],["成本","用现有体重和训练记录，另备一根软尺。复盘时先看最常出现的一两处变化。"],["说人话","体重和腰围几周都没变，先看看量法、份量和活动有没有变，再决定下一步。"],["收益","体重下降后，身体在较低体重下的能量消耗可能降低。饮食份量和日常活动也可能慢慢改变。把这些线索一起看，有助于找出下一项值得尝试的改动。"],["证据等级","C（运动营养立场支持观察较长期趋势并结合围度等指标。平台期没有统一的持续时间阈值）。"],["适用与备注","把围度和体重当作复盘工具。如果已有持续疲劳、力量下降或月经变化，见 [能量摄入不足的线索](../06-training-health.md#q37)。"],["来源","美国运动营养学会体重管理立场第 7 节；Hall 与 Kahan《Maintenance of lost weight and long-term management of obesity》的「Explaining the weight plateau」；国家卫生健康委《肥胖症诊疗指南（2024年版）》附录中的体重、腰围测量方法。 [运动营养立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC13665703/) · [体重平台的生理与行为因素](https://pmc.ncbi.nlm.nih.gov/articles/PMC5764193/) · [国家卫生健康委肥胖症诊疗指南](https://www.nhc.gov.cn/cms-search/downFiles/c171fa2416864a21b69278fd04a33f21.pdf)"]],"path":"book/training-nutrition/02-weight-management.md","aliases":"","grades":["C"]},{"id":234,"qid":"Q234","section":"营养","chapter":"训练饮食与补剂","question":"减脂期间一到晚上就很饿，怎么检查白天吃得是否太少，并调整餐次和食物组合？","title":"晚上总是很饿，先把白天漏掉的一份吃回来","fields":[["怎么做","回顾几个晚上饿得特别早的日子，记下早餐、午饭、下午训练和晚餐时间。午饭只吃了少量菜，可以先把主食和鸡蛋、豆腐或鱼肉加回来。午饭到晚饭隔得久又有训练时，试在下午加一份熟悉食物，如香蕉配原味酸奶。白天已经吃得够、只是晚餐前间隔太久，可以把原本要吃的一部分挪到更合适的时间。一次试一种改法，观察傍晚饥饿和开练状态。"],["成本","先用平时的早餐或午饭食材调整，也可以带一份水果和奶。现有餐食挪动时间不增加食材开支。"],["说人话","午饭吃得少，下午还去练，晚饭前很饿时，先补好白天这段。"],["收益","一项为超重或肥胖成人提供等能量饮食的交叉试验发现，较多能量安排在上午时，参与者平均报告的全天饥饿较低，两种安排的减重结果相近。把饭吃够或调整时间，可以按自身饥饿和训练状态试。"],["证据等级","B（有短期随机交叉试验证据。对普通训练者的具体餐次和搭配是执行建议）。"],["适用与备注","傍晚胃口也受训练量、睡眠和时间安排影响。持续强烈饥饿，同时训练退步或睡眠受扰，先评估当前的减量幅度，见 [摄入不足的线索](../06-training-health.md#q37)。"],["来源","Ruddick-Collins 等 2022 年交叉试验的图 2、图 3 及「ML calorie intake lowers appetite and hunger compared to EL calorie intake」；中国营养学会《中国居民膳食指南（2022）》准则六「规律进餐」。 [餐间能量分配试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC9605877/) · [规律进餐](https://dg.cnsoc.org/article/04/wDCyy7cWSJCN6pwKHOo5Dw.html)"]],"path":"book/training-nutrition/02-weight-management.md","aliases":"减肥饿肚子 肚子咕咕叫 减脂很饿","grades":["B"]},{"id":235,"qid":"Q235","section":"营养","chapter":"训练饮食与补剂","question":"标着“高蛋白”的减脂代餐值得买吗，怎么跟一顿便餐比较饱腹、营养和成本？","title":"按实际吃完的一餐比较代餐和便餐","fields":[["怎么做","先把代餐营养表换算到自己真会吃的份量，用奶冲的把奶也算进去。再找一顿方便买到的便餐，例如饭团、鸡蛋和一份蔬菜，比较整顿的能量、蛋白质、膳食纤维、食物种类和价格。不同日子吃过以后，记下多久又饿、是否还买了加餐。选多次替代正餐的产品时，要看整顿能否提供所需营养。"],["成本","先买一份就能比较。比如一份粉 12 元，加一盒 4 元的奶，一餐合计 16 元。便餐也把加购的鸡蛋、水果等算进去。"],["说人话","「高蛋白」说明的是蛋白质含量。喝完能撑多久、整餐花多少钱，要把冲进去和后来加买的东西一起算。"],["收益","在超重或肥胖成人中，包含代餐和行为支持的减重方案在一些对照研究中有优势。整顿的营养和饱腹感仍需根据产品、搭配与个人体验判断。"],["证据等级","B（代餐研究主要评估一套体重管理方案，所用产品与支持程度各异。综述作者披露与减重企业相关的研究资助）。"],["适用与备注","偶尔替代忙碌时的一餐，可按上面的办法比较。计划用极低能量方案，或用代餐替换一天多数正餐，应由专业人员评估。"],["来源","GB 28050—2011 第 6.1 条和附录 C；Astbury 等 2019 年综述第 3.4 节、讨论及利益披露；国家卫生健康委《成人肥胖食养指南（2024年版）》问答关于其他减重膳食的说明。 [国家营养标签标准](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf) · [代餐随机试验综述](https://onlinelibrary.wiley.com/doi/10.1111/obr.12816) · [国家卫生健康委成人肥胖食养问答](https://www.nhc.gov.cn/wjw/c100378/202402/afd5dda4bd6745fda10aad8d43a16369/files/1732845129483_98238.pdf)"]],"path":"book/training-nutrition/02-weight-management.md","aliases":"","grades":["B"]},{"id":236,"qid":"Q236","section":"营养","chapter":"训练饮食与补剂","question":"低碳饮食或限时进食会不会妨碍力量训练，怎么比较它们的执行难度和训练表现？","title":"换了吃法，拿常练动作和进餐安排一起比较","fields":[["怎么做","低碳饮食主要减少碳水摄入。限时进食主要限制每天进食的时段。如果要试，先看原方案能不能在训练前后吃饭、全天能不能吃够，并保留几个熟悉动作的重量、次数、组数和主观吃力程度作参照。只改一种吃法。同样的训练连续几次更难完成，或者进餐窗口经常挤掉正餐，就把餐次移回合适时间，或先恢复训练前后的主食。"],["成本","用原有训练日志，顺手记下进食时段和白天饥饿。要同时兼顾通勤、家庭吃饭和训练时，越严格的安排通常越费事。"],["说人话","能不能长期吃得够、按计划练完，比当周体重掉多少更能说明这套吃法合不合适。"],["收益","合并研究中，限时进食加抗阻训练和常规进食加抗阻训练的力量差异未达到统计显著。生酮饮食的合并结果中，深蹲和卧推单次最大重量也未见明确差异。这些力量指标不能预测每个人做多组训练或跑间歇的感受。"],["证据等级","B（力量结论来自各自的系统综述。生酮饮食结果主要帮助理解严格限碳，研究没有直接比较这两种吃法的执行难度）。"],["适用与备注","日常同时跑步和练力量的人，应把长跑、间歇和力量课一起考虑。单独安排一堂低碳训练见 [兼练者与低碳训练](01-fueling.md#q230)。有医学饮食或用药方案时，先和管理该方案的专业人员核对。"],["来源","限时进食加抗阻训练荟萃分析图 4c、4d；Vargas-Molina 等 2024 年生酮饮食力量综述的深蹲和卧推结果；美国运动营养学会 2024 年生酮饮食立场的运动表现部分。 [限时进食与抗阻训练](https://pmc.ncbi.nlm.nih.gov/articles/PMC11434652/) · [生酮饮食与力量综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC11279805/) · [生酮饮食运动营养立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC11212571/)"]],"path":"book/training-nutrition/02-weight-management.md","aliases":"","grades":["B"]},{"id":237,"qid":"Q237","section":"营养","chapter":"训练饮食与补剂","question":"达到自己想维持的体重以后，怎么从减脂期的吃法回到能长期维持的饮食？","title":"达到目标后，恢复能长期吃下去的份量","fields":[["怎么做","保留已经顺手的三餐和运动安排，把减脂时暂时减掉的份量加回一部分，例如常练日多盛一点主食，或把因为减量取消的加餐恢复。也可以直接调整到自己估计的维持份量。用一段时间的体重趋势、训练和饥饿观察是否合适。先为自己定一个能接受的体重波动区间，趋势持续往一侧走时再调一次。"],["成本","用原有的餐食和训练记录，每周留几分钟回顾。可以维持熟悉的饭菜，只改一两处份量。"],["说人话","目标到了，饭量要能让你长期吃得舒服、练得动。留出一点称重波动的空间。"],["收益","维持期继续安排餐食、保持活动并关注体重走向，有助于及早发现通勤、外食和训练变化带来的影响。现有初步比较尚未证明按周慢慢加热量比直接回到估计的维持摄入更能防止体重回升。"],["证据等级","C（维持期的生活习惯和自我监测来自公共卫生指南。逐步增加与直接恢复的比较来自抗阻训练成人的小型会议摘要）。"],["适用与备注","重新吃多些主食后，短时间秤重可受水分影响，见 [短期体重波动](#q232)。因疾病接受低能量饮食或其他减重治疗时，恢复常规食物按原治疗计划安排。"],["来源","美国疾控中心体重维持建议「Watch your diet」「Monitor your diet, activity, and weight」；2025 年反向节食随机比较会议摘要「Methods」「Results」；NICE NG246「Low-energy and very-low-energy diets」。 [体重维持指南](https://www.cdc.gov/healthy-weight-growth/losing-weight/keeping-it-off.html) · [反向节食初步比较](https://www.tandfonline.com/doi/abs/10.1080/15502783.2025.2550185) · [NICE 饮食与体重管理](https://www.nice.org.uk/guidance/ng246/chapter/Physical-activity-and-diet)"]],"path":"book/training-nutrition/02-weight-management.md","aliases":"","grades":["C"]},{"id":238,"qid":"Q238","section":"营养","chapter":"训练饮食与补剂","question":"刚开始练力量又想改善体型，怎么决定先维持体重、增重还是减重？","title":"刚开始练力量，按主要目标决定体重往哪走","fields":[["怎么做","先选接下来最想改善的一件事。如果想练得更有力、暂时没有明确增重或减脂需要，可以先维持平日饭量，规律训练，记体重趋势、腰围和常练动作的重量与次数。若有明确的减脂需要，先从一项小调整开始，保留抗阻训练。若主要目标是增重，体重几周没涨，训练和正餐也已安排好，再试多吃一份。每次先定一个主要目标，过几周回顾。"],["成本","用原有的秤、软尺和训练记录。增重时先调整常吃的饭菜份量。"],["说人话","刚开始练，先决定更在意力量、腰围还是体重。按这件事看进展。"],["收益","抗阻训练有助于增加力量与肌肉。减脂研究显示，摄入低于消耗时，抗阻训练带来的瘦体重增益平均较少，力量仍可能进步。体重变化方向可以按个人目标和训练反馈调。"],["证据等级","A（美国运动医学会抗阻训练立场综合多篇系统综述）。B（关于能量不足与瘦体重变化的系统综述）。三种起点取舍是实践方法。"],["适用与备注","维持体重见 [观察体重趋势](../03-everyday-nutrition.md#q02)，减脂见 [选一项可复盘的改动](02-weight-management.md#q231)，增重见 [增重时怎么读训练和腰围](#q239)。体重偏低或已有摄入不足线索时，先了解 [长期吃不够的线索](../06-training-health.md#q37)。"],["来源","美国运动医学会 2026 年抗阻训练立场摘要与表 6；Murphy 与 Koehler 2022 年荟萃分析的摘要和结果；Helms 等 2023 年不同能量盈余试验的讨论。 [美国运动医学会抗阻立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/) · [能量不足与抗阻训练荟萃分析](https://pubmed.ncbi.nlm.nih.gov/34623696/) · [能量盈余试验](https://link.springer.com/article/10.1186/s40798-023-00651-y)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["A","B"]},{"id":239,"qid":"Q239","section":"营养","chapter":"训练饮食与补剂","question":"增重期间体重和腰围都在涨，怎么结合力量记录判断需不需要调整饭量？","title":"增重时把体重、腰围和同动作的训练记录放在一起看","fields":[["怎么做","用相近条件记录体重和腰围。训练日志里，比较同一动作、相近动作幅度和努力程度下的重量与次数。若几周里体重、腰围持续上升，而几个常练动作都没进步，先看计划、睡眠和恢复，暂停继续加饭。若体重增加速度已经超过自己的计划，可以把上次加的份量减回一部分，等下一次复盘再决定。"],["成本","用现有的秤和软尺，每周花几分钟看趋势。调整时从最近新增的加餐或饭量入手。"],["说人话","腰围和体重都涨得比预期快，先把饭量稳住，再看看训练有没有跟上。"],["收益","一项为期 8 周的小试验发现，体重增长较多的人皮褶厚度往往也增加更多，和各处肌肉厚度、力量变化的关系并不一致。回顾几项趋势，可以少一次只因秤重数字没达到预期就继续加量。"],["证据等级","B（Helms 等试验只有 17 人完成，体重与皮褶变化的比较是事后分析。研究测的是皮褶，腰围是家用观察指标）。"],["适用与备注","腰围会随测量条件和消化状态变。训练表现也会随技术和恢复变。用几周的组合变化做决策。若只是吃不下，见 [普通加餐与增肌粉](../04-training-nutrition.md#q19)。"],["来源","Helms 等 2023 年的体重、皮褶和肌肉厚度回归结果、图 1、图 3 与讨论。 [不同能量盈余试验](https://link.springer.com/article/10.1186/s40798-023-00651-y)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["B"]},{"id":240,"qid":"Q240","section":"营养","chapter":"训练饮食与补剂","question":"全天蛋白质克数相近时，植物来源和动物来源对练力量和增肌的效果有什么差别？","title":"练力量吃植物蛋白，先把全天份量和来源安排足","fields":[["怎么做","先按 [全天蛋白质](../04-training-nutrition.md#q11) 估算。用植物性食材时，可以把豆腐、豆干、豆浆、毛豆或其他豆类作为正餐里的蛋白质来源，和日常主食、蔬菜搭配。用豆浆或豆制品补一餐时，要看实际吃的份量和包装的蛋白质含量。用不同来源取得足量蛋白质，比只从一两种食物凑克数更容易安排。"],["成本","先比较平时好买的豆制品。两种食品比价时，按实际价格和每份蛋白质比较。"],["说人话","想用植物蛋白练力量，可以先从豆制品做主菜，再看一天合起来吃了多少。"],["收益","年轻男性在蛋白质摄入匹配的一项 12 周试验中，植物饮食加大豆蛋白和混合饮食加乳清，两组下肢瘦体重与力量都进步，组间未观察到显著差异。更广泛的综述中，大豆和奶蛋白的肌肉量结果相近，一些其他植物来源的比较倾向于动物蛋白。"],["证据等级","B（直接比较试验按参与者原有饮食分组，均为年轻男性。综述中的大豆研究多用分离或浓缩蛋白）。"],["适用与备注","习惯吃鱼、肉、蛋、奶也可以用其中一部分和豆制品换着吃。完全不吃动物性食物时，见 [植物性饮食的蛋白质和维生素 B12](../03-everyday-nutrition.md#q05)。"],["来源","Hevia-Larraín 等 2021 年蛋白质摄入匹配试验的摘要、方法和结果；2025 年植物与动物蛋白随机试验综述的「Muscle Mass」和讨论。 [匹配全天蛋白质的抗阻训练试验](https://link.springer.com/article/10.1007/s40279-021-01434-9) · [植物和动物蛋白系统综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC12166177/)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["B"]},{"id":241,"qid":"Q241","section":"营养","chapter":"训练饮食与补剂","question":"担心少练几天掉肌肉，短期出差或休假时蛋白质和饭量要跟着变吗？","title":"出差少练几天，先保留正常正餐和蛋白质","fields":[["怎么做","短期出差或休假，继续在正餐里吃鱼、肉、蛋、奶或豆制品。平时只为长跑、大训练量或两练之间准备的额外加餐，可以随实际活动和食欲调整。出差走路比平时多，也把这部分活动算进去。回来后再按计划恢复训练和训练日饮食。"],["成本","用食堂、便利店和普通餐馆现有食物搭配。有常吃的正餐时，沿用即可。"],["说人话","几天没进健身房，三餐照常吃，原来为大训练额外准备的食物按当天需要调。"],["收益","一项 9 周训练试验中，中间停练一周与连续训练相比，下肢肌肉厚度增长没有明显差异，连续训练组部分下肢力量进步更多。几天假期可以按活动变化灵活安排饮食。"],["证据等级","B（试验比较健康训练者短暂停练策略，未专门调控蛋白质或短期饭量）。C（保留日常蛋白质、按负荷调整额外补充为实践建议）。"],["适用与备注","用于仍能正常活动的短期行程。卧床、伤病后固定肢体或长时间停练时，营养需要可能不同。"],["来源","Coleman 等 2024 年一周停练随机试验摘要与下肢肌肉厚度和力量结果；三机构运动营养联合立场表 1「每日燃料需求」和「Protein Needs」。 [一周停练试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC10809978/) · [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["B","C"]},{"id":242,"qid":"Q242","section":"营养","chapter":"训练饮食与补剂","question":"晚练结束后既饿又快到睡觉时间，怎么在饱腹、消化和睡眠之间安排晚饭？","title":"晚练快到睡觉时，把大部分晚饭提前","fields":[["怎么做","如果训练时间固定，可以把晚饭分开，训练前在自己平时消化舒服的时段吃主食和蛋白质菜。练完仍饿时，吃剩下的较小一份，例如鸡蛋面、馒头加奶，或少量米饭配豆腐。若今天直到练完才有时间吃晚饭，先用一份吃得下的常规食物。连续几个训练日都很饿，就把更多晚餐移到练前，再看入睡前是否饱胀、反酸或还饿。"],["成本","用同一顿晚饭分装，多花几分钟预留一份。能冷藏的食物按包装或食品安全要求保存。"],["说人话","练完快睡了，把大份晚饭留给早一点的时候。练完饿，可以吃一份自己吃得舒服的小餐。"],["收益","这样能把训练后的食物补充安排进全天，也能按自己对晚餐的耐受调整临睡前份量。运动人群研究尚不足以给所有人定一个最佳晚餐时点或份量。"],["证据等级","C（运动营养立场支持安排全天及训练前后摄入。拆分晚饭是执行做法。反流指导针对有相关症状或诊断人群）。"],["适用与备注","有夜间反酸时，优先把正餐提早，并按自身情况就医。美国胃肠病学会把避免临睡前 2–3 小时吃饭列为胃食管反流病的条件性建议。"],["来源","三机构运动营养联合立场「Protein Needs」；运动训练人群饮食与睡眠综述的讨论；美国胃肠病学会胃食管反流指南表 1「Management of GERD」。 [运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf) · [饮食与运动人群睡眠综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC9414564/) · [美国胃肠病学会反流指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC8754510/)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"晚上健身 晚上练 晚练 练完还吃吗 晚饭睡觉 晚练后吃饭","grades":["C"]},{"id":243,"qid":"Q243","section":"营养","chapter":"训练饮食与补剂","question":"两次力量训练排在同一天，只有很短的用餐时间，怎么提前准备便于携带的补充食物？","title":"同一天练两次，提前带一份能在间隔里吃的食物","fields":[["怎么做","前一晚看两次训练的时间和各自负荷。两次都吃力、间隔又短时，预先备两样东西，一份容易吃下的主食或水果，再带一份蛋白质食物和水。例如面包或香蕉加一盒按标签可常温保存的未开封牛奶。开练时间越近，越适合用自己已经试过的小份搭配，剩下的放到第二练后吃。中间有时间和冰箱时，可以带完整便当。"],["成本","用常吃的面包、水果、奶或豆浆即可。需要冷藏的便当出门前装保冷袋，到了放冰箱。"],["说人话","两练之间能吃的时间短，就先把能顺手吃下的主食和蛋白质备好。"],["收益","两次高负荷训练靠得很近时，提前备好补给，更容易吃到碳水和蛋白质，也能顾上喝水。力量训练综述中，部分糖原消耗后的研究发现加碳水有助于下一次表现，等能量对照研究未显示同样收益。"],["证据等级","C（高负荷训练间的恢复供能参考运动营养立场）。B（力量训练短间隔比较研究数量有限，训练量和对照设计不同）。"],["适用与备注","第二次只是短时技术课或总体负荷较低，可以按原来的正餐安排。有食品保存或工作时间问题可参照 [午休训练后的便携午饭](01-fueling.md#q229)。"],["来源","三机构运动营养联合立场表 1「Speedy refuelling」和「Protein Needs」；Henselmans 等 2022 年力量训练与碳水综述的摘要及糖原消耗后的研究部分。 [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf) · [碳水和力量表现的比较研究](https://www.mdpi.com/2072-6643/14/4/856)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["B","C"]},{"id":244,"qid":"Q244","section":"营养","chapter":"训练饮食与补剂","question":"力量训练前后喝酒，研究测过哪些恢复结果，怎样把聚餐和重点训练错开？","title":"聚餐碰上重点力量课，优先把训练和饮酒错开","fields":[["怎么做","提前看聚餐和下一次重点课的安排。可把重点课放在其他日子，或者聚餐选择无酒精饮品。已经喝酒并感到头晕、反应慢或不稳时，当天先不做重负荷训练。练完去聚餐，可以照常吃含主食和蛋白质的正餐、喝水，饮料按自己的选择安排。"],["成本","改一次训练日或换饮品即可，餐食按原计划。"],["说人话","聚餐要喝酒，就给特别想练好的那堂课换个日子。聚餐不喝酒也可以。"],["收益","一项小型试验对抗阻与有氧混合训练后的恢复进行测量，发现大量饮酒即使同时喝乳清蛋白，练后肌原纤维蛋白合成速率仍低于只喝蛋白的一组。综述里，短期肌力、爆发力或酸痛等结果没有显示一致的变化。"],["证据等级","B（肌肉蛋白合成结果来自 8 名活跃男性的交叉试验，酒精剂量为每公斤体重 1.5 克，观察训练后数小时。其他恢复指标来自小样本研究综述）。"],["适用与备注","研究剂量用于解释试验结果。少量饮酒、喝酒前后隔多久或对长期肌肉增长的影响，不能用这个结果换算。"],["来源","Parr 等 2014 年试验的研究设计和图 7；Lakićević 2019 年综述第 4 节和结论；中国营养学会《中国居民膳食指南（2022）》准则五「少盐少油，控糖限酒」。 [酒精与练后肌肉蛋白合成试验](https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0088384) · [酒精与力量恢复综述](https://www.mdpi.com/2411-5142/4/3/41) · [中国居民平衡膳食八准则](https://dg.cnsoc.org/article/04/J4-AsD_DR3OLQMnHG0-jZA.html)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["B"]},{"id":245,"qid":"Q245","section":"营养","chapter":"训练饮食与补剂","question":"想买酸樱桃汁辅助恢复，怎么区分研究里的酸痛、力量恢复和对普通训练的收益？","title":"酸樱桃汁先按恢复目标判断值不值得买","fields":[["怎么做","先明确你在意的是第二天酸痛，还是能否完成下一次重点课。日常训练先看睡眠、负荷和正餐。仍想试时，挑几次负荷相似的训练，分别记酸痛和下次能完成的重量、次数或跑量。挑产品时查清楚是浓缩汁还是普通果汁，按每份标签和价格比较。同名产品的配方可能不同。"],["成本","按整段试用期所需份数和单价算总成本。没有明确想改善的恢复问题时，可以把预算留给日常食物。"],["说人话","隔天酸不酸，和隔天能不能发挥原来的力量，分开记。"],["收益","2026 年运动员试验综述发现，酸樱桃汁在部分运动后恢复时点可能改善最大自主收缩力。合并后，没有看到主观酸痛的一致改善。两类结果都不能直接转换成普通力量课或跑步训练中能感觉到的差别。"],["证据等级","B（运动员研究的合并结果，训练方式、产品和观察时点不同，最大自主收缩力和主观酸痛的证据确定性均为很低）。"],["适用与备注","综述研究针对诱发明显肌肉损伤的运动场景。普通训练一两次喝完感觉不同，可能受训练量和睡眠影响。"],["来源","2026 年酸樱桃汁运动恢复荟萃分析「Maximal Voluntary Contraction」「Muscle Soreness」、图 2、图 5 与表 3 的证据确定性分级。 [酸樱桃汁与运动恢复荟萃分析](https://link.springer.com/article/10.1186/s40798-026-00993-3)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["B"]},{"id":246,"qid":"Q246","section":"营养","chapter":"训练饮食与补剂","question":"训练完一点也不饿，但当天总摄入经常偏少，怎么调整当天更早几顿的食物分配？","title":"练后没胃口，先把一部分恢复饮食移到白天","fields":[["怎么做","挑两三个练后吃得少的日子，回看哪一顿最容易漏。经常晚练的人，可以先把午饭的主食和蛋白质吃齐，或把夜里吃不下的部分挪到下午、离训练有足够消化时间的加餐。练完仍吃不下大份，可以备一份自己平时能接受的小餐，例如酸奶配香蕉，过一会儿再看胃口。重点看当天有没有把计划中的食物吃进去。"],["成本","用原有饭菜重新分配份量。不方便坐下吃时备一份能带走的食物。"],["说人话","晚练后总吃不下，就别把太多饭留到练完。白天那几顿多留出一点位置。"],["收益","有些人在运动后会暂时不饿。把食物放到更能吃下的时段，可以减少整天进食都被最后一顿拖住的情况。"],["证据等级","C（运动后食欲变化因运动类型及个人而异。把饭量移到白天的建议依据全天供能和实践安排，暂无针对这种作息的直接对照）。"],["适用与备注","用于运动后短时间胃口低。若食欲持续降低，或同时出现非计划体重下降、持续疲劳或月经变化，见 [长期摄入不足线索](../06-training-health.md#q37)，并考虑请专业人员评估。"],["来源","McCarthy 等 2024 年运动后食欲综述第 2.1、2.2 节和总结；三机构运动营养联合立场表 1「每日燃料需求」和「Protein Needs」。 [运动后食欲综述](https://physoc.onlinelibrary.wiley.com/doi/10.14814/phy2.70022) · [三机构运动营养联合立场](https://www.dietitians.ca/DietitiansOfCanada/media/Documents/Resources/noap-position-paper.pdf)"]],"path":"book/training-nutrition/03-muscle-and-recovery.md","aliases":"","grades":["C"]},{"id":247,"qid":"Q247","section":"营养","chapter":"训练饮食与补剂","question":"乳清浓缩、分离和植物蛋白粉怎么按乳糖耐受、每份蛋白质和价格选？","title":"挑蛋白粉先看能不能喝，再按同样蛋白质克数比价","fields":[["怎么做","能耐受乳制品时，可以把浓缩乳清放进候选。对乳糖敏感时，分离乳清通常含乳糖较少，买前仍要核对产品是否标明乳糖含量，或考虑成分合适的植物蛋白粉。比较时，先用一袋的总重量和营养表算整袋有多少克蛋白质，再按同样的蛋白质克数比价。"],["成本","举例，一袋 500 克、蛋白质占 80% 的粉卖 120 元，整袋含约 400 克蛋白质，每 20 克蛋白质约 6 元。另一袋 500 克、蛋白质占 90% 的粉卖 160 元，每 20 克蛋白质约 7.11 元。搭配牛奶等冲泡时，把额外花费也计入。"],["说人话","先选喝了舒服的，再算买到同样多的蛋白质要花多少钱。"],["收益","分离乳清通常蛋白质比例更高、乳糖更少。把不同份量统一后，能判断额外花费是在买更好的耐受性、冲泡便利，还是更多蛋白质。"],["证据等级","C（产品差异参考澳大利亚体育学院资料，乳糖耐受参考美国国立糖尿病、消化与肾病研究所。价格为算例）。"],["适用与备注","牛奶蛋白过敏和乳糖不耐受需要不同处理。牛奶蛋白过敏者避开乳清，包括低乳糖或无乳糖乳清，选替代品时还要看过敏原信息。植物与动物蛋白的训练证据见 [植物蛋白条目](03-muscle-and-recovery.md#q240)。"],["来源","澳大利亚体育学院蛋白质补充品的种类表「Whey」「Soy」「Plant」；美国国立糖尿病、消化与肾病研究所乳糖不耐受饮食建议；美国食品药品监督管理局食物过敏标签说明。 [蛋白粉种类表](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/isolated-protein-supplement2) · [乳糖不耐受参考](https://www.niddk.nih.gov/health-information/digestive-diseases/lactose-intolerance/eating-diet-nutrition) · [食物过敏原标签](https://www.fda.gov/consumers/consumer-updates/have-food-allergies-read-label)"]],"path":"book/training-nutrition/04-common-supplements.md","aliases":"","grades":["C"]},{"id":248,"qid":"Q248","section":"营养","chapter":"训练饮食与补剂","question":"β-丙氨酸对哪类训练可能有帮助，普通力量训练是否值得为它付钱？","title":"为持续高强度表现再考虑 β-丙氨酸","fields":[["怎么做","先看想改善的任务。如果是日常深蹲、卧推、硬拉或普通增肌训练，把钱先花在能坚持的训练和饮食上。如果专项是持续数分钟的高强度运动，例如划船、场地骑行或中距离跑，可以先看研究任务和自己的比赛是否接近。用于运动表现的研究通常是连续多周补充，再测试成绩。"],["成本","看一整段补充周期的成本。复合补剂若只写一勺总重量，很难判断是否和研究中用的 β-丙氨酸相近。"],["说人话","练完皮肤发麻，和成绩有没有提高是两回事。普通力量训练可以先省下这笔钱。"],["收益","一些高强度运动测试显示收益，结果随测试时长和任务而变。力量与爆发力研究结果不一致，难以据此判断普通力量训练能获得相同收益。"],["证据等级","B（系统综述和试验支持部分专项。年轻受训男性在部分时长的测试中有改善，不能推广到所有训练或目标）。"],["适用与备注","皮肤刺麻是已知的不良反应。考虑用这种补剂时，从想改善的训练结果判断，并留意所用产品的实际成分。"],["来源","澳大利亚体育学院 β-丙氨酸「How and when do I use it?」与「Are there any concerns or considerations?」；Georgiou 等高强度表现荟萃分析摘要；2025 年力量和爆发力剂量策略系统综述的结果与讨论。 [适用运动与补充周期](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/performance-supplements2/b-alanine/how-and-when-do-i-use-it) · [已知不良反应](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/performance-supplements2/b-alanine/are-there-any-concerns-or-considerations) · [高强度运动综述](https://doi.org/10.1123/ijsnem.2024-0027) · [力量与爆发力综述](https://www.tandfonline.com/doi/abs/10.1080/15502783.2025.2566368)"]],"path":"book/training-nutrition/04-common-supplements.md","aliases":"","grades":["B"]},{"id":249,"qid":"Q249","section":"营养","chapter":"训练饮食与补剂","question":"甜菜根浓缩汁标的是毫升或原料克数，怎么判断标签有没有提供可比较的硝酸盐含量？","title":"挑甜菜根浓缩汁，找每份硝酸盐的毫克数或毫摩尔数","fields":[["怎么做","看包装或批次报告是否写明每份的硝酸盐（NO₃⁻）含量。每 1 毫摩尔硝酸盐约等于 62 毫克。例如每份标 400 毫克硝酸盐，约为 6.45 毫摩尔。若标签按每 100 毫升标，就先换算到自己会喝的份量。仅写 70 毫升浓缩汁或 5 克甜菜根粉时，可以向厂商要硝酸盐实测值。"],["成本","算每份明确含量的价格。缺少含量数据的产品暂时无法按硝酸盐剂量比价。"],["说人话","瓶子多大、用了多少甜菜根，都不能直接告诉你硝酸盐有多少。"],["收益","市售甜菜根制品实测硝酸盐含量差异很大。拿到每份数值，才能判断买到的产品和研究所用产品有多接近。"],["证据等级","B（市售产品含量差异由化验研究测得）。C（澳大利亚体育学院按硝酸盐剂量提供运动营养参考）。"],["适用与备注","剂量相近仍要看运动项目、测试条件和个人耐受。核对清楚单位对应硝酸盐、亚硝酸盐还是硝酸盐氮。"],["来源","澳大利亚体育学院硝酸盐与甜菜根汁资料的产品和常用研究剂量部分；Gallardo 与 Coggan 2019 年市售产品实测的结果和讨论。 [运动营养剂量示例](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/performance-supplements2/beetroot-juicenitrate) · [市售甜菜根产品实测](https://doi.org/10.1123/ijsnem.2018-0223)"]],"path":"book/training-nutrition/04-common-supplements.md","aliases":"","grades":["B","C"]},{"id":250,"qid":"Q250","section":"营养","chapter":"训练饮食与补剂","question":"训练前复合补剂同时写了瓜氨酸、精氨酸和“泵感配方”，怎样区分主观泵感、一次训练和长期收益？","title":"复合训练前补剂先看单项剂量，再看实际训练结果","fields":[["怎么做","把包装上的瓜氨酸、瓜氨酸苹果酸、精氨酸、咖啡因等分开看。记录每份实际含量和形式。只写「泵感配方」的总重量时，不能和单成分试验相比较。想判断有没有用，先想清楚你看重的是练时充血感、同重量下能做的次数，还是几周的训练进步，选对应指标看。"],["成本","算每次实际使用的价格。无法查到单项剂量时，可以先省下整罐复合配方的钱。"],["说人话","「泵感强」可以是主观感受。评价练得有没有进步，要看动作的重量、次数和一段时间的记录。"],["收益","瓜氨酸苹果酸有些短期研究发现同一训练中重复次数略增，更新的合并分析显示结果小且不确定，最大力量或爆发力未见清楚的总体优势。精氨酸的运动表现证据有限。这些结果也无法证明某款复合产品能多长肌肉。"],["证据等级","B（瓜氨酸苹果酸的单成分试验综述，结论随指标和分析而变）。C（精氨酸参考美国国立卫生研究院膳食补充剂办公室）。"],["适用与备注","几种成分的研究结果不能直接相加。复合产品含咖啡因时，尤其注意 [晚练与睡眠](../04-training-nutrition.md#q20)。"],["来源","Vårvik 等 2021 年训练重复次数荟萃分析摘要；2026 年瓜氨酸苹果酸三水平荟萃分析的运动表现分组结果和讨论；美国国立卫生研究院膳食补充剂办公室「Arginine」「Citrulline」。 [单次力量训练重复次数综述](https://pubmed.ncbi.nlm.nih.gov/34010809/) · [瓜氨酸苹果酸与多种表现指标](https://www.mdpi.com/2072-6643/18/12/1881) · [运动补剂资料](https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/)"]],"path":"book/training-nutrition/04-common-supplements.md","aliases":"","grades":["B","C"]},{"id":251,"qid":"Q251","section":"营养","chapter":"训练饮食与补剂","question":"包装写“专有配方”，但只标一勺总重量，怎么判断它能不能与研究用量比较？","title":"专有配方要到单项剂量，才能跟研究比较","fields":[["怎么做","先找每份是几勺、每勺多少克，再看每种成分有没有独立写明含量。全配方只有一行总重量时，向厂商要具体成分的每份剂量和形式。拿到信息后，和试验里的成分、用量、使用时间及人群逐项对照。只给成分排序、商标或原料产地时，先把剂量记为未知。"],["成本","花几分钟看营养表和成分表，必要时问一次客服。拿不到单项含量，可先省下基于功效宣传的花费。"],["说人话","一勺 8 克，可能大部分是其中一种。知道总重以后，还要找你关心的那一项的含量。"],["收益","能分辨哪些成分有足够信息和研究对上。美国进口补充剂标签上的专有配方可以列混合总重和按重量排列的成分，顺序无法提供各项精确克数。"],["证据等级","C（美国食品药品监督管理局标签说明，适用于对应的美国膳食补充剂标签。研究对照为执行方法）。"],["适用与备注","「专有配方」有时只是产品命名。各种市场的标签规则可能不同。咖啡因或其他兴奋成分剂量未知时，尤其难判断叠加用量。"],["来源","美国食品药品监督管理局膳食补充剂标签指南第四章第 34 问；美国国立卫生研究院膳食补充剂办公室运动补剂专业资料「Combinations of ingredients」。 [专有配方标示说明](https://www.fda.gov/food/dietary-supplements-guidance-documents-regulatory-information/dietary-supplement-labeling-guide-chapter-iv-nutrition-labeling) · [复合运动补剂证据](https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["C"]},{"id":252,"qid":"Q252","section":"营养","chapter":"训练饮食与补剂","question":"买补剂时看到“第三方检测”或“批次认证”，怎样核对证书覆盖的产品、批次和项目？","title":"把第三方认证查到同款、同口味和同批号","fields":[["怎么做","找到包装上的认证机构、产品名、口味和批号。直接到认证机构网站，用产品和批号反查，再对照口味和规格。卖家只给检测报告时，对照报告的送检样品名称、批号、日期和检测项目。检查它标的是禁用物质、标签含量、重金属、微生物，还是其中几项。"],["成本","两家常见认证机构都提供公开查询。收货后再对照罐身批号，花几分钟即可。"],["说人话","瓶上有个标志，先去发标志的机构查手上那一批，再看它测了什么。"],["收益","核对批号和项目，可减少拿别款、别批次或范围不同的报告来判断当前产品的可能。认证能降低其覆盖范围内的部分污染风险。"],["证据等级","C（认证机构说明及反兴奋剂机构的核验指南。认证项目和范围随项目而异）。"],["适用与备注","对需接受兴奋剂检测的人尤其重要。即使批次核验通过，实际是否值得买仍要看相应成分、剂量和试验结果。"],["来源","美国反兴奋剂机构的购买前批次核验指引；NSF Certified for Sport 产品查询；Informed Sport 认证流程第 4 阶段。 [核验认证标志和批次](https://www.usada.org/substances/supplement-connect/reduce-risk-testing-positive-experiencing-adverse-health-effects/) · [NSF 批号查询](https://www.nsfsport.com/certified-products/index.php) · [Informed Sport 认证流程](https://sport.wetestyoutrust.com/about/certification-process)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["C"]},{"id":253,"qid":"Q253","section":"营养","chapter":"训练饮食与补剂","question":"第一次试一种补剂，怎样选观察指标和停用条件，才不会把训练本身的变化算给它？","title":"第一次尝试补剂，先定一个观察指标和停用条件","fields":[["怎么做","先用几次常规训练记基线，选一个和目标对应的指标，例如固定重量和接近的用力程度下能做几次，或同一路线、相近配速下的胃肠感受。一次只加一种商品，尽量避免同时改变训练量、咖啡因或作息。用几次可比较的训练复盘。遇到持续不适或到约定时间仍无实际收益，就可以停用。"],["成本","用现有训练记录。需要试用时，可先考虑小包装并计入整个试用周期的花费。"],["说人话","先有几次平时的记录，再改一项。否则那天刚好睡得好，也容易被算成补剂的作用。"],["收益","更容易记录产品耐受性和购买后实际能观察到的变化。个人记录会受期望、自然训练进步和状态波动影响。"],["证据等级","C（国际奥委会共识支持先在训练中试用。减少同时改变的因素是个人观察方法）。"],["适用与备注","出现呼吸困难、喉咙肿胀或胸痛等严重反应，立即停用并寻求紧急医疗帮助。比赛当天优先用已试过的补给计划。"],["来源","国际奥委会运动补剂共识关于在接近比赛条件的训练中试用的段落；美国食品药品监督管理局「How to Report a Problem with Dietary Supplements」严重反应和停用说明。 [国际奥委会共识](https://bjsm.bmj.com/content/early/2018/03/13/bjsports-2018-099027) · [补剂不良反应说明](https://www.fda.gov/food/dietary-supplements/how-report-problem-dietary-supplements)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["C"]},{"id":254,"qid":"Q254","section":"营养","chapter":"训练饮食与补剂","question":"蛋白粉、复合维生素和训练前补剂叠着吃时，怎么发现不同产品里重复添加的成分？","title":"把多种补剂按一天实际用量加总","fields":[["怎么做","把蛋白粉、复合维生素、训练前补剂和常喝的能量饮料放在一起。按实际用量记每种产品的咖啡因、维生素和矿物质。碰到毫克与微克先换成同一单位，碰到不同形式以标签标注的实际营养素为准。把同一成分相加，例如复合维生素含 2 毫克维生素 B6，训练前补剂也含 5 毫克，当天从两样得到 7 毫克。"],["成本","填一次简单清单，更换产品或加量后更新即可。先核对已有产品。"],["说人话","换个罐子，可能又吃了同一种成分。把当天真用到的量加起来看。"],["收益","复合补剂和强化食品叠加可能使某些营养素的摄入接近或超过可耐受最高摄入量。加总能帮你发现重复补充，决定是否需要查上限或请人核对。"],["证据等级","C（美国国立卫生研究院膳食补充剂办公室对叠加摄入的安全说明。维生素 B6 数字为算例）。"],["适用与备注","营养标签的营养素参考值百分比与安全上限含义不同。不同上限也有各自计入的来源。怀孕、慢性病或有用药方案时，把实物标签和清单一起给医生或药师看。"],["来源","美国国立卫生研究院膳食补充剂办公室复合维生素和矿物质资料「Health Risks」及「Interactions with Medications」；GB 28050—2011 附录 A 的营养素参考值。 [复合来源与摄入上限](https://ods.od.nih.gov/factsheets/MVMS-HealthProfessional/) · [营养标签参考值](https://www.nhc.gov.cn/sps/c100088/201111/714fdca49f15450580fc03a2ee3163f9/files/1732844863395_24655.pdf)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["C"]},{"id":255,"qid":"Q255","section":"营养","chapter":"训练饮食与补剂","question":"“燃脂片”“排水”“出汗多”这些宣传各在说什么，怎么判断它能不能帮助长期减脂？","title":"评估燃脂宣传，查几周以后的体脂或腰围结果","fields":[["怎么做","先看宣传给的指标。出汗多反映流失了更多汗液，一次体重下降也会受水分变化影响。「燃脂」如果只展示体温、出汗或当次脂肪氧化，继续找同一产品的较长期对照研究，关注体脂、腰围和不良反应。国内声称是保健食品的，可核对注册或备案与批准的保健功能。"],["成本","先看产品是否提供可核对的成分、剂量和原始研究。仅有体验视频时，可省下试吃的费用。"],["说人话","出汗后秤轻一点，先想到水。要判断减脂，得看更长时间的实际结果。"],["收益","多数市售减重补剂成分的体重管理证据有限，部分被研究的成分效应小或结果不一致。比对对照研究与监管信息，有助于识别宣传能支持多大的承诺。"],["证据等级","C（产品证据参考美国国立卫生研究院膳食补充剂办公室的逐成分资料。国家监管资料用于核对保健声称）。B（短期体重波动参考成人体成分研究）。"],["适用与备注","刻意排水和在运动中追求多出汗会影响补水判断。监管机构也在部分减重产品中检出未标明的药物成分。了解体重短期回升可看 [水分与短期体重](02-weight-management.md#q232)。"],["来源","美国国立卫生研究院膳食补充剂办公室减重补剂专业资料的成分比较表；美国食品药品监督管理局减重产品安全通报；市场监管总局与中国消费者协会保健食品消费提示；Bhutani 等 2017 年结果与讨论。 [减重补剂专业资料](https://ods.od.nih.gov/factsheets/WeightLoss-HealthProfessional/) · [未标明药物的安全通报](https://www.fda.gov/drugs/medication-health-fraud-notifications/weight-loss-product-notifications) · [保健食品消费提示](https://www.samr.gov.cn/xw/mtjj/art/2026/art_7391c6ca403249c784f0e7f1be013212.html) · [短期体重与水分](https://physoc.onlinelibrary.wiley.com/doi/full/10.14814/phy2.13336)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["B","C"]},{"id":256,"qid":"Q256","section":"营养","chapter":"训练饮食与补剂","question":"想保护关节而考虑胶原蛋白或氨糖，怎么区分缓解特定症状和预防健康训练者受伤的证据？","title":"为关节买补剂前，先分清是处理症状还是预防受伤","fields":[["怎么做","如果已经疼，先记哪里疼、什么动作会引发、是否肿胀或影响走路和训练，必要时就医评估。如果关节没有症状、目的是少受伤，优先把训练负荷调到能逐步适应的水平。看补剂研究时，找有没有比较相似的训练者真实受伤次数或时间，别只看肌腱厚度或疼痛评分。"],["成本","先核对研究对象和结局，不急着买整盒。已经确诊关节病时，按已有评估和治疗计划处理。"],["说人话","有膝骨关节炎的人疼得轻一点，和健康跑者少受伤，得看不同研究。"],["收益","部分膝骨关节炎研究提示，口服胶原相关产品可能改善疼痛和功能。健康训练者的胶原研究常测肌腱结构或力学指标，直接的伤病预防证据仍不足。美国风湿病学会 2026 年指南摘要反对把氨糖用于膝、髋和手骨关节炎。"],["证据等级","B（胶原证据来自特定症状和肌腱指标的综述，配方、人群和结局有差异）。C（氨糖结论来自临床指南，适用于相应诊断）。"],["适用与备注","关节持续肿胀、反复卡住或已有明显功能受限时，优先评估原因。"],["来源","胶原与膝骨关节炎荟萃分析摘要；2026 年肌腱相关结构及表现系统综述的结果和局限；美国风湿病学会 2026 年骨关节炎指南摘要第 3 页氨糖条目。 [胶原与膝骨关节炎](https://pubmed.ncbi.nlm.nih.gov/39212129/) · [胶原与肌腱结构和表现](https://pmc.ncbi.nlm.nih.gov/articles/PMC13028264/) · [骨关节炎指南资料](https://rheumatology.org/osteoarthritis-guideline)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["B","C"]},{"id":257,"qid":"Q257","section":"营养","chapter":"训练饮食与补剂","question":"有人推荐肌酸以外的增肌补剂，比如 HMB，普通练力量的人怎么看研究对象与自己的差别？","title":"看 HMB 宣传时，先对照受试者和训练条件","fields":[["怎么做","确认研究招的是经常练力量的成人、刚开始运动的人，还是有肌肉流失风险的老年人或患者。再看两组是否做了相似训练、是否只有一组使用肌酸或复合产品、测的是力量和瘦体重还是仅有短期指标。如果目标是普通增肌，先看有抗阻训练、研究对象和自己接近、并且单独比较 HMB 的结果。"],["成本","按完整试验周期估算实际费用，和日常蛋白质来源、训练场地费用一起考虑。"],["说人话","研究对象和你越接近，越能用它判断这瓶值不值得买。"],["收益","专门看年轻成年人抗阻训练的综述没有发现 HMB 明确增加力量或去脂体重。覆盖年龄和健康状况更广的伞状综述有小幅正向合并结果。适用人群不同会影响购买决定。"],["证据等级","B（直接的年轻成年人抗阻研究与较广人群的再综合结论不同。广人群结果不能当作普通训练者的效果估计）。"],["适用与备注","以主要目标排序，普通力量训练可先安排好 [全天蛋白质](../04-training-nutrition.md#q11)，并了解 [肌酸的证据](../04-training-nutrition.md#q17)。疾病或年龄相关肌肉流失由专业人员评估。"],["来源","Jakubowski 等 2020 年 HMB 与抗阻训练荟萃分析的结果和结论；Bideshki 等 2025 年伞状综述的结果与人群异质性讨论。 [年轻成人抗阻训练结果](https://www.mdpi.com/2072-6643/12/5/1523) · [跨人群伞状综述](https://onlinelibrary.wiley.com/doi/full/10.1002/jcsm.13671)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["B"]},{"id":258,"qid":"Q258","section":"营养","chapter":"训练饮食与补剂","question":"想用镁补剂缓解抽筋或改善恢复，哪些研究结果能回答这个购买决定？","title":"想靠镁缓解抽筋，先核对研究测的是哪种症状","fields":[["怎么做","先记是在跑步或力量训练当中抽筋、夜里安静时抽筋，还是训练后第二天酸痛。运动抽筋时先停下诱发动作，能安全伸展时轻柔拉伸，再回顾负荷、配速和环境。想改善训练后酸痛，可以先试缓一些的训练量。正在按医嘱补镁时按原方案走。"],["成本","先用训练和症状记录。若已有专业建议要补，按每份元素镁和每天实际份量比价。"],["说人话","夜里小腿抽筋、跑到一半抽筋和隔天酸痛，不能拿同一项研究来回答。"],["收益","Cochrane 综述未找到直接测试镁预防运动相关抽筋的随机试验。训练后酸痛的另一篇综述只纳入 4 项小研究，部分结果有改善，无法确定一般训练者的恢复收益。"],["证据等级","B（抽筋和酸痛分别来自系统综述，运动相关抽筋缺直接随机证据，酸痛研究少且干预各异）。"],["适用与备注","补剂中的镁较多时可能腹泻、恶心。肾功能不全、用可能与镁相互作用的药物，或频繁、持续抽筋时，先请医生或药师评估。"],["来源","Garrison 等 Cochrane 2020 年综述「Authors’ conclusions」；2024 年运动后酸痛综述的结果和表 2；运动相关抽筋循证综述的处置部分；美国国立卫生研究院膳食补充剂办公室镁资料的「Dietary Supplements」「Health Risks from Excessive Magnesium」「Interactions with Medications」。 [Cochrane 抽筋综述](https://www.cochrane.org/evidence/CD009402_magnesium-muscle-cramps) · [镁与运动后酸痛综述](https://link.springer.com/article/10.1186/s12967-024-05434-x) · [运动相关抽筋处置](https://pmc.ncbi.nlm.nih.gov/articles/PMC8775277/) · [镁的用量与安全](https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/)"]],"path":"book/training-nutrition/05-supplement-purchasing.md","aliases":"","grades":["B"]},{"id":259,"qid":"Q259","section":"营养","chapter":"长跑营养","question":"开始按半马或全马计划加跑量后，怎么从一周训练和用餐记录看出哪些日子总是来不及吃够？","title":"找出一周里跑量加了、吃饭却跟不上的日子","fields":[["怎么做","在一张表记七天的跑步时长和训练类型、三餐和加餐的大概时间，并勾出延迟或漏吃的饭。对照看哪种日子反复来不及吃，比如长跑回家前还要通勤，或下班后训练让晚饭推迟。下周先为这一类日子提前留一份正餐或加餐，再看实际执行和训练状态。"],["成本","每天记几行。先记食物和时间就够，必要时再加份量。"],["说人话","把跑步和吃饭放到一张表上，找出最容易错过一餐的那一天。"],["收益","持续的低能量可用性会影响运动员健康和表现。记录能找出日程上的进食缺口。仅凭这份记录很难算出可靠的能量可用性，也无法据此确诊。"],["证据等级","C（IOC 共识和方法建议，七天排查表为应用示例）。"],["适用与备注","长期疲劳、训练表现下降、反复伤病或月经明显变化时，可以带着记录咨询医生或运动营养专业人员。参见[首版关于长期摄入不足](../06-training-health.md#q37)。"],["来源","IOC 2023 年共识与配套测量方法论文。 [IOC 共识](https://bjsm.bmj.com/content/57/17/1073) · [IOC 测量方法](https://doi.org/10.1136/bjsports-2023-107359)"]],"path":"book/distance-running-nutrition/01-training-fuel.md","aliases":"","grades":["C"]},{"id":260,"qid":"Q260","section":"营养","chapter":"长跑营养","question":"长跑训练时长在变，什么时候该开始练习边跑边吃，什么时候保持原有习惯就行？","title":"长跑延长后，选一堂合适的课练习边跑边吃","fields":[["怎么做","已经正常吃过饭的轻松短跑，可以照原来的习惯。长跑开始经常超过约一小时、且接下来还要逐步延长或备赛时，可以挑一堂熟悉的训练，从少量熟悉的碳水食物或饮料试起。把吃了多少、什么时候吃和胃里的感觉写下来，再决定下一次是否增加。"],["成本","需要携带或沿途取到补给。首次用现有食物试，看看携带和取用是否方便。"],["说人话","短轻松跑按平时来。以后比赛要边跑边吃，就先用长跑训练熟悉吃法。"],["收益","世界田联按持续时长和强度给比赛建议。持续高强度约 45–75 分钟时可用少量碳水，约 1–2.5 小时的耐力赛事常用 30–60 克/小时。普通轻松跑可以结合时长、是否需要演练以及耐受选择。"],["证据等级","C（赛事摄入共识及向训练场景的应用）。"],["适用与备注","训练首次试吃可以从低于赛事参考量开始。上量后胃不舒服，可参考[训练中调整补给](../05-distance-running-nutrition.md#q32)。"],["来源","世界田联营养共识表 3，以及澳大利亚体育学院运动食品指南的时长表。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [澳大利亚体育学院指南](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-bar2/how-and-when-do-i-use-it)"]],"path":"book/distance-running-nutrition/01-training-fuel.md","aliases":"","grades":["C"]},{"id":261,"qid":"Q261","section":"营养","chapter":"长跑营养","question":"同样是跑一小时，轻松跑和节奏跑前后怎样分配一天的碳水？","title":"同跑一小时，轻松跑照常吃，节奏课把主食放在合适的时段","fields":[["怎么做","如果一小时轻松跑前后都有正常用餐，可以沿用平时的主食安排。当天有节奏跑，先看上一餐离训练多久。午饭后很久才开跑、以往这时容易饿，可以把平时一部分主食移到训练前一段时间，或加一份熟悉的小食。跑后照常吃有主食和蛋白质的正餐。"],["成本","可以先调时间和份量。只有总吃不够时，才需要增加准备的食物。"],["说人话","先看这小时跑得有多用力、上一餐离得多远。节奏课前别等到空着肚子才想吃。"],["收益","较高强度耐力训练对碳水供应的依赖通常更大。世界田联按训练需求安排碳水，尤其保证关键课。具体一小时节奏课需要多少，受总时长、强度和个人耐受影响。"],["证据等级","C（运动营养共识及普通跑者用餐示例）。"],["适用与备注","训练很近才方便吃时，选分量小、已试过的食物。需要管理血糖的人按个人方案调整。"],["来源","世界田联长距离营养论文中的碳水安排，以及总共识表 1。 [世界田联长距离营养论文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers) · [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement)"]],"path":"book/distance-running-nutrition/01-training-fuel.md","aliases":"","grades":["C"]},{"id":262,"qid":"Q262","section":"营养","chapter":"长跑营养","question":"长距离训练会绕回同一地点时，怎样安排随身补给和中途存放，考虑天气、保存时间与取用机会？","title":"绕圈长跑，把补给放在取得到、也放得安全的地方","fields":[["怎么做","画出每圈回到补给点的大概时间。把第一圈要吃的份量随身带，其余可放在家、有人看管的位置或保冷箱。室外优先选包装完整、标签允许常温保存的食物和饮品。需要冷藏的食物用冰袋保持低温，按实际暴露时间计算，包含准备和路上时间。"],["成本","多带一小份备用。场地没有可靠存放点时，优先改成随身带或经过商店补给。"],["说人话","先算第几分钟能拿到补给，再看食物在当时天气下能不能放。"],["收益","可重复取用的路线方便核对补给时间。食品安全指南建议易腐食品在室温下累计放置不超过 2 小时，气温高于约 32°C 时按 1 小时处理，保冷另按温度要求。"],["证据等级","C（跑圈和取用办法）。食品保存时间来自官方指引。"],["适用与备注","避开直晒和高温车厢。冷藏食品尽量保持在约 4°C 或更低。超过安全放置时间的食物丢弃。"],["来源","世界卫生组织食品安全五要点与美国食品药品管理局户外食品保存指南。 [WHO 指南](https://www.who.int/docs/default-source/food-safety/five-keys-to-safer-food-poster/5keys-en.pdf) · [FDA 户外指南](https://www.fda.gov/media/79871/download)"]],"path":"book/distance-running-nutrition/01-training-fuel.md","aliases":"","grades":["C"]},{"id":263,"qid":"Q263","section":"营养","chapter":"长跑营养","question":"为全马准备后半程补给时，怎样判断练过的碳水摄入量还能不能往上加？","title":"全马补给要不要加，先看两次相近长跑的实际摄入和耐受","fields":[["怎么做","把胶、饮料和其他食物的碳水加总，除以实际跑步小时数，并记下各小时吃到多少。若多次耐受良好，预计全马时长又明显更长，可以在熟悉的长跑里试一点增加。例如原来约 40 克/小时，只把其中一小时提高到约 50 克，记下反胃、腹胀和执行难度。测试时尽量保持跑前餐、强度和喝水习惯相近。"],["成本","需要多带一份小补给和简单记录。越多产品混用，核算越容易漏。"],["说人话","先记实际吃进去多少。想加一点，就在训练里把增加量试清楚。"],["收益","世界田联对超过约 2.5 小时的耐力赛事给出最高约 90 克/小时的参考，适用性取决于目标和耐受。接近这个上限时，需组合不同转运途径的碳水，例如葡萄糖加果糖，见 [Q272](03-carbohydrates.md#q272)。跑者小型试验显示反复演练可改善某些胃肠表现，个人耐受上限仍需实测。"],["证据等级","B（小型跑者试验）。C（赛事参考区间和上调算例）。"],["适用与备注","目前已经能完成长跑、目标配速也稳定时，可继续沿用试过的量。赛事前突然更换产品或大幅上量容易让判断变难。"],["来源","世界田联营养共识表 3，以及 Costa 等在耐力跑者中的补给适应试验。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [跑者试验](https://pubmed.ncbi.nlm.nih.gov/28177715/)"]],"path":"book/distance-running-nutrition/01-training-fuel.md","aliases":"","grades":["B","C"]},{"id":264,"qid":"Q264","section":"营养","chapter":"长跑营养","question":"备赛期常跑长距离，怎样看全天蛋白质是否够，而不只检查跑完那一顿？","title":"备赛蛋白质先估全天，再看哪一餐缺","fields":[["怎么做","选一个长跑日和一个平常日，把主餐、加餐、奶类、豆制品等各项蛋白质估出来，加成全天总量。规律耐力训练者可参考运动营养立场给运动员的每日约 1.2–2.0 克/公斤区间，结合训练负荷和饮食情况取舍。例如 65 公斤跑者用 1.4 克/公斤作演算，约 91 克/天。常有一餐缺蛋白质，可以先给那餐补一种常吃的食物。"],["成本","看标签或用可靠的食物成分资料估算，选少数有代表性的日子即可。"],["说人话","跑后那一顿吃到了，还要看看早饭和其余时间。全天差在哪，就先补哪一餐。"],["收益","ACSM 与营养专业组织的联合立场给运动员的常用参考范围为 1.2–2.0 克/公斤/天。一项男性耐力跑者小样本研究用 20 公里跑后代谢指标估计需求，提示训练负荷较高时蛋白质需求可能上升。"],["证据等级","C（联合立场的摄入范围）。B（小样本耐力跑者研究）。"],["适用与备注","分餐是实用安排。备赛也应留足总能量和碳水。已知肾病或需要限制蛋白质时，遵循个人医疗建议。"],["来源","Thomas 等 2016 年 ACSM、营养与饮食学会及加拿大营养师协会联合立场，以及 Kato 等耐力跑者代谢研究。 [联合立场](https://pubmed.ncbi.nlm.nih.gov/26920240/) · [跑者研究](https://doi.org/10.1371/journal.pone.0157406)"]],"path":"book/distance-running-nutrition/01-training-fuel.md","aliases":"","grades":["B","C"]},{"id":265,"qid":"Q265","section":"营养","chapter":"长跑营养","question":"备赛中遇到减量周，饭量、加餐和长跑补给哪些值得随跑量调整？","title":"减量周按实际跑课调整加餐，保留三餐和关键课所需的碳水","fields":[["怎么做","先区分普通减量周和赛前最后几天。普通减量周可维持原有三餐，先把随着已取消或明显缩短的长跑才加上的补给减下来。保留关键课前后的主食，饭量按跑量和饥饿感微调。到了赛前最后几天，再按预计比赛时长和已试过的方案安排主食。"],["成本","改少数加餐和跑中补给就行。维持三餐比较容易回到下一周。"],["说人话","少一堂长跑，就少准备那堂课的额外补给。临赛碳水另按比赛安排。"],["收益","世界田联建议碳水可随训练需求调整，同时根据项目时长和赛前条件决定是否加载碳水。普通减量周的调整是将共识原则应用到日常课表。"],["证据等级","C（共识和减量周执行示例）。"],["适用与备注","仍然觉得很饿、训练后恢复不佳或总来不及吃时，先检查全天摄入。赛前加主食参见[首版碳水安排](../05-distance-running-nutrition.md#q25)。"],["来源","世界田联营养共识表 1 与表 3，及长距离营养论文。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [世界田联长距离营养论文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers)"]],"path":"book/distance-running-nutrition/01-training-fuel.md","aliases":"","grades":["C"]},{"id":266,"qid":"Q266","section":"营养","chapter":"长跑营养","question":"赛前加主食后体重上涨，怎样理解糖原、水分和胃里食物的变化？","title":"赛前加主食后体重涨了，先看几天的饮食和称重条件","fields":[["怎么做","如果在按计划加主食，称重时尽量固定在起床、如厕后和早餐前，记上时间和赛前饮食变化。短期增加可来自糖原储备、一起变化的水分和消化道里的食物。只因秤重变了就临时少喝水或跳过计划中的早餐，会让比赛当天的准备更难重复。"],["成本","有家用秤就能记录，也可以只跟踪饮食和跑前感受。"],["说人话","多吃主食的几天，秤重可能暂时升。赛前按练过的吃法和喝法走。"],["收益","人体研究观察到肌糖原恢复伴随肌肉水分变化。变化幅度还受当时的补水和运动条件影响，单次体重读数分不出糖原、水分或食物分别贡献多少。"],["证据等级","B（人体实验支持机制，不能从称重倒推成分）。C（按原备赛计划处理）。"],["适用与备注","如果体重突然大幅变化并伴有异常肿胀或呼吸不适，应就医评估。正常赛前如何安排主食见[首版碳水加载条目](../05-distance-running-nutrition.md#q25)。"],["来源","Fernández-Elías 等关于运动后肌水分和糖原的人体实验，以及世界田联共识的赛前碳水部分。 [人体实验](https://pubmed.ncbi.nlm.nih.gov/25911631/) · [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement)"]],"path":"book/distance-running-nutrition/02-before-the-race.md","aliases":"","grades":["B","C"]},{"id":267,"qid":"Q267","section":"营养","chapter":"长跑营养","question":"临赛前住酒店或坐高铁，怎样挑可提前采购、带到住处又便于保存的早餐？","title":"出差参赛，提前备好能安全存放的熟悉早餐","fields":[["怎么做","把家里试过的早餐拆成主食、搭配和饮品，出门前确认酒店有没有热水、冰箱或足够早的早餐供应。可自带标签允许常温保存的独立包装食物，例如原味面包、即食燕麦或未开封常温奶，按习惯搭配。要冷藏的食品用可靠的冷藏条件，携带时计入路上的时间。"],["成本","提前买齐一般食物，多带一份可直接吃的备用主食。"],["说人话","用吃惯的食物做一份随时能吃的早餐。酒店或车站的供应只当作额外选择。"],["收益","赛前餐要兼顾碳水、进食时机和胃肠耐受。按标签选常温食品并妥善冷藏易腐食品，可以降低旅途中存放不当的风险。"],["证据等级","C（赛前餐原则和备餐示例）。食品保存参照官方指引及包装要求。"],["适用与备注","原来训练吃得惯，才把常温奶或其他乳制品带进赛前餐。包装开封后按标注保存，冷藏条件无法确认就选常温品或到达后再买。"],["来源","世界田联共识表 3，以及 WHO 食品安全五要点。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [WHO 食品安全](https://www.who.int/docs/default-source/food-safety/five-keys-to-safer-food-poster/5keys-en.pdf)"]],"path":"book/distance-running-nutrition/02-before-the-race.md","aliases":"","grades":["C"]},{"id":268,"qid":"Q268","section":"营养","chapter":"长跑营养","question":"比赛是中午或晚上发枪，怎样把早餐、午餐和最后一份加餐排进当天？","title":"中午或晚上发枪，把最后一顿主餐和加餐从起跑时间倒推","fields":[["怎么做","以实际发枪时间倒推。比如 18:00 起跑，白天照常吃熟悉的早餐，14:00–15:00 左右留一顿已试过、以主食为主的餐。接近起跑若还饿或正餐较小，再用少量试过的小食。12:00 起跑时，可把相同逻辑放到早餐。把报到和交通时间一并写进去。"],["成本","最好找一次相近时段的训练试用。餐点和预备食物可提前定好。"],["说人话","先定起跑前最后一餐，再排早饭、午饭和需要的加餐。"],["收益","世界田联表 3 对比赛前 1–4 小时给出碳水参考，份量需根据进食时距和耐受调整。本文时间点用于演示倒推方法。"],["证据等级","C（世界田联共识和时间表示例）。"],["适用与备注","留给消化的时间越少，越应优先选择小份熟悉食物。早晨赛例见[首版赛前早餐](../05-distance-running-nutrition.md#q26)。"],["来源","世界田联营养共识表 3，以及长距离跑者营养论文。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement) · [长距离营养论文](https://worldathletics.org/download/download?filename=6babe10a-9969-407e-b0cd-f7d96df50f51.pdf&urlslug=Contemporary+Nutrition+Strategies+to+Optimize+Performance+in+Distance+Runners+and+Race+Walkers)"]],"path":"book/distance-running-nutrition/02-before-the-race.md","aliases":"","grades":["C"]},{"id":269,"qid":"Q269","section":"营养","chapter":"长跑营养","question":"起跑前因寄存、排队要提前很久到场，赛前那几小时的水和小食怎么带、怎么分次用？","title":"提前到赛场时，按时间把水和小食分成几次用","fields":[["怎么做","记下出门、寄存、进起跑区和发枪时间。把正餐放在已经试过的时段，路上带小瓶水或预先确认取水点。等待时间长、离正餐已经过了较久时，可以备一小份试过的碳水食物。临近起跑按口渴、天气和胃里感觉小口喝，按赛事规则处理入场后剩下的包装。"],["成本","随身多一小瓶饮品和一份小食。事先确认赛事现场安检、饮水点和厕所。"],["说人话","等待很久，就把吃喝拆成几次。口渴了喝一点，别为了补齐某个数字在起跑前喝太多。"],["收益","赛前餐和饮水需要兼顾时距、个体耐受和天气。世界田联提醒耐力跑者避免过量饮水，尤其是用时较长、出汗较少的人。"],["证据等级","C（赛事共识及到场后的执行示例）。"],["适用与备注","可以先在长跑日按相似的等待时间演练。比赛中饮水和是否需要运动饮料可看[首版水站选择](../05-distance-running-nutrition.md#q30)。"],["来源","世界田联营养共识表 3、补水和运动相关低钠血症部分。 [世界田联共识](https://worldathletics.org/download/download?filename=23fb9de0-6699-4d5b-b075-42f5da5518f5.pdf&urlslug=Nutrition+for+Athletics+-+2019+IAAF+Consensus+Statement)"]],"path":"book/distance-running-nutrition/02-before-the-race.md","aliases":"","grades":["C"]},{"id":270,"qid":"Q270","section":"营养","chapter":"长跑营养","question":"赛前特别怕找厕所，临时减少高纤维食物有哪些取舍，如何保留足够碳水？","title":"怕赛前跑厕所，先换掉一两种已知不耐受的高纤维食物","fields":[["怎么做","把容易让自己想上厕所的食物记下来，在一次长跑前只换一两项。例如将大份豆类、粗杂粮或生菜换成吃惯的白米饭、面条或白面包，把主食量留够。记录换餐、进食时距、跑强度和症状。赛后回到平时吃蔬果和全谷物的习惯。"],["成本","食材通常容易买到。需要一次类似时长和强度的训练试验。"],["说人话","临赛几餐可以把容易让你不舒服的食物换掉，同时保留吃得惯的主食。"],["收益","世界田联建议有胃肠不适风险时考虑调整赛前纤维等成分。2025 年联合立场指出，单独减纤维对运动相关胃肠症状的直接研究有限。"],["证据等级","C（赛前餐共识与短期替换示例）。"],["适用与备注","如果有便血、持续腹痛或跑步之外也有反复症状，安排医疗评估。平时食物调整可参考[日常膳食纤维](../everyday-nutrition/02-produce-and-fiber.md#q201)。"],["来源","世界田联共识表 3，以及澳大利亚运动营养师协会等 2025 年联合立场第 5.5 节。 [世界田联共识](https://worldathleti
