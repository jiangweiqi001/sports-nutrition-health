],["收益","香港卫生署 FAQ 指出，现有证据不足以说明空腹或饭前吃水果会让营养更容易吸收。合适的时段有助于维持吃水果的习惯。"],["证据等级","C（官方蔬果问答）。这是一般进食安排，不是用水果时间表治疗血糖或胃肠疾病。"],["适用与备注","糖尿病患者仍需按个人计划管理水果份量。食用时间合适，也要留意实际吃了多少。"],["来源","香港卫生署「如空腹或饭前进食水果，能否更促进身体吸收当中营养？」及水果份量问答。 [水果食用时间 FAQ](https://www.chp.gov.hk/sc/static/90028.html)"]],"path":"book/everyday-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":448,"qid":"Q448","section":"健康","chapter":"训练相关健康","question":"跑到两公里左右右肋下就痛，是热身不够吗，该怎么调整？","title":"跑步时肋下反复痛，先降速并记录触发条件","fields":[["怎么做","疼起来先转走或停下，观察是否缓解。下一次把大餐提前，避免临跑前一次吃喝很多，先用较轻松的强度尝试。记下疼痛位置、出现时间、与进食的间隔，以及停下后多久消退。每次跑到相近距离都痛、休息后仍痛或表现变了，带记录复诊。"],["成本","可能需要缩短当天训练。记录几句话即可。"],["说人话","先让疼痛缓下来，再看它与速度、饭点有没有关系。不要每次都硬顶过那个距离。"],["收益","运动相关短暂腹痛常出现在肋缘附近，但其机制尚未明确。调整进食与运动间隔属于可尝试的方法，不能凭位置把腹痛一律判作岔气。"],["证据等级","C（研究综述中的实践建议，预防和即时缓解方法的证据有限）。"],["适用与备注","适用于运动时短暂出现的腹部不适。突然剧烈腹痛、呕血、黑便或呼吸困难时立即求助。曾经检查正常，也应向医生说明之后持续复发或变化的表现。"],["来源","Morton 与 Callister 的运动相关短暂腹痛综述，以及 NHS 腹痛就医指引。 [原始综述](https://link.springer.com/article/10.1007/s40279-014-0245-z) · [NHS 腹痛](https://www.nhs.uk/symptoms/stomach-ache/)"]],"path":"book/training-health/09-reader-questions.md","aliases":"岔气 跑步肚子疼 肋骨下面疼 右上腹痛","grades":["C"]},{"id":449,"qid":"Q449","section":"健康","chapter":"训练相关健康","question":"每次下蹲膝盖都响，还能去跑步或练力量吗？","title":"膝盖只响不痛时，按活动能力决定是否继续","fields":[["怎么做","先确认响声有没有同时伴随疼痛、肿胀、卡住或打软腿。只有响声、日常活动正常时，可以从自己能控制的走路和力量练习开始，按通常方法逐步增加。若响声伴痛，调整诱发动作并评估。明显肿胀、不能承重或膝盖锁住时尽快就医。"],["成本","无需为了消除声音额外买器材或补充剂。"],["说人话","看膝盖能不能正常用、有没有痛和肿，比数它响了几声更有用。"],["收益","无痛的膝关节响声很常见，单凭声音不能判断关节磨损程度。把响声与疼痛和功能一起看，有助于选择继续活动还是评估。"],["证据等级","C（NHS 症状分流与肌肉骨骼健康指导）。"],["适用与备注","受伤瞬间的一声响随后肿痛，按[急性伤后处理](04-running-injuries.md#q328)行动。已有反复膝前痛可看[负荷调整](04-running-injuries.md#q329)。"],["来源","NHS 膝痛页面区分无痛响声与痛性弹响，Northumbria NHS 肌肉骨骼服务说明响声通常不代表损伤。 [NHS 膝痛](https://www.nhs.uk/symptoms/knee-pain/) · [Northumbria 膝部自我照护](https://www.northumbria.nhs.uk/our-services/physiotherapy-services/north-tyneside-integrated-musculoskeletal-service-ntims/self-care-and-self-referral/self-care-knee)"]],"path":"book/training-health/09-reader-questions.md","aliases":"膝盖响 膝盖弹响","grades":["C"]},{"id":450,"qid":"Q450","section":"健康","chapter":"训练相关健康","question":"练后小腿肌肉自己跳，是缺电解质吗，什么时候需要检查？","title":"练后肌肉自己跳，先看持续时间和有没有无力","fields":[["怎么做","偶尔一处肌肉轻跳、没有其他不适时，先休息，回顾睡眠、咖啡因和近期训练疲劳。记下部位、持续多久及是否影响动作。超过两周仍有、多个部位出现，或伴局部无力、僵硬时，安排医疗评估，并带上用药和补剂清单。"],["成本","观察与记录不需购买设备。必要时调整训练和就诊。"],["说人话","肌肉跳一下不等于缺镁。先把恢复和伴随症状看清楚。"],["收益","肌肉跳动常见，可能与疲劳、压力、咖啡因或药物有关。持续性及伴随的功能变化比单次跳动更能帮助医生判断。"],["证据等级","C（NHS 肌肉跳动自我照护与就医指引）。"],["适用与备注","这里讨论肌肉不自主轻跳。疼痛性抽筋、明显肿胀或异常严重肌痛需要另行判断。怀疑处方药有关时先问开药医生，避免自行停药或不断加量补钾、镁。"],["来源","NHS 对肌肉跳动、相关因素及就医条件的说明。 [NHS 肌肉跳动](https://www.nhs.uk/symptoms/twitching-eyes-and-muscles/)"]],"path":"book/training-health/09-reader-questions.md","aliases":"","grades":["C"]},{"id":451,"qid":"Q451","section":"健康","chapter":"训练相关健康","question":"举重时第一次头痛，之后一练就复发，只改呼吸或休息几天够吗？","title":"第一次用力时出现头痛，停练并及时评估","fields":[["怎么做","第一次在跑步或举重时出现这种头痛，停止当天训练，及时联系医生评估。记录起痛有多突然、达到最痛用了多久、持续多久及伴随症状。突然爆发的剧烈头痛，或伴意识改变、说话困难、肢体无力等表现时，立即呼叫急救。"],["成本","暂停训练，必要时就医。症状消退后也先把首次发作情况说明清楚。"],["说人话","第一次练到头痛，别直接认定是憋气或缺水，再换个动作试。"],["收益","原发性运动性头痛确实存在，但首次出现时需要排除其他原因。改变呼吸后仍反复发作，也不能仅靠这个反应自行诊断。"],["证据等级","C（国际头痛分类及医疗机构的症状评估指导）。"],["适用与备注","已有明确偏头痛诊断者可参考[运动触发的记录与调整](../chronic-health/04-musculoskeletal-and-treatment.md#q399)。新出现或明显不同于以往的头痛仍需重新评估。撞击后的头痛见[脑震荡处理](05-injuries-and-return.md#q348)。"],["来源","国际头痛学会 ICHD-3 原发性运动性头痛条目，以及 Mayo Clinic 运动性头痛和急症识别资料。 [ICHD-3](https://ichd-3.org/other-primary-headache-disorders/4-2-primary-exercise-headache/) · [运动性头痛](https://www.mayoclinic.org/diseases-conditions/exercise-headaches/symptoms-causes/syc-20372276) · [头痛急症信号](https://www.mayoclinic.org/symptom-checker/headaches-in-adults-adult/related-factors/itt-20009075)"]],"path":"book/training-health/09-reader-questions.md","aliases":"","grades":["C"]},{"id":452,"qid":"Q452","section":"健康","chapter":"训练相关健康","question":"走路时手指胀到戒指难取，该怎样处理？","title":"走路时手指发胀，出门前先取戒指并放松表带","fields":[["怎么做","曾在步行时手指肿胀、戒指难取的人，出门前先取下戒指，表带留松些。途中可不时张开手指、握拳并把手举高，停下后观察是否消退。反复困扰或休息后仍不消退时，向医生说明持续时间和其他症状。"],["成本","无需添置装备，提前收好首饰即可。"],["说人话","知道自己走路会手胀，就先把戒指摘下来，途中活动手指。"],["收益","运动时手肿并不少见，机制尚不完全清楚。摘戒指可减少肿胀后卡住的麻烦，手部活动属于可尝试的舒适措施。"],["证据等级","C（医院专家答疑，手部活动属于实践建议）。"],["适用与备注","长时间运动中手肿若同时伴呕吐、意识异常等表现，立即找医疗人员，参考[运动相关低钠识别](../06-training-health.md#q39)。仅凭手肿不能判断该补多少盐或水。"],["来源","Mayo Clinic 对步行时手指肿胀、戒指难取这一读者问题的原始答复。 [医院答疑](https://www.mayoclinic.org/diseases-conditions/edema/expert-answers/hand-swelling/faq-20058255?p=1)"]],"path":"book/training-health/09-reader-questions.md","aliases":"","grades":["C"]},{"id":453,"qid":"Q453","section":"健康","chapter":"训练相关健康","question":"跑步把乳头磨痛甚至磨出血，该怎样预防和处理？","title":"跑步反复磨破皮，先减少衣物和皮肤之间的摩擦","fields":[["怎么做","试穿排汗、接缝不磨皮肤的衣物，留意乳头、大腿内侧和衣物边缘。易摩擦而皮肤完整的部位，可少量涂凡士林或用合适的柔软敷贴保护，先在短课试用。已经疼痛、发红或破皮就停止继续摩擦，温和清洁并覆盖保护，暂换不磨该处的活动。"],["成本","可能需要少量凡士林或敷贴，也可能只需换掉不合身的衣服。"],["说人话","先处理哪里在磨，磨疼时就停下来调整。别等衣服上见血。"],["收益","减少皮肤与衣物或皮肤之间的摩擦，有助于预防擦伤和水疱。持续在破损部位摩擦会妨碍恢复。"],["证据等级","C（美国皮肤病学会的摩擦与表浅伤口照护建议）。"],["适用与备注","出现脓液、红肿加重、疼痛增加或伤口不愈合时就医。反复乳头出血若找不到表面摩擦伤，也应评估。脚部鞋袜问题见[足部摩擦处理](04-running-injuries.md#q338)。"],["来源","美国皮肤病学会关于预防摩擦、水疱及凡士林照护的原始建议。 [摩擦与水疱](https://www.aad.org/public/everyday-care/injured-skin/burns/prevent-treat-blisters) · [凡士林与表浅伤口照护](https://www.aad.org/public/everyday-care/skin-care-secrets/routine/petroleum-jelly/)"]],"path":"book/training-health/09-reader-questions.md","aliases":"","grades":["C"]},{"id":454,"qid":"Q454","section":"健康","chapter":"训练相关健康","question":"规律健身后胸背更容易长痘，已经洗澡了还该调整什么？","title":"运动后容易长痘，先调整清洁和贴身衣物","fields":[["怎么做","每次穿洗净的运动衣，训练前卸掉妆。出汗时用干净毛巾轻按吸汗，避免来回擦。练后尽快温和清洗并换干净衣服，不方便洗澡时先换下汗湿衣物。检查运动内衣、头盔或其他贴身装备是否持续闷热摩擦，并按要求清洁。"],["成本","多备一套干净衣物和毛巾，使用自己能耐受的温和清洁用品。"],["说人话","可以继续锻炼，把汗湿衣服换掉，皮肤轻轻洗，别越长痘越使劲搓。"],["收益","汗液、油脂、衣物和装备带来的摩擦与堵塞可使痤疮加重。改善清洁与接触条件，有助于减少这些诱因。"],["证据等级","C（美国皮肤病学会面向运动者的痤疮护理建议）。"],["适用与备注","已有痤疮治疗可以按原方案继续。调整后仍反复或加重时找皮肤科评估，避免把所有运动后皮疹都当作痤疮。户外训练可选不易堵塞毛孔、耐水的防晒用品。"],["来源","美国皮肤病学会关于运动与痤疮的原始答疑。 [运动后痤疮护理](https://www.aad.org/public/diseases/acne/causes/workouts)"]],"path":"book/training-health/09-reader-questions.md","aliases":"","grades":["C"]},{"id":455,"qid":"Q455","section":"健康","chapter":"训练相关健康","question":"健身房公共淋浴担心卫生，要带什么、怎样减少皮肤感染风险？","title":"用健身房淋浴时穿拖鞋，洗后擦干脚趾缝并换干净衣袜","fields":[["怎么做","在健身包里备好淋浴拖鞋、个人毛巾和干净衣袜。更衣室和公共淋浴间不赤脚走。练后洗澡，轻轻擦干脚部，尤其脚趾缝，再换衣袜。毛巾、剃刀和鞋袜各用各的。有小伤口时清洁并覆盖，伤口愈合前先避开桑拿、蒸汽房和热水池。"],["成本","多带一双拖鞋和换洗用品，用后清洗、晾干。"],["说人话","公共浴室里护好脚，洗完别让湿脚一直闷在袜子里。"],["收益","公共淋浴间等温暖潮湿处有利于部分病原体传播。穿鞋、保持干燥和不共用个人用品，有助于减少足癣等皮肤感染的机会。"],["证据等级","C（皮肤科专业机构和公共医疗机构的感染预防建议，未给出单项措施的绝对降风险数值）。"],["适用与备注","趾缝持续发痒、脱皮可咨询药师或医生。出现脓液、持续红肿或疼痛加重时就医。糖尿病或免疫功能低下者出现足部问题应联系医生。跑鞋挤压和反复水疱另见[鞋袜与足部摩擦](04-running-injuries.md#q338)。"],["来源","美国皮肤病学会健身房皮肤感染预防建议，以及 NHS 足癣页的日常护理、传播途径和就医条件。 [健身房皮肤感染预防](https://www.aad.org/public/everyday-care/skin-care-secrets/routine/prevent-skin-infections-at-the-gym) · [足癣护理与就医](https://www.nhs.uk/conditions/athletes-foot/)"]],"path":"book/training-health/10-more-reader-questions.md","aliases":"","grades":["C"]},{"id":456,"qid":"Q456","section":"健康","chapter":"训练相关健康","question":"戴隐形眼镜再加泳镜，能不能下水游泳？","title":"游泳前摘掉隐形眼镜，需要矫正视力可选度数泳镜","fields":[["怎么做","下水前洗净双手并摘下隐形眼镜，游泳和淋浴都这样安排。担心看不清时，可咨询验配人员选择度数泳镜，并带备用框架眼镜。即使戴普通泳镜，也按游泳前摘镜处理。镜片意外沾水后尽快摘下，日抛丢弃，可重复使用的镜片按护理要求清洁并消毒过夜后再戴。镜片和镜盒都不用自来水清洗或存放。"],["成本","可能需要购买度数泳镜，并提前安排摘戴、存放眼镜的位置。"],["说人话","把看清泳道的任务交给度数泳镜，让隐形眼镜留在水外。"],["收益","水可能使软镜变形、黏附并擦伤角膜，也可能带入致病微生物。避免镜片接触水有助于降低眼部感染风险，严重角膜感染可能影响视力。"],["证据等级","C（CDC 隐形眼镜护理与感染预防指导，依据为接触水时的护理和求医建议）。"],["适用与备注","出现红眼、眼痛、怕光或突然视物模糊，摘镜并立即联系眼科，按医生建议再恢复佩戴。已经沾水又不舒服时，不等到消毒过夜后自行试戴。开始游泳的训练安排见[分段游泳](../aerobic-training/02-everyday-cardio.md#q425)。"],["来源","CDC 隐形眼镜与水接触指导的镜片沾水处理、度数泳镜建议，以及相关角膜感染的症状和求助说明。 [让隐形眼镜远离水](https://www.cdc.gov/contact-lenses/about/healthy-habits-keeping-water-away-from-contact-lenses.html) · [眼部感染症状与处理](https://www.cdc.gov/contact-lenses/causes/index.html)"]],"path":"book/training-health/10-more-reader-questions.md","aliases":"","grades":["C"]},{"id":457,"qid":"Q457","section":"健康","chapter":"训练相关健康","question":"献全血当天感觉正常，还能跑步或练力量吗？","title":"献全血当天安排休息，把跑步和力量训练另择时间","fields":[["怎么做","预约献全血时，把当天训练移开。献后先按采血点要求留观、休息和吃喝，当天避免剧烈运动及提重物，尤其别让献血侧手臂负重。至少把训练放到次日再考虑，并遵守采血点给出的更具体要求。恢复时先看有无头晕、异常疲劳和穿刺处出血，再从轻活动观察反应。"],["成本","需要调整一次训练时间，重要比赛前预留安排献血和恢复的余地。"],["说人话","献完血当时感觉不错，也先把今天的训练空出来。"],["收益","献血机构建议当天避免剧烈运动和提重物，以减少头晕、晕厥和穿刺处再出血的风险。恢复活动与恢复原有运动表现所需时间可能不同。"],["证据等级","C（献血机构的献后照护指导。次日是重新评估活动的时间点，恢复程度仍需看症状及个人情况）。"],["适用与备注","适用于通过献血评估、献全血后的成人。头晕或快晕时立即停下，坐下或躺下休息。症状持续或反复、穿刺处出血不止时联系采血机构或就医。长期疲劳、耐力下降或经常献血，向医生说明情况，参见[缺铁评估](../06-training-health.md#q38)。"],["来源","美国红十字会献血后注意事项，英国 NHS 献血服务的献后照护和运动问答。 [献血前后注意事项](https://www.redcrossblood.org/donate-blood/blood-donation-process/before-during-after.html) · [NHS 献后照护](https://www.blood.co.uk/the-donation-process/after-your-donation/) · [运动与献血问答](https://www.blood.co.uk/who-can-give-blood/why-men-should-donate-blood/)"]],"path":"book/training-health/10-more-reader-questions.md","aliases":"","grades":["C"]},{"id":458,"qid":"Q458","section":"健康","chapter":"训练相关健康","question":"正常经期需要停跑，或按月经周期统一调整训练吗？","title":"经期按当天状态安排训练，用个人记录决定是否减量","fields":[["怎么做","月经按平时规律到来、没有明显不适时，可以继续原有活动。开始前看看疼痛、疲劳和睡眠，轻松热身后再决定是否按原计划练。感觉更吃力时，可缩短时间、降低强度或改走路，也可以休息。记录经期日期、症状和同类训练的体感，经过几个周期再看自己是否有稳定规律。"],["成本","在原有训练日志加几项记录即可，已有日历也能用。"],["说人话","经期可以运动。今天舒服就照常，难受就调整，用自己的反应安排课表。"],["收益","既能在状态允许时保持活动，也给不舒服的日子留出调整空间。现有研究发现的平均表现差异很小，个人记录比统一按周期分配强弱课更有实际参考价值。"],["证据等级","B（2020 年系统综述与荟萃分析。纳入研究整体质量较低、差异较大，研究对象为月经规律的女性，不支持统一按周期阶段排课）。C（经期可以活动及记录体感，参考公共卫生机构说明）。"],["适用与备注","经量大或经痛反复影响生活、训练时，见 [Q371](07-energy-and-physiology.md#q371)。月经明显变少、变乱或停经时，应按 [Q40](../06-training-health.md#q40)评估，并一并回顾[进食与训练负担](../06-training-health.md#q37)。使用激素避孕药、有妇科疾病或已有活动限制者，结合个人情况与医疗建议调整。"],["来源","美国卫生与公众服务部女性健康办公室关于经期活动与记录体感的说明，McNulty 等关于月经周期与运动表现的系统综述结论。 [公共卫生说明](https://womenshealth.gov/getting-active/physical-activity-menstrual-cycle) · [系统综述全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC7497427/)"]],"path":"book/training-health/11-more-reader-questions.md","aliases":"经期运动 生理期跑步","grades":["B","C"]},{"id":459,"qid":"Q459","section":"健康","chapter":"训练相关健康","question":"跑步时流鼻血该怎样止血，多久能继续训练，反复发生要就医吗？","title":"运动中流鼻血先停下前倾压鼻，止住后一天内避开剧烈活动","fields":[["怎么做","停止运动，坐下并让头和身体稍向前倾。用手持续捏住鼻孔上方的柔软部分 10–15 分钟，张口呼吸，计时期间保持压迫。止血后 24 小时避免剧烈运动和提重物，也先避免擤鼻、抠鼻、热饮和酒精。之后根据是否再出血和身体状态恢复活动，接受过填塞或其他治疗时按医生安排。"],["成本","用手机计时，找安全位置坐下。反复发作时记下次数、持续时间、是否与运动有关，以及正在使用的药物。"],["说人话","先停下，身体往前，捏住鼻子软的地方。止住后给它一天恢复时间。"],["收益","持续局部压迫有助于止血，暂停剧烈活动可减少很快再次出血的机会。记录反复发作的情况有助于就诊评估。"],["证据等级","C（英国 NHS 鼻出血自救、就医与止血后活动指导。24 小时是一般护理建议，治疗后的限制按具体医嘱）。"],["适用与备注","压迫 10–15 分钟后仍出血，或出血很多、吞入大量血后呕吐、头部受撞后出血、感到虚弱头晕或呼吸困难，应及时去急诊。不要自行驾车。反复鼻出血、正在用抗凝药或有凝血障碍时，联系医生评估，勿自行停药。伴快晕倒或异常气短时也见 [运动急症](06-emergencies-and-weather.md#q353)。"],["来源","英国 NHS「Nosebleed」的止血方法、急诊信号、反复出血就医和止血后 24 小时注意事项。 [NHS 原文](https://www.nhs.uk/conditions/nosebleed/)"]],"path":"book/training-health/11-more-reader-questions.md","aliases":"","grades":["C"]},{"id":460,"qid":"Q460","section":"健康","chapter":"常见慢病与运动","question":"高度近视被医生提醒别举太重，怎样确认自己能做哪些力量训练？","title":"高度近视被提醒少提重物，把具体动作带去眼科确认","fields":[["怎么做","先遵守眼科已有的活动限制，带近期眼底检查结果和训练清单复诊。写清动作、重量、次数，是否憋气发力或接近力竭，以及是否有碰撞、跳跃。请医生说明限制针对哪些眼底变化，哪些活动可以继续、哪些需要暂停，何时复查。尚未明确眼底情况时，询问是否需要散瞳检查，再把确认后的限制交给教练调整计划。"],["成本","整理现有检查报告和训练记录。检查、复诊和是否转视网膜专科由眼科安排。"],["说人话","把“别练太重”问成具体动作和具体限制，之后才好安排训练。"],["收益","眼底检查有助于发现视网膜裂孔或其他改变。结合检查结果沟通活动限制，比单凭眼镜度数或某次训练的感觉更能帮助制定个人计划。"],["证据等级","C（美国国家眼科研究所与英国皇家盲人协会的风险、检查和就医说明。这些资料没有给出适用于所有高度近视者的安全公斤数）。"],["适用与备注","高度近视者的视网膜脱离风险较高，但并非都有病理性眼底改变。曾有视网膜裂孔、脱离或眼部手术者，应核对专门的活动要求。突然出现很多新飞蚊、闪光或幕布样黑影时，立即停止活动并去眼科急诊或急诊，及时检查能保护视力。术后恢复活动也可参考[与治疗团队确认限制](../training-health/03-recovery.md#q316)。"],["来源","美国国家眼科研究所关于视网膜脱离的危险因素、散瞳检查与急诊症状，英国皇家盲人协会关于高度近视和病理性近视的区别。 [视网膜脱离与就医](https://www.nei.nih.gov/eye-health-information/eye-conditions-and-diseases/retinal-detachment) · [病理性近视说明](https://www.rnib.org.uk/your-eyes/eye-conditions-az/pathological-myopia/)"]],"path":"book/chronic-health/05-reader-questions.md","aliases":"","grades":["C"]},{"id":461,"qid":"Q461","section":"运动","chapter":"抗阻训练","question":"想在家练引体向上，又不想打孔，怎么判断门框单杠适不适合？","title":"门框单杠先核对安装条件，再决定是否买","fields":[["怎么做","买前找具体型号的说明书，对照门框宽度、深度、边沿形状、固定方式和限重。需要打孔时，先确认有合适的承重安装面和安装许可。免打孔款也有指定的门框条件。如果门框松动、破损，或确认不了是否匹配，改用场地里固定的单杠。只是想在家练背，可以先做弹力带或哑铃划船。"],["成本","先测量和查说明，能省下一次退货或安装返工。家里条件不合适时，可先用现有器材或附近场地。"],["说人话","能放进门框只是第一步。先看这根杆怎么固定、门框是否符合说明，拿不准就换地方或换动作。"],["收益","按具体型号核对，能提前排除门框尺寸不合、依靠松动饰条承重等安装问题。"],["证据等级","C（型号说明支持安装核对，替代训练参考抗阻训练立场）。"],["适用与备注","器材松动或门框有变化时暂停使用。目标是练到第一个引体，可接着看[引体向上的进阶](03-exercise-selection.md#q62)。"],["来源","迪卡侬门框式单杠官方问答的安装面、尺寸和损坏条件，以及 ACSM 2026 年抗阻训练立场表 6。 [型号安装说明](https://support.decathlon.co.uk/door-frame-pull-up-bar) · [ACSM 抗阻训练立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/resistance-training/09-reader-questions.md","aliases":"家里单杠 免打孔 门框 引体向上","grades":["C"]},{"id":462,"qid":"Q462","section":"运动","chapter":"抗阻训练","question":"引体向上或拉背时手先握不住，该换动作、练握力还是用助力带？","title":"拉背时握力先耗尽，分别安排拉背和握力练习","fields":[["怎么做","先看是哪种动作受限。引体做到手开始滑时结束这一组，想多练背可以改做辅助引体或减轻下拉的负荷。若是硬拉，可保留能稳握的组，必要时在熟悉的硬拉组试用助力带。想单练握力，可以在主要动作结束后加一项可重复的练习，例如用熟悉的哑铃短时间静止持握，留有余力。记录几周内能稳握的重量或时间。"],["成本","先用现有的辅助器械或哑铃。额外的握力练习也占用前臂的恢复时间。"],["说人话","手快滑开时就停组。背和握力都想练，可以分别留时间。"],["收益","一项硬拉短期试验发现，使用助力带时握力疲劳较少，受试者觉得更握得住。健康成人的手部力量训练综述也发现握力可改善。引体能否多做几次还要单独观察。"],["证据等级","B（助力带试验测当次硬拉，手部训练研究主要测握力）。C（安排和示例）。"],["适用与备注","适用于动作末段逐渐出现的握持疲劳。握力突然下降或伴持续麻木、疼痛时，暂停相关动作并评估。引体起步见[引体向上的进阶](03-exercise-selection.md#q62)。"],["来源","Jukic 等硬拉试验的握力疲劳与握持感结果，以及健康成人手部专项训练系统综述的握力结果。 [硬拉试验](https://pubmed.ncbi.nlm.nih.gov/33306977/) · [手部训练综述](https://pubmed.ncbi.nlm.nih.gov/41095962/)"]],"path":"book/resistance-training/09-reader-questions.md","aliases":"","grades":["B","C"]},{"id":463,"qid":"Q463","section":"运动","chapter":"拉伸与活动度","question":"睡前或单独做静态拉伸，身体还没活动开，需要先热身吗？","title":"单独安排静态拉伸，先做几分钟轻松活动","fields":[["怎么做","如果刚起床、坐了很久，或准备在睡前专门拉一会儿，先走动或轻松活动接下来要用的关节。梅奥诊所用 5–10 分钟的轻松步行、慢跑或骑车举例。之后慢慢进入拉伸，停在有牵拉感、仍能自然呼吸的位置。已经做完一节训练的人，也可以把拉伸接到训练后。"],["成本","多预留几分钟，或把拉伸和原本就在做的活动接在一起。"],["说人话","想单独拉伸，先活动一会儿，再从舒服的幅度开始。"],["收益","规律拉伸可以增加关节活动范围。先轻松活动再做静态拉伸是医疗机构给出的执行建议。早晚安排对长期柔韧性进步有多大差别，目前的来源未直接比较。"],["证据等级","C（梅奥诊所公众指导，用于安排静态拉伸和起始强度）。"],["适用与备注","针对健康成人单独练柔韧性的情境。临近训练或比赛时，见[运动前静态拉伸安排](01-assessment-and-warmup.md#q111)。拉伸时怎么判断强度，见[拉到什么感觉算合适](02-exercises-and-progression.md#q120)。"],["来源","梅奥诊所《Stretching: Focus on flexibility》的拉伸安全建议。 [静态拉伸前的准备](https://www.mayoclinic.org/healthy-lifestyle/fitness/in-depth/stretching/art-20047931)"]],"path":"book/mobility/03-reader-questions.md","aliases":"睡前拉伸 冷拉伸 没热身 拉伸前热身","grades":["C"]},{"id":464,"qid":"Q464","section":"运动","chapter":"有氧训练","question":"每天必须走够一万步吗，怎样定自己的步数目标？","title":"先记平时走多少，再定自己的步数目标","fields":[["怎么做","用同一部手机或手环记录几个普通工作日和休息日，看看自己平时走多少。想多动一点，可以先在通勤或午休时多走一段，习惯后再加。骑车和游泳的运动时间与强度可以另外记。"],["成本","已有计步工具就够用，也可以直接记每天走路的时间。"],["说人话","步数用来观察走路习惯。一万步可以是个人目标，起点和增加幅度可以按自己的日常活动来定。"],["收益","2025 年一项随访研究汇总发现，每天约 7000 步的人群比约 2000 步的人群全因死亡风险低。在呈现非线性关联的几种健康结局中，曲线在约 5000–7000 步附近趋缓，幅度随结局而异。这些数字来自人群观察。"],["证据等级","B（步数与健康结局的证据主要来自前瞻性队列，可能受原有健康状况等因素影响）。"],["适用与备注","计步器主要记录走路和跑步。用步数看日常走动，再用时间与强度判断有氧活动量。可接着看 [Q401 怎样开始走跑](01-getting-started.md#q401) 和 [Q421 快走怎样计入有氧](02-everyday-cardio.md#q421)。"],["来源","[Ding 等，Daily steps and health outcomes in adults，2025](https://pubmed.ncbi.nlm.nih.gov/40713949/) · [中国人群身体活动指南，2021 版](https://www.besjournal.com/en/article/doi/10.3967/bes2022.001)。"]],"path":"book/aerobic-training/05-steps-and-sitting.md","aliases":"每天走多少步 一万步 万步 10000步 1万步 计步","grades":["B"]},{"id":465,"qid":"Q465","section":"运动","chapter":"有氧训练","question":"上班一坐就是几小时，应该多久起来活动一次？","title":"把起身走动放进工作间隙","fields":[["怎么做","把起身走动放进已有的工作间隙，比如开完会、接水或打完电话时走一小段。《中国居民膳食指南（2022）》建议每小时起来活动一下。用这条提醒时，如果手头走不开，可以在下一个方便的空档走走。"],["成本","用现有的工作间隙或手机提醒即可。"],["说人话","一天里多找几次机会离开椅子。每小时可以当作提醒，最佳间隔还没有定论。"],["收益","短时试验汇总发现，用活动打断久坐后，血糖和胰岛素反应小幅降低，证据确定性低。世界卫生组织建议减少久坐，把一部分坐着的时间换成活动，轻强度活动也算。"],["证据等级","B（短时交叉试验的荟萃分析，证据确定性低）。C（两份指南提供日常做法）。"],["适用与备注","这里说的是工作中打断连续久坐。若想知道怎么把一天的有氧训练拆成小段，可看 [Q422 有氧可以分几段做吗](02-everyday-cardio.md#q422)。"],["来源","[世界卫生组织身体活动和久坐行为指南，成人章节](https://www.ncbi.nlm.nih.gov/sites/books/NBK566046/) · [中国居民膳食指南（2022）准则二](https://wjw.hubei.gov.cn/bmdt/jkhb/spyy/202205/t20220519_4134159.shtml) · [Zhuang 等，久坐中断交叉试验荟萃分析，2026](https://pmc.ncbi.nlm.nih.gov/articles/PMC13515831/)。"]],"path":"book/aerobic-training/05-steps-and-sitting.md","aliases":"打断久坐 上班久坐 办公室坐太久 多久起来 坐多久起来一次","grades":["B","C"]},{"id":466,"qid":"Q466","section":"运动","chapter":"抗阻训练","question":"史密斯机上每边加了片，训练笔记里还要把空杆重量算进去吗？","title":"先看史密斯机的起始阻力，再决定怎么记重量","fields":[["怎么做","找机器铭牌或同型号说明书里的「起始阻力」。手写记录可以直接记两侧杠铃片总重量，并注明机器和「只计片」。想记总负荷，就把查到的起始阻力加一次。例如每边各 10 公斤，两侧共 20 公斤。若型号明确标了 13.6 公斤起始阻力，就记 33.6 公斤。没查到时只记片重。"],["成本","第一次核对型号花一点时间。下次只要仍用同一台机器、同一种记法，就能接着比较。"],["说人话","每边 10 公斤，要记两边。空杆另看这台机器的标注。"],["收益","把机器和计重口径一起记下，换馆或换软件时就能看出，数字突然变大是不是多算了一根杆。"],["证据等级","C（厂家型号规格及记录工具的操作说明）。"],["适用与备注","软件若已把起始阻力单列，先看重量输入框是否只要求填片重。不同机器的数字不能直接折算成自由杠铃成绩。"],["来源","[Hammer Strength 史密斯机规格](https://www.lifefitness.com/en-us/catalog/strength-training/benches/smith-machine) · [MacroFactor 官方记录示例](https://macrofactor.com/wp-content/uploads/2026/01/Workouts-Quick-Start-Guide.pdf)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"史密斯机空杆多重 史密斯机空杆重量","grades":["C"]},{"id":467,"qid":"Q467","section":"运动","chapter":"抗阻训练","question":"深蹲到大腿接近平行时膝盖就超过脚尖，需要刻意往后收吗？","title":"深蹲时让膝盖随动作前移，脚尖线不用当限位","fields":[["怎么做","无痛、双脚踩稳的情况下，可以让膝盖自然向前。如果为了卡在脚尖后面只能把臀部很用力向后送、上身大幅前趴，先放下重量，用徒手蹲找回能平稳站起的轨迹。能控制多深就先蹲多深。"],["成本","先用一组徒手动作比较两种蹲法。侧面看一次即可观察膝盖、臀部和躯干一起怎么动。"],["说人话","不用到脚尖那条线就刹车。看整个人能否稳稳蹲下、稳稳起来。"],["收益","小型实验把膝盖挡在脚尖后方时，研究者测到膝关节力矩变小，髋关节力矩变大。限制一处会改变别处要承担的负荷。"],["证据等级","B（负重深蹲的力学实验）。C（徒手试做与选择幅度）。"],["适用与备注","实验只有 7 名有训练经验的男性，比较当下受力，没有追踪伤病。脚跟总会抬起可另看[踝背屈](../mobility/02-exercises-and-progression.md#q114)。已有疼痛或术后负重限制时按个人康复安排。"],["来源","[Fry 等的深蹲膝位实验](https://pubmed.ncbi.nlm.nih.gov/14636100/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"深蹲膝盖可以超过脚尖吗 深蹲膝盖能超过脚尖吗","grades":["B","C"]},{"id":468,"qid":"Q468","section":"运动","chapter":"抗阻训练","question":"双手摆壶铃是不是像纵跳一样向上蹬？脚和髋该怎么动？","title":"摆壶铃时双脚踩稳，用快速伸髋带起壶铃","fields":[["怎么做","先空手站稳，膝微屈，把臀部往后送，上身随髋折叠，再伸髋站直。能控制这个动作后，先用壶铃慢做髋部屈伸，再试做几次双手摆动。后摆时壶铃从两腿之间通过，向前时靠髋伸直产生动量，手握牢把手、顺势引导壶铃。双脚始终留在地面。"],["成本","需要能稳握的壶铃和前后无遮挡的空间。先练慢动作，能掌握回摆和停铃后再连续做。"],["说人话","脚踩地，屁股后送，再站直。让铃摆出去，不用把自己弹起来。"],["收益","把伸髋和手臂引导分开练，能检查自己是不是在用肩膀把铃硬举到某个高度。"],["证据等级","C（专业机构的动作教学与分步练习）。"],["适用与备注","这里讲的是铃到胸肩附近的髋主导双手摆动。若要后仰、踮脚或走一步才能稳住，先减轻或慢下来。收势时减小摆幅再稳稳放下。"],["来源","[ACE 双手壶铃摆动教学](https://www.acefitness.org/continuing-education/certified/january-2025/8788/the-ace-do-it-better-series-the-two-handed-kettlebell-swing/) · [NSCA 双手摆动动作说明](https://www.nsca.com/education/articles/kinetic-select/two-arm-kettlebell-swing/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["C"]},{"id":469,"qid":"Q469","section":"运动","chapter":"抗阻训练","question":"深蹲、硬拉开始加不动重量了，是不是到该用举重腰带的时候了？","title":"把举重腰带当作可选器材，单独判断加重是否合适","fields":[["怎么做","先按原来的重量、次数和动作质量判断是否真遇到停滞。能稳定完成的普通训练组可以照常做。有重负荷训练目标、也想了解腰带的作用，可以先借一条，在能从容控制的重量下熟悉腰带贴合和腹部撑住的感觉。第一次试用时保留原负重，把是否佩戴记在日志里。"],["成本","借用合适尺寸便能试感觉。腰带的松紧和位置需要花时间适应，买一条并不会解决每节训练都加不动的问题。"],["说人话","今天没加上重量，不是自动买腰带的信号。先用熟悉的重量认识这件器材。"],["收益","在一次重硬拉实验中，戴腰带时腹压上升更早、峰值更高；这解释了为什么动作可能感觉不同。"],["证据等级","B（小样本当次硬拉实验）。C（试用和记录建议）。"],["适用与备注","研究没有给出应从多少公斤开始戴，也没有长期观察受伤率。若因腰背痛想用腰带硬顶，先停止诱发疼痛的组；持续疼痛另作评估。 相关警示症状见[深蹲或硬拉后腰痛](../training-health/05-injuries-and-return.md#q342)。"],["来源","[Harman 等的举重腰带与腹压实验](https://pubmed.ncbi.nlm.nih.gov/2709981/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":470,"qid":"Q470","section":"运动","chapter":"抗阻训练","question":"为了长肌肉和力量，需要按激素变化特意选在早晨或傍晚举铁吗？","title":"晨练和傍晚练都能增肌，先选能固定下来的时段","fields":[["怎么做","对照自己一周的空档，把力量课放到能按计划完成的时段。若两个时间都方便，分几次记下能否准时开始、相同重量下完成了几次、练后是否影响睡眠。要比较几周前后的力量，尽量在相近的钟点、用相似的热身再测。"],["成本","调整训练时段可能牵动通勤、用餐和睡眠。若清晨起床要少睡一截，可另看[晨练和睡眠](../training-health/02-sleep.md#q303)。"],["说人话","只有早上的空档就早上练。不用等到某个「激素最合适」的钟点才举铁。"],["收益","早、晚抗阻研究的合并结果显示，经过训练，两组平均力量和肌肉大小的增长相近。个别时段当下能举多少，与几个月后能练出多少，是两个指标。"],["证据等级","B（分时段抗阻训练的对照研究与荟萃分析）。C（排班和复测建议）。"],["适用与备注","证据主要比较常规日间时段，不能据此给夜班、严重缺觉或赛前倒时差的人规定最佳钟点。"],["来源","[Grgic 等的早晚抗阻训练荟萃分析](https://pubmed.ncbi.nlm.nih.gov/30704301/) · [Sedliak 等的分时段训练试验](https://pubmed.ncbi.nlm.nih.gov/19910830/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":471,"qid":"Q471","section":"运动","chapter":"抗阻训练","question":"同一套动作还在进步，也要每隔几个月全部换掉才能继续增肌吗？","title":"动作还合用时可以保留，想换就说清要改变什么","fields":[["怎么做","先圈出用来跟踪进步的动作。若还做得舒服、重量或次数在进步，也覆盖了想练的部位，可以继续做。若为了练到另一角度或减少厌倦，可先替换一个辅助动作，保留其余动作；新动作单独记起始重量，给自己几次熟悉的机会。"],["成本","换动作会花时间重新调器械、学动作和找负重。一回只换一项更容易看出是否喜欢、是否值得留。"],["说人话","还有进步就能继续练。想把平板推换成上斜推，可以换，但给新动作另开一行记录。"],["收益","一项 8 周试验中，固定动作和每次随机变换的训练者在主要力量和多项肌肉厚度指标上进步相近，变换组对训练更有兴趣。"],["证据等级","B（训练试验及系统综述，样本主要是年轻男性）。C（逐项更换和记录）。"],["适用与备注","有计划地换动作可能改变哪些部位得到更多训练。研究未给出所有动作必须更换的固定周期，也没有观察同一套动作练几年的效果。"],["来源","[Baz-Valle 等的固定与随机换动作试验](https://pubmed.ncbi.nlm.nih.gov/31881066/) · [Kassiano 等的动作变化综述](https://pubmed.ncbi.nlm.nih.gov/35438660/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":472,"qid":"Q472","section":"运动","chapter":"抗阻训练","question":"增肌时值得做递减组吗？做完立刻减重接着练，比正常休息再做强在哪？","title":"想缩短一项练习的时间，可以试递减组","fields":[["怎么做","递减组指同一动作做到接近做不动时，立即降低负荷，再做一段。若时间紧，挑一项熟练、能安全放回且方便换重量的动作，例如插销器械上的臂屈伸。先试着用一次递减组替换原计划末尾的一部分常规组，把前后两档的重量和次数分别记下。时间够用、现有组数练得顺时，可以继续常规组。"],["成本","一次练习可能省下组间休息时间，但当下通常觉得更累。需要慢慢卸片或请人保护的动作，换重就没那么方便。"],["说人话","没多少时间，可以做完一档马上换轻一点再做。更累的感觉不能用来预测会多长多少肌肉。"],["收益","比较递减组和常规组的研究中，两种练法都能增肌，合并结果未见明确的增肌优势。部分试验中递减组完成对应训练花的时间较短。"],["证据等级","B（短期训练研究与荟萃分析）。C（在熟悉器械上替换的示例）。"],["适用与备注","这里的「省时」指所比较的那段练习。连续降重几档不能直接按几组标准工作组换算。疲劳已让动作走样时就结束。"],["来源","[递减组训练与肌肉大小综述](https://pubmed.ncbi.nlm.nih.gov/37523092/) · [急性用力感与长期效果综述](https://pubmed.ncbi.nlm.nih.gov/41920484/) · [Fink 等的训练试验](https://pubmed.ncbi.nlm.nih.gov/28474868/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":473,"qid":"Q473","section":"运动","chapter":"抗阻训练","question":"更想练上胸，平板卧推要换成上斜卧推吗？两种都要练吗？","title":"上胸是优先目标时，可以把一部分推举留给上斜卧推","fields":[["怎么做","如果主要想增加胸部靠近锁骨处的肌肉厚度，可以把现有的一些卧推组改成上斜卧推，先从能稳定控制的重量开始。如果更在意平板卧推成绩，就保留平板的练习机会。每次都用相同的凳子档位，并把两种卧推分开记录。"],["成本","改角度要重新找工作重量。可以用原有的组数尝试，不必为了两个角度额外加一轮练习。"],["说人话","想优先练上胸，可以选上斜。有平板卧推目标，就给平板也留些位置。"],["收益","一项等组数的 8 周试验发现，上斜组胸大肌靠上的一个测点增厚更多。三个测点中只有这一处有明确组间差异。"],["证据等级","B（初练男性对照试验；有前后肌厚数据的共 30 人，每组 10 人）。C（组数和日志安排）。"],["适用与备注","研究比较平板、上斜及两者组合，没有比较所有凳子角度。一个测点的变化不能预测胸部整体外形，也不能定出人人都该用的倾角。"],["来源","[Chaves 等的平板、上斜及组合卧推试验](https://pubmed.ncbi.nlm.nih.gov/32922646/) · [期刊全文，分析人数见第 4 页](https://intjexersci.com/files/ijes/vol13/iss6/12.pdf#page=4)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":474,"qid":"Q474","section":"运动","chapter":"抗阻训练","question":"想把俯卧撑练强，一天的几组能在不同空档做，还是要一次连着做完？","title":"俯卧撑可以分时段做，先把当天总量和单组难度对齐","fields":[["怎么做","若原计划是当天做三组，可以上午一组、下午两组；每组仍使用同样的支撑高度和动作幅度，做到原本准备结束的位置。先按这个办法完成原计划，再看是否更容易坚持。如果目标是一次连续做更多个，另外记录相同条件下一组能做多少。"],["成本","每次只需留一小段空档，也需要每次都找得到稳固的支撑。可用手机勾掉已做的组数，免得随手又多加几组。"],["说人话","早上做十个、下午做十个，都能记进当天的训练。它们不能当作一次连续做了二十个。"],["收益","一项 8 周研究把有经验男性同一肌群的训练集中或分成一天两次，两组上肢力量和肌厚的改变量无明显差别。拆开练是可以尝试的时间安排。"],["证据等级","B（一天一练与两练的抗阻试验）。C（外推到日常俯卧撑的安排）。"],["适用与备注","研究测的是卧推等项目，没有直接检验在家零散做几组俯卧撑，或一天分成任意多段的效果。拆分前后若重量、组数或完成程度都变了，就很难单看时段的影响。"],["来源","[有训练经验男性每日一次与两次训练试验](https://pubmed.ncbi.nlm.nih.gov/33634677/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":475,"qid":"Q475","section":"运动","chapter":"抗阻训练","question":"只想减肚子上的脂肪，卷腹又比快走难，还值得天天做吗？","title":"把卷腹当作练腹肌的动作，减腰围另看整体安排","fields":[["怎么做","若想让腹肌更耐用，可留下能轻松排进训练的一项卷腹，记录动作标准一致时能做几次。若唯一目的是缩小腰围，没必要把每天的快走或全身训练换成大量卷腹。保留愿意持续做的活动，同时回顾吃喝与一段时间的腰围变化。"],["成本","高次数腹部练习也占训练时间。将卷腹表现和腰围分开记录，就能判断自己花的时间究竟改善了哪件事。"],["说人话","卷腹能练腹肌。想看肚子有没有变小，用同样的方法量腰围，比数今天又卷了多少次更直接。"],["收益","一项 6 周腹部训练试验提高了卷腹次数，却没有观察到腰围或腹部脂肪指标的显著改善。另一项小试验用跑步配合长时间负重转体、卷腹，发现躯干脂肪下降更多，不能照搬到日常几组卷腹。"],["证据等级","B（训练内容和人群不同的两项小型随机研究）。C（日常选择）。"],["适用与备注","腰围包括多种组织和腹部内容物，只适合看一段时间的趋势。想同时调整活动和饮食，可看[减脂的可执行起点](../training-nutrition/02-weight-management.md#q231)。"],["来源","[Vispute 等的腹部训练试验](https://pubmed.ncbi.nlm.nih.gov/21804427/) · [跑步配合腹部耐力训练的试验](https://pubmed.ncbi.nlm.nih.gov/38010201/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"卷腹能减肚子吗","grades":["B","C"]},{"id":476,"qid":"Q476","section":"运动","chapter":"抗阻训练","question":"想让上臂后侧的肱三头肌长头更发达，绳索下压和过顶臂屈伸选哪个？","title":"肩能舒适举过头时，可用过顶臂屈伸训练肱三头肌长头","fields":[["怎么做","先试能否舒服地让上臂在头旁保持稳定、屈伸肘部。可以就选较轻的绳索，从能平稳控制的幅度开始。若举高手臂很别扭，肘贴近体侧做绳索下压也能训练这块肌肉。把两种动作的重量分开记，不必追求相同的插销档位。"],["成本","两种动作可用同一套绳索器械。过顶动作的初始位置和负重需要重新找，能用的公斤数可能较低。"],["说人话","过顶时用得轻一点很正常。想练长头可以试过顶，体侧下压也能让它增长。"],["收益","研究让同一批人一侧手臂做过顶伸肘、另一侧在体侧伸肘。12 周后两侧肱三头肌体积都增加，过顶侧长头及整块肱三头肌增加更多。"],["证据等级","B（小样本、同人双臂对照的绳索训练试验）。C（选择与起始重量建议）。"],["适用与备注","这是对绳索伸肘的直接比较，不能据此给所有哑铃动作排名，也不要求肩或肘疼痛时硬做过顶动作。"],["来源","[Maeo 等的过顶与体侧绳索伸肘试验](https://pubmed.ncbi.nlm.nih.gov/35819335/)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":477,"qid":"Q477","section":"运动","chapter":"抗阻训练","question":"不喜欢杠铃臀推，想把臀大肌练大，可以用深蹲替它吗？","title":"想练臀大肌，可以选自己做得稳的深蹲","fields":[["怎么做","若臀推架设麻烦、姿势难受，或每次都不愿做，可以换成能舒适控制的深蹲，从熟悉的难度开始。保留原计划中相应的下肢训练位置，为深蹲另找负重。若目标是提高臀推这一动作的成绩，再保留臀推练习。"],["成本","换成深蹲可以省去布置长凳和垫杠的时间，却要重新熟悉蹲法，大腿也会参与训练。"],["说人话","练臀不用把臀推列为必做项。深蹲同样能练到臀大肌，也会带上大腿。"],["收益","一项 9 周试验让初练者做等组数的杠铃深蹲或臀推，两组臀大肌测点的增长相近。深蹲组的股四头肌和内收肌增长更多。"],["证据等级","B（初练年轻人的短期随机对照研究，研究为回顾性注册）。C（动作替换）。"],["适用与备注","试验使用受监督的负重深蹲，未证明任意轻松的徒手蹲都有同样效果。有持续腰背痛时，先停下会诱发痛的动作，不用反复换重动作来试痛。 症状处理见[负重训练后的腰痛](../training-health/05-injuries-and-return.md#q342)。"],["来源","[Plotkin 等的深蹲与臀推训练试验](https://pubmed.ncbi.nlm.nih.gov/37877099/) · [期刊对经费、利益披露与注册的勘误](https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2026.1987823/full)"]],"path":"book/resistance-training/10-equipment-programming-and-goals.md","aliases":"","grades":["B","C"]},{"id":478,"qid":"Q478","section":"运动","chapter":"有氧训练","question":"成年人刚学骑车，双脚一离地就晃，什么时候开始踩踏？","title":"先学会在平地滑行和停车，再接上第二只脚","fields":[["怎么做","找平坦、无车流的空地。检查刹车能用，把坐垫暂时调到坐着双脚能稳稳触地。先跨坐着用脚走、抬脚滑行，眼看前方，练到想停时能用刹车停稳。然后用一只脚撑地，另一侧脚踏调到前上方，松刹车并向下踩，车往前走后再把撑地脚放上另一只脚踏。"],["成本","借一辆大小合适的车即可。有人陪练时，可以请对方扶稳起步，等自己能掌握平衡再放手。"],["说人话","每次找第二个脚踏就晃，先放下脚，从推地滑行重新练。"],["收益","把平衡、停车和踩踏分开，比较容易看出自己究竟卡在哪一步。"],["证据等级","C（骑行组织的成人入门教学，进阶看动作掌握程度）。"],["适用与备注","这个低座高供初学滑行用。能稳定踩踏后再调到合适骑行高度，在空场练熟转向和停车再进入车流。"],["来源","[Cycling UK，成年人学骑车的十个步骤](https://www.cyclinguk.org/teaching-adults)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":479,"qid":"Q479","section":"运动","chapter":"有氧训练","question":"自行车有前后两把刹车，平时停车该用哪一把？","title":"双手逐渐捏紧刹把，在直线上练习停稳","fields":[["怎么做","先推着车分别捏两把刹车，弄清哪一把管前轮、哪一把管后轮。直线低速骑近预选停车点时，双手同时开始刹，逐渐加力，眼看前方。需要更快停下时，身体略向后移，仍要平顺加力。停车后再落脚。"],["成本","在平坦干燥、没有行人车流的地方练习，同一辆车先从较慢速度开始。"],["说人话","把两边刹把当作能调节的旋钮。一下捏死前刹可能让后轮抬起，只猛捏后刹又容易打滑。"],["收益","能用两只手平稳地控制减速，也更熟悉自己的车需要多长距离停下。"],["证据等级","C（Bikeability 骑行培训手册中的停车操作指导）。"],["适用与备注","适用于有前、后两套手刹的普通自行车。刹把左右配置可能不同。发现任一刹车失灵，先修车。"],["来源","[Bikeability，《Ride Guide》](https://www.bikeability.org.uk/wp-content/uploads/2024/06/Ride_Guide_V10.pdf)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"自行车前刹还是后刹 前刹和后刹怎么用","grades":["C"]},{"id":480,"qid":"Q480","section":"运动","chapter":"有氧训练","question":"骑车拐急弯，哪边脚踏要抬起来，什么时候减速？","title":"进弯前减速，滑过弯心时抬高内侧脚踏","fields":[["怎么做","进弯之前先看路线，把速度降到能在自己车道内平稳通过。滑过弯道时暂停踩踏，内侧脚踏抬高、外侧脚踏放低，视线朝出口。右转就抬右脚，左转就抬左脚。回正后再恢复踩踏。"],["成本","找无车、视线好的宽弯，在低速下左右各练。"],["说人话","哪边弯，哪边脚就抬高，给靠近地面的一侧留空间。"],["收益","自行车倾向弯内时，能给内侧脚踏留出离地间隙，减少脚踏擦地的机会。"],["证据等级","C（Bikeability 对可滑行双轮车的过弯技巧说明）。"],["适用与备注","适用于普通可滑行的双轮车。固定齿轮车无法停止踩踏，三轮车过弯时的平衡方式也不同。"],["来源","[Bikeability，《Ride Guide》](https://www.bikeability.org.uk/wp-content/uploads/2024/06/Ride_Guide_V10.pdf)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":481,"qid":"Q481","section":"运动","chapter":"有氧训练","question":"第一次跟车队骑行，和前车怎么排位置、怎么提醒后车？","title":"先听领骑约定，跟车时给自己留出反应距离","fields":[["怎么做","选标明适合新人的队伍，出发前问清速度、途中在哪里等人、怎样传递减速或路障信号。跟在前车后面，确保自己的前轮始终落在对方后轮之后。眼睛越过前车看路，保持自己的行进线。需要减速时，尽早提示后车再平顺减速。"],["成本","先和领骑打招呼说明是第一次。自己无法既控稳车又打手势时，用大家事先约好的喊话。"],["说人话","即使略微错开，也别让前轮伸到前车后轮旁边。前车一横移，两只轮子就可能相碰。"],["收益","后车更容易预判你的动作，你也能早一点看到队伍前方的变化。"],["证据等级","C（Cycling UK 的集体骑行组织与控车建议）。"],["适用与备注","初次跟骑不必追求紧贴前车省力。看不清前方、跟不上或没听懂口令时，拉开距离并告诉领骑。"],["来源","[Cycling UK，初次参加车队骑行](https://www.cyclinguk.org/article/beginners-guide-cycling-group)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":482,"qid":"Q482","section":"运动","chapter":"有氧训练","question":"自由泳夹浮漂就轻松，拿掉腿就沉，该先调哪里？","title":"先从侧面看头、髋和脚的位置，再调整身体在水里的姿态","fields":[["怎么做","在有救生员的泳池，用轻松速度游一小段自由泳，请教练从侧面看头是否一直抬着、髋和脚跟从哪里开始下沉。再试一次，让颈部放松、目光往池底方向，保持身体伸长并正常换气。对比两次髋腿位置和用力感，再决定是否要改打腿。"],["成本","利用一次普通泳池练习即可。已有夹腿浮漂可以用来对照，有教练在池边直接观察也行。"],["说人话","夹上浮漂就省力，给了你一个检查身体姿态的线索。先看看自己是不是抬着头、拖着腿在游。"],["收益","有助于分清是身体斜着增加阻力，还是单独的打腿动作需要练。"],["证据等级","C（美国成人游泳协会教练的姿态观察与练习建议，浮漂对比不能单独确定原因）。"],["适用与备注","适合已会换气和短距离自由泳的人。沉腿程度因人而异，以自己呼吸自如、身体平顺的头位为准。"],["来源","[美国成人游泳协会，判断与调整沉髋沉腿](https://www.usms.org/fitness-and-training/articles-and-videos/articles/how-to-tell-if-your-feet-and-hips-are-sinking-while-youre-swimming-and-how-to-fix-it) · [美国成人游泳协会，自由泳头位](https://www.usms.org/fitness-and-training/articles-and-videos/articles/how-to-find-your-proper-head-position-in-freestyle-and-backstroke)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":483,"qid":"Q483","section":"运动","chapter":"有氧训练","question":"抱浮板打腿几乎不往前走，该怎样改动作？","title":"让大腿带动小腿和脚背，在水面附近小幅交替打腿","fields":[["怎么做","在有救生员的泳池，先在能站稳的浅水区扶边练自由泳打腿。双腿交替，动作从髋部开始，膝盖自然跟着微弯，脚踝放松，让脚背在水面附近向下打。再拿浮板试一小段，留意膝盖是否大幅收向肚子，或双脚总是踢出水面。"],["成本","可以借泳池的浮板。让教练从侧面看看动作，常比一个人反复加大力气更容易找到问题。"],["说人话","像蹬自行车那样先屈膝、再向后蹬，水花可能很大，人却留在原地。把动作缩小，从大腿带起。"],["收益","更容易练到向前推进的打腿动作，也便于把同样的小幅动作带回完整自由泳。"],["证据等级","C（美国成人游泳协会自由泳打腿技术指南，属于教练指导）。"],["适用与备注","这项练习关注单练腿时能否前进。只在完整泳姿中髋腿下沉，可先看 [Q482](#q482)。"],["来源","[美国成人游泳协会，自由泳打腿教学](https://www.usms.org/fitness-and-training/guides/freestyle/kick)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"浮板打腿不前进 打腿板不前进 自由泳打腿不走","grades":["C"]},{"id":484,"qid":"Q484","section":"运动","chapter":"有氧训练","question":"游自由泳健身，每次到池边都得翻滚转身吗？","title":"可以先用手触壁转身，把下一个来回接起来","fields":[["怎么做","自由泳往返健身可以用手触壁转身。靠近池壁时看清位置，伸手触壁，屈膝把双脚收向墙面，转到要游回去的方向，双臂向前伸直，确认前方无人才轻蹬出发。可先在不挡人的池壁单练触壁、收腿和蹬回，再接到一个来回中。"],["成本","只需要泳池边的一小段空位。空间不足时等一趟，或请教练示范。"],["说人话","到头后手碰墙、脚蹬墙，就能往回游。健身时可以一直用这种转身。"],["收益","还不会翻滚也能连续往返，转身练习不会打断整堂游泳课。"],["证据等级","C（美国成人游泳协会列出的转身选项和动作要领）。"],["适用与备注","适用于已会自由泳的休闲泳者。用轻蹬熟悉方向即可。各种泳姿的比赛触壁规则另有规定。"],["来源","[美国成人游泳协会，触壁转身](https://www.usms.org/fitness-and-training/guides/turns/open-turns) · [美国成人游泳协会，泳课术语与计时](https://www.usms.org/fitness-and-training/guides/swimming-101/adult-swim-training)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":485,"qid":"Q485","section":"运动","chapter":"有氧训练","question":"泳课写着每 100 米「2 分钟包干」，到底能休息多久？","title":"把游完和休息都算进两次出发之间的时间","fields":[["怎么做","先找课表写的是「每隔多久出发」还是「每趟完成后休息多久」。例如 4×100 米、每 2 分钟出发，可在 0:00、2:00、4:00、6:00 蹬壁。第一趟游 1 分 45 秒，离第二次出发就剩 15 秒。若写的是「休息 20 秒」，则从每次触壁开始另数 20 秒。"],["成本","看泳池挂钟即可，先记住下一趟几点几秒出发。"],["说人话","「2 分钟包干」把游和歇都装进了两分钟。越早到边，这趟留下的休息就越多。"],["收益","能按课表规定的密度练习，也能识别给自己的间隔是否太紧。"],["证据等级","C（美国成人游泳协会的课表记法，时间为按定义换算的例子）。"],["适用与备注","有些课表单列目标配速，须看原注释。每趟都刚到就得走、与本课要求不符时，自练可放宽出发间隔，跟班则与教练确认合适泳组。"],["来源","[美国成人游泳协会，泳课术语与计时](https://www.usms.org/fitness-and-training/guides/swimming-101/adult-swim-training)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":486,"qid":"Q486","section":"运动","chapter":"有氧训练","question":"离开泳池黑线就游成之字形，怎样在开放水域认方向？","title":"认准下一处浮标，短暂向前看，再转头换气","fields":[["怎么做","下水前先从岸上认清线路和下一处浮标，必要时找与它同方向且显眼的固定地标。游进中把眼睛短暂抬出水面确认方向，随即转向侧方吸气，恢复划水。如果偏离目标就小幅修正并尽早再看一次。先在泳池用池端固定物熟悉这套动作。"],["成本","到有明确路线、有人看护的开放水域参加有组织练习，与同伴同行。池内练习无需额外装备。"],["说人话","池底没有黑线，就在前面找一个看得见的目标。抬眼看方向，转头再吸气。"],["收益","能及时察觉偏航，减少一路游到目标侧方才回头补路的情况。"],["证据等级","C（美国成人游泳协会的观察方向、结伴和组织练习指南）。"],["适用与备注","适合已能稳定连续游泳、准备参加开放水域活动的人。能见度变差、辨不清路线时，停下来向现场人员示意。别跟着前一个人的脚盲游。"],["来源","[美国成人游泳协会，泳池与开放水域自由泳的区别](https://www.usms.org/fitness-and-training/articles-and-videos/articles/how-to-swim-freestyle-in-the-pool-or-open-water) · [美国成人游泳协会，开放水域的观察与结伴练习](https://www.usms.org/fitness-and-training/articles-and-videos/articles/how-to-swim-in-wavy-open-water-conditions) · [美国成人游泳协会，开放水域集体训练组织指南](https://www.usms.org/open-water-central/clinic-and-practice-management/guide-to-running-an-open-water-swim-practice)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":487,"qid":"Q487","section":"运动","chapter":"有氧训练","question":"划船机的脚托该放第几孔，能按身高来选吗？","title":"用前脚掌最宽处对准绑带，再检查起桨时是否舒服","fields":[["怎么做","在可调脚托的 RowErg 上，穿平时训练的鞋，松开绑带、上下移动左右脚托，再确认脚托已卡好。把绑带对准前脚掌最宽处，收紧到脚能固定。轻划几次，看回到前端时能否舒服屈腿，蹬出时把手是否能平顺越过膝部。若不顺，停下后只改一格再试。"],["成本","用器械自带的脚托和绑带即可。固定使用同一台机时，可以记下适合这双鞋的孔位。"],["说人话","先找脚掌最宽的地方，再找孔位。同样的孔号穿另一双鞋可能就不合适。"],["收益","让脚蹬得稳定，并可把脚托高度不合与划动顺序问题分开。"],["证据等级","C（Concept2 对自家 RowErg 的设置说明，其他脚踏结构需按机型核实）。"],["适用与备注","脚大小、小腿长度和鞋跟厚度都会改变起点。不同厂家孔号不通用，以本机说明和实际落带位置为准。"],["来源","[Concept2，RowErg 脚托调节说明](https://www.concept2.com/blog/find-your-optimal-foot-position-on-the-rowerg)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":488,"qid":"Q488","section":"运动","chapter":"有氧训练","question":"划船机上的每 500 米配速怎么看，数字变小代表什么？","title":"先读每 500 米用时，再把它和桨频分开看","fields":[["怎么做","找到显示屏上写有「/500 m」的栏。这是按当前速度划完 500 米预计要花的时间。2:20/500 米比 2:30/500 米快。若全程平均保持前一个配速，1000 米约用 4 分 40 秒。「s/m」或「spm」则是每分钟划多少桨。比较两次练习时，看同类训练的全程平均配速。"],["成本","用器械自带显示屏即可。先认清当前配速与平均配速，再决定要记录哪一个。"],["说人话","每 500 米省了几秒，就是同样距离划得更快。桨频相同，每一桨推得更有力，配速仍可能改变。"],["收益","看懂仪表的单位后，可以复现一段轻松练习的节奏，也不会把每分钟划桨次数当成配速。"],["证据等级","C（器械显示定义及距离、时间算例，未据此制定训练强度）。"],["适用与备注","适用于显示每 500 米用时的划船机。按分段查看成绩时，分段长度和标准化到每 500 米的配速可能同时出现，分别看单位。"],["来源","[Concept2，划船配速、桨频与输出](https://www.concept2.com/training/articles/how-to-go-harder)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":489,"qid":"Q489","section":"运动","chapter":"有氧训练","question":"跑道内道有人，换到外道怎样准确跑一组 400 米？","title":"从所用跑道的 400 米起跑线出发，跑到共同终点","fields":[["怎么做","先确认是标准 400 米场地，再在所用外道找标明「400 m 起点」的线。沿本跑道按规定方向跑到公共终点即完成 400 米。外道半径更大，所以起点在终点前方。每做下一组都要回到同一个错开的起点。场地线太多认不出时，请场方指认。"],["成本","通常只需查看场地图。若只安排按时间跑的间歇，也可以直接按时结束一组。"],["说人话","从外道同一条线起跑又回到原地，会超过 400 米。要量准这一组，起点与终点得用对。"],["收益","各组距离可重复，比较用时才不会把跑道长度的差别算进配速变化。"],["证据等级","C（世界田联标准场地标线图，属于场地规范与几何关系）。"],["适用与备注","只适用于有对应标线的标准室外跑道。室内短跑道和非标准校园场地需查实长。训练时遵从场方的开放跑道和使用方向。"],["来源","[世界田联，标准 400 米田径场标线图（2019）](https://worldathletics.org/download/download?filename=596848ce-6afe-4f00-8eb0-62a019ee215e.pdf&urlslug=track%2Band%2Bfield%2Bfacilities%2Bmanual%2B2019%2Bedition%2B-%2Bmarking%2Bplan%2B400m%2Bstandard%2Btrack)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":490,"qid":"Q490","section":"运动","chapter":"有氧训练","question":"在人行道练北欧健走，普通登山杖和健走杖怎么选？","title":"想练交替推杖，就选手向后松开也能传力的握把","fields":[["怎么做","先想清楚自己要借杖支撑，还是想在平路上练交替推杖。练北欧健走时，试一对握带合手、手向后松开仍能把力量传到杖身的健走杖。走时左手配右脚、右手配左脚，杖尖斜向身后，落在前后脚之间，然后向后推。普通登山杖更偏重地形支撑，可先比较两种握把再选。"],["成本","可以在入门课上借杖试走，先确认握带合手、杖尖适用于所走路面，再决定是否购置。"],["说人话","上山时常把杖支到前面帮忙站稳。平地北欧健走要把杖往后推，手舒展开来也能顺着往前走。"],["收益","可以按用途判断现有杖是否合适，练出连续的摆臂和推杖节奏。"],["证据等级","C（健走教学机构的装备说明、国际北欧健走协会的技术规则）。"],["适用与备注","平坦人行道先选宽敞路段，顾及杖尖后方的行人。需要依靠器具防跌或辅助承重时，按自己的助行需求选配。"],["来源","[Nordic Walking UK，健走杖与登山杖的设计](https://nordicwalking.co.uk/knowledge/getting-started/can-i-use-trekking-poles-for-nordic-walking/) · [国际北欧健走协会，技术规则第 3 节](https://www.inwa-nordicwalking.com/_files/ugd/c6669d_7c609c3bfcfb4004a74533ede1e91c14.pdf)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"","grades":["C"]},{"id":491,"qid":"Q491","section":"运动","chapter":"有氧训练","question":"初学跳绳，手柄拉到腋下就算合适吗，怎样试长度？","title":"先用腋下作起点，再用自然的手位试跳调长短","fields":[["怎么做","初学普通双脚跳时，双脚并拢踩住绳子中点，把两端向上拉直，以手柄约到腋下作为试用长度。双肘靠近身体，手腕在腰部附近转绳，小幅跳几下。若常绊脚，先看两手是否越张越开，再按手柄的调节方式小幅调整长度，保持手位重试。"],["成本","一条长度可调的绳和周围、头顶都留有余量的空地即可。先试跳，适合后再按照器材说明固定绳长。"],["说人话","腋下是起点。张开胳膊也会把绳子拉短，别一绊就以为买错了长度。"],["收益","能把绳长和手位逐一核对，减少因为同时改两样而越调越乱。"],["证据等级","C（英格兰拳击协会教练手册的跳绳入门方法，腋下高度是经验参照）。"],["适用与备注","针对初学单摇。手柄结构、动作和熟练度会影响合适长度，手册没有为所有人规定绳子必须拖地几厘米。"],["来源","[英格兰拳击协会，二级教练手册跳绳教学](https://www.englandboxing.org/wp-content/uploads/2022/03/Level-2-Coaching-Handbook-compressed.pdf)"]],"path":"book/aerobic-training/06-practical-skills.md","aliases":"跳绳多长合适 跳绳长度怎么选","grades":["C"]},{"id":492,"qid":"Q492","section":"营养","chapter":"日常饮食","question":"备餐前要把生鸡肉放在水龙头下冲洗吗？","title":"处理生鸡肉时防止肉汁飞溅，烹调时确认内部温度","fields":[["怎么做","打开包装后，把生鸡肉直接移到专用砧板或锅里。处理凉拌菜可以安排在前面，生肉盘另放。接触肉汁后用肥皂和流动水洗手，再洗刀、砧板和台面。用食物温度计测鸡块最厚处；做整鸡时，分别测鸡胸最厚处、大腿根部内侧和翅根内侧，各处都应至少达到 74°C（165°F）。"],["成本","省掉冲洗这一步。若家里常做厚鸡排或整鸡，能重复使用的食品温度计比凭表面颜色判断更实用。"],["说人话","水花能把生肉汁带到旁边已经洗好的菜上。该洗的是手、刀和板。"],["收益","美国 CDC 指出，生鸡肉可携带致病菌，未煮熟和生肉汁污染即食食物都是食物中毒的途径。把两条途径分别管住，比冲一下肉更切题。"],["证据等级","C（CDC 家庭食品安全指导和 FoodSafety.gov 整禽测温表）。温度是熟制鸡肉的安全终点，和训练量无关。"],["适用与备注","这是普通生鸡肉的家庭备餐场景。熟肉出锅应换干净盘子，尤其别再用刚盛过生鸡肉的盘子。"],["来源","[美国 CDC 生鸡肉处理、分板与熟制温度](https://www.cdc.gov/food-safety/foods/chicken.html) · [整禽测温位置与最低温度](https://www.foodsafety.gov/food-safety-charts/meat-poultry-charts)"]],"path":"book/everyday-nutrition/07-reader-questions.md","aliases":"","grades":["C"]},{"id":493,"qid":"Q493","section":"营养","chapter":"日常饮食","question":"土豆放软了还长出很长的芽，挖掉芽再煮还能吃吗？","title":"已经变软、长出长芽的土豆，整颗舍弃","fields":[["怎么做","挑出变软、明显发芽或大面积变绿的土豆，整颗弃用。检查同袋其他土豆，选坚实、外观正常的烹调。后续把新买的土豆放在阴凉避光处，按吃得完的量购买。"],["成本","损失一颗土豆，比费时间挖掉一堆芽再试吃更合算。总是用不完就买小份。"],["说人话","已经皱软又长出一把芽，这颗就别吃了。多炖一会儿也不能可靠解决问题。"],["收益","土豆的芽、发绿或损伤处可能含较多配糖生物碱。香港食物安全中心指出，普通烹调难以可靠去除这些天然毒素，严重发芽时应弃掉整颗。"],["证据等级","C（食物安全机构风险说明）。外观线索用于决定弃用，无法用芽长推算家里某颗土豆的毒素含量。"],["适用与备注","问题说的是显著发芽并变软的土豆。若菜肴已有明显苦味或引起口腔灼热，要停止食用，进食后出现呕吐、腹痛等不适时联系医疗机构。"],["来源","[香港食物安全中心关于发芽、变绿与烹煮的答疑](https://www.cfs.gov.hk/tc_chi/multimedia/multimedia_pub/multimedia_pub_fse_201603.html) · [德国联邦风险评估所关于储存土豆的答疑](https://www.bfr.bund.de/cm/349/frequently-asked-questions-about-solanine-glycoalkaloids-in-potatoes.pdf)"]],"path":"book/everyday-nutrition/07-reader-questions.md","aliases":"土豆发芽了还能吃吗 发芽土豆能吃吗","grades":["C"]},{"id":494,"qid":"Q494","section":"营养","chapter":"日常饮食","question":"奶酪边上长了霉，能把发霉的一角切掉继续吃吗？","title":"先分清是整块硬奶酪，还是软奶酪、奶酪丝和切片","fields":[["怎么做","对于原本不靠霉菌熟成的整块硬奶酪，如果只是局部小霉斑，可以考虑切除。沿霉点四周及下方各至少切去约 2.5 厘米，刀别碰到霉，再换干净包装。软奶酪、已经切片、刨丝或捏碎的奶酪长了意外霉斑，弃掉这份。"],["成本","若一小块硬奶酪切不出足够的余量，直接弃用。常买奶酪丝又吃得慢，可以改买小包装。"],["说人话","整块硬奶酪还有机会切掉一大块，袋装奶酪丝里见霉，挑掉一撮不够。"],["收益","USDA 的家庭处理表区分了整块硬质奶酪和其他形态。高水分食物表面下也可能受污染，切丝或切片时又增加了刀具接触面。"],["证据等级","C（美国农业部食品安全检验局的分类处理表）。约 2.5 厘米来自 1 英寸的换算。"],["适用与备注","本题指储存中意外出现的霉斑。蓝纹等原本用霉菌熟成的产品另有处理规则，种类不明或霉变广泛就弃用。"],["来源","[USDA《食物上的霉菌》分类表，第 4 页](https://ucfoodsafety.ucdavis.edu/sites/g/files/dgvnsk7366/files/inline-files/26438.pdf#page=4)"]],"path":"book/everyday-nutrition/07-reader-questions.md","aliases":"奶酪发霉了还能吃吗 芝士发霉了还能吃吗","grades":["C"]},{"id":495,"qid":"Q495","section":"营养","chapter":"日常饮食","question":"练力量后几乎天天吃罐头金枪鱼，担心汞摄入，接下来怎么选？","title":"看罐头上的鱼种，把一周的鱼换着吃","fields":[["怎么做","先把常买的罐头翻过来看鱼种。美国市场标作 canned light tuna 的产品多用鲣鱼，长鳍金枪鱼（albacore，也称白金枪鱼）通常含汞更高。下次备餐把部分金枪鱼换成沙丁鱼、三文鱼，或用蛋、豆类换一顿。记不清之前吃了多少时，可先记产品、每次份量和频率。"],["成本","用几种同价位的蛋白质食物轮换。无需花钱购买宣称能把吃进去的汞“排掉”的产品。"],["说人话","同样一罐金枪鱼，鱼种会影响汞水平。保留方便的罐头，也让下周的午饭多几个选择。"],["收益","FDA/EPA 面向备孕、孕期、哺乳期人群和儿童的选鱼表，把淡色罐头金枪鱼列为优先选择，长鳍和黄鳍金枪鱼列为限制频次的选择，大眼金枪鱼列为应避免。品牌、单罐重量和鱼种可能不同，单凭“每天一罐”无法判断个人是否中毒。"],["证据等级","C（FDA/EPA 关于鱼种与甲基汞的消费建议）。表中每周份数主要面向可能怀孕、已怀孕、哺乳者和 1–11 岁儿童。"],["适用与备注","上述英文是美国商品常见写法，“清水浸”或“低脂”不能用来认鱼种。处在孕哺期或长期大量吃较高汞鱼、担心既往暴露时，带记录咨询医生；个人检测由医生决定。"],["来源","[FDA/EPA 鱼种、份数适用人群及金枪鱼问答](https://www.fda.gov/food/consumers/questions-answers-fdaepa-advice-about-eating-fish-those-who-might-become-or-are-pregnant-or) · [鱼种分类图](https://www.fda.gov/food/consumers/advice-about-eating-fish)"]],"path":"book/everyday-nutrition/07-reader-questions.md","aliases":"","grades":["C"]},{"id":496,"qid":"Q496","section":"营养","chapter":"日常饮食","question":"茶和正餐一起喝会影响铁吸收吗，担心缺铁要把茶挪到什么时候？","title":"关心食物铁吸收，可以把茶挪到两餐之间","fields":[["怎么做","以豆类、谷物等为主要铁来源，又很喜欢喝茶时，可以把这一餐配的茶换成水，将红茶挪到饭后约一小时再喝，或放在两餐之间。已被诊断缺铁性贫血，继续按医生的方案寻找原因、接受治疗；服铁剂的时间按所用药物说明和医嘱。"],["成本","只需调整泡茶的时间，不用添购饮料，也不用为了抵消一杯茶自己加铁剂。"],["说人话","想多吸收这一餐的植物性铁，把红茶留到饭后再喝就行。贫血还要另查原因。"],["收益","一项稳定同位素试验让 12 名铁储备充足、没有贫血的女性在不同日子吃加铁粥。与边吃粥边喝茶相比，饭后一小时才喝茶时，这一餐的铁吸收比例较高。"],["证据等级","B（小样本人体验餐试验）。这里测的是一餐非血红素铁的吸收，不能据此预测个人的铁蛋白、贫血纠正速度，或所有花草茶的效果。"],["适用与备注","没有缺铁风险且饮食多样时，不必为每一杯茶计时。已发现贫血或反复乏力，不能只靠错开茶和饭解决。"],["来源","[Ahmad Fuzi 等试验摘要，PMID 29046302](https://pubmed.ncbi.nlm.nih.gov/29046302/) · [美国 NHLBI 缺铁性贫血评估与治疗](https://www.nhlbi.nih.gov/health/anemia/iron-deficiency-anemia)"]],"path":"book/everyday-nutrition/07-reader-questions.md","aliases":"","grades":["B"]},{"id":497,"qid":"Q497","section":"营养","chapter":"日常饮食","question":"想从亚麻籽摄取植物性欧米伽-3，买整粒还是磨碎的？","title":"想利用亚麻籽里的脂肪酸，选磨碎的食用产品","fields":[["怎么做","看包装是整粒还是磨粉，是否已熟制、能否直接食用。可选研磨且按说明可即食的产品拌进燕麦，或按包装要求烤进面包；买整粒就按说明加工、磨碎再用。初次可只加一小匙，适应后按口味调整。"],["成本","不必专买磨具，先买小包研磨好的产品。比较实际能吃完的量和开封保存要求。"],["说人话","如果目标是用上籽里的油脂，把坚硬的种皮打破更有帮助。"],["收益","一项健康成人试验把不同形态的亚麻籽制成烘焙食品。一个月时，磨碎籽组和油组的血浆 α-亚麻酸升高，整粒组未见显著升高；各组的 EPA、DHA 均未见显著上升。"],["证据等级","B（小规模饮食干预，以血浆脂肪酸为终点）。这些结果没有证明吃磨碎的籽能提高运动成绩，也没有测量哪一款市售产品更好。"],["适用与备注","这里讨论日常食用的籽。避免吃生的或未成熟的亚麻籽，依包装说明加工；开始吃就明显腹胀，可减量。"],["来源","[Austria 等三种形态试验摘要](https://pubmed.ncbi.nlm.nih.gov/18689552/) · [美国 NCCIH 食用安全说明](https://www.nccih.nih.gov/health/flaxseed-and-flaxseed-oil)"]],"path":"book/everyday-nutrition/07-reader-questions.md","aliases":"","grades":["B"]},{"id":498,"qid":"Q498","section":"营养","chapter":"训练饮食与补剂","question":"训练前的粉剂能不能直接干吞，再喝水送下去？","title":"按包装说明先把训练前粉剂调开，别往嘴里倒干粉","fields":[["怎么做","对标明要配水的训练前粉剂，按标签写的份量和水量先调匀。有水却没容器时，可以跳过这回。已经干吞后出现明显呼吸困难、胸痛、晕倒，立即呼叫当地急救。就医时带上包装，说明大致时间和份量。"],["成本","用普通水杯即可。少用一次可选补剂，对当次训练安排影响很小。"],["说人话","先倒进水里，别把嘴当摇摇杯。干粉呛进气道和咖啡因用多了，是两件都要防的事。"],["收益","美国毒物控制机构提醒，大口吞粉可引起噎呛、呼吸困难。含咖啡因产品还可能引起心跳过快、胸痛等反应。按说明冲调能避免直接吸入干粉，仍需遵守每份用量。"],["证据等级","C（毒物控制机构的用法与风险指导，含病例）。病例只能说明风险确实发生过，无法据此估计某一产品的发生率。"],["适用与备注","此处指设计为冲水饮用的粉剂。加水不会减少原来一勺里的咖啡因；同日饮料和其他产品里的咖啡因也要一起算。"],["来源","[美国 National Capital Poison Center 关于干吞训练前粉剂](https://www.poison.org/articles/dry-scooping-can-be-life-threatening)"]],"path":"book/training-nutrition/07-reader-questions.md","aliases":"","grades":["C"]},{"id":499,"qid":"Q499","section":"营养","chapter":"训练饮食与补剂","question":"练完吃水果，会因为抗氧化成分而削弱增肌或耐力训练效果吗？","title":"照常吃水果，不用为了训练效果避开饭后的橙子","fields":[["怎么做","如果原本会在训练后吃水果，照自己的饭点吃就行。例如酸奶配香蕉，或正餐后吃个橙子。如果担心的是自行购买的高剂量维生素 C 或 E，先看剂量和购买目的，日常食物和高剂量补充剂分开考虑。"],["成本","水果选平常买得起的即可，无需加购“抗氧化恢复”片或重新设计吃水果的钟点。"],["说人话","可以吃。研究里让人长期吞维生素片，与练完吃一份水果差得很远。"],["收益","维生素 C/E 补充剂随机试验的荟萃分析未发现对训练后最大摄氧量、耐力表现、肌力或瘦体重变化有明确的总体影响。个别研究中的细胞信号变化不能直接预测练后吃水果会让人少长多少肌肉。"],["证据等级","B（练后吃一份普通水果的判断来自间接证据，综述没有直接比较吃与不吃水果）。A（仅指维生素 C/E 补充剂对训练适应的随机试验综述，纳入的研究较小）。"],["适用与备注","因诊断出的缺乏或其他医疗原因正在补充营养素，按医疗建议执行。对一般训练者，也没有依据把大剂量补剂当作改善训练效果的必需品。"],["来源","[Clifford 等维生素 C/E 与训练适应综述](https://pubmed.ncbi.nlm.nih.gov/31851538/) · [美国 NIH ODS 运动补剂说明，抗氧化剂部分](https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-Consumer/)"]],"path":"book/training-nutrition/07-reader-questions.md","aliases":"","grades":["A","B"]},{"id":500,"qid":"Q500","section":"营养","chapter":"训练饮食与补剂","question":"健身需要像电影里那样喝生鸡蛋吗，煮熟会影响利用蛋白质吗？","title":"用熟鸡蛋补充蛋白质，生喝没有已证实的训练优势","fields":[["怎么做","普通带壳鸡蛋烹调至蛋白和蛋黄均凝固再吃。若某道食谱一定需要未再加热的蛋液，选明确标注已经巴氏杀菌、适合该用途的蛋制品。早起训练赶时间，可以在平常那顿饭吃熟蛋。"],["成本","用原本买的鸡蛋即可。无需因为练力量额外买生食蛋或凑够电影里的一杯。"],["说人话","煮熟不妨碍把鸡蛋当蛋白质来源，还能避开普通生蛋带来的食源性感染风险。"],["收益","45 名有抗阻训练经验的年轻男性在练后分别吃生蛋、熟蛋或对照早餐。熟蛋组血中必需氨基酸的峰值比生蛋组高，但生熟两组随后数小时的肌原纤维蛋白合成率未见显著差别。"],["证据等级","B（单次训练后的随机试验）。C（FDA 蛋品食品安全建议）。试验没测练前生蛋对当场成绩的影响，也没跟踪数月后的肌肉增长。"],["适用与备注","研究用了五个鸡蛋作为实验餐，个体每餐吃多少应由整天的食物搭配决定。干净、无裂纹的普通蛋也可能带菌。"],["来源","[生蛋和熟蛋的练后试验，方法与结果](https://pmc.ncbi.nlm.nih.gov/articles/PMC9644172/) · [美国 FDA 蛋品安全说明](https://www.fda.gov/media/82227/download)"]],"path":"book/training-nutrition/07-reader-questions.md","aliases":"","grades":["B","C"]},{"id":501,"qid":"Q501","section":"营养","chapter":"训练饮食与补剂","question":"听说小苏打能让高强度跑坚持得更久，这类补剂适合什么项目？","title":"先看项目是否需要持续数分钟的高强度，再权衡胃肠反应","fields":[["怎么做","如果只是日常慢跑或一般健身，按原计划练即可。若参加中距离竞速等高强度项目、正考虑碳酸氢钠，可先和运动营养师商量自己的项目、胃肠病史及饮食限钠要求。值得尝试时在非比赛日演练，出现腹痛或腹泻就停。"],["成本","厨房里的小苏打价格低，但恶心、腹泻可能让一次测试或比赛提前结束。昂贵包装也不能保证耐受。"],["说人话","小苏打有证据的场合多是几分钟的高强度项目。周末慢跑不用往水瓶里加一匙。"],["收益","澳大利亚体育学院把持续约 1–7 分钟的高强度项目列为证据较好的用途，例如中距离跑、赛艇和游泳。作用与酸碱缓冲有关，比赛中胃肠副作用可能抵消收益。"],["证据等级","C（澳大利亚体育学院补剂使用指导）。时间范围描述证据较好的项目，不保证每位运动员提高成绩，也不是把所有项目都截在七分钟。"],["适用与备注","这是碳酸氢钠，不是泡打粉或运动补盐片。需要限钠、有既往肾脏或心血管问题者，是否适合应先问医疗团队，不能按厨房匙估算比赛用量。"],["来源","[AIS 碳酸氢钠的适用项目](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/performance-supplements2/bicarbonate/how-and-when-do-i-use-it) · [AIS 胃肠副作用和实际使用限制](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/performance-supplements2/bicarbonate/are-there-any-concerns-or-considerations) · [MedlinePlus 限钠与既往病史注意事项](https://medlineplus.gov/druginfo/meds/a682001.html)"]],"path":"book/training-nutrition/07-reader-questions.md","aliases":"","grades":["C"]},{"id":502,"qid":"Q502","section":"营养","chapter":"长跑营养","question":"越野长跑经过清澈的溪水或融雪水，可以直接接来喝吗？","title":"先确认饮用水点，未经处理的溪水不能凭外观判断","fields":[["怎么做","出发前查有明确饮用标识的补水点和开放情况，算好到下一个水点的路程。野外水源无法确认安全时，优先带够水或改路线。确需就地处理，CDC 首选将清水煮沸；携带便携过滤器时，要看能去除哪些微生物，按说明过滤后再用适合的饮水消毒产品，并等够规定的接触时间。"],["成本","已确认的补水点可以省掉滤具。规划野外路线时，除了滤芯和消毒用品的费用，还要留出处理和等待的时间。"],["说人话","水看起来清亮、来自高处，两点都不能替你判断能不能直接喝。"],["收益","人和动物的排泄物都可能污染溪水。普通便携过滤器覆盖的病原种类各异，尤其不能默认能滤除病毒。把来源和处理方式事先定好，可减少吞入受污染水的机会。"],["证据等级","C（美国 CDC 户外饮用水指导）。煮沸或过滤后消毒针对微生物；不同设备的过滤能力要按具体说明核实。"],["适用与备注","CDC 建议清水持续翻滚沸腾 1 分钟，海拔超过 6,500 英尺（约 1,980 米）时 3 分钟，冷却后再喝。疑有燃料、化学品或有害藻毒素污染时应换水源，别靠煮沸解决。"],["来源","[美国 CDC 户外饮水的取水、过滤、消毒和海拔说明](https://www.cdc.gov/drinking-water/prevention/water-treatment-hiking-camping-traveling.html)"]],"path":"book/distance-running-nutrition/07-reader-questions.md","aliases":"山里的溪水能喝吗 越野跑能喝溪水吗","grades":["C"]},{"id":503,"qid":"Q503","section":"营养","chapter":"长跑营养","question":"马拉松用价格更高的水凝胶能量胶，会比普通胶跑得更快吗？","title":"普通胶吃得惯时，无需为“水凝胶能提速”换产品","fields":[["怎么做","先核对两款胶每包碳水和咖啡因，按自己练过的每小时摄入量安排。若想试水凝胶，买一两包在条件相近的长课尝试，记能否顺利吃完、是否反胃和花费。普通胶已经好用，就可以带熟悉的产品上场。"],["成本","把整场实际要买的包数乘单价。只有口感或耐受对自己确有帮助时，再决定值不值得按这个差价买。"],["说人话","贵的胶可能更合你的口味，碳水相同时，没有充分理由预期换胶就能刷新成绩。"],["收益","2024 年南京马拉松的一项分组试验比较海藻酸钠水凝胶和普通胶。81 名男性跑者进入分析，按每小时 60 克碳水补给。同水平组内比较，全程完赛时间未见显著差异，部分分段的配速或血糖波动较小。"],["证据等级","B（真实赛事随机对照试验，限特定产品和男性业余跑者）。A（等能量水凝胶饮料研究的荟萃分析，同样未见明确表现优势；饮料与成品胶的差别限制外推）。"],["适用与备注","试验的 60 克是研究方案，不是换胶后必须达到的新目标。分段更稳定不能推断每位跑者会更快或一定不闹肚子；反复严重的跑步胃肠不适另行评估。"],["来源","[Zhang 等南京马拉松试验，方法及比赛结果](https://pmc.ncbi.nlm.nih.gov/articles/PMC12932157/) · [Sutehall 等水凝胶饮料荟萃分析](https://link.springer.com/article/10.1186/s40798-022-00472-5)"]],"path":"book/distance-running-nutrition/07-reader-questions.md","aliases":"水凝胶有用吗 水凝胶能量胶值得买吗","grades":["A","B"]},{"id":504,"qid":"Q504","section":"营养","chapter":"长跑营养","question":"热天跑比赛前吃冰沙，真能让人跑得更久，能据此加快配速吗？","title":"冰沙可作为热天赛前的可选降温办法，别用它换算比赛配速","fields":[["怎么做","先看主办方高温提示和自己是否已逐步适应炎热。想尝试时，在类似天气的普通训练里，按能舒服喝下的量试可食用冰和水打成的冰沙；胃胀、头痛或来不及准备，就用熟悉的饮品并在阴凉处候场。比赛按现场热度和身体反应调整配速。"],["成本","家用冰和水足以尝试。若赛前交通、冷藏或胃口都不方便，不必特意购买或强行喝完。"],["说人话","起跑时觉得凉快，不代表终点时体温也会更低。不要把实验里多坚持的几分钟当作比赛能快的几分钟。"],["收益","10 名男性在约 34°C 的实验环境中，分别在饮用冰沙或冷水后以固定强度跑到力竭。冰沙后起跑前核心体温下降更多，平均坚持约 50 分钟，冷水条件约 41 分钟。冰沙条件下力竭时测得的体温反而较高。"],["证据等级","B（小样本交叉试验）。C（热环境训练与竞赛共识）。跑到力竭的时间与固定距离的比赛用时不同，试验也没有证明冰沙预防热射病。"],["适用与备注","赛事缩短、延期或取消时，服从现场安排。若跑者已出现意识混乱、倒地，按[疑似热射病急救](../training-health/06-emergencies-and-weather.md#q355)处理，不给意识异常者喂冰沙。"],["来源","[Siegel 等实验的设计、起跑前及力竭时体温](https://ro.ecu.edu.au/ecuworks/499/) · [热环境共识，第 5 节降温](https://link.springer.com/article/10.1007/s40279-015-0343-6)"]],"path":"book/distance-running-nutrition/07-reader-questions.md","aliases":"","grades":["B","C"]},{"id":505,"qid":"Q505","section":"营养","chapter":"长跑营养","question":"斋月白天不进食也不饮水，备战半马的长跑应放到开斋前还是开斋后？","title":"把需要边跑边补给的长课安排在开斋后","fields":[["怎么做","先看本周哪一堂需要边跑边喝、边跑边吃。像九十分钟到两小时的重点长课，优先挪到日落开斋、已经能饮水进食的时段。先吃熟悉又容易消化的食物，按份量和自己的胃口留足间隔。若只有开斋前有空，可把那天改成较短的轻松跑，在临近日落时结束。"],["成本","主要代价是晚间时间和睡眠。如果晚跑会严重挤掉休息，缩短这一周的课，比把原长课硬塞回禁饮时段可行。"],["说人话","想在长课中喝水，就把长课放进能喝水的时段。开斋前留给短而轻松的活动。"],["收益","Aspetar 运动医学指南针对斋月锻炼提出，禁食期间低到中等强度往往较容易耐受，开斋后有条件补充液体和碳水。把进食与饮水分布在开斋至封斋前的时段，也便于兼顾恢复与胃口。"],["证据等级","C（针对健康活动人群的临床运动指导）。长课时长来自原问；指南按训练负荷、气候、禁食时长和睡眠个体化安排，没给出保证所有人安全的最长跑量。"],["适用与备注","不要在封斋前一次灌大量水试图顶一整天。合并糖尿病、肾病或需定时用药者，和医疗团队先约定禁食与运动安排。"],["来源","[Aspetar 斋月运动饮食指南，补水与训练时间章节](https://www.aspetar.com/en/professionals/ramadan-evidence-informed-guide) · [健康人群原临床指南](https://www.aspetar.com/en/professionals/aspetar-clinical-guidelines/ramadan-fasting-and-exercise-for-healthy-individuals)"]],"path":"book/distance-running-nutrition/07-reader-questions.md","aliases":"","grades":["C"]},{"id":506,"qid":"Q506","section":"健康","chapter":"训练相关健康","question":"动感单车课音乐太响，下课后耳鸣，又怕戴耳塞听不清教练，怎么办？","title":"把位置移开音箱，再试听教练口令","fields":[["怎么做","课前和教练商量调低音量，选离音箱远、能看清示范的位置。仍然太响时，可试合适的听力防护耳塞，在开课前确认能听懂安全口令。听不清就和教练约定手势、换位置或换一堂音量更合适的课。"],["成本","挪位置和提出降音量都免费。选择耳塞时先看用途、合适程度和说明，无须先买定制款。"],["说人话","如果每次下课耳朵里都在响，下一节课就值得换个听法。"],["收益","降低声音强度和缩短暴露时间，都能减少听力受损的风险。"],["证据等级","C（WHO 安全聆听建议；上课前试看口令是按场景设计的做法）。"],["适用与备注","反复或持续耳鸣、越来越听不清时，安排听力检查。如果耳鸣同时伴随突然听力下降，应立即就医。普通音乐耳机不能自动当成听力防护用品。"],["来源","[WHO 安全聆听，见嘈杂场所、护耳和听力检查](https://www.who.int/news-room/questions-and-answers/item/deafness-and-hearing-loss-safe-listening) · [NHS 耳鸣就诊指引](https://www.nhs.uk/conditions/tinnitus/)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"","grades":["C"]},{"id":507,"qid":"Q507","section":"健康","chapter":"训练相关健康","question":"游泳后反复得外耳道炎，用过耳塞，还应该怎么弄干耳朵？","title":"游完先排水，毛巾只擦外耳","fields":[["怎么做","侧头让耳孔朝下，轻轻拉动耳垂帮助水流出，再用毛巾擦干外耳。游泳时可用合适的泳帽或耳塞。别把棉签伸进耳道，也别把耳垢当作必须清掉的脏东西。"],["成本","用现有毛巾即可。反复发作值得带着以往的治疗记录问医生。"],["说人话","把能流出来的水放出来，耳道里面不用拿东西擦。"],["收益","减少耳道内长期潮湿，也减少清洁时擦伤皮肤的机会。"],["证据等级","C（CDC 游泳后外耳道炎预防建议）。"],["适用与备注","耳痛、耳内流液要找医护评估。已有耳管、鼓膜穿孔、外耳道炎或耳内流液时不要自行用干耳滴剂；其他人想用，也先咨询医护。"],["来源","[CDC 预防游泳者外耳道炎](https://www.cdc.gov/healthy-swimming/prevention/preventing-swimmers-ear.html)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"","grades":["C"]},{"id":508,"qid":"Q508","section":"健康","chapter":"训练相关健康","question":"徒步被蜱虫叮住，一定要买专用取蜱器吗？","title":"发现附着的蜱，及时用合适的镊子移除","fields":[["怎么做","能操作时，用干净的细尖镊子在靠近皮肤处夹住蜱，平稳地垂直向上拔，不扭转、不挤压虫身。移除后清洁双手和叮咬处。夹不到、看不清或不敢操作，就尽快就医处理。"],["成本","可把现有的细尖镊子放进随身小包，无须为了买专用工具耽误处理。"],["说人话","要紧的是夹得靠近皮肤、尽快处理好。"],["收益","及时移除可降低蜱传播疾病的风险；记录地点和时间便于出现症状后就医。"],["证据等级","C（疾控机构关于蜱叮咬的处理建议）。"],["适用与备注","之后数周如出现发热、乏力或皮疹，尽快就医并说明户外地点和叮咬时间。不同地区的蜱和疾病不同，不能凭叮咬时长自行排除风险。"],["来源","[美国 CDC 蜱叮咬后的移除和观察](https://www.cdc.gov/ticks/after-a-tick-bite/) · [北京疾控的蜱叮咬处置](https://www.beijing.gov.cn/fuwu/bmfw/sy/jrts/202504/t20250430_4078729.html)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"","grades":["C"]},{"id":509,"qid":"Q509","section":"健康","chapter":"训练相关健康","question":"户外长跑出了很多汗，防晒霜什么时候补、哪些地方容易漏？","title":"把补涂防晒安排在跑步途中","fields":[["怎么做","选广谱、耐水、SPF 30 或以上的防晒品，出门约 15 分钟前涂到暴露皮肤，带上方便补涂的一小份。户外约每两小时补涂；大量出汗或游泳后及时补，按包装耐水说明使用。耳朵、后颈和衣物边缘也要照顾到。"],["成本","先用自己能足量涂、愿意补涂的产品，辅以遮阳衣帽或阴凉路线。"],["说人话","上午出门时涂过一次，不能替你撑过一整趟大汗淋漓的长跑。"],["收益","正确覆盖和及时补涂有助于保护皮肤免受紫外线伤害。"],["证据等级","C（美国皮肤病学会的涂抹建议及美国 FDA 的耐水标签说明）。"],["适用与备注","耐水不等于永久防水。用防晒棒时，每块皮肤来回涂四遍再抹匀。用喷雾时，近距离喷到皮肤微微发亮再抹匀；涂脸先喷在手上，避开口鼻，大风时换用其他剂型。"],["来源","[美国皮肤病学会防晒使用指南](https://www.aad.org/public/everyday-care/sun-protection/shade-clothing-sunscreen/how-to-apply-sunscreen) · [美国 FDA 耐水标签说明](https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun) · [美国皮肤病学会的棒状与喷雾涂法](https://www.aad.org/public/everyday-care/sun-protection/shade-clothing-sunscreen/how-to-use-stick-spray-sunscreens)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"","grades":["C"]},{"id":510,"qid":"Q510","section":"健康","chapter":"训练相关健康","question":"骑车摔倒时头盔撞了地，外壳没裂，还能继续用吗？","title":"确实撞过地的头盔先停用","fields":[["怎么做","如果戴着头盔摔车且头部撞地，先停用这顶头盔。看型号说明，按厂家要求更换或送回评估。不要靠按压泡沫、看外壳是否完整来决定继续戴。若自己撞后头晕、视觉异常或反应变慢，也要退出运动并接受评估。"],["成本","可能需要更换头盔。购买前可查厂家是否有撞击更换计划。"],["说人话","壳子看起来完整，不能告诉你里面还能不能扛下一次。"],["收益","避免把经历过明显撞击、保护能力未知的头盔重新用于骑行。"],["证据等级","C（自行车头盔标准的使用警示）。"],["适用与备注","这里指戴着头盔发生头部撞击。空头盔轻轻掉落与骑行撞击不同，按厂家对该型号的说明处理。人员伤情另见 [Q348](../training-health/05-injuries-and-return.md#q348)。"],["来源","[美国消费品安全委员会自行车头盔警示条款](https://www.cpsc.gov/FAQ/Bicycle-Helmets)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"骑行头盔摔过还能用吗 头盔撞过还能戴吗","grades":["C"]},{"id":511,"qid":"Q511","section":"健康","chapter":"训练相关健康","question":"刚做完大面积纹身，游泳训练要等多久才能恢复？","title":"等纹身处的皮肤愈合，再回泳池","fields":[["怎么做","愈合期间先把游泳课改期，泳池、热水池、河湖都先避开。按给你的护理说明照料皮肤；如果仍有破损、渗出或越来越痛，继续暂停下水，必要时请医护检查。"],["成本","调整几节水上课；不必为提早下水买所谓防水保护产品。"],["说人话","日历翻过几周，和皮肤已经愈合，是两件事。"],["收益","避免让愈合中的皮肤浸泡在水中。"],["证据等级","C（梅奥诊所的纹身后护理指导）。"],["适用与备注","面积、部位和恢复情况会影响时间，资料没有给每个人同一天恢复游泳的保证。怀疑感染或愈合异常时就医。"],["来源","[梅奥诊所纹身护理，见 Take care of your tattoo](https://www.mayoclinic.org/healthy-lifestyle/adult-health/in-depth/tattoos-and-piercings/art-20045067)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"纹身后多久可以游泳","grades":["C"]},{"id":512,"qid":"Q512","section":"健康","chapter":"训练相关健康","question":"拔了智齿几天已经不太痛，能按原跑表复训了吗？","title":"按手术医嘱决定何时加回跑步","fields":[["怎么做","手术当天先休息，暂停跑步。之后先看牙医给的术后限制和创口变化；若打算跑长距离、做间歇，或手术较复杂，先向施术团队确认可恢复的强度。若又开始出血、疼痛或肿胀明显加重，暂停训练并联系牙医。"],["成本","留出恢复和复诊时间；需要咨询时，告诉牙医拔了哪些牙、哪天做的和准备跑什么课。"],["说人话","能上班、能吃饭，和能完成长跑，是不同的恢复节点。"],["收益","帮助保护创口，避免把恢复日常生活的时间误作高强度运动许可。"],["证据等级","C（牙科机构术后指导；没有采用跑者经验推算统一复跑日）。"],["适用与备注","持续出血、严重或越来越重的痛肿，尤其伴发热或不适，应尽快就诊。本文不能凭疼痛轻重判断创口是否愈合或诊断干槽症。"],["来源","[NHS 牙科服务口腔小手术后护理](https://www.dentalhealthcareeoe.nhs.uk/services/minor-oral-surgery/minor-oral-surgery-post-operative-care-instructions/) · [NHS 拔智齿后恢复与警示](https://www.nhs.uk/tests-and-treatments/wisdom-tooth-removal/)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"拔智齿后几天能跑步","grades":["C"]},{"id":513,"qid":"Q513","section":"健康","chapter":"训练相关健康","question":"乳房疼得跑起来不舒服，怎样试运动内衣，什么情况要找医生？","title":"跑两步试支撑，持续的乳房疼痛另行评估","fields":[["怎么做","试穿时做几个自己训练中会做的小跑或跳跃动作，感受乳房晃动时是否痛。选适合高冲击活动、下围稳、肩带和罩杯合身的款式。当天连轻触都疼时，可先选舒服的低冲击活动。"],["成本","先用现有内衣做动态试穿，再决定是否更换。"],["说人话","站着试合身，还要试试跑起来舒不舒服。"],["收益","合适的支撑有助于减少跑跳时的乳房移动和相关不适。"],["证据等级","C（澳大利亚运动医学机构的运动乳房支撑指导；就诊边界参照 NHS）。"],["适用与备注","新出现、持续或加重的乳房痛，或摸到新肿块、发现乳头或皮肤改变，应预约就医。乳房局部发烫、肿胀或肤色明显改变，即使没发烧，也应当天就医；乳房疼痛同时伴高热或寒战，也应当天就医。这里讲的是乳房组织不适；运动中胸口压迫、异常气短按 [Q353](../training-health/06-emergencies-and-weather.md#q353) 处理。"],["来源","[Sports Medicine Australia 运动与乳房支撑](https://sma.org.au/resources/injury-fact-sheets/exercise-and-breast-support/) · [NHS 乳房疼痛就医建议](https://www.nhs.uk/symptoms/breast-pain/)"]],"path":"book/training-health/12-sport-and-personal-health.md","aliases":"","grades":["C"]},{"id":514,"qid":"Q514","section":"健康","chapter":"常见慢病与运动","question":"有雷诺现象，冬天跑步摘手套取补给时手指就僵，怎么安排？","title":"先保暖全身，把补给放到戴手套也能取的位置","fields":[["怎么做","出发前穿好保暖衣物、手套和袜子，尽量避开温度骤变。先在室内戴着手套试拿手机、开补给袋，把需要的物品换到容易取的位置。如果一路都得裸手，或发作妨碍手部操作，改到更暖的时段或室内。"],["成本","先调整现有衣物和口袋，确认能操作后，再考虑是否需要换手套。"],["说人话","手套再暖，补给时总得脱下来，也解决不了你那一段的麻烦。"],["收益","减少冷刺激和反复脱手套的机会，保留自己能适应的规律活动。"],["证据等级","C（NHS 对雷诺现象的保暖与活动建议；戴手套排练是针对原问的实践示例）。"],["适用与备注","适用于已了解自身雷诺现象的成年人。症状加重、只发生在身体一侧、影响日常生活或同时有关节痛、皮疹、无力时，应就医评估，不自行归咎于手套。"],["来源","[英国 NHS 雷诺现象自我照护与就医建议](https://www.nhs.uk/conditions/raynauds/)"]],"path":"book/chronic-health/06-cold-and-pool.md","aliases":"","grades":["C"]},{"id":515,"qid":"Q515","section":"健康","chapter":"常见慢病与运动","question":"确诊癫痫后想回泳池，还会发作时应和谁一起游、提前说好什么？","title":"先把水中同伴和泳池安排谈清楚","fields":[["怎么做","先和主管医生或癫痫专科护士讨论发作控制情况与游泳风险。如果仍会发作，选择有救生员的泳池，安排熟悉你发作时的表现、知道如何应对水中发作，而且水性和体力足以协助你的同伴在水中近旁陪同。提前告知救生员，与同伴约好泳道并演练求助分工。当日不舒服就改期。"],["成本","需要约一位合适的同伴，且泳池工作人员要知道你的安排。"],["说人话","救生员要看整池人，你还需要知道身边谁会专门留意你。"],["收益","个体评估和水中陪同能让发作更容易被发现和及时求助。"],["证据等级","C（癫痫专业机构运动安全指导；是否适合下水需结合个人发作情况判断）。"],["适用与备注","本题针对仍可能发作的人。完全控制者的安排可与医生另议；开放水域的水流、水温和救援距离需要另行评估。下水前和同伴明确：如果在水中发生抽搐，应立即呼叫救生员并托住头，让口鼻露出水面；只要怀疑发作时吞水或吸入水，即使看起来已恢复，也要呼叫当地急救。"],["来源","[Epilepsy Action 运动与休闲，见 Swimming](https://www.epilepsy.org.uk/living/sports-and-leisure)"]],"path":"book/chronic-health/06-cold-and-pool.md","aliases":"癫痫能游泳吗 癫痫可以游泳吗","grades":["C"]}]</script>

  ['睡前拉伸', '睡前还能拉伸', '睡前做拉伸'],
  ['一跑就喘', '跑步很喘', '跑步时很喘', '跑步一会儿就喘', '就喘得不行'],
  ['跑前热身', '跑步前热身', '跑步前用什么方法热身', '跑步前怎么热身'],
  ['跑步小腿疼', '跑步小腿痛', '跑步小腿内侧疼', '跑步时小腿内侧疼'],
  ['每周两次', '一周练两次', '一周只能练两次', '每周只练两次', '一周两次', '每周练两次',
    '每周只有两次', '一周只有两次', '每周只能练两次', '一周两练', '一周练2次', '每周练2次',
    '一周就能练两回', '每周就能练两回', '一周练两回', '每周练两回', '一周就能练两次'],
  ['跑步入门', '零基础跑步', '开始跑步', '跑步怎么开始'],
  ['经期运动', '月经来了能运动', '经期能运动', '来月经能运动', '生理期能运动', '生理期跑步'],
  ['经期', '来月经', '月经', '生理期', '大姨妈'],
  ['围绝经期', '更年期'],
  ['经痛', '痛经'],
  ['岔气', '跑步肚子疼', '跑步肚子痛'],
  ['胸痛', '胸口疼', '胸口痛', '胸口闷', '胸闷', '胸口压迫感'],
  ['晕倒', '快晕了'],
  ['叫不醒', '叫不应', '失去意识', '晕倒叫不醒', '晕倒了叫不醒'],
  ['倒地'],
  ['意识混乱', '意识模糊', '神志不清'],
  ['久坐', '一直坐着', '坐太久', '一坐就坐一下午', '一坐就坐半天', '一坐就是几个小时'],
  ['久坐起身间隔', '多久起来活动', '多久起来一次', '坐多久起来', '坐多久站起来'],
  ['一万步', '10000步', '1万步'],
  ['走跑交替', '跑跑走走', '跑走结合', '走跑结合'],
  ['跑不动', '跑不起来'],
  ['练后吃饭', '练完还吃吗', '练完回家吃饭', '练完很晚回家还能吃晚饭', '训练后吃饭',
    '夜跑回来还要吃饭', '训练后还能吃正餐', '练完吃正餐'],
  ['晚练后吃饭', '晚练后吃什么', '跑完步饿了要吃', '晚上跑完步饿了', '夜跑后饿',
    '练完很晚吃饭', '十点了还要吃晚饭', '十点了,还要吃晚饭'],
  ['晚练后难入睡', '晚练会睡不着', '晚练睡不着', '晚练后睡不着', '晚上练完睡不着', '晚上训练后睡不着'],
  ['晚练咖啡因', '晚练喝咖啡', '晚上练力量喝咖啡', '晚上训练前喝咖啡',
    '训练前喝咖啡晚上睡不着', '训练前喝咖啡会睡不着'],
];
const topicNames = new Map(topicGroups.flatMap(([name, ...variants]) =>
  [name, ...variants].map(variant => [variant, name])));
const topicPattern = new RegExp([...topicNames.keys()].sort((a, b) => b.length - a.length).join('|'), 'g');
const segmenter = typeof Intl.Segmenter === 'function' ? new Intl.Segmenter('zh', {granularity: 'word'}) : null;
const commonWords = new Set(['怎么', '怎样', '如何', '可以', '能否', '需要', '要不要', '一下',
  '一定', '还是', '开始', '时候', '自己', '平时', '每天', '有没有', '是不是', '怎么办', '运动', '训练',
  '不够', '完全', '行不行', '什么', '几个', '才算', '会不会', '要带', '要喝', '不要']);

function findTopics(value) {
  return new Set(Array.from(value.matchAll(topicPattern), ([variant]) => topicNames.get(variant)));
}

const searchable = entries.map(entry => {
  const question = normalize(entry.question);
  const heading = normalize([entry.qid, entry.title, entry.aliases].join(' '));
  const body = normalize(entry.fields.slice(0, -1).map(field => field[1]).join(' '));
  const title = question + '\0' + heading;
  return {entry, question, heading, body, title, titleTopics: findTopics(title), bodyTopics: findTopics(body)};
});

function findRelatedEntries(value, candidates) {
  const topics = [...findTopics(value)];
  const condition = topics.find(topic => ['糖尿病', '糖尿病前期', '高血压'].includes(topic));
  const isRace = topic => topic === '半马' || topic === '全马';
  // A general race article should not answer a question about a named condition.
  const conditionAndRace = condition && topics.some(isRace);
  const requiredTopics = conditionAndRace ? [condition] : topics;
  const remaining = value.replace(topicPattern, ' ');
  const words = segmenter ? Array.from(segmenter.segment(remaining), part => normalize(part.segment)) : [];
  const clues = [...new Set(words.filter(word => word.length >= 2 && !commonWords.has(word)))];
  const scores = [];
  for (const item of candidates) {
    const {entry, title, titleTopics, bodyTopics} = item;
    if (conditionAndRace && (entry.chapter !== '常见慢病与运动' || !titleTopics.has(condition))) continue;
    if (!requiredTopics.every(topic => titleTopics.has(topic) || bodyTopics.has(topic))) continue;
    const topicHits = topics.filter(topic => titleTopics.has(topic)).length;
    const titleClues = clues.filter(word => title.includes(word));
    if (!topics.length && (titleClues.length < 2 || !titleClues.some(word => word.length >= 3))) continue;
    const score = topicHits * (clues.length + 1) + titleClues.length;
    scores.push({entry, score, topicHits});
  }
  // A topic in a title is stronger evidence of relevance than a mention in the answer.
  const bestTitleMatch = Math.max(0, ...scores.map(item => item.topicHits));
  return scores.filter(item => item.topicHits === bestTitleMatch)
    .sort((a, b) => b.score - a.score || a.entry.id - b.entry.id)
    .slice(0, 12).map(item => item.entry);
}

function hasSymptom(value, pattern) {
  const denial = /(?:没(?:有)?|未|不|无|否认)(?:出现|发生|感觉到)?$/;
  return Array.from(value.matchAll(pattern)).some(({index}) => !denial.test(value.slice(0, index)));
}

function priorityQuestion(value) {
  const fainted = hasSymptom(value, /晕倒|晕过去|昏倒|昏过去|晕厥|[晕昏]了(?:就|一直)?不醒/g);
  const collapsed = fainted || hasSymptom(value, /倒地|倒下/g);
  const unresponsive = hasSymptom(value, /(?:叫|喊)不醒|叫不应|[晕昏]了(?:就|一直)?不醒|醒不过来|失去意识|没(?:有)?反应(?!过来)|昏迷/g);
  const abnormalBreathing = hasSymptom(value, /没(?:有)?正常呼吸|没(?:有)?呼吸(?!困难|异常|问题|不畅|不正常)|呼吸(?:不正常|异常|停止)|不呼吸|只偶尔喘/g);
  if ((collapsed || unresponsive) && abnormalBreathing) return 354;

  const heat = /高温|大热天|热天|炎热|酷暑|暴晒|闷热/.test(value);
  const confusion = hasSymptom(value, /意识(?:混乱|模糊|不清|异常)|神志(?:不清|模糊)|说话(?:含糊|不清)|胡言乱语|行为异常/g);
  if (heat && confusion) return 355;
  const normalBreathing = hasSymptom(value, /呼吸正常|正常呼吸/g);
  if (collapsed && unresponsive && !normalBreathing) return 354;

  const exercise = /运动|锻炼|跑步|跑着跑着|跑到|跑完|跑后|长跑|慢跑|夜跑|晨跑|马拉松|半马|全马|健身|训练|举重|骑车|游泳|爬楼/.test(value);
  const chestSymptoms = hasSymptom(value, /胸(?:口|部|前)?(?:疼|痛|发闷|闷|压迫|发紧)/g);
  const nearFainting = hasSymptom(value, /快(?:要)?晕|差点晕|眼前发黑|险些晕倒/g);
  const suddenBreathlessness = hasSymptom(value, /(?:突然|突发|异常|明显)(?:出现)?(?:呼吸困难|气短)/g);
  const recentIllness = /退烧|退热|发烧后|发热后|感染后|感染恢复|感冒后|感冒刚好|阳康|新冠恢复/.test(value);
  if (exercise && (nearFainting || fainted || suddenBreathlessness)) return 353;
  if (chestSymptoms && recentIllness) return 319;
  if (exercise && chestSymptoms) return 353;

  if (hasSymptom(value, /热射病/g)) return 355;
  if (hasSymptom(value, /心肺复苏|心脏骤停|心搏骤停|自动体外除颤器|\b(?:cpr|aed)\b/g)) return 354;

  const outerKneePain = hasSymptom(value, /膝(?:盖|关节)?(?:有点|很)?(?:疼痛|疼|痛)(?:是在|的是|在|的|靠)?外(?:侧|边|面)|(?:膝(?:盖|关节)?的?外(?:侧|边|面)|外侧膝(?:盖|关节)?)(?:有点|很|开始|突然)?(?:疼|痛)/g);
  if (outerKneePain) {
    const twistedKnee = hasSymptom(value, /膝(?:盖|关节)?(?:被|又)?(?:扭|撞)|(?:扭(?:到|了|伤)|撞(?:到|了|伤))了?(?:左|右)?膝/g);
    return twistedKnee ? 331 : 330;
  }
  return null;
}

function findEntries(value, selectedChapter, selectedEvidence) {
  const raw = normalizeDistance(value.normalize('NFKC')).trim();
  const idMatch = /^q?0*(\d+)$/i.exec(raw);
  const terms = raw.split(/\s+/).map(normalize).filter(Boolean);
  const candidates = searchable
    .filter(({ entry }) => !selectedChapter || entry.chapter === selectedChapter)
    .filter(({ entry }) => {
      if (!selectedEvidence) return true;
      if (selectedEvidence === 'unmarked') return entry.grades.length === 0;
      return entry.grades.includes(selectedEvidence);
    });
  if (idMatch) {
    return {entries: candidates.filter(({entry}) => entry.id === Number(idMatch[1])).map(({entry}) => entry)};
  }
  const exact = candidates
    .map(({ entry, question, heading, body }) => {
      if (!terms.every(term => question.includes(term) || heading.includes(term) || body.includes(term))) return [entry, -1];
      const questionHits = terms.filter(term => question.includes(term)).length;
      const headingHits = terms.filter(term => heading.includes(term)).length;
      return [entry, questionHits * (terms.length + 1) + headingHits];
    })
    .filter(([, score]) => score >= 0)
    .sort((a, b) => b[1] - a[1] || a[0].id - b[0].id)
    .map(([entry]) => entry);
  if (!terms.length) return {entries: exact};
  const priorityId = priorityQuestion(normalize(raw));
  const matches = exact.length ? exact : findRelatedEntries(raw.toLowerCase(), candidates);
  const priority = candidates.find(({entry}) => entry.id === priorityId)?.entry;
  if (!priority) return {entries: matches, related: !exact.length};
  return {
    entries: [priority, ...matches.filter(entry => entry.id !== priorityId)],
    related: !exact.includes(priority),
  };
}

for (const name of chapters) {
  const option = document.createElement('option');
  option.value = name;
  option.textContent = name;
  chapter.append(option);
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function feedbackLink(search, selectedChapter = '', selectedEvidence = '') {
  const url = new URL(publicReader);
  if (search) url.searchParams.set('q', search);
  if (selectedChapter) url.searchParams.set('chapter', selectedChapter);
  if (selectedEvidence) url.searchParams.set('evidence', selectedEvidence);
  return url.href;
}

function questionLink(qid, base = location.href) {
  const url = new URL(base);
  url.search = '';
  url.searchParams.set('q', qid);
  url.hash = 'results';
  return url.href;
}

function copyFeedback(label, text) {
  const panel = element('div', '', 'feedback');
  const button = element('button', label);
  button.type = 'button';
  const message = element('p', '', 'feedback-status');
  message.setAttribute('role', 'status');
  const manual = element('textarea');
  manual.readOnly = true;
  manual.rows = 4;
  manual.hidden = true;
  manual.setAttribute('aria-label', '可手动复制的反馈内容');
  panel.append(button, message, manual);
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      if (!panel.isConnected) return;
      manual.hidden = true;
      message.textContent = '已复制，可以粘贴到聊天里。';
    } catch {
      if (!panel.isConnected) return;
      manual.value = text;
      manual.hidden = false;
      message.textContent = '自动复制未成功，请手动复制下方文字。';
      manual.focus();
      manual.select();
    }
  });
  return panel;
}

function articleUrl(path, fragment = '') {
  return repository + '/blob/main/' + path + fragment;
}

function linkedUrl(target, entry) {
  if (/^https?:\/\//i.test(target)) return target;
  const local = new URL(target, 'https://guide.local/' + entry.path);
  if (local.origin !== 'https://guide.local') return '';
  if (/^#q\d+$/.test(local.hash)) {
    return questionLink(local.hash.slice(1).toUpperCase());
  }
  return articleUrl(local.pathname.slice(1), local.hash);
}

function appendAnswerText(container, markdown, entry) {
  const tokens = /\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*/g;
  let offset = 0;
  for (const match of markdown.matchAll(tokens)) {
    container.append(markdown.slice(offset, match.index));
    if (match[3]) {
      container.append(element('strong', match[3]));
    } else {
      const href = linkedUrl(match[2], entry);
      if (href) {
        const link = element('a', match[1]);
        link.href = href;
        container.append(link);
      } else {
        container.append(match[1]);
      }
    }
    offset = match.index + match[0].length;
  }
  container.append(markdown.slice(offset));
}

function answerCard(entry) {
  const card = element('details');
  const summary = element('summary');
  const basis = entry.basis ?? (entry.grades.length ? '编辑分级 ' + entry.grades.join('/') : '无字母标注');
  summary.append(element('span', entry.question, 'question'));
  summary.append(element('span', [entry.qid, entry.chapter, basis].join(' · '), 'meta'));
  card.append(summary);
  card.addEventListener('toggle', () => {
    if (!card.open || card.children.length > 1) return;
    const answer = element('div', '', 'answer');
    answer.append(element('h2', entry.title));
    const guidance = element('dl');
    const references = element('dl', '', 'evidence-fields');
    for (const [label, text] of entry.fields) {
      const field = element('div', '', label === '怎么做' ? 'answer-field action' : 'answer-field');
      const description = element('dd');
      appendAnswerText(description, text, entry);
      field.append(element('dt', label === '证据等级' ? '编辑分级与依据' : label), description);
      const group = label === '证据等级' || label === '来源' ? references : guidance;
      group.append(field);
    }
    answer.append(guidance, references);
    const links = element('p', '', 'answer-links');
    const original = element('a', '在 GitHub 查看原文');
    original.href = articleUrl(entry.path, '#' + entry.qid.toLowerCase());
    links.append(original);
    if (location.protocol === 'https:' || location.protocol === 'http:') {
      const permalink = element('a', '本题链接');
      permalink.href = questionLink(entry.qid);
      links.append(' · ', permalink);
    }
    answer.append(links, copyFeedback('复制题目和链接',
      '《运动营养健康指南》' + entry.qid + ' ' + entry.question + '\n' + questionLink(entry.qid, publicReader)));
    card.append(answer);
  });
  return card;
}

function showMore() {
  const page = matched.slice(shown, shown + pageSize);
  const fragment = document.createDocumentFragment();
  for (const entry of page) fragment.append(answerCard(entry));
  results.append(fragment);
  shown += page.length;
  more.hidden = shown >= matched.length;
  status.textContent = matched.length
    ? related
      ? '按关键词找到 ' + matched.length + ' 个相关问题。'
      : '找到 ' + matched.length + ' 题，显示 ' + shown + ' 题。'
    : '没有匹配题目。可以试试更短的词，或放宽章节和编辑分级筛选。';
}

function refresh() {
  const result = findEntries(query.value, chapter.value, evidence.value);
  matched = result.entries;
  related = Boolean(result.related);
  startingPoints.hidden = Boolean(query.value.trim() || chapter.value || evidence.value);
  shown = 0;
  results.replaceChildren();
  showMore();
  searchFeedback.replaceChildren();
  searchFeedback.hidden = matched.length > 0;
  if (!searchFeedback.hidden) {
    const search = query.value.trim();
    const summary = search ? '我在《运动营养健康指南》里搜「' + search + '」，没有找到结果。'
      : '我在《运动营养健康指南》里按以下条件筛选，没有找到结果。';
    const filters = [chapter.value, evidence.value ? evidence.selectedOptions[0].textContent : '']
      .filter(Boolean);
    const context = filters.length ? '\n筛选条件为' + filters.join('、') : '';
    searchFeedback.append(copyFeedback(search ? '复制搜索词和链接' : '复制筛选和链接',
      summary + context + '\n' + feedbackLink(search, chapter.value, evidence.value)));
    if (search) searchFeedback.append(element('p', '链接也包含搜索词，分享前请确认内容。', 'filter-note'));
  }
  if (matched.length === 1 && !related) results.firstElementChild.open = true;
}

query.addEventListener('input', event => {
  if (!event.isComposing) refresh();
});
query.addEventListener('compositionend', refresh);
chapter.addEventListener('change', refresh);
evidence.addEventListener('change', refresh);
more.addEventListener('click', () => {
  const next = shown;
  showMore();
  results.children[next]?.querySelector('summary').focus();
});
for (const button of document.querySelectorAll('[data-query]')) {
  button.addEventListener('click', () => {
    query.value = button.dataset.query;
    chapter.value = '';
    evidence.value = '';
    refresh();
    query.focus();
  });
}

if (location.protocol === 'file:') {
  document.getElementById('guide-home').href = '?';
  document.getElementById('about-link').hidden = true;
  document.getElementById('offline-about').hidden = false;
}
const parameters = new URLSearchParams(location.search);
query.value = parameters.get('q') || '';
chapter.value = chapters.includes(parameters.get('chapter')) ? parameters.get('chapter') : '';
const requestedEvidence = parameters.get('evidence');
evidence.value = Array.from(evidence.options).some(option => option.value === requestedEvidence)
  ? requestedEvidence : '';
refresh();
const sharedAnswer = results.firstElementChild;
if (/^q\d+$/i.test(query.value.normalize('NFKC').trim()) && sharedAnswer?.open) {
  // The card builds its answer on the toggle event. Scroll once the text is in the page.
  sharedAnswer.addEventListener('toggle', () => {
    if (sharedAnswer.open && sharedAnswer.isConnected) sharedAnswer.scrollIntoView({block: 'start'});
  }, {once: true});
}
</script>
