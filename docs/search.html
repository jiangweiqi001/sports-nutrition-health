,"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":361,"qid":"Q361","section":"健康","chapter":"训练相关健康","question":"雷雨突然靠近时，户外跑步的人应该去哪里避险，什么时候能继续？","title":"听见雷声就进坚固建筑或封闭硬顶车","fields":[["怎么做","听见雷声或看到闪电就停止户外跑步，进入有封闭空间的坚固建筑，或关窗的硬顶汽车。开敞凉亭、帐篷和树下不能可靠避雷。到安全处后，至少等最后一声雷过去 30 分钟，再结合当地预警决定是否继续。"],["成本","出门前知道沿途有哪些可以真正避险的地点。躲避后可能需要中止原路线。"],["说人话","一听见雷就找室内。安全处等够时间，再决定还跑不跑。"],["收益","雷电可在下雨前或距离降雨区较远处发生。官方雷电指引建议进入有防护的场所，并在最后一次雷声后等至少 30 分钟。"],["证据等级","C（气象与公共卫生防灾指导）。"],["适用与备注","天气恶化时以当地预警和撤离要求为准。有人遭雷击时，确认环境安全、呼叫急救并按调度提示行动。"],["来源","美国国家气象局户外雷电安全说明和美国疾控中心雷电问答。 [气象局雷电安全](https://www.weather.gov/safety/lightning-outdoors) · [CDC 雷电问答](https://www.cdc.gov/lightning/faq/index.html)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":362,"qid":"Q362","section":"健康","chapter":"训练相关健康","question":"初到高海拔还想跑步，怎样安排头几天活动，头痛伴呕吐或站不稳时怎么求助？","title":"刚到高海拔先做轻活动，站不稳或静息气短时立即求助","fields":[["怎么做","从低海拔到高海拔后，头 48 小时以轻活动为主，取消高强度跑课。有新发头痛、恶心或呕吐时停练、避免继续升高，联系当地医疗。头痛加重并反复呕吐，或出现走路站不稳、意识异常、静息气短时，立即呼叫救援并在安全、有协助的条件下下撤。"],["成本","预留适应时间。出发前查清附近医疗点、通信条件和下撤路线。"],["说人话","刚到先轻走。头痛加重、站不稳或静息也喘，就求助，别继续往上。"],["收益","低地居民到约 2500 米以上有急性高原病风险，实际风险还与上升速度、睡眠海拔及个体经历有关。步态不稳和意识异常是需要紧急处理的信号。"],["证据等级","C（荒野医学会临床指南和 CDC 旅行医学建议）。"],["适用与备注","一般的体能好也无法确保不会有高原病。有过高原病或已知心肺疾病，旅行前可向医生确认计划。"],["来源","荒野医学会 2024 急性高原病临床指南与 CDC《Yellow Book 2026》高海拔章节。 [临床指南](https://doi.org/10.1016/j.wem.2023.05.013) · [CDC 旅行医学](https://www.cdc.gov/yellow-book/hcp/environmental-hazards-risks/high-altitude-travel-and-altitude-illness.html)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":363,"qid":"Q363","section":"健康","chapter":"训练相关健康","question":"不习惯的高强度训练后出现异常肌痛、无力或茶色尿，为什么需要及时就医？","title":"陌生高强度训练后出现严重肌痛、无力或茶色尿，立即就医","fields":[["怎么做","停止训练。不寻常的严重肌痛、明显肿胀或无力，尤其伴茶色、可乐色尿或尿量减少时，立即去急诊评估。告诉医生练了什么、持续多久、症状从何时开始，并带上正在用的药物和补充剂信息。"],["成本","需要中止训练并尽快就医。状态差或无法安全去医院时呼叫急救。"],["说人话","这类表现值得马上检查。别等喝水后尿色变浅再决定。"],["收益","横纹肌溶解可表现为异常肌痛、无力或深色尿，可并发肾脏及电解质问题。症状不一定同时出现，医疗人员可结合检查判断。"],["证据等级","C（美国疾控中心职业安全卫生研究所的识别和处理指导）。"],["适用与备注","普通运动后酸痛也可以很明显。若明显超过平时、功能下降严重或伴深色尿，按以上流程求助。"],["来源","美国疾控中心 NIOSH 横纹肌溶解症状与就医指导。 [症状与检查](https://www.cdc.gov/niosh/rhabdo/signs-symptoms/index.html) · [就医指导](https://www.cdc.gov/niosh/rhabdo/treatment/index.html)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":364,"qid":"Q364","section":"健康","chapter":"训练相关健康","question":"户外训练后出现风团、喉咙发紧或呼吸困难，如何识别危险并尽快呼救？","title":"运动后风团伴喉紧或呼吸困难，立即按严重过敏求助","fields":[["怎么做","立即停止运动。请同伴拨 120、报位置和症状，同时按个人预案和装置说明立即使用医生已开具的肾上腺素自动注射器。独自一人且装置在手边时，立即使用并呼救。手边没有装置时，立即拨 120。等待时平躺。呼吸困难时可缓慢抬高上身，调整到便于呼吸的体位。即使症状好转，也不要站起或走动。失去反应且无正常呼吸时按[成人急救流程](#q354)行动。"],["成本","需要旁人陪同和呼救。及时告诉急救人员已经用过什么、什么时候用的。"],["说人话","起风团又喉咙紧、喘或快晕倒，马上呼救。已有肾上腺素预案就立即照做。"],["收益","严重过敏可累及气道、呼吸和循环，也可能没有明显皮疹。肌内肾上腺素是严重过敏的一线治疗。"],["证据等级","C（世界过敏组织和国内临床急救指南）。"],["适用与备注","即使症状缓解仍按急救人员安排评估。抗组胺药不能替代肾上腺素处理呼吸或循环受累。已知有风险者可看[出门前的个人预案](../chronic-health/03-respiratory.md#q394)。"],["来源","世界过敏组织严重过敏指南和《严重过敏反应急救临床实践指南》。 [WAO 指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC7607509/) · [WAO 急救步骤](https://worldallergy.org/media/PDFs/Anaphylaxis_Guidelines_Poster.pdf) · [临床急救指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC8996305/)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":365,"qid":"Q365","section":"健康","chapter":"训练相关健康","question":"户外团队出发前，应怎样约定失联、受伤或天气转坏时的联系和撤回办法？","title":"团队户外训练前，约好路线、折返时间和求助分工","fields":[["怎么做","把路线、预计返回、集合点和天气变化时的折返条件发给全队，并留一份给不同行的人。出发前确认谁带手机或导航、谁带急救用品。有人失联时按约定的最后位置和时间报告，遇受伤或紧急天气先保证人员安全，并告诉救援者位置、人数和情况。"],["成本","几分钟。无信号路段需提前准备离线地图和可用的通信安排。"],["说人话","出门前让队内外都有人知道去哪、何时回来、出事联系谁。"],["收益","户外机构建议事先留存行程，并按活动制定应急计划。明确撤回条件和分工可减少现场反复确认。"],["证据等级","C（国家公园管理机构的应急计划及团队执行示例）。"],["适用与备注","不同地区的联系方式和救援通道可在出发前查询。遇雷雨可参考[户外雷电避险](#q361)。"],["来源","美国国家公园管理局户外应急计划与出发前装备指引。 [户外应急计划](https://www.nps.gov/articles/gtgemergencyplan.htm) · [行程与装备指引](https://www.nps.gov/articles/10essentials.htm)"]],"path":"book/training-health/06-emergencies-and-weather.md","aliases":"","grades":["C"]},{"id":366,"qid":"Q366","section":"健康","chapter":"训练相关健康","question":"训练量没变但体重持续下降，哪些记录值得带去评估？","title":"训练量没变但体重持续下降，带趋势和近期变化去评估","fields":[["怎么做","如果没有主动减重，体重却持续下降，安排就医。带上近期体重及日期、训练类型和时长、食欲和用餐变化、用药及近期疾病。也记下有无腹泻、口渴、发热、心悸或疲劳等伴随症状。原来没称重记录时，可以回忆衣服变松的大概时间。"],["成本","已有记录整理几分钟。可以用最近一两周的训练表和用餐记录帮助说明。"],["说人话","体重在往下走，训练量又没增加，先查发生了什么。"],["收益","非主动体重下降可能与饮食、药物、消化道、内分泌或其他健康问题有关。运动者也可能在训练量不变时因进食减少而供应不足。"],["证据等级","C（官方症状就医指导和 IOC 共识）。"],["适用与备注","伴随新症状、下降较快或已经影响日常时尽早评估。不要因为短期补吃后秤重回升，就忽略持续的其他症状。"],["来源","英国 NHS 的非主动体重下降说明，以及 IOC 2023 年 REDs 共识。 [NHS 就医说明](https://www.nhs.uk/symptoms/unintentional-weight-loss/) · [IOC REDs 共识](https://bjsm.bmj.com/content/57/17/1073)"]],"path":"book/training-health/07-energy-and-physiology.md","aliases":"","grades":["C"]},{"id":367,"qid":"Q367","section":"健康","chapter":"训练相关健康","question":"体重看起来稳定，但不断受伤、恢复慢或表现下滑，评估能量不足时还要提供什么信息？","title":"体重稳定但反复受伤或掉表现，评估时带上训练和用餐记录","fields":[["怎么做","整理近期跑量、强度、力量课、休息和比赛安排，另记经常漏掉的餐、饭量减少的时期、体重趋势和伤病时间线。就诊时说明表现何时开始变化、伤在什么部位，以及睡眠、月经或性欲是否也变了。反复出现时，先找运动医学或全科医生评估，必要时联合运动营养专业人员。"],["成本","用现有训练日志和简短饮食记录即可。回忆不清的项目可留空。"],["说人话","秤上没变，也可以把训练、饮食和伤病放在一起看。"],["收益","IOC 共识把多项病史、症状和体征用于评估长期低能量可用性的影响。仅靠体重或短期饮食记录不足以诊断，其他疾病和训练因素也需要考虑。"],["证据等级","C（IOC 诊断与风险评估框架）。"],["适用与备注","不要靠手表热量与饮食估算自行判定。持续疲劳或运动后恢复差也可看[首版相关条目](../06-training-health.md#q37)。"],["来源","IOC 2023 年 REDs 共识，及 IOC 关于能量可用性测量的配套方法论文。 [IOC REDs 共识](https://bjsm.bmj.com/content/57/17/1073) · [配套方法论文](https://doi.org/10.1136/bjsports-2023-107359)"]],"path":"book/training-health/07-energy-and-physiology.md","aliases":"","grades":["C"]},{"id":368,"qid":"Q368","section":"健康","chapter":"训练相关健康","question":"男性提高耐力训练量后性欲明显下降，哪些情况值得评估、该带什么记录？","title":"增加耐力训练后性欲持续下降，记录时间线并安排评估","fields":[["怎么做","如果性欲明显下降且持续、令人困扰，或伴随晨勃减少、疲劳、体重或表现变化，可以预约就诊。记下症状开始时间、最近训练和用餐、减重、睡眠、压力及药物或补剂。把骨应力损伤和其他反复伤病也列出来。"],["成本","几分钟整理时间线，可从已记录的训练量开始。"],["说人话","性欲明显变了又持续，值得告诉医生，也说说最近练得多、吃得少或睡得差的情况。"],["收益","男性运动员三联征共识把性欲下降列为应结合其他线索评估的表现。IOC 同时指出，生殖功能变化有多种可能原因。"],["证据等级","C（男性运动员三联征及 IOC 共识）。"],["适用与备注","症状本身无法确定激素水平或能量供应状况。检查与后续训练安排由医疗人员结合病史决定。"],["来源","男性运动员三联征共识第二部分的识别与评估章节，以及 IOC 2023 年 REDs 共识。 [男性运动员三联征共识](https://doi.org/10.1097/JSM.0000000000000948) · [IOC REDs 共识](https://bjsm.bmj.com/content/57/17/1073)"]],"path":"book/training-health/07-energy-and-physiology.md","aliases":"","grades":["C"]},{"id":369,"qid":"Q369","section":"健康","chapter":"训练相关健康","question":"有进食障碍史或总想用运动补偿吃饭，如何识别训练规则变成负担、什么时候求助？","title":"经常想用训练补偿吃饭时，尽早找原治疗团队或专业人员","fields":[["怎么做","如果多次因为吃过某种食物就强迫自己加练、休息会很焦虑，或已经疼痛和疲劳仍难以停下，联系原治疗团队、熟悉进食障碍的医生或心理专业人员。可以直接描述一两个最近发生的例子，以及它们对吃饭、训练和生活的影响。也可找信任的人陪同。"],["成本","不需要先记录热量、体重或达到某个条件。可从一次预约开始。"],["说人话","吃完就觉得必须多练，或想休息却停不下来，这些都可以直接说给专业人员听。"],["收益","NICE 将过度运动作为可能的补偿行为，建议综合心理、行为和身体线索评估。专业支持可帮助建立合适的进食和运动安排。"],["证据等级","C（进食障碍临床指南与运动健康共识）。"],["适用与备注","有晕厥、胸痛、严重无力或其他急性危险信号时，立即寻求医疗帮助。"],["来源","NICE NG69 进食障碍识别与治疗指南及 IOC 2023 年 REDs 共识。 [NICE 建议](https://www.nice.org.uk/guidance/ng69/chapter/recommendations) · [IOC REDs 共识](https://bjsm.bmj.com/content/57/17/1073)"]],"path":"book/training-health/07-energy-and-physiology.md","aliases":"","grades":["C"]},{"id":370,"qid":"Q370","section":"健康","chapter":"训练相关健康","question":"以前得过骨应力损伤，为什么反复出现时需要和医生同时回顾进食、月经、骨健康和负荷？","title":"骨应力损伤反复出现，复评时同时回顾进食、骨健康和负荷","fields":[["怎么做","带上以前的受伤部位、时间和影像结果，整理伤前几周跑量、速度课、地面及复训进度。把最近进食或体重变化、骨折史和月经变化（如适用）告诉医生，讨论是否需进一步评估骨健康和能量供应。出现同一部位固定痛或日常走路痛时，先暂停冲击活动并尽快就诊。"],["成本","找以前的报告和训练日志。复评项目由医疗团队根据受伤部位和病史决定。"],["说人话","反复骨伤要把前几次伤、吃饭、身体变化和训练加量一起讲清楚。"],["收益","骨应力损伤的风险涉及运动负荷、骨健康和营养等因素。国际共识将既往骨应力损伤、能量可用性和适当的骨健康检查纳入评估。"],["证据等级","C（运动骨应力损伤国际共识和 IOC 指南）。"],["适用与备注","不要用一次试跑验证能否恢复。返训取决于受伤部位、症状、恢复过程和专业评估。"],["来源","骨应力损伤国际 Delphi 共识表 3–6，以及 IOC REDs 共识。 [骨应力损伤国际共识](https://bjsm.bmj.com/content/59/2/78) · [IOC REDs 共识](https://bjsm.bmj.com/content/57/17/1073)"]],"path":"book/training-health/07-energy-and-physiology.md","aliases":"","grades":["C"]},{"id":371,"qid":"Q371","section":"健康","chapter":"训练相关健康","question":"月经仍规律但经量大或经痛经常打乱训练，什么时候值得就医、该记什么？","title":"周期规律但量大或经痛影响训练，也可以看妇科","fields":[["怎么做","记经期开始和结束、最重的几天需要多频繁换卫生用品、是否漏出或有血块。疼痛则记什么时候开始、最痛到什么程度、影响了哪堂课或日常活动。量大、痛得反复影响日常，或症状明显改变时，带记录就医。"],["成本","用日历或手机即可。近期症状已经影响生活时，可以先预约。"],["说人话","周期准也可能经量大或疼得厉害。只要反复影响生活，就值得评估。"],["收益","NICE 强调经量问题对生活的影响，建议问出血性质和伴随疼痛等情况。对经量过多者，指南建议做全血细胞计数，由医生解释结果并决定其他检查。"],["证据等级","C（NICE 临床指南及 NHS 症状指引）。"],["适用与备注","大量出血伴明显头晕、快晕倒或气短时尽快急诊。怀疑怀孕时出现出血和腹痛，也应及时评估。"],["来源","NICE NG88 第 1.1–1.2 节，以及英国 NHS 和加拿大阿尔伯塔省异常子宫出血路径。 [NICE 指南](https://www.nice.org.uk/guidance/ng88/chapter/Recommendations) · [NHS 经量过多说明](https://www.nhs.uk/conditions/heavy-periods/) · [异常出血就医路径](https://myhealth.alberta.ca/HealthTopics/abnormal-uterine-bleeding-pathway/Documents/abnormal-uterine-bleeding-pathway.pdf)"]],"path":"book/training-health/07-energy-and-physiology.md","aliases":"","grades":["C"]},{"id":372,"qid":"Q372","section":"健康","chapter":"训练相关健康","question":"跑量增加后容易头晕或怕冷，又在限制饮食，去评估时怎样说明症状、训练和近期进食变化？","title":"加跑量又限制饮食后反复头晕或怕冷，带上变化记录去评估","fields":[["怎么做","头晕时先停跑、到安全位置坐下或躺下。症状反复、平时也怕冷或明显疲劳时，安排评估。带上最近跑量与强度、进食限制从何时开始、最近体重变化，以及发作在跑前、跑中还是跑后。也说清有无心悸、出血、经期变化或已经晕倒。"],["成本","用手机记下发作时间和持续多久。症状明显时先求助，再补记录。"],["说人话","头晕先停下来。反复出现时，把吃了什么、练了多少和症状发生的时间一起告诉医生。"],["收益","头晕和怕冷有多种可能原因。IOC 建议结合运动负荷、饮食与症状评估长期能量不足的可能性，同时排查其他病因。"],["证据等级","C（IOC 共识与症状分诊指引）。"],["适用与备注","运动中晕倒，或头晕伴胸痛、明显气短时，立即按[现场急症流程](06-emergencies-and-weather.md#q353)求助。"],["来源","IOC REDs 共识及英国 NHS 头晕和晕厥的症状指引。 [IOC REDs 共识](https://bjsm.bmj.com/content/57/17/1073) · [头晕指引](https://www.nhs.uk/symptoms/dizziness/) · [晕厥指引](https://www.nhs.uk/symptoms/fainting/)"]],"path":"book/training-health/07-energy-and-physiology.md","aliases":"","grades":["C"]},{"id":373,"qid":"Q373","section":"健康","chapter":"训练相关健康","question":"怀孕前就在跑步或练力量，产检时该和医生核对哪些活动选择与停练信号？","title":"怀孕前就在跑或练力量，把原计划带去产检","fields":[["怎么做","产检时说明自己平时跑多久、练哪些动作、每周练几次和大概强度，问医生当前孕期是否有运动禁忌，能继续哪些动作，跑量、用力程度和训练体位要怎么改。训练中出现阴道出血、持续阴道流液、规律且疼痛的宫缩，或休息后仍不缓解的气短或头晕时，立即停练并联系产科就医。出现胸痛、明显呼吸困难、昏厥或大量出血时，立即呼叫急救。"],["成本","把常练内容和近期症状存在手机，常规产检时带上。"],["说人话","把自己练什么说具体，再跟产科约好哪些变化需要停下来。"],["收益","无禁忌的孕妇通常可以继续适合自己的活动。把原有训练、孕期变化和停练信号一起核对，有助于在可活动的范围内继续训练。"],["证据等级","C（临床和公共卫生指南。按孕期和个人病史调整）。"],["适用与备注","想延续长距离、高强度或高负重训练时，尤其需要逐项讨论。产检后出现新症状或医嘱变化，要重新核对。"],["来源","美国妇产科医师学会第 804 号意见书的建议及停止运动警示、澳大利亚卫生部门孕期活动指南「Warning signs to stop physical activity」与美国 CDC 孕产期警示信号。 [美国妇产科医师学会指南](https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2020/04/physical-activity-and-exercise-during-pregnancy-and-the-postpartum-period) · [澳大利亚孕期活动指南](https://www.health.gov.au/sites/default/files/2023-11/physical-activity-during-pregnancy-guidelines-brochure.pdf) · [CDC 孕产期警示信号](https://www.cdc.gov/hearher/maternal-warning-signs/index.html)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["C"]},{"id":374,"qid":"Q374","section":"健康","chapter":"训练相关健康","question":"怀孕后从久坐开始活动，怎样根据孕期变化调整活动方式？","title":"孕前久坐，从走一小段开始，随孕期变化调活动","fields":[["怎么做","产检确认适合活动后，先用几次短时间的轻松散步起步，也可选自己熟悉的固定自行车或水中活动。做得舒服后，逐步增加活动日或延长时间。到中等强度时，通常还能说话。腹部变大、平衡或舒适感改变后，可改走平路、降低冲击或换成更稳定的动作。"],["成本","先在平整、安全的地方走，穿合脚的鞋。有条件时可用家中固定车或社区设施。"],["说人话","以前很少动，先从自己走得舒服的一小段开始。孕期变化了，活动也跟着换。"],["收益","在无运动禁忌的孕妇中，指南支持从原有水平逐步增加活动，并为有条件的人提供每周至少 150 分钟中等强度活动的目标。"],["证据等级","C（加拿大孕期活动指南给出人群目标和循序渐进原则。起步方式要看个人活动水平、孕期状况和耐受）。"],["适用与备注","150 分钟是可逐步接近的周目标。出现新症状、产检发现异常或原有疾病控制变化时，先核对 [停练信号和产科建议](#q373)。"],["来源","加拿大 2019 年孕期身体活动指南建议 1–4 和运动说明；澳大利亚孕期活动指南「How much physical activity should I do?」及谈话测试。 [加拿大孕期指南](https://bjsm.bmj.com/content/52/21/1339) · [澳大利亚孕期活动指南](https://www.health.gov.au/sites/default/files/2023-11/physical-activity-during-pregnancy-guidelines-brochure.pdf)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["C"]},{"id":375,"qid":"Q375","section":"健康","chapter":"训练相关健康","question":"产后准备恢复跑跳，如何把日常活动能力、盆底症状和专业评估放进回归计划？","title":"产后先把日常活动做稳，再安排回到跑跳","fields":[["怎么做","在合适的产后随访时说明想恢复跑步或跳跃，请医疗或盆底康复人员一起看伤口愈合、出血、盆底症状和活动能力。先从轻松走路恢复，观察走路、上下楼和低冲击练习是否会引起漏尿、坠胀或肌骨疼痛。走得稳定且冲击准备经评估合适后，再从简单的走跑交替开始，每次小幅增加时间或跑量。"],["成本","用短步行练习和简单记录起步。有剖宫产、撕裂、持续疼痛或盆底症状时，把专业评估纳入安排。"],["说人话","想跑之前，先看日常走动、楼梯和低冲击活动做得怎样，再把跑步一点点接回来。"],["收益","逐步恢复能让你在增加冲击前观察伤口、出血和盆底反应。返跑共识把无盆底和肌骨症状的 30 分钟步行列为一个实用里程碑。"],["证据等级","C（产后活动指南与国际 Delphi 专家共识。步行里程碑用于评估，不能单独确定何时可以开始跑跳）。"],["适用与备注","加拿大指南建议伤口充分愈合且活动时恶露不增加后，逐步进入中高强度活动。产后具体进度随分娩、愈合和症状而变。增加冲击后有漏尿或坠胀，见 [调整冲击与就诊](#q376)。"],["来源","加拿大 2025 年产后活动指南第 6 项建议；2024 年国际产后返跑共识「Consensus on load and impact screen for return to running」和返跑方案中的步行与走跑交替段落。 [加拿大产后活动指南](https://bjsm.bmj.com/content/59/8/515) · [产后返跑准备共识](https://bjsm.bmj.com/content/58/6/299) · [产后返跑方案共识](https://bjsm.bmj.com/content/58/4/183)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["C"]},{"id":376,"qid":"Q376","section":"健康","chapter":"训练相关健康","question":"恢复跑跳时出现漏尿或盆底坠胀，怎样调整冲击并判断何时找专业人员？","title":"跑跳时漏尿或坠胀，先退到没有症状的活动","fields":[["怎么做","若走跑交替中的跑步段出现漏尿、阴道坠胀或压力感，当次先停跑，改走路。如果走路也不舒服，就结束这次训练。记下触发的动作、时间、是否持续到活动后。反复出现、影响日常活动，或摸到阴道口有膨出时，联系妇产科或有盆底康复经验的专业人员评估。"],["成本","先换成走路或其他无症状的低冲击活动，留一份症状记录方便就诊。"],["说人话","一跑就漏尿或有坠胀感，先把跑段撤掉。带着记录去看，方便找下一步怎么恢复。"],["收益","少做会反复引发症状的冲击动作，可给评估和康复留出时间。对于确诊的压力性尿失禁或混合性尿失禁，临床指南支持在指导下做盆底肌训练。"],["证据等级","C（降低冲击参考产后返跑专家共识。盆底训练来自特定诊断的临床指南）。"],["适用与备注","漏尿与坠胀可能需要不同评估。若有突然大量阴道出血、严重疼痛、发热或呼吸困难，应立即就医。"],["来源","国际产后返跑方案共识表 6；英国 NICE NG210「Managing pelvic floor dysfunction」中的盆底肌训练，及产后护理指南 NG194 产妇应获告知的就医症状。 [返跑时的盆底症状](https://bjsm.bmj.com/content/58/4/183) · [盆底功能障碍指南](https://www.nice.org.uk/guidance/ng210/chapter/Recommendations) · [产后护理指南](https://www.nice.org.uk/guidance/ng194/chapter/Recommendations)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["C"]},{"id":377,"qid":"Q377","section":"健康","chapter":"训练相关健康","question":"围绝经期潮热和睡眠问题影响训练，怎样调整训练时段与强度并判断是否就医？","title":"潮热或睡眠差时，把难练的课放到状态较好的时段","fields":[["怎么做","记几天潮热、夜醒、咖啡因和训练时间。若晚间强度课后更难入睡，可把它挪到较早的时段，或暂时改成轻松训练。潮热明显时选通风凉快的场地，穿方便增减的衣物。连着几天睡差、训练时特别吃力时，可先缩短或减轻一堂课，再看能否恢复。症状持续妨碍睡眠、工作或训练时，带记录去看全科或妇科。"],["成本","用原有训练日志记录时间与症状，只调一项来比较。治疗选择可在门诊讨论。"],["说人话","哪段时间睡得好、练得舒服，就先把难课放到那段时间附近。"],["收益","有机会找到较能持续的训练时段。潮热与夜醒持续影响生活时，临床指南有针对症状和睡眠的治疗选项。"],["证据等级","C（更年期临床指南支持管理症状。调整训练时间、强度和环境是便于继续训练的办法，运动缓解潮热的直接证据不足）。"],["适用与备注","潮热或夜汗伴有不明原因体重下降、发热，或出现与以往不同的持续症状时，联系医疗人员评估原因。"],["来源","英国 NICE NG23 的「Vasomotor symptoms」「Sleep problems」与复查建议；更年期学会 2023 年非激素治疗立场的「Exercise」；英国 NHS 夜汗就诊说明。 [更年期临床指南](https://www.nice.org.uk/guidance/ng23/chapter/recommendations) · [更年期学会立场](https://menopause.org/wp-content/uploads/professional/2023-nonhormone-therapy-position-statement.pdf) · [夜汗就诊说明](https://www.nhs.uk/symptoms/night-sweats/)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["C"]},{"id":378,"qid":"Q378","section":"健康","chapter":"训练相关健康","question":"过去一年摔过跤或走路不稳，开始力量和平衡训练前怎样安排安全环境和支持？","title":"有跌倒史或走路不稳，先把练习环境和支持安排好","fields":[["怎么做","先记过去一年摔了几次、当时在做什么、有没有受伤或需要别人扶起。练习区域保证光线和防滑，移开电线、松地毯等绊倒物，旁边有稳固支撑。刚开始可请家人陪同，或让康复专业人员先示范适合的力量与平衡练习。反复跌倒、摔倒伴失去意识、曾经摔倒后无法自行起身或跌伤需要治疗时，先请医疗人员做跌倒评估。"],["成本","先整理现有场地、照明和支撑。需要时安排社区或门诊评估。"],["说人话","练平衡之前，先选一个站不稳时能扶住、有人知道你在练的地方。"],["收益","试验的综合结果显示，有针对性的运动能降低社区老年人的跌倒发生率。环境检查和按风险安排练习支持，有助于把训练做得更安全。"],["证据等级","A（社区老年人跌倒预防运动有系统综述证据）。C（个体评估分流与环境措施依据临床指南和卫生行业标准）。"],["适用与备注","有一次跌倒且伴步态或平衡受损的老年人，可评估后使用防跌倒运动方案。先用评估确定需要的保护与难度，再逐步增加挑战。"],["来源","英国 NICE NG249 的「Comprehensive falls assessment」及社区既往一次跌倒且步态或平衡受损条款；国家卫生健康委 WS/T 887—2026 的跌倒环境危险因素；美国预防服务工作组 2024 年证据综述图 3。 [跌倒评估与预防指南](https://www.nice.org.uk/guidance/ng249/chapter/Recommendations/) · [中国社区老年人跌倒预防标准](https://www.nhc.gov.cn/wjw/c100310/202603/1ec62b306fa9451a836e5a21fe1e2ce8.shtml) · [防跌倒干预证据](https://www.uspreventiveservicestaskforce.org/uspstf/document/final-evidence-summary/falls-prevention-community-dwelling-older-adults-interventions)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["A","C"]},{"id":379,"qid":"Q379","section":"健康","chapter":"训练相关健康","question":"中老年练力量时，怎样把握力下降、起立变慢或活动能力变化记录下来，哪些变化值得评估？","title":"把握力、起立和实际活动能力的变化记下来","fields":[["怎么做","选一件平时常做的事，例如从固定椅子起身、走固定路线或提常买的东西，记录何时开始费力、要不要用手撑或请人帮忙。有握力计时，尽量用同一设备、同一只手、同一体位，记录具体数值。起立只在确定安全时记录，已经站不稳就先请人评估。几次相近条件下都明显变差，或者开始影响走路、爬楼和起身时，带记录去评估。"],["成本","家里可从实际活动的变化记起。系统测量可在体检、社区或康复评估时安排。"],["说人话","记下来以前怎么起来、现在要扶几下，比只说「最近没劲」具体。"],["收益","握力能反映肌肉力量，起立和走路能反映身体功能。记录这些变化，可帮助医疗或康复人员判断是否需要进一步测肌肉量、力量和功能。"],["证据等级","C（中国成年肌少症食养指南和亚洲肌少症工作组共识。家庭记录可作线索，临床评估需要标准化）。"],["适用与备注","关节痛、急病和环境变化也会影响表现。若忽然出现一侧无力、口角歪斜或言语不清，应当立即呼叫急救。"],["来源","国家卫生健康委《成人肌少症食养指南（2026年版）》风险筛查、临床评估与握力测量；亚洲肌少症工作组 2025 年共识的肌力和体能结局部分；国家卫生健康委脑卒中识别要点。 [成人肌少症食养指南发布页](https://www.nhc.gov.cn/sps/c100087/202604/a69d2fce21e040dc96cbc40b923a06d3.shtml) · [亚洲肌少症工作组共识](https://doi.org/10.1038/s43587-025-01004-y) · [脑卒中快速识别](https://www.nhc.gov.cn/ylyjs/zcwj/202210/07a1b6550af3423f930e73f7148df988.shtml)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["C"]},{"id":380,"qid":"Q380","section":"健康","chapter":"训练相关健康","question":"经医生评估没有骨质疏松，但更年期后希望保住骨量，怎样选择负重活动和抗阻训练？","title":"绝经后想保住骨量，把负重活动和抗阻都安排上","fields":[["怎么做","无已知骨质疏松、脆性骨折史或运动禁忌时，可以继续走路、爬楼或做能耐受的负重活动，同时每周安排两天练主要肌群，例如坐站、深蹲、提踵和推拉。先选择能做稳的重量和动作，逐步增加阻力。想加入小跳或跑步时，先确认自己目前的平衡、关节和冲击耐受。"],["成本","从楼梯、稳固椅子及现有抗阻器械开始。起步也可用可调重量的器材，便于小幅增加负荷。"],["说人话","平时多走动，另外给腿、髋和上肢一些逐步增加的阻力。"],["收益","绝经后女性的运动干预综述发现，和对照相比，运动组的腰椎、股骨颈和全髋骨密度平均结果更好。适合长期坚持的负重与抗阻训练可用来支持骨骼和功能。"],["证据等级","A（绝经后骨密度结果来自干预研究系统综述，方案和人群存在差异）。C（训练动作选择和逐步加量参考骨健康共识）。"],["适用与备注","有低冲击骨折史、明显平衡障碍、新出现持续背痛，或后来评估显示骨质疏松时，先和医生或康复人员复核冲击及负重安排。"],["来源","Mohebbi 等 2023 年绝经后运动与骨密度综述的摘要、骨密度结果及正常骨密度分组；英国「Strong, steady and straight」共识的骨骼训练部分；美国运动医学会 2026 年抗阻训练立场表 6。 [运动与绝经后骨密度综述](https://link.springer.com/article/10.1007/s00198-023-06682-1) · [骨健康训练共识](https://bjsm.bmj.com/content/early/2022/04/24/bjsports-2021-104634) · [美国运动医学会抗阻立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/training-health/08-life-stages.md","aliases":"","grades":["A","C"]},{"id":381,"qid":"Q381","section":"健康","chapter":"常见慢病与运动","question":"已确诊高血压且病情稳定，怎样在医生建议下安排有氧和抗阻，并记录运动前后血压？","title":"高血压稳定后，按约定的强度练并分开记录静息与运动后血压","fields":[["怎么做","和医生约好什么血压、症状下可以练，什么情况该暂缓，以及哪些训练前后需要测量。获准后可先选快走、骑车等熟悉的有氧活动，从能坚持的时长起步，逐步达到双方商定的周量。抗阻选能顺畅呼吸的重量和动作，逐步练到主要肌群，同一部位训练隔天做。按约定在运动前安静坐好测量，运动后先慢下来，再在约定时间测。记下间隔、血压、训练强度及有无头晕等不适。"],["成本","准备尺寸合适的上臂式血压计，留几分钟热身、放松和记录。快走和轻度弹力带可在家附近完成。"],["说人话","先把快走练得规律，再把力量训练排进一周。刚练完的血压单独记，复查时让医生知道是几分钟后测的。"],["收益","规律有氧和抗阻有助于血压管理。我国基层指南给出的常见安排是中等强度有氧多日练，抗阻每周 2–3 天且同一部位隔天。个人起点根据既往活动、血压控制和合并症确定。"],["证据等级","C（运动安排和监测依据国家指导原则与基层指南，血压日志为实务建议）。"],["适用与备注","有心脑血管等合并症，按医生安排决定是否需运动评估。若训练时胸痛、昏厥或严重气短，立即停止并呼叫急救。复测异常或运动后反复头晕，联系医疗团队；日常家庭静息血压的标准化测量见 [家庭复测](../training-health/01-screening.md#q290)。"],["来源","国家卫生健康委高血压营养和运动指导原则、国家基层高血压防治管理指南 2025 版、AHA/红十字会急救指南。 [高血压运动指导](https://www.chinacdc.cn/jkyj/mxfcrxjb2/jswj13947/202410/P020241010504676964420.pdf) · [基层指南](https://cs.medjournals.cn/article/doi/full/10.3760/cma.j.cn112148-20250401-00234) · [急救指南](https://cpr.heart.org/en/resuscitation-science/2024-first-aid-guidelines)"]],"path":"book/chronic-health/01-cardiovascular.md","aliases":"","grades":["C"]},{"id":382,"qid":"Q382","section":"健康","chapter":"常见慢病与运动","question":"使用影响心率的药物时，运动表的心率区间还能怎么用，怎么和医生确定强度？","title":"用药让心率反应变慢时，按医生约定的体感或心率训练","fields":[["怎么做","把药名、服用时间、手表的心率区间和典型训练记录带给医生，问用药时该用谈话测试、主观用力程度，还是使用评估后确定的个人心率区间。有氧运动获准做到中等强度时，可把还能连贯说话作为辅助线索。先用手表记录同样强度下的变化，把运动时长、体感和症状一起记。"],["成本","口头描述体感和用手表记趋势无需添设备。有些人需要由专业人员安排运动测试来确定强度。"],["说人话","同样的快走，用药后手表可能显示更低的心率。数字没到默认区间时，照原先约定的强度走，别为追数字再提速。"],["收益","如 β 受体阻滞剂可使运动时心率升幅变小，影响程度因人而异。用医生认可的个体区间或谈话、体感，可以减少把通用年龄公式套到自己身上的误差。"],["证据等级","C（强度选取依据国家运动指导原则和 AHA 专业资料）。"],["适用与备注","既往因心梗、心衰或其他疾病有特别限制的人，以心内科或康复团队书面计划为准。若近期用药方案已改变，复诊前按原医嘱并询问运动区间是否需要重新评估。"],["来源","国家卫生健康委高血压营养和运动指导原则、美国心脏协会 β 受体阻滞剂与运动说明。 [国内运动指导](https://www.chinacdc.cn/jkyj/mxfcrxjb2/jswj13947/202410/P020241010504676964420.pdf) · [AHA 说明](https://www.heart.org/en/health-topics/consumer-healthcare/medication-information/how-do-beta-blocker-drugs-affect-exercise)"]],"path":"book/chronic-health/01-cardiovascular.md","aliases":"","grades":["C"]},{"id":383,"qid":"Q383","section":"健康","chapter":"常见慢病与运动","question":"血脂偏高但没有心血管症状，怎样设定可坚持的运动计划，复查时看哪些结果？","title":"血脂偏高就从能坚持的运动起步，复查看血脂和总体风险","fields":[["怎么做","选一种方便经常做的有氧活动，如快走或骑车，先把几段短时间放进一周。适应后先增加时长，再按体力和医生建议加抗阻。记下每周实际做的频次和分钟数。带原血脂结果复诊，确认哪一项偏高、什么时候复查，并让医生结合病史、血压、吸烟等判断心血管风险和目标。"],["成本","走路或骑行可融入通勤，按约定复查血脂。训练记简短的周总结即可。"],["说人话","先排一份忙的时候也做得了的计划。复查把运动记录和化验单一起带上，看看哪些动作做得下来、哪项血脂需要继续管。"],["收益","规律活动是血脂管理的一部分。我国血脂指南通常以低密度脂蛋白胆固醇（LDL-C）作为主要干预目标，医生也会按情况关注甘油三酯等其他指标。运动期间的化验变化也会受饮食、体重、药物等影响。"],["证据等级","C（运动安排和血脂复查重点来自国内指导原则和临床指南）。"],["适用与备注","无症状也可有较高中长期风险。LDL-C 明显偏高、家族有早发心血管疾病，或已经有相关心血管病时，先和医生确认风险及计划后再加到高强度。使用他汀期间出现异常或持续肌痛，及时联系医生。"],["来源","国家卫生健康委高脂血症营养和运动指导原则、中华医学会发布的《中国血脂管理指南（2023 年）》。 [运动指导](https://www.chinacdc.cn/jkyj/mxfcrxjb2/jswj13947/202410/P020241010505258647825.pdf) · [血脂管理指南](https://rs.yiigle.com/cmaid/1449955)"]],"path":"book/chronic-health/01-cardiovascular.md","aliases":"","grades":["C"]},{"id":384,"qid":"Q384","section":"健康","chapter":"常见慢病与运动","question":"心梗或做过支架后想恢复锻炼，怎样了解心脏康复和自行训练的分工？","title":"心梗或支架术后，先约心脏康复，再按计划在家练","fields":[["怎么做","出院前或复诊时，请心内科安排心脏康复转介。带出院小结、手术资料和正在用的药，问清复诊前可以走多少、暂时要避开哪些活动，以及什么时候评估抗阻和更高强度。康复团队通常做风险和体能评估、选择强度、观察反应并教会你何时停。拿到居家计划后，按约定做在家能完成的活动，记录时长、体感和症状。"],["成本","初期需要评估和一些随访时间。往返不便时，可以问有无团队指导的居家或远程心脏康复。"],["说人话","康复门诊帮你定起点、看反应和调计划。居家训练负责把那些已明确可以做的活动练起来。"],["收益","对适合参加的冠心病患者，以运动为基础的心脏康复可减少再发心梗和住院，并有助于恢复功能和生活质量。急性冠脉综合征指南建议出院前完成转介。"],["证据等级","A（整体康复获益有随机试验综合支持，何时开始和居家如何练由团队评估）。"],["适用与备注","急性心梗后、择期支架术后及有并发症时，起点和进度可不同，按出院与康复团队安排。活动遇到新的胸部压迫、昏厥或严重呼吸困难时，立即停止并呼叫急救。"],["来源","《中国冠心病康复循证实践指南（2024 版）》、美国 2025 年急性冠脉综合征指南与冠心病运动康复 Cochrane 综述。 [中国康复指南](https://video.yiigle.com/uploads/guide_html/6363.html) · [2025 急性冠脉综合征指南](https://doi.org/10.1161/CIR.0000000000001309) · [康复综述](https://www.cochrane.org/evidence/CD001800_exercise-based-rehabilitation-coronary-heart-disease)"]],"path":"book/chronic-health/01-cardiovascular.md","aliases":"","grades":["A"]},{"id":385,"qid":"Q385","section":"健康","chapter":"常见慢病与运动","question":"已确诊稳定心力衰竭，怎样与医疗团队约定活动起点、监测变化和停练条件？","title":"稳定心衰先定活动起点，再和团队写明停练和联络条件","fields":[["怎么做","与医疗团队确认病情目前是否稳定、是否适合心脏康复或需要有人监督。把起点写具体，例如适合的步行路线、每段走多久、中途如何休息、用什么体感判断、谁来决定加量。按团队要求记录活动中的气短和疲劳、每日晨起同条件体重、脚踝肿胀及约定的血压或心率。问清读数比平时变化多少要打电话，以及在什么症状下暂停计划。"],["成本","准备体重秤和简短记录，视个人情况安排心脏康复或随访。首次就诊可以直接出示自己目前能走多远、上楼需不需要停。"],["说人话","先定走多远、走累了怎么停，再定体重突然上升或比平时更喘时打给谁。"],["收益","对经评估适合运动的稳定心衰患者，规律有氧活动和适当的康复训练有助于改善活动耐量和生活质量。记录体重及症状变化可以帮助医疗团队识别病情变化。"],["证据等级","C（个人活动起点、监测与停练方案依据国内指南和心衰管理机构资料）。"],["适用与备注","新出现或加重的气短、平躺憋气、下肢肿胀或体重突然增加时，暂停训练，按预先约定尽快联系团队。若静息时突发严重呼吸困难、胸痛、昏厥或意识异常，立即呼叫急救。"],["来源","《中国心力衰竭诊断和治疗指南 2024》心衰管理和运动康复章节，美国心脏协会的心衰症状监测与自查计划。 [国内心衰指南](https://csc.cma.org.cn/art/2024/4/18/art_619_56221.html) · [AHA 症状监测](https://www.heart.org/en/health-topics/heart-failure/warning-signs-of-heart-failure/managing-heart-failure-symptoms) · [心衰自查计划](https://www.heart.org/professional/-/media/Files/Health-Topics/Heart-Failure/HF-Symptom-Tracker.pdf)"]],"path":"book/chronic-health/01-cardiovascular.md","aliases":"","grades":["C"]},{"id":386,"qid":"Q386","section":"健康","chapter":"常见慢病与运动","question":"有糖尿病前期，怎样把饭后活动和每周锻炼排进生活，如何复盘计划是否能持续？","title":"把饭后走路接到固定的一餐，用一周实做分钟数复盘","fields":[["怎么做","挑最容易安排的一餐，例如工作日午饭或晚饭，饭后走一段短而熟悉的路，忙时缩短也可以。再在一周里挑几个能留出时间的日子做快走或骑车。写下走了几次、累计多少分钟、哪天最难做到。两周后先改一个障碍，例如把晚间独走改成午饭后和同事走。"],["成本","一次可以从 10 分钟左右试起，利用现成的路，无需设备。复查时间与医生约定。"],["说人话","先把原本会坐着的一顿饭后，改成走一个小圈。能做得长久，再逐步加到其他日子。"],["收益","小样本试验发现，有糖耐量受损风险的老年人饭后短走可改善当天血糖。美国糖尿病学会建议对超重或肥胖、糖尿病风险高的成人考虑参加预防项目，逐步达到每周至少 150 分钟中等强度活动，配合其他生活方式调整。"],["证据等级","B（饭后短走来自小样本试验，长期预防的证据来自综合生活方式干预，包含但不限于运动）。"],["适用与备注","适用于已由医疗人员告知有糖尿病前期的人，已有活动限制时按医嘱。复盘除了运动分钟数，也按约定复查血糖或糖化血红蛋白。"],["来源","美国糖尿病学会 2026 年糖尿病预防标准、DiPietro 等饭后步行对照试验。 [ADA 预防标准](https://doi.org/10.2337/dc26-S003) · [饭后步行试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC3781561/)"]],"path":"book/chronic-health/02-metabolic.md","aliases":"","grades":["B"]},{"id":387,"qid":"Q387","section":"健康","chapter":"常见慢病与运动","question":"有 2 型糖尿病，怎样与医生商量有氧和力量训练的顺序、强度和监测？","title":"2 型糖尿病先把两种运动排进一周，再和医生定同天顺序","fields":[["怎么做","带当前用药、既往低血糖记录和想做的运动去咨询。先问是否适合从快走等中等强度有氧和轻量抗阻起步，哪些日子可以分开做，同天练时哪个先做。再问第一次做或延长运动时，需要什么时候测血糖、该记哪些症状。若团队建议比较两种顺序，尽量保持运动时长、强度和与用餐的间隔相近，按约定记血糖和体感。"],["成本","先用熟悉的动作，不急着增购器材。按医生制定的监测方案记录并随访。"],["说人话","先问怎样把快走和力量训练都做得下去。谁在前面，和医生结合自己的用药、目标以及血糖反应商量。"],["收益","指南支持适宜的 2 型糖尿病成人规律进行有氧与抗阻。一项针对绝经后 2 型糖尿病女性的小型交叉试验发现，运动顺序可能影响单次训练中的血糖变化。可承受的强度和实际监测结果有助于把计划定得更具体。"],["证据等级","C（长期两类运动安排依据指南，顺序证据主要来自单次、小样本研究）。"],["适用与备注","有近期低血糖、足部伤口、视网膜病变或心血管疾病时，先让团队判断项目与强度。使用胰岛素或其他易致低血糖药物时，一起约定 [长时间运动预案](#q388)。"],["来源","《中国 2 型糖尿病运动治疗指南（2024 版）》、美国糖尿病学会 2026 年运动标准、2 型糖尿病成人有氧和抗阻顺序的对照试验。 [中国运动指南](https://cs.medjournals.cn/article/doi/full/10.3760/cma.j.cn115791-20240528-00294) · [ADA 指南](https://doi.org/10.2337/dc26-S005) · [顺序研究](https://pubmed.ncbi.nlm.nih.gov/40483141/)"]],"path":"book/chronic-health/02-metabolic.md","aliases":"","grades":["C"]},{"id":388,"qid":"Q388","section":"健康","chapter":"常见慢病与运动","question":"用胰岛素或其他可能引起低血糖的药物时，长时间运动前要和医疗团队约定哪些预案？","title":"用易致低血糖的药时，长课前把测糖、补糖和求助写成预案","fields":[["怎么做","把运动路线、计划时间、用药和过去低血糖经过告诉糖尿病团队。请团队写明什么情况可以出发或要推迟，途中何时测，出现低血糖怎样补快速糖和复测，运动后和夜间何时继续查。带上约定的快速糖和监测用品，若使用连续血糖监测，另问读数和症状不符时怎样用指尖血复核。让同伴知道你可能低血糖、补给放哪、需要时怎样联系急救。若已开具胰高血糖素，请团队教同伴使用。"],["成本","准备一套能随身拿到的用品，和同伴过一遍预案。改变运动时长或路线时，确认补给和求助是否仍可行。"],["说人话","出门前就定好什么时候测、偏低怎么处理、谁来帮忙。练完以后也可能继续下降，记得按约定查。"],["收益","胰岛素和某些促泌剂会增加运动中及运动后低血糖风险。事先约定症状和读数的处理顺序，可帮助及时停练和处理。"],["证据等级","C（预案、低血糖识别和急救依据国内运动指南、ADA 临床标准及官方急救资料）。"],["适用与备注","怀疑低血糖时先停止活动，有条件尽快测量，按已约定的方案处理。若意识明显异常、抽搐、昏迷或不能安全吞咽，立即呼叫急救，不喂饮食。受过培训的人可按预案使用已为患者开具的胰高血糖素。何时恢复长时间训练由医疗团队确认。"],["来源","国家卫生健康委高血糖症营养和运动指导原则、ADA 2026 年低血糖标准的葡萄糖处理、胰高血糖素章节和表 6.7，以及英国 NHS 低血糖处理说明。 [国内运动指导](https://www.gov.cn/zhengce/zhengceku/202407/P020240701700334584645.pdf) · [ADA 低血糖标准全文 PDF](https://diabetesjournals.org/care/article-pdf/49/Supplement_1/S132/848848/dc26s006.pdf) · [NHS 急救说明](https://www.nhs.uk/conditions/low-blood-sugar-hypoglycaemia/)"]],"path":"book/chronic-health/02-metabolic.md","aliases":"糖尿病用药 长时间运动监测","grades":["C"]},{"id":389,"qid":"Q389","section":"健康","chapter":"常见慢病与运动","question":"体重较高且走一会儿关节就不舒服，怎样选择可持续的低冲击活动起步？","title":"走一会儿关节就痛，换一项低冲击活动短时间试起","fields":[["怎么做","挑一种方便且做起来舒服的活动，例如低阻力固定自行车或水中走路。也可把平地步行分成几小段。先试短一点，观察运动中、当晚和次日的疼痛、肿胀和走路情况。能持续、关节没有明显加重时，先延长一点时间或增加一次练习。若某一种活动反复引发不适，就减量或换另一种方式。"],["成本","分段平地走不需要器材。固定车或泳池有场地费用，按能长期使用的条件选。"],["说人话","先选做完后关节也能接受的活动。走路不舒服时，可试骑车、水中走路，或把一趟走路拆成几趟。"],["收益","国内体重管理指导原则建议依据体能和健康状况渐进安排活动，并列出步行、骑车、游泳等选项。若经评估有骨关节炎，临床指南也支持按人调整有氧及肌力训练，长期可以改善疼痛和功能。"],["证据等级","C（项目选择和循序加量依据体重管理及关节临床指南，具体方式看个人耐受）。"],["适用与备注","疼痛原因尚未明确且反复影响走路时，可请医生或康复专业人员评估。若突然明显肿胀、关节红热伴发热，或受伤后无法承重，尽快就医。"],["来源","国家卫生健康委《体重管理指导原则（2024 年版）》附表 9、英国 NICE 骨关节炎指南运动章节、英国 NHS 关节疼痛就医提示。 [国内体重管理指导](https://www.nhc.gov.cn/wjw/ylyjs/202412/b3d40e0141834897808ce6c9dce76a60/files/1736390749000_59785.pdf) · [NICE 运动建议](https://www.nice.org.uk/guidance/ng226/chapter/Recommendations) · [NHS 就医提示](https://www.nhs.uk/symptoms/joint-pain/)"]],"path":"book/chronic-health/02-metabolic.md","aliases":"","grades":["C"]},{"id":390,"qid":"Q390","section":"健康","chapter":"常见慢病与运动","question":"有慢性肾病，怎样和医生确定运动强度、恢复和饮水约束？","title":"有慢性肾病，和肾科先定可耐受的运动和饮水方案","fields":[["怎么做","告诉肾科当前每周活动量、合并疾病、是否透析以及现有饮水要求。和团队约定先做哪种活动、每段多长、可以练到什么体感、次日恢复到什么程度再加量。问清热天或出汗较多时怎样执行液体计划，运动饮料是否适合，以及运动后何时需要报告气短、头晕、水肿或体重变化。正在透析时，再问治疗日与非治疗日怎样安排、怎样保护血管通路。"],["成本","带近期血压、体重、透析和活动记录就诊，选日常容易完成的运动。按个人照护计划决定监测用品。"],["说人话","慢性肾病也能在能力范围内活动。先问明能练到多累，运动出汗时怎么喝也要按肾科方案。"],["收益","KDIGO 建议成人中等强度活动累计每周至少 150 分钟，或达到心血管和身体能耐受的水平，并考虑跌倒风险和体弱情况。液体需要因肾功能、症状、合并症及治疗方式而异。"],["证据等级","C（运动建议与分层依据 KDIGO，液体管理参考肾脏专业机构，具体限量由团队个别确定）。"],["适用与备注","已有液体限制时按原计划执行，不自行按出汗量加倍补水。若运动后反复不适、新出现水肿或体重快速变化，暂停训练并联系团队。胸痛、晕厥或严重呼吸困难，立即呼叫急救。"],["来源","KDIGO 2024 慢性肾病指南第 3.2.2 节、英国肾脏协会生活方式指导、美国 NIDDK 血液透析说明。 [KDIGO 指南](https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf) · [英国肾脏协会](https://www.ukkidney.org/clinical-resources/ckd-guide-resources/primary-care/lifestyle-factors/) · [NIDDK 透析资料](https://www.niddk.nih.gov/health-information/kidney-disease/kidney-failure/hemodialysis)"]],"path":"book/chronic-health/02-metabolic.md","aliases":"","grades":["C"]},{"id":391,"qid":"Q391","section":"健康","chapter":"常见慢病与运动","question":"已确诊哮喘，怎样把热身、症状监测和医生制定的哮喘行动计划放到一次训练里？","title":"带上哮喘行动计划，按热身、观察和收操安排一次训练","fields":[["怎么做","出门前看今天是否已有喘鸣、胸紧、咳嗽或最近夜里因哮喘醒来，按行动计划判断是否适合照常活动。携带医生指定的吸入药，确认哪些情况需要用、怎么用。状态稳定时从轻松活动开始，逐步加快。训练中若出现胸紧、喘鸣、反复咳嗽或超出平时的气短，停下来按计划处理，记录发生时的强度、环境和恢复情况。"],["成本","预留热身和收操，带上吸入药和电子或纸质行动计划。复诊时可请医生再次核对吸入方法。"],["说人话","平时能练的日子照常练。先热身，真喘起来马上停，按写好的步骤处理。"],["收益","控制稳定的哮喘患者能从规律活动中获益。充分热身可减少运动诱发气道收缩，行动计划可让你更早处理症状、知道何时就医。"],["证据等级","C（热身可参考运动诱发气道收缩研究，整堂课和自我处置按临床指南及个人行动计划）。"],["适用与备注","训练中反复出现症状或缓解药使用比平常多时，预约复诊。气喘严重到说不出完整句子、很快恶化或按计划处置仍无明显缓解时，尽快呼叫急救。"],["来源","全球哮喘防治创议 2026 年报告的身体活动与行动计划章节、中国《支气管哮喘防治指南（2024 年版）》、美国胸科学会运动诱发支气管收缩指南。 [GINA 2026](https://ginasthma.org/wp-content/uploads/2026/05/GINA-2026-Strategy-Report-WMS.pdf) · [中国哮喘指南](https://rs.yiigle.com/cmaid/1532201) · [ATS 运动指南](https://www.thoracic.org/statements/resources/allergy-asthma/exercise-induced-bronchoconstriction.pdf)"]],"path":"book/chronic-health/03-respiratory.md","aliases":"","grades":["C"]},{"id":392,"qid":"Q392","section":"健康","chapter":"常见慢病与运动","question":"哮喘患者在寒冷干燥或花粉多的日子，怎样判断改场地、降强度或暂停？","title":"寒冷或花粉多时，按已知诱因和当天症状决定在哪练","fields":[["怎么做","先看当地花粉、气象和空气质量提示，再结合自己过去在哪些条件下容易喘。花粉敏感且预报偏高时，可以改为室内、选暴露较低的时段或缩短户外时间。寒冷干燥空气容易引出症状时，选择室内，或从室内热身、降低强度开始。确诊运动诱发气道收缩者，也可和医生讨论冷天用能保暖保湿的运动面罩。已有咳喘或胸紧时按行动计划决定暂停。"],["成本","看一次预报，预备室内路线或轻量训练。一般可以先用现有场地。"],["说人话","看预报也看自己。上次这种天气一跑就咳，今天就先改室内或练轻一点。"],["收益","气道对冷干空气或过敏原的反应因人而异。针对自己的已知诱因减少暴露，有助于避免当次不适。能加温加湿的面罩对冷天运动诱发的气道收缩可能有帮助，但证据有限。"],["证据等级","C（针对性减少暴露依据 GINA，冷空气面罩依据 ATS 的低确定性建议）。"],["适用与备注","热身就出现明显胸紧、喘鸣或异常气短时先停，按 [哮喘行动计划](#q391) 处理。换场地后仍反复发作，带环境与症状记录复诊。"],["来源","全球哮喘防治创议 2026 年报告的室外过敏原与运动章节、美国胸科学会运动诱发支气管收缩指南的冷天气建议。 [GINA 2026](https://ginasthma.org/wp-content/uploads/2026/05/GINA-2026-Strategy-Report-WMS.pdf) · [ATS 运动指南](https://www.thoracic.org/statements/resources/allergy-asthma/exercise-induced-bronchoconstriction.pdf)"]],"path":"book/chronic-health/03-respiratory.md","aliases":"","grades":["C"]},{"id":393,"qid":"Q393","section":"健康","chapter":"常见慢病与运动","question":"有慢阻肺，平地走一会儿就喘，怎样询问肺康复与适合自己的活动强度？","title":"慢阻肺走一会儿就喘，先问能否转介肺康复","fields":[["怎么做","带肺功能结果、近期急性加重或住院记录以及用药和吸氧安排去复诊。说清楚平路走多久开始喘、休息多久好转、是否影响洗澡或买菜。问是否适合肺康复，是否需通过步行试验等评估，再确定起步项目、每段走多久、可接受的气促程度、何时休息。也可问当地有无中心、社区或有专业指导的远程方案。"],["成本","需要评估和训练时间。交通不便时可问远程方案能否满足自己的监测需求。"],["说人话","把“走几分钟就要停”告诉医生。康复团队可以测出你当前能做多少，再教你怎么练和怎么休息。"],["收益","对病情稳定的慢阻肺患者，肺康复可改善运动能力、呼吸困难和生活质量。它通常包含个体化训练、教育和自我管理，近期急性加重后有相应的评估和转介路径。"],["证据等级","A（肺康复整体获益获多个随机试验及 ATS 指南支持，起步和监测需个别评估）。"],["适用与备注","近期气短明显加重、痰量或颜色变化时先联系医疗团队，按计划暂停加量。突发严重气短、胸痛、意识改变或嘴唇发紫时立即呼叫急救。按团队规定的方式使用家用氧气。"],["来源","中华医学会等《慢性阻塞性肺疾病诊治指南（2026 年修订版）》肺康复章节、美国胸科学会慢性呼吸疾病肺康复指南。 [中国慢阻肺指南](https://cs.medjournals.cn/article/doi/full/10.3760/cma.j.cn112147-20260817-00487) · [ATS 肺康复指南](https://pmc.ncbi.nlm.nih.gov/articles/PMC10449064/)"]],"path":"book/chronic-health/03-respiratory.md","aliases":"","grades":["A"]},{"id":394,"qid":"Q394","section":"健康","chapter":"常见慢病与运动","question":"有过运动相关严重过敏反应，恢复户外运动前应与医生确认哪些随身应急准备？","title":"有过运动相关严重过敏，恢复户外训练前和专科演练急救","fields":[["怎么做","先约过敏专科，带发作记录和急诊资料。写下发作前吃过什么、时间、运动强度、天气、药物和饮酒情况。与医生明确哪些组合要避开、何时能恢复、适合结伴还是需要进一步评估。拿到书面方案后，和同伴演练辨认症状、找到随身的肾上腺素装置和使用方法、定位及呼叫急救。确认装置数量、备用装置、有效期和携带位置。"],["成本","需要专科评估和一次同伴演练。选手机有信号、救援容易到达的路线，急救用品放在随手能取到的地方。"],["说人话","先在家演练一次。真发作时，谁拿药、谁叫急救、怎么报位置，要在出门前说清楚。"],["收益","运动相关严重过敏可能与特定食物、药物等共同触发。过敏专科评估有助于减少再次接触风险。疑似严重过敏反应时，及时按计划用肾上腺素并呼叫急救是关键。"],["证据等级","C（返训和同伴准备依据 EAACI 运动过敏立场，严重反应急救依据专业指南）。"],["适用与备注","运动中若突发喉头紧、呼吸困难或头晕近晕，立即停止。疑似严重过敏反应时，按预案立即使用已处方的肾上腺素装置并呼叫急救，等待救援时不要起身走路。若很喘，按急救指引缓慢调整到便于呼吸的体位。评估前别自行重现疑似诱发组合。"],["来源","欧洲过敏与临床免疫学学会运动过敏立场和严重过敏指南、英国 NHS 严重过敏急救说明。 [运动过敏立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC9796481/) · [EAACI 急救指南](https://onlinelibrary.wiley.com/doi/full/10.1111/all.15032) · [NHS 急救说明](https://www.nhs.uk/conditions/anaphylaxis/)"]],"path":"book/chronic-health/03-respiratory.md","aliases":"","grades":["C"]},{"id":395,"qid":"Q395","section":"健康","chapter":"常见慢病与运动","question":"有过敏性鼻炎，训练环境和时间怎么选，症状影响睡眠或运动时什么时候就医？","title":"鼻炎影响训练时，按自己的过敏原调整场地与时间","fields":[["怎么做","记几次鼻塞、喷嚏或眼痒出现时的场地、时段和当地花粉水平。如果确认对花粉敏感，优先试花粉较少的时段或室内路线，特别留意多风和附近割草时。若自己主要对尘螨、霉菌或动物皮屑敏感，挑换气合适、相应暴露较少的室内场地。若回家仍明显不适，可换掉户外衣物、洗澡洗头并继续观察。"],["成本","看预报，留一个室内或不同时间的备选。记几次训练和睡眠的变化即可。"],["说人话","有花粉过敏的人可避开当地花粉最高的时候。进室内还是鼻塞，也记一下屋里可能有哪些触发因素。"],["收益","针对自己的已知过敏原安排场地，可减少接触。花粉峰值随地区、天气与植物变化，结合当地提示和本人症状，比固定只在早晨或只在晚上练更合适。"],["证据等级","C（减少暴露和就医线索来自过敏专业机构，换时段改善训练的直接证据有限）。"],["适用与备注","鼻塞、喷嚏或眼痒反复影响睡眠、日常活动，或使你常常需要缩短训练时，带记录向全科、耳鼻喉或过敏专科咨询。反复伴随喘鸣、胸紧或气短时，也告诉医生。"],["来源","《中国变应性鼻炎诊断和治疗指南（2022 年，修订版）》、美国过敏哮喘与免疫学院患者资料、英国 NHS 就医建议。 [中国指南](https://pubmed.ncbi.nlm.nih.gov/35078291/) · [过敏原回避](https://acaai.org/allergies/allergic-conditions/hay-fever/) · [NHS 就医建议](https://www.nhs.uk/conditions/allergic-rhinitis/)"]],"path":"book/chronic-health/03-respiratory.md","aliases":"","grades":["C"]},{"id":396,"qid":"Q396","section":"健康","chapter":"常见慢病与运动","question":"已确诊膝骨关节炎，怎样选步行、骑车或抗阻，并用当天和次日的变化调训练？","title":"膝骨关节炎，按当天和次日的反应调整训练","fields":[["怎么做","从一种容易控制的活动开始。平路短走能接受就先走，如果走路容易加重膝痛，可试低阻力固定自行车。也可以安排适合自己的局部力量练习，如扶稳后从较高的椅子起坐。用同一套标准记运动前、运动中和次日起床时的疼痛、肿胀和走路情况。轻微不适很快恢复、第二天和往常差不多，可以先维持这个量。次日明显更痛、更肿或开始跛行，等症状回到平时水平，再缩短时间或减少阻力、次数。"],["成本","低。步行和椅子起坐可就地做。骑车是可选项，反复遇到症状也可请物理治疗师协助选动作。"],["说人话","今天能做完、明早还能照常走，才知道这次活动量合不合适。"],["收益","规律、适合自身情况的有氧和力量练习有助于减轻膝痛、改善日常活动能力。"],["证据等级","A。膝骨关节炎治疗性运动的收益有系统综述支持。次日反应用于个人调整，主要来自临床实践指导。"],["适用与备注","适用于已确诊并能活动的成年人。反复减量仍明显肿痛，复诊核对原因。关节突然红、热、肿并伴发热或全身不适，或外伤后不能承重，尽快就医。"],["来源","[中国膝骨关节炎阶梯治疗专家共识（2026 修订版）](https://zhgjwkzz.cma-cmc.com.cn/CN/abstract/article/1674-134X/44572) · [NICE 骨关节炎指南·治疗性运动](https://www.nice.org.uk/guidance/ng226/chapter/Recommendations#therapeutic-exercise) · [Cochrane 膝骨关节炎运动综述（2024）](https://www.cochrane.org/evidence/CD004376_exercise-effective-therapy-treat-knee-osteoarthritis) · [NHS inform 膝骨关节炎练习](https://www.nhsinform.scot/illnesses-and-conditions/muscle-bone-and-joints/leg-and-foot-problems-and-conditions/exercises-for-osteoarthritis-of-the-knee/) · [NHS 关节痛就医信号](https://www.nhs.uk/symptoms/joint-pain/)"]],"path":"book/chronic-health/04-musculoskeletal-and-treatment.md","aliases":"","grades":["A"]},{"id":397,"qid":"Q397","section":"健康","chapter":"常见慢病与运动","question":"已确诊骨质疏松或有脆性骨折史，哪些负重和抗阻动作要先请专业人员评估？","title":"骨质疏松或有脆性骨折史，先核对要学的动作","fields":[["怎么做","带上已有的检查结果、骨折部位和时间、近期跌倒情况，再把准备尝试的动作逐个告诉医生或有骨质疏松经验的物理治疗师。先问负重下大幅或反复弯背的动作、陌生的大重量举起或搬动，以及跑跳、落地等较高冲击动作。请对方帮你确定哪些可以练、如何改动作和起步量。曾有椎体骨折或多次低创伤骨折时，尤其要先核对冲击水平。评估前可按已获准的方式活动。"],["成本","低到中。已有的日常活动可以延续，制定新的训练计划可能需要一次评估或动作指导。"],["说人话","告诉专业人员你具体想练什么，才能确定该用多少重量、怎么弯腰或落地。"],["收益","合适的负重、抗阻和训练平衡有助于维持功能和降低跌倒风险，一些组合方案也有助于减缓骨量流失。"],["证据等级","B。骨密度与跌倒方面有研究支持。具体动作的风险限制，尤其是已经发生骨折时，更多依靠临床评估和专家共识。"],["适用与备注","适用于已确诊骨质疏松或曾有脆性骨折的成年人。骨折正在愈合时，按原治疗团队给的康复和承重要求走。跌倒或很小的外力后突然背痛明显、髋部疼痛或无法承重，应尽快就医。"],["来源","[中国原发性骨质疏松症诊疗指南（2022）](https://www.chinagp.net/CN/10.12114/j.issn.1007-9572.2023.0121) · [英国 NOGG 骨质疏松临床指南（2024）](https://pmc.ncbi.nlm.nih.gov/articles/PMC12417299/) · [英国骨质疏松体力活动专家共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC9304091/)"]],"path":"book/chronic-health/04-musculoskeletal-and-treatment.md","aliases":"","grades":["B"]},{"id":398,"qid":"Q398","section":"健康","chapter":"常见慢病与运动","question":"痛风反复发作，怎样区别发作期的关节保护和间歇期的锻炼安排？","title":"痛风发作时保护关节，缓解后再恢复活动","fields":[["怎么做","熟悉的痛风发作时，按已有的应对方案处理，暂停会压迫或负重于红、热、肿、痛关节的运动，例如脚趾或踝关节发作时暂停跑步。休息时可抬高患肢。若冷敷舒服，可用毛巾隔开冷敷。疼痛肿胀缓解、日常活动基本恢复后，从几分钟不加重疼痛的轻量活动起步，再按反应增加时间。反复发作时记下日期、部位和持续时间，带给治疗团队复核。"],["成本","低。调整运动安排，减轻疼痛时可用家里已有的冷敷用品。"],["说人话","发作时给关节减负。平时按关节能承受的量维持活动。"],["收益","发作时保护关节可减少额外疼痛，缓解后有计划地恢复可减少活动中断。"],["证据等级","C。急性期保护和恢复顺序主要来自临床指南及患者指导，具体恢复速度根据个人症状调整。"],["适用与备注","适用于已确诊痛风的成年人。关节红肿热痛伴发热、寒战或全身不适，或表现明显不同于以往，应尽快就医排查其他原因，包括关节感染。"],["来源","[国家卫生健康委高尿酸血症营养和运动指导原则（2024）](https://www.nhc.gov.cn/ylyjs/gzdt/202407/256b4eb8398440a8811344c7be50a333/files/1734003012304_36543.pdf) · [NICE 痛风指南·识别关节感染及急性发作处理](https://www.nice.org.uk/guidance/ng219/chapter/Recommendations) · [NHS 痛风患者指导](https://www.nhs.uk/conditions/gout/)"]],"path":"book/chronic-health/04-musculoskeletal-and-treatment.md","aliases":"","grades":["C"]},{"id":399,"qid":"Q399","section":"健康","chapter":"常见慢病与运动","question":"有偏头痛且高强度运动有时会诱发症状，怎样记录触发条件、何时先就医？","title":"运动诱发头痛，记录发作经过并识别就医信号","fields":[["怎么做","运动时发作先停下来。记下当天练了什么、强度、开始后多久头痛、多久达到最痛、持续多久，以及有无恶心、怕光或视觉变化。把当天睡眠、进食、饮水、炎热环境和用药也记下来。已做过评估、发作与以往一致的人，可尝试拉长热身或减低强度，观察是否还会发作。"],["成本","低。用手机随手记录，复诊时给医生看。"],["说人话","有没有偏头痛病史都一样，头痛来得多快、跟以往有多大区别，值得说清楚。"],["收益","记录能帮助医生区分头痛模式，也能帮助自己发现反复出现的触发条件。"],["证据等级","C。观察项目和转诊线索主要来自头痛指南与国际分类标准，具体诱因因人而异。"],["适用与备注","第一次出现运动诱发的头痛，或这次和以往明显不同，尽快就医评估，评估前暂缓剧烈运动。突然出现剧烈头痛并在几分钟内达到最严重，或新发单侧无力、言语困难、意识异常，立即呼叫急救。"],["来源","[国际头痛学会 ICHD-3·原发性运动性头痛](https://ichd-3.org/other-primary-headache-disorders/4-2-primary-exercise-headache/) · [NICE 头痛指南·转诊和头痛日记](https://www.nice.org.uk/guidance/cg150/chapter/recommendations) · [NHS 偏头痛患者指导](https://www.nhs.uk/conditions/migraine/)"]],"path":"book/chronic-health/04-musculoskeletal-and-treatment.md","aliases":"","grades":["C"]},{"id":400,"qid":"Q400","section":"健康","chapter":"常见慢病与运动","question":"癌症治疗期间或治疗后准备运动，怎样与治疗团队核对限制、活动起点和复评时机？","title":"癌症治疗期间或之后，和治疗团队核对运动安排","fields":[["怎么做","把想做的运动、目前能走多远和最近症状告诉治疗团队。请确认能从什么动作和时长起步、哪些动作要暂停、哪些症状需要停练或紧急联系。术后伤口、导管、近期血象异常、手脚麻木影响平衡或有骨转移时，逐项询问限制和是否需要康复指导。团队同意后，可从几分钟轻松步行或安排好的康复动作开始。换治疗方案、手术后、检查结果异常或症状有变化时，再请团队复核。"],["成本","低到中。可利用复诊讨论，部分人需要肿瘤康复团队指导或监督。"],["说人话","问清楚这段治疗期间怎么动、什么情况要停、发生变化该找谁。"],["收益","研究显示，适合治疗阶段的运动可帮助减轻癌因性疲劳、维持体能和肌力。"],["证据等级","B。治疗中和治疗后的运动收益有指南和研究支持。起点、限制和复评时间取决于癌种、治疗阶段和个人情况。"],["适用与备注","适用于正在治疗或完成治疗的成年人。化疗期间发热要立即联系治疗团队，按其事先约定的急诊流程处理。突发胸痛、严重气短或意识异常，立即呼叫急救。"],["来源","[中国肿瘤康复专家共识（2025）](https://zhlcyszz.cma-cmc.com.cn/CN/abstract/article/1674-0785/40396) · [ASCO 癌症治疗期间运动、饮食和体重管理指南](https://ascopubs.org/doi/full/10.1200/JCO.22.00687) · [癌症生存者运动国际联合共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC8576825/) · [国际骨转移运动工作组共识](https://ascopubs.org/doi/10.1200/OP.21.00454) · [美国国立癌症研究所·治疗期间感染](https://www.cancer.gov/about-cancer/treatment/side-effects/infection)"]],"path":"book/chronic-health/04-musculoskeletal-and-treatment.md","aliases":"","grades":["B"]},{"id":401,"qid":"Q401","section":"运动","chapter":"有氧训练","question":"没有运动基础，走路都觉得吃力，第一步该怎么开始？","title":"平时很少活动，先从能轻松完成的步行开始","fields":[["怎么做","先选平坦、方便折返的路线，按目前能承受的时长走一段。走起来已经很吃力时，先缩短、放慢。能稳定完成后，再逐渐走久一点或加入短跑段。选跑步计划前，检查它第一周需要活动多久，是否接近自己目前能完成的量。"],["成本","先用现有舒服的鞋。例如从家门口走 5 分钟、感觉可以再折返，共 10 分钟。这是便于执行的示例，可更短。"],["说人话","还没准备好跑，就先走。今天的起点可以小到下次仍愿意出门。"],["收益","建立固定活动时段，也能找到适合自己起点的走跑计划。"],["证据等级","C（机构入门指导。具体起步时长和过渡安排是执行建议）。"],["适用与备注","面向没有运动基础的成年人。Mayo Clinic 的七周 5 公里计划建议能连续活动 30 分钟后再开始，那是该计划的起点要求，不是人人必须通过的跑步资格测试。是否需要先评估见[运动前筛查](../training-health/01-screening.md#q285)。走路就出现新发胸闷或异常气短时，按[相关症状](../training-health/06-emergencies-and-weather.md#q353)处理。"],["来源","NHS 步行指南的“不常活动怎么办”，Mayo Clinic 5 公里计划的开始条件。 [NHS 步行入门](https://www.nhs.uk/live-well/exercise/walking-for-health/) · [Mayo Clinic 初学者计划](https://www.mayoclinic.org/healthy-lifestyle/fitness/in-depth/5k-run/art-20050962)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"跑步入门 零基础 步行 开始运动 怎么开始 刚开始跑步 跑不动","grades":["C"]},{"id":402,"qid":"Q402","section":"运动","chapter":"有氧训练","question":"跑一两分钟就很喘，应该放慢、缩短跑段，还是继续硬撑？","title":"跑一两分钟就很喘，先放慢并缩短跑段","fields":[["怎么做","先走路热身，再用能控制呼吸的速度试短跑段。仍很快喘不过来，就提前转走，等呼吸缓下来再决定是否继续。下次先缩短跑段或延长走段，记录实际完成了多少。每段都用自己能控制的速度跑。"],["成本","只需计时。例如把原本跑 1 分钟改为跑 30 秒、走 90 秒，先做几轮后评估。这是降低难度的示例，可按感觉进一步缩短。"],["说人话","先让这一小段跑得住，再考虑跑得久。跑得慢、走得多都可以调整。"],["收益","让下一段从较平稳的状态开始，也便于判断困难主要出在速度、跑段长度还是整体活动量。"],["证据等级","C（机构初学者计划。跑段与走段时长按个人耐受调整）。"],["适用与备注","强度判断可用[说话与体感](../distance-running/02-workouts.md#q140)。反复出现与用力不相称的气短、喘鸣或咳嗽应评估。胸口压迫、快晕倒或明显异常气短按[急症流程](../training-health/06-emergencies-and-weather.md#q353)处理。"],["来源","CARA 初学者建议的交谈强度和走跑进阶，Mayo Clinic 用很短跑段起步的示例。 [CARA 跑步入门](https://www.cararuns.org/beginningrunning) · [Mayo Clinic 初学者计划](https://www.mayoclinic.org/healthy-lifestyle/fitness/in-depth/5k-run/art-20050962)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"跑步入门 一跑就喘 跑步很喘","grades":["C"]},{"id":403,"qid":"Q403","section":"运动","chapter":"有氧训练","question":"总要穿插走路，还算跑步训练吗，可以一直走跑交替吗？","title":"把走段写进计划，按走跑交替完成训练","fields":[["怎么做","开始前就安排跑段和走段，按提示转换。跑段保持可控，走段用来缓和呼吸。记录跑了多久、走了多久，以及最后几段能否稳定完成。目标是日常活动时，可以继续走跑。目标是连续跑时，再逐渐延长跑段。"],["成本","普通计时器即可。NHS 第一周示例为跑 1 分钟、走 90 秒做 7 轮，再跑 1 分钟。前后各走 5 分钟，总计 28 分 30 秒，不含拉伸。难度过高时按[起点调整](#q402)。"],["说人话","计划里的走路也算这一课。需要走段，不会把前面跑过的部分清零。"],["收益","把一次目前做不到的连续跑，拆成能重复练习的短段，方便观察进步。"],["证据等级","C（NHS 与 RRCA 官方初学者计划提供走跑交替的执行示例）。"],["适用与备注","适合从短段开始学习跑步的人。以后是否减少走段，可以按自己的目标和完成情况决定。"],["来源","NHS 第一周完整时间表，RRCA 新跑者计划的分段安排。 [NHS 官方课表](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/couch-to-5k-running-plan/) · [RRCA 新跑者计划](https://www.rrca.org/education/for-runners/10-week-training-plan/)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"跑跑走走 跑走结合 走跑交替","grades":["C"]},{"id":404,"qid":"Q404","section":"运动","chapter":"有氧训练","question":"第一周就做不完整，可以重复一周吗，什么时候再进阶？","title":"这一周还做不完，就重复或退回能完成的一课","fields":[["怎么做","如果多次需要提前停跑、明显延长恢复才能做完，就先重复当前一课或一周。第一周也太难时，减少跑段、保留更多步行。下一次能否进阶，看实际完成情况和恢复，不只看日历翻到了第几周。"],["成本","计划可能比标示周数更长。用一句话记下本次调整，例如“最后两段改走，下一次重复”。"],["说人话","九周课表可以花更久。把眼前这一步练顺了，再接下一步。"],["收益","保留已经建立的活动习惯，并给下一次安排提供具体依据。"],["证据等级","C（NHS 官方课表允许重复跑课或周次。进阶按个人完成情况调整）。"],["适用与备注","用于难度尚未适应的情况。持续疼痛、病后不适不靠重复硬熬，参见[训练相关健康](../06-training-health.md)。"],["来源","NHS 计划首页说明可用九周或更久，正式课表第 5、7 周允许重复。 [NHS 计划说明](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/) · [NHS 官方课表](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/couch-to-5k-running-plan/)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":405,"qid":"Q405","section":"运动","chapter":"有氧训练","question":"刚开始走跑要天天练吗，三次课可以连续安排或少做一次吗？","title":"入门走跑之间留休息日，漏练后顺延安排","fields":[["怎么做","采用 NHS 入门计划时，按每周三次、两次走跑之间至少隔一天不跑来排。临时少一次，可把后续顺延。休息日可按感觉散步，仍很疲劳就多休息。后续安排保留间隔，避免把几次课挤到连续几天。"],["成本","例如周一、周三、周六走跑。周三没空，就改周四、周六。例子用于安排间隔，不要求固定星期几。"],["说人话","刚起步不用天天跑。错过一课，接着安排下一次就好。"],["收益","让活动和恢复都有位置，减少为了追赶日历而临时叠加训练。"],["证据等级","C（每周三次、课间休息是一种官方入门安排）。"],["适用与备注","一周只有两次时间，可以按顺序慢慢推进，并预留更长完成时间。本题针对开始走跑的人，半马、全马排周另见[长跑计划](../distance-running/01-planning.md#q131)。"],["来源","NHS 课表开头的频率与休息安排，CARA 关于初学者隔日跑、不补挤漏课与非跑日活动的说明。 [NHS 官方课表](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/couch-to-5k-running-plan/) · [CARA 跑步入门](https://www.cararuns.org/beginningrunning)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":406,"qid":"Q406","section":"运动","chapter":"有氧训练","question":"从走跑突然到连续二十分钟，第一次该怎样尝试？","title":"首次连续跑按熟悉的轻松速度尝试，做不到就转走","fields":[["怎么做","先确认前几课的走跑已经能稳定完成，再在平坦、熟悉、方便结束的路线尝试连续跑。起步用此前能控制的慢速，不同时追求更快。途中越来越难维持时先减速，必要时转走，记录实际连续跑了多久，下次再安排。"],["成本","提前留出热身与收尾时间。例如 NHS 第 5 周第 3 次课安排连续跑 20 分钟，前后各走 5 分钟，总计 30 分钟，不含拉伸。"],["说人话","第一次连起来跑，先试持续多久。中途走了，就把这个结果用来调整下一次。"],["收益","把连续跑当成一次可调整的练习，了解从分段跑过渡后的耐受情况。"],["证据等级","C（官方课表的进阶示例，适用于已完成前序走跑练习的人）。"],["适用与备注","零基础第一天不直接照搬这堂课。NHS 课表在较后周次也允许放慢、短暂步行。重复安排见[这一周做不完](#q404)。"],["来源","NHS 第 5 周第 3 次课、第 7 周第 2 次课的调整说明。 [NHS 官方课表](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/couch-to-5k-running-plan/)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":407,"qid":"Q407","section":"运动","chapter":"有氧训练","question":"完成了连续三十分钟却只有三公里，算没完成五公里入门计划吗？","title":"把连续跑三十分钟和跑完五公里分开记录","fields":[["怎么做","按时长练习时，先完成当前能承受的时间，再记录距离。按 5 公里安排活动时，按自己的实际速度预留时间，也可走跑交替。跑完 30 分钟只有 3 公里左右，不必当场加速或加跑去补足 5 公里。"],["成本","计时即可，距离可用已知路线或现有手机估计。例如每公里 10 分钟，30 分钟对应 3 公里。同样速度跑 5 公里需 50 分钟。这是算术示例，不是建议配速。"],["说人话","能连续跑半小时，已经完成了一个目标。五公里是另一个距离目标。"],["收益","避免把计划名称误当成速度要求，便于选择继续练时长还是逐步增加距离。"],["证据等级","C（官方课表目标与时间、距离的算术换算）。"],["适用与备注","NHS 计划名为“Couch to 5K”，实际第 9 周三次课都是连续跑 30 分钟。完成可用九周或更久，不要求每个人在九周后都能 30 分钟跑完 5 公里。"],["来源","NHS 首页的完成时长说明与第 9 周课表。 [NHS 计划说明](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/) · [NHS 官方课表](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/couch-to-5k-running-plan/)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":408,"qid":"Q408","section":"运动","chapter":"有氧训练","question":"开始走跑前必须买贵跑鞋、专门衣服和运动手表吗？","title":"先备好合脚鞋、舒服衣物和计时工具","fields":[["怎么做","检查现有跑鞋是否合脚，穿着走或短跑时有没有挤压、摩擦和疼痛。需要换鞋时先试穿。衣物以活动舒服、适应天气为准，有需要时配合适的运动内衣。走跑计时可用手机或普通计时器，先按时间完成训练。"],["成本","先用已有的合适物品。只有鞋不合适、衣物磨皮等实际问题时，再按预算补齐。GPS 手表不必作为开跑前的采购项目。"],["说人话","先把脚穿舒服、把时间看明白，就能开始准备第一课。"],["收益","减少装备选择带来的拖延，优先解决直接影响活动舒适度的问题。"],["证据等级","C（公共卫生机构与跑步协会的基础装备指导）。"],["适用与备注","夜间还要能看清路面并让他人看见自己。鞋袜引起的麻木、挤痛或起疱见[鞋袜检查](../training-health/04-running-injuries.md#q338)。"],["来源","NHS “What you'll need for your run”与计划首页的衣物、安全说明，CARA 对计时工具与非必需 GPS 手表的说明。 [NHS 出门准备](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/) · [NHS 装备说明](https://www.nhs.uk/better-health/get-active/get-running-with-couch-to-5k/couch-to-5k-running-plan/) · [CARA 装备指导](https://www.cararuns.org/beginningrunning)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":409,"qid":"Q409","section":"运动","chapter":"有氧训练","question":"还不能连续跑五公里，可以走着参加第一次五公里活动吗？","title":"第一次参加五公里活动，先确认能否走及所需时间","fields":[["怎么做","报名或出发前，看清活动是否接受步行、路线起伏及时间要求。若允许走跑，就沿用练过的节奏，不因旁人起跑快而跟上。还没走过接近 5 公里时，先在日常练习里逐渐接近这个距离，再决定何时参加。"],["成本","花几分钟读活动说明，另预留出行和完成时间。比如按每公里 12 分钟步行，5 公里约需 60 分钟，实际还受地形和停顿影响。"],["说人话","允许走路的五公里活动，可以按自己的节奏完成。先看规则，也先看看这段距离自己走得怎样。"],["收益","把第一次参与的目标与当前能力、活动安排对齐。"],["证据等级","C（parkrun 官方参与规则。准备程度与用时估算是执行建议）。"],["适用与备注","parkrun 明确欢迎步行、没有完成时间上限，并设收尾步行志愿者。这些是该活动的安排，不能推定所有商业 5 公里赛事都相同。当地没有类似活动，也可先完成自己的日常路线。"],["来源","parkrun 官方“体能不够怎么办”和“可以步行吗”答疑。 [parkrun 官方 FAQ](https://resources.parkrun.com/Australia)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":410,"qid":"Q410","section":"运动","chapter":"有氧训练","question":"入门计划完成后怎么继续，必须练更快或接着跑十公里吗？","title":"完成入门计划后，先保留能持续的安排再选下个目标","fields":[["怎么做","先把已能完成的轻松跑或走跑继续排进日历。目标是日常健康，可以保留现有距离。想从 3 公里接近 5 公里，就在恢复良好时只小幅延长其中一次，其他次保持熟悉的量，先观察再调整。想练速度或更远距离时，再选与目前起点相符的计划。"],["成本","例如继续保留原有每周三次时段，其中一次从 30 分钟试到 32 分钟，其余不变。这是讨论进阶的示例，后续增加多少仍要看完成与恢复情况。"],["说人话","学会跑以后，可以把它留在生活里。下个目标不一定是十公里或半马。"],["收益","把“课表结束”接到下一周真实可执行的安排，并避免同时增加速度、距离和次数。"],["证据等级","C（机构活动与进阶指导。具体维持与加量为执行示例）。"],["适用与备注","健康收益不要求参加比赛。成人身体活动还包括其他有氧和每周至少两天肌力活动。跑步分钟数须结合实际强度，不能直接认定每周三次短跑已满足所有健康建议。准备半马可另看[首半马起点](../02-distance-running.md#q23)。"],["来源","CDC 成人身体活动建议，CARA 先发展耐力、合理安排恢复的入门指导。 [CDC 成人活动建议](https://www.cdc.gov/physical-activity-basics/guidelines/adults.html) · [CARA 跑步入门](https://www.cararuns.org/beginningrunning)"]],"path":"book/aerobic-training/01-getting-started.md","aliases":"","grades":["C"]},{"id":411,"qid":"Q411","section":"运动","chapter":"有氧训练","question":"第一次跑山径，除了公里数，还要怎样看累计爬升和路线难度？","title":"第一次选山径，把距离、爬升分布和路面一起看","fields":[["怎么做","先查管理方的开放信息、路线图和海拔剖面。累计爬升是沿途上升高度的累加。再看它集中在哪几段。同样的总爬升，连续陡上坡和分散小坡不是同一种体验。还要看下坡是否有碎石、树根、陡坎，以及是否需要涉水或攀爬。第一次选标记清楚、路面较平整、能提前折返的短线。用自己走过相近山径的实际用时安排返回，不直接套公路配速。"],["成本","出发前看图、查近期路况，必要时询问管理人员。第一次可以先把路线走熟，再在平稳路段加入短段慢跑。"],["说人话","“只有几公里”说不清难不难。要看这几公里怎么上去、怎么下来，以及踩的是什么路。"],["收益","能提前发现距离数字掩盖的连续爬升、难下坡和撤回困难。"],["证据等级","C（国家公园和步道管理组织的路线评估建议。没有适合所有新手的距离或爬升上限）。"],["适用与备注","适合日常山径体验。路线的“简单”评级不能替代对实际路面的了解。不同管理方的评级也未必相同。出发联络与折返约定见[行程留存](../training-health/06-emergencies-and-weather.md#q365)。"],["来源","美国国家公园管理局大烟山徒步安全的路线选择部分，阿巴拉契亚步道保护协会的难度、爬升和路面说明。 [NPS 路线与路况](https://www.nps.gov/grsm/planyourvisit/hikingsafety.htm) · [ATC 路线规划](https://appalachiantrail.org/experience/hike-the-trail/day-hiking-backpacking/planning-a-hike/)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":412,"qid":"Q412","section":"运动","chapter":"有氧训练","question":"越野时走上坡正常吗，什么时候该从跑改成走？","title":"上坡跑得吃力时，提前转走并调到能持续的用力","fields":[["怎么做","遇持续爬升，发现跑起来明显费力、步伐难以维持，就改成可控的步行。走了仍很喘，可以继续放慢，必要时停在安全位置休息。坡变缓、呼吸和步伐稳定后再决定是否慢跑。日常山径练习也把这些步行段算进总活动时间。"],["成本","接受局部速度变慢，不用购买装备。可以在熟悉的安全坡段，分别记录走和慢跑时的用时与体感，供下次取舍。"],["说人话","越野中走上坡很正常。走了还很累，也可以再慢下来。"],["收益","给持续爬升提供另一种移动方式，减少为了“必须全程跑”而把前段强度推得太高的情况。"],["证据等级","B（小型跑台实验显示坡度和速度影响走、跑的能量代价。何时转走仍需结合个人体感，实验不能给出通用坡度阈值）。"],["适用与备注","想专门练上坡，可看[坡跑训练](../distance-running/02-workouts.md#q148)。轻松强度可参考[说话测试](../distance-running/02-workouts.md#q140)。胸口压迫感、快晕倒或异常气短按[急症处理](../training-health/06-emergencies-and-weather.md#q353)。"],["来源","Minetti 等不同坡度下走跑能量代价实验。Up & Over 10K 官方答疑明确允许比赛中步行上坡。 [走跑能量代价实验](https://pubmed.ncbi.nlm.nih.gov/12183501/) · [赛事步行答疑](https://taosskivalley.com/up-over-10k-trail-run/faq/)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["B"]},{"id":413,"qid":"Q413","section":"运动","chapter":"有氧训练","question":"下坡有碎石和树根，我不敢跑，该怎么开始练？","title":"不敢跑技术下坡时，先走稳再在简单短坡上练","fields":[["怎么做","树根、碎石或陡坎让你无法稳定落脚时，先走过去。练习时另找干燥、视线好、坡缓且没有临崖的一小段。先步行认路，再以能随时减速的速度慢跑，提前看接下来几步的落脚位置，手臂自然参与平衡。重复熟悉这段路，能稳定控制后再逐渐延长。当天走都不稳，就换线或结束。"],["成本","放弃在陌生下坡追回时间，把练习放在容易退出的小范围内。与熟悉路线的人一起走看路线，也能帮助认识路面。"],["说人话","上坡能跑，不代表下坡马上就能跑。先让脚下稳起来。"],["收益","将“怕下坡”拆成可以练习的认路、选落点和控速，避免被别人的速度带着冒险。"],["证据等级","C（户外组织的技术建议与国家公园的防滑倒指引。这种练习顺序是保守的执行建议）。"],["适用与备注","适合没有急性伤痛的新手。摔伤后尚有疼痛、肿胀或不稳时，先看[急性伤情](../training-health/04-running-injuries.md#q328)和[伤后回跑](../training-health/05-injuries-and-return.md#q349)，不把害怕都当成心理问题。"],["来源","阿巴拉契亚山地俱乐部下坡教学中的提前观察和手臂平衡。NPS 大烟山安全指引中的湿滑路面、注意落脚与危险时折返。 [AMC 下坡建议](https://www.outdoors.org/resources/amc-outdoors/outdoor-resources/how-to-run-downhill-mastering-trail-runnings-most-critical-skill/) · [NPS 防跌倒与折返](https://www.nps.gov/grsm/planyourvisit/hikingsafety.htm)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":414,"qid":"Q414","section":"运动","chapter":"有氧训练","question":"第一次跑山径，现有公路跑鞋能用吗，什么时候需要越野鞋？","title":"先看山径路面，再决定是否需要换越野鞋","fields":[["怎么做","第一次若走跑的是干燥、平整、短且容易退出的土路，可先检查熟悉跑鞋的鞋底磨损和贴合情况，再从步行、慢跑试起。路线有较多泥、松散碎石、树根或陡坡时，了解对应路况需要的抓地和保护，再试穿合适的越野鞋。穿上后脚会滑动、挤脚或反复打滑，就调整鞋或路线，不靠加速试胆。"],["成本","可以先用现有鞋体验容易的山径。需要换鞋时预留试穿和短距离适应时间，费用依个人选择。"],["说人话","鞋要跟路配。先知道去哪跑，再判断现在这双够不够。"],["收益","把购买决定放在实际路况和脚感上，同时避免因为有“越野鞋”就忽略湿滑、陡峭的风险。"],["证据等级","C（赛事机构对入门鞋与抓地的建议）。"],["适用与备注","参赛先看该组别是否有鞋类要求。反复脚趾挤痛、水疱或麻木见[鞋袜与足部不适](../training-health/04-running-injuries.md#q338)。泥泞路线是否适合继续另见[湿软路面处理](#q420)。"],["来源","Julian Alps 官方入门答疑指出较短、较简单的山径可能可用公路鞋，并强调适合路面的抓地和穿熟的鞋。Valencia 官方 FAQ 把越野鞋列为该赛事的推荐装备。 [Julian Alps 鞋与装备](https://julianalps.utmb.world/news/9-tips-for-beginners) · [Valencia 装备答疑](https://valenciatrailrace.com/faq/)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":415,"qid":"Q415","section":"运动","chapter":"有氧训练","question":"越野要不要带杖，怎么判断适不适合自己？","title":"带杖前先查允许范围，再在熟悉的坡上试用","fields":[["怎么做","先查路线管理规定或赛事是否允许用杖、有没有禁用路段及携带要求。允许时，可以借一对在熟悉的简单坡上练步行，比较手脚是否协调、是否更容易稳定前进，也练好收起和固定。若取放拖慢动作、频繁碰到自己或旁人，先继续在容易路段练，不把第一次用杖留到比赛。"],["成本","多带一件需要使用和收纳的装备，也要花时间熟悉。可以先借用，确认用途后再决定购买。"],["说人话","杖不是拿上就会用。规则允许、自己用得顺，再带上山。"],["收益","能把用杖的帮助、携带负担和对他人的影响一起考虑，减少现场临时决定。"],["证据等级","C（赛事官方用杖规则和户外装备熟悉原则。试用比较是执行建议）。"],["适用与备注","短距离且平缓的首次体验不必仅因别人带杖而购买。具体以路线与个人需要决定。持杖时避免杖尖朝向他人，借过时先减速并留足空间。是否必须全程带杖是特定赛事规则，须查当届手册。"],["来源","Up & Over 10K 的用杖 FAQ。Julian Alps 官方 FAQ 的全程携带要求。NPS 出行规划中检查装备是否合用、能用和会用的建议。 [10K 用杖答疑](https://taosskivalley.com/up-over-10k-trail-run/faq/) · [Julian Alps 用杖规则](https://julianalps.utmb.world/races-runners/runners/faq) · [NPS 出行规划](https://www.nps.gov/subjects/healthandsafety/upload/Trip-Planning-Guide-Package-508c.pdf)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":416,"qid":"Q416","section":"运动","chapter":"有氧训练","question":"手机没信号或没电时怎么办，第一次去陌生山径该怎样准备导航？","title":"出发前离线打开路线，并准备不依赖手机的备份","fields":[["怎么做","选线后下载路线和覆盖周围区域的地图。出门前关闭网络试开一次，确认能看到起终点、岔路和自己的位置，也会查看返回方向。手机充满电并按行程准备备用电源，同时带看得懂的纸质地图与指南针。到了不确定的岔路先停下核对路标和地图，方向无法确认时不要沿陌生支路继续试探。"],["成本","提前学习地图与导航工具，带上纸图和必要的供电。第一次可在有清楚路标、方便退出的熟悉步道上练习定位。"],["说人话","地图存下来了，还要试过没有网络时会不会用。手机坏了，也得知道怎么办。"],["收益","提前发现只存了轨迹、没下载地图，或不会读岔路的问题，降低途中才发现工具不可用的可能。"],["证据等级","C（国家公园与步道管理组织的导航准备建议。离线试开是据此安排的检查步骤）。"],["适用与备注","有地图不代表道路仍开放，应同时核对管理方近期公告。拿不准路线时先选更简单、熟悉的线路，或与具备导航能力的人同行。手机导航与求救通信是不同的用途。应急联络见[行程与求助约定](../training-health/06-emergencies-and-weather.md#q365)。"],["来源","NPS 十项户外准备中的导航、纸图和备用电源。ATC 导航说明中的地图、指南针、应用失灵与手机没电风险。 [NPS 导航准备](https://www.nps.gov/articles/10essentials.htm) · [ATC 导航与工具](https://appalachiantrail.org/experience/hike-the-trail/essential-skills/navigation-tools/)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":417,"qid":"Q417","section":"运动","chapter":"有氧训练","question":"公路跑已经有基础，第一场越野该选短组别还是更长的距离？","title":"首场越野先选能练到相近地形、支持信息清楚的短组别","fields":[["怎么做","从自己已能稳定完成的山径活动出发，比较候选赛事的距离、爬升分布、路面和预计用时。优先考虑熟悉地区、标记清楚、有补给和工作人员支持的较短组别。报名之前读该组别的强制装备、关门和退出规定，确认平时有机会练相近地形。只熟悉公路跑时，先完成几次简单山径体验，再决定是否报名。"],["成本","花时间读赛事手册和查看线路，必要时向主办方核实不清楚的安排。把交通、试路和熟悉装备的时间也算进去。"],["说人话","第一次报名，先找一场你能看懂路线、练到路况、知道怎么退出的比赛。"],["收益","把“能跑这个公里数”扩展为对赛道和支持条件的判断，更容易选择自己准备得来的项目。"],["证据等级","C（赛事机构的初次参赛建议。实际准备时间和适合距离取决于既有能力及赛道）。"],["适用与备注","10 公里也可能包含陡坡和技术路段，组别短不等于难度低。具体关门计算见[分段关门](../distance-running/01-planning.md#q125)。高海拔首次接触另见[高海拔适应](../training-health/06-emergencies-and-weather.md#q362)。"],["来源","Julian Alps 官方新手答疑关于地形、标记、补给和当地赛事的选择。Valencia FAQ 回答慢跑者和徒步者能否参加，并提醒其短组别也有陡坡和窄道。 [Julian Alps 首赛选择](https://julianalps.utmb.world/news/9-tips-for-beginners) · [Valencia 新手答疑](https://valenciatrailrace.com/faq/)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"越野选距离 首场越野 选多少公里","grades":["C"]},{"id":418,"qid":"Q418","section":"运动","chapter":"有氧训练","question":"短距离山径也要带水和背包吗，途中没有可靠补给时怎样准备？","title":"按离开可靠补给的时间备齐物品，再选装得下的携带方式","fields":[["怎么做","先确认途中哪些位置确实能补水，估计两处之间要走跑多久，并给走慢、停留或提前撤回留余量。按天气和自己相近活动的经验准备饮水、食物，另带适合环境的防风雨保暖层、照明、基本急救用品及个人需要的药物，并核对导航和应急用品。最后再选能装下这些物品、跑动时不明显晃动的腰包或背包，装满后先在短线上试。"],["成本","带上实物会增加重量，需要一次装包和试跑。若现有携带能力不足，可以缩短路线或改成有可靠补给的线路。"],["说人话","先想多久见不到补给、停下来会不会冷，再决定带什么、用什么包装。"],["收益","减少按公里数或背包外形决定携带量而漏掉实际需要的情况，也能发现途中取水、拿衣服是否方便。"],["证据等级","C（NPS 户外准备框架和赛事装备规定。携带量须随环境、活动时长和个人需要调整）。"],["适用与备注","参赛还须满足该组别的强制装备。携水量可参考[相近环境下的训练记录](../distance-running-nutrition/04-hydration-and-gut.md#q276)，实际饮用按[口渴与个人需求](../06-training-health.md#q39)调整。吃的安排见[运动中补碳水](../05-distance-running-nutrition.md#q21)。无杯赛事要带手册认可的杯或容器。"],["来源","NPS 十项准备中的食物、饮水、衣物、照明与急救用品。Valencia FAQ 的无杯赛和分组装备要求。 [NPS 户外准备](https://www.nps.gov/articles/10essentials.htm) · [Valencia 装备与无杯赛答疑](https://valenciatrailrace.com/faq/)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":419,"qid":"Q419","section":"运动","chapter":"有氧训练","question":"山径只能单人通过，怎样超越别人，后面有人追上时又该怎样让路？","title":"窄道借过先减速打招呼，等有安全空间再通过","fields":[["怎么做","接近前方行人或跑者时先减速，提前用对方听得清的正常声音说“前面宽一点的地方方便借过吗”。等对方回应、确认地面和两侧安全后再通过。被追上时可以告知“前面宽处让你”，到了稳固宽处再侧让。没有安全空间就继续等，不挤人、不催人跳到路外。"],["成本","多等片刻，可能打断原来的跑步节奏。拍照或看地图时也先找不挡路的安全位置。"],["说人话","先让对方知道你来了，再一起找能过去的地方。"],["收益","让双方能预判动作，减少突然从身后掠过或在窄路上互相闪避。"],["证据等级","C（跑步协会的共用道路礼仪与赛事机构的窄道通行建议）。"],["适用与备注","行进方向和让行规则以当地标志及赛事要求为准，不假定所有国家都固定从同一侧超越。遇骑行者或马匹先减速并沟通，避免突然动作。携杖时同时留意杖尖位置。"],["来源","美国路跑俱乐部协会的步道礼仪中提醒接近者、注意周围和安全通过。Julian Alps 官方新手答疑中的窄道、湿滑路面与借过提醒。 [RRCA 跑步礼仪](https://www.rrca.org/education/for-runners/runner-etiquette/) · [Julian Alps 共用山径建议](https://julianalps.utmb.world/news/9-tips-for-beginners)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":420,"qid":"Q420","section":"运动","chapter":"有氧训练","question":"雨后山径全是泥、跑起来打滑，还应继续跑吗，可以绕到草地上吗？","title":"山径湿软打滑时先判断能否通行，别踩出旁边的新路","fields":[["怎么做","雨后先查关闭或限行通知。走上去持续下陷、明显留下深脚印，或自己无法稳定落脚时，改走允许通行的较硬路面或折返。开放路线上的小段浅泥，确认脚下稳固且可以安全通过时，可放慢走原有路面。不要为保持鞋干净踩进旁边的草木。无法判断积水深浅、存在冲毁或流水危险，就不继续试过。"],["成本","可能要换路线、缩短活动，或等路面恢复后再来。鞋脏了需要清理。"],["说人话","先看这条路今天还能不能走。能安全通过的小泥段走原路，路已烂软或危险就换地方。"],["收益","兼顾个人落脚安全与步道维护，减少绕泥造成的植被踩踏和路径变宽。"],["证据等级","C（国家公园的无痕山林教育和路况安全指引）。"],["适用与备注","“留在原路”只适用于可安全通行的路段，不是要求踏入未知深水或危险区域。泥地鞋也不能让关闭路线恢复开放。伴随雷电或冰冻时分别按[雷电避险](../training-health/06-emergencies-and-weather.md#q361)和[冰雪环境选择](../training-health/06-emergencies-and-weather.md#q360)处理。"],["来源","NPS 关于泥水占据步道时避免踩踏路旁植被、过湿时等待变干的教育答疑。大烟山路况安全指引中的涨水、桥梁冲毁和危险时折返。 [NPS 泥泞步道答疑](https://www.nps.gov/articles/000/idkt_lnt_2.htm) · [NPS 路况安全](https://www.nps.gov/grsm/planyourvisit/hikingsafety.htm)"]],"path":"book/aerobic-training/03-trail-running.md","aliases":"","grades":["C"]},{"id":421,"qid":"Q421","section":"运动","chapter":"有氧训练","question":"只走路够不够算有氧，还要另做有氧吗？","title":"把快走计入每周有氧，记录走快的时间","fields":[["怎么做","平时已经走路，可以先记一周里哪些路段走得较快、呼吸明显加深，再累计这些分钟。逛街、遛狗时频繁停下的时间单独看。一般成人可逐步以每周至少 150 分钟中等强度有氧为目标。快走能承担这部分活动，通勤也可以算。刚开始时按目前能完成的量起步。"],["成本","穿适合步行的鞋，用手机备忘录记分钟即可。例如工作日每天有两段各 15 分钟的中等强度步行，一周合计 150 分钟，这是排时间的算例。"],["说人话","走得够快、时间积累够，走路就能成为日常有氧。只看一天走了多少步，还看不出其中有多少是较快的活动。"],["收益","能把现有通勤和散步纳入健康活动计划，也更容易看出还需要补多少有氧时间。"],["证据等级","C（CDC 成人身体活动指南明确列出快走及每周活动量。记录方式和通勤算例是执行建议）。"],["适用与备注","面向一般成人的健康活动安排。150 分钟是每周建议量的下端，少于它仍有益。快走之外，成人还需每周至少两天练主要肌群。需要跑步比赛成绩时仍要另做跑步专项准备。"],["来源","CDC「What Counts as Physical Activity for Adults」的快走示例与强度说明。「Adult Activity: An Overview」的每周有氧与肌力建议。 [哪些活动算有氧](https://www.cdc.gov/physical-activity-basics/adding-adults/what-counts.html) · [成人每周活动建议](https://www.cdc.gov/physical-activity-basics/guidelines/adults.html)"]],"path":"book/aerobic-training/02-everyday-cardio.md","aliases":"","grades":["C"]},{"id":422,"qid":"Q422","section":"运动","chapter":"有氧训练","question":"连续快走30分钟，和一天分三次各10分钟，哪个更好？","title":"把有氧拆进几个空档，按一天和一周累计","fields":[["怎么做","没有整段半小时时，可以把快走、骑车或其他有氧放进几次空档。分别记下活动时长和大致强度，再加总。比如三段各 10 分钟的快走合计 30 分钟。只有一段 5 分钟，也可以先做并计入。保持原本能完成的周活动量，再选容易坚持的拆分方式。"],["成本","每段都要算上出门、换鞋或准备器械的时间。通勤和午休现成的路段通常更容易利用。"],["说人话","不用等凑出连续半小时才开始。短段也有用，最后看实际动了多少。"],["收益","一项纳入 19 项研究、1080 名成人的系统综述比较了总时长、方式和强度相当的分段与连续锻炼，未发现心肺适能或血压结局存在组间差异。"],["证据等级","A（成人干预研究的系统综述，纳入试验均被评为高偏倚风险，组间差异结论需谨慎解释。取消十分钟计时门槛依据美国身体活动指南）。"],["适用与备注","主要用于一般成人积累健康活动量。综述的分段训练通常每段至少 10 分钟，更短分段可累计的建议依据身体活动指南。准备长距离比赛时，还需安排与比赛要求相符的连续训练。"],["来源","Murphy 等 2019 年分段与连续运动荟萃分析的摘要、研究设计与偏倚风险评估。美国 HHS 指南问答「Will removing the requirement for 10-minute bouts actually encourage people to move less?」。 [分段与连续运动综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC6745307/) · [取消十分钟下限的官方问答](https://odphp.health.gov/our-work/nutrition-physical-activity/physical-activity-guidelines/about-physical-activity-guidelines/questions-answers)"]],"path":"book/aerobic-training/02-everyday-cardio.md","aliases":"时间少 没空练 碎片时间 快走","grades":["A"]},{"id":423,"qid":"Q423","section":"运动","chapter":"有氧训练","question":"椭圆机做有氧的功效真的能和跑步相当吗？","title":"用椭圆机做日常有氧，按时长和用力程度安排","fields":[["怎么做","想用椭圆机替代日常跑步时，先选能站稳、踩得顺的机器，从轻阻力熟悉动作。再把阻力或步频调到自己能维持的程度，记录实际运动分钟和体感。比较两种活动时看目标、时长和用力程度。机器上相同的距离或热量显示，不能用来直接换算跑量。"],["成本","先利用已有健身房或公共场馆试用，确认动作舒服再考虑购置。初次可以试短一点，给上机、下机和调节留时间。"],["说人话","椭圆机可以练有氧。选你愿意经常做、做起来舒服的方式，记录这次踩了多久、多费劲。"],["收益","一项短时比较实验纳入 18 名缺乏训练的大学年龄成人。在相近主观用力下，椭圆机与跑台的耗氧量、能量消耗未见差异，椭圆机上的心率则较高。它支持椭圆机作为一种有氧选择。"],["证据等级","B（小样本单次生理实验，结论限于当次耗氧和能耗。长期减脂及跑步表现仍需相应训练研究。器械选择参考医疗机构建议）。"],["适用与备注","椭圆机属于低冲击选择，自己的膝髋是否舒服还要实际试用。运动时出现疼痛，先停下并调整或评估。目标是参加跑步比赛时，需要保留适合自己的跑步训练。跨项目时也不必追求相同心率数字。"],["来源","Brown 等 2010 年跑台与椭圆机自选强度比较实验摘要。Mayo Clinic 提供、Augusta Health 刊载的椭圆机与跑台问答。 [短时比较实验](https://pubmed.ncbi.nlm.nih.gov/20453685/) · [医疗机构器械选择问答](https://www.augustahealth.com/answer/elliptical-machines-better-than-treadmills/)"]],"path":"book/aerobic-training/02-everyday-cardio.md","aliases":"","grades":["B"]},{"id":424,"qid":"Q424","section":"运动","chapter":"有氧训练","question":"没有跑步机，在家做什么能代替跑步有氧？","title":"出不了门时，选能在家持续做的有氧活动","fields":[["怎么做","按家里的空间和器材选择。没有器材可以跟入门有氧操或舞蹈练习。有固定自行车或椭圆机，也可以用它们。先清出活动范围，选动作容易跟上的短课。担心楼下噪声时，选以踏步、侧向迈步等为主、不需要跳跃的版本。按自己的呼吸和体感调节节奏，动作跟不上就放慢或暂停。"],["成本","空出能安全活动的地面，用已有设备播放课程即可。NHS 提供 10 分钟居家有氧示范，这个时长是可选课程长度。完整准备和收尾还需另留时间。"],["说人话","下雨、没跑步机，也能在家动起来。先找跟得上、家里做得开的动作。"],["收益","能给坏天气或出门不便的日子留一个替代安排。有氧操、舞蹈和骑车都可以构成有氧活动，达到相应强度的时间可以计入周计划。"],["证据等级","C（NHS 居家活动资源与 CDC 活动分类支持方式选择。按空间、噪声挑动作是执行建议）。"],["适用与备注","适合能安全站立和活动的一般成人。标注「低冲击」或「无跳跃」的课程仍可能很累，初次按体感调整。影片中的演示、停顿或自己休息的部分，记录时与实际活动时间区分。"],["来源","NHS「Home workout videos」的短时有氧与居家课程。CDC 强度说明中的舞蹈、骑车与有氧课程分类。 [NHS 居家活动](https://www.nhs.uk/better-health/get-active/home-workout-videos/) · [不同活动的强度说明](https://www.cdc.gov/physical-activity-basics/measuring/index.html)"]],"path":"book/aerobic-training/02-everyday-cardio.md","aliases":"","grades":["C"]},{"id":425,"qid":"Q425","section":"运动","chapter":"有氧训练","question":"游一小段就要休息，怎样开始把游泳当作有氧？","title":"游泳需要休息时，先分段练并记录实际游动时间","fields":[["怎么做","已经掌握基本游泳技能、能安全到达池边的人，可以先游一段熟悉且能控制的距离，到池边休息，呼吸和动作准备好再继续。若短距离后反复喘乱或动作散掉，先缩短、放慢，并请教练检查换气和技术。记录游动时间、段间休息和大致用力。汇总每周有氧时，按实际活动及强度计入。"],["成本","除泳池费用，还要算上往返、更衣和淋浴。可以用池边钟或手表粗记。例如在池边共待 30 分钟，其中游动 18 分钟、停留休息 12 分钟，两项分开记。这是记账算例。"],["说人话","游一段、歇一段也能练。先把下一段游稳，练习时间和休息时间都记清楚。"],["收益","分段给了技术调整和重新开始的机会。美国成人游泳协会的入门训练说明也把游动与休息组成的组次作为常规训练方式。"],["证据等级","C（成人游泳组织的训练建议与 CDC 活动分类。没有据此声称某个固定的游休比例最优）。"],["适用与备注","不会游泳或还不能安全回到池边时，先参加成人游泳课程。选择有救生员的场地，并与同伴同去。休闲游泳和快速游进的强度可以不同，不能把进泳池的全部时间自动按高强度翻倍折算。"],["来源","U.S. Masters Swimming「Swimming 101」的组次、休息间隔和计时说明。CDC 游泳强度分类与防溺水建议。 [成人游泳训练入门](https://www.usms.org/fitness-and-training/guides/swimming-101/adult-swim-training) · [游泳强度分类](https://www.cdc.gov/physical-activity-basics/measuring/index.html) · [游泳安全建议](https://www.cdc.gov/drowning/prevention/index.html)"]],"path":"book/aerobic-training/02-everyday-cardio.md","aliases":"","grades":["C"]},{"id":426,"qid":"Q426","section":"运动","chapter":"有氧训练","question":"新手跟不上HIIT，应该硬撑还是换容易一些的活动？","title":"跟不上高强度课时，换成能持续的中等强度活动","fields":[["怎么做","如果每次 HIIT 或快速循环课都让你难以完成动作、恢复很久或不愿再练，可以先降低节奏、减少快段，或换成快走、适度骑车等中等强度活动。先把每周实际活动量排稳。以后想尝试更高强度，再逐步加入少量较快活动，并看当次和次日反应。"],["成本","不用额外买课程。相同的指南有氧目标，中等强度通常需要安排更多时间。成人每周至少 150 分钟中等强度，或 75 分钟高强度，或相当组合。新手可以逐步靠近，不必第一周完成。"],["说人话","跟不上这一套课，可以换一套。为了健康做有氧，中等强度本身就有价值。"],["收益","世界卫生组织明确指出，中等强度和高强度身体活动都能改善健康。成人指南允许用中等强度完成有氧建议，并未要求人人做 HIIT。"],["证据等级","C（WHO 与 CDC 身体活动指南支持中高强度的健康活动选择。换课与逐步增加属于执行建议）。"],["适用与备注","这里的「高强度」是公共健康指南的 vigorous 类别，全力冲刺是更高的用力水平。每分钟高强度按约两分钟中等强度计入周目标，是健康活动量的记账规则。减脂或竞技表现还受其他训练和饮食因素影响。HIIT 课程中的休息时间单独记。运动出现胸痛、晕厥或异常气短时立即停练并求助，见[急性不适处理](../training-health/06-emergencies-and-weather.md#q353)。"],["来源","WHO 身体活动事实清单「Overview」。CDC 成人活动种类说明中的中高强度选择、约 1∶2 的时长换算及逐步提高强度建议。 [WHO 身体活动说明](https://www.who.int/news-room/fact-sheets/detail/physical-activity) · [成人强度与时间安排](https://www.cdc.gov/physical-activity-basics/adding-adults/what-counts.html)"]],"path":"book/aerobic-training/02-everyday-cardio.md","aliases":"","grades":["C"]},{"id":427,"qid":"Q427","section":"运动","chapter":"有氧训练","question":"骑自行车三四十分钟就磨痛、坐痛，先检查和调整什么？","title":"骑车磨痛时先减量，再检查坐垫、车座位置和衣物","fields":[["怎么做","先分清不适在皮肤摩擦处、坐骨下方，还是会阴软组织。出现疼痛或会阴麻木就先下车。摩擦不适缓解后再短程试骑。检查坐垫是否破损、歪斜，衣物接缝是否反复摩擦。请车店或教练看实际踩踏时的座高、坐垫角度和车把距离。每次只改一项，记录哪一处、骑多久开始不舒服。"],["成本","先做检查和短程试骑。合身的骑行裤或更合适的坐垫可能有帮助，购买前能试用更好。骑后及时更换湿衣物，骑行裤每次使用后清洗。"],["说人话","先找出哪里在磨、哪里在压，再按原因调整。"],["收益","减少持续摩擦和局部受压，也让调整有迹可循，避免一边加骑行时间一边反复磨伤。"],["证据等级","C（自行车组织的装备建议与坐垫损伤范围综述。预防办法的研究数量少，不能据此选出人人适用的坐垫）。"],["适用与备注","适用于普通自行车和固定单车。共享车无法调整到舒适位置时换车或换活动。麻木持续或反复出现，以及反复疼痛、破溃、红肿或硬结时，停骑并就医。"],["来源","Cycling UK 坐垫舒适度答疑，Napier 与 Heron 的坐垫损伤范围综述，以及美国职业安全卫生研究所面向职业骑行者的自行车坐垫资料第 3 页。 [坐垫与骑姿](https://www.cyclinguk.org/cycle-magazine/saddle-soreness-how-do-i-get-comfortable-saddle) · [综述全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC9265698/) · [NIOSH 自行车坐垫资料](https://www.cdc.gov/niosh/docs/wp-solutions/2009-131/pdfs/2009-131.pdf)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"坐垫磨痛 共享单车 小黄车 骑车磨屁股","grades":["C"]},{"id":428,"qid":"Q428","section":"运动","chapter":"有氧训练","question":"骑车时不是硬踩就是踏空，怎样按路况换挡？","title":"用换挡保持顺畅踩踏，先在平坦安全处练熟","fields":[["怎么做","先认清自己车上哪个拨杆让踩踏变轻、哪个让它变重。在无车流的平坦场地，一次换一挡，感受脚下变化。起步、减速和接近上坡时提前换到较轻的挡位。平路加速后若脚已转得很快却使不上力，再试稍重一挡。外变速车换挡时保持轻踩，避免一边大力蹬一边硬拨。"],["成本","安排一段短练习，熟悉变速和刹车后再进入复杂路况。反复跳链或异响时需要车店检查。"],["说人话","挡位用来配合路况和双腿，及时调整，让脚下保持顺畅。"],["收益","更容易控制起步和坡道中的用力，减少突然过重或过轻造成的踩踏中断。"],["证据等级","C（Cycling UK 入门说明与 Bikeability 骑行教学标准，属于操作指导）。"],["适用与备注","不同传动系统的拨杆方向和换挡方式不同，先看本车说明。这里不设统一的“前几后几”或踏频目标。骑行时看前方，不低头盯挡位。想用骑车练有氧，再结合[强度判断](../distance-running/02-workouts.md#q140)安排用力。"],["来源","Cycling UK「A beginners’ guide to gears」与 Bikeability「Using gears」。 [换挡入门](https://www.cyclinguk.org/article/beginners-guide-gears) · [骑行教学要点](https://www.bikeability.org.uk/wp-content/uploads/2023/08/Activity-Template-Using-Gears.pdf)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"","grades":["C"]},{"id":429,"qid":"Q429","section":"运动","chapter":"有氧训练","question":"骑脚踏助力自行车还能算有氧吗，怎样判断自己的用力？","title":"骑脚踏助力车时，按自己的用力和踩踏时间算有氧","fields":[["怎么做","如果使用需要持续踩踏才提供助力的自行车，记录实际骑行时间和呼吸用力。选择能安全控制的路线与助力档。希望达到中等强度时，以呼吸加深、能交谈但难以唱歌作参考。上坡过于吃力可以增加助力。不要根据车速或电机功率推算自己的运动强度。"],["成本","可在现有通勤或休闲骑行中记录时间与体感，等红灯和停车休息单独记。"],["说人话","电机帮了一部分忙，双腿仍然可以做功。算不算中等强度，要看你自己出了多少力。"],["收益","相关干预研究提示，脚踏助力骑行可能改善心肺适能，也给原本很少骑车的人提供了增加活动的选择。"],["证据等级","B（2022 年系统综述与荟萃分析所纳入的研究规模较小，均存在较高偏倚风险。长期健康结果仍不确定）。"],["适用与备注","证据针对需要踩踏的助力车，不适用于主要靠转动油门前进的车辆。普通自行车与助力车同样车速下，人的用力可能不同。上路按当地规定选合规车辆、路线与防护，不通过追求更高车速增加强度。"],["来源","Riiser 等关于脚踏助力骑行健康效果的系统综述，CDC 相对强度与说话测试说明。 [综述全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC9626861/) · [判断运动强度](https://www.cdc.gov/physical-activity-basics/measuring/index.html)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"电助力 电自行车 脚踏助力 骑车","grades":["B"]},{"id":430,"qid":"Q430","section":"运动","chapter":"有氧训练","question":"成年人没有游泳基础又怕水，怎样开始上课和练习？","title":"成人怕水时先报入门课，把熟悉水性拆成小目标","fields":[["怎么做","报名时直接说明怕水、是否有呛水经历，以及目前能否安全进出泳池。选面向成人零基础的课程，请教练先评估，再从可站立水深中的入水、呼吸、漂浮和恢复站立逐项练习。每次以完成一个可控制的小任务为进展。紧张加重时告诉教练，退回上一步。"],["成本","需要泳池和合格教练。先了解授课人数、教学水深和救生安排，再根据个人需要决定班课或个别课。"],["说人话","第一步可以只是安心入水和站回来。学得慢，不等于学不会。"],["收益","把恐惧和动作学习放在可观察、可调整的课堂里，更容易知道下一步该练什么。"],["证据等级","C（Swim England 成人教学框架及 CDC 防溺水建议，属于教学与安全指导）。"],["适用与备注","练习选择有救生员的泳池，并与同伴同去。教练需要根据能力决定水深和辅助器材。浮板、泡沫棒不能替代救生设备，不靠独自跳入深水逼自己学会。具备基本技能后再接[分段游泳训练](02-everyday-cardio.md#q425)。"],["来源","Swim England 成人教学框架的怕水、个别化教学与分步学习说明，CDC 水中安全建议。 [成人课程框架](https://www.swimming.org/swimengland/adult-swimming-framework-swimming-teachers/) · [防溺水建议](https://www.cdc.gov/drowning/prevention/index.html)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"零基础游泳 不会游泳 怕水 怕深水","grades":["C"]},{"id":431,"qid":"Q431","section":"运动","chapter":"有氧训练","question":"游泳时总是不自觉憋气，怎样开始练习呼气和吸气？","title":"游泳总憋气时，先把水中呼气和出水吸气分开练","fields":[["怎么做","请教练先检查你是否一直憋到抬头时才同时呼气、吸气。在可站立的浅水处、教练看护下，先单独练习脸入水时平稳呼气，口鼻离水后再吸气。动作能控制后，再把它接进短距离游动。自由泳同时检查转头与身体转动的配合，出现慌乱就停到安全处重新准备。"],["成本","安排少量专项练习并请教练观察，记录哪一步容易憋气或慌乱。"],["说人话","先学会在水里把气呼出去，再给吸气留出时间。憋得更久不是入门目标。"],["收益","把呼吸单独练熟，能为协调游动提供基础，减少一换气就打乱动作的情况。"],["证据等级","C（U.S. Masters Swimming 的呼吸技术指导及 CDC 水中安全建议）。"],["适用与备注","不能安全站立或回到池边的人先看[成人学泳](#q430)。不要做过度换气、长时间水下憋气或憋气比赛。喘乱时不强撑到池对面。若出现胸口不适、快晕倒或异常气短，应立即呼救并按[运动急症](../training-health/06-emergencies-and-weather.md#q353)处理。"],["来源","U.S. Masters Swimming 呼气与自由泳换气说明，CDC 关于过度换气和水下长时间憋气的警示。 [水中呼气](https://lanemate.usms.org/fitness-and-training/articles-and-videos/videos/should-you-exhale-while-swimming) · [自由泳呼吸](https://lanemate.usms.org/fitness-and-training/guides/freestyle/breathing) · [水中安全](https://www.cdc.gov/drowning/prevention/index.html)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"","grades":["C"]},{"id":432,"qid":"Q432","section":"运动","chapter":"有氧训练","question":"第一次和别人共用泳道，怎样加入、休息和让行？","title":"进入共用泳道前先看速度和方向，休息时让出转身位置","fields":[["怎么做","先看场馆泳道标识，再观察实际游速。不确定进哪一条时问救生员。加入已有人的泳道前，让对方知道你要进入，并确认循哪个方向游。到池边休息时移到不挡别人转身的位置。有人追近时按场馆规则在池边让行，准备出发前先看后方。"],["成本","入水前花一点时间观察和沟通。速度差别很大或频繁停下练动作时，询问是否有练习区或更合适的开放时段。"],["说人话","先弄清大家怎么游，再加入。慢一点可以，突然挡住别人转身容易出问题。"],["收益","减少方向不一致、突然出发和池边拥堵造成的干扰，让短段训练也更容易安排。"],["证据等级","C（泳池管理机构公布的使用规则，属于场地操作建议）。"],["适用与备注","不同泳池可能要求顺时针、逆时针或其他组织方式，以现场规定为准。不要把国外某泳池“两人分道、三人绕圈”的规则直接套用。不能独立安全游动的人，应进入教学区域并接受看护。"],["来源","Queen’s University 体育与休闲中心关于选择泳道、进入沟通、让行和休息位置的规定。 [场馆原始说明](https://rec.gogaelsgo.com/sports/2019/2/4/lane-swim-etiquette)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"","grades":["C"]},{"id":433,"qid":"Q433","section":"运动","chapter":"有氧训练","question":"划船机总是手臂先累，怎样检查蹬腿和拉手的顺序？","title":"划船机手臂先累时，放慢检查蹬腿、躯干和拉手顺序","fields":[["怎么做","先降低用力，做几次慢而完整的划动。发力时先蹬腿，手臂保持伸长，随后从髋部带动躯干轻微后倾，最后把手柄拉向下胸部。回程反过来，先伸手，再从髋部前倾，最后屈膝滑回。请教练从侧面观察，检查是否过早屈肘、耸肩或急着冲回前端。"],["成本","利用一小段热身时间练顺序。征得场馆允许后，可拍侧面视频对照动作。"],["说人话","划船机需要腿、躯干和手臂接力。先把顺序串起来，再追配速。"],["收益","帮助把动作从一直用手拉，转成连贯的全身配合，也方便发现疲劳时动作从哪里开始变形。"],["证据等级","C（British Rowing 的室内划船技术教学）。"],["适用与备注","手臂累不自动等于动作错误，也不能由网络描述诊断。初学时优先保持可控制的幅度和节奏。出现腰背或肩部疼痛应停下，已有伤病者按评估结果选择动作。机器风门的设置见[Q434](#q434)。"],["来源","British Rowing 室内划船动作顺序、起始姿势和回程说明。 [官方技术说明](https://www.britishrowing.org/indoor-rowing/go-row-indoor/how-to-indoor-row/british-rowing-technique/)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"划船器 手臂酸 划船机 划船动作","grades":["C"]},{"id":434,"qid":"Q434","section":"运动","chapter":"有氧训练","question":"划船机风门要开到最大才有效吗，怎样选择起始挡位？","title":"调划船机前先认清风门，把实际用力与挡位分开看","fields":[["怎么做","先确认机器型号和调节杆用途。使用 Concept2 RowErg 时，可以按厂商建议从风门 3–5 挡试起，以动作连贯、能够完成计划为准调整。要比较不同机器的手感，可查看显示器中的阻力系数（drag factor）。训练强度同时看每次发力、划频和自身用力。"],["成本","首次使用时读一下机器说明，或请工作人员演示。训练记录保留机器型号、时间、划频及风门或 drag factor，方便下次比较。"],["说人话","这根杆调的是飞轮进风。调到 10，不代表这节课自动比别人练得好。"],["收益","减少因误把风门当难度挡而过早疲劳的情况，把注意力放回能控制的动作与训练目标。"],["证据等级","C（Concept2 对自家器械工作方式和起始设置的原始说明）。"],["适用与备注","3–5 挡只针对这里讨论的 RowErg，不适用于所有风阻、水阻或磁阻划船机。不同机型的数字不能直接比较。已有稳定训练安排的人可按目标调整，初学者先学[基本顺序](#q433)。"],["来源","Concept2「What is the Best Damper Setting for Me?」关于风门、drag factor 与起始设置的说明。 [厂商原始说明](https://www.concept2.com/blog/what-is-the-best-damper-setting-for-me)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"","grades":["C"]},{"id":435,"qid":"Q435","section":"运动","chapter":"有氧训练","question":"不去健身房，能用住宅楼梯练有氧吗，开始时怎么安排？","title":"用楼梯练有氧时，先从短楼段慢走并留出休息","fields":[["怎么做","先确认楼梯允许通行，照明、通风和地面状况合适。平地走动热身后，从短楼段或半个楼段开始慢走，一次一级，尽量让脚掌稳稳落在台阶上。到平台休息，呼吸与脚步稳定后再决定继续或结束。先记录能够轻松控制的楼段和时间，再逐步增加。"],["成本","可利用住处或工作地点现有楼梯，穿防滑、合脚的鞋。练习时给其他人和消防通道留出空间。"],["说人话","第一天不用追几十层。能稳稳上去、从容停下，比一口气爬到楼顶更适合起步。"],["收益","把现成楼梯变成短时活动的选择，也便于在平台休息和调整。"],["证据等级","C（香港卫生署卫生防护中心的爬楼运动指引，提供场地、动作和起步方式建议）。"],["适用与备注","脚步不稳、已有明显关节痛，或轻微活动就异常气短时先做评估。不要为了完成楼层数冲刺、跨多级或手持重物。下楼也要保持控制，不能安全继续时结束练习并寻求帮助。活动时间的累计见[Q422](02-everyday-cardio.md#q422)，急症见[Q353](../training-health/06-emergencies-and-weather.md#q353)。"],["来源","香港卫生署卫生防护中心「Benefits of Stair Climbing」关于短楼段、慢速、休息、场地和不负重的说明。 [卫生部门原始指引](https://www.chp.gov.hk/en/static/90006.html)"]],"path":"book/aerobic-training/04-common-questions.md","aliases":"","grades":["C"]},{"id":436,"qid":"Q436","section":"营养","chapter":"日常饮食","question":"吃鸡蛋要丢掉蛋黄吗，担心胆固醇高该怎么安排？","title":"担心蛋黄胆固醇时，先看整天的食物搭配","fields":[["怎么做","健康成人可以把全蛋放进日常饮食，不必习惯性丢掉蛋黄。可按每天约一个全蛋安排，同时看看有没有经常搭配培根、香肠、肥肉或大量黄油。蒸蛋、煮蛋配主食和蔬菜，是容易执行的组合。已经查出血脂异常或有心血管疾病时，把平时吃的蛋、肉和奶一起交给医生或营养师评估。"],["成本","沿用普通鸡蛋，不必为减少胆固醇专门买所谓功能蛋。蒸煮也容易少放油。"],["说人话","蛋黄可以吃。先把一天的搭配看完整，再决定份量。"],["收益","保留蛋黄里的多种营养素，也把注意力放回整体饮食。《中国居民膳食指南（2022）》给出每周蛋类 300–350 克、吃鸡蛋不弃蛋黄的建议。这是一般人群的膳食安排，不是治疗血脂异常的处方。"],["证据等级","C（中国居民膳食指南与专业医疗机构答疑）。适量吃蛋的建议适用于整体饮食，不说明增加到很多个会有额外益处。"],["适用与备注","对鸡蛋过敏者按个人过敏管理方案处理。增肌时也可轮换鱼、奶和豆制品，全天蛋白质安排见 [Q11](../04-training-nutrition.md#q11)。"],["来源","中国营养学会《膳食指南》准则四，湖北省卫生健康委刊载。Mayo Clinic 鸡蛋与胆固醇问答。 [膳食指南准则四](https://wjw.hubei.gov.cn/bmdt/jkhb/spyy/202205/t20220520_4135819.shtml) · [鸡蛋与胆固醇答疑](https://www.mayoclinic.org/zh-hans/diseases-conditions/high-blood-cholesterol/expert-answers/cholesterol/faq-20058468)"]],"path":"book/everyday-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":437,"qid":"Q437","section":"营养","chapter":"日常饮食","question":"不爱吃蔬菜，多吃水果能代替吗？","title":"蔬菜和水果分别安排，先补上一餐的菜","fields":[["怎么做","已经每天吃水果、蔬菜却很少时，先选一顿正餐加一份容易买到、愿意吃的蔬菜，例如焯青菜、炒西兰花或番茄。水果保留在平时吃得惯的时段。一般成人可参考每天不少于 300 克蔬菜、200–350 克新鲜水果的指南建议，蔬菜约一半选深色种类。暂时吃不到这些量，可以逐餐增加。"],["成本","按能吃完的量买当季菜，冷冻蔬菜的使用见 [Q199](02-produce-and-fiber.md#q199)。不用为凑种类一次买很多。"],["说人话","水果很好，也要留一份位置给蔬菜。缺菜时先加菜。"],["收益","让每天的食物种类更完整，避免把蔬菜的份额全部换成水果。两者都提供纤维和多种微量营养素，但具体组成和常用份量不同。"],["证据等级","C（中国居民膳食指南及香港卫生署蔬果 FAQ）。所列克数是一般成人的膳食参考，不是每个人都必须精确称出的处方。"],["适用与备注","水果与蔬菜的建议量分别计算。因肾病等原因需要限制特定食物者，按个人饮食方案选择种类和份量。"],["来源","《中国居民膳食指南（2022）》准则三，以及香港卫生署「不吃蔬菜，但每天吃五份水果可以吗」问答。 [指南核心推荐](https://wjw.fj.gov.cn/ztzl/jkjy/jkzgxd/202206/t20220615_5930367.htm) · [蔬果 FAQ](https://www.chp.gov.hk/sc/static/90028.html)"]],"path":"book/everyday-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":438,"qid":"Q438","section":"营养","chapter":"日常饮食","question":"有机食品更有营养吗，预算有限值得多花钱买吗？","title":"买有机食品前，先保住蔬果种类和日常预算","fields":[["怎么做","先列出自己一周能吃完的蔬菜、水果和主食，再比较有机与普通产品的实际价格。若额外花费会挤掉食物份量或种类，可以选常规种植产品。若预算允许，也重视生产方式，可以把有机产品作为个人选择。买有机饼干或零食时，仍照常检查糖、钠和份量。"],["成本","价格差异随食物和商店变化，用自己的购物单比较。无需把全家食材一次全部换成有机。"],["说人话","先买够愿意吃的食物，再决定要不要为生产方式多花钱。"],["收益","有机标签主要说明生产方式，不自动代表营养更多。有机饮食可减少某些农药残留暴露，但观察到的长期健康差异还受到整体饮食和生活方式影响。"],["证据等级","C（医疗机构对食品选择及证据的整理）。营养含量会受品种、土壤、采收和储存影响，长期健康关联还不能直接解释为有机食品带来的个人收益。"],["适用与备注","无论是否有机，蔬果都需按安全方法清洗和保存。这里讨论营养与预算，个人对环境、生产方式或风味的偏好也可纳入选择。"],["来源","Mayo Clinic「Organic foods」的营养、健康证据、价格与清洗章节。 [有机与常规食品比较](https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/in-depth/organic-food/art-20043880)"]],"path":"book/everyday-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":439,"qid":"Q439","section":"营养","chapter":"日常饮食","question":"想减重就必须吃早餐吗，不吃早餐一定更容易胖吗？","title":"按上午状态和全天饮食安排早餐，别只靠加一餐减重","fields":[["怎么做","如果不吃早餐会让上午难以集中、很饿，或午饭前总是临时买零食，可以安排一份方便的早餐，例如燕麦加奶、水果，或全麦面包加蛋。早起吃不下时，可把少量食物带到稍晚的空档。想减重，回看的是全天份量、饥饿和体重趋势，不把新增一顿早餐当成独立的减重措施。"],["成本","优先用家里现有食材。把原本上午要吃的食物提前准备，不一定需要多加一餐。"],["说人话","早餐能帮你吃得规律、上午舒服，但“开始吃早餐”本身不等于会变瘦。"],["收益","早餐是安排全谷物、蛋白质和水果的一个机会。2019 年综述纳入 13 项成人随机试验，没有支持单靠增加早餐促进减重的做法。"],["证据等级","A（随机试验系统综述）。纳入试验至少一个领域存在高或不明确偏倚风险，体重研究平均随访约七周。C（营养师协会的早餐搭配建议）。"],["适用与备注","这组研究回答短期体重与摄入变化，不回答多年心血管结局。使用会引起低血糖的药物、需要随餐服药，或有饮食治疗方案时，先按医疗安排进餐。晨练前怎么吃见 [Q06](../04-training-nutrition.md#q06)。"],["来源","Sievert 等 2019 年早餐随机试验综述，以及英国营养师协会早餐建议。 [综述全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC6352874/) · [早餐搭配](https://www.bda.uk.com/resource/healthy-breakfast.html)"]],"path":"book/everyday-nutrition/06-reader-questions.md","aliases":"","grades":["A","C"]},{"id":440,"qid":"Q440","section":"营养","chapter":"日常饮食","question":"吃饭时或饭后喝水，会稀释胃液、影响消化吗？","title":"吃饭口渴可以喝水，按舒适程度分次喝","fields":[["怎么做","吃饭时或饭后口渴，可以照常喝白水，不必为担心稀释胃液而固定等半小时。一口口喝到舒服即可。若喝很多水会让自己早早饱了、正餐吃不下，就减少随餐饮水，把其余水分放到餐间。"],["成本","普通饮用水即可，不需要购买助消化饮料。"],["说人话","饭桌上的水可以喝，不必掐着时间等胃消化。"],["收益","随餐饮水可以帮助满足日常水分需要。医疗机构答疑不支持正常随餐饮水会稀释消化液、妨碍消化的说法。"],["证据等级","C（Mayo Clinic 专家答疑与一般饮食指导）。这里没有给所有人设定统一的随餐毫升数。"],["适用与备注","心、肾或肝病患者若已有液体限制，按医疗团队规定的全天总量安排。"],["来源","Mayo Clinic「Does drinking water during or after a meal help or harm digestion?」。 [随餐饮水答疑](https://www.mayoclinic.org/healthy-lifestyle/nutrition-and-healthy-eating/expert-answers/digestion/faq-20058348)"]],"path":"book/everyday-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":441,"qid":"Q441","section":"营养","chapter":"日常饮食","question":"用微波炉热饭会让营养严重流失吗，还能继续用吗？","title":"微波炉可以热饭，把注意力放在容器和加热方法","fields":[["怎么做","可以继续用微波炉准备食物或热带饭。使用明确标注可微波的容器，按设备和食品说明设置功率、时间，较厚或量大的食物留意中间是否也热透。不要为了担心营养损失而把需要彻底加热的食物只温一下。冷藏、携带和复热的完整流程见 [Q213](03-shopping-and-storage.md#q213)。"],["成本","已有微波炉通常无需更换。餐盒不适用或材质不明确时，换到适用容器再加热。"],["说人话","微波加热不会把一顿饭变成“没营养”。选对盒子、热得均匀更实际。"],["收益","微波烹调并不比常规烹调更容易损失营养。时间较短、用水较少时，还可能减少部分水溶性维生素流失。结果取决于食物及实际加热条件。"],["证据等级","C（FDA 与澳大利亚国家科学机构 CSIRO 的食品与设备安全说明）。这不表示任何食物、任何加热时长都能保留同样多的营养。"],["适用与备注","门、铰链或密封部件损坏时停止使用并联系检修。密闭食品、金属及包装的使用限制按设备说明执行，取出热容器时防烫。"],["来源","FDA「Cooking with Microwaves」及容器、安全使用说明，CSIRO「Microwave cooking and nutrition」。 [FDA 微波炉说明](https://www.fda.gov/radiation-emitting-products/resources-you-radiation-emitting-products/microwave-ovens) · [CSIRO 营养说明](https://www.csiro.au/en/research/health-medical/nutrition/Microwave-oven-safety)"]],"path":"book/everyday-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":442,"qid":"Q442","section":"营养","chapter":"训练饮食与补剂","question":"想用肌酸又怕脱发，现有研究能说明什么？","title":"担心肌酸脱发时，看直接测头发的研究，也记录自己的变化","fields":[["怎么做","决定买不买肌酸时，先看 [Q17](../04-training-nutrition.md#q17) 的用途与可选性。单凭网上的掉发经历，无法判断肌酸就是原因。已经发现头发明显变稀或掉发让自己困扰时，记下开始补充的时间、其他用药和近期身体变化，找医生评估。也可以先不使用这项可选补剂。"],["成本","无需为“防肌酸脱发”再买一组补剂。记录变化和必要的就诊比不断更换品牌更有用。"],["说人话","这项试验观察了规律练力量的男性 12 周，肌酸组和安慰剂组的头发密度等指标未见明显差异。真有掉发问题，就把它当作需要查原因的事。"],["收益","2025 年一项试验观察规律练抗阻的 18–40 岁男性，每天补充 5 克肌酸或安慰剂，持续 12 周，38 人完成，其中 37 人完成末次头发测量。两组头发密度等指标和双氢睾酮的变化未见显著差异。这有助于把实际头发结果与单个激素指标区分开。"],["证据等级","B（小样本随机对照试验）。研究未记录参与者的脱发家族史，也未覆盖女性、更高剂量或多年使用。部分作者披露补剂行业顾问或研究支持关系。"],["适用与备注","脱发可以有多种原因，暂停或继续肌酸都不能替代诊断。已有肾病者使用肌酸前按 [Q17](../04-training-nutrition.md#q17) 的边界与医生确认。"],["来源","Lak 等 2025 年随机试验的结果、局限与利益披露，以及 NHS 脱发就诊建议。 [随机试验全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC12020143/) · [脱发评估](https://www.nhs.uk/symptoms/hair-loss/)"]],"path":"book/training-nutrition/06-reader-questions.md","aliases":"","grades":["B"]},{"id":443,"qid":"Q443","section":"营养","chapter":"训练饮食与补剂","question":"蛋白粉或高蛋白饮食会伤肾吗，开始前该看什么？","title":"担心蛋白粉伤肾时，先区分肾脏情况并核对全天总量","fields":[["怎么做","没有已知肾病、肾功能或尿检异常时，先按 [Q11](../04-training-nutrition.md#q11) 核对全天蛋白质，把肉、蛋、奶、豆类和蛋白粉一起算。食物已够，就不必额外加粉。已知有肾病、蛋白尿、反复结石，或正在检查肾脏问题时，把产品标签和实际用量交给医生或肾病营养师确认，先不要自行提高蛋白质目标。"],["成本","先记录几天平时吃的食物，减少重复购买。是否检查肾功能，由个人风险和临床情况决定。"],["说人话","先看自己有没有肾脏问题、一天共吃多少。蛋白粉只是总量的一部分。"],["收益","2018 年综述汇总 28 项试验、1,358 名无肾病成人的数据，较高与较低蛋白饮食的肾小球滤过率变化未见显著差异。这回答研究期间的肾功能指标，不能据此推断任意剂量长期食用都安全。"],["证据等级","A（随机试验系统综述，部分研究的偏倚风险不清楚）。C（NIDDK 慢性肾病饮食指导）。综述排除了已有肾病或肾损伤线索的人群，包括蛋白尿、既往结石者。"],["适用与备注","慢性肾病的蛋白质目标随疾病、治疗和营养状况调整。产品质量也是另一件事，购买前的认证核对见 [Q252](05-supplement-purchasing.md#q252)。"],["来源","Devries 等 2018 年综述的纳入排除标准、肾小球滤过率变化与局限。NIDDK 成人慢性肾病饮食的蛋白质章节。 [综述全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC6236074/) · [慢性肾病与蛋白质](https://www.niddk.nih.gov/health-information/kidney-disease/chronic-kidney-disease-ckd/healthy-eating-adults-chronic-kidney-disease)"]],"path":"book/training-nutrition/06-reader-questions.md","aliases":"","grades":["A","C"]},{"id":444,"qid":"Q444","section":"营养","chapter":"训练饮食与补剂","question":"吃蛋白棒后总胀气或腹泻，是蛋白质太多吗，怎么换？","title":"吃蛋白棒后总胀气，先停下这款并看配料和份量","fields":[["怎么做","记录吃的是哪一款、一次几根，以及症状什么时候出现。先换回平时耐受的食物。检查蛋白棒有没有山梨糖醇、甘露糖醇、麦芽糖醇等糖醇，也留意同一天的无糖糖果或口香糖。若乳制品常让自己不舒服，同时核对乳成分。准备换产品时先买小包装，在普通日子试。"],["成本","不必一次囤整箱。用自己喝得惯的奶、酸奶或常吃的蛋、豆制品作便携替代即可。"],["说人话","“高蛋白”不代表肚子一定受得了。先找出哪种配料和份量容易让你难受。"],["收益","FDA 说明部分糖醇吸收不完全，会在一些人身上引起气体、腹胀或腹泻。检查具体产品，比把所有蛋白质食物都停掉更便于排查。"],["证据等级","C（FDA 标签教育资料与专业中毒咨询机构的蛋白棒答疑）。这只能提示可能的诱因，不能仅凭一次腹胀认定是糖醇或乳糖不耐受。"],["适用与备注","不需要因一次不适就自行长期排除多类食物。停用后仍持续不适，或出现明显腹痛、便血等症状，应就医评估。乳糖不耐受时的选择见 [Q193](../everyday-nutrition/01-staples-and-protein.md#q193)。"],["来源","FDA「Sugar Alcohols」及美国 National Capital Poison Center「Do protein bars give you gas?」。 [FDA 糖醇说明](https://www.accessdata.fda.gov/scripts/InteractiveNutritionFactsLabel/assets/InteractiveNFL_SugarAlcohols_October2021.pdf) · [蛋白棒与胃肠不适](https://www.poison.org/articles/do-protein-bars-give-you-gas)"]],"path":"book/training-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":445,"qid":"Q445","section":"营养","chapter":"长跑营养","question":"经常长跑吃胶、喝运动饮料，怎样兼顾补给和牙齿健康？","title":"保留长跑需要的补给，同时安排清水漱口和日常护牙","fields":[["怎么做","按跑步时长和练过的方案使用胶、饮料，不必为怕蛀牙直接取消长距离供能。补给后有条件可用清水漱口。平时每天用含氟牙膏刷牙两次，清洁牙缝，刷完吐出泡沫，不马上用清水冲掉。把常用补给及频次告诉牙医，按自己的龋齿和酸蚀风险安排复查。"],["成本","沿用饮用水和日常口腔清洁用品。牙膏按成人适用标签选，额外的高浓度含氟产品由牙医决定。"],["说人话","跑步需要的糖可以安排，牙齿也要照顾。运动饮料不用从训练一直小口喝到下班。"],["收益","含糖食品会增加龋齿相关暴露，酸性饮料还涉及牙齿酸蚀。运动员口腔健康指导建议在满足训练需求的同时，减少其他时段频繁吃糖、喝酸性饮料，并做好含氟清洁。"],["证据等级","C（UCL 运动员口腔健康工具包及澳大利亚体育学院运动饮料指导）。清水漱口属于保护措施之一，完整护理还包括刷牙、牙缝清洁与牙科评估。"],["适用与备注","酸性饮料后不要立即刷牙。牙痛、敏感或牙龈反复出血应找牙医检查。每小时补多少碳水仍按 [Q21](../05-distance-running-nutrition.md#q21) 和 [Q22](../05-distance-running-nutrition.md#q22) 安排。"],["来源","UCL 成人运动员口腔健康工具包第 5–8 页，以及澳大利亚体育学院运动饮料的「Dental erosion」部分。 [口腔健康工具包](https://www.ucl.ac.uk/medical-sciences/sites/medical_sciences/files/2025-05/oral-health-toolkit-for-athletes.pdf) · [运动饮料与牙齿](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-drink/are-there-any-concerns-or-considerations)"]],"path":"book/distance-running-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":446,"qid":"Q446","section":"营养","chapter":"长跑营养","question":"碳水漱口真的有用吗，能代替长跑时吃胶喝饮料吗？","title":"把碳水漱口当作可选策略，长跑仍要真正吃喝","fields":[["怎么做","先分清动作。碳水漱口是让含碳水的液体接触口腔后吐出，不是把一份补给喝下去。澳大利亚体育学院把它列为持续约 45–75 分钟、较高强度运动的可选策略。已有比赛目标、想尝试时，先在类似训练中试熟悉饮料和操作。普通日常慢跑不必为此多买产品。"],["成本","可以用现有含碳水运动饮料了解这项策略，无需购买特殊漱口产品。执行还会占用取杯和处理液体的注意力。"],["说人话","嘴里尝到碳水，和身体真正收到碳水，是两件事。跑得久时，吐掉的那口不算吃进去的补给。"],["收益","口腔接触碳水可能通过中枢反应影响主观用力与运动表现。它讨论的是短时表现策略，不会给身体提供与吞咽同量的能量和水。"],["证据等级","C（澳大利亚体育学院按运动时长和强度整理的供能指导）。45–75 分钟是该指导中的运动情境，不是超过或低于一分钟就改变效果的界线。"],["适用与备注","半马、全马和长距离训练仍按 [补给表](../05-distance-running-nutrition.md#q22) 规划实际摄入。无糖甜饮料不等于含碳水溶液。反复含着酸性运动饮料会增加牙齿接触时间，牙齿护理见 [Q445](#q445)。"],["来源","澳大利亚体育学院运动饮料「How and when do I use it?」中 Mouth sensing 说明与按运动类型划分的表 1，以及牙齿注意事项。 [运动中的碳水使用](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-drink/how-and-when-do-i-use-it) · [牙齿注意事项](https://www.ausport.gov.au/ais/nutrition/supplements/group_a/sports-foods2/sports-drink/are-there-any-concerns-or-considerations)"]],"path":"book/distance-running-nutrition/06-reader-questions.md","aliases":"","grades":["C"]},{"id":447,"qid":"Q447","section":"营养","chapter":"日常饮食","question":"水果一定要空腹或饭前吃，营养才更容易吸收吗？","title":"把水果放在吃得惯的时段，不必等空腹","fields":[["怎么做","水果可以放在饭前、饭后或两餐之间。先选择自己容易记住、胃里舒服的时段。想替换下午的甜点，可以带一个水果。若饭前吃水果后正餐吃不下，就把它挪到餐后或加餐，不必为追求吸收而坚持空腹吃。"],["成本","调整现有水果的食用时间即可，不需要另买水果酵素或特殊品种。"],["说人话","水果没有人人通用的最佳钟点。先把每天吃水果这件事安排好。"
