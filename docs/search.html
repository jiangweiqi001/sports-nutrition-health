M 2026 立场声明的 Improving hypertrophy 和表 6，Schoenfeld 等周组数剂量关系荟萃回归摘要。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [增肌周组数荟萃回归](https://pubmed.ncbi.nlm.nih.gov/27433992/)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["A","B"]},{"id":91,"qid":"Q91","section":"运动","chapter":"抗阻训练","question":"同一阶段想兼顾增肌和最大力量，怎样在一周里安排重组和中等次数组？","title":"在一周内保留少量重组，再用中等次数完成其余训练","fields":[["怎么做","选一两项想提高最大力量的动作，把较重组放在课的前面。之后用能稳定完成的中等次数组继续练主要肌群，或把这部分移到另一个训练日。若重组影响后面训练，先减少重组或辅助组的总量。"],["成本","比如一周两练同一个动作，第一天先做 2 组各 4 次，再减重做 2 组各 8 次。第二天以中等次数为主。算例提供一种排法，重量按自己的余力调整。"],["说人话","先把最看重的力量动作练几组，再用容易维持动作的重量继续积累次数。"],["收益","让两个目标各有可重复的训练内容，也更容易为较重训练留出恢复余地。"],["证据等级","A（较重训练对最大力量有优势，多种负荷可增肌）。C（两种组如何放进同一周属于组合示例）。"],["适用与备注","适合已掌握相关动作的成人。周内练习日不够时，也可以在同一天先重后轻。"],["来源","Currier 等网络荟萃分析的 Strength、Hypertrophy 结果，ACSM 2026 立场声明的两个目标及表 6。 [抗阻训练处方网络荟萃分析](https://pubmed.ncbi.nlm.nih.gov/37414459/) · [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["A","C"]},{"id":92,"qid":"Q92","section":"运动","chapter":"抗阻训练","question":"减脂期间如果训练难恢复，力量计划里的重量、组数和频次先动哪项？","title":"减脂期间训练难恢复，先缩减最累的附加组","fields":[["怎么做","若好几次训练都比平时难恢复，先保留熟悉的主动作，减少后续附加组或练得很接近力竭的组。热身已明显沉重时，也可把当天重量调轻一点。现有训练日总是排不开时，再重新分配频次。持续疲劳也要回看食量、睡眠和其他活动。"],["成本","例如原来一个主动作 3 组、两个辅助各 3 组，这周保留主动作，先把一个辅助减到 1–2 组，记下后几次训练的表现和恢复。"],["说人话","先给训练减掉几组最难恢复的内容。主要动作可以保留，每次的重量也可按当天状态调。"],["收益","较容易维持训练习惯，并能观察组数减少后是否恢复得更顺利。"],["证据等级","B（能量不足综述显示平均瘦体重增益受影响。一项有抗阻经验男性的热量限制试验比较中等和较高训练量。减脂期间先调哪项仍按个人反应决定）。"],["适用与备注","训练量变多、持续疲劳或出现月经变化时，见[能量供应不足的线索](../06-training-health.md#q37)。"],["来源","Murphy 和 Koehler 荟萃分析的 Analysis A，训练量与能量限制试验的分组、研究对象和结果。 [能量不足与抗阻综述](https://doi.org/10.1111/sms.14075) · [减脂期训练量试验](https://doi.org/10.1111/sms.14237)"]],"path":"book/resistance-training/06-training-goals.md","aliases":"","grades":["B"]},{"id":93,"qid":"Q93","section":"运动","chapter":"抗阻训练","question":"训练记录至少记什么，怎样看出比上个月进步了？","title":"记下每组重量和次数，隔几周按同一条件比较","fields":[["怎么做","记日期、动作版本、每组重量和次数。器械的座位档位、哑铃重量是单只还是合计，也记清楚。能估计余力时，为最后一组添一笔，记录还能做几次。月底从最近几次里找同一动作、相近幅度和余力的训练组，比较能不能以同样重量多做几次，或用更重的重量完成相同次数。"],["成本","每个动作结束后花十几秒记一行。比如「哑铃卧推，每只 12 千克，10／10／8 次，末组约余 2 次」。"],["说人话","拿同一动作、差不多的做法比几次记录，才能看出最近有没有多做一点。"],["收益","更容易看出重量或次数是否上升，也能定位连续几次下滑是从什么时候开始的。"],["证据等级","B（受训成人研究支持用增加重量或次数进阶，余力有专门量表。字段和按月回顾是便于执行的示例）。"],["适用与备注","换器材或放大动作幅度后可在记录里标记，先积累该版本的记录。余力的估法见[控制每组用力](05-progression.md#q76)。"],["来源","Plotkin 等逐步增加重量或次数试验的 Training Procedures 和 Results，Zourdos 等抗阻用力等级量表的深蹲实验。 [按次数或重量进阶的试验](https://peerj.com/articles/14142/) · [基于余力的抗阻用力量表](https://doi.org/10.1519/JSC.0000000000001049)"]],"path":"book/resistance-training/07-logs-and-breaks.md","aliases":"","grades":["B"]},{"id":94,"qid":"Q94","section":"运动","chapter":"抗阻训练","question":"力量上去了但围度没变化，怎样测量和判断自己的增肌进度？","title":"围度在相同条件下重复量，和训练记录一起看","fields":[["怎么做","选一两个关心的部位，记好身体一侧和量尺位置，尽量在相近时段、姿势放松、训练前测。量尺贴合皮肤，避免勒出凹痕。每次重新摆尺量两次取平均，隔几周在同样条件下复测。把围度、体重趋势和同动作训练记录放在一起看。"],["成本","一把软尺，每次约 5 分钟。例如每月量同侧上臂的同一位置，测量时手臂自然放松。"],["说人话","练得更重，是训练表现进步。想看体围怎么变，就固定方法多量几次。"],["收益","可以减少量尺位置和刚练完时的肿胀带来的波动。围度持续变化时，有多项记录可一起解释。"],["证据等级","B（力量与肌肉尺寸是不同的研究结局。原始研究显示超声和人体测量对部分训练变化的反映不同，训练初期的肌肉尺寸也可能受水肿影响。家庭测量流程是实践建议）。"],["适用与备注","围度包含肌肉、皮下组织和体液变化。相差很小的一次读数可以留待复测，通常无法据此估算增加了多少肌肉。"],["来源","ACSM 2026 立场声明的 Strength 与 Muscle Hypertrophy 小节，人体测量与超声比较研究的 Methods 和 Results，Damas 等研究的超声与水肿结果。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [人体测量与超声比较](https://pubmed.ncbi.nlm.nih.gov/40757554/) · [训练初期肌肉肿胀研究](https://pubmed.ncbi.nlm.nih.gov/26280652/)"]],"path":"book/resistance-training/07-logs-and-breaks.md","aliases":"","grades":["B"]},{"id":95,"qid":"Q95","section":"运动","chapter":"抗阻训练","question":"偶尔一两次比平时练得差，怎么判断当天调课还是改整个计划？","title":"偶尔状态差先调当天，连续下滑再查计划","fields":[["怎么做","先做熟悉的热身。如果平时的轻重量今天就明显吃力，工作组可以用轻一档的重量，或少做一组，保留动作控制和余力。记下这次调整，以及睡眠、间隔或器械是否变了。如果接下来几次可比训练仍下滑，再回看近期组数、负荷和休息安排。"],["成本","用原本的热身判断，记一行当天的变化。比如平常 3 组都能做稳，今天第 2 组已经明显费力，就少做第 3 组。"],["说人话","今天比平时累，就让今天的课轻一点。类似的情况一再发生，再改后面的课表。"],["收益","当天仍可完成能控制的练习，也留下可用来判断疲劳趋势的记录。"],["证据等级","B（受训成人卧推实验显示，做得越接近力竭，急性疲劳和主观疲劳通常越大。用热身决定当天减重量或组数是实践办法）。"],["适用与备注","遇到反复下滑可看[排查训练停滞](05-progression.md#q83)和[安排短期减量](#q96)。出现寒战、头晕或异常疼痛时先停止当次训练，按症状处理。"],["来源","抗阻训练力竭距离与疲劳研究的 Experimental Design 和 Results，研究对比卧推力竭、剩余约 1 次和约 3 次三种情况。 [力竭距离与急性疲劳研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC9908800/)"]],"path":"book/resistance-training/07-logs-and-breaks.md","aliases":"","grades":["B"]},{"id":96,"qid":"Q96","section":"运动","chapter":"抗阻训练","question":"连续训练几周后表现和恢复都变差，什么时候考虑安排减量？","title":"连续表现下滑且恢复变差时，试一段短期减量","fields":[["怎么做","先看几次条件相近的训练。若原来能做稳的重量或次数持续变难，同时酸胀或疲乏常拖到下一练，可以先减几天到一周的训练量，保留熟悉动作。用这段时间检查最近是否加了太多组、练得太接近力竭，或睡眠和饮食有变化。减量后以正常热身和较轻工作组重新评估，再逐步加回。"],["成本","例如一周内把几个原来做 3 组的主要动作各减到 2 组，记录训练感受和隔天恢复。组数和时间按实际状态调整。"],["说人话","好几次都累得练不动，先少做一点，看看能不能恢复，再决定加回多少。"],["收益","短期降低训练负担，给后续课表调整提供可观察的依据。"],["证据等级","C（减量的定义和实施主要来自力量与体型项目教练共识。训练中完全停一周的试验结果有限，普通成年人应按当前反应判断，缺少固定间隔或通用组数）。"],["适用与备注","减量后仍持续疲劳，或日常活动也明显受影响时，可暂停提高负荷，必要时寻求医疗评估。"],["来源","Bell 等减量德尔菲共识的 Designing and Implementing Deloading Training，Coleman 等试验的停练一周方案与力量结局。 [减量德尔菲共识](https://doi.org/10.1186/s40798-023-00633-0) · [训练中完全停一周的试验](https://pmc.ncbi.nlm.nih.gov/articles/PMC10809978/)"]],"path":"book/resistance-training/07-logs-and-breaks.md","aliases":"","grades":["C"]},{"id":97,"qid":"Q97","section":"运动","chapter":"抗阻训练","question":"出差一两周、酒店器材很少，怎么改原有动作而保持训练习惯？","title":"出差用能做的动作接上原计划，留两个短时段","fields":[["怎么做","按现有器材挑出和原计划相近的动作。原来练深蹲和胸推，可以先用原地分腿蹲及扶稳固台面的俯卧撑。有哑铃时加熟悉的划船。把训练写进日程，先用少量能控制的组。新器材、新动作单独记，回家后方便对照原计划。"],["成本","例如一周留两个 15 分钟的空档，每次挑 2 到 3 个动作，各练 1 到 2 组。挑选可稳定支撑的地面和家具。"],["说人话","行李少、时间短，可以做几个接近原计划的动作，把下一次训练留在日程上。"],["收益","用当地有的器材维持训练节奏，减少重新选动作和安排时间的开销。"],["证据等级","B（ACSM 支持弹力带和居家形式改善部分抗阻结局。出差版本的动作和时长是例子，对原动作力量的维持程度因人和动作而异）。"],["适用与备注","使用弹力带前检查破损和固定方式。按原动作目标找替代见[常用器械的替代动作](03-exercise-selection.md#q67)。"],["来源","ACSM 2026 立场声明的 Resistance Training Prescriptions 栏目及居家、弹力带结果，Colado 等中年女性器械与弹力带训练试验的分组。 [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897) · [弹力带与器械训练比较试验](https://pubmed.ncbi.nlm.nih.gov/18714245/)"]],"path":"book/resistance-training/07-logs-and-breaks.md","aliases":"","grades":["B"]},{"id":98,"qid":"Q98","section":"运动","chapter":"抗阻训练","question":"因生活安排停练几周，回健身房的第一周怎么接回原计划？","title":"停练几周后，第一周用熟悉动作和较少工作组接回","fields":[["怎么做","先从上次熟悉的动作开始，逐步热身。第一周把重量和组数调低，做完还留几次余力。观察当天的动作控制和接下来一两天的恢复。下一次练得稳、恢复也正常时，可小幅加重量或加组，逐步接回原进度。"],["成本","例如停练前是 3 组，回来第一练可用轻一些的重量试 1 到 2 组。把加回的组数和重量分几次训练安排。"],["说人话","第一周先做回熟悉的动作，留点体力给下一练。旧课表可以分几次接回来。"],["收益","先了解当前能完成多少，再安排后续负荷，重建可持续的训练节奏。"],["证据等级","B（停练再练的随机试验支持部分适应能恢复。过渡期主动限负荷有大学运动员的共识支持，适用于普通成年人的首周组数仍需个体调整）。"],["适用与备注","适用于因行程或生活安排暂停、目前状态正常且无伤病限制的人。因病、受伤或手术暂停时，恢复需要考虑当时的病情和专业意见。"],["来源","Halonen 等初练成人停练 10 周后重新训练的随机试验，NSCA 与 CSCCa 过渡期共识的 Return to Training 部分。 [停练后恢复训练试验](https://doi.org/10.1111/sms.14739) · [NSCA 与 CSCCa 渐进返训共识](https://doi.org/10.1519/SSC.0000000000000477)"]],"path":"book/resistance-training/07-logs-and-breaks.md","aliases":"","grades":["B"]},{"id":99,"qid":"Q99","section":"运动","chapter":"抗阻训练","question":"同时准备半马或全马，腿部力量课怎样和关键跑课错开？","title":"先排半马或全马关键跑，再给腿部力量留位置","fields":[["怎么做","在一周日历上先标长跑和目标配速、间歇等关键课。腿部力量先避开这些跑之前、自己还容易酸沉的时段。可排在一堂关键跑之后，或排到距离下一堂关键跑较远的日子。下一次关键跑若反复觉得腿沉，先把力量课往后挪，或减少组数。"],["成本","用 5 分钟排周。比如周二跑间歇、周日长跑，可以试周二跑后做短力量课，或者周四做，分别观察周日长跑的末段体感。"],["说人话","先保住想认真跑的几堂课，选一个练腿后能缓过来的位置。"],["收益","较容易看出力量课在哪一天会挤占跑步恢复，也能在调整时保留固定的训练机会。"],["证据等级","B（跑者短期试验发现较强肌肉损伤后耐力跑表现可受影响。几天内的具体排法需按训练经历和实际恢复决定）。"],["适用与备注","给备战半马或全马的健康成人。从习惯的动作和用力开始，尤其是在刚加入力量训练时。"],["来源","Doma 和 Deakin 关于力量训练强度、训练量与短期跑步表现的研究，Marcora 和 Bosio 的耐力跑对照试验，以及波士顿田径协会全马 Level One 的周课表。 [力量课与短期跑步表现](https://pubmed.ncbi.nlm.nih.gov/24533516/) · [耐力跑对照试验](https://pubmed.ncbi.nlm.nih.gov/17346288/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/resistance-training/08-running-and-strength.md","aliases":"","grades":["B"]},{"id":100,"qid":"Q100","section":"运动","chapter":"抗阻训练","question":"跑步和力量不得不放在同一天，先练哪项，能分开多久更合适？","title":"跑步和力量同一天，先做当天优先的一课","fields":[["怎么做","关键跑的配速和质量更重要时先跑。若当天主要目标是腿部力量，且后面只是轻松跑，可以先做抗阻。如果日程允许，放到早晚两个时段。必须连着做时，让第二项的用力和时长与前一课留下的体力相符。"],["成本","一天要预留两个时段或一段更长的空档。比如早上跑专项，傍晚做短力量课。连着做时，可把后做的轻松跑从 40 分钟缩成 25 分钟，作为时间安排的示例。"],["说人话","今天最想做好哪项，就把精力先留给它。能早晚分开，就各找一个方便的时段。"],["收益","避免每次都让更重要的项目在疲劳时完成，同时保留两项训练。"],["证据等级","B（同课顺序荟萃分析支持力量优先对下肢动态力量的好处。另一综述的爆发力亚组中，同课训练出现较小增益，间隔至少 3 小时的组未检出同样影响。具体间隔取决于目标和日程）。"],["适用与备注","这里的间隔结果来自多种有氧和抗阻训练。半马与全马的重点跑如何排周，见[关键跑与力量错开](#q99)。"],["来源","Eddens 等同场训练顺序荟萃分析的结论，Schumann 等并行训练综述第 3.3 节的爆发力亚组及补充图 S11。 [训练顺序荟萃分析](https://pmc.ncbi.nlm.nih.gov/articles/PMC5752732/) · [并行训练与间隔综述](https://doi.org/10.1007/s40279-021-01587-7)"]],"path":"book/resistance-training/08-running-and-strength.md","aliases":"","grades":["B"]},{"id":101,"qid":"Q101","section":"运动","chapter":"抗阻训练","question":"跑量进入备赛高峰，腿部力量训练哪些部分可以减、哪些可以留？","title":"备赛跑量最高时，先减腿部力量的额外组数","fields":[["怎么做","跑量进入高峰时，保留做得熟、确实想维持的一两个腿部动作。先减额外组数、会明显酸痛的辅助动作或几组用力特别高的训练。若关键跑仍受影响，再减少腿部训练频率或把重量调轻些。"],["成本","比如平时两天各练两种腿部动作、每项三组，高峰周先把主动作留两组、暂停一个辅助动作。用最少的改动观察一周的跑步反应。"],["说人话","高峰周给跑步留体力。腿部训练想留，就留熟悉的主动作和少量组数。"],["收益","有助于维持练习习惯，并让赛前重点跑的恢复负担较容易控制。"],["证据等级","B（抗阻维持剂量试验支持减少训练后仍可保留部分适应，短期跑步试验也显示力量课用力和训练量会影响后续跑步。半马和全马峰值周的具体剂量属排课建议）。"],["适用与备注","适合此前已规律练抗阻的人。主要练习的保留思路也见[短期减少力量训练量](02-weekly-plan.md#q55)。"],["来源","Bickel 等随机减量维持试验的两个年龄层结果，Doma 和 Deakin 的短期跑步试验。 [抗阻减量与维持试验](https://pubmed.ncbi.nlm.nih.gov/21131862/) · [力量课与短期跑步表现](https://pubmed.ncbi.nlm.nih.gov/24533516/)"]],"path":"book/resistance-training/08-running-and-strength.md","aliases":"","grades":["B"]},{"id":102,"qid":"Q102","section":"运动","chapter":"抗阻训练","question":"赛前减量期间，最后几次力量训练怎么放进比赛周？","title":"比赛周把最后的腿部力量课提前或省掉","fields":[["怎么做","将比赛周的跑课和休息先排好。想留力量练习时，把短课放到自己平时有足够恢复余地的一天，选熟悉动作，留几次余力。平时腿部力量课会酸几天，或这周已有出行与恢复压力时，可以省掉赛前那一节。"],["成本","安排一个短时段即可。比如周日比赛、平时练腿后两三天仍觉得酸，就在周初用熟悉动作做少量组，或者留到赛后恢复再做。"],["说人话","比赛周主要是带着有余力的腿去起跑。短课能轻松恢复就留，排不开就省。"],["收益","给赛前恢复留空间，减少最后几天的训练让双腿在比赛时仍觉得沉。"],["证据等级","C（耐力减量研究支持赛前减少总训练负担，赛事课表展示省略专项力量时段的排法。最后一节抗阻课的日期用于个人安排）。"],["适用与备注","给把半马或全马当该阶段主要目标的跑者。跑步减量见[赛前减量](../distance-running/05-taper.md#q169)。"],["来源","Wang 等耐力减量荟萃分析表 2，波士顿田径协会全马 Level One 第 18–20 周。 [耐力减量荟萃分析](https://pmc.ncbi.nlm.nih.gov/articles/PMC10171681/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/resistance-training/08-running-and-strength.md","aliases":"","grades":["C"]},{"id":103,"qid":"Q103","section":"运动","chapter":"抗阻训练","question":"长期以跑步为主，想加力量训练时怎样用最少动作覆盖主要需求？","title":"以跑步为主，先用几种可重复的抗阻动作覆盖全身","fields":[["怎么做","挑容易持续做的下肢推蹬、髋部发力、提踵和上肢推拉。比如分腿蹲、轻哑铃罗马尼亚硬拉、站姿提踵、抬高手的俯卧撑和划船。动作太多时分成两次短课，随后根据训练余力微调。"],["成本","可先用 20–25 分钟做一轮，给每个动作一两组的尝试空间。瑜伽垫、稳固支撑和已有的哑铃或弹力带可以满足一部分动作。"],["说人话","挑几项能长期练的动作，腿能蹲、髋能发力、脚踝能提起脚跟，上肢也能推和拉。"],["收益","开始练力量时有现成的安排，也能用组数、次数或重量看哪项进步了。"],["证据等级","B（中长跑者综述发现一些力量训练方案可改善跑步经济性或表现。选用的五项动作及时间为普通跑者的起步示例）。"],["适用与备注","适合长期以跑步为主、刚加入抗阻的人。一般健康成人主要肌群的安排见[每周练主要肌群](../01-resistance-training.md#q09)。"],["来源","Llanos-Lagos 等中长跑者力量训练综述的训练方案和分析，以及 ACSM 2026 抗阻训练立场声明的居家与弹力带抗阻结果。 [跑步经济性综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC11052887/) · [跑步表现综述](https://doi.org/10.1007/s40279-024-02018-z) · [ACSM 抗阻训练立场声明](https://doi.org/10.1249/MSS.0000000000003897)"]],"path":"book/resistance-training/08-running-and-strength.md","aliases":"","grades":["B"]},{"id":104,"qid":"Q104","section":"运动","chapter":"拉伸与活动度","question":"感觉身体紧，怎样用主动和辅助活动的差别判断该练活动度还是动作控制？","title":"比较主动和辅助能到的幅度，再选练习","fields":[["怎么做","选一个无痛动作，比较自己做与轻轻辅助能到哪里。例如仰卧抬一只手过头，先自己抬，再用另一只手略微托着抬高，两次都保持躯干位置相近。辅助能多出一段时，先试慢速主动练到可控的末端。两种做法都差不多受限时，可以试针对这个方向的活动度练习，然后复测。"],["成本","几分钟，无需器械。两次都用相近的姿势和速度。"],["说人话","手能被带到的位置和自己能稳稳到的位置都值得看。把区别用来选一个练习试。"],["收益","主动和被动活动范围是临床测量中的不同项目。拉伸和抗阻训练都可以改变活动范围。两种幅度的差别还可能受姿势、努力程度、疼痛等影响，不能据此找出唯一原因。"],["证据等级","A（拉伸和抗阻可改善活动范围）。C（用两种做法选练习的示例）。"],["适用与备注","辅助只用轻力。受伤后新出现的限制、明显疼痛或无力，适合先评估再练。"],["来源","埃默里大学康复医学量角测量手册，以及 Afonso 等关于抗阻训练和拉伸的系统综述。 [测量手册](https://med.emory.edu/departments/rehabilitation-medicine/_documents/competencies_criteria_manual.pdf) · [比较综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC8067745/)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["A","C"]},{"id":105,"qid":"Q105","section":"运动","chapter":"拉伸与活动度","question":"静态拉伸、动态活动和活动度练习分别用在什么场景？","title":"按热身、拓宽范围或控制动作选择练法","fields":[["怎么做","把一个姿势保持一会儿，是静态拉伸，适合单独练某个方向的活动范围。轻松、有控制地反复通过动作范围，是动态活动，适合用来逐渐进入跑步或力量热身。想把能到的幅度用在深蹲、举手等动作里，就练慢速到位、控制返回，熟练后再考虑加负荷。"],["成本","先按当前目的选一种。动态活动可以并入现有热身。"],["说人话","想热身就逐步动起来。想拓宽范围可以做静态拉伸，想把新范围用起来就练原动作。"],["收益","拉伸研究支持多种拉伸方式短时提高活动范围，规律拉伸可以提高长期活动范围。直接比较研究也支持一定范围内的抗阻练习可改善活动度。"],["证据等级","A（拉伸和抗阻训练对活动范围的作用）。C（场景选择）。"],["适用与备注","活动度练习是个宽泛说法。记录时写清动作和做法，更容易回看哪种练习有帮助。"],["来源","Warneke 等 2025 年国际拉伸共识，以及 Afonso 等关于抗阻和拉伸的系统综述。 [拉伸共识](https://doi.org/10.1016/j.jshs.2025.101067) · [比较综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC8067745/)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["A","C"]},{"id":106,"qid":"Q106","section":"运动","chapter":"拉伸与活动度","question":"在家怎样用可重复的动作记录踝、髋或肩的活动范围？","title":"固定姿势和测量条件，记录踝、髋或肩的活动范围","fields":[["怎么做","选一个跟目标有关的动作。测踝可用膝碰墙，脚跟不抬，记脚趾离墙最远多少厘米。测髋可仰卧主动屈髋，用固定侧面机位记录大腿到哪会开始带动骨盆。测肩可同样从侧面录举手，记录在躯干稳定时手臂到哪。每次同样的热身、站位和机位，左右各做两次。"],["成本","一面墙、一把尺或一部手机。首次把站位和拍摄位置记下来。"],["说人话","用同一个办法反复测。数字小幅波动时，先看看测量条件是否一样。"],["收益","膝碰墙测试在标准化条件下有较好的重复性。健康成人的肩部自测研究也说明方法和具体方向会影响准确度。家庭视频用于对照个人动作。"],["证据等级","B（标准化测试的测量研究，外推到家用记录）。C（髋和肩的视频示例）。"],["适用与备注","记录目标动作的完成情况也有价值。用手机拍摄时，镜头角度和距离尽量固定。"],["来源","Powden 等的负重弓步测试综述，以及健康成人肩关节活动范围自测研究的方法。 [踝测试综述](https://pubmed.ncbi.nlm.nih.gov/25704110/) · [肩自测研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC9264016/)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["B","C"]},{"id":107,"qid":"Q107","section":"运动","chapter":"拉伸与活动度","question":"身体两侧活动范围不同，怎样判断要不要花时间练较紧的一侧？","title":"两侧活动范围有差别，先看是否影响目标动作","fields":[["怎么做","先按同样方法重复测几次。再看较紧一边是否影响你想完成的动作，比如下台阶时脚跟抬起，或举手拿东西时明显绕开。如果平时动作顺畅，可以先记录。如果确实影响动作，给这一侧加少量针对性练习，再用同一个动作复查。"],["成本","多花几分钟测两边。针对性练习可并入已有的活动度时间。"],["说人话","两边有差别很常见。先看差别稳不稳定、会不会妨碍你做事。"],["收益","运动人群的前瞻队列研究对左右功能差异与伤病的关系结果不一致，指标也涉及力量、平衡及柔韧性。家庭活动范围测试更适合追踪个人变化。"],["证据等级","B（前瞻队列综合结果，需外推到家庭测试）。C（练习优先级的判断）。"],["适用与备注","新出现且伴随疼痛、肿胀或无力的差异，按症状评估。"],["来源","Guan 等对下肢功能左右差异与运动伤病的前瞻研究综述，以及 Powden 等对膝碰墙测试重复性的综述。 [前瞻研究综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC8779786/) · [测量综述](https://pubmed.ncbi.nlm.nih.gov/25704110/)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["B","C"]},{"id":108,"qid":"Q108","section":"运动","chapter":"拉伸与活动度","question":"摸不到脚尖值得专门练吗，怎样按运动目标选更有用的活动度指标？","title":"想改善哪个运动动作，就用那个动作选指标","fields":[["怎么做","先写下想改善的动作。想深蹲得更稳，记录同一负荷下脚跟着地时能蹲多深。想举过头顶，记录能否用可控的姿势把熟悉重量举到计划位置。确实想学体前屈时，再用同样的站姿、膝盖和热身条件记录指尖位置。"],["成本","用现有训练就能记，选一项主要指标即可。"],["说人话","想改善哪个动作，就测哪个动作。摸脚尖适合追踪体前屈本身。"],["收益","坐位体前屈测试对腘绳肌伸展性的估计效度中等，对腰部伸展性的估计效度较低。站姿摸脚尖和坐位测试的条件有别，不能直接沿用同一效度。"],["证据等级","B（坐位体前屈的测量研究，外推到相近任务）。C（按目标选指标）。"],["适用与备注","目标动作的改善也取决于力量、平衡和熟练程度。最好把姿势和负荷一起记。"],["来源","Mayorga-Vega 等对坐位体前屈测试效度的荟萃分析。 [系统综述全文](https://pmc.ncbi.nlm.nih.gov/articles/PMC3918544/)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["B","C"]},{"id":109,"qid":"Q109","section":"运动","chapter":"拉伸与活动度","question":"练力量前只有几分钟，动态活动度怎么接到专项热身上？","title":"力量训练前只剩几分钟，先做轻量专项热身","fields":[["怎么做","先挑一个会影响当天主动作的范围做几次，例如深蹲前用扶墙膝碰墙活动踝。接着做主动作的轻量版本，再按需要逐步加重量，组间歇够。时间更少时，从空杆、轻哑铃或器械低档位的主动作开始。"],["成本","简单练习可以直接在训练位置完成。重组仍需给递增热身和休息留时间。"],["说人话","热身做到当天要练的动作。哪里暂时不好动，就先花一点时间活动哪里。"],["收益","动态活动可用来暂时增加活动范围。关于节省力量训练时间的综述建议优先把有限的热身时间给专项热身。具体热身组数随动作和目标负荷变化。"],["证据等级","B（短时准备和表现结果随方案变化）。C（热身顺序示例）。"],["适用与备注","主动作从较轻版本开始。新动作或当日特别重的组需要额外准备。"],["来源","Warneke 等 2025 年拉伸共识，以及 Iversen 等时间效率综述的热身部分。 [拉伸共识](https://doi.org/10.1016/j.jshs.2025.101067) · [训练综述](https://doi.org/10.1007/s40279-021-01490-1)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["B","C"]},{"id":110,"qid":"Q110","section":"运动","chapter":"拉伸与活动度","question":"跑步前动作发僵，哪些动态活动可以跟轻松跑热身配合？","title":"跑前发僵时，先慢跑，再加一两个动态动作","fields":[["怎么做","先走一小段或轻松慢跑几分钟。需要活动一下时，选一两项，比如交替提踵、原地抬膝或扶稳做小幅摆腿。每侧轻松做几次，再回到慢跑，让动作自然舒展开。当天要跑间歇，可以在慢跑后逐步加速。"],["成本","几分钟，无需器材。留意脚下和来往的人。"],["说人话","先慢慢跑起来，想活动哪里就选一两个动作，然后回到跑步。"],["收益","一项休闲长跑者随机交叉试验发现，特定的动态拉伸热身可改善测试中的跑步经济性和表现。研究用的是完整的实验热身，日常几次提踵或摆腿的效果无法由它直接推算。"],["证据等级","B（休闲跑者试验，外推至本文的短热身）。C（日常热身示例）。"],["适用与备注","轻松跑可以从较慢的速度开始。有疼痛或明显跛行时，先停下来评估。"],["来源","休闲长跑者动态拉伸随机交叉试验，以及 Warneke 等 2025 年拉伸共识。 [跑者试验](https://pubmed.ncbi.nlm.nih.gov/39608347/) · [拉伸共识](https://doi.org/10.1016/j.jshs.2025.101067)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"跑前热身 跑步前热身","grades":["B","C"]},{"id":111,"qid":"Q111","section":"运动","chapter":"拉伸与活动度","question":"重训练或比赛前想做静态拉伸，怎样安排时间和后面的热身？","title":"重练或比赛前需要静态拉伸时，短拉后接专项热身","fields":[["怎么做","某个部位需要先拉一下才能顺畅进入动作时，用短时间、温和的静态拉伸，然后做动态活动和轻到重的专项热身。如果想长时间拉同一肌群，可以安排到另一个时段。重训前用热身组检查动作和发力，比赛日沿用已练习过的顺序。"],["成本","几分钟。优先为专项热身留时间。"],["说人话","短拉完再动起来。需要出最大力时，把长时间的拉伸放到别的时段。"],["收益","系统综述中，静态拉伸时间较长时，随后立即测最大用力更容易出现下降。短时间拉伸的平均影响较小。是否影响整套热身后的比赛或训练表现还取决于测试和安排。"],["证据等级","A（较长静态拉伸后的短时表现证据）。C（结合专项热身的安排）。"],["适用与备注","较长常按单一肌群累计约一分钟或更久讨论。实际反应并非在一分钟突然改变。"],["来源","Behm 等的拉伸急性效应系统综述，以及 Warneke 等 2025 年拉伸共识。 [急性效应综述](https://pubmed.ncbi.nlm.nih.gov/26642915/) · [拉伸共识](https://doi.org/10.1016/j.jshs.2025.101067)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["A","C"]},{"id":112,"qid":"Q112","section":"运动","chapter":"拉伸与活动度","question":"跑后或练后拉伸，哪些感受适合用它改善，怎样判断做完是否有帮助？","title":"练后拉伸，按当下舒适度和次日感受判断","fields":[["怎么做","练完若只是感觉紧，可以轻柔拉一两处，然后做一个熟悉的无痛动作，例如走几步或做浅蹲，看看舒服程度和动作是否变化。想比较对隔天的影响，找两次强度接近的训练，一次拉、一次不拉，记同一时间的酸痛和活动情况。"],["成本","几分钟。酸痛本来就会随训练内容、睡眠和时间变化。"],["说人话","拉完感觉舒服，可以把它留下。为了隔天不酸，现有证据给不了多大把握。"],["收益","运动后拉伸随机试验的综述中，与休息相比，次日及之后的延迟性肌肉酸痛和短时力量恢复未见明确改善，证据有限。"],["证据等级","B（直接比较的试验较少，证据确定性低）。C（记录个人感受的做法）。"],["适用与备注","训练中突然出现的局部疼痛、肿胀或活动受限需要另行处理。"],["来源","Afonso 等 2021 年运动后拉伸与恢复的随机试验系统综述，以及 Warneke 等 2025 年共识。 [恢复综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC8133317/) · [拉伸共识](https://doi.org/10.1016/j.jshs.2025.101067)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["B","C"]},{"id":113,"qid":"Q113","section":"运动","chapter":"拉伸与活动度","question":"泡沫轴和拉伸都能用时，训练前想暂时增加动作幅度该怎么选？","title":"先轻松热身，再按动作复测结果选泡沫轴或拉伸","fields":[["怎么做","先用轻松热身试做目标动作。如果还需要一点幅度，挑一种方便的做法，短时间滚压相关肌肉，或做温和拉伸。做完立即用同样的轻负荷、站位和速度复查原动作，再接专项热身。"],["成本","拉伸通常不需要器材。泡沫轴有器材和摆放成本，已有就可试。"],["说人话","先动起来，再试手边方便的方法。用下一次动作有没有变顺来决定是否留下。"],["收益","荟萃分析发现，泡沫轴可短时提高活动范围，和拉伸相比未检出稳定优势。把泡沫轴和拉伸与其他暖身方式比较时，也未检出整体活动范围优势。"],["证据等级","A（短时活动范围的荟萃分析，综述作者把与其他热身方式的比较评为中等确定性）。C（个人热身复查方法）。"],["适用与备注","泡沫轴轻压肌肉即可。出现刺痛、麻木或明显疼痛时停下。"],["来源","Wilke 等健康成人泡沫轴急性效应综述，以及对照多种热身方式的荟萃分析。 [泡沫轴综述](https://pubmed.ncbi.nlm.nih.gov/31628662/) · [热身比较](https://pmc.ncbi.nlm.nih.gov/articles/PMC11184403/)"]],"path":"book/mobility/01-assessment-and-warmup.md","aliases":"","grades":["A","C"]},{"id":114,"qid":"Q114","section":"运动","chapter":"拉伸与活动度","question":"深蹲时脚跟容易抬，怎么查踝背屈活动度，并试一种练法？","title":"深蹲脚跟抬起，用膝碰墙记录和练习踝背屈","fields":[["怎么做","面对墙弓步站，前脚踩实，把前膝缓慢送向墙。找到脚跟还能踩地、膝盖刚碰墙的最远位置，量脚趾到墙的距离，两侧各测两次。想练时把脚移近一点，扶墙做几次缓慢的前膝前移，再用原站距做几次轻松的徒手深蹲。"],["成本","一面墙、一把尺和几分钟。记录鞋子、站位和热身条件。"],["说人话","膝碰墙用来记录踝的变化。蹲时脚跟是否更好踩稳，要回到深蹲看。"],["收益","负重弓步测试的综述发现，规范测量的重复性较好。实验中改变踝可用范围会改变蹲起动作。脚跟抬起还可能和站姿、平衡或深度有关。"],["证据等级","B（测量综述与实验支持，需外推到个人深蹲）。C（膝碰墙活动示例）。"],["适用与备注","复测前保持测试方法一样。踝前方出现疼痛或卡住时，先缩小幅度或暂停。"],["来源","Powden 等负重弓步测试综述，以及 Macrum 等深蹲与踝活动范围实验。 [测试综述](https://pubmed.ncbi.nlm.nih.gov/25704110/) · [深蹲实验](https://pubmed.ncbi.nlm.nih.gov/22100617/)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["B","C"]},{"id":115,"qid":"Q115","section":"运动","chapter":"拉伸与活动度","question":"跑步跨步或弓步时髋前很紧，怎样选一个适合练髋伸展的动作？","title":"跨步时髋前紧，扶墙试小幅度的髋伸展","fields":[["怎么做","扶墙分腿站，后腿在要拉的一侧。双膝微弯，轻轻把骨盆收正，再让身体往前移少许，感觉后腿髋前方温和牵拉即可。保持短时间后放松，再试几次舒服的弓步。膝盖跪着舒服的人，也可用垫子做半跪版本。"],["成本","有墙就能做。半跪版本需要垫子，站姿便于随时停下。"],["说人话","动作小一点，感觉后侧那条腿的髋前在拉伸。做完回到弓步确认是否更舒服。"],["收益","静态拉伸可以提高被练习方向的活动范围。这个姿势是髋前拉伸的实用示例。它能否改变跑姿、配速或跑步伤病还需另看证据。"],["证据等级","A（静态拉伸对活动范围的作用）。C（髋前练习及复测示例）。"],["适用与备注","保持自然呼吸，避免为了加深幅度而明显拱腰。髋前夹痛或负重疼痛时先停。"],["来源","美国心脏协会髋屈肌拉伸示例，以及 Konrad 等长期拉伸与活动范围的系统综述。 [动作示例](https://www.heart.org/en/healthy-living/exercise-and-physical-activity/staying-motivated/stretches-for-exercise-and-flexibility) · [长期拉伸综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC10980866/)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["A","C"]},{"id":116,"qid":"Q116","section":"运动","chapter":"拉伸与活动度","question":"抬腿时大腿后侧紧，怎么练腘绳肌活动度并保持动作稳定？","title":"仰卧托住大腿，再缓慢伸膝练大腿后侧","fields":[["怎么做","仰卧，一脚踩地。双手托住另一条腿的大腿后侧，在躯干和骨盆保持稳定的情况下，慢慢把那条腿伸直到大腿后侧有温和牵拉。维持一小会儿再回落。也可固定大腿位置，主动缓慢伸膝和弯膝几次，记录到哪还能做稳。"],["成本","一块垫子即可。双手够不到大腿后侧时，可以先少抬一点。"],["说人话","先把大腿托稳，再缓慢伸膝。用能保持姿势的幅度。"],["收益","拉伸训练能改善腘绳肌相关柔韧性指标。仰卧有支撑的练法便于控制姿势，动作的长期效果取决于持续练习和起始活动范围。"],["证据等级","A（腘绳肌活动范围的拉伸证据）。C（仰卧操作和复测示例）。"],["适用与备注","放松脚踝。出现向小腿或脚放射的电击感、刺麻或疼痛时，退出动作并停止本次拉伸。"],["来源","美国骨科医师学会（AAOS）仰卧腘绳肌拉伸说明，以及 Konrad 等长期拉伸综述。 [动作说明](https://www.orthoinfo.org/bodypart/hip-thigh/hip-conditioning-program/) · [长期拉伸综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC10980866/)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["A","C"]},{"id":117,"qid":"Q117","section":"运动","chapter":"拉伸与活动度","question":"手举过头时容易拱腰，怎样分辨肩或胸椎的活动度练习该从哪试？","title":"举手容易拱腰，分别试练肩和上背再复测","fields":[["怎么做","先拍一次无负荷举手，再仰卧屈膝试举，观察躯干姿势固定后手臂能到哪。如果仰卧能轻松举得更高，可以先练轻负荷举手并保持躯干稳定。两种姿势都觉得范围受限时，分别试一次温和的肩部辅助举手、一次上背转动或伸展。每试一种就回到原站姿复查，选更容易改善动作的一项。"],["成本","约几分钟。两种练习分开试，拍摄方向和站位保持一致。"],["说人话","先让腰保持舒服的位置，再看手能举多高。用复测挑一个值得多练的动作。"],["收益","实验显示，改变胸椎姿势会影响肩胛运动与手臂抬举的幅度。肩关节、肩胛和躯干共同参与举手，家庭复测适合比较姿势和练习反应。"],["证据等级","B（姿势与抬举的实验结果）。C（家庭试练及复测流程）。"],["适用与备注","无痛时先用自重试。新出现的疼痛、明显无力或伤后受限，建议评估。"],["来源","Kebaetse 等关于胸椎姿势与肩部运动的实验，以及英国剑桥大学医院（CUH）胸椎练习说明。 [实验研究](https://pubmed.ncbi.nlm.nih.gov/10453773/) · [医院动作说明](https://www.cuh.nhs.uk/patient-information/thoracic-spine-exercises/)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["B","C"]},{"id":118,"qid":"Q118","section":"运动","chapter":"拉伸与活动度","question":"上背转动不顺，怎样练胸椎旋转并减少用下背代偿？","title":"坐稳骨盆，用舒适的小幅度练胸椎转动","fields":[["怎么做","坐在稳固椅子上，双脚着地，两手交叉抱胸。骨盆朝前，慢慢把胸口转向一侧，转到舒服位置后返回，再换边。手机可以从正面录一次，留意是否靠挪脚、摆膝盖或明显侧弯才能转得更远。每边先做几次，呼吸自然。"],["成本","一把不带滚轮的椅子，几分钟。"],["说人话","让胸口慢慢转，脚和骨盆保持相对稳定。用顺畅的小幅度起步。"],["收益","剑桥大学医院将坐姿转动用于练习胸椎活动。让骨盆保持相对稳定有助于反复做出相近的动作，家庭练习无法精确分辨每节脊柱的转动。"],["证据等级","C（医院物理治疗动作和动作控制提示）。"],["适用与备注","单纯僵硬可以在无痛范围内试。新受伤、持续痛或转动伴随异常症状时，先评估。"],["来源","英国剑桥大学医院物理治疗团队的胸椎练习，旋转部分。 [医院动作说明](https://www.cuh.nhs.uk/patient-information/thoracic-spine-exercises/)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["C"]},{"id":119,"qid":"Q119","section":"运动","chapter":"拉伸与活动度","question":"想长期增加某个关节的活动范围，一周怎样安排静态拉伸的次数和时长？","title":"增加关节活动范围，从每周两到三次静态拉伸起步","fields":[["怎么做","先挑一个目标动作和一个方向。可每周做两到三天，每次两组、每组约 30 秒，保持轻到适中的牵拉感。持续几周，在相同热身条件下复测。需要继续改善且练得舒服时，可以增加一点周总时长。"],["成本","每个方向一两分钟，再加上换边和准备时间。用手机计时即可。"],["说人话","先每周固定几次，每次拉到能舒服保持。过几周看实际幅度有没有变。"],["收益","静态拉伸能改善成年人的柔韧性。一项剂量荟萃回归发现，单次累计超过约 4 分钟，未观察到额外的即时活动范围改善；每周累计超过约 10 分钟，未观察到额外的长期改善。这些数值是研究中的平均估计。"],["证据等级","A（静态拉伸改善柔韧性）。B（荟萃回归的平均剂量关系）。C（起步安排）。"],["适用与备注","如需要在一节课里最大用力，可把持续较久的拉伸放在其他时段，参见[赛前和重训前的安排](01-assessment-and-warmup.md#q111)。"],["来源","ACSM 成人体适能立场的柔韧性建议，以及 Ingram 等 2025 年静态拉伸剂量系统综述。 [ACSM 立场](https://pubmed.ncbi.nlm.nih.gov/21694556/) · [剂量综述](https://doi.org/10.1007/s40279-024-02143-9)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["A","B","C"]},{"id":120,"qid":"Q120","section":"运动","chapter":"拉伸与活动度","question":"拉伸时多紧算合适，遇到刺痛、麻木或电击感该怎么处理？","title":"拉到能稳定保持即可，刺痛、麻木或电击感出现就退出","fields":[["怎么做","缓慢进入动作，停在能正常呼吸、能稳定保持、感觉到牵拉的位置。越拉越痛、出现刺痛、麻木或电击感时，退出姿势并暂停。若离开姿势后仍持续、在其他动作也反复出现，或伴随明显无力，安排医疗评估。"],["成本","只要放轻力度和缩小幅度。动作能稳定保持时再考虑延长时间。"],["说人话","感觉拉住了、还能放松呼吸，就可以。刺、麻或像过电时马上松开。"],["收益","一项成人静态拉伸综述发现，研究中的拉伸强度与即时或长期柔韧性改善没有明确关系。体适能建议常以紧绷或轻微不适作为一般拉伸强度的描述。"],["证据等级","A（成人静态拉伸综述的强度分析）。C（舒适起步和出现症状时暂停）。"],["适用与备注","对健康成年人日常拉伸适用。已接受治疗或康复的人按自己的专业指导安排。"],["来源","Ingram 等静态拉伸综述的结果、ACSM 成人体适能立场、Warneke 等拉伸共识及 NHS 的异常感觉就医说明。 [静态拉伸综述](https://pubmed.ncbi.nlm.nih.gov/39614059/) · [ACSM 立场](https://pubmed.ncbi.nlm.nih.gov/21694556/) · [拉伸共识](https://doi.org/10.1016/j.jshs.2025.101067) · [NHS 异常感觉](https://www.nhs.uk/symptoms/pins-and-needles/)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["A","C"]},{"id":121,"qid":"Q121","section":"运动","chapter":"拉伸与活动度","question":"普通拉伸、收缩再放松的拉伸和负重活动度练习，怎样按目标和条件选？","title":"想拓宽范围可拉伸，想带着负荷用就练动作","fields":[["怎么做","只想让某个方向更容易达到，可以先做静态拉伸。已经熟悉收缩后放松的拉伸时，也可轻轻发力、放松后进入稍大的舒适范围。如果目标是有负重时也能控制这段幅度，可用很轻的原动作在可控范围内缓慢练习，再逐步扩展范围或加重。"],["成本","静态拉伸易独立完成。收缩放松需要熟悉发力。负重练习需要合适器材和准备。"],["说人话","只练幅度，先从方便的拉伸开始。想在举重时用得上，就练有负荷的动作。"],["收益","长期静态拉伸和收缩放松类拉伸都能提高活动范围。一项直接比较的综述中，抗阻训练和拉伸对活动范围的改善未见明显总体差异，各研究的动作和训练方式不同。"],["证据等级","A（多种方式能改善活动范围）。C（按目标和器材选择）。"],["适用与备注","收缩放松类拉伸也称 PNF 的一种做法。初次尝试可用轻力度，避免同伴强推到末端。"],["来源","Konrad 等长期拉伸综述、Afonso 等抗阻与拉伸比较及 Warneke 等共识。 [长期拉伸综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC10980866/) · [抗阻比较](https://pmc.ncbi.nlm.nih.gov/articles/PMC8067745/) · [拉伸共识](https://doi.org/10.1016/j.jshs.2025.101067)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["A","C"]},{"id":122,"qid":"Q122","section":"运动","chapter":"拉伸与活动度","question":"活动范围有了却在训练动作里用不上，怎样把新的幅度练进原动作？","title":"先在轻量原动作里练稳新幅度，再加难","fields":[["怎么做","先用原动作的简单版本。比如踝活动范围增加了，就先用扶稳的徒手蹲在新幅度里慢慢下降、短暂停住再站起。保持几次动作都稳定以后，试原动作的轻重量版本。每次优先增加幅度、重量或次数中的一项，用视频或日志记录。"],["成本","用现有器材就能练。先给原动作留一两个轻量组。"],["说人话","把新幅度用在轻一些的原动作里，做稳以后再逐步加难。"],["收益","抗阻训练本身可以提高活动范围，专项动作练习有助于提高该动作的力量。这个进阶顺序用来观察新幅度能否在负荷下主动控制。"],["证据等级","A（抗阻训练对活动范围与力量的作用）。C（从简单版本过渡到负重的步骤）。"],["适用与备注","深蹲、举手等动作要以完成目标所需的幅度为准。加重后控制变差，就从之前稳定的范围继续练。"],["来源","Afonso 等抗阻训练与拉伸系统综述，以及 ACSM 2026 年抗阻训练立场。 [活动范围综述](https://pmc.ncbi.nlm.nih.gov/articles/PMC8067745/) · [ACSM 立场](https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["A","C"]},{"id":123,"qid":"Q123","section":"运动","chapter":"拉伸与活动度","question":"练了几周活动度没变化，怎么复测并决定改动作、改频率或先做评估？","title":"活动度几周没变，先重测，再决定改练法还是评估","fields":[["怎么做","先按原来的时间、热身、机位和动作重测两次，再看目标动作是否有改善。训练记录不全时，先记清每周做了几次、持续多久。练得规律而变化很小时，可换更贴近目标的动作，或小幅调整每周时长，每次试一个改动。有疼痛、卡住或明显无力，就优先评估。"],["成本","一次复测需几分钟。至少记目标、训练量和复测条件。"],["说人话","先检查测量和练习有没有照原计划做。需要改时一次改一件事。"],["收益","活动度测量本身会有波动，标准化有助于复测。成人静态拉伸对柔韧性有平均收益，个人变化与起点和实际练习量有关。"],["证据等级","A（静态拉伸的平均改善）。B（测量结果外推到家庭测试）。C（复测和调整流程）。"],["适用与备注","复测安排可参考[踝、髋和肩的家庭记录](01-assessment-and-warmup.md#q106)。同时记录实际训练动作的变化。"],["来源","Powden 等的负重弓步测试重复性综述，以及 Ingram 等静态拉伸剂量综述。 [复测综述](https://pubmed.ncbi.nlm.nih.gov/25704110/) · [剂量综述](https://doi.org/10.1007/s40279-024-02143-9)"]],"path":"book/mobility/02-exercises-and-progression.md","aliases":"","grades":["A","B","C"]},{"id":124,"qid":"Q124","section":"运动","chapter":"有氧训练","question":"想尝试长距离比赛，怎样判断先跑半马还是直接备战全马？","title":"首次备战长距离，拿近期跑量和时间对照半马、全马课表","fields":[["怎么做","列出最近几周能稳定维持的跑步天数、周跑量和最长一跑。找半马和全马各一份入门计划，分别对照第 1 周的训练和最忙几周的时间需求。如果目前接得上半马计划，且全马计划需要大幅改变平时跑量或时间安排，可以先选半马，再决定是否备战全马。"],["成本","花约 15 分钟查训练记录和日历。把每次跑步、来回交通和赛前可用的周数都算进去，也看最忙几周的长跑时段能否留出来。"],["说人话","先选一场自己能持续准备的比赛。报名表上的距离能选，日历上的时间也要算。"],["收益","能在报名前看出自己当前的跑步习惯、计划起点和赛前日程是否匹配。"],["证据等级","C（赛事官方课表可供比较。对照近期跑量和日程属于执行建议）。"],["适用与备注","给正在考虑首场半马或全马的成年人。可分别参考[首半马计划起点](../02-distance-running.md#q23)和[半马转全马的计划选择](../02-distance-running.md#q33)。"],["来源","波士顿田径协会半马 Level One 的适用对象和首周安排、全马 Level One 的计划概览。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":125,"qid":"Q125","section":"运动","chapter":"有氧训练","question":"看赛事的分段关门时间和分区出发规则，怎样判断自己是否有足够的完赛时间？","title":"报名前按自己分区的起跑时间核对每一处关门","fields":[["怎么做","查当届规则中的分区起跑、分段关门和终点关门。先确认每个关门点是固定钟点、从某一枪开始计时，还是按赛事公布的其他规则执行。若为固定钟点，就用关门钟点减去自己预计过起点的钟点，再跟该段预计累计用时比较。把走路、停站和起跑延迟留在估算里。"],["成本","用约 10 分钟列出各关门点。假设自己 7:20 过起点，10 公里固定在 8:50 关门，就有 90 分钟，折合累计平均 9 分钟/公里。若平时练习估计该段要 85 分钟，只余 5 分钟缓冲。每个关门点都要单独核算。"],["说人话","先看自己能用多少时间，再看路上第一处会卡在哪里。"],["收益","能在报名或选分区时发现中途时限是否比终点时限更紧。"],["证据等级","C（起跑和关门以官方赛事规则为准，钟点和配速为算例）。"],["适用与备注","实际执行以当届官方规程和现场指示为准。芯片净计时和关门时限的起算方式分别核对。"],["来源","上海市政府 2025 年上海马拉松跑者指南的分枪与关门部分，芝加哥半马官方赛事说明的配速要求部分。 [上海赛事指南](https://english.shanghai.gov.cn/en-SportsEvents/20251125/1426d8969f3b4e609ef63ad318cf9d5b.html) · [芝加哥半马赛事说明](https://www.chicagohalfmarathon.com/race-info/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":126,"qid":"Q126","section":"运动","chapter":"有氧训练","question":"首场比赛选平路还是起伏赛道，怎样看线路图、判断平时能否练到相似地形？","title":"选首场赛道前，找出大坡的位置和能练到的地形","fields":[["怎么做","打开主办方的海拔剖面图，确认横轴是公里还是英里、纵轴是米还是英尺。看长坡在起点附近还是后半程，以及起伏是连续还是分散的。再看日常路线能否安排相似的上坡或下坡。如果想把精力集中在完赛，附近又只有平路，可以把能就近练到的地形作为选择赛道的条件。"],["成本","花约 10 分钟比较两条路线。如果某段在 2 公里内爬升 40 米，该段平均坡度约 2%。这能帮你找相近路段，实际某小段可能更陡。"],["说人话","起终点海拔差很小，路上也可能有几道坡。看看坡有多长，以及跑到哪里才遇上。"],["收益","能提前决定是否需要找坡练习，或选择更符合当前训练条件的比赛。"],["证据等级","C（官方线路资料用于识别地形，比较方法和算例为执行建议）。"],["适用与备注","主办方更新路线后重新核对。短坡平均坡度和全程累计爬升回答的是不同问题，可一起看。"],["来源","波士顿半马官方路线图的海拔剖面、波士顿田径协会半马 Level One 中的起伏路线训练。 [官方路线与海拔图](https://www.baa.org/wp-content/uploads/2025/10/Boston-Half_Course.pdf) · [官方训练计划](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":127,"qid":"Q127","section":"运动","chapter":"有氧训练","question":"第一次参赛没有可比成绩，怎样设定完赛目标和挑战目标？","title":"首次参赛先设可执行的目标，再给挑战目标留条件","fields":[["怎么做","先查关门要求，定一个与你近期训练相符的基本目标。再写一项赛中能执行的目标，比如前几公里保持训练中熟悉的用力感。若训练记录还支持更快的完赛时间，可把它写为挑战目标，并约定什么情况下沿用或放宽。"],["成本","用约 5 分钟写三行。示例是「在关门内完成」「前几公里按练过的节奏跑」「到半程仍跑得稳定才考虑加速」。挑战目标可以先空着，待后续训练有依据再填。"],["说人话","第一次比赛就算没有旧成绩，也能定下自己要怎样跑。计时目标等训练有把握再加。"],["收益","比赛条件变化时，仍有一项自己能执行的跑法可以沿用。"],["证据等级","C（运动目标设定综述支持区分过程目标和结果目标。三行写法及调整条件是备赛建议）。"],["适用与备注","天气、赛道和训练进度都会影响可实现的时间。先看[赛事关门](#q125)，再决定自己的基本目标。"],["来源","Williamson 等运动目标设定系统综述的目标类型和实践应用部分，波士顿田径协会半马计划的选表说明。 [运动目标设定综述](https://doi.org/10.1080/1750984X.2022.2116723) · [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":128,"qid":"Q128","section":"运动","chapter":"有氧训练","question":"训练表分别用配速、心率或体感写课，怎样选一份自己能执行的计划？","title":"挑训练表时，选能在常跑路线上判断强度的写法","fields":[["怎么做","从候选课表各抽一堂轻松跑和一堂较快的训练，看能否说清这两堂怎么执行。配速表先看它要求的近期成绩能否取得。心率表先看分区是怎么定的。体感表先看是否用可观察的呼吸、说话或用力程度作说明。选自己能判断并重复记录的一份。"],["成本","各读两堂课，再用一次已安排的轻松跑试记配速、说话是否顺畅和用力感。平时有跑表可顺便记心率，体感课表也可以用手机计时。"],["说人话","挑一份看得懂、跑出去也知道该用多大力的课表。"],["收益","能判断自己是缺少可用的成绩或分区，还是课表的说明本身太含糊。"],["证据等级","C（公共卫生和心脏协会资料支持用不同方式判断运动强度。选表方法为实践建议）。"],["适用与备注","年龄推算的心率区间只供粗估。若有心脏病或使用影响心率的药物，向医护人员确认适合自己的强度判断方式。"],["来源","美国 CDC 运动强度指引的相对强度和说话测试部分、美国心脏协会目标心率说明的估算和用药备注、波士顿田径协会半马课表的配速表。 [CDC 强度指引](https://www.cdc.gov/physical-activity-basics/adding-adults/what-counts.html) · [美国心脏协会目标心率说明](https://www.heart.org/en/healthy-living/exercise-and-physical-activity/fitness-basics/target-heart-rates/) · [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":129,"qid":"Q129","section":"运动","chapter":"有氧训练","question":"半马和全马报名日期相隔不远，怎样确定主赛，以及另一场是否参加？","title":"半马和全马挨得近，先排主赛，再判断另一场是否合适","fields":[["怎么做","先定最想认真准备的一场，把它的最后几周、减量和赛后空档画在日历上。再把另一场放进去。若它可以替换一堂原有训练、距离和用力也与当天计划相近，可按训练目标参加。若必须临时加跑量、压缩减量，或赛后还没恢复平时的跑步节奏，就重新考虑是否参加。"],["成本","用约 10 分钟把两场和训练安排放在同一页。报名费、交通和比赛占去的时间单独算。假如训练表那天只有 14 公里，即使半马打算轻松跑，也要把额外约 7 公里计入。"],["说人话","先决定哪一场值得好好准备。另一场要算进训练表和恢复时间。"],["收益","可以在交报名费之前发现两场是否会争同一段时间或增加实际跑量。"],["证据等级","C（官方课表允许把比赛纳入训练，运动负荷共识强调把竞赛计入总负荷。这里没有可通用的两赛间隔）。"],["适用与备注","给考虑短期内参加两场比赛的跑者。若前一场已全力完成，下一场是否参加要结合实际恢复判断。"],["来源","波士顿田径协会半马计划的赛事纳入说明，国际奥委会 2016 年运动负荷共识的训练及竞赛负荷监测部分。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [IOC 运动负荷共识](https://doi.org/10.1136/bjsports-2016-096581)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":130,"qid":"Q130","section":"运动","chapter":"有氧训练","question":"报名后离专项计划开始还有一段时间，这期间怎样维持训练习惯？","title":"专项训练开始前，把能重复的跑步安排先稳定下来","fields":[["怎么做","以最近能维持的频次和用时安排空档期。先把几次熟悉的轻松跑放到日历，保留已有且能恢复的较长一跑。临近专项开始时，拿这几周的实际训练和新课表第 1 周比较。若起点差距大，可先延长准备或选较低起点的计划。"],["成本","沿用已能安排的时段。假设近几周稳定跑三次，每次约 30、30、50 分钟，这周可以先给同样的三段留出 110 分钟。另花几分钟记录实际完成时间。"],["说人话","离正式开练还有几周，可以先让每周的跑步安排能持续下来。"],["收益","能用真实训练记录判断专项首周是否接得上，也让开练前的时间投入更可预期。"],["证据等级","C（官方课表有准备阶段。空档期维持已有安排是根据计划结构给出的做法）。"],["适用与备注","适合已经规律跑步、正在等专项计划开始的人。跑步习惯尚未建立时，先按[首半马准备](../02-distance-running.md#q23)对照起点。"],["来源","波士顿田径协会半马与全马 Level One 课表的准备阶段。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":131,"qid":"Q131","section":"运动","chapter":"有氧训练","question":"每周只能跑三天，怎样在轻松跑、质量课和长跑之间取舍？","title":"每周只能跑三天，先安排轻松跑和能恢复的长跑","fields":[["怎么做","找起点接近、按三天排跑的计划。以完赛为主时，可以先用两次轻松跑和一次较长的轻松跑建立节奏。已有稳定基础、计划进入专项阶段时，再考虑把一次较短的跑换成有目标配速或较快分段的一堂课。长跑和较快一课都难恢复时，先把较快的一堂改轻松。"],["成本","先给三次跑安排时段。若现有基础能承担两次 30 分钟加一次 60 分钟，一周就需要约 2 小时的跑步时间。较快分段应算在一次训练的总时长里。"],["说人话","只有三天就按三天的计划排，别把原来四五天的量硬塞进三天。"],["收益","周内仍有轻松跑和持续时间较长的一跑，也能看出是否有余力再加专项训练。"],["证据等级","C（三天课表和适应性调整来自训练指导。示例用于排程，缺少比较所有三天跑法的直接证据）。"],["适用与备注","全马训练的时间投入可能明显高于半马，先对照[首全马计划](../02-distance-running.md#q33)的起点和长跑安排。三天排法的可行性看近期基础及恢复。"],["来源","Jeff Galloway 为 runDisney 编写的半马入门走跑计划第 4–6 页，课表按周二、周四和周六安排。纽约路跑协会教练常见问答的跑步频次部分和波士顿田径协会半马课表的调整说明，供调整频次和训练安排时参考。 [runDisney 三日走跑半马课表](https://cdn3.parksmedia.wdprapps.disney.com/media/rd/redesign/running-training-programs/HalfMarathon_Training_Program.pdf#page=4) · [纽约路跑协会教练问答](https://prod.nyrr.org/news/2026/06/10/coaches-answers-to-frequently-asked-questions) · [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"每周三跑 半马课表 三天半马计划","grades":["C"]},{"id":132,"qid":"Q132","section":"运动","chapter":"有氧训练","question":"周末没空，怎样把长跑挪到工作日而不挤掉两次训练之间的恢复时间？","title":"把长跑挪到工作日时，一起挪开旁边的高负荷训练","fields":[["怎么做","先标出原课表的长跑、较快一课及其周围的休息或轻松跑。定下新长跑时段后，尽量保留原本的先后和恢复空间。新时段逼得两堂高负荷训练相邻时，可以移动另一堂，或把其中一堂改轻松、缩短或跳过。"],["成本","用约 5 分钟看连续七八天的日历。例如把原来周日的长跑改到周四，原本周三的间歇就与它相邻。可把周三改成短的轻松跑，再看周末是否留得出较快一课的时段。"],["说人话","只挪长跑容易和别的难课撞在一起。把前后几天也一起看。"],["收益","能保住真正有空的长跑时段，并及时发现课表在哪一处变得太挤。"],["证据等级","C（根据官方课表的高低负荷结构和负荷共识做日历调整，具体星期和间隔为示例）。"],["适用与备注","长跑的负荷也看用时、用力和地形。改完这一周后检查下一周开头，避免两周交界又挤在一起。"],["来源","波士顿田径协会全马 Level One 第 12–13 周的训练顺序和长跑位置，IOC 运动负荷共识的个体化安排部分。 [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/) · [IOC 运动负荷共识](https://doi.org/10.1136/bjsports-2016-096581)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":133,"qid":"Q133","section":"运动","chapter":"有氧训练","question":"因工作或旅行漏跑一整周，怎样决定接原计划、退回一周还是跳过某节课？","title":"漏跑一周后，用已完成的训练重新接课表","fields":[["怎么做","拿原计划接下来一周和实际最后完成的一周比较。如果总时长、最长跑和高强度分段都接近，可从下一次轻松跑开始，再决定是否沿用原计划。若下一周本来就明显加量，可以先用最后完成过的一周当起点。临近比赛时，优先保留减量和休息，把过时的高负荷训练跳过。"],["成本","花约 10 分钟对照两周。比如上次最长一跑是 75 分钟，而回归周原排 100 分钟，可先选已练过且能恢复的长跑时长，再结合剩余周数决定是否往上加。"],["说人话","课表翻了一页，身体并没有多练一周。先从实际做过的负荷接起来。"],["收益","能避免把漏掉的训练集中补回，也能保留对这次比赛最重要的安排。"],["证据等级","C（赛事机构教练建议允许跳过漏课。具体接回哪一周没有通用的实验证据）。"],["适用与备注","此处指工作、旅行等非医疗原因导致的一周停跑。漏跑一周和临近比赛漏掉最后一次长跑，是不同的排程问题。"],["来源","纽约路跑协会跑者训练指导的全局安排部分，波士顿田径协会半马训练说明中的课表调整原则。 [纽约路跑协会训练指导](https://prod.nyrr.org/news/2021/06/04/new-runner-resource-holistic-approach-to-running) · [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":134,"qid":"Q134","section":"运动","chapter":"有氧训练","question":"排班每周都变，怎样用课表里各次训练的先后关系代替固定星期几？","title":"排班常变，就按训练的先后关系排课","fields":[["怎么做","把课表从星期几改写成训练顺序。例如先一次轻松跑，再一堂较快的训练，之后留出恢复时段，最后放较长一跑。拿到新的班表后，先锁定有完整时间的长跑和最重要的一堂，再填容易移动的短跑。空档不足时，删掉优先级较低的训练。"],["成本","班表出来后花约 5 分钟排课。可以用手机日历标出较长的空档和紧接夜班的时段，做不完的短跑留作可删选项。"],["说人话","课表上的周二和周日可以换，先看每次训练前后有没有合适的空档。"],["收益","换班时能保留训练的顺序和休息，也能让训练计划适应实际可用时间。"],["证据等级","C（根据官方课表的相邻训练和弹性调整说明整理，无固定轮班处方）。"],["适用与备注","给已有训练习惯、可用时段每周变动的跑者。长跑移位时参考[长跑换日](#q132)。"],["来源","波士顿田径协会半马训练计划的工作和家庭情境调整说明及 Level One 第 3–4 周。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":135,"qid":"Q135","section":"运动","chapter":"有氧训练","question":"周总里程相同，怎样判断适合少跑几天、每次长一点，还是多跑几天、每次短一点？","title":"周跑量相同，把新增里程分到能恢复的训练里","fields":[["怎么做","列出两种周排法，同时看跑步天数、最长一跑和恢复空档。如果只是想缩短单次用时，可以先把一部分短跑里程移到另一个可用时段。先保持周总量、长跑距离和较快课相近，试过再比较哪种安排更好执行和恢复。"],["成本","同样是 24 公里，示例甲是 7、7、10 公里跑三天，示例乙是 4、5、5、10 公里跑四天。后者多占一次准备、换衣或交通时间。用实际记录看这些成本值不值得。"],["说人话","总里程一样，还是要看每一趟多长，以及你有没有时间多出门一次。"],["收益","能把日历和单次跑量一起比较，避免只看周总公里数。"],["证据等级","C（大众跑者研究把频次和单次距离分开观察。研究未确定同样总里程应怎样分配）。"],["适用与备注","给在两个可持续排法间取舍的跑者。若调整同时增加了最长一跑或训练强度，就难单独比较频次的影响。"],["来源","Gordon 等大众全马跑者研究的方法与训练特征结果，Fokkema 等半马与全马队列的周跑量和最长跑结果。 [大众全马训练特征](https://pubmed.ncbi.nlm.nih.gov/29200895/) · [半马和全马跑量研究](https://doi.org/10.1111/sms.13725)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":136,"qid":"Q136","section":"运动","chapter":"有氧训练","question":"一段时间只能用跑步机，哪些课可以照常安排，哪些要改动？","title":"暂时只能用跑步机时，先保留训练用时和体感","fields":[["怎么做","轻松跑和持续训练可先按原有时长和熟悉的用力感做，再调跑带速度。第一次把间歇移到跑步机时，先确认调速、恢复和停机都顺手。赛道下坡、弯道或起伏是训练重点时，等能出门再安排相似地形的练习。"],["成本","用一次原有的短跑熟悉设备。比如把 40 分钟轻松跑移到室内时，可先从慢一点的速度开始，用能否舒适说话和主观用力调整。费用按家中设备或健身房的实际使用成本算。"],["说人话","同样的配速，跑步机上不一定一样费劲。先把训练目的跑出来。"],["收益","室外条件不合适时仍可维持部分课表，同时知道哪些赛道练习需要另找机会。"],["证据等级","B（交叉研究综述发现室内外跑的部分指标有差异，差异也随速度改变。按体感改课是应用建议）。"],["适用与备注","证据主要来自跑步机和户外跑的短期对比，不能据此推定某个坡度对所有人和所有配速都等效。"],["来源","Miller 等 2019 年跑步机与户外跑交叉研究系统综述的摘要结果和讨论。 [跑步机与户外跑综述](https://pubmed.ncbi.nlm.nih.gov/30847825/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["B"]},{"id":137,"qid":"Q137","section":"运动","chapter":"有氧训练","question":"训练表没有安排轻松周，怎样从近期完成情况判断下周继续加量还是维持？","title":"本周没恢复好，下一周先维持或减轻负荷","fields":[["怎么做","回看最近几次相似训练：按计划跑完是否越来越吃力，轻松日能否保持轻松，原先能做完的训练是否反复需要缩短。如果这些情况持续出现，或下一周生活安排更紧，可以先重复能完成的一周，或缩短一堂负荷最大的训练。恢复稳定后再决定是否加量。"],["成本","花约 5 分钟看训练记录。比如两次熟悉的轻松跑都比平常明显费劲，下周可把原定从 80 增到 95 分钟的长跑先留在已经练过的时长，再观察完成和恢复情况。"],["说人话","课表写了加量，也可以先把上周跑顺。连续几次的感受比单独一次更有参考价值。"],["收益","能把「继续加多少」变成下周是否需要保持、缩短或恢复正常的具体选择。"],["证据等级","C（根据负荷监测原则和课表实例制定，单个指标无法决定最佳增量）。"],["适用与备注","适合调整近期日常训练。疲劳和表现下降持续时，参见[训练相关健康](../06-training-health.md#q37)。"],["来源","IOC 运动负荷共识的训练负荷与主观状态监测，波士顿田径协会全马 Level One 第 16–18 周的长跑安排示例。 [IOC 运动负荷共识](https://doi.org/10.1136/bjsports-2016-096581) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":138,"qid":"Q138","section":"运动","chapter":"有氧训练","question":"课表要求同一周做两次强度较高的跑，时间不够时怎样决定保留哪一次？","title":"一周只能留一堂快跑，先保留更符合当前阶段的一堂","fields":[["怎么做","先弄清两堂快跑各自练什么，再看离比赛多远、哪一堂更符合当前阶段。若长跑已经含较长的目标配速段，也把它计入较难的训练。只剩一个高负荷时段时，选一堂有足够热身、主课和恢复时间的训练，其余改轻松或跳过。"],["成本","花约 5 分钟看课表说明。例如专项期同一周排了短坡跑和半马目标配速段，若眼下最需要练习目标配速，可以保留后者，把短坡跑换成短的轻松跑。"],["说人话","时间不够就选一堂最有用的，热身和恢复也要留时间。"],["收益","训练仍服务于当期目标，也能腾出时间完成周内其他安排。"],["证据等级","C（官方训练计划显示不同训练的目的和阶段。取舍方法是实践建议，缺少直接比较漏掉哪堂课的研究）。"],["适用与备注","如果只是没时间完成原有热身和恢复，短一点的轻松跑也是可执行的选择。每周长期都如此时，见[三天训练怎么排](#q131)。"],["来源","波士顿田径协会半马 Level Two 的训练说明和第 4 周，半马计划关于高强度训练前后轻松跑的说明。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":139,"qid":"Q139","section":"运动","chapter":"有氧训练","question":"跑步记录已经攒了几周，怎样用出勤、用时和体感找出下周课表最该改的一项？","title":"每周回看出勤、用时和体感，只先改最明显的一项","fields":[["怎么做","把过去几周的计划和实际训练放在一起，记跑了几次、用了多久，以及相似训练的主观用力和恢复感。经常漏同一天就先调时段。都能出勤但同样用时反复变得更费劲，可先减轻一堂课。每次先选一个改动，下周用同样的方式再看。"],["成本","每次跑后留一行，每周用约 5 分钟复盘。例子是「计划 4 次、实际 3 次，连续两周漏周四，周末长跑体感和平时接近」。可先移动周四的短跑，再看完成率有没有变化。"],["说人话","先弄清楚是时间排不开，还是跑完恢复不过来。两种问题要改的地方不同。"],["收益","把训练表的改动和反复出现的问题对应起来，方便下一周验证安排有没有改善。"],["证据等级","C（负荷共识及主观监测综述支持结合实际训练与主观反应。这里的记录字段和每次先改一项是实践方法）。"],["适用与备注","比较相似的时段、路线和天气。用力感有变化时，记录近期生活安排或环境是否也有明显变化。"],["来源","IOC 运动负荷共识的外部与内部负荷监测，Saw 等训练反应系统综述的摘要结果与实践部分。 [IOC 运动负荷共识](https://doi.org/10.1136/bjsports-2016-096581) · [训练反应监测综述](https://doi.org/10.1136/bjsports-2015-094758)"]],"path":"book/distance-running/01-planning.md","aliases":"","grades":["C"]},{"id":140,"qid":"Q140","section":"运动","chapter":"有氧训练","question":"不看手表，怎样用说话和体感判断轻松跑有没有跑得太快？","title":"轻松跑时用一句完整的话检查强度","fields":[["怎么做","跑热后试着自然说一句完整的话，看看能否接着说第二句。如果只能说几个字就要换气，或一路得刻意忍着才能维持配速，先慢一点。可以在下一段平路再试。"],["成本","在原有训练中花十几秒。选一句自己熟悉、长度固定的话，记录当时是能自然说完、勉强说完，还是说不完。"],["说人话","轻松跑应该还有余力聊天。话说不完整时，先把速度放下来。"],["收益","即使没有心率表，也能在跑动中获得一条强度线索。说话难度可随上坡和顶风即时变化。"],["证据等级","B（跑台研究支持说话难度与呼吸强度有关。单句检查用于日常相对强度判断）。"],["适用与备注","给健康成年跑者用于判断当天的轻松强度。习惯使用心率和配速时也可以一起记。"],["来源","CDC 成人身体活动强度说明的说话测试，Persinger 等跑台和功率自行车交叉测试摘要，波士顿田径协会全马课表术语表的轻松跑定义。 [CDC 强度指引](https://www.cdc.gov/physical-activity-basics/adding-adults/what-counts.html) · [说话测试研究](https://pubmed.ncbi.nlm.nih.gov/15354048/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["B"]},{"id":141,"qid":"Q141","section":"运动","chapter":"有氧训练","question":"同样叫慢跑，平时的轻松跑和高负荷训练后的恢复跑怎么区分？","title":"恢复跑留在当天能轻松完成的时长和强度内","fields":[["怎么做","先看这一跑在周计划里起什么作用。一般轻松跑承担一部分常规跑量。若前一天刚完成较难的课，下一次只是想轻松活动，可选平路、缩短时长，或直接休息。起跑后如果越跑越费劲，可以提前结束。"],["成本","按自己已习惯的时长调整。比如平时轻松跑约 40 分钟，较难训练后当天可先计划 20 分钟轻松跑，再根据感受结束或回家休息。"],["说人话","恢复日可以少跑一点，也可以休息。前一天的难课已经做完了。"],["收益","方便安排前一次训练后的活动量，也能给下次重要训练留出恢复时间。"],["证据等级","C（赛事课表把轻松或恢复配速和休息用于排周。示例为日常安排，未把轻松跑当作加快恢复的保证）。"],["适用与备注","这里说的是健康跑者训练后选择轻松活动。明显疼痛或持续异常疲劳另见[训练相关健康](../06-training-health.md)。"],["来源","波士顿田径协会全马 Level One 术语表和第 10 周的长课后轻松跑，IOC 运动负荷共识的恢复与主观反应部分。 [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/) · [IOC 运动负荷共识](https://doi.org/10.1136/bjsports-2016-096581)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["C"]},{"id":142,"qid":"Q142","section":"运动","chapter":"有氧训练","question":"配速、心率和体感给出不同信号时，怎样决定这一趟该看哪个？","title":"配速、心率和体感打架时，先按这堂课的目的取舍","fields":[["怎么做","轻松日优先看呼吸和体感，配速先让它随路况变化。练比赛配速时，在地形和天气接近的路段结合配速与体感判断。心率读数突然跳动时，先放缓并检查表带、读数是否稳定，再决定它在这趟有多少参考价值。"],["成本","原有设备就够用。比如顶风时表上显示配速变慢，但说话仍顺畅，轻松跑可以先维持用力，等转弯后再比较同一路线的配速。"],["说人话","轻松日先守住轻松，练配速时找条件接近的路段再对表。"],["收益","能避免被一次异常读数或一个短坡带着改变训练，也更容易比较前后相似的课。"],["证据等级","B（腕式心率研究发现准确性随设备和活动变化。用哪项指标取决于训练目的，属于执行建议）。"],["适用与备注","这里讨论日常训练记录。有医嘱心率范围的人按医护人员建议使用合适的监测方式。"],["来源","Gillinov 等腕式心率研究的设备比较和结果，CDC 相对强度指引，美国心脏协会目标心率说明中的个人用药提示。 [腕式心率研究](https://pubmed.ncbi.nlm.nih.gov/28709155/) · [CDC 强度指引](https://www.cdc.gov/physical-activity-basics/adding-adults/what-counts.html) · [美国心脏协会心率说明](https://www.heart.org/en/healthy-living/exercise-and-physical-activity/fitness-basics/target-heart-rates/)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["B"]},{"id":143,"qid":"Q143","section":"运动","chapter":"有氧训练","question":"做节奏跑或间歇前，怎样安排热身并判断什么时候可以开始主课？","title":"节奏跑和间歇前先慢跑，再逐渐接近主课强度","fields":[["怎么做","先用轻松跑逐步把呼吸和步伐带起来。等步伐平稳、呼吸仍能控制，再开始主课。第一次进入较快配速时可从目标范围较保守的一端开始。若慢跑已经异常吃力，当天可以改轻松。"],["成本","把热身和跑后的轻松收尾预先算进总时间。比如总共只有 40 分钟，可以先留 12 分钟热身、8 分钟收尾，再看中间能放多少主课。"],["说人话","从门口出发时先慢一点，跑顺了再开始今天的快段。"],["收益","开始主课时已从静息逐步过渡到跑步，并能在加速前先看当天状态。"],["证据等级","B（多项目综述支持主动热身可帮助随后的部分运动表现。准备状态和时长按训练课及个人调整）。"],["适用与备注","波士顿田径协会给较高强度半马课的 10–20 分钟轻松跑是训练计划中的示例。前后都要算时长。"],["来源","波士顿田径协会半马训练说明的高强度训练热身和收尾，Fradkin 等热身与运动表现综述。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [热身系统综述](https://pubmed.ncbi.nlm.nih.gov/19996770/)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["B"]},{"id":144,"qid":"Q144","section":"运动","chapter":"有氧训练","question":"轻松跑末尾加几次短加速，怎样控制用力和恢复？","title":"轻松跑后的短加速做得放松，每次间隔留够","fields":[["怎么做","跑热后选平坦、视线好、没有人车干扰的一小段。由轻松跑渐渐加快，保持动作自然，再平稳减速。每段结束后走或慢跑，等呼吸和腿部感觉稳定，再做下一段。当天轻松跑已经吃力时，可以跳过。"],["成本","第一次可把少量试跑加进原时段。例如做三段约 15 秒的短加速，段间各留约 1 分钟走或慢跑，算上最后的减速和调整，大约多几分钟。"],["说人话","短加速是放松地快几步。下一段开始前，先把呼吸缓下来。"],["收益","能在较短时间内练习从轻松跑平稳进入更快步伐，并观察是否能保持动作放松。"],["证据等级","C（官方跑步计划提供短加速与恢复的示例。具体秒数和次数是保守的入门算例）。"],["适用与备注","做在已适应轻松跑的基础上。平时刚开始跑、或当天腿部感觉异常时，可先保留原本的轻松跑。"],["来源","波士顿田径协会 10 公里官方课表中的 relaxed striders 示例，仅作短加速练习的执行参考。 [波士顿田径协会课表](https://www.baa.org/races/boston-10k/info-for-athletes/b-a-a-10k-training/)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["C"]},{"id":145,"qid":"Q145","section":"运动","chapter":"有氧训练","question":"第一次练节奏跑，怎样在连续跑和分段跑之间选择？","title":"第一次练节奏跑，可先把快段分开做","fields":[["怎么做","先安排轻松热身，再试一段比平时轻松跑快、且能控制的跑。若还不熟悉这种用力感，可把计划的快段拆开，中间慢跑恢复。练过后如果能维持各段用力和步伐，再考虑同样总时长的连续跑。"],["成本","例如原本想试连续 12 分钟，可以先做两段各 6 分钟，中间慢跑 2 分钟。两种做法的快段总时长相同，分段跑多占恢复时间。"],["说人话","第一次可以分两段试，先找出能稳住的速度，再决定要不要连起来。"],["收益","休息段给了调整下一段的机会，有助于记录自己能稳定维持的用力程度。"],["证据等级","C（赛事机构采用持续和分段的较快训练。两种方式对首次练习者的相对效果未由这些课表直接比较）。"],["适用与备注","节奏跑的叫法和目标强度在不同课表中有差异。优先看本课表对持续时间、体感和速度的说明。"],["来源","纽约路跑协会保守半马计划的训练术语，波士顿田径协会半马计划 Level Two 的分段目标配速练习。 [纽约路跑协会半马计划](https://webassets.nyrr.org/nyrrsitecoreblob/nyrr/pdf/training-guides/hm-training-plan_conservative-rd1.pdf) · [波士顿半马计划](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["C"]},{"id":146,"qid":"Q146","section":"运动","chapter":"有氧训练","question":"间歇跑每段之间，怎样决定走、慢跑，还是延长恢复时间？","title":"间歇恢复先按课表走或慢跑，再看下一段能否稳定开始","fields":[["怎么做","看清课表要求的是站休、走路还是慢跑。若没有写明，可先用容易控制的走路或很慢的跑。下一段还没开始就觉得喘得厉害时，可以先放慢恢复段、延长一点间隔，或者减少剩余次数。"],["成本","同样四段快跑，三次段间各 90 秒合计 4 分 30 秒，各 120 秒则合计 6 分钟。提前把快段、恢复和热身都算进总训练时间。"],["说人话","恢复段是为了让下一段跑得稳。慢跑恢复如果反而更累，可以走或多休息一会儿。"],["收益","能让训练目的和恢复方式一致，也能知道总时间被哪部分占用。"],["证据等级","B（系统综述显示不同恢复方式的间歇方案都可能带来训练适应。对某一堂跑课的具体恢复时长仍按课表和个人耐受调整）。"],["适用与备注","给有规律跑步基础、开始做分段快跑的人。间歇最后几段无法维持时，见[间歇掉速后的处理](#q147)。"],["来源","2024 年间歇训练主动及被动恢复系统综述的结论，纽约路跑协会保守半马计划的间歇术语。 [间歇恢复综述](https://doi.org/10.1186/s40798-024-00673-0) · [纽约路跑协会半马计划](https://webassets.nyrr.org/nyrrsitecoreblob/nyrr/pdf/training-guides/hm-training-plan_conservative-rd1.pdf)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["B"]},{"id":147,"qid":"Q147","section":"运动","chapter":"有氧训练","question":"间歇后几段已经明显掉速，怎样判断是调低目标配速还是结束这一课？","title":"间歇反复掉速时先调低，仍不稳就结束主课","fields":[["怎么做","先确认掉速是否来自上坡、顶风或起段过快。若后几段明显更吃力且无法稳定，用更保守的速度试下一段，或多给一点恢复。下一段仍维持不住，或步伐已难以控制，就结束较快部分，改走路或轻松结束。"],["成本","少做一两段，并记下第几段开始掉速、实际分段和当时的体感。下次可以先用更可控的起段配速，观察后半程表现。"],["说人话","前几段跑快了，后面不用靠硬顶凑够次数。把掉速发生的地方记下来。"],["收益","把这次课的失速转成下次调整起段速度、段数或恢复时间的依据。"],["证据等级","C（间歇研究框架支持同时考虑快段和恢复变量，具体结束条件属于训练建议）。"],["适用与备注","只用于训练难度调整。有急性不适时按[训练相关健康](../06-training-health.md)处理。"],["来源","Buchheit 与 Laursen 高强度间歇训练综述的快段强度、时长与恢复变量部分。 [间歇训练综述](https://doi.org/10.1007/s40279-013-0029-x)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["C"]},{"id":148,"qid":"Q148","section":"运动","chapter":"有氧训练","question":"想练上坡跑，怎样选坡度、单趟时长和下坡恢复方式？","title":"第一次坡跑选缓坡，慢慢走或跑下坡恢复","fields":[["怎么做","找路面好、坡度较均匀、可以安全折返的缓坡。先热身，再用可控的用力感完成几趟短上坡。下坡用走或很慢的跑恢复，呼吸平稳后再开始。坡太陡而不得不改变步伐时，换一条坡。"],["成本","给热身和下坡恢复留出时间。可先用地图粗估坡度。比如一段水平距离约 200 米、升高约 8 米，平均坡度约 4%，实际各小段会有变化。"],["说人话","找能反复跑稳的小坡。上坡练用力，下坡留给恢复。"],["收益","能练习上坡时维持可控节奏，也能知道该用什么坡度和趟长作为下一次的起点。"],["证据等级","C（赛事课表和教练资料示范坡跑安排。数字用于辨认地形，无通用的最佳坡度或时长）。"],["适用与备注","波士顿田径协会全马训练术语中的 3%–5% 是课表示例。户外可以按路况和经验选更缓或更短的一段。"],["来源","波士顿田径协会全马 Level One 的术语表和第 3 周坡跑，纽约路跑协会保守半马训练计划的坡跑术语。 [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/) · [纽约路跑协会半马计划](https://webassets.nyrr.org/nyrrsitecoreblob/nyrr/pdf/training-guides/hm-training-plan_conservative-rd1.pdf)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["C"]},{"id":149,"qid":"Q149","section":"运动","chapter":"有氧训练","question":"同一条路线遇到顶风或连续起伏，怎样用体感调整训练强度？","title":"顶风或起伏路先守住用力感，配速随路段变化","fields":[["怎么做","起跑时先确定这趟是轻松跑还是需要维持较高强度的训练。上坡或顶风时，允许配速慢下来，按呼吸和用力感调整。下坡时让步伐保持可控，转回平路后再看配速回到什么水平。"],["成本","不用另买装备。可以记下同一圈上坡、顶风和平路的时间和体感。下次遇到类似条件，用这份记录决定怎么跑。"],["说人话","顶风和上坡更费劲。训练要守的是今天的用力程度，手表速度可以变。"],["收益","能在路况变化时维持训练的大致强度，也减少为追回短段配速而临时加力。"],["证据等级","B（小型生理实验显示坡度和空气阻力可改变同一速度下的能量需求。按体感调速是执行建议）。"],["适用与备注","适合日常训练。比较成绩时选相近的风向、坡度和路段，或把不同条件单独记下来。"],["来源","Minetti 等坡度与跑步能量代价实验结果，Pugh 风阻跑台实验结果。 [坡度与能量代价](https://doi.org/10.1152/japplphysiol.01177.2001) · [风阻与耗氧实验](https://doi.org/10.1113/jphysiol.1970.sp009097)"]],"path":"book/distance-running/02-workouts.md","aliases":"","grades":["B"]},{"id":150,"qid":"Q150","section":"运动","chapter":"有氧训练","question":"最近一次 10 公里成绩，怎样用来估首半马的目标配速范围？","title":"用近期十公里成绩估半马目标，再用训练修正","fields":[["怎么做","挑一场近期尽力完成的 10 公里，记下净用时和当时的路况。可用 `半马估时 = 10 公里用时 × (21.0975 ÷ 10)^1.07` 得到一个起点。再看自己近期较长的跑能否稳定完成，以及比赛赛道和天气是否近似。拿不准就先选范围里较慢的一端。"],["成本","翻一次比赛和训练记录。10 公里跑 55 分钟，公式估半马约 2 小时 02 分、约 5 分 48 秒/公里。比如把 2 小时 02 分到 2 小时 08 分设为个人备选，对应约 5 分 47 秒到 6 分 04 秒/公里，慢端由自己留余量。"],["说人话","十公里成绩给你一个搜索起点。练过的距离和当天的条件，决定你愿意从哪里起跑。"],["收益","把短距离成绩转成可复查的训练配速，同时留出调整空间。"],["证据等级","B（大众跑者数据中，公式在半马距离上总体校准较好。备选范围是算例，个人误差会随训练与赛道变化）。"],["适用与备注","适合近期有一场可比的 10 公里成绩、并已开始半马专项训练的人。只有一次较轻松的 10 公里训练记录时，可先按[完赛准备](#q151)判断。"],["来源","Vickers 和 Vertosick 研究的 Race time prediction、小节结论及补充图 S1。 [大众跑者估时研究](https://doi.org/10.1186/s13102-016-0052-y)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["B"]},{"id":151,"qid":"Q151","section":"运动","chapter":"有氧训练","question":"首半马前最长一跑离比赛距离还差一段，怎样用现有训练判断完赛准备是否够？","title":"用稳定完成的数周训练判断首半马准备","fields":[["怎么做","一起看近几周的跑步频次、比较长的几次跑、长跑后半段的体感与接下来能否照常训练。把这些记录和原计划、比赛关门时间对照。若最长一跑已经很吃力、后续数日训练受影响，或近期训练反复中断，选更保守的比赛目标，准备不足时给自己换一场的选项。"],["成本","花约 15 分钟回看近几周记录。波士顿田径协会的半马 Level One 课表，第 9 周长跑为 9–10 英里，第 10 周模拟课合计 10 英里，约 16 公里。"],["说人话","赛前可以没跑过整段 21.1 公里。看已经做过的那些长跑稳不稳，跑完能不能接着训练。"],["收益","能看到一次最长距离之外的训练连续性，也能提前判断完赛目标和关门时间是否匹配。"],["证据等级","B（大众跑者队列研究发现训练量和最长跑与完赛表现有关。课表和复查方法用于实际选择，无法给出个人完赛保证）。"],["适用与备注","适合正常参加训练、想判断首半马准备的成年人。距离增加或疼痛反复时，见[训练相关健康](../06-training-health.md)。"],["来源","波士顿田径协会半马 Level One 第 9、10 周，Fokkema 等研究的半马分组及表 3。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [跑量与最长跑队列研究](https://doi.org/10.1111/sms.13725)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["B"]},{"id":152,"qid":"Q152","section":"运动","chapter":"有氧训练","question":"半马目标配速段适合放在单独一课，还是放进一次较长的跑？","title":"按训练目的把半马目标配速放进短课或长跑","fields":[["怎么做","第一次练目标配速，或需要判断这个速度的体感时，可在平路用独立的分段课，段间慢跑。已经能稳定完成较长一跑，想练跑了一段之后如何维持目标用力时，把小段专项配速放进现有长跑，并在同周减少其他难课。"],["成本","从已有训练时间里调配。比如单独练 3 段各 6 分钟，或在原本就能轻松完成的长跑后半段放入一段 15 分钟。这两个数字只展示排法。"],["说人话","单独练方便摸准速度，放进长跑方便体会有些疲劳时怎样维持同样的用力。"],["收益","能为同样的目标配速安排不同练习，并根据现有周计划挑一个做。"],["证据等级","C（赛事训练计划展示两种排法。普通跑者依据课表目的和恢复情况选择）。"],["适用与备注","有稳定轻松跑基础、已经初步估出目标配速的人可用。当天目标配速段比预期更吃力时，见[专项课复查](#q154)。"],["来源","波士顿田径协会半马 Level Two 第 3 周分段课和第 4 周较长的模拟课。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["C"]},{"id":153,"qid":"Q153","section":"运动","chapter":"有氧训练","question":"怎样把一场 10 公里比赛放进半马备赛，并决定当天全力跑还是当作训练？","title":"把十公里热身赛当成当周的一堂训练","fields":[["怎么做","需要一场新成绩来估半马目标、且赛前赛后都排得开，可把 10 公里跑成一次尽力的比赛，替换同周一堂难课。更想练集合、起跑和节奏时，可带着指定体感或配速去跑，同样把路程算进周计划。比赛挤掉关键长跑或恢复时，可以直接跳过。"],["成本","赛程外加交通、热身和回家恢复的时间。举例，同一个周末原定做较长的专项课，若改去全力跑 10 公里，周末只挑其中一个较难安排。"],["说人话","报了十公里以后，把它在课表里占一个位置，再决定当天要不要拼成绩。"],["收益","能利用正式赛道了解近期水平或练习比赛流程，也知道这场比赛替换了什么。"],["证据等级","C（教练实践给出备赛中跑 10 公里热身赛的示例。排期、是否尽力及如何替换为执行建议）。"],["适用与备注","适合有连续训练基础、离目标半马还有可恢复训练日的跑者。想看成绩怎么换算，见[十公里估时](#q150)。"],["来源","RunnersConnect 教练 Jeff Gaudette 的半马专项安排，Incorporating 10k races into a half marathon build-up 小节。 [教练原文](https://runnersconnect.net/coach-corner/half-marathon-specific-training/)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["C"]},{"id":154,"qid":"Q154","section":"运动","chapter":"有氧训练","question":"做完一堂半马专项课，怎样用实际分段和体感复查原定目标？","title":"同时看配速、体感和恢复，再调整半马目标","fields":[["怎么做","课后记每段用时、地形、每段结束有多费力，以及下一次轻松跑是否恢复如常。先判断各段能否按原意完成。若连续的可比训练都在中途就明显吃力，或最后一段须全力撑住，先下调比赛计划，下一次再复查。"],["成本","课后记三五行。比如 3 段各 2 公里都跑在目标配速附近，但体感从可控升到近全力，先记下当日天气和前一日训练，找条件接近的下一课再看。"],["说人话","看你是留有余力地做完，还是咬牙做完。手表上的平均数可能一样。"],["收益","能在比赛前发现目标配速的潜在问题，并区分路况变化和重复出现的困难。"],["证据等级","C（官方课表把目标配速放进模拟课。由重复的训练记录调整目标属于执行建议）。"],["适用与备注","从比较熟悉的训练量和路线开始。想判断体感与手表不一致时用哪个，见[强度指标选择](02-workouts.md#q142)。"],["来源","波士顿田径协会半马 Level One 第 6、8、10 周模拟课和 Pace Chart。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["C"]},{"id":155,"qid":"Q155","section":"运动","chapter":"有氧训练","question":"离半马还有四周，最近训练的距离和目标配速都没练到，该先补哪一项？","title":"半马剩四周时先稳住容易完成的训练","fields":[["怎么做","先确认最近的跑步是否连续、较长的轻松跑能否维持，以及跑后是否正常恢复。长跑基础不足时，优先安排当前能完成的轻松跑并评估完赛目标。已有稳定较长跑、只欠目标配速体验时，可在平时的训练量内练短段。时间不足时也可以选择放慢目标或调整比赛。"],["成本","花一刻钟把仍可使用的训练日和原计划的减量安排画出来。比如最近较长的跑只有 12 公里，可先把接下来一周排得接近当前水平，再决定下一步。"],["说人话","越临近比赛，越要从已经做得到的训练往下排。留几天带着正常状态去比赛。"],["收益","可以在保留减量安排的前提下，明确最后几周最值得练的一件事。"],["证据等级","B（单次距离明显超过近期最长跑与更高过度使用伤病发生率相关，来自观察研究。最后几周怎样取舍依据个人课表）。"],["适用与备注","适合已报名但与计划有缺口的人。涉及疼痛或疾病时，先看[训练相关健康](../06-training-health.md)。"],["来源","Frandsen 等前瞻性队列的暴露定义和结果，波士顿田径协会半马 Level One 第 9–12 周。 [单次距离与伤病研究](https://pubmed.ncbi.nlm.nih.gov/40623829/) · [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["B"]},{"id":156,"qid":"Q156","section":"运动","chapter":"有氧训练","question":"已经能完成半马，想提高成绩时，怎样根据上一场的表现选择本轮专项重点？","title":"从上一场半马找一个反复出现的困难来练","fields":[["怎么做","把上场比赛的分段、坡度、天气和比赛前几周的训练摆到一起。前几公里就快过计划，接下来可练起跑控制。前段可控但进后半程经常被连续坡打断，可安排起伏路线。多个类似条件下的长跑和比赛都在后段掉速时，先看看耐力训练与恢复有没有明显缺口。"],["成本","用 10–15 分钟列出表现、可能原因和下一次练法。可以先在两次相似的课里复查其中一个假设。"],["说人话","先找最常卡住的地方。比如两次都在开头跑快，下次就专门练怎样慢一点起跑。"],["收益","将一次完赛成绩变成具体的训练选择，方便比较下个周期是否有变化。"],["证据等级","B（大样本比赛分段研究描述不同成绩组的配速模式。个人复盘只能提出训练假设）。"],["适用与备注","适合已经完成至少一次半马的跑者。若掉速伴随持续胃部不适，再结合[长跑营养](../05-distance-running-nutrition.md)的相应条目看。"],["来源","Cuk 等在维也纳城市马拉松半马和全马完赛者研究的 Methods、Results。 [比赛分段研究](https://pubmed.ncbi.nlm.nih.gov/38187410/)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["B"]},{"id":157,"qid":"Q157","section":"运动","chapter":"有氧训练","question":"平时练的路线平坦，半马赛道却有连续坡，怎样在专项训练里做近似练习？","title":"用比赛相近的起伏练坡前、坡上和坡后切换","fields":[["怎么做","先看官方海拔图，找出连续爬升大致从哪开始、持续多久，以及下坡是否紧接着。挑现有训练能容纳的相近坡段，先用容易控制的用力熟悉，在上坡允许配速放慢，下坡找能稳定控制的步子。平时只有短坡时，也可以先在轻松跑里重复几次平缓上坡。"],["成本","用 10 分钟看赛道图，可能另花往返路线的时间。比如将平时 45 分钟轻松跑中的一部分换到起伏路线，仍按原时长结束。"],["说人话","先练上坡不慌、下坡跑稳，再练回到平路时怎样接上节奏。"],["收益","提前熟悉地形改变时的用力和节奏，帮助制定分段策略。"],["证据等级","B（坡度与跑步能量成本关系有实验支持。如何设计近似路线和何时增加难度属于执行建议）。"],["适用与备注","适合路跑半马有明显起伏的跑者。路线选择优先考虑路面、视线和交通。"],["来源","波士顿田径协会半马 Level One 第 8 周起伏路线模拟课，Minetti 等不同坡度跑台实验的 Results。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [坡度实验](https://doi.org/10.1152/japplphysiol.01177.2001)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["B"]},{"id":158,"qid":"Q158","section":"运动","chapter":"有氧训练","question":"确定半马目标完赛时间后，怎样换成每五公里的累计时间和最后一段的用时？","title":"把半马目标用时换成累计五公里分段","fields":[["怎么做","先把目标时间化成秒，再除以 `21.0975` 得到每公里秒数。将它分别乘以 `5、10、15、20` 得到累计用时，乘以 `1.0975` 得到 20 公里过后到终点的用时。最后再四舍五入。"],["成本","约两分钟。目标 2 小时 10 分时，平均约 6 分 10 秒/公里，5、10、15、20 公里累计约为 `30:49`、`1:01:37`、`1:32:26`、`2:03:14`，最后 1.0975 公里约 `6:46`。"],["说人话","存几个公里牌的累计用时。比赛里只看现在比计划早了还是晚了。"],["收益","更容易把目标时间换成路上可核对的数字，尤其是手表瞬时配速变化时。"],["证据等级","C（世界田联公开的标准距离加算术换算。等速表用来核对总体时间）。"],["适用与备注","以自己过起跑线开始计时的净时间为例。遇到起伏、拥挤或天气变化，可按赛道调整各段用时。"],["来源","世界田联半马项目页的标准距离。 [世界田联半马项目说明](https://worldathletics.org/disciplines/road-running-event/half-marathon)"]],"path":"book/distance-running/03-half-marathon.md","aliases":"","grades":["C"]},{"id":159,"qid":"Q159","section":"运动","chapter":"有氧训练","question":"首全马最长一跑要到 30 公里吗，怎样在距离、用时和恢复之间取舍？","title":"用距离、在路上的时间和跑后恢复一起定最长跑","fields":[["怎么做","查现有计划安排到多远，按自己的轻松用时估算这趟要花多久。再对照近几次长跑后的恢复和下一周可训练的时间。如果跑到 30 公里的用时比你近期能承受的长出许多，可以先按当前能完成和恢复的训练量安排，再检视完赛目标。"],["成本","例如按 7 分 30 秒/公里计算，26 公里约 3 小时 15 分，30 公里约 3 小时 45 分。还要给出门准备、往返和跑后恢复留时间。"],["说人话","30 公里只是一个距离。多跑的那半小时会不会打乱后面的训练，跟这趟跑多远一样重要。"],["收益","把最长跑放回整个训练周期里考虑，能提前发现时间或恢复上的缺口。"],["证据等级","B（大众跑者队列发现最长跑与完赛时间有关。具体里程组的结果无法定义首马的必跑门槛）。"],["适用与备注","波士顿田径协会首全马方案概览给出的长跑上限为 16–18 英里，约 26–29 公里，是特定计划的例子。准备不足时见[首马计划起点](../02-distance-running.md#q33)。"],["来源","Fokkema 等队列的表 3 和 Discussion 中最长跑分组，波士顿田径协会全马 Level One 概览。 [跑量与最长跑队列研究](https://doi.org/10.1111/sms.13725) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["B"]},{"id":160,"qid":"Q160","section":"运动","chapter":"有氧训练","question":"全马计划里的长跑逐周变长，怎样判断哪一周应重复上周的距离？","title":"上次长跑的负担还没消化时，先持平或缩短","fields":[["怎么做","计划加长前，问上周末尾是否仍能轻松控制，接下来一两次跑步是否恢复正常，本周剩余睡眠和训练时间是否充足。如果上次末尾明显吃力或后续训练受影响，可以重复一次最近能轻松完成的距离，或进一步缩短。若有疼痛，先按症状决定是否停跑。"],["成本","翻看上周长跑和随后两次训练。比如计划从 22 公里加到 24 公里，但跑完 22 公里后两次轻松跑都明显吃力，本周可把 22 公里当作待复查的上限。"],["说人话","长跑的距离可以原地停一周。先看看上次那趟跑完以后还能不能照常训练。"],["收益","可以减少把一次距离增加叠加到未恢复的训练周上的机会。"],["证据等级","B（单次距离相对近期最长跑增大与伤病发生率有关，来自观察研究。重复上周的判断为执行建议）。"],["适用与备注","适合周跑量相对稳定、仍在积累长跑的成年人。存在疼痛时见[训练相关健康](../06-training-health.md)。"],["来源","Frandsen 等研究的单次跑量定义和结果，波士顿田径协会全马 Level One 第 15–17 周的长跑变化。 [单次距离与伤病研究](https://pubmed.ncbi.nlm.nih.gov/40623829/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["B"]},{"id":161,"qid":"Q161","section":"运动","chapter":"有氧训练","question":"最长一跑做过一次后，怎样决定是否还要再做一次类似距离？","title":"再安排一次最长跑前，先说清楚要练什么","fields":[["怎么做","回看已经完成的长跑是否达到目的，例如练习长时间维持轻松用力、使用比赛装备或在后半段保持节奏。若还有具体内容未练，且恢复顺利、减量前仍留有时间，可以再安排相近距离。已达到目的或恢复吃力时，下次可用较短的长跑巩固。"],["成本","约 10 分钟回看课表。比如原来跑 27 公里已练过装备和节奏，下一趟只想确认赛道起伏时，可按日程选原计划内较短的起伏跑。"],["说人话","最长一跑做过一次以后，先问再跑一趟能多练到什么。"],["收益","可以为最耗时的训练留出明确目的，也方便保留赛前减量。"],["证据等级","B（公开课表对峰值周前后有多种安排。汇总研究使用过较长训练次数分析成绩关联，无法据此确定某个人需要几次最长跑）。"],["适用与备注","适合已经完成本周期最长一跑、正在安排最后几次长跑的人。上一次后续训练受影响时，先看[何时持平或缩短](#q160)。"],["来源","Doherty 等全马训练与表现荟萃回归摘要中的训练变量，波士顿田径协会全马 Level One 第 14–18 周。 [全马训练与表现研究](https://pubmed.ncbi.nlm.nih.gov/31704026/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["B"]},{"id":162,"qid":"Q162","section":"运动","chapter":"有氧训练","question":"全马课表里的周中中长跑，怎样和轻松跑、周末长跑搭配？","title":"把周中中长跑排成比普通轻松跑略长的一课","fields":[["怎么做","先保留原有休息和周末长跑。平日已有几次稳定的跑步时，可以在周中选一次交通和时间都合适的跑，适量延长，强度按当前课表或以轻松为主。若周末长跑的末段越来越吃力，先缩回周中这一次，看看下一周是否好转。"],["成本","比如周中原有两次各 35 分钟轻松跑，先把其中一次排到 45 分钟。追加的 10 分钟也要计入周总时长。"],["说人话","周中的一跑可以稍微长一点。周末前如果已经累了，就把它缩回原来的长度。"],["收益","把一部分连续有氧跑放到工作周，周末长跑有机会按原定目的完成。"],["证据等级","C（半马和全马公开课表常以不同长度和强度排周。周中怎么加时为执行建议）。"],["适用与备注","适合工作日能安排训练、周末仍有一段长跑时间的人。先看[训练日之间的安排](01-planning.md#q133)。"],["来源","波士顿田径协会全马 Level Two 第 1、2 周的周中有氧跑和末尾较长跑。 [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["C"]},{"id":163,"qid":"Q163","section":"运动","chapter":"有氧训练","question":"什么情况下可以在长跑后半程加一段全马目标配速，怎样判断该加多少？","title":"长跑已稳定时，再试一短段全马目标配速","fields":[["怎么做","已经多次完成相近时长的轻松长跑，而且随后能正常恢复时，可在一次熟悉的长跑后半段试一短段目标配速，跑完用轻松跑收尾。这周减少其他较难的训练。若中途已需要明显加力、路况变化大或这两天恢复欠佳，这次照原强度完成即可。"],["成本","例如在已能轻松完成的 90 分钟里，用后半段的 10–15 分钟试目标用力，保留最后慢跑时间。示例只展示把一段放入原总时长的方式。"],["说人话","先能稳稳跑完这段距离，再拿原来的一小段练比赛节奏。"],["收益","能体会跑了一段时间之后控制目标配速需要多少努力，同时记录这堂课对后续训练的影响。"],["证据等级","C（赛事训练计划用轻松跑、目标配速和慢跑收尾组合专项训练。例子的时长为执行上的缩小演示）。"],["适用与备注","适合有稳定长跑经验的人。若目标配速还没有实际依据，先见[用训练和比赛成绩估目标](#q164)。"],["来源","波士顿田径协会全马 Level One 第 11、14、17 周的 Marathon Simulation。 [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["C"]},{"id":164,"qid":"Q164","section":"运动","chapter":"有氧训练","question":"跑过半马后，怎样结合半马成绩、周跑量和长跑表现估全马目标配速？","title":"用半马成绩估全马，再拿周跑量和长跑表现校正","fields":[["怎么做","先找一场近期可比的半马成绩，得到一个初步估时。随后一起看近几周实际周跑量是否稳定、连续长跑末端配速和体感是否可控，以及跑后是否恢复。若训练刚接上或多次长跑后半程都很吃力，给自己留出更慢的起跑选项，或先设完赛目标。"],["成本","花约 15 分钟翻记录。半马 2 小时，按 `2 小时 × 2^1.07` 换算约全马 4 小时 12 分。以 4 小时 30 分起跑约为 6 分 24 秒/公里，也是一个待检视的算例。"],["说人话","半马能跑多快是一条线索。能不能在更长距离维持，回头看你最近实际跑过什么。"],["收益","有机会识别单凭短距离成绩得到的过快目标，并预先准备一种保守的节奏。"],["证据等级","B（大众跑者研究中，单用 Riegel 公式预测全马，对约一半的跑者至少快了 10 分钟。合并周跑量可改善研究中预测，但个人误差仍可能较大）。"],["适用与备注","先用在已有近期半马成绩、也完成过全马准备期部分长跑的人。对稳妥完赛更重要的跑者可从[首全马训练计划](../02-distance-running.md#q33)出发。"],["来源","Vickers 和 Vertosick 研究的 Race time prediction 和 Model 1，Fokkema 等研究的全马分组和表 3。 [大众跑者估时研究](https://doi.org/10.1186/s13102-016-0052-y) · [跑量与最长跑队列研究](https://doi.org/10.1111/sms.13725)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["B"]},{"id":165,"qid":"Q165","section":"运动","chapter":"有氧训练","question":"周末难腾出连续几小时，分两天跑与一次连续长跑各能练到什么？","title":"时间不够时拆成两跑，并另留机会练连续长跑","fields":[["怎么做","偶尔没法腾出一整段时间，可以在两天各排一段自己熟悉的轻松跑，或少完成一点周跑量。若每个周末都只能拆跑，回头挑一份与你的生活安排相符的训练计划，尽量给几次连续较长训练另留时间。"],["成本","例如周末两天各跑 55 分钟，账面都是 110 分钟，须两次准备和出门。连续跑 110 分钟需要一整段空档，途中还可以练补给和装备。"],["说人话","两天分开跑能保留一部分周跑量。想练跑久之后怎么维持节奏，就得有一次连续跑得较久。"],["收益","日程变化时仍可安排训练，也能知道哪部分比赛准备要在另外的日子练习。"],["证据等级","C（公开计划普遍单列连续长跑。训练量和长跑与成绩的关联来自观察数据，两种排法训练效果是否相同缺乏直接检验）。"],["适用与备注","适合训练时间临时受限的成年人。计划的长跑本身已过长时，见[最长跑怎么定](#q159)。"],["来源","公开全马训练计划分析的图 2 和表 3，Fokkema 等对周量与最长一跑的指标定义和表 3。 [92 份公开全马课表分析](https://doi.org/10.1186/s40798-024-00717-5) · [跑量与最长跑队列研究](https://doi.org/10.1111/sms.13725)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["C"]},{"id":166,"qid":"Q166","section":"运动","chapter":"有氧训练","question":"全马长跑用绕圈还是往返路线，怎样兼顾地形、距离控制和方便结束训练？","title":"选能控制距离也方便提前结束的长跑路线","fields":[["怎么做","想固定补给点或能随时收尾，可挑短环线或多次经过起点的路线。想练连续起伏或体验较长的路段，可选往返路线，并记下转折点和途中可离开的地点。出发前看好路面、车流、天气和哪里可取水。"],["成本","出发前花 10 分钟在地图上确认。计划 20 公里时，4 圈各 5 公里便于每圈都回起点，往返路线则需要在离起点 10 公里前安排一个可提前返回的位置。"],["说人话","先想好跑不满的时候怎么回去，再决定从哪出发。"],["收益","有助于按时间和训练目的控制距离，也方便处理天气变化或身体不适。"],["证据等级","C（跑步组织的路线安全指引支持事先查看地形、折返点和补给，对环线与往返的选择为执行建议）。"],["适用与备注","适用于独自或结伴公路长跑。赛道补给和用具另见[首全马补给](../05-distance-running-nutrition.md#q22)。"],["来源","美国路跑俱乐部协会安全团跑指南的 Map Your Route 和 Provide clear instructions，跑者礼仪指南的往返折返点。 [安全团跑指南](https://www.rrca.org/education/for-club-leaders/safe-group-run-guidelines/) · [跑者礼仪指南](https://www.rrca.org/education/for-runners/runner-etiquette/)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["C"]},{"id":167,"qid":"Q167","section":"运动","chapter":"有氧训练","question":"同一次全马长跑，前半段体感轻松、后半段却难以维持，怎样用分段记录调整下次练法？","title":"长跑后半程掉速时，先用分段记录挑一项改动","fields":[["怎么做","把平均配速拆开看，记录前后半段用时、路线起伏、天气、体感和进食时间。先找最突出的一项。若前段明显快过计划，下次降低起步强度。若只有后段路况更难，可选起伏近似的路线再比。若多次在相近时间掉速，再一起复查时长、休息和已经练过的补给安排。"],["成本","花约 10 分钟写下两段数字和一个可调整的条件。比如原计划平路交谈强度，前两公里却接近比赛配速，下次先调整前两公里。"],["说人话","先改一件最可能有影响的事。回到类似的路线上跑一次，容易看出改动后还会不会掉速。"],["收益","为下一跑确定一个可检验的训练变化，便于区分多种可能原因。"],["证据等级","B（比赛数据说明前后段配速有可观察的模式。训练分段不能单独确立掉速原因）。"],["适用与备注","这里讨论长跑记录。若伴随持续异常症状见[训练相关健康](../06-training-health.md)，吃喝的复查从[长跑营养](../05-distance-running-nutrition.md)开始。"],["来源","Smyth 的大众全马分段分析，摘要和开头、后段速度的 Methods，Fokkema 等对掉速因变量的定义。 [全马配速分段分析](https://journals.sagepub.com/doi/10.3233/JSA-170205) · [跑量与最长跑队列研究](https://doi.org/10.1111/sms.13725)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["B"]},{"id":168,"qid":"Q168","section":"运动","chapter":"有氧训练","question":"备战全马时，周末长跑该侧重跑够时间、练习配速，还是模拟赛道起伏？","title":"给周末长跑选一个主要目的，再定距离和路线","fields":[["怎么做","连续跑的时间还短，先挑平缓路线，练舒服地完成较长一跑。时长和恢复已稳定，可挑一周练赛道的典型起伏，或在另一周用平路练比赛配速。把更远的距离、更高的强度和更难的地形分开推进，便于判断哪项超出了当前负荷。"],["成本","用几分钟标注本周末要练的内容。例如保留目前常跑的 90 分钟，一次选平路练短段目标配速，另一次换起伏路线全程轻松跑。"],["说人话","这周想练坡，就把路线选好。下次想看能不能稳住比赛配速，再给它挑一段容易比较的路。"],["收益","能用同一个周末长跑位置服务不同训练目的，也留下更容易比较的训练记录。"],["证据等级","C（官方课表轮换有氧长跑和起伏路线模拟课。按个人基础拆分各项训练变化为执行建议）。"],["适用与备注","适合已有长跑基础的人。跑前的路线选择见[长跑路线](#q166)，专项配速怎么加见[全马配速段](#q163)。"],["来源","波士顿田径协会全马 Level One 第 12 周有氧长跑、第 14 周起伏路线模拟课、第 16 周轻松长跑。 [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/04-marathon.md","aliases":"","grades":["C"]},{"id":169,"qid":"Q169","section":"运动","chapter":"有氧训练","question":"赛前几周的训练完成情况不同，半马和全马如何从课表确定减量开始日？","title":"从比赛日往回标记减量，再用已完成训练检查","fields":[["怎么做","先把比赛日标进课表，往回找该计划开始降低周跑量的日期，以及最后几次较长的跑。已经完成大部分训练时，按原计划减量。若近期多周训练中断，仍从当前能应付的负荷往下排，同时重新评估比赛目标。"],["成本","花一刻钟画出最后几周日历。波士顿田径协会 Level One 的半马计划把第 12 周列为减量，之前第 11 周的长跑已比第 9 周短。全马方案把第 19–20 周列为减量，较长的模拟课在第 17 周。"],["说人话","从比赛日往回看哪里开始少跑。最近的里程做得不多时，减量也从实际跑过的量开始算。"],["收益","把减量安排和当前训练状态放在同一张日历上，留出恢复时间。"],["证据等级","B（大众全马训练记录中，较长且持续降低周量的减量与更快的完赛相关。两份赛事课表展示半马、全马的不同排法）。"],["适用与备注","半马和全马的周数取自特定课表。开始减量之后漏课，见[最后一堂长跑漏做](#q172)。"],["来源","波士顿田径协会半马 Level One 第 9–12 周、全马 Level One 第 17–20 周，Smyth 和 Lawlor 研究的 taper 类型和 Results。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/) · [大众全马减量研究](https://pmc.ncbi.nlm.nih.gov/articles/PMC8506252/)"]],"path":"book/distance-running/05-taper.md","aliases":"","grades":["B"]},{"id":170,"qid":"Q170","section":"运动","chapter":"有氧训练","question":"最后一到两周，先减周里程、单次训练量，还是跑步天数？","title":"先缩短训练，把周总里程降下来","fields":[["怎么做","先按平时周跑量与当前课表确定较低的训练总量。把较长的跑缩短，减少质量课里快速段的总量。在原本会跑的日子里保留几次短而熟悉的跑。疲劳持续或赛前行程挤时，也可以腾出休息日。"],["成本","例如原来一周四跑合计 40 公里，若把 28 公里安排成 6、7、5、10 公里，跑步天数仍为四天，周距离少了 30%。算例只展示如何同时调整单次和总量，比赛里程另算。"],["说人话","先把几堂课缩短。熟悉的节奏可以留一小段，跑完还有余力。"],["收益","周量下降的同时，可以维持熟悉的训练节奏与动作感觉。"],["证据等级","B（耐力项目荟萃分析支持减量。试验涵盖不同项目，表 2 各组的减量幅度、频次和强度结果供参考）。"],["适用与备注","用于最后一到两周，具体负荷按此前已完成训练和赛事课表调整。快速段应是自己熟悉的内容。"],["来源","Wang 等耐力运动减量综述的计时表现结果和表 2，波士顿田径协会全马 Level One 第 19–20 周。 [耐力运动减量荟萃分析](https://pmc.ncbi.nlm.nih.gov/articles/PMC10171681/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/05-taper.md","aliases":"","grades":["B"]},{"id":171,"qid":"Q171","section":"运动","chapter":"有氧训练","question":"最后一次较长的跑放在比赛前多久，怎样从课表里倒推？","title":"从减量课表倒推最后一次较长跑","fields":[["怎么做","先区分训练周期里最长或最难的一趟，以及后来相对较长但已经缩短的训练。把比赛日期对齐课表后，两个位置分别写进日历。再按过去跑完类似距离要多久恢复，检查中间的训练是否排得开。"],["成本","给日历标两个节点。波士顿田径协会 Level One 半马示例在赛前约两周做 10 英里模拟课，赛前一周还保留 6 英里轻松跑。其全马示例把 15–18 英里模拟课放在约三周前，随后一周仍有标为 13–14 英里的专项训练。"],["说人话","最后一堂真正难的长跑可以排早点，之后还可以有一堂已经缩短的跑。"],["收益","看课表时可识别真正需要挪动的节点，方便给最后阶段留恢复时间。"],["证据等级","C（官方训练表提供倒推示例。最后一趟怎么排取决于计划、训练基础和以往恢复）。"],["适用与备注","例子说明两类训练可以安排在不同周。可用[赛前减量日期](#q169)检视周总量。"],["来源","波士顿田径协会半马 Level One 第 10–12 周、全马 Level One 第 17–20 周与比赛日，NYRR 全马问答的最后一堂长跑小节。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/) · [NYRR 教练问答](https://prod.nyrr.org/news/2025/09/26/marathon-training-faqs-part-two)"]],"path":"book/distance-running/05-taper.md","aliases":"","grades":["C"]},{"id":172,"qid":"Q172","section":"运动","chapter":"有氧训练","question":"错过原计划最后一次长跑，怎样判断要不要补上？","title":"减量开始后漏了长跑，就按剩余日程继续","fields":[["怎么做","如果已经进入减量，保留赛前短课和休息。若还早，只有相近的空档、已有类似距离基础、调整后仍可留够恢复时，可以考虑换到那一天，并减少相邻训练的负荷。若少完成好几次关键长跑或有伤病，重新评估比赛目标与能否参赛。"],["成本","回看比赛前还能安排的训练天数。比如赛前六天才重获空档，可以按现在这周的短课走，省下原长跑要消耗的时间和恢复日。"],["说人话","最后几天按比赛周安排跑。缺了多少准备，用来调整目标。"],["收益","能保住赛前的休息日，也能把单次漏课和整段训练不足分别评估。"],["证据等级","C（赛事教练强调积累训练的连续性。关于漏课后是否移位的判断为执行建议）。"],["适用与备注","漏课由疼痛、发热或其他异常症状引起时，见[训练相关健康](../06-training-health.md)。"],["来源","NYRR 全马训练问答的最后一堂长跑与减量小节，NYRR 教练常见问答的临赛准备不足一节。 [最后几周训练问答](https://prod.nyrr.org/news/2025/09/26/marathon-training-faqs-part-two) · [训练缺席与参赛问答](https://prod.nyrr.org/news/2026/06/10/coaches-answers-to-frequently-asked-questions)"]],"path":"book/distance-running/05-taper.md","aliases":"","grades":["C"]},{"id":173,"qid":"Q173","section":"运动","chapter":"有氧训练","question":"比赛前一天适合轻松跑一小段还是休息，怎么结合过去的训练体验决定？","title":"比赛前一天按熟悉的习惯选短慢跑或休息","fields":[["怎么做","回想以往早起比赛或长课前一天的安排。如果短慢跑之后通常感觉轻松，而且当天有余地，可按课表做一段能说话的短跑。如果一路出行很累、休息通常让你状态更好，或平时习惯前一日不跑，就留出休息时间。"],["成本","例如选择一次熟悉的十几分钟轻松跑，需要算上换衣与准备。波士顿田径协会的示例为半马 Level One 赛前一天轻松跑 2 英里，全马 Level One 为 2–3 英里。"],["说人话","前一天可以稍微跑一会儿，也可以休息。用自己试过的办法。"],["收益","为比赛当天留精力，同时让赛前一日的作息容易执行。"],["证据等级","C（官方课表提供短慢跑示例。休息或短跑的选择可根据个人体验和行程）。"],["适用与备注","适合赛前一天没有新出现的异常症状的跑者。短慢跑时仍可用[说话测试](02-workouts.md#q140)控制强度。"],["来源","波士顿田径协会半马 Level One 第 12 周周六、全马 Level One 第 20 周周日。 [半马官方课表](https://www.baa.org/races/boston-half/info-for-athletes/boston-half-training/) · [全马官方课表](https://www.baa.org/races/boston-marathon/info-for-athletes/boston-marathon-training/)"]],"path":"book/distance-running/05-taper.md","aliases":"","grades":["C"]},{"id":174,"qid":"Q174","section":"运动","chapter":"有氧训练","question":"减量后觉得腿沉或担心状态下降，怎样用已有记录判断是否需要改计划？","title":"减量时觉得腿沉，先看连续几天和平时的表现","fields":[["怎么做","翻看同类轻松跑的体感与近期睡眠、出行记录。偶尔腿沉，跑热后仍能以平时的用力完成短跑，先继续原本的减量安排。若连续几天越来越重、平常走动也受影响或有新疼痛，减少训练并按症状处理。"],["成本","每天用一两分钟记一下睡眠、腿的感觉和轻松跑体感。原本有一堂短课时，可在热身后比较感觉，无需安排额外测试。"],["说人话","拿这几天和自己平时比。一天觉得腿沉，可以等下一次短跑再看。"],["收益","能根据趋势决定维持减量还是增加休息，避免用一次全力训练来试状态。"],["证据等级","C（赛前运动医学与教练问答描述减量期间跑者常见的主观顾虑，记录方法为执行建议）。"],["适用与备注","出现越来越重的疼痛或其他异常时，见[训练相关健康](../06-training-health.md)。"],["来源","纽约路跑协会发表的 Hospital for Special Surgery 马拉松减量说明，以及其全马训练教练问答的 taper 小节。 [运动医学专家减量说明](https://prod.nyrr.org/news/2020/10/10/hss-ask-the-experts-marathon-taper) · [NYRR 教练问答](https://prod.nyrr.org/news/2025/09/26/marathon-training-faqs-part-two)"]],"path":"book/distance-running/05-taper.md","aliases":"","grades":["C"]},{"id":175,"qid":"Q175","section":"运动","chapter":"有氧训练","question":"起跑拥挤或前几公里明显跑快了，怎样决定接下来怎么调配速？","title":"起跑被堵或跑快了，下一段先回到可控的用力","fields":[["怎么做","拥挤时先沿可走的路线跑，等空间打开再回到计划节奏。已经快过计划时，从下一段逐渐放缓。到下一处官方分段点再核对总时间、呼吸和体感，再决定是否调整目标。"],["成本","赛前在手表或配速卡上标出第一处官方分段。比如首公里因拥挤慢了 20 秒，接下来先跑原计划的速度，等 5 公里处再复查。"],["说人话","开头有一点偏差很常见。路宽了就找回原来的节奏，别为了几十秒忽快忽慢。"],["收益","能在起跑阶段维持较稳定的用力，在更完整的分段上做判断。"],["证据等级","B（大众全马的回顾性数据观察到开头较快者更容易经历后段大幅掉速，临场修正方法属于执行建议）。"],["适用与备注","给半马和全马跑者。若进后半程目标已难以维持，见[切换比赛目标](#q180)。"],["来源","Smyth 的全马分段研究中开头配速结果和对因果的讨论，NYRR 配速队常见问答中的保守起跑策略。 [大众全马配速研究](https://journals.sagepub.com/doi/10.3233/JSA-170205) · [NYRR 配速队](https://prod.nyrr.org/train/nyrr-pace-team)"]],"path":"book/distance-running/06-racing.md","aliases":"半马起跑配速 起跑节奏 前五公里配速","grades":["B"]},{"id":176,"qid":"Q176","section":"运动","chapter":"有氧训练","question":"跟配速员前，怎样核对他们的计时口径、分段计划和起跑位置？","title":"跟配速员前问清计时起点、分段和所在分区","fields":[["怎么做","看主办方赛前说明，确认目标牌按鸣枪时间还是按过线后的芯片净时间，配速员是否和你在同一分区和波次，以及上坡会不会调整。到起跑区还可当面问首几公里和补给站怎么跑。找不到适合的组时，按自己的分段表跑。"],["成本","赛前花 5–10 分钟查看。芝加哥全马公开说明用芯片时间，配速员过起点计时垫才开表。若自己在该配速员之后 30 秒过线，自己的净时间从下一时刻起算。"],["说人话","同一块目标牌还要配上同一个起点。先确认你能从哪里、按什么节奏跟上。"],["收益","能提前发现目标时间和分区安排不匹配，减少比赛中追赶或猜测。"],["证据等级","C（赛事官方信息直接说明这些细节因比赛而异，实际参加时查当年赛事公告）。"],["适用与备注","配速队是辅助。注意分区要求，若组内速度超出当天可维持的用力可让跑团先走。"],["来源","芝加哥马拉松 Pace Team 的起跑分区与芯片计时问答，NYRR Pace Team 的集合、配速和补给站问答。 [芝加哥配速队](https://www.chicagomarathon.com/event-info/participant-information/pace-team/) · [NYRR 配速队](https://prod.nyrr.org/train/nyrr-pace-team)"]],"path":"book/distance-running/06-racing.md","aliases":"","grades":["C"]},{"id":177,"qid":"Q177","section":"运动","chapter":"有氧训练","question":"首全马能从起跑就跑走交替吗，怎样在长跑训练里先试自己的节奏？","title":"想用跑走交替完成首全马，先在长跑从第一段练起","fields":[["怎么做","若打算用跑走交替，可以从起跑就按练过的比例切换跑步和步行。训练时选自己已跑得惯的路线和总时长，试一种容易记忆的节奏。比较整体用时、后半程体感和跑后恢复，再核对比赛关门规则，决定要不要用在赛场。"],["成本","可在原有长跑里试一组自选比例，例如每跑 4 分钟走 1 分钟，连续几轮观察。算全程预测要把走路段计入平均配速。"],["说人话","如果想靠跑走交替完赛，平时就按同样的办法练，看看从头到尾能不能坚持这个节奏。"],["收益","给自己一个提前验证的节奏选项，也能练到从走路重新进入慢跑。"],["证据等级","B（小型非精英全马对照研究中，跑走组赛后自报肌肉疼痛和疲劳较少，完赛用时差异未达统计显著。研究规模有限，结果不能保证成绩相当或心脏负担更低）。"],["适用与备注","给已有连续训练基础而且考虑跑走策略的首马跑者。路线有补给点或狭窄路段时，减速前留意身后。"],["来源","Hottenrott 等非精英全马跑走交替研究的方法、用时与赛后自报结果。 [全马跑走交替研究](https://pubmed.ncbi.nlm.nih.gov/25467199/)"]],"path":"book/distance-running/06-racing.md","aliases":"","grades":["B"]},{"id":178,"qid":"Q178","section":"运动","chapter":"有氧训练","question":"赛道有持续上坡或下坡，怎样调整每公里配速和用力程度？","title":"持续坡段按用力跑，回到平路再对照计时","fields":[["怎么做","赛前看海拔图，标出长上坡和陡下坡。上坡允许每公里速度比平路慢，保持能控制的用力。下坡根据坡度、弯道和路面跑得稳一些，回到平路再用体感和下一处分段核对。"],["成本","花一刻钟看官方赛道，能练时在平时路线加入一段近似坡度。可记录坡前、坡上和坡后的配速和体感，留作比赛参考。"],["说人话","上坡慢一点，下坡把脚步跑稳，等到了平路再看表。"],["收益","可按赛道地形分配体力，同时保留用分段复查进度的方法。"],["证据等级","B（坡度的能量成本有实验数据，赛事配速指引也展示按地形调整的做法。坡段速度需要结合个人训练和实际路况）。"],["适用与备注","适合有连续起伏的路跑半马和全马。想找路线练习时见[半马起伏练习](03-half-marathon.md#q157)。"],["来源","Minetti 等跑台坡度研究的结果，NYRR 配速队按赛道起伏控制用力的问答。 [坡度实验](https://doi.org/10.1152/japplphysiol.01177.2001) · [NYRR 配速队](https://prod.nyrr.org/train/nyrr-pace-team)"]],"path":"book/distance-running/06-racing.md","aliases":"","grades":["B"]},{"id":179,"qid":"Q179","section":"运动","chapter":"有氧训练","question":"比赛当天比训练时热，怎样调整起跑目标和后半程预期？","title":"比训练时更热，起跑就下调配速预期","fields":[["怎么做","赛前看主办方公告和整个比赛时段的天气，考虑自己是否在相近条件下练过。比训练时明显更热时，把起跑目标放慢，使用较保守的用力，从早段就复查体感与后续预期。出现意识异常、站立不稳等严重异常时，停止并立即呼叫赛道医疗人员。"],["成本","出门前花几分钟查温度、湿度和赛事提示。可以把原来的一个时间目标改成较宽的范围，预先记好补给点、医疗点和退赛方式。"],["说人话","天气变热就从起跑改计划。跑着越来越难受时，先照顾安全。"],["收益","帮助在天气超出准备时尽早改节奏，给后段的调整留余地。"],["证据等级","B（多场大众全马数据观察到较暖天气与成绩放慢相关，IOC 共识支持热环境风险管理。个人需要放慢的幅度取决于实际情况）。"],["适用与备注","服从赛事的改道、缩短、暂停和取消决定。查看[高温时调整训练和比赛](../training-health/06-emergencies-and-weather.md#q356)和[疑似热射病的现场处理](../training-health/06-emergencies-and-weather.md#q355)，补水见[热天重新估计饮水需求](../05-distance-running-nutrition.md#q31)。"],["来源","Ely 等关于气温与全马分段的研究，IOC 高温环境运动共识的 risk mitigation 和 exertional heat stroke 部分。 [气温与全马配速研究](https://pubmed.ncbi.nlm.nih.gov/18685522/) · [IOC 高温赛事共识](https://pmc.ncbi.nlm.nih.gov/articles/PMC9811094/)"]],"path":"book/distance-running/06-racing.md","aliases":"","grades":["B"]},{"id":180,"qid":"Q180","section":"运动","chapter":"有氧训练","question":"原定全马目标在后半程已经很难达到，怎样切换到较稳妥的跑法？","title":"全马后半程目标落空时，先重设能维持的节奏","fields":[["怎么做","当前目标需要一段明显超出体感的配速才能追回时，先放到自己能控制的用力。已经练过跑走交替的人也可以切到熟悉的跑走节奏。到下一处官方计时点复查剩余距离、身体反应和赛事关门规则。出现严重不适时，停止比赛并联系赛道医疗人员。"],["成本","赛前用几分钟写好备用选择。比如 30 公里时想追回 4 分钟，剩余每公里平均要比原计划快近 20 秒，可以把目标改成较稳的配速或看下一站再定。"],["说人话","先定下一公里跑多少。旧目标已经很难追时，把精力用来稳住剩下的路。"],["收益","遇到原计划失效时还有下一步可选，可以根据比赛进展再次判断是否继续。"],["证据等级","B（大众全马分段数据说明后程掉速常见。降速或使用跑走的临场决策属于执行建议）。"],["适用与备注","运动中出现胸痛、快晕倒或异常气短，按[现场急症流程](../training-health/06-emergencies-and-weather.md#q353)立即求助。"],["来源","Smyth 的全马开头和后段配速研究，及 Hottenrott 等关于计划内跑走策略的试验摘要。 [大众全马分段研究](https://journals.sagepub.com/doi/10.3233/JSA-170205) · [全马跑走交替研究](https://pubmed.ncbi.nlm.nih.gov/25467199/)"]],"path":"book/distance-running/06-racing.md","aliases":"","grades":["B"]},{"id":181,"qid":"Q181","section":"运动","chapter":"有氧训练","question":"手表距离和官方公里牌对不上时，怎样校正配速判断和剩余用时？","title":"用官方分段距离与净时间校正手表配速","fields":[["怎么做","过官方公里牌或计时点时看从起点开始的总用时，必要时手动按圈。一块牌的位置可能有误差，拿相隔几公里的分段核对。用该段实际用时除以官方标示的距离估最近配速，再乘以官方剩余距离得到剩余用时粗估。"],["成本","赛前花几分钟熟悉手动分圈。比如半马过 10 公里是 1 小时，过 15 公里是 1 小时 31 分，这段约 6 分 12 秒/公里。以该速度跑余下 6.0975 公里，约还需 37 分 48 秒。"],["说人话","遇到手表和公里牌不一致，先用两个官方分段之间的时间重新算。"],["收益","减少追逐瞬时配速的冲动，也能用更长时段估计比赛进度。"],["证据等级","B（位置记录验证研究表明运动手表距离有环境与设备误差。规则规定公路赛道的测量路线，配速核对是算术应用）。"],["适用与备注","赛道认证按允许路线中可跑的最短路径测量，实际跑线可能弯得更多。以主办方最终净用时与正式分段为比赛记录。"],["来源","世界田联公路赛规则 TR55.3，Gilgen-Ammann 等运动手表验证研究的城市、树林与跑道测量结果。 [世界田联技术规则](https://worldathletics.org/download/download?filename=803d6cb5-38df-4438-a917-c371cb46a837.pdf&urlslug=C1.1+%26+C2.1+-+Competition+Rules+%26+Technical+Rules) · [运动手表距离验证研究](https://mhealth.jmir.org/2020/6/e17118)"]],"path":"book/distance-running/06-racing.md","aliases":"","grades":["B"]},{"id":182,"qid":"Q182","section":"运动","chapter":"有氧训练","question":"跑完半马或全马后，怎样判断可以从日常走路过渡到第一次轻松跑？","title":"先确认走路和上下楼如常，再试第一段轻松跑","fields":[["怎么做","赛后先恢复休息和日常走动。能舒适地走路和上下楼，腿的感觉逐渐好转，且日常活动后没有变糟时，再试一小段平路轻松跑。中途若疼痛加重或跑姿被迫改变，就走回去，之后再评估。"],["成本","回到轻松跑时，可先挑离家近的路线，计划约 10–15 分钟并保留早停的余地。当天和次日各记一次感觉，用来决定是否增加下一趟。"],["说人话","先走得顺，再慢慢跑一小段。隔天的感觉也算结果。"],["收益","让第一跑好结束，也能用较小的运动量观察身体反应。"],["证据等级","B（64 名全马完赛者完成的随机试验中，从赛后 48 小时开始的特定强度跑步未显示会拖慢测得的肌损伤指标恢复。研究只观察了特定跑者和所测指标，何时试第一跑仍须看个人状态）。"],["适用与备注","给赛后没有明显异常、准备恢复训练的半马与全马跑者。持续或加重的疼痛和其他异常见[赛后明显不适的处理](../training-health/03-recovery.md#q313)。"],["来源","Martínez-Navarro 等全马赛后一周随机试验的摘要及第 2 节 Methods，NYRR 赛后恢复说明中 First, Celebrate and Recover 的分周示例。 [全马赛后活动试验全文](https://repositori.uji.es/server/api/core/bitstreams/ffcea541-f8aa-440c-8ca6-c46cca58e013/content) · [NYRR 赛后恢复](https://prod.nyrr.org/news/2025/11/18/recovery-and-next-steps-after-goal-race)"]],"path":"book/distance-running/07-recovery.md","aliases":"","grades":["B"]},{"id":183,"qid":"Q183","section":"运动","chapter":"有氧训练","question":"恢复跑的第一周，先增加跑步天数还是增加单次距离？","title":"恢复跑第一周，每次只加一个训练变量","fields":[["怎么做","先做一次短轻松跑，隔天走路与日常活动如常时，再考虑下一次。想找回跑步节奏，可按相近时长增加一次，中间留休息日。已经适应这个频次但想逐步拉长时，可只延长其中一次。任何一步出现明显不适或恢复变差，就回到上一层的负荷。"],["成本","例如两次各 15 分钟都跑得舒服，下一周可安排三次各 15 分钟，或维持两次、把其中一次排到 20 分钟。数字用于展示不同的恢复路线。"],["说人话","先决定这周是多跑一次，还是其中一次稍微跑久一点。"],["收益","训练改变较小，出现不适时更容易判断与哪项改动有关。"],["证据等级","C（赛事教练发布分阶段恢复例子。先增频次或单次距离缺少直接比较，按自己恢复反应选）。"],["适用与备注","这里只指已经开始试跑的第一周，起点按[恢复第一跑](#q182)判断。比赛用力大或近期缺觉时，可多花一周保持原安排。"],["来源","NYRR 目标赛后恢复说明，First, Celebrate and Recover 的分周例子。 [NYRR 赛后恢复](https://prod.nyrr.org/news/2025/11/18/recovery-and-next-steps-after-goal-race)"]],"path":"book/distance-running/07-recovery.md","aliases":"","grades":["C"]},{"id":184,"qid":"Q184","section":"运动","chapter":"有氧训练","question":"什么时候可以在赛后重新加入节奏跑或间歇，怎样安排第一堂质量课？","title":"连续几次轻松跑恢复如常后，再安排短一点的质量课","fields":[["怎么做","日常活动和近期几次短轻松跑都恢复如常时，再尝试一堂熟悉的质量课，把快速段和总时长缩短，暂留较充裕的恢复。结束后看当天以及隔天体感。若还有明显酸痛、疲劳加重或影响跑姿，过几天重新评估。"],["成本","可从原来做得很熟的一课中选一小部分。比如平时安排 4 段各 5 分钟，第一次可先试 2 段各 5 分钟，连热身、慢跑恢复与放松算进计划。"],["说人话","先把慢跑接顺，再做熟课表里的一小段快跑。"],["收益","用较少的较快跑检查恢复进度，还能给后续休息保留空间。"],["证据等级","B（24 名男性业余半马跑者的小型实验，赛后 24 小时起连续中高强度跑的组别，大腿部分影像指标恢复较慢。首次质量课的时间与编排依据个人恢复）。"],["适用与备注","想知道是否已能恢复轻松跑，先看[恢复第一跑](#q182)。持续症状见[赛后明显不适的处理](../training-health/03-recovery.md#q313)。"],["来源","半马后不同强度跑步的定量 MRI 研究，Study subjects、干预方法和 Conclusions，NYRR 目标赛后恢复说明的分段安排。 [半马恢复 MRI 研究](https://link.springer.com/article/10.1186/s13102-026-01640-w) · [NYRR 赛后恢复](https://prod.nyrr.org/news/2025/11/18/recovery-and-next-steps-after-goal-race)"]],"path":"book/distance-running/07-recovery.md","aliases":"","grades":["B"]},{"id":185,"qid":"Q185","section":"运动","chapter":"有氧训练","question":"刚完成一场半马或全马，怎样判断下一场比赛的间隔够不够？","title":"下一场报名之前，先在日历上排出恢复和再训练","fields":[["怎么做","根据上一场的距离、用力和赛后反应，先给恢复留空间，再数还剩多少周可以稳定训练和减量。下一场也想全力跑时，把准备周期算完整。若日历很紧、上一场之后仍难以恢复日常训练，考虑改期或调整原本的目标。"],["成本","找 10 分钟画一条时间线，标出恢复、恢复常规训练、比赛专项和减量。比如全力全马后四周又有全马，这段时间可能大多用于恢复，先考虑把下一场往后排。"],["说人话","两场比赛之间的日子，要先留给恢复，剩下才能用来为下一场训练。"],["收益","报名时能提前发现赛程安排挤掉了哪一段训练，并留出调整余地。"],["证据等级","C（赛事教练对短间隔比赛的意见和恢复建议，用于排程。固定间隔无法判断每个人的恢复和参赛准备）。"],["适用与备注","适合半马和全马赛后考虑下一场的人。早期恢复见[恢复第一跑](#q182)，回看整体目标见[赛后复盘](#q186)。"],["来源","NYRR 教练常见问答的下月再跑全马问题，Roberto Mandje 的连续参赛建议中恢复与第二场目标小节。 [连续参赛常见问答](https://prod.nyrr.org/news/2026/06/10/coaches-answers-to-frequently-asked-questions) · [NYRR 连续赛事安排](https://prod.nyrr.org/news/2025/06/06/how-to-train-for-run-and-recover-from-back-to-back-races)"]],"path":"book/distance-running/07-recovery.md","aliases":"","grades":["C"]},{"id":186,"qid":"Q186","section":"运动","chapter":"有氧训练","question":"怎样结合分段用时、比赛条件和训练记录复盘，选出下个周期最值得改的一项？","title":"用比赛分段和训练记录挑一个下周期要验证的改变","fields":[["怎么做","找出最早偏离原计划的官方分段，再记下那里的天气、地形、体感与当天执行。翻看备赛期有没有类似的表现，写下一条能在下次训练或比赛中检验的改动。如果最明显的原因是起跑偏快，就给下一次设具体的起跑分段目标。"],["成本","用约 15 分钟列一份短记录。比如记下第一处明显偏差、两条可能原因，以及下一次打算怎么验证其中一条。"],["说人话","找到哪里最早出问题，再挑一件自己能改的事，下次看看结果。"],["收益","把上场比赛变成下一段训练的具体任务，避免只用完赛时间判断整个准备过程。"],["证据等级","B（大众比赛数据能描述分段表现，赛后记录和训练对照属于个人复盘，单场表现难以确定原因）。"],["适用与备注","适合有官方分段或个人计时记录的跑者。比较前先确认公里牌和手表的差异，可参照[官方分段核对](06-racing.md#q181)。"],["来源","Smyth 的大众全马分段研究中开头结果及讨论，NYRR 教练常见问答的赛后回顾建议。 [大众全马分段研究](https://journals.sagepub.com/doi/10.3233/JSA-170205) · [NYRR 赛后复盘建议](https://prod.nyrr.org/news/2026/06/10/coaches-answers-to-frequently-asked-questions)"]],"path":"book/distance-running/07-recovery.md","aliases":"","grades":["B"]},{"id":187,"qid":"Q187","section":"营养","chapter":"日常饮食","question":"平时主要吃白米饭和面条，怎么把全谷物逐步加进常吃的主食？","title":"先用少量全谷物替换一顿熟悉的主食","fields":[["怎么做","常煮米饭，先把四勺生米里的其中一勺换成糙米，按糙米包装的浸泡和煮制说明做一次。常吃面条，可以从一顿用配料明确的全麦面替换普通面开始。早上习惯吃米粥，也可以加些燕麦片一起煮。先选一种，吃得惯再加到其他餐。"],["成本","先买一种小包装。假设白米每公斤 6 元，糙米每公斤 10 元，替换 50 克生米多花 0.20 元。用自己的成交价重算。"],["说人话","家里本来就煮饭，先从一锅饭里换一部分米。"],["收益","全谷物保留麸皮、胚芽和胚乳，能给原来以精白米面为主的饮食增加膳食纤维和一些营养素。只改一顿容易看出自己喜不喜欢口感、是否吃得舒服。"],["证据等级","C（多吃全谷物、粗细搭配有膳食指南支持。四勺换一勺是试做比例）。"],["适用与备注","适合日常以精白米面为主的普通成年人。一下加多了容易胀，可以减回能接受的量。买现成包装食品可看[全谷物配料](#q189)。"],["来源","中国营养学会《中国居民膳食指南（2022）》准则三实践应用（五）「全谷物、杂豆作为膳食重要组成」及《中国居民平衡膳食宝塔（2022）修订和解析》第一层。 [准则三](https://dg.cnsoc.org/article/04/70JvPbFmTlyZbjoO67LeRg.html) · [膳食宝塔](https://dg.cnsoc.org/article/04/RMAbPdrjQ6CGWTwmo62hQg.html)"]],"path":"book/everyday-nutrition/01-staples-and-protein.md","aliases":"","grades":["C"]},{"id":188,"qid":"Q188","section":"营养","chapter":"日常饮食","question":"红薯、玉米和山药上桌了，怎样把它们当作一部分主食来搭配？","title":"红薯、玉米和山药上桌时，把它们算进主食","fields":[["怎么做","一餐已经有蒸红薯、玉米粒或一碟山药时，想维持原来一餐的饭量，可以先少盛一部分米饭或面条，蔬菜和蛋白质菜照常搭配。玉米数实际吃掉的玉米粒，山药炖在汤里也把吃掉的山药块算进去。"],["成本","蒸红薯或玉米可和饭一起准备。比价时，假设 6 元买的带芯玉米，去芯后得到 400 克玉米粒，每 100 克可食部分是 1.50 元。红薯或山药也按可食部分比价。"],["说人话","有薯类或玉米的一餐，可以少盛些原来的主食，同时把青菜留在餐盘里。"],["收益","红薯和山药属于薯芋类，玉米属于谷类。把这些淀粉来源算进去，可以有意识地替换主食，同时保留蔬菜和蛋白质来源。"],["证据等级","C（薯类替换部分主食、谷薯分类依据中国膳食指南和食物交换表）。"],["适用与备注","不同食物含水量和能量不同，份量从实际食欲和当天训练量调整。想按营养值换算，可先区分[生重和熟重](#q190)。"],["来源","中国营养学会《膳食宝塔（2022）修订和解析》第一层。国家卫健委《成人肥胖食养指南（2024 年版）》附录 2 表 2.1，用于核对食物分类及薯芋类可食部口径。 [膳食宝塔](https://dg.cnsoc.org/article/04/RMAbPdrjQ6CGWTwmo62hQ
