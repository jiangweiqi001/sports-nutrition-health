name: 检查指南索引

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 核对正文、目录和搜索页
        run: python3 tools/build-search.py --check
      - name: 复测常见问法与急症、伤痛搜索排序
        run: node tools/check-search.mjs
